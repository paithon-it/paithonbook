# Il registro degli aggiornamenti del libro: una voce per pubblicazione.
#
# È la FONTE. La pagina `book/aggiornamenti.md` la scrive
# `scripts/genera-aggiornamenti.py` da qui, e il numero della voce in cima
# diventa la versione del libro ovunque compaia: la landing, la scheda in cima
# all'indice, l'oggetto del commit di pubblicazione.
#
#     python3 scripts/genera-aggiornamenti.py             # riscrive la pagina
#     python3 scripts/genera-aggiornamenti.py --verifica  # è allineata?
#
# ## Il numero
#
# Tre cifre, `impianto.sezioni.correzioni`:
#
#   la PRIMA  sale quando cambia l'impianto (una parte nuova nell'indice, un
#             riordino che cambia il percorso di lettura, la licenza);
#   la SECONDA quando arriva un capitolo o una sezione;
#   la TERZA  quando si corregge o si rifinisce quello che c'è già.
#
# Chi sale azzera le cifre alla sua destra. Se una pubblicazione porta sia
# sezioni nuove sia correzioni, sale la seconda e la terza torna a zero: il
# numero dice la cosa più grossa che è successa, l'elenco dice tutto il resto.
#
# ## Una versione è una pubblicazione
#
# Non un commit e non un push. Qui dentro si lavora tutti i giorni e si
# committa a metà lavoro; il libro pubblicato cambia quando lo si pubblica con
# `strumenti/pubblica.py`, ed è quello il momento in cui si aggiunge una voce
# qui sopra e si rigenera la pagina.
#
# ## Una voce pubblicata si corregge
#
# Se una voce dice una cosa sbagliata la si riscrive dov'è, anche se è già
# uscita: **quello che si legge deve essere giusto, sempre**, e un registro che
# conserva un errore per rispetto della propria storia sta servendo se stesso
# invece del lettore. Quello che non si riscrive è il numero: la correzione che
# va online è una pubblicazione, quindi una versione nuova, con la sua voce.
#
# ## Una voce
#
#   tipo    nuovo | ampliato | corretto | impianto
#   pagina  il file, com'è scritto nel `_toc.yml` (facoltativo: una voce può
#           riguardare tutto il libro). Il titolo del link NON si scrive qui,
#           lo prende il generatore dal `_toc.yml`: così non può divergere.
#   testo   una o due frasi su che cosa è cambiato, non su che cosa c'è
#           scritto nella pagina. Chi legge questa pagina vuole sapere se gli
#           conviene tornare a leggere.

versioni:

- versione: "1.10.2"
  data: 2026-08-22
  voci:

  - tipo: corretto
    pagina: prefazione.md
    testo: >
      **La prefazione si legge più svelta.** Il racconto dei pappagalli
      stocastici arriva prima al punto, e il triangolo impossibile dice quello
      che deve in un terzo dello spazio: ogni angolo regge da solo, il giro
      no, ed è il modo in cui una macchina sbaglia su una materia tecnica.

  - tipo: corretto
    testo: >
      **Gli strumenti che il libro nomina hanno la loro fonte.** PyTorch,
      TensorFlow, Keras e Hugging Face si trovano ora in bibliografia con
      l'articolo di chi li ha fatti e l'indirizzo per approfondire.

- versione: "1.10.1"
  data: 2026-08-22
  voci:

  - tipo: corretto
    testo: >
      **I due livelli raccontano la stessa struttura, in tutto il libro.** Una
      rilettura di tutte le coppie di schede ha rimesso nella scena del livello
      elementare le mosse che stavano soltanto in quello superiore: la
      condizione che fa valere una garanzia, il caso in cui un metodo si rompe,
      il conto che il testo commenta. Dove l'esempio illustrava il risultato
      senza rifare i passaggi, adesso li rifà.

  - tipo: corretto
    testo: >
      **Errori di merito, trovati rieseguendo i conti.** Il Davies-Bouldin si
      minimizza, e stava in fila con due indici che si massimizzano; la
      perplessità scende quando la frase diventa più prevedibile, non sale; la
      proiezione di un vettore su un altro non è il prodotto scalare; per una
      convoluzione il costo per pixel è esattamente il numero dei pesi; e il
      `top_p` sceglie quanta parte della classifica resta in gara, non quanti
      candidati.

  - tipo: corretto
    testo: >
      **Ipotesi che mancavano accanto alle formule.** Una mistura di due
      gaussiane fa due gobbe solo se i centri distano più di due deviazioni
      standard; la simmetria di Shapley chiede meno di quanto il testo
      dichiarasse; nelle reti su grafo l'equivarianza vuole anche
      l'indipendenza dall'ordine dei vicini, non i soli pesi condivisi; e la
      catena degli errori di un modello linguistico presuppone che ogni passo
      rischi quanto gli altri.

  - tipo: corretto
    pagina: AIResponsabile/overview.md
    testo: >
      **Il paradosso dell'equità si legge per intero anche al primo livello.**
      Nel caso COMPAS le due parti avevano ragione tutte e due, e il conflitto
      nasce dalle frequenze diverse nei due gruppi: nessun programma scritto
      meglio le mette d'accordo. La scena del tribunale adesso arriva fin lì,
      invece di fermarsi al primo conto.

  - tipo: corretto
    pagina: Audio/generazione-audio.md
    testo: >
      **Un capoverso che si leggeva come codice torna a essere prosa.** In
      generazione audio la riga che chiude la figura si era attaccata al
      paragrafo successivo, e il pezzo su Jukebox e AudioLM finiva impaginato
      come un blocco di programma. E in ricerca ad albero un titolo di sezione
      era di un livello più basso degli altri due della pagina.

  - tipo: corretto
    testo: >
      **Una lettera, un mestiere.** Decine di simboli che ne facevano due nella
      stessa pagina sono stati rinominati: la sequenza di token e il vettore
      continuo da cui nasce, la latenza e la durata, il modello bozza e
      l'intero quantizzato, la precisione e la probabilità.

- versione: "1.10.0"
  data: 2026-08-20
  voci:

  - tipo: nuovo
    pagina: MachineLearning/svm-kernel.md
    testo: >
      **Il kernel trick ha la sua pagina.** La Support Vector Machine, che era
      la pagina più lunga del libro, si è spezzata alla cucitura naturale: di
      qua il margine massimo con la strada più larga percorsa passo per passo,
      di là il kernel trick con la regressione, il riconoscere le anomalie e
      la pratica con scikit-learn. Due sedute invece di una maratona.

  - tipo: nuovo
    pagina: DeepReinforcementLearning/mcts-alphago.md
    testo: >
      **La ricerca ad albero Monte Carlo, AlphaGo e l'allineamento dei modelli
      linguistici** si leggono ora in una pagina propria, staccata dal
      gradiente di policy, che si ferma a PPO e chiude con i suoi riquadri.
      Il pensare prima di muovere comincia dove finisce l'istinto, e adesso
      anche l'indice lo dice.

  - tipo: nuovo
    pagina: NaturalLanguageProcessing/oltre-il-bpe.md
    testo: >
      **Oltre il BPE.** WordPiece, SentencePiece e i byte hanno la loro
      pagina, con le quattro conseguenze che si incontrano davvero lavorando
      (i numeri spezzati male, l'italiano che costa più token, lo spazio di
      troppo, il vocabolario congelato). Il BPE resta di qua, con l'esempio
      svolto e le trenta righe di Python.

  - tipo: ampliato
    pagina: Python/basi.md
    testo: >
      **Il traceback e il paracadute.** Le basi di Python insegnano a leggere
      un errore (dal fondo, il che cosa; risalendo, il dove) e a mettere
      `try`/`except` attorno alla riga fragile, con l'except stretto e lo
      stile che chiede scusa invece di chiedere permesso. Era il buco più
      grosso del capitolo, e il primo in cui un lettore inciampa da solo.

  - tipo: ampliato
    testo: >
      **Cinque disegni nuovi.** I ritagli gemelli dell'apprendimento
      contrastivo, lo spettrogramma a tessere dell'AST col colpo che guarda la
      sua eco, la parte coperta di wav2vec col test a risposta multipla, il
      giro codec-Transformer-decoder della generazione a token; e AlexNet è
      ridisegnata com'era davvero: due tronchi, uno per GPU, che si parlano
      soltanto agli incroci.

- versione: "1.9.4"
  data: 2026-08-20
  voci:

  - tipo: ampliato
    pagina: DeepReinforcementLearning/dqn.md
    testo: >
      **Il quaderno degli appunti ha imparato a ripassare ciò che sorprende.**
      Le due migliorie di DQN che mancavano hanno la loro sezione: il replay
      con priorità, che pesca più spesso le esperienze su cui la rete ha
      sbagliato di più (contando un po' meno i ripassi pescati apposta, per
      non farsi un'idea storta), e la rete a due rami, che giudica la
      situazione separatamente dalle mosse e impara anche dove le mosse non
      contano. Con le formule, le fonti, e la riga su Rainbow che le mette
      insieme.

  - tipo: ampliato
    pagina: prefazione.md
    testo: >
      **Il triangolo impossibile adesso si vede.** La prefazione chiede di
      guardare il segno del libro un angolo alla volta, coprendo il resto con
      una mano; accanto a quel passaggio ora c'è il disegno grande, gli stessi
      tre tracciati del logo, così la mano ha dove posarsi.

  - tipo: corretto
    testo: >
      **Rifiniture di lettura.** Nelle conclusioni ogni capitolo citato è un
      link una volta sola, la prima; e in visione e linguaggio due aperture
      che chiedevano di immaginare la scena adesso ci entrano direttamente.

- versione: "1.9.3"
  data: 2026-08-20
  voci:

  - tipo: corretto
    pagina: prefazione.md
    testo: >
      **La rilettura avversaria è arrivata alle pagine che mancavano**: la
      prefazione, le conclusioni e i capitoli su Python, sulla ricerca e su
      visione e linguaggio. Nella prefazione la riga di Anthropic sulla poesia
      in rima adesso cita il resoconto in cui sta davvero, il teorema di
      Penrose ha le sue due voci in bibliografia (il disegno del 1958 col
      padre, la matematica del 1991), e il giro dei tre rapporti si fa con
      numeri veri.

  - tipo: corretto
    pagina: Conclusioni/overview.md
    testo: >
      **Il ripasso finale fotografa il libro com'è oggi.** Le famiglie
      generative sono cinque come nella mappa del libro, i capitoli nati
      quest'estate sono nominati e linkati, AlphaGo porta al capitolo che lo
      racconta, i due livelli dicono la stessa cosa sugli errori che si
      accumulano in un agente (sbagliare tutti insieme è l'estremo buono, non
      il cattivo), e i riquadri da ricordare stanno prima del congedo, così il
      libro chiude salutando.

  - tipo: corretto
    pagina: Ricerca/esplorare-lo-spazio.md
    testo: >
      **La parità dell'otto-tessere dimostrava il contrario di quel che
      affermava**: se ogni mossa inverte la parità, le disposizioni di parità
      diversa si raggiungono eccome. L'argomento vero ha due interruttori che
      scattano insieme, e ora c'è. IDA* e Monte Carlo Go hanno i nomi di chi
      li ha proposti, Deep Blue il suo punteggio, e la potatura il suo nome
      completo anche per chi legge il livello Elementare.

  - tipo: corretto
    pagina: Python/overview.md
    testo: >
      **Su Ubuntu il primo comando dell'ambiente virtuale si fermava**, e la
      pagina non lo diceva: ora dice del pezzo che manca, di come si esce
      dalla scatola e degli altri gestori che si incontrano nei tutorial. La
      storia dei framework rispetta le date (Theano esisteva prima di
      AlexNet), e la tabella delle vendite adesso la fabbrica la pagina
      stessa, così ogni numero si può rifare.

  - tipo: corretto
    pagina: VisioneLinguaggio/allineare-due-spazi.md
    testo: >
      **I numeri del divario fra i due quartieri si leggono alla precisione
      che il protocollo sostiene**, e il testo dichiara perché; la lettera del
      batch ha smesso di fare due mestieri, i rimandi atterrano sulle sezioni
      che contengono la cosa promessa, e le sedici domandine di SigLIP hanno
      preso il posto di otto interrogazioni, non di quattro.

  - tipo: ampliato
    testo: >
      **Le formule che il testo usava senza averle mai scritte adesso ci
      sono**: l'equazione di Bellman per Q (quella di cui SARSA è il
      campionamento), la rotazione della RoPE e la RMSNorm, l'obiettivo di
      word2vec col negative sampling e la pesatura di GloVe, la derivazione
      del gradiente di policy con la GAE, la riparametrizzazione di SAC con la
      correzione della tanh, la MMR per la ridondanza dei passaggi recuperati
      e il PSI per la deriva, colonne categoriche comprese.

  - tipo: ampliato
    pagina: VisioneArtificiale/detection-segmentazione.md
    testo: >
      **Le ancore dicono in chiaro che il confronto col riquadro vero esiste
      solo in addestramento**, mentre in inferenza la IoU ricompare soltanto
      fra le predizioni, nella pulizia dei doppioni. E la famiglia YOLO ha il
      suo racconto, dalla griglia nuda del 2016 al modello del 2026 che la
      pulizia non la fa più: con cinque righe di codice da provare, e le
      confidenze uscite davvero dal modello.

  - tipo: corretto
    testo: >
      **I numeri commentati escono da blocchi che stanno nelle pagine**: il
      conto del weight decay si stampa da sé, il sorpasso dei banditi arriva
      dove la misura lo mette (passato il novemillesimo tiro), il giudice di
      recensioni stampa i tre decimali che il testo discute, e l'ordine
      ragionato della potatura dichiara quante volte venti ordini a caso lo
      battono: una.

- versione: "1.9.2"
  data: 2026-08-20
  voci:

  - tipo: corretto
    testo: >
      **Il libro sapeva una metafora sola, e cominciava sempre allo stesso
      modo.** Una scheda «Elementare» su cinque apriva con «Immagina di»: presa
      una per una era una buona apertura, ma chi legge di fila incontrava lo
      stesso invito ogni cinque pagine, e a quel punto non è più un gancio, è
      un tizio che si schiarisce la voce. Adesso sono una su dodici, e nessun
      capitolo ne ha più del quindici per cento. Nessuna analogia è stata
      tolta: è cambiato il modo di entrarci, perché entrare nella scena è più
      forte che chiedere il permesso di immaginarla. «Immagina» è rimasto dove
      è il verbo esatto, cioè dove si chiede davvero di figurarsi qualcosa che
      non si può vedere: uno spazio a dodicimila dimensioni, una lingua senza
      alfabeto, sedicimila puntini in un secondo di suono.

  - tipo: corretto
    testo: >
      **E sotto c'era la catena di montaggio.** Tolta la cornice, è venuto
      fuori che la stessa immagine apriva sette spiegazioni in cinque capitoli
      diversi, tre con le stesse identiche parole. Dove regge fino in fondo
      resta (in *GPU* è il filo di tutto il capitolo, e la catena percorsa
      all'indietro è il modo migliore di raccontare come una rete impara dai
      propri errori); dove era solo un modo di dire «una cosa dopo l'altra» ha
      lasciato il posto a un'immagine scelta per quel passaggio: una filiera
      del latte dove il controllo scarta un lotto intero, un autolavaggio a
      tunnel, una fila di specchietti che rimbalza un raggio laser.

- versione: "1.9.1"
  data: 2026-08-20
  voci:

  - tipo: corretto
    testo: >
      **Formule e attribuzioni.** Corretti la risoluzione della trasformata a
      finestra in *Dal suono alle feature*, le dimensioni della matrice
      condivisa della GAT, la perdita del VQ-VAE, il costo del calcolo a
      blocchi di Mamba-2, il reticolo del trasduttore e la penalità di
      gradiente delle GAN.

  - tipo: corretto
    testo: >
      **Numeri rifatti.** La ripartizione dei fallimenti della rete di
      Hopfield, i punteggi dell'Audio Spectrogram Transformer e di V-JEPA 2,
      il MOS di Tacotron 2, l'accuratezza di Hearsay-II e la banda di
      previsione in *Forecasting neurale*, che adesso il codice stampa.

  - tipo: corretto
    testo: >
      **Le due schede tornano a dire la stessa cosa** dove si
      contraddicevano, in *Verosimiglianza esatta*, *Modelli latenti* e
      *Costo del coordinamento*; e l'apertura delle PINN non attribuisce più
      l'idea a un lavoro che il capitolo stesso, due pagine dopo, fa risalire
      al 1994.

  - tipo: ampliato
    testo: >
      **Diciassette voci nuove in bibliografia**, per lavori che il libro
      nominava senza permettere di risalirci: fra gli altri la policy
      iteration di Howard, TRPO, DAgger, DistMult, ComplEx e RotatE.

  - tipo: corretto
    testo: >
      **I rimandi fra capitoli adesso sono link.** Quando il testo cita la
      backpropagation o la sezione sugli ensemble ci si arriva con un dito,
      invece di cercarle nell'indice.

  - tipo: corretto
    testo: >
      **La prosa è più asciutta** in tutti i capitoli: meno grassetti, meno
      contrapposizioni «non è X, è Y», e le schede entrano nella scena invece
      di annunciarla.

- versione: "1.9.0"
  data: 2026-08-19
  voci:

  - tipo: nuovo
    pagina: AutoSupervisione/capire-e-accorciare.md
    testo: >
      **Perché il pre-addestramento funzioni, il libro non lo aveva mai
      spiegato.** Il capitolo sull'auto-supervisione diceva che cos'è, come si
      fabbrica un pretesto e che cosa va storto, e si fermava lì. Questa
      sezione risponde alla domanda che uno studente fa al secondo minuto:
      perché coprire una parola e farla indovinare dovrebbe produrre qualcosa
      che sa di biologia. La risposta che una parte del campo dà è che per
      prevedere bene bisogna accorciare, e per accorciare bisogna aver capito.

      Dentro ci sono la complessità di Kolmogorov e il rasoio di Occam scritto
      in bit, il premio da mezzo milione di euro per chi comprime Wikipedia,
      l'argomento di Ilya Sutskever con il rimpianto che ne è il cuore, le due
      misure che dal 2023 lo mettono alla prova, e l'obiezione che decide
      tutto: chi paga il vocabolario. Si apre con Funes, il personaggio di
      Borges che ricorda ogni cosa e proprio per questo non riesce a pensare.

      C'è un esperimento che sta in una pagina e si può rilanciare (una lingua
      inventata in cui contare le lettere non serve a niente), e una figura
      animata che fa vedere il prezzo di imparare mentre lo si paga.

  - tipo: corretto
    pagina: AutoSupervisione/capire-e-accorciare.md
    testo: >
      **Nove correzioni in una sezione sola.** La più grossa: il 99% che iGPT
      ottiene su CIFAR-10 è la
      rete rifinita per intero, non il sondaggio con la rete congelata, che dà
      96,3%, ed è proprio il numero su cui poggiava il paragrafo dedicato a
      quanto sia misteriosa la separabilità lineare. Poi la verosimiglianza
      scritta senza il condizionamento, cioè la formula di un modello che la
      pagina stessa mostra non guadagnare niente; il passaggio che chiude
      l'argomento di Sutskever, che non c'era; l'apertura di Borges, che
      raccontava tre dettagli assenti dal racconto; e la frase «nessun
      programma scende sotto il fondo», che la pagina si smentiva da sola venti
      righe dopo.

      E una riscrittura di leggibilità, perché il lettore senza basi si fermava
      a metà: il pezzo più difficile stava fuori dalle schede, dove vale per
      tutti.

  - tipo: corretto
    testo: >
      **Tre figure avevano un'etichetta nera al posto del suo colore.** Su
      quella nuova della compressione non era cosmesi: le tre curve si
      distinguono soltanto dal colore, e le tre etichette erano l'unica legenda.

- versione: "1.8.5"
  data: 2026-08-19
  voci:

  - tipo: corretto
    testo: >
      **La finestra della ricerca restava muta quando il testo era già nel
      campo.** Succedeva arrivando da un vecchio collegamento alla pagina dei
      risultati, o tornando indietro col browser su un modulo ripristinato: la
      domanda si vedeva scritta e sotto non c’era niente, finché non si
      ribatteva un tasto. Adesso, appena la finestra si apre, cerca quello che
      trova già scritto.

      La ragione per cui era sfuggita vale la pena di dirla: il libro qui si
      costruisce con una versione del tema più recente di quella con cui il
      sito è pubblicato, e le due caricano l’indice della ricerca in due
      momenti diversi. Il difetto viveva solo nella seconda. Il controllo
      adesso prova tutt’e due.

- versione: "1.8.4"
  data: 2026-08-19
  voci:

  - tipo: impianto
    testo: >
      **La ricerca risponde mentre si scrive.** Prima bisognava battere invio e
      finire su una pagina di risultati a parte; adesso i risultati compaiono a
      ogni tasto, raggruppati per pagina e con il capitolo scritto sopra, e
      portano alla **singola sezione** invece che in cima al file. Si scorrono
      con le frecce e si aprono con invio, senza togliere le mani dalla
      tastiera (la finestra si apre con Ctrl+K, o ⌘K), e le parole cercate
      restano evidenziate sulla pagina in cui si arriva.

      Se c’è un refuso la ricerca lo perdona e lo dichiara: chi scrive
      «trasformer» trova i Transformer sotto un «forse cercavi», invece di
      sentirsi rispondere che il libro non ne parla.

      Un effetto collaterale che si sente: l’indice della ricerca, che è il
      file più pesante del sito, adesso si scarica solo quando la finestra si
      apre. Chi legge e basta non lo paga più.

  - tipo: corretto
    testo: >
      **L’avviso «Nascondi i risultati della ricerca» compariva dove non c’era
      niente da nascondere**, per esempio tornando alla copertina dopo una
      ricerca, o soltanto dopo aver aperto la finestra e averla richiusa senza
      andare da nessuna parte. Adesso esce solo se in quella pagina qualcosa è
      stato davvero evidenziato, e dice quante corrispondenze sono.

      Riparandolo è venuto fuori un difetto più grosso e opposto: sulle
      versioni recenti del tema l’evidenziazione non partiva affatto, quindi
      chi arrivava da una ricerca non vedeva marcata nessuna delle parole che
      aveva cercato. Adesso parte, e sempre allo stesso modo.

- versione: "1.8.3"
  data: 2026-08-19
  voci:

  - tipo: corretto
    pagina: Matematica/analisi-numerica.md
    testo: >
      **La sezione sui due calcolatori prometteva più di quanto si possa
      mantenere.** Diceva che fissando due variabili d’ambiente le macchine
      tornano a stampare le stesse cifre: è vero per la parte di conto che
      passa da quelle due strade, e infatti il residuo dell’aneddoto è tornato
      identico, ma non in generale. I prodotti fra matrici di PyTorch passano
      da un’altra libreria ancora, che quelle variabili non toccano, e una
      terza macchina si è discostata di nuovo nell’ultima cifra. Adesso la
      pagina lo dice, e ne trae la conseguenza pratica: due esecuzioni su
      macchine diverse si confrontano con una tolleranza, non con
      l’uguaglianza.

- versione: "1.8.2"
  data: 2026-08-19
  voci:

  - tipo: corretto
    pagina: Python/overview.md
    testo: >
      **SIMD adesso vuol dire qualcosa.** La sigla compariva quattro volte nel
      libro, sempre nuda, come se fosse noto a tutti che cosa sia: adesso è
      sciolta dove nasce, nel paragrafo che spiega perché NumPy è veloce.
      È una sola istruzione del processore che opera su più numeri insieme,
      tanti quanti ne entrano nei suoi registri.

  - tipo: corretto
    pagina: Matematica/analisi-numerica.md
    testo: >
      **La sezione sui due calcolatori non dà più per noto quello che il
      lettore non ha ancora incontrato.** Nominava SSE2, AVX2 e AVX-512 senza
      dire che cosa sono (sono generazioni di istruzioni vettoriali, e a
      distinguerle è la larghezza dei registri: 128, 256 e 512 bit, cioè due,
      quattro e otto numeri in doppia precisione per volta), e citava PyTorch,
      che nel percorso di lettura arriva tre capitoli dopo, come se fosse già
      stato presentato. Sistemate anche due incoerenze interne: la scheda
      facile contava i numeri per istruzione in singola precisione mentre
      tutto il resto ragiona in doppia, e la chiusura si appoggiava a
      «addestramento» e «accuratezza», che a quel punto del libro non sono
      ancora stati definiti.

- versione: "1.8.1"
  data: 2026-08-19
  voci:

  - tipo: ampliato
    pagina: Matematica/analisi-numerica.md
    testo: >
      **Perché lo stesso programma, su due calcolatori, stampa due numeri
      diversi.** È successo a questo libro: il controllo che riesegue il codice
      delle pagine diceva che andava tutto bene sul computer dell’autore, e la
      prima volta che è girato sui calcolatori di GitHub, in quattro punti i
      numeri non combaciavano. Stesso codice, stesse versioni delle librerie,
      stesso seme. La sezione nuova racconta il perché: in virgola mobile
      l’addizione **non è associativa**, e a decidere in che ordine si somma è
      il **kernel**, cioè la versione della routine che la libreria di calcolo
      sceglie per il processore che si trova sotto. C’è il conto che lo fa
      vedere in tre righe (gli stessi diecimila numeri sommati nei due versi
      danno due totali diversi), la spiegazione di che cos’è un kernel, e le
      due variabili con cui la scelta si fissa quando la riproducibilità serve
      davvero.

  - tipo: corretto
    pagina: Efficienza/meno-pesi.md
    testo: >
      **I numeri di potatura e quantizzazione sono stati rimisurati a kernel
      fissato**, così che chiunque rifaccia il conto ottenga le stesse cifre
      invece di quelle del proprio processore. Cambiano di qualche decimo, e
      con loro le frasi che reggevano: comporre le due leve costa 1,1 punti di
      accuratezza invece di 1,7, e la rete potata di nove pesi su dieci ne
      perde meno di uno invece di poco più di uno. La conclusione non cambia:
      il budget di errore non si spartisce a tavolino.

  - tipo: corretto
    testo: >
      **Il controllo che confronta i numeri stampati con quelli che il codice
      produce adesso gira anche sul libro pubblicato.** Ci girava solo qui: lo
      script non era fra i file che vengono pubblicati, e di là il controllo
      moriva prima di cominciare, senza che nessuno lo vedesse.

- versione: "1.8.0"
  data: 2026-08-18
  voci:

  - tipo: nuovo
    pagina: MachineLearning/curve-al-posto-di-rette.md
    testo: >
      **Come si piega una retta senza che impazzisca ai bordi.** Fin qui, quando
      i dati non stavano su una linea, il libro cambiava famiglia di modelli.
      Questa sezione fa la cosa più ovvia e mai raccontata: tiene la linea e la
      piega. Si apre con un attrezzo da tavolo da disegno, il listello di legno
      con cui si tracciavano gli scafi delle navi, e mostra che la curva del
      legno e quella che la statistica calcola non si somigliano, sono la
      stessa curva. Dentro: perché un polinomio unico ondeggia proprio dove i
      dati sono radi, come le spline aggiungono flessibilità **dove serve**, la
      manopola che va dallo spago al righello di acciaio, e i modelli additivi,
      che sommano una curva per colonna e per questo si possono guardare uno
      per uno.

  - tipo: nuovo
    pagina: MachineLearning/il-bootstrap.md
    testo: >
      **Quanto ci si può credere, a un numero misurato una volta sola.**
      L’accuratezza è dell’ottantasette per cento: sì, ma su quel test. Rifacendo
      la prova quanto verrebbe? Per la media una formula c’è da due secoli; per
      la mediana, per l’accuratezza di un modello, per la differenza fra due
      modelli, no. La sezione racconta il metodo con cui Bradley Efron nel 1979
      ha risposto lo stesso, senza raccogliere un dato in più, e soprattutto
      **dove si rompe**: sul massimo, su dati non indipendenti, e su un campione
      raccolto male, dove restituisce un intervallo stretto attorno al numero
      sbagliato.

  - tipo: nuovo
    pagina: MachineLearning/modelli-generativi.md
    testo: >
      **Classificare descrivendo, invece che tracciando confini.** Un ornitologo
      non ti dice dove finisce una cornacchia e comincia una gazza: ti dice
      com’è fatta ciascuna delle due. È l’altra strada per classificare, e in
      cambio dà una cosa che l’altra non dà: accorgersi di quello che **non
      somiglia a niente di visto**, un gettone fra le monete. La sezione
      costruisce l’analisi discriminante lineare e quadratica e il naive Bayes,
      misura quando conviene la più flessibile e quando no, e mostra il numero
      che riassume tutto: sullo stesso punto assurdo lo stesso modello dice «non
      capita mai» e «sono sicuro al 99,99%».

  - tipo: nuovo
    pagina: MachineLearning/valutare-un-raggruppamento.md
    testo: >
      **Come si giudica un raggruppamento, quando la risposta giusta non
      esiste.** Che Plutone non sia un pianeta lo ha deciso un’alzata di mano:
      le misure erano note a tutti, a mancare era il criterio. La sezione mostra
      il caso in cui il voto automatico più usato **preferisce la risposta
      sbagliata** con un margine confortevole, spiega perché l’indice di Rand
      grezzo può dare 0,9 al puro caso, e chiude su un teorema del 2002: tre
      proprietà che sembrano minime non possono valere tutte e tre insieme, e
      quindi la scelta va dichiarata, perché nessun dato la farà al posto
      nostro.

  - tipo: ampliato
    pagina: MachineLearning/alberi-ensemble.md
    testo: >
      **Il capitolo di machine learning adesso dice che cosa stampa il suo
      codice.** Prima non lo dichiarava da nessuna parte, quindi nessun controllo
      lo eseguiva mai: ventiquattro uscite sono ora confrontate a ogni
      pubblicazione con quello che il codice produce davvero. Il primo giro ha
      trovato due blocchi che misuravano su dati di **un’altra pagina** (una
      foresta che spiegava l’importanza di 64 pixel in un capitolo che parla di
      colonne di una tabella) e un rilevatore di deriva che dichiarava «nessuno
      scostamento» su dati che ne avevano parecchio.

  - tipo: corretto
    testo: >
      **Una revisione a tre letture antagoniste sulle sezioni nuove**, una per
      chi legge il livello facile, una per chi legge quello formale, una che
      esegue il codice e apre le fonti. Fra le cose raddrizzate: la
      dimostrazione di un teorema attribuita all’argomento sbagliato; la
      provenienza del più famoso insieme di dati della statistica, che Fisher
      stesso segnala come non omogenea e che il libro dava per omogenea; un
      esperimento sulla copertura di un intervallo la cui conclusione, misurata
      bene, si rovesciava sulla seconda cifra decimale; e il testo per lettori
      di schermo di un’animazione, che un difetto nel programma che la disegna
      spezzava in tre frammenti e che prometteva una forma che il disegno non
      ha.

- versione: "1.7.0"
  data: 2026-08-18
  voci:

  - tipo: nuovo
    pagina: Efficienza/overview.md
    testo: >
      **Un capitolo su perché il modello che si addestra non è quello che si
      usa.** Addestrare può essere lento quanto vuole, rispondere no: sono due
      mestieri diversi, e quasi sempre si mette in produzione lo stesso identico
      modello. Il capitolo racconta le tre leve per stringerlo (meno bit per
      numero, meno numeri, un modello nuovo e più piccolo che impara dal
      grande) e soprattutto **che cosa costano**, perché è la parte che di
      solito non si dice. Con qualche sorpresa misurata: a quattro bit
      arrotondare e basta non basta affatto, una rete alleggerita del
      novantacinque per cento non gira più veloce sul conto di prima, e il
      grosso di quello che un maestro insegna a un modello piccolo non sono i
      suoi dubbi ma il fatto che possa commentare esempi che nessuno ha
      etichettato.

  - tipo: nuovo
    pagina: Ricerca/overview.md
    testo: >
      **Un capitolo sull’intelligenza artificiale prima dell’apprendimento.**
      Prima che le macchine imparassero dai dati, decidevano immaginando: se
      muovo qui lui risponde là, e allora io potrei. Il capitolo parte da un
      automa a ingranaggi del 1912 che giocava a scacchi senza pensare, mostra
      perché l’albero dei futuri esploda oltre ogni possibilità fisica, e
      racconta le due idee che lo rendono percorribile lo stesso: una stima di
      quanto manca, e l’accorgersi che certi rami non vanno guardati affatto.
      Finisce sulle tre cose che tutto questo dava per scontate e che nel mondo
      vero spesso non ci sono: è da lì che comincia l’apprendimento per
      rinforzo.

  - tipo: nuovo
    pagina: ModelliLatenti/overview.md
    testo: >
      **Un capitolo su come si spiegano i dati con una causa che non si vede.**
      È l’idea che il libro usava già in quattro punti senza averla mai
      derivata: comprimere in poche cifre e ricostruire, e scoprire che fra una
      cifra e l’altra ci sono buchi in cui il modello non è mai stato. Il
      capitolo deriva il rimedio (chiedere al modello non un punto ma una
      nuvola, e quanto costa descriverla) e mostra dove quel latente stava già
      lavorando: nei codec audio, nel deep reinforcement learning, nella
      diffusione, nei world model.

  - tipo: ampliato
    testo: >
      **Tre capitoli inseriti in mezzo hanno cambiato i numeri di tutti gli
      altri**, e con essi i rimandi. Le pagine che promettevano «il capitolo
      seguente» parlando di qualcos’altro sono state riscritte col nome del
      capitolo, che è la forma che non invecchia. Dove il libro spiegava la
      stessa cosa due volte (la quantizzazione in MLOps, la potatura fra tre
      capitoli, il biglietto della lotteria) adesso c’è una spiegazione sola e
      gli altri la richiamano.

  - tipo: corretto
    testo: >
      **Una revisione a nove letture antagoniste sui capitoli nuovi**, ed è la
      parte che vale la pena leggere se si è già letto qualcosa. Fra le cose
      raddrizzate: la spiegazione facile della ricerca A* descriveva in realtà
      un altro algoritmo, meno buono; un conto sull’efficienza contava la metà
      di quello del capitolo sulla GPU pur dichiarando di essere lo stesso; un
      miglioramento attribuito alla potatura era in realtà il riavvio
      dell’ottimizzatore; e una frase su A*, ripresa da un manuale molto
      citato, era imprecisa nel manuale stesso.

- versione: "1.6.3"
  data: 2026-08-17
  voci:

  - tipo: corretto
    testo: >
      **Due spiegazioni facili insegnavano il contrario di quello che succede.**
      Nel capitolo sull'auto-supervisione, la pagina dice che il guasto da
      evitare è descrivere tutte le fotografie allo stesso modo, e poi
      raccontava che a impedirlo è la richiesta di non ripetersi. È il
      contrario: quel guasto lo ferma l'altra richiesta, quella che due ritagli
      della stessa foto diano la stessa scheda, e la pagina non diceva la cosa
      da cui dipende tutto, cioè che una casella che scrive sempre lo stesso
      numero viene messa da parte prima del confronto. Nei modelli a energia,
      la descrizione «locale» del paesaggio era data per completa a meno
      dell'altezza complessiva: su un paesaggio a due valli separate se ne
      perde una per ogni valle, ed è per questo che quei metodi sbagliano le
      proporzioni fra gruppi di dati distinti. Corrette tutte e due, e anche i
      riquadri finali che le ripetevano.

  - tipo: corretto
    testo: >
      **Diciotto punti in cui la spiegazione facile e quella formale non
      raccontavano lo stesso oggetto.** Il passo di tempo dei modelli a spazio
      di stato era presentato come la finezza di un campionamento, «con più
      lavoro» se piccolo, mentre è la manopola che decide quanto in fretta il
      sistema dimentica, e stringerla non costa niente. La divisione che
      protegge l'attenzione dal saturare non aveva nessuna controparte
      concreta, e con essa spariva un modo in cui l'attenzione si guasta.
      «Attenzione lineare» sembrava voler dire «più veloce sempre», mentre sotto
      qualche migliaio di parole il metodo classico vince ancora. E poi: i
      lucidi di LoRA adattano ma non insegnano, il metodo diretto di
      allineamento e quello classico non finiscono nello stesso punto, e la
      verosimiglianza «esatta» di un flusso è esatta su dati leggermente
      sporcati, non sul file vero.

  - tipo: corretto
    pagina: prefazione.md
    testo: >
      **La chiusa torna a legarsi a quello che la precede.** Le ultime due frasi
      erano rimaste affiancate senza il ponte che le teneva, e il «Perché» finale
      restava sospeso. Rimesso il nesso, e riportato il paragrafo sul triangolo
      impossibile alla lunghezza giusta: dice ancora che l'impossibilità è un
      teorema e che i tre pezzi sono isomorfismi perfetti che non si compongono,
      in un terzo dello spazio e senza più separare due frasi che si tenevano.


- versione: "1.6.2"
  data: 2026-08-17
  voci:

  - tipo: ampliato
    pagina: prefazione.md
    testo: >
      **Perché il segno di questo libro è un triangolo impossibile.** La
      prefazione lo mostrava senza dirlo. Adesso aggiunge la ragione, in un
      paragrafo: quell'impossibilità non è un inganno dell'occhio, è un
      teorema, e dice una cosa che vale per chi rilegge un libro tecnico. I tre
      pezzi della figura sono tutti e tre perfetti, corrispondono a oggetti
      veri, e il guasto non è in nessuno dei tre: è che non si compongono.
      L'errore non ha un luogo.

  - tipo: corretto
    testo: >
      **Le ultime formule della prima metà, e cinque numeri che dicevano il
      falso.** La spiegazione facile della precisione media definiva un
      punteggio che a un rilevatore quasi cieco avrebbe dato il massimo invece
      del minimo; la colpa ripartita all'indietro in una rete era data come
      «due terzi e un terzo» quando quella ripartizione non c'è; e i tre numeri
      di un confronto fra inizializzazioni venivano da due esperimenti diversi.
      Rifatti i conti, e corretti.


- versione: "1.6.1"
  data: 2026-08-17
  voci:

  - tipo: corretto
    testo: >
      **Adesso ogni capitolo saluta, invece di finire dentro un elenco
      puntato.** Trentaquattro capitoli su trentasei si chiudevano sull'ultima
      riga del riquadro «Da ricordare»: chi arrivava in fondo trovava tre punti
      elenco e la pagina che finiva. Ora ognuno ha due o tre righe che dicono
      che cosa ci si porta dietro e a che cosa serve nel capitolo dopo, che è
      nominato per nome. È il genere di difetto che non si vede leggendo un
      capitolo da solo: si vede solo leggendo di fila.

  - tipo: corretto
    testo: >
      **Tutte le formule del libro sono state rifatte a mano, e i conti
      tornano.** Quattrocento e passa blocchi di formule, letti insieme al
      paragrafo che li commenta, con le verifiche rifatte in Python invece che
      a occhio: nessuna formula sbagliata. Sono venuti fuori i difetti
      *attorno* alle formule, che sono quelli che fanno inciampare chi legge:
      simboli usati senza essere mai presentati, la stessa lettera per due cose
      diverse nello stesso capitolo, e una F1 di esempio calcolata prendendo un
      numero da una tabella e l'altro da un'altra.

  - tipo: corretto
    testo: >
      **Dove la spiegazione facile prometteva più di quella difficile.** Il
      libro spiega ogni cosa due volte, e le due spiegazioni devono essere lo
      stesso oggetto con altri nomi: chi si costruisce l'intuizione sulla
      versione elementare non deve **disimparare** niente aprendo l'altra. In
      quattro punti non era così, e l'elementare affermava come certo ciò che
      la versione formale smentiva dieci righe più sotto (la discesa del
      gradiente che «converge da qualsiasi punto», il passo di apprendimento
      del percettrone che «assesta gradualmente»). Riscritti.

  - tipo: nuovo
    pagina: Audio/generazione-audio.md
    testo: >
      **Una figura animata per capire perché uno spartito costa poco e pesa
      molto.** La battuta scorre come su un rullo di pianola, e sotto crescono
      le due file di simboli: quella a griglia si allunga a ogni sedicesimo
      anche quando non succede niente, quella a eventi resta ferma e poi salta.
      È il compromesso di tutta la sezione, visto invece che descritto.

  - tipo: corretto
    testo: >
      **Le aperture di alcuni capitoli, e un quadro di Magritte.** Visione e
      linguaggio apriva con lo stesso aneddoto del 1966 con cui apre Visione
      artificiale, cioè con una ripetizione. Adesso apre con la pipa dipinta da
      Magritte nel 1929 e la scritta «questa non è una pipa», che è la stessa
      domanda del capitolo: il disegno non è la cosa, la parola non è il
      disegno, e la macchina deve attraversare quel doppio confine.


- versione: "1.6.0"
  data: 2026-08-16
  voci:

  - tipo: nuovo
    pagina: AutoSupervisione/overview.md
    testo: >
      **Un capitolo su come si impara senza che nessuno corregga.** Quasi tutto
      quello che una macchina sa oggi lo ha imparato da dati che nessuno aveva
      etichettato: il segnale era già dentro i dati, bastava nascondere un pezzo
      e chiedere di indovinarlo. Il capitolo racconta i quattro modi di
      fabbricare quel segnale, il guasto che li minaccia tutti (la scorciatoia
      di rispondere sempre la stessa cosa, che è la risposta perfetta a una
      domanda mal posta) e i modi di impedirlo. In fondo, il dibattito aperto:
      quanto conta davvero il rinforzo, se il grosso lo ha già fatto qualcun
      altro.

  - tipo: nuovo
    pagina: VerosimiglianzaEsatta/overview.md
    testo: >
      **Un capitolo sui modelli che sanno dire quanto è probabile quello che
      vedono.** Un generatore di immagini fabbrica figure ma non sa dirti quanto
      una figura sia verosimile; questa famiglia sì, e lo dice con un numero.
      Come ci riesce (un pixel alla volta, oppure deformando una nuvola di punti
      con trasformazioni che si sanno invertire), quanto costa, e la sorpresa
      che ha messo in crisi tutti: modelli addestrati su cani danno probabilità
      più alta a fotografie di numeri civici. La ragione è geometrica, e spiega
      perché «probabile» non vuol dire «tipico».

  - tipo: nuovo
    pagina: WorldModels/inferenza-attiva.md
    testo: >
      **E se la ricompensa non fosse il punto di partenza?** Una sezione
      sull'idea che agire e capire siano lo stesso gesto: un agente che si
      muove per ridurre la propria sorpresa cerca informazione dove non ne ha,
      senza che nessuno gli abbia scritto un premio per farlo. È un'alternativa
      di principio al rinforzo, con una sorpresa nel finale: il termine che
      trattiene un modello di linguaggio vicino a quello di partenza, durante
      l'allineamento, è formalmente lo stesso.

  - tipo: ampliato
    pagina: GAN/applicazioni-evoluzioni.md
    testo: >
      **Sotto il cofano di StyleGAN, e il pezzo che manca a metà dei generatori
      di oggi.** Come si separa lo stile dal contenuto in un volto sintetico, e
      perché una goccia comparsa in tutte le immagini restò senza spiegazione
      per un anno. Poi la quantizzazione delle immagini in un vocabolario di
      simboli, che è la cerniera fra i generatori di immagini e i modelli di
      linguaggio.

  - tipo: ampliato
    pagina: Audio/generazione-audio.md
    testo: >
      **Generare lo spartito invece del suono.** Un minuto di musica scritta
      come note e durate sta in venti kilobyte; lo stesso minuto registrato ne
      occupa trenta megabyte. Che cosa si guadagna e che cosa si perde a
      generare il primo invece del secondo, e perché la scelta di come si
      scrivono le note decide se la macchina saprà tenere il tempo.

  - tipo: corretto
    testo: >
      **Il libro è stato riletto da capo con l'idea di metterlo in difficoltà**,
      pagina per pagina, su tutto quello che è arrivato con l'ultima
      pubblicazione: un lettore che non sa niente di intelligenza artificiale,
      uno studente che contesta le formule, e uno che apre le fonti una per una.
      Sono venuti fuori più di cento difetti, e i peggiori erano numeri: un
      rapporto sbagliato di cento volte, una memoria dichiarata otto volte più
      grande del vero, un fattore invertito in una formula spiegata due volte
      (giusta nella versione difficile, rovesciata in quella facile). Corretti
      tutti, con la prova accanto.

  - tipo: corretto
    testo: >
      **Su quasi ogni pagina c'erano mille apostrofi sbagliati, e nessuno li
      vedeva.** «Un po' meno» usciva stampato come «un po” meno», con una
      virgoletta doppia al posto dell'apostrofo, perché il programma che
      compone il testo, in italiano, interpretava così ogni apostrofo a fine
      parola. Il sorgente era giusto, il difetto nasceva nella composizione:
      1086 occorrenze, riparate.

  - tipo: corretto
    testo: >
      **Le aperture e i congedi.** Il capitolo di matematica cominciava con
      quarantasette righe di definizioni, e la frase di Galileo in cima non era
      di Galileo ma una parafrasi da manuale: adesso c'è il passo vero del
      *Saggiatore*, e ad aprire è von Neumann che consiglia a Shannon di
      chiamarla entropia «perché nessuno sa davvero cosa sia». Il capitolo sugli
      agenti diceva che un modello di linguaggio è passivo e non può agire, una
      pagina dopo averne mostrato uno che comanda un braccio robotico. E dove un
      capitolo finiva dentro un elenco puntato, adesso c'è una frase che
      consegna il passaggio a quello dopo.


- versione: "1.5.8"
  data: 2026-08-15
  voci:

  - tipo: ampliato
    pagina: Introduzione/overview.md
    testo: >
      **I dati non sono un giacimento, sono uno scarto, e adesso il libro lo
      dice.** Nessuno si alza la mattina per produrre dati: li lascia dietro di
      sé mentre fa altro. C'è un precedente, ed è successo su scala planetaria:
      l'ossigeno che respiriamo è il rifiuto di certi batteri che forse tre
      miliardi di anni fa cominciarono a spezzare l'acqua con la luce del sole,
      e che per centinaia di milioni di anni non cambiò l'aria di niente. La
      vita che se ne nutre è arrivata molto dopo. Siamo noi. I dati stanno alle
      macchine come l'ossigeno sta a noi, e l'analogia tiene anche dalla parte
      scomoda: quello scarto, prima di diventare respiro, fu un veleno.

  - tipo: nuovo
    pagina: Conclusioni/overview.md
    testo: >
      **«È più intelligente di noi?» è una domanda a cui manca il dove.** Una
      sezione nuova sostiene che una macchina non è migliore di noi in senso
      assoluto, ma nel mondo digitale sì, e che quel vantaggio non viene
      dall'intelligenza: viene dal terreno. Là dentro tutto è già un numero,
      ogni azione costa niente e si ripete un miliardo di volte, ogni partita
      finita lascia scritto chi ha vinto. È una partita in casa. La consolazione
      («a noi resta il mondo reale») regge solo a metà, perché il campo si
      allarga da sé. Quello che resta nostro non è un territorio, che si può
      perdere, ma due cose che nessuna quantità di dati sposta: rispondere di
      una scelta, e decidere quale partita giocare.

  - tipo: corretto
    testo: >
      **Il libro dice di sé una cosa sola, e la dice dappertutto uguale.** La
      copertina del PDF, l'anteprima che compare condividendo un link e il
      titolo delle pagine portavano tre versioni diverse della stessa frase, e
      per un po’ ne hanno portate perfino due in fila, che finivano tutte e due
      su «due volte» e sembravano un'eco. Adesso è una riga sola. E dalla home
      il libro si può aprire nel browser, oltre che scaricare.


- versione: "1.5.7"
  data: 2026-08-15
  voci:

  - tipo: ampliato
    testo: >
      **Il libro si legge anche nel browser, senza scaricarlo, e ha un
      indirizzo che non cambia.** Accanto al pulsante che scarica il PDF ce
      n'è un secondo che lo apre e basta, pagina per pagina. Quel collegamento
      è il DOI del libro, cioè il suo identificativo permanente: porta sempre
      all'ultima versione depositata e dà la scheda già pronta per chi deve
      citarlo in una bibliografia.

  - tipo: corretto
    testo: >
      **La copertina del PDF diceva come è fatto il libro senza dire che libro
      è.** Portava soltanto la postilla, «l'AI che spiega se stessa… due
      volte», e chi apriva il file trovava il nome e nient'altro. Adesso c'è
      anche la riga che dice che cos'è, la stessa che si legge sulla home e
      nell'anteprima che compare condividendo il link: le tre superfici
      dicevano tre cose diverse, ciascuna vera per conto suo.


- versione: "1.5.6"
  data: 2026-08-15
  voci:

  - tipo: corretto
    testo: >
      **Il libro si chiama Paithon Book, con le iniziali maiuscole.** Fin qui
      il nome si scriveva tutto minuscolo, e dentro una frase si leggeva come
      un refuso invece che come un titolo. Il logo resta minuscolo, perché è un
      disegno e compone il segno della marca: è la convenzione normale dei
      marchi in minuscolo, dove il segno resta com'è e la prosa scrive il nome
      in tondo.

  - tipo: corretto
    testo: >
      **Il logo del libro ha il triangolo al posto della «a».** Il sito aveva
      già smesso di mettere il bollo accanto alla parola, perché ripeteva lo
      stesso segno, e la «a» lo incorpora: il libro era rimasto alla versione
      di prima. Ne è uscito anche un guasto che nessuno avrebbe visto: il logo
      stampato sulla copertina del PDF era un file fatto a mano una volta, che
      nessuno rigenerava, e sarebbe rimasto quello vecchio per sempre senza
      dare alcun errore.

  - tipo: corretto
    testo: >
      **Il colophon del PDF diceva che il copyright è di paithon.it**, che però
      è un dominio e non una persona: i diritti d'autore un dominio non può
      averli, e in una contestazione la titolarità la prova chi la rivendica.
      Adesso è intestato a Francesco Messina. E la licenza del codice degli
      esempi ha un nome scritto per esteso, Apache License 2.0, invece di un
      rinvio a un file da cercare su GitHub.


- versione: "1.5.5"
  data: 2026-08-15
  voci:

  - tipo: corretto
    testo: >
      **Tre didascalie di figura rompevano un collegamento nel PDF.**
      Contenevano una citazione, e nella versione a stampa quel richiamo
      spezzava il rimando alla bibliografia: la didascalia si leggeva bene, ma
      il collegamento non portava da nessuna parte, ed è il motivo per cui
      nessuno se n'era accorto. Le citazioni sono passate nel corpo del testo.
      Su una delle tre il testo ci ha guadagnato: adesso dice chi fabbricò
      quei quattro insiemi di dati, e quando.


- versione: "1.5.4"
  data: 2026-08-15
  voci:

  - tipo: corretto
    testo: >
      **La rilettura per la leggerezza è arrivata in fondo: tutti e trentatré
      i capitoli.** Gli ultimi undici sono i più tecnici del libro, e sono
      quelli in cui il difetto ricorrente pesava di più: una pagina prometteva
      «il conto si rifà in due righe» e consegnava un esperimento al computer,
      pieno per giunta di parole mai dette a chi legge il percorso semplice.
      Adesso quel conto si fa su un foglio. Il lettore di tredici anni che ha
      riletto tutto ha anche corretto la matematica di chi gliela stava
      spiegando, almeno una volta.

  - tipo: ampliato
    pagina: prefazione.md
    testo: >
      **La prefazione dice perché il libro esiste adesso**, e non solo perché
      esisteva nel 2019. Con l'intelligenza artificiale usata da tutti, e con
      gli interessi che le si sono mossi attorno, i «pappagalli stocastici»
      siamo diventati noi: la stessa frase ripetuta per settimane da chi alla
      fonte non è mai andato, e il modello scaricato e messo in produzione
      perché lo stavano facendo tutti, spesso senza che nessuno aprisse la
      licenza. Chi quell'espressione l'ha coniata, cinque anni dopo, osserva
      la stessa cosa: «la frase ha superato il paper».

  - tipo: corretto
    testo: >
      **Ogni correzione è stata poi messa in dubbio da chi doveva smentirla**,
      e la cosa è servita più del previsto: quasi tutte le smentite fondate
      riguardavano difetti che la correzione stessa aveva introdotto. Alcuni
      esempi finiti nel libro sbagliati e ora sistemati: l'anno in cui si
      scoprì l'inganno del cavallo che sembrava saper contare (1904, e il 1907
      è solo l'anno del libro che lo racconta), il meccanismo con cui negli
      anni Settanta si telefonava gratis con un fischietto, e l'ipotesi di un
      teorema sull'equità, dichiarata verificata da chi il paper non lo aveva
      aperto.

  - tipo: corretto
    testo: >
      **Un numero che il testo commenta adesso lo stampa il codice.** In una
      pagina sulle metriche di servizio due percentuali reggevano un paragrafo
      intero e non comparivano nella tabella che il libro invitava a
      riprodurre; una delle due era per giunta un caso fortunato del
      sorteggio. Riparato aggiungendo la colonna al programma, così quel
      numero non può più scostarsi dal testo.

  - tipo: corretto
    testo: >
      **Due capitoli si contraddicevano fra loro.** Le conclusioni dicevano che
      il costo dell'attenzione supera quello del resto della rete quando il
      contesto si avvicina alla dimensione del modello: succede sei volte più
      in là, e il capitolo sui Transformer lo diceva già con i numeri giusti.


- versione: "1.5.3"
  data: 2026-08-14
  voci:

  - tipo: corretto
    testo: >
      **Altri quindici capitoli sono stati riscritti per essere più leggeri.**
      A leggerli è stato un ragazzo di tredici anni che non aveva mai sentito
      parlare di intelligenza artificiale, e ogni punto in cui si è fermato è
      stato riscritto. In un capitolo si era fermato duecento volte. Le sue
      domande sono quelle che un libro dovrebbe prevenire: «da che parte
      tirare, per andare dove?» sulle GAN, «per me giocare e imparare sono la
      stessa cosa» sul reinforcement learning, «mi fate credere che un numero
      si spezza in due pezzi senza farmi mai vedere come» sull'attenzione
      lineare.

  - tipo: corretto
    testo: >
      **Il libro non manda più a leggere l'altro livello.** Era il difetto più
      diffuso: una pagina del percorso semplice concludeva un ragionamento
      usando qualcosa spiegato solo nella scheda avanzata, che quel lettore per
      definizione non apre. In un capitolo c'era scritto a lettere («il fattore
      otto è quello che il livello Superiore chiama 8× di banda buttata via»),
      in un altro erano quarantasette fra simboli e formule nel testo comune,
      ora zero.

  - tipo: corretto
    testo: >
      **Fatti e numeri: una citazione che gli autori non hanno mai scritto**
      (attribuita agli autori di HyDE), due numeri che non stanno in nessuna
      versione dei paper citati, le operatrici del Voder che erano ventiquattro
      e non venti, e la frase famosa della loro dimostrazione del 1939, che non
      compare né nell'articolo né nel filmato superstite. Più un esperimento
      che il lettore non poteva rifare, perché il protocollo taceva su tre
      dettagli che decidono il risultato.

  - tipo: corretto
    testo: >
      **Alcune figure dicevano il contrario del testo.** In due disegni delle
      GAN la freccia raccontava che è il verdetto a tornare indietro, mentre il
      capitolo spende tre pagine a spiegare che il verdetto non è ciò che
      torna. E un grafico dichiarato in scala logaritmica aveva perso l'asse,
      cioè l'unica cosa che permette di leggerlo.


- versione: "1.5.2"
  data: 2026-08-14
  voci:

  - tipo: corretto
    testo: >
      **Tutti e trentatré i capitoli sono stati riletti da capo**, con il
      codice eseguito davvero e i conti rifatti a mano. Non è una rilettura di
      forma: sono usciti errori di sostanza in quasi ogni capitolo, e i più
      gravi erano affermazioni che il libro smentiva da sé qualche pagina
      dopo. Qualche esempio: il clipping di PPO è asimmetrico e taglia da un
      lato solo, il gradiente della funzione di partizione era annunciato e
      mai derivato, TransE la composizione ce l'ha (a mancargli è un'altra
      cosa), e «PALLA sta in sette frame» è falso, il minimo è sei.

  - tipo: corretto
    testo: >
      **I sette capitoli d'apertura sono stati riscritti per essere più
      leggeri.** Un capitolo può essere tutto vero e restare illeggibile, e
      quelle sono le pagine dove arriva chi non ha basi. A leggerli è stato un
      ragazzo di tredici anni che non aveva mai sentito parlare di
      intelligenza artificiale, e ogni punto in cui si è fermato è stato
      riscritto: il conto con il seno che «non è un conto che posso rifare, è
      un numero da credere», la matrice che «gira e stira lo spazio» dopo un
      esempio che non gira niente, gli alberi che «si trovano a casa» prima
      che il libro dica che cos'è un albero.

  - tipo: corretto
    testo: >
      **Le figure adesso mostrano quello che le didascalie promettono.**
      Erano decine i casi in cui il testo accreditava un disegno di qualcosa
      che non c'era: «quasi tutte le celle sono vuote» di una griglia piena al
      settantadue per cento, «ogni tacca vale dieci volte la precedente» di un
      disegno senza tacche, «le caselle sono numerate a partire da zero» dove
      i numeri non c'erano. In una figura sulle GAN una freccia diceva
      l'esatto contrario di quanto la pagina spiega per tre paragrafi.

  - tipo: ampliato
    testo: >
      **Tre figure nuove**, dove il testo elencava e basta: le quattro mosse
      con cui si amministra la finestra di contesto, le tre forme di una rete
      che impara più compiti insieme, e il righello che traduce l'entropia in
      «quante facce ha il dado equivalente».

  - tipo: corretto
    pagina: AIResponsabile/allineamento-e-governance.md
    testo: >
      L'elenco delle pratiche vietate dall’**AI Act** era rimasto indietro: il
      regolamento europeo del 24 luglio 2026 lo ha allungato, e dal 2 dicembre
      2026 sono vietati anche i sistemi che generano materiale intimo non
      consensuale e materiale di abuso sessuale su minori.

  - tipo: corretto
    testo: >
      **La copertina del PDF non è più mezza pagina vuota**: sotto il titolo
      c'è una conca disegnata con le sue curve di livello e la discesa che ne
      trova il fondo, cioè il gesto che il libro racconta dal capitolo di
      matematica fino all'ultimo. La traiettoria è calcolata, non disegnata a
      occhio.


- versione: "1.5.1"
  data: 2026-08-13
  voci:

  - tipo: corretto
    pagina: Introduzione/overview.md
    testo: >
      L'intelligenza artificiale è entrata nella vita di tutti i giorni **due
      volte**, e la pagina ne faceva un momento solo. Negli anni Dieci ci è
      entrata senza farsi notare, dentro il traduttore automatico, i
      suggerimenti di un negozio online, i volti riconosciuti nelle
      fotografie: la usavano tutti e quasi nessuno la chiamava per nome. Dal
      novembre 2022, con ChatGPT, è diventata qualcosa con cui si parla
      apposta. Tenerli separati serve a dire la cosa che conta: il salto che si
      è percepito alla fine del 2022 era cominciato cinque anni prima, e a
      cambiare non è stato il motore ma il posto in cui l'abbiamo trovato.

  - tipo: corretto
    pagina: Introduzione/overview.md
    testo: >
      Le due lunghe pause dell'AI si chiamano **inverni**, che è il termine del
      campo e quello che il libro usa già nel capitolo sulle reti neurali. La
      pagina le chiamava «gelate»: due parole diverse per la stessa cosa, in
      due capitoli che si richiamano, sono un inciampo per chi legge.

- versione: "1.5.0"
  data: 2026-08-13
  voci:

  - tipo: nuovo
    testo: >
      Il libro si scarica in **PDF**, tutto in un file solo. Non è la stampa
      delle pagine web: è un secondo formato, impaginato come un libro, con
      l'indice, i numeri di pagina, le aperture di capitolo e i due livelli di
      lettura che si riconoscono dal riquadro. Il collegamento è qui nella
      pagina di apertura, sotto il numero di versione, e punta sempre
      all'ultima edizione.

  - tipo: nuovo
    testo: >
      Dove il libro online muove una figura, il PDF mostra **tre fermi
      immagine** (l'inizio, il mezzo e la fine) e l'indirizzo della pagina in
      cui quella figura si muove davvero. Vale per tutte e trentacinque le
      animazioni: tre fotogrammi non sono un'animazione, ma dicono che c'era un
      prima e un dopo, che è quello che un fermo immagine solo perde.

  - tipo: ampliato
    pagina: prefazione.md
    testo: >
      La Prefazione dice adesso **come** il libro è scritto, perché riguarda
      chi legge: buona parte di queste pagine nasce lavorando con
      l'intelligenza artificiale, e quello che resta è ciò che l'autore ha
      verificato e riscritto. Da qui il sottotesto, «l'AI che spiega se
      stessa... due volte», dove «due volte» vale in tutti e due i sensi: i
      due livelli di lettura, e la strada che il testo fa per arrivare in
      pagina. Quello che una AI scrive lo rilegge un'altra AI, che alla
      stesura non ha partecipato e ha un compito solo, cercare l'errore; poi
      il testo passa dall'autore, ed è quel passaggio a decidere che cosa
      resta. La pagina dice anche su che cosa il libro scommette: che versione
      dopo versione le correzioni diventino rare, e poi rarissime.

  - tipo: impianto
    pagina: prefazione.md
    testo: >
      La **Prefazione** esce da «Fondamenta» e apre il libro per conto suo,
      dentro una parte nuova dell'indice, «Prima di cominciare». Una prefazione
      non è un capitolo di fondamenta: viene prima di tutto, e nel libro
      stampato si vedeva ancora meglio che online.

  - tipo: corretto
    pagina: Matematica/algebra-lineare.md
    testo: >
      Più di metà delle figure del libro (185 su 312) non usava i caratteri del
      progetto: li chiedeva in modo generico, e ogni lettore se le vedeva
      disegnate con il carattere del proprio sistema, diverso su Windows, su Mac
      e su Linux. Adesso le etichette delle figure sono le stesse per tutti, e
      restano le stesse per tutti.

  - tipo: corretto
    pagina: NaturalLanguageProcessing/modelli-ngram.md
    testo: >
      Quattro formule erano scritte in un modo che il browser perdona e la
      stampa no: tre sistemi di equazioni annidati male e una formula spezzata a
      metà da un a capo. Online si vedevano lo stesso; qui si vedono giuste in
      tutti e due i formati.

- versione: "1.4.2"
  data: 2026-08-13
  voci:

  - tipo: ampliato
    pagina: MachineLearning/svm.md
    testo: >
      La Support Vector Machine adesso si dimostra invece di enunciarsi. La
      pagina diceva quanto è largo il corridoio fra le due classi, e diceva che
      nella seconda forma del problema gli esempi compaiono soltanto a coppie,
      ma non ricavava né l'una né l'altra cosa: e la seconda è quella su cui
      poggia il kernel trick, cioè metà del capitolo. C'è una sezione nuova che
      percorre la derivazione per intero, in cinque passi e su tutti e due i
      livelli, seguendo la strada che Patrick Winston chiamava «l'approccio
      della strada più larga» nella sedicesima lezione del corso 6.034 del MIT:
      la regola per decidere da che parte sta un punto, i due vincoli che
      diventano uno, la larghezza della strada come ombra di una freccia
      obliqua, i moltiplicatori di Lagrange, e la sostituzione finale da cui
      salta fuori che i dati entrano nel conto solo attraverso quanto si
      «vedono» a due a due. Una figura nuova mostra il passaggio che il testo
      raccontava a parole.

  - tipo: ampliato
    pagina: MachineLearning/svm.md
    testo: >
      Nella derivazione ci sono due pause caffè, e stanno dove le faceva
      Winston: nei due punti in cui il conto ha un salto che nessuna riga di
      algebra spiega. Alla prima dice alla classe di essere sicuro che, arrivato
      lì, anche Vapnik fosse uscito a prendere un caffè; alla seconda aggiunge
      che quelle pause durano mesi. La sezione si chiude dicendo quanto sono
      durate davvero: il kernel Vapnik ce l'aveva già nella tesi degli anni
      Sessanta, e capì che era importante trent'anni dopo.

- versione: "1.4.1"
  data: 2026-08-13
  voci:

  - tipo: ampliato
    testo: >
      Sei figure animate nuove, nei capitoli che non ne avevano nessuna. Si
      anima solo dove il tempo è il contenuto, cioè dove una figura ferma perde
      davvero qualcosa: il ciclo di addestramento che si ripete mentre la loss
      scende, i due modi in cui il DQN rompe una correlazione (la memoria che
      pesca a caso, la copia congelata che resta indietro e poi scatta), la
      ricorrenza che si svolge a raddoppio in quattro turni invece che in
      undici, il ciclo di un agente col contesto che si allunga a ogni giro, la
      spinta avversaria che cresce finché la risposta si ribalta, e il residuo
      di una rete guidata dalla fisica che si spegne mentre la curva si accosta
      alla soluzione esatta.

  - tipo: corretto
    testo: >
      Le figure animate calcolano i numeri che mostrano, e adesso lo
      verificano: ognuna delle sei porta un controllo che ne impedisce la
      nascita se il risultato non coincide con quello che il capitolo dichiara.
      Lo scan a raddoppio si genera solo se dà lo stesso risultato di quello in
      fila, posizione per posizione; la figura dell'attacco solo se a spinta
      zero la risposta è giusta e oltre la soglia è ribaltata; quella della rete
      guidata dalla fisica addestra davvero, per trentamila epoche, e ritrova i
      due numeri stampati nella pagina. Una figura che smentisce il testo non è
      un difetto grafico: è il libro che dice due cose diverse nella stessa
      pagina.

  - tipo: corretto
    pagina: StateSpaceModel/mamba.md
    testo: >
      Il testo attribuiva a Blelloch lo scan parallelo e gli accreditava lo
      stesso numero di operazioni della versione in fila, ma il codice stampato
      poche righe dopo è quello a raddoppio, che di operazioni ne fa di più.
      Adesso il libro distingue le due versioni e dice quale sta scrivendo: il
      guadagno è sui turni, e si paga in conti.

- versione: "1.4.0"
  data: 2026-08-12
  voci:

  - tipo: corretto
    testo: >
      Correzioni in tutti i capitoli, elencate nelle voci che seguono. La più
      importante non è nessuna delle singole: è che il codice del libro, da
      questa versione, gira davvero.

  - tipo: corretto
    testo: >
      Alcuni esempi si smentivano da soli, e si vedeva solo lanciandoli. La
      frase scelta per dimostrare che l'attenzione capisce la negazione veniva
      classificata male dal modello che la sezione fa girare; l'esempio che
      doveva mostrare come il BPE non perde informazione usava lettere fuori
      dal proprio alfabeto; l'analogia «re meno uomo più donna» restituisce
      «re», se non si esclude il punto di partenza. Adesso il libro lo dice, e
      dove il modello sbaglia lo mostra invece di nasconderlo: è più
      interessante di un successo.

  - tipo: corretto
    pagina: SistemiRaccomandazione/filtraggio-collaborativo.md
    testo: >
      L'unico esperimento del capitolo misurava l'errore sui dati di
      addestramento e ne traeva una conclusione sulla capacità di generalizzare.
      Tenendo da parte un quinto dei voti, l'errore passa da 0,019 a 0,418. Un
      capitolo che insegna a valutare i modelli non può sbagliare la propria
      valutazione.

  - tipo: corretto
    pagina: PINN/come-funziona.md
    testo: >
      L'esempio del capitolo non convergeva come il testo prometteva, e la cosa
      si vedeva solo addestrando davvero. Adesso il libro mostra il caso che
      fallisce: una rete con il residuo più basso di tutte e la soluzione più
      sbagliata, che è esattamente la lezione che la pagina insegna due
      paragrafi dopo. Con tre controlli nel codice che se ne accorgono, se un
      domani i numeri cambiano.

  - tipo: corretto
    testo: >
      Errori di fatto e attribuzioni sbagliate, corretti in tutto il libro: le
      sorelle Wachowski (erano «i fratelli»), le connessioni residue di U-Net
      che sono della FCN, ImageNet che nel 2009 aveva 3,2 milioni di immagini e
      non quattordici, il margine massimo che è del 1963 e non dei laboratori
      Bell degli anni Novanta, il forget gate della LSTM che è del 2000 e non
      del paper del 1997, BIC e AIC che avevano il segno rovesciato. Quando il
      libro cita una fonte, adesso quella fonte dice davvero quello che il
      testo le fa dire.

  - tipo: ampliato
    testo: >
      Il libro promette due livelli di lettura e un interruttore per scegliere.
      La promessa era mantenuta dentro le schede e tradita fuori: didascalie
      delle figure, riquadri «Da ricordare» e paragrafi di raccordo erano
      scritti nella lingua del livello Superiore, e sono proprio le cose che
      non si possono saltare. Undici lettori hanno segnalato centodiciotto
      punti in cui ci si perde. Sono stati riscritti, e i riquadri «Da
      ricordare» sono ora sui due livelli come il libro dichiara.

  - tipo: corretto
    testo: >
      I notebook scaricabili dal pulsante «Esegui il codice» non si aprivano:
      centocinquantuno celle su duecentosessantaquattro davano errore di
      sintassi, in tutti e ventitré i file. Adesso funzionano.

  - tipo: ampliato
    testo: >
      Tredici figure animate nuove, dove il tempo è il contenuto: le fusioni
      del BPE che accorciano il testo, k-means che si corregge da solo, la
      finestra che scorre sul suono e riempie lo spettrogramma, la online
      softmax di Flash Attention che si ricalibra a ogni blocco, una rete di
      Hopfield che ripara un ricordo scendendo di energia, la validazione a
      origine mobile che non guarda mai nel futuro, il collasso della CTC con
      la controprova di cosa succede invertendo i due passi, il feromone delle
      formiche che decide la strada corta senza che nessuna l'abbia misurata,
      il falsario della GAN che raggiunge il vero mentre l'esperto si arrende,
      la deriva dei dati misurata dalla distanza che le dà il nome, il palo che
      scorre dietro una finestrella e il movimento che si perde, il sogno di un
      modello del mondo che si stacca dalla realtà dopo sedici passi, e il
      cammino dalla baseline all'ingresso lungo cui il gradiente è ancora vivo.
      Ognuna calcola i propri numeri, e si rifiuta di nascere se smettono di
      combaciare con quelli del testo.

  - tipo: corretto
    testo: >
      Alcune figure raccontavano una storia diversa da quella della pagina che
      le ospita, e sono il tipo di errore che nessuna ricerca nel testo può
      trovare, perché non c'è una parola sbagliata da cercare. Una svolgeva
      17 × 28 mentre il paragrafo accanto svolge 17 × 24; una disegnava
      AlphaGo addestrato dal solo self-play, che è il suo successore e non lui;
      una prometteva un blocco di memoria di cui il testo parlava per cinque
      righe e che nel disegno non c'era; un albero di decisione arrivava per
      ultimo alla scelta che il testo dice di provare per prima. Adesso testo e
      figura dicono la stessa cosa.

  - tipo: ampliato
    testo: >
      La notazione matematica adesso è la stessa in tutto il libro. Il grassetto
      dice che un oggetto ha più di una componente (una matrice, un vettore), e
      il tondo che è un numero solo: senza quella distinzione una lettera è
      ambigua, e il lettore deve indovinare dal contesto a ogni riga. Due
      capitoli su trentatré la applicavano, ed erano i primi due, quelli che la
      insegnano; da lì in poi spariva. Sono circa duemila simboli rivisti uno
      per uno, non sostituiti a macchina: i conteggi, le funzioni e le
      probabilità restano tondi anche quando si scrivono maiuscoli, ed è la
      trappola in cui una correzione automatica sarebbe caduta.

  - tipo: corretto
    testo: >
      Nel farlo sono venute fuori parecchie lettere che significavano due cose
      diverse nella stessa pagina, e in un capitolo una che ne significava tre.
      Dove si poteva le abbiamo rinominate, dove il nome era quello standard
      della materia lo abbiamo detto al lettore invece di nasconderlo: se un
      simbolo in un articolo si chiama in un altro modo, adesso il libro lo
      scrive, così chi va a cercare sa cosa cercare.

  - tipo: corretto
    testo: >
      Alcuni numeri che il libro stampava erano quelli di una sola esecuzione,
      e su altre non reggevano la tesi per cui erano stati messi lì. È un
      difetto che si nasconde bene, perché rilanciando il programma il numero
      torna identico: la verifica lo conferma invece di scoprirlo. Dove
      succedeva, il libro adesso misura su più semi e riporta anche quanto
      ballano i risultati, che è la cosa che al lettore serve davvero sapere.

- versione: "1.3.0"
  data: 2026-08-11
  voci:

  - tipo: ampliato
    pagina: GraphNeuralNetwork/architetture-applicazioni.md
    testo: >
      I Graph Transformer, cioè cosa succede a lasciar parlare ogni nodo con
      ogni altro invece che solo con i vicini. Se ne ricava un legame fra due
      capitoli lontani: il modo in cui qui si segna la posizione di un nodo in
      un grafo generalizza l'idea con cui i Transformer segnano la posizione
      delle parole in una frase, e sul grafo più semplice che esista, una fila,
      le due firme diventano onde imparentate. Non le stesse onde: la pagina
      mostra anche dove si separano.

  - tipo: ampliato
    pagina: Transformers/confronti.md
    testo: >
      Le tre strade per far costare meno l'attenzione, ora tutte e tre: uno
      schema deciso in anticipo, una scelta guidata dai dati (il Reformer, che
      cerca le coppie che contano invece di calcolarle tutte) e la rinuncia
      alla softmax. Più gli strati reversibili, che sono il baratto memoria
      contro calcolo che ricorre a ogni scala.

  - tipo: ampliato
    pagina: Transformers/multimodalita.md
    testo: >
      ELECTRA, il quarto modo di studiare accanto a GPT, BERT e T5, che nasce
      da un'obiezione semplice: se si cancella una parola su sette, per sei
      parole su sette la rete non impara niente. Con il punto in cui
      l'analogia con le GAN si rompe, che spiega perché qui non ci sia la loro
      instabilità.

  - tipo: ampliato
    pagina: Transformers/tendenzefuture.md
    testo: >
      Perché un Transformer spenda lo stesso calcolo su una domanda facile e
      su una difficile, e i due modi di togliere quel vincolo: pensare più a
      lungo in silenzio, o pensare scrivendo. Il primo costa meno, il secondo
      lascia una traccia leggibile.

  - tipo: ampliato
    pagina: Transformers/attenzione.md
    testo: >
      Un riquadro su un antenato dimenticato: la struttura
      domanda-contro-archivio dell'attenzione era già stata inventata a metà
      degli anni Dieci, per far ragionare una rete su un elenco di fatti. È
      anche la forma dei sistemi che oggi recuperano documenti prima di
      rispondere.

  - tipo: ampliato
    pagina: MLOps/dati-e-pipeline.md
    testo: >
      In che formato stanno i dati fra uno stadio e l'altro, che sembra una
      questione tecnica e non lo è: per addestrare si leggono sempre poche
      colonne su molte, ed è esattamente il caso in cui conservarle per colonna
      cambia tutto. Perché il CSV sia quasi sempre la scelta sbagliata, e cosa
      risolvono Parquet e Arrow.

  - tipo: ampliato
    pagina: MachineLearning/overfitting-validazione.md
    testo: >
      Come si decide se conviene raccogliere altri dati o cambiare modello, che
      è la domanda più cara di ogni progetto: si tracciano due curve e la loro
      forma dà la risposta. Più l'Elastic Net, il campionamento stratificato, e
      il fatto che il test set si sporca anche soltanto guardandolo per
      decidere come impostare il lavoro.

  - tipo: ampliato
    pagina: MachineLearning/metriche.md
    testo: >
      Quando la cosa da predire ha un ordine (una fascia d'età, le stelle di
      una recensione, la gravità di una diagnosi) l'accuratezza non sa che
      sbagliare di poco non è come sbagliare di molto, e sceglie il modello
      sbagliato. Quali misure usare al suo posto.

  - tipo: ampliato
    pagina: MachineLearning/alberi-ensemble.md
    testo: >
      Come si combinano modelli di tipo diverso, per voto o addestrando un
      modello a pesarli. Con un risultato che spiazza e che è misurato nella
      pagina: il voto peggiora rispetto al miglior modello singolo, e
      l'alternativa lo supera.

  - tipo: ampliato
    pagina: MachineLearning/iperparametri.md
    testo: >
      Perché il torneo a eliminazione descritto qui, su un cluster vero, si
      faccia in versione asincrona: aspettare che tutti finiscano un turno
      lascia ferme quasi tutte le macchine.

  - tipo: ampliato
    pagina: RetiNeurali/backpropagation.md
    testo: >
      La ragione vera per cui in classificazione si usa la cross-entropia e non
      l'errore quadratico, che non è una convenzione: con la seconda il modello
      che sbaglia di più è quello che impara più lentamente, il che è l'esatto
      contrario di ciò che serve.

  - tipo: ampliato
    pagina: DeepLearning/ottimizzazione-regolarizzazione.md
    testo: >
      Il riscaldamento del learning rate, che in ogni ricetta di addestramento
      moderna sta all'inizio e che il libro dava per noto: perché i primi passi
      siano i più pericolosi, e perché convenga farli piano.

  - tipo: ampliato
    pagina: PyTorch/prestazioni.md
    testo: >
      Come si misura davvero il tempo su una GPU. È la trappola in cui cade
      chiunque la prima volta, perché la GPU non esegue quando glielo si chiede
      ma quando le viene comodo, e un cronometro ingenuo misura il nulla.

  - tipo: ampliato
    pagina: PyTorch/replicare-un-paper.md
    testo: >
      Il diario degli esperimenti, cioè la metà del lavoro che nessuno scrive.
      Le tre regole che lo rendono utile, e la cosa che gli strumenti di
      tracciamento non registrano al posto tuo: perché avevi provato.

  - tipo: ampliato
    pagina: PyTorch/dati-su-misura.md
    testo: >
      Perché impacchettare un dataset grande convenga, e non per la ragione che
      si immagina: il costo dominante non è decodificare i file, è aprirli.
      Nello stesso passaggio si calcolano le statistiche che serviranno per
      normalizzare.

  - tipo: ampliato
    pagina: NaturalLanguageProcessing/modelli-sequenza.md
    testo: >
      Come si addestra davvero una rete ricorrente su una sequenza lunga, e il
      prezzo che si paga: spezzandola in blocchi, la rete non può più imparare
      legami più lunghi del blocco. Parte di ciò che chiamiamo «memoria corta»
      è una scelta di ingegneria, non un limite matematico.

  - tipo: ampliato
    pagina: ReinforcementLearning/mdp-valore.md
    testo: >
      Che cosa succede quando l'agente non vede lo stato del mondo ma solo un
      pezzo rumoroso, che è la regola e non l'eccezione. È il motivo per cui
      certi agenti impilano gli ultimi fotogrammi e altri hanno una memoria.

  - tipo: ampliato
    pagina: DeepReinforcementLearning/policy-gradient.md
    testo: >
      Da dove viene il «guinzaglio» di PPO: è la versione economica di un
      vincolo preciso, formulato qualche anno prima e troppo costoso da
      calcolare. Non più corretto, abbastanza corretto e molto più semplice.

  - tipo: ampliato
    pagina: SerieTemporali/forecasting-neurale.md
    testo: >
      Una terza famiglia fra i modelli classici e le reti: scomporre la serie
      in tendenza, stagionalità e festività e interpolare una curva. Su molti
      problemi aziendali basta, e il motivo per cui funziona è anche il motivo
      del suo limite.

  - tipo: ampliato
    pagina: GPU/parallelismo-distribuito.md
    testo: >
      Da che cosa ha preso il posto lo schema ad anello con cui le GPU si
      scambiano i gradienti, e perché quello precedente non reggeva
      l'aumentare delle macchine.

- versione: "1.2.0"
  data: 2026-08-10
  voci:

  - tipo: nuovo
    pagina: VisioneArtificiale/geometria-e-profondita.md
    testo: >
      Il capitolo sulla visione parlava solo di reti applicate alle immagini, e
      lasciava fuori la metà geometrica del campo: come si forma un'immagine e
      come si recupera la distanza che lo scatto ha buttato via. Dal modello di
      fotocamera dimostrato da Brunelleschi con una tavoletta forata al vincolo
      epipolare, alla profondità dalla disparità, al flusso ottico, fino alla
      profondità stimata da una sola immagine. Il codice non illustra, verifica:
      il residuo epipolare vale un decimillesimo di miliardesimo di
      miliardesimo.

  - tipo: nuovo
    pagina: VisioneArtificiale/rendering-neurale.md
    testo: >
      NeRF e splatting gaussiano: una scena rappresentata addestrando una
      funzione invece di ricostruire una superficie. Come il rendering
      volumetrico differenziabile faccia emergere la geometria dalle sole
      fotografie, perché senza codifica posizionale esca solo nebbia (è lo
      stesso limite descritto nel capitolo sulle PINN) e perché le pose delle
      fotocamere restino un ingresso obbligatorio, che arriva dalla sezione
      precedente.

  - tipo: nuovo
    pagina: DeepLearning/multi-compito.md
    testo: >
      Addestrare una rete su più compiti insieme, che il libro faceva già in
      mezza dozzina di posti senza chiamarlo per nome. Perché un compito in più
      possa aiutare quello che ci interessa, e perché possa anche danneggiarlo:
      misurato, un compito imparentato toglie il 65% dell'errore e uno estraneo
      ne aggiunge il 25%.

  - tipo: nuovo
    pagina: DeepReinforcementLearning/imitazione.md
    testo: >
      Imparare guardando qualcuno che sa già fare la cosa, che è il pezzo che
      mancava fra il reinforcement learning e l'addestramento degli assistenti
      conversazionali. E il suo problema caratteristico: gli errori non si
      sommano, si compongono, e più il maestro è bravo meno insegna a
      rimediare, perché non si trova mai nella condizione di doverlo fare.

  - tipo: ampliato
    pagina: MachineLearning/riduzione-clustering.md
    testo: >
      Le misture gaussiane e l'algoritmo EM, che due capitoli più avanti (i
      tokenizzatori e il riconoscimento vocale) davano già per noti senza che
      fossero mai stati spiegati. Assegnare una probabilità invece di
      un'etichetta, imparare la forma di un gruppo e non solo il suo centro, e
      scegliere quanti gruppi con un criterio invece che a occhio.

  - tipo: ampliato
    pagina: DeepReinforcementLearning/mcts-alphago.md
    testo: >
      La ricerca ad albero Monte Carlo, che il libro invocava quattro volte
      come spiegazione di AlphaGo e MuZero senza averla mai insegnata. Le sue
      quattro mosse, il perché si sceglie la mossa più visitata e non quella
      con la media migliore, e il fatto che la formula che le fa scoprire dove
      guardare è la stessa dei bandit a più braccia.

  - tipo: ampliato
    pagina: Python/basi.md
    testo: >
      Il GIL, cioè perché in Python i thread aiutano quando si aspetta e non
      quando si calcola. Serviva: il capitolo su PyTorch lo usava due volte
      come spiegazione di scelte importanti, dando per noto un termine mai
      introdotto.

  - tipo: ampliato
    pagina: NaturalLanguageProcessing/rappresentare-testo.md
    testo: >
      Come si ottiene un vettore per una frase intera, e non solo per le
      singole parole. Il capitolo si fermava alla parola, e intanto due
      capitoli sul recupero di documenti poggiavano su modelli di embedding mai
      spiegati. Con la sorpresa che regge la sezione: un BERT preso così com'è
      dà vettori di frase mediocri, perché è stato addestrato ad altro.

  - tipo: ampliato
    pagina: DeepLearning/architetture-storiche.md
    testo: >
      La convoluzione separabile in profondità, cioè il mattone di cui è fatta
      EfficientNet, che il capitolo raccontava senza averlo mai descritto.
      Stessa forma in uscita, quasi nove volte meno pesi: è la ragione per cui
      la visione artificiale sta in un telefono.

  - tipo: ampliato
    pagina: SerieTemporali/componenti-e-classici.md
    testo: >
      La procedura che mancava: come si scelgono i numeri di un modello ARIMA e
      come si verifica che vada bene, guardando quello che resta invece delle
      previsioni. Più i due modi in cui le informazioni esterne entrano in una
      serie, il meteo e le promozioni da una parte, le serie che si influenzano
      a vicenda dall'altra.

  - tipo: ampliato
    pagina: MachineLearning/alberi-ensemble.md
    testo: >
      Come si combinano modelli di tipo diverso, per voto o addestrando un
      modello a pesarli. Con un risultato che spiazza e che è misurato nella
      pagina: il voto peggiora rispetto al miglior modello singolo, e
      l'alternativa lo supera.

- versione: "1.1.7"
  data: 2026-08-09
  voci:

  - tipo: corretto
    testo: >
      Il libro si legge scuro, ma si stampava scuro anche lui: pagine nere,
      figure in negativo e, con gli sfondi disattivati come fa ogni browser,
      testo chiarissimo su carta bianca, cioè niente. Adesso la stampa esce
      sempre chiara, qualunque tema si stia usando, e i due livelli di lettura
      finiscono tutti e due sul foglio, ciascuno col suo nome sopra: su carta
      non c'è niente da aprire.

  - tipo: corretto
    testo: >
      La riga che dice chi ha pronunciato una citazione era di un grigio troppo
      chiaro per il fondo su cui stava, sotto il minimo di leggibilità
      raccomandato. Adesso usa il grigio del libro, in entrambi i temi.

- versione: "1.1.6"
  data: 2026-08-09
  voci:

  - tipo: corretto
    testo: >
      Le figure erano numerate di fila su tutto il libro, e si era arrivati a
      «Fig. 302»: un numero che non dice in che punto del libro si stia
      guardando. Adesso portano il numero del capitolo, «Fig. 3.2» come in un
      libro, e i rimandi nel testo lo seguono. Il numero del capitolo è lo
      stesso che si legge nell'indice e in prima pagina, così le due
      numerazioni non possono discordare.

  - tipo: corretto
    testo: >
      La figura ingrandita si apre come sta nella finestra e non già zoomata:
      prima si vede tutto il disegno, poi si sceglie dove guardare da vicino.

- versione: "1.1.5"
  data: 2026-08-09
  voci:

  - tipo: corretto
    testo: >
      Le figure del libro sono diagrammi, e dentro hanno del testo: i nomi dei
      passaggi, le etichette, le formule. Su un telefono quel testo finiva
      sotto i sei pixel, cioè si vedeva la figura ma non si leggeva, e quando
      una pagina rimandava a una figura il rimando andava a vuoto. Adesso la
      figura si tocca e si apre a schermo intero, alla grandezza per cui è
      stata disegnata: si allarga con due dita, si sposta trascinandola, si
      chiude con un tocco fuori. Da tastiera fanno lo stesso i tasti più, meno
      e zero, e si esce con Esc.

- versione: "1.1.4"
  data: 2026-08-09
  voci:

  # Senza `pagina`: riguardano tutte.
  - tipo: corretto
    testo: >
      Il libro si leggeva peggio sullo schermo che sulla carta, e su un
      telefono era peggio che altrove. La misura della riga, che è il numero
      di caratteri che si attraversano prima di tornare a capo, saltava da
      ventisei su un telefono a settantacinque su un tablet: nel primo caso
      quattro parole per riga, nel secondo una riga così lunga che tornando
      indietro si perde il rigo. Ora il corpo del testo cresce con lo schermo
      senza scalini, la riga resta fra i trentacinque e i settanta caratteri
      a ogni larghezza, e l'interlinea segue la lunghezza della riga invece
      di contraddirla. Cambia solo come il testo è messo in pagina: le parole
      sono le stesse.

  - tipo: corretto
    testo: >
      Nella stessa pagina il testo, i blocchi di codice, le figure e le
      tabelle partivano da tre margini sinistri diversi, e una figura poteva
      rientrare di quasi cento pixel rispetto al paragrafo che la annunciava,
      con la didascalia più larga della figura che descrive. Adesso la colonna
      di lettura è una sola e vale per tutto quello che ci sta dentro. Su uno
      schermo da portatile l'indice di destra, quello della pagina corrente,
      finiva mezzo fuori dallo schermo e si leggeva tagliato a metà parola:
      ora ci sta.

- versione: "1.1.3"
  data: 2026-08-08
  voci:

  # Senza `pagina`: la landing è la radice del toc, non una sua voce, e il
  # generatore (giustamente) non sa da dove prendere il titolo del link.
  - tipo: corretto
    testo: >
      L'epigrafe in prima pagina era una frase attribuita a Marcus du Sautoy
      che si trova solo sugli aggregatori di citazioni: nessuno di loro dice
      da quale libro o intervista venga, e la traduzione italiana lasciava in
      dubbio chi guardasse che cosa. Al suo posto la domanda con cui Alan
      Turing apre il discorso sulle macchine che imparano, riscontrata sul
      testo di «Computing Machinery and Intelligence» del 1950: la strada
      per l'intelligenza non è simulare una mente adulta, è simularne una
      che impara.

- versione: "1.1.2"
  data: 2026-08-08
  voci:

  - tipo: corretto
    pagina: Introduzione/overview.md
    testo: >
      La massima di Weizenbaum con cui si apre il libro era tradotta alla
      lettera: «si dice che spiegare significhi spiegare via», che in italiano
      non vuol dire niente, perché *to explain away* è un verbo frasale che
      l'italiano non ha. Adesso dice «dissolvere», e una nota riporta
      l'originale inglese per chi vuole controllare. Il richiamo nelle
      conclusioni la segue.

- versione: "1.1.1"
  data: 2026-08-08
  voci:

  - tipo: corretto
    pagina: prefazione.md
    testo: >
      L'ultima riga della prefazione diceva, come nel 2019, «genera paura e
      alimenta false notizie»; adesso dice «false speranze». Il non sapere
      come funziona una macchina non produce solo timore: produce anche
      l'attesa che sappia fare cose che non sa fare. Sono la stessa ignoranza,
      vista dai due lati.

- versione: "1.1.0"
  data: 2026-08-08
  titolo: Il libro ha una prefazione
  nota: >
    È saltata fuori la bozza del 2019, quella mandata a un editore: indice di
    quindici capitoli e una sola parte scritta, la prefazione. Quasi tutto
    quello che diceva era già nel libro, sparso fra l'introduzione e la sua
    conclusione. Mancava la prefazione in quanto tale, cioè l'unica pagina in
    cui l'autore parla in prima persona.
  voci:

  - tipo: nuovo
    pagina: prefazione.md
    testo: >
      Perché questo libro esiste, perché nel 2019 doveva uscire su carta e non
      è uscito, e perché è stata una fortuna: quell'indice non nominava i
      Transformer e prometteva TensorFlow. Si legge in tre minuti, prima
      dell'introduzione, e non è un capitolo: la numerazione degli altri resta
      quella di prima.

  - tipo: ampliato
    pagina: Introduzione/conclusione.md
    testo: >
      La citazione di Andrew Ng sull'AI come «nuova elettricità» arrivava
      senza rincorsa. Adesso davanti c'è la genealogia a cui allude: le
      tecnologie che non risolvono un problema, ma cambiano il modo in cui si
      risolvono tutti gli altri.

  - tipo: impianto
    testo: >
      Nell'indice di sinistra ogni capitolo tiene le proprie sezioni chiuse, e
      il comando per aprirle senza entrare nel capitolo era un'icona di dodici
      pixel dello stesso colore del testo: c'era, ma non la trovava nessuno, e
      per sapere che cosa copriva un capitolo bisognava aprirlo e tornare
      indietro. Adesso è un comando vero, alto quanto la riga e in teal, che si
      accende al passaggio.

  - tipo: corretto
    testo: >
      I numeri dei capitoli nell'indice di sinistra li prendeva anche chi
      capitolo non è: la pagina degli aggiornamenti compariva come se fosse il
      trentaquattresimo. Adesso il numero ce l'hanno i capitoli e basta, ed è
      lo stesso che portano le schede in prima pagina.

  - tipo: corretto
    pagina: Conclusioni/overview.md
    testo: >
      Le conclusioni dicevano di essere partite da una frase di Weizenbaum
      sull'intelligenza artificiale «straordinariamente resistente al
      tentativo di una precisa definizione». L'introduzione però apre su
      un'altra frase, «si dice che spiegare significhi dissolvere», e della
      prima non si trova riscontro in nessuna fonte primaria: il richiamo
      adesso cita l'apertura vera.

- versione: "1.0.3"
  data: 2026-08-08
  voci:

  - tipo: corretto
    testo: >
      La storia in fondo a questa pagina dava per esistente un'edizione a
      stampa, e la usava come metro per dire quali capitoli fossero
      «aggiunti». Il libro era scritto per uscire su carta, ma su carta non è
      mai uscito: il metro è il manoscritto del 2019, e la prima forma
      pubblica di questo testo è quella che si sta leggendo.

- versione: "1.0.2"
  data: 2026-08-08
  voci:

  - tipo: corretto
    testo: >
      La storia in fondo a questa pagina faceva cominciare il libro nel giugno
      2024, che è la data del primo commit: il libro nasce nel 2019, e quello
      che nasce nel 2024 è la sua versione online. La nota di copyright, che
      diceva la stessa cosa, adesso parte dal 2019.

- versione: "1.0.1"
  data: 2026-08-08
  voci:

  - tipo: corretto
    testo: >
      La bibliografia e questa pagina si presentavano ai motori di ricerca e
      alle anteprime dei link condivisi con il titolo e la descrizione della
      copertina, come se fossero la prima pagina del libro: adesso ognuna
      porta i propri. Riguardava le voci di primo livello dell'indice, che
      sono le uniche a non avere un capitolo sopra di sé.

- versione: "1.0.0"
  data: 2026-08-08
  titolo: Il libro prende un numero
  nota: >
    La 1.0.0 non è il primo giorno del libro, che nasce nel 2019 (la storia
    breve è in fondo a questa pagina): è il primo giorno in
    cui il libro ha un numero, e il punto da cui si contano i cambiamenti.
    L'elenco qui sotto è il lavoro di agosto 2026, l'ultimo mese prima che il
    registro cominciasse.
  voci:

  - tipo: nuovo
    pagina: Matematica/matematica-llm.md
    testo: >
      Gli strumenti dei capitoli di matematica messi all'opera su una cosa
      sola: un token che entra in un modello linguistico ed esce dall'altra
      parte. Nasce da un'osservazione di Joseph Breeden, che rileggendo la
      letteratura sui modelli linguistici scopre che il muro non era la
      matematica ma il vocabolario preso in prestito da mestieri diversi.

  - tipo: nuovo
    pagina: ReinforcementLearning/banditi.md
    testo: >
      Il dilemma fra esplorare e sfruttare nella forma più pura che esista,
      dalla domanda che Thompson si pone nel 1933 sulle sperimentazioni
      cliniche. Arriva prima degli MDP, perché qui manca tutto il resto e si
      vede solo quello.

  - tipo: nuovo
    pagina: ReinforcementLearning/monte-carlo.md
    testo: >
      Imparare giocando fino in fondo, senza la mappa dell'ambiente: il passo
      che mancava fra la value iteration, che la mappa la pretende, e il
      Q-learning. Comincia da Ulam e dai suoi solitari a Los Alamos.

  - tipo: nuovo
    pagina: GraphNeuralNetwork/knowledge-graph.md
    testo: >
      Quando gli archi di un grafo non sono collegamenti ma fatti, con un
      verso e un nome. Da *things, not strings* di Google alle rappresentazioni
      di entità e relazioni.

  - tipo: nuovo
    pagina: Transformers/multilingua.md
    testo: >
      Un modello solo per cento lingue: vocabolari condivisi, trasferimento
      fra lingue lontane e il prezzo che si paga a metterle tutte nello stesso
      spazio. Riprende il filo della traduzione neurale, che si era fermato al
      2016.

  - tipo: nuovo
    pagina: MLOps/energia-e-impronta.md
    testo: >
      Di un modello si dichiara quasi tutto (parametri, FLOP, accuratezza,
      millisecondi) tranne quanta energia costa. Come si misura, e perché il
      numero cambia di un ordine di grandezza a seconda di dove lo si misura.

  - tipo: ampliato
    pagina: GraphNeuralNetwork/message-passing.md
    testo: >
      Da dove viene la matrice di adiacenza normalizzata, e perché
      l'oversmoothing non è un difetto da correggere ma la conseguenza di come
      il message passing è fatto.

  - tipo: ampliato
    pagina: Transformers/confronti.md
    testo: >
      Il terzo filo del confronto: la self-attention è message passing su un
      grafo completo, e il capitolo sulle graph neural network e questo si
      parlano.

  - tipo: ampliato
    pagina: GAN/come-funziona.md
    testo: >
      Come si misura una GAN, che è la domanda che l'addestramento avversario
      lascia aperta: Inception Score, FID, e che cosa nessuno dei due vede.

  - tipo: ampliato
    pagina: GPU/gemm-e-tensor-core.md
    testo: >
      L'array sistolico: la forma di circuito che sta dentro un tensor core, e
      perché moltiplicare matrici in hardware somiglia a una catena di
      montaggio.

  - tipo: ampliato
    pagina: PyTorch/errori-comuni.md
    testo: >
      Leggere le curve di addestramento: quali forme dicono overfitting, quali
      un learning rate sbagliato, quali un errore nei dati.

  - tipo: ampliato
    pagina: Python/pandas-matplotlib.md
    testo: >
      I quattro tipi di join fra due tabelle e la griglia di subplot, due cose
      che il capitolo usava senza averle spiegate.

  - tipo: ampliato
    testo: >
      Ogni capitolo si chiude con un riquadro «Da ricordare», scritto sui due
      livelli come il resto del libro: cinque righe per rileggere un capitolo
      in un minuto, o per capire se vale la pena aprirlo.

  - tipo: corretto
    testo: >
      Correzioni in tutti i capitoli dove servivano: date, attribuzioni,
      esempi numerici, notazione.

  - tipo: corretto
    testo: >
      Il codice dei blocchi Python è stato eseguito e i notebook compagni (il
      pulsante «Esegui il codice») rigenerati dalle pagine corrette: quello
      che si legge e quello che gira su Colab sono di nuovo la stessa cosa.

  - tipo: impianto
    testo: >
      Il tema perde il viola rimasto dalle impostazioni di fabbrica nei
      fondini delle schede: la palette del libro è quella, e adesso lo è
      ovunque.

  - tipo: impianto
    testo: >
      Questa pagina, e con lei il numero di versione che compare in cima
      all'indice e nella prima pagina del libro.
