  voci:

  - tipo: impianto
    testo: >
      **Colonna di lettura uniforme.** Anche nelle pagine senza sommario
      laterale (prefazione, bibliografia, indice dei termini, ricerca) larghezza
      e margine sinistro coincidono con quelli dei capitoli.

  - tipo: impianto
    pagina: prefazione.md
    testo: >
      **Triangolo di Penrose in tema scuro.** Il segno del progetto conserva i
      propri colori anche nel tema scuro; il difetto era presente dalla 1.12.2.

- versione: "1.12.2"
  data: 2026-09-01
  voci:

  - tipo: corretto
    testo: >
      **Correzioni a fatti, formule, citazioni e dati hardware.** Fatti storici
      riportati alle fonti, condizioni delle formule precisate, citazioni e
      numeri delle schede tecniche ricontrollati, scene riscritte perché ogni
      gesto corrisponda a un passaggio del conto.

  - tipo: corretto
    pagina: Introduzione/overview.md
    testo: >
      **Fatti storici nell'Introduzione.** L'epigrafe è la prima riga
      dell'articolo del 1966, la frase di Pascal è riportata per intero, ELIZA è
      un capostipite dei chatbot e non il primo.

  - tipo: corretto
    pagina: Introduzione/applicazioni.md
    testo: >
      **Definizione di robot secondo la norma ISO 8373.** Aggiunta la clausola
      sul grado di autonomia (edizione 2021); precisato che la limitatezza delle
      ricompense basta alla convergenza della somma scontata, ma non è
      necessaria.

  - tipo: corretto
    pagina: Introduzione/conclusione.md
    testo: >
      **Protocollo del confronto fra rete e cardiologi.** Nello studio i
      cardiologi messi a confronto non coincidono con quelli che hanno annotato
      il riferimento, a differenza di quanto il racconto lasciava intendere.

  - tipo: corretto
    pagina: Introduzione/massimo_comune_divisore.ipynb
    testo: >
      **Uscita salvata nel quaderno del massimo comune divisore.** La cella
      riporta ora il risultato commentato nella pagina.

  - tipo: corretto
    pagina: SistemiRaccomandazione/filtraggio-collaborativo.md
    testo: >
      **Fuga di informazione nell'esempio di filtraggio collaborativo.**
      L'errore sulle celle già viste e quello sulle nuove sono contati
      separatamente; per un utente appena iscritto la scheda tende a zero con
      minimi quadrati alternati o decadimento dei pesi.

  - tipo: corretto
    pagina: SistemiRaccomandazione/raccomandazione-neurale.md
    testo: >
      **Citazione e ricerca del vicino nella raccomandazione neurale.** Il
      lavoro citato mostra che l'addestramento sul futuro rende imprevedibile
      l'ordine fra i metodi; massimo prodotto scalare e vicino più prossimo
      coincidono solo a norma uguale.

  - tipo: corretto
    pagina: SistemiRaccomandazione/raccomandazione-neurale.md
    testo: >
      **Calcolo della NDCG e figura della vetrina.** Completati gli sconti per
      posizione, così che la classifica ideale sia ricostruibile; la figura
      mostra ora il sorpasso promesso dalla didascalia.

  - tipo: corretto
    pagina: GPU/architettura-gpu.md
    testo: >
      **Operazioni per ciclo nell'architettura GPU.** Una
      moltiplicazione-e-somma per ciclo vale due operazioni, e il conto torna ai
      mille miliardi delle schede tecniche; aggiornata la figura degli ordini di
      grandezza.

  - tipo: corretto
    pagina: GPU/gerarchia-memoria.md
    testo: >
      **Nomi dei livelli di cache.** La cache di secondo livello aveva due nomi,
      uno dei quali designava il primo livello; i dati che traboccano dai
      registri non sottraggono memoria condivisa alla squadra.

  - tipo: corretto
    pagina: GPU/flash-attention.md
    testo: >
      **Teste e gruppi in FlashAttention.** Le teste di lettura sono trentadue e
      otto i gruppi che condividono chiavi e valori; i gigabyte del risultato
      sono tredici, in base dieci, e non dodici.

  - tipo: corretto
    pagina: GPU/gemm-e-tensor-core.md
    testo: >
      **Confronti omogenei fra GEMM e tensor core.** Il rapporto fra operazioni
      e byte vale un quarto o un mezzo secondo il formato; il processore
      dedicato citato è quello di prima generazione, a interi.

  - tipo: corretto
    pagina: DeepLearning/meta-apprendimento.md
    testo: >
      **Media della famiglia nel meta-apprendimento.** La sinusoide media
      appartiene alla famiglia: i suoi due parametri cadono negli intervalli
      dichiarati, contrariamente a quanto affermavano quattro punti della
      pagina.

  - tipo: corretto
    pagina: DeepLearning/ottimizzazione-regolarizzazione.md
    testo: >
      **Decadimento dei pesi e passo di apprendimento.** Anche nella versione
      separata il decadimento dipende dal passo, e ne cade il fattore dieci; la
      riserva sul label smoothing compare in entrambi i livelli.

  - tipo: corretto
    pagina: DeepLearning/architetture-storiche.md
    testo: >
      **Reti residuali e parametri di Inception.** Rimosso un confronto di
      leggerezza di addestramento a pari accuratezza che nessuna fonte sostiene;
      corretti i parametri di Inception e la descrizione testuale della figura.

  - tipo: corretto
    pagina: DeepLearning/reti-convoluzionali.md
    testo: >
      **Equivarianza e pooling nelle reti convoluzionali.** L'equivarianza
      deriva dalla sola condivisione dei pesi; il pooling comprende anche la
      media, non soltanto il massimo.

  - tipo: corretto
    pagina: Efficienza/un-modello-piccolo-che-imita.md
    testo: >
      **Distillazione dal lavoro originale.** L'equivalenza con la forma
      semplice richiede temperatura alta rispetto ai punteggi e punteggi a media
      nulla per ciascun esempio; il blocco mostra quanto ci si scosti da quel
      regime.

  - tipo: corretto
    pagina: Efficienza/far-rispondere-in-fretta.md
    testo: >
      **Rapporto fra calcolo e byte nell'inferenza veloce.** L'approssimazione
      regge se ingressi e uscite sono molto meno dei pesi di una riga;
      all'ultima riga della tabella sbaglia del dodici per cento.

  - tipo: corretto
    pagina: Ricerca/quando-il-mondo-non-si-conosce.md
    testo: >
      **Scena della ricerca ad albero e punteggio del 1997.** La scena scava ora
      l'albero, e ogni partita riparte dal fondo del ramo già esplorato; il
      punteggio della sfida del 1997 è riportato per intero, con le patte.

  - tipo: corretto
    pagina: Ricerca/overview.md
    testo: >
      **Profondità media nella ricerca.** Il simbolo usato per la lunghezza
      tipica di una partita indicava altrove la profondità massima; corretta
      anche la descrizione testuale di una figura.

  - tipo: corretto
    pagina: ReinforcementLearning/overview.md
    testo: >
      **Fattore di sconto nel rinforzo.** Scena e trattazione formale dicono la
      stessa cosa: a sconto minimo l'agente è miope; mantenerlo sotto uno è la
      scelta consueta, non un obbligo nei compiti senza fine.

  - tipo: corretto
    pagina: ReinforcementLearning/banditi.md
    testo: >
      **Confronto fra strategie nei banditi.** L'affermazione «nessun'altra farà
      meglio» è limitata alle strategie confrontate (un'altra raggiunge il 91,8
      per cento contro l'86,6); il confronto finale usa tre sorteggi invece di
      due.

  - tipo: corretto
    pagina: ReinforcementLearning/monte-carlo.md
    testo: >
      **Stimatori Monte Carlo con pesi di importanza.** Il primo dei due pesi
      coglie il valore giusto in media per qualunque numero di partite:
      illimitata è la varianza, non la distorsione; la contrapposizione vale
      contando la prima visita.

  - tipo: corretto
    pagina: ReinforcementLearning/mdp-valore.md
    testo: >
      **Osservazioni e stato nei processi di decisione.** Guardare gli ultimi
      fotogrammi serve quando manca il movimento, non un'informazione assente da
      ogni fotogramma; le caselle più lontane dall'obiettivo sono due.

  - tipo: corretto
    pagina: ReinforcementLearning/q-learning.md
    testo: >
      **Esempio del precipizio nel Q-learning.** La griglia dichiara le proprie
      dimensioni e il caso sceglie fra quattro direzioni, così che «una partita
      su quattro» sia un numero che si può rifare.

  - tipo: corretto
    pagina: AttenzioneLineare/dalla-softmax-alla-ricorrenza.md
    testo: >
      **Contributi e capienza della memoria a taglia fissa.** I tre contributi
      non compaiono più due volte con valori identici dopo la moltiplicazione;
      il lato trentadue è presentato prima come capienza, poi come ciò che la
      erode.

  - tipo: corretto
    pagina: AttenzioneLineare/scrivere-nella-memoria.md
    testo: >
      **Attribuzione dei fast weight programmer.** Furono progettati da
      Schmidhuber negli anni Novanta; Schlag e colleghi nel 2021 vi riconobbero
      l'attenzione lineare. La forma WY è il prodotto compatto delle correzioni
      in un blocco.

  - tipo: corretto
    pagina: AttenzioneLineare/scrivere-nella-memoria.md
    testo: >
      **Memorie correttive e taglia fissa.** A parità di taglia correggere batte
      accumulare e sbiadire, ma il vantaggio non cresce con il modello: su
      memorie grandi conta più la capienza del modo di aggiornarle.

  - tipo: corretto
    pagina: AttenzioneLineare/architetture-lineari.md
    testo: >
      **Conteggi dei lavori su RWKV-7 e xLSTM.** I modelli RWKV-7 con pesi
      aperti sono sette, non quattro; i limiti della LSTM indicati dagli autori
      di xLSTM sono tre; xLSTM-7B va alla pari con i modelli confrontabili.

  - tipo: ampliato
    pagina: AttenzioneLineare/dalla-softmax-alla-ricorrenza.md
    testo: >
      **Errore di richiamo calcolato dalla pagina.** Un blocco con seme proprio
      produce i due valori dell'errore di una memoria di taglia fissa
      sovraccarica, con l'andamento di confronto.

  - tipo: corretto
    pagina: Conclusioni/overview.md
    testo: >
      **Mappa dei modelli aperti e chiusi.** Il grafico a due assi non colloca
      più in alto i soli pesi scaricabili, in accordo con la didascalia: aperto
      non vuol dire debole, chiuso non vuol dire potente.

  - tipo: corretto
    pagina: Conclusioni/overview.md
    testo: >
      **Ottimizzazione e discesa del gradiente nelle Conclusioni.** «Tutti i
      problemi di ottimizzazione» diventa «quasi tutti», perché DBSCAN,
      clustering gerarchico e alberi non hanno obiettivo globale; la discesa si
      ferma dove il gradiente si annulla.

  - tipo: corretto
    pagina: Conclusioni/overview.md
    testo: >
      **Citazione degli esponenti delle leggi di scala.** I tre esponenti
      rinviano ora ai lavori da cui provengono, accanto alla figura e nel corpo
      del testo.

  - tipo: corretto
    pagina: Conclusioni/overview.md
    testo: >
      **Rimandi corretti nelle Conclusioni.** Il richiamo all'introduzione
      descrive il compito giusto, nascondere la parola successiva, senza
      estenderlo alle immagini, e indica una sezione e non un capitolo.

  - tipo: corretto
    pagina: Conclusioni/overview.md
    testo: >
      **Manuali consigliati e librerie.** La prima metà del manuale di Géron usa
      scikit-learn, la libreria di queste pagine; l'avvertenza indica ora dove
      passa il confine con Keras.

  - tipo: corretto
    pagina: VisioneLinguaggio/allineare-due-spazi.md
    testo: >
      **Perdita contrastiva e spostamenti in blocco.** La perdita non ignora
      qualunque spostamento in blocco di una nuvola, ma solo una costante
      aggiunta dentro una riga; la conclusione sul minimo poggia ora su un
      argomento corretto.

  - tipo: corretto
    pagina: VisioneLinguaggio/allineare-due-spazi.md
    testo: >
      **Riquadro e figura sull'allineamento di due spazi.** Il confronto della
      coppia giusta vale dentro una riga, non come soglia globale; la
      temperatura $0{,}01$ è il suo valore minimo; nella figura le lettere dei
      simboli sono distinte.

  - tipo: corretto
    pagina: VisioneLinguaggio/innestare-gli-occhi.md
    testo: >
      **Compressione dell'immagine e costo del calcolo.** Da seicento a
      cinquantadue pezzi i confronti calano di centotrenta volte, ma il lavoro
      totale di undici volte e mezzo; il quadrato prevale solo a decine di
      migliaia di pezzi.

  - tipo: corretto
    pagina: VisioneLinguaggio/innestare-gli-occhi.md
    testo: >
      **Testo alternativo della figura dei connettori.** Riportava quattro
      milioni di parametri, cifra della prima versione del modello; ora riporta
      lo stesso valore di disegno e didascalia.

  - tipo: corretto
    pagina: VisioneLinguaggio/risoluzione-e-dettaglio.md
    testo: >
      **Riquadri di ricapitolazione sulla risoluzione.** Non affermano più che
      riordinare le tessere non perda nulla: la misura del posto in cui farle
      stare decide che cosa passa.

  - tipo: corretto
    pagina: Agenti/overview.md
    testo: >
      **Istruzioni nel prompt e datazione degli agenti.** Seguire istruzioni è
      una capacità emersa con la scala, che non basta da sola a rendere
      possibili gli agenti; ReAct è dell'ottobre 2022, e il 2023-2024 indica la
      diffusione.

  - tipo: corretto
    pagina: Agenti/agenti-e-tool-use.md
    testo: >
      **Calcolatore protetto e modello finto negli agenti.** Il calcolatore
      rifiuta ora `True` come numero; il modello finto dichiara di non sapere
      quando la ricerca va a vuoto, invece di inventare la risposta.

  - tipo: corretto
    pagina: Agenti/agenti-e-tool-use.md
    testo: >
      **Rilettura degli errori da parte dell'agente.** La tecnica non migliora
      sempre la quota di problemi risolti al primo tentativo: su un banco di
      programmazione la quota scende, e la pagina riporta i due numeri.

  - tipo: corretto
    pagina: Agenti/rag-avanzato.md
    testo: >
      **Soglia del filtro nel RAG avanzato.** Il criterio ha un minimo assoluto
      oltre alla metà del punteggio migliore, così che una ricerca senza
      passaggi pertinenti, con punteggi tutti nulli, non lasci passare tutto.

  - tipo: corretto
    pagina: Agenti/architetture-e-valutazione.md
    testo: >
      **Banco di prova per la programmazione e versione ripulita.** La versione
      ripulita non è più presentata come rimedio: il riesame da cui provengono i
      numeri sui difetti dice che si ritrovano anche lì.

  - tipo: corretto
    pagina: Agenti/context-engineering.md
    testo: >
      **Notazione della probabilità di errore e descrizione della figura del
      contesto.** La lettera $p$ non indica più tre grandezze; la descrizione
      riporta che l'ultimo segmento, lo spazio per la risposta, è più stretto
      del precedente.

  - tipo: corretto
    pagina: ModelliEnergia/memoria-associativa.md
    testo: >
      **Confronto con lo zero nella memoria associativa.** In virgola mobile i
      legami non tornavano a zero esatto e la regola di parità non si applicava;
      riparato, le sei misure sono rifatte su tre semi.

  - tipo: corretto
    pagina: ModelliEnergia/memoria-associativa.md
    testo: >
      **Capienza della rete di Hopfield e rete di Little.** Il valore $0{,}138$
      sta nell'articolo del 1985, e $0{,}14$ ne è l'arrotondamento nel sommario;
      i neuroni di Little si accendono con probabilità crescente, non oltre una
      soglia netta.

  - tipo: corretto
    pagina: ModelliEnergia/memoria-associativa.md
    testo: >
      **Conteggio dei cambiamenti nella figura della memoria associativa.**
      L'ultimo pannello include l'ultimo capovolgimento, così che i sei
      cambiamenti annunciati dal testo coincidano con quelli disegnati.

  - tipo: corretto
    pagina: ModelliEnergia/overview.md
    testo: >
      **Documento di posizione del 2022 e seconda rinuncia.** La frase riportata
      fra virgolette non compare nel documento: il testo enuncia ora la tesi e
      attribuisce al documento l'argomento disteso, mentre la formulazione secca
      viene dalle conferenze.

  - tipo: corretto
    pagina: ModelliEnergia/oltre-la-partizione.md
    testo: >
      **Passaggio fra le due immagini dell'energia.** Il passaggio dalla pioggia
      totale all'altezza aggiunta in ogni punto è ora scritto: scendere di un
      gradino non aggiunge pioggia, la moltiplica.

  - tipo: corretto
    pagina: ModelliEnergia/paesaggi-di-oggi.md
    testo: >
      **Esponente dell'energia di Hopfield e formula di partenza.** L'idea del
      2016 riporta nel deep learning un filone di fisica statistica degli anni
      Ottanta; la formula in cui ogni ricordo abbassa l'energia è ora scritta
      dove nasce.

  - tipo: corretto
    pagina: SerieTemporali/componenti-e-classici.md
    testo: >
      **Riduzione dell'errore nelle componenti classiche.** Da $2{,}49$ a
      $1{,}49$ la riduzione è del quaranta per cento, due quinti, e non un
      terzo.

  - tipo: corretto
    pagina: SerieTemporali/componenti-e-classici.md
    testo: >
      **Scala dei pannelli nella scomposizione di una serie.** La didascalia
      dichiara che ogni pannello ha la propria scala verticale: nella serie in
      alto la stagione vale circa tre volte e mezzo il residuo.

  - tipo: corretto
    pagina: SerieTemporali/componenti-e-classici.md
    testo: >
      **Box e Jenkins e fattori di lisciamento.** Box e Jenkins ebbero per primi
      la procedura di scelta del modello, non la prima procedura applicabile (il
      lisciamento esponenziale è del 1957); il terzo fattore dipende dal primo.

  - tipo: corretto
    pagina: SerieTemporali/overview.md
    testo: >
      **Incertezza della previsione a più passi.** Si sommano i contributi delle
      sorprese, pesati da coefficienti che si smorzano, e non le sorprese
      stesse; per questo la banda di una serie stazionaria si assesta.

  - tipo: corretto
    pagina: SerieTemporali/validazione-e-feature.md
    testo: >
      **Copertura delle bande di previsione.** Il degrado a orizzonti lontani
      deriva dall'errore sui parametri stimati e non dall'accumulo di
      incertezza; la copertura empirica non va minimizzata né massimizzata, ma
      coincidere con il livello dichiarato.

  - tipo: corretto
    pagina: SerieTemporali/forecasting-neurale.md
    testo: >
      **Ampiezza della banda nel forecasting neurale.** Al quinto giorno la
      banda stampata (3,166) raggiunge il 98,8 per cento del limite (3,204); il
      99,7 si riferisce alla banda teorica, e la frase lo dichiara.

  - tipo: corretto
    pagina: AutoSupervisione/collasso-e-misura.md
    testo: >
      **Tetto di informazione nei metodi contrastivi.** Con lotti da quattromila
      immagini i candidati sono 8191, quindi il tetto è tredici bit e non
      dodici, in accordo con il capitolo sulla visione artificiale.

  - tipo: corretto
    pagina: AutoSupervisione/famiglie.md
    testo: >
      **Diagonale della matrice nell'esperimento contro il collasso.** La
      diagonale supera il valore massimo imposto dal rumore perché il proiettore
      si adatta agli esempi visti; il codice rimisura ora su esempi mai visti,
      dove il valore rientra.

  - tipo: corretto
    pagina: AutoSupervisione/capire-e-accorciare.md
    testo: >
      **Teorema di codifica di sorgente e coefficienti.** Il teorema riguarda la
      lunghezza attesa, e la codifica aritmetica raggiunge la disuguaglianza su
      una stringa data; i coefficienti sono $-0{,}935$, $-0{,}937$ e $-0{,}953$,
      e l'intervallo è arrotondato verso l'esterno.

  - tipo: corretto
    pagina: AutoSupervisione/capire-e-accorciare.md
    testo: >
      **Compressione congiunta e compressore ideale.** Comprimere due cose
      insieme non costa più che separatamente solo per il compressore ideale: è
      un'ipotesi e non un risultato, e la condizione compare ora anche nel
      riassunto.

  - tipo: corretto
    pagina: AutoSupervisione/overview.md
    testo: >
      **Riquadro finale dell'auto-supervisione.** I bit citati riguardano una
      finestra di parole e non mezza fotografia, grandezze che differiscono di
      un fattore quattro; il riquadro è riallineato al testo.

  - tipo: corretto
    pagina: AutoSupervisione/dibattito-rl.md
    testo: >
      **Passi sbagliati nella figura sul credito.** Il testo alternativo ne
      contava quattro, la figura ne mostra cinque; nella stessa sezione i passi
      di una prova riuscita ricevono lo stesso coefficiente, non la stessa
      spinta.

  - tipo: corretto
    pagina: Interpretabilita/spiegazioni-locali.md
    testo: >
      **Controfattuali, Shapley e studio sulla fiducia.** La distanza
      controfattuale divide ogni caratteristica per la sua dispersione tipica;
      Shapley nel 1953 fissò tre requisiti e non quattro; gli studenti
      dell'esperimento sulla fiducia erano già laureati.

  - tipo: corretto
    pagina: Interpretabilita/attribuzione-e-meccanicistica.md
    testo: >
      **Pesi di attenzione e controlli di sanità.** Chi li ha misurati scrive
      che si comportano meglio, non che siano assolti; il metodo detto fallire
      del tutto il controllo non lo fallisce nella versione corrente del lavoro.

  - tipo: corretto
    pagina: Interpretabilita/overview.md
    testo: >
      **Mappa di salienza e livelli di valutazione.** Le macchie sulla
      fotografia del lupo non sono una mappa di salienza, che la sezione
      dedicata definisce altrimenti; i tre livelli di rigore sono elencati in
      ordine crescente.

  - tipo: corretto
    pagina: Interpretabilita/modelli-trasparenti-e-importanza.md
    testo: >
      **Importanza per permutazione e valori negativi.** Quando rimescolare una
      colonna migliora le risposte, la causa è la scarsità dei dati e non il
      caso: il margine dichiarato misura la dispersione fra ripetizioni, non
      l'incertezza della media.

  - tipo: corretto
    pagina: Interpretabilita/modelli-trasparenti-e-importanza.md
    testo: >
      **Ripartizione del merito fra due colonne.** Un'unica estrazione non regge
      una ripartizione in parti: su otto semi i valori si spostano troppo;
      restano i due meccanismi che nel numero si sommano.

  - tipo: ampliato
    pagina: Interpretabilita/modelli-trasparenti-e-importanza.md
    testo: >
      **Accuratezze del confronto fra modello leggibile e opaco.** Le due
      accuratezze e la differenza di un punto e tre sono ora stampate dalla
      pagina.

  - tipo: corretto
    pagina: IngegneriaLLM/loop-engineering.md
    testo: >
      **Glossa della formula sull'affidabilità a catena.** A essere elevata a
      potenza è la probabilità di sbagliare un passo e non di riuscirvi: con
      errore del cinque per cento, venti passi riescono trentasei volte su
      cento.

  - tipo: corretto
    pagina: IngegneriaLLM/prompt-engineering.md
    testo: >
      **Etichetta del materiale e istruzioni nel prompt.** L'etichetta indica da
      dove viene il testo e non lo mette al sicuro: un modello non distingue i
      dati dai comandi, ed è per questo che l'attacco funziona.

  - tipo: corretto
    pagina: IngegneriaLLM/prompt-engineering.md
    testo: >
      **Mappa delle tecniche di prompt.** Il guadagno di una meta-analisi non
      vale per la tecnica che essa esclude dal conteggio, e il ruolo di esperto
      mondiale non è misurato da nessuna delle due fonti.

  - tipo: corretto
    pagina: IngegneriaLLM/prompt-engineering.md
    testo: >
      **Somma delle prime tre voci nel prompt engineering.** Le prime tre voci
      scendono a settantanove e mezzo, che arrotondato dà ottanta: la frase è
      ora vera sia sul conto sia sulle barre.

  - tipo: corretto
    pagina: IngegneriaLLM/context-engineering.md
    testo: >
      **Foglio di appunti nel context engineering.** Lo stesso nome indicava tre
      cose in due pagine (spazio nella finestra, stato esterno, il suo
      contrario): ogni uso ha ora il proprio nome.

  - tipo: corretto
    pagina: IngegneriaLLM/overview.md
    testo: >
      **Condizioni nei riquadri di sintesi dell'ingegneria dei modelli
      linguistici.** Ripristinate le riserve sull'indipendenza fra i passi,
      sulla fedeltà della catena di ragionamento e sulla validità di una misura
      per un solo modello; parlare bene al modello non è gratis.

  - tipo: corretto
    pagina: SpeechRecognition/modelli-asr.md
    testo: >
      **Allineamenti del trasduttore.** Sono $\binom{T+U-1}{U}$ e non
      $\binom{T+U}{U}$, perché l'ultimo passo chiude l'ultimo istante; cinquanta
      per undici fa cinquecentocinquanta, non «poche centinaia».

  - tipo: corretto
    pagina: SpeechRecognition/modelli-asr.md
    testo: >
      **Decodifica semplice e ripetizioni.** La decodifica che a ogni passo
      prende il simbolo più probabile non è la «decodifica del percorso
      migliore»: il lavoro citato la nomina per la tendenza a incepparsi
      ripetendo.

  - tipo: corretto
    pagina: SpeechRecognition/modelli-asr.md
    testo: >
      **Didascalia del simbolo vuoto e distanza di edit.** La rete può non
      assegnare alcun simbolo a un istante, ed è il motivo del simbolo vuoto; la
      distanza di edit, già spiegata altrove, è richiamata e non reintrodotta.

  - tipo: corretto
    pagina: SpeechRecognition/sintesi-vocale.md
    testo: >
      **Frequenza di campionamento del generatore d'onda.** Il modello che
      produce un campione alla volta ne genera sedicimila al secondo, come nel
      suo articolo e nel capitolo sull'audio; i ventiquattromila appartengono a
      un altro modello.

  - tipo: corretto
    pagina: SpeechRecognition/sintesi-vocale.md
    testo: >
      **Confronto fra punteggi e dilatazione delle convoluzioni.** I ventotto
      centesimi di scarto confrontano raccolte, voci e frequenze diverse e non
      sono una differenza valida; la dilatazione raddoppia fino a un limite, poi
      ricomincia.

  - tipo: corretto
    pagina: SpeechRecognition/overview.md
    testo: >
      **Punteggio acustico e linguistico.** Le due valutazioni si moltiplicano e
      non si compongono in un compromesso: basta che una scarti una frase perché
      la frase esca di gara.

  - tipo: corretto
    pagina: GraphNeuralNetwork/overview.md
    testo: >
      **Antibiotico del 2020 e ponti di Königsberg.** Il primo firmatario del
      lavoro sull'antibiotico è Jonathan Stokes, nel gruppo di James Collins e
      Regina Barzilay; la memoria di Euler fu presentata nel 1735 e stampata sei
      anni dopo.

  - tipo: corretto
    pagina: GraphNeuralNetwork/architetture-applicazioni.md
    testo: >
      **Grafo delle strade nella stima dei tempi.** Due segmenti sono collegati
      anche, e per primo, quando si susseguono sulla stessa strada, non soltanto
      agli incroci.

  - tipo: corretto
    pagina: GraphNeuralNetwork/architetture-applicazioni.md
    testo: >
      **Garanzia di iniettività della rete di potere distintivo massimo.** Lo
      scalare appreso della variante più diffusa è fissato a zero, valore che il
      corollario non copre: è una scelta sperimentale e non una conseguenza del
      teorema.

  - tipo: corretto
    pagina: GraphNeuralNetwork/message-passing.md
    testo: >
      **Costo del filtro polinomiale sul grafo.** Costa un prodotto fra matrice
      sparsa e vettore per ogni grado, quindi cresce col grado; la forma
      precedente vale solo per polinomi di primo grado.

  - tipo: corretto
    pagina: GraphNeuralNetwork/message-passing.md
    testo: >
      **Glosse sulla normalizzazione per i gradi.** La configurazione più liscia
      assegna a ciascun nodo un valore crescente con i suoi vicini, e su una
      stella il centro vale più del doppio di una punta.

  - tipo: corretto
    pagina: GraphNeuralNetwork/message-passing.md
    testo: >
      **Massimo come terzo modo di aggregare i messaggi.** Somma, media e
      massimo sono ora tutti trattati nella scena, in accordo con il riquadro
      riepilogativo.

  - tipo: corretto
    pagina: GraphNeuralNetwork/knowledge-graph.md
    testo: >
      **Conto dei fatti nei grafi di conoscenza.** Eliminato dal testo il numero
      «tre», in contrasto con i tre fatti diversi elencati nella scheda
      avanzata; gli esempi restano.

- versione: "1.12.1"
  data: 2026-08-31
  voci:

  - tipo: corretto
    testo: >
      **Revisione di rimandi, glosse e numeri.** Rimandi portati al bersaglio
      giusto, glosse riallineate alle formule che commentano e numeri verificati
      sui blocchi che li stampano; diradate le contrapposizioni in Matematica e
      nei sistemi multi-agente.

  - tipo: corretto
    pagina: GAN/come-funziona.md
    testo: >
      **Discriminatore giocattolo nelle GAN.** Il gradiente è letto per ciò che
      indica; la conversione fra perdita e frequenza dà un minimo e non un
      massimo; raddrizzato un verso di metrica.

  - tipo: corretto
    pagina: ModelliLatenti/comprimere-e-ricostruire.md
    testo: >
      **Affermazioni su autoencoder e compressione.** La non linearità serve nel
      decoder e non da entrambe le parti; il rapporto di compressione è reso
      coerente (cinquanta e quarantotto); la PCA probabilistica ha la media.

  - tipo: corretto
    pagina: VerosimiglianzaEsatta/a-che-serve.md
    testo: >
      **Citazione nella pagina sulla verosimiglianza esatta.** Le virgolette
      omettevano il soggetto, la densità appresa dai modelli a flusso; la
      citazione è ripresa dal testo originale.

  - tipo: corretto
    pagina: WorldModels/mondi-in-miniatura.md
    testo: >
      **Temperatura e punteggio nei world model.** Alla temperatura più alta
      l'agente impara meno bene, non smette di imparare: il punteggio resta
      sopra la soglia, ben oltre una politica casuale, e a cambiare è la
      deviazione standard.

- versione: "1.12.0"
  data: 2026-08-30
  voci:

  - tipo: nuovo
    pagina: DeepLearning/meta-apprendimento.md
    testo: >
      **Meta-apprendimento.** Nuova sezione: scegliere una posizione di partenza
      da cui pochi passi bastano su un compito mai visto, con il conto che lo
      dimostra.

  - tipo: nuovo
    pagina: DeepReinforcementLearning/gerarchia.md
    testo: >
      **Apprendimento per rinforzo gerarchico.** Nuova sezione sulle opzioni,
      sulla scala di tempo delle decisioni e sulla ragione per cui scegliere
      meno spesso può far imparare di più.

  - tipo: ampliato
    pagina: DeepLearning/ottimizzazione-regolarizzazione.md
    testo: >
      **Spiegazione di concetti prima solo accennati.** Label smoothing,
      Thompson sampling, teacher forcing ed exposure bias, test d'ipotesi e
      p-value con le correzioni per confronti multipli, nelle sezioni in cui
      servono.

  - tipo: ampliato
    pagina: SerieTemporali/componenti-e-classici.md
    testo: >
      **Concetti aggiunti nelle serie temporali e altrove.** L'orizzonte di un
      MA(q), la passeggiata aleatoria, ROUGE accanto a BLEU, il curriculum e il
      self-play negli agenti che imparano insieme, l'ordinamento per perdita fra
      le metriche.

  - tipo: ampliato
    pagina: Matematica/algebra-lineare.md
    testo: >
      **Presupposti di matematica spiegati.** Decomposizione ai valori singolari
      e rango basso, calibrazione con temperature scaling, filtro di Kalman,
      modelli lineari generalizzati: regressione lineare, logistica e di Poisson
      sono la stessa macchina.

  - tipo: corretto
    testo: >
      **Rimandi, formule e termini corretti in più capitoli.** Rimandi a
      destinazioni inesistenti, termini usati prima di essere spiegati, due
      formule errate e un'affermazione vera in aritmetica esatta ma falsa
      eseguendo la pagina.

- versione: "1.11.0"
  data: 2026-08-30
  voci:

  - tipo: nuovo
    pagina: Matematica/sistemi-lineari.md
    testo: >
      **Cinque sezioni nuove nel capitolo di matematica.** Sistemi lineari,
      proiezioni e minimi quadrati, determinante come volume, disuguaglianze
      indipendenti dalla distribuzione e catene di Markov; il capitolo arriva a
      undici sezioni.

  - tipo: nuovo
    pagina: ModelliDiffusione/sde-e-ode.md
    testo: >
      **Diffusione: dal limite continuo alla generazione in un passo.** Sei
      sezioni nuove su equazioni differenziali, flow matching, campionatori
      veloci, generatori a un passo, condizionamento e diffusione su stati
      discreti.

  - tipo: corretto
    pagina: ModelliDiffusione/guida.md
    testo: >
      **Forza della guida nella diffusione.** Alzarla non equivale a campionare
      da una distribuzione inclinata: sul banco di prova esatto i campioni se ne
      discostano, e il divario si concentra a metà percorso.

  - tipo: corretto
    testo: >
      **Diradamento della costruzione «non è X, è Y».** In tutto il libro la
      contrapposizione resta dove mette in guardia da un errore reale e si
      riduce altrove.

- versione: "1.10.5"
  data: 2026-08-25
  voci:

  - tipo: corretto
    pagina: Matematica/analisi-ottimizzazione.md
    testo: >
      **Tre correzioni nel capitolo di matematica.** La sigmoide non restituisce
      probabilità con somma uno, la softmax sì; un punto di sella richiede
      almeno due dimensioni; il gradiente taglia ad angolo retto le curve di
      livello.

  - tipo: corretto
    pagina: Matematica/teoria-informazione.md
    testo: >
      **Bit di un dado e numero di domande.** Le domande sono intere: su un tiro
      la strategia migliore ne usa in media due e due terzi, e solo su molti
      tiri si raggiungono i 2,585 bit.

  - tipo: corretto
    pagina: Matematica/probabilita-statistica.md
    testo: >
      **Teorema del limite centrale e intervalli di confidenza.** Esplicitata
      l'ipotesi, nessun contributo enormemente più grande degli altri messi
      insieme; nella figura il terzo modello dista dagli altri due più
      dell'incertezza della misura.

  - tipo: corretto
    pagina: Matematica/matematica-llm.md
    testo: >
      **Specializzazione delle teste di attenzione.** Che copie ridondanti
      costino accuratezza è un'ipotesi e non un risultato: da un modello
      addestrato se ne può togliere una quota grande senza perdite misurabili,
      come mostrano i lavori citati.

  - tipo: corretto
    testo: >
      **Simboli e figure nel capitolo di matematica.** I simboli presenti solo
      nella scheda avanzata sono sciolti nelle didascalie; in due figure una
      scritta non esce più dal margine né ne copre un'altra.

  - tipo: corretto
    testo: >
      **Riquadri e blocchi di codice in stampa.** Nessuna cornice vuota in fondo
      alla pagina; i blocchi di codice spezzati lo indicano; i tre fermi
      immagine delle animazioni sono dichiarati tre istanti dello stesso
      movimento.

- versione: "1.10.4"
  data: 2026-08-25
  voci:

  - tipo: corretto
    testo: >
      **Codice copiabile nel PDF.** Le coppie di simboli non si uniscono più in
      un solo segno: `!=`, `>=` e `->` restano tali in pagina e nel testo
      selezionato.

  - tipo: corretto
    testo: >
      **Distinzione dei blocchi da eseguire e da leggere.** Gli esempi con nomi
      di comodo, file inesistenti o modelli costruiti altrove lo dichiarano,
      online e in stampa.

  - tipo: corretto
    pagina: Python/basi.md
    testo: >
      **Presupposti di programmazione in Python.** Scrivere in una tabella,
      ricerca in un dizionario e in una lista, copia di una lista e lettura di
      un messaggio d'errore sono ora in entrambi i livelli.

  - tipo: corretto
    pagina: Python/overview.md
    testo: >
      **Velocità di NumPy.** Il guadagno non viene dal contenitore ma dal costo
      che Python paga a ogni giro di un ciclo, pagato una volta sola sul blocco
      intero.

  - tipo: corretto
    pagina: Python/numpy.md
    testo: >
      **Riquadri di ripasso in NumPy.** La regola del broadcasting è enunciata
      in accordo con l'esempio; PyTorch non è più in cima alla torre delle
      librerie; aggiunti mutabilità, viste di NumPy e Matplotlib.

  - tipo: corretto
    testo: >
      **Numeri e fonti nel capitolo di Python.** La media di gruppo ignora i
      valori mancanti nel divisore; riferimento a Rubin per i dati mancanti;
      costo del Python senza lucchetto dalla documentazione ufficiale; PyTorch
      del 2016.

  - tipo: corretto
    pagina: GAN/come-funziona.md
    testo: >
      **Derivazione del valore di una GAN in stampa.** La formula che riscrive
      il secondo integrale nello spazio dei dati va a capo sull'uguale e non
      esce più dal margine.

- versione: "1.10.3"
  data: 2026-08-24
  voci:

  - tipo: corretto
    pagina: Introduzione/overview.md
    testo: >
      **Definizione di intelligenza artificiale.** Riguarda i compiti per cui
      nessuno sa scrivere una ricetta valida nel mondo reale: esclude la
      lavatrice, include i sistemi esperti, il cui fallimento diventa la
      premessa del capitolo.

  - tipo: corretto
    pagina: Introduzione/overview.md
    testo: >
      **Riordino dell'Introduzione.** Il blocco filosofico e le tre discipline
      sulla decisione precedono Turing; la funzione obiettivo ha una sezione
      propria; ARGO è motivata dall'assenza di apprendimento al suo interno.

  - tipo: corretto
    testo: >
      **Rinvii con destinazione esplicita.** Nell'Introduzione il rimando sui
      Transformer è un collegamento, in World Model il collasso rimanda alla
      sezione sulle JEPA, in Ricerca e pianificazione la promessa è stata tolta.

  - tipo: corretto
    testo: >
      **Licenza nei PDF per capitolo.** Ogni file per capitolo riporta a piè di
      pagina le condizioni d'uso, che il libro intero scrive nel colophon.

  - tipo: corretto
    testo: >
      **Comando di esecuzione nelle pagine notebook.** Il comando che esegue il
      codice è fra i pulsanti in cima alla pagina; da telefono sta accanto al
      marchio.

- versione: "1.10.2"
  data: 2026-08-23
  voci:

  - tipo: ampliato
    pagina: prefazione.md
    testo: >
      **Posizione del libro nella prefazione.** La prefazione dichiara la scelta
      del libro: meno fiducia nelle istruzioni scritte nel prompt, più
      architetture, iperparametri e funzioni di costo.

  - tipo: corretto
    pagina: prefazione.md
    testo: >
      **Prefazione più concisa e riconoscimento di un debito.** Il segno del
      libro nomina «Gödel, Escher, Bach», da cui vengono la lettura della figura
      come anello che torna su sé stesso e l'idea di spiegare ogni cosa due
      volte.

  - tipo: corretto
    testo: >
      **Fonti degli strumenti nominati.** PyTorch, TensorFlow, Keras e Hugging
      Face compaiono in bibliografia con l'articolo degli autori e un indirizzo
      di approfondimento.

- versione: "1.10.1"
  data: 2026-08-22
  voci:

  - tipo: corretto
    testo: >
      **Corrispondenza fra i due livelli.** Nelle scene del livello Elementare
      sono riportate le mosse presenti solo nel Superiore: condizione di
      validità di una garanzia, caso di rottura del metodo, conto commentato dal
      testo.

  - tipo: corretto
    testo: >
      **Errori di merito corretti.** L'indice di Davies-Bouldin si minimizza; la
      perplessità scende con frasi più prevedibili; la proiezione non è il
      prodotto scalare; `top_p` sceglie quanta classifica resta.

  - tipo: corretto
    testo: >
      **Ipotesi esplicitate accanto alle formule.** Una mistura di due gaussiane
      è bimodale solo se i centri distano più di due deviazioni standard; la
      simmetria di Shapley chiede meno; l'equivarianza nei grafi richiede
      l'indipendenza dall'ordine.

  - tipo: corretto
    pagina: AIResponsabile/overview.md
    testo: >
      **Paradosso dell'equità al primo livello.** Nel caso COMPAS le due parti
      hanno ragione entrambe: il conflitto deriva dalle frequenze diverse nei
      due gruppi, e la scena del tribunale arriva fin qui.

  - tipo: corretto
    pagina: Audio/generazione-audio.md
    testo: >
      **Capoverso e titolo ripristinati in Audio e Ricerca.** In generazione
      audio il paragrafo su Jukebox e AudioLM torna prosa dopo essere stato
      impaginato come codice; in ricerca ad albero un titolo di sezione ha il
      livello corretto.

  - tipo: corretto
    testo: >
      **Notazione: una lettera, un significato.** Rinominati i simboli con
      doppio uso nella stessa pagina: sequenza di token e vettore continuo,
      latenza e durata, modello bozza e intero quantizzato, precisione e
      probabilità.

- versione: "1.10.0"
  data: 2026-08-20
  voci:

  - tipo: nuovo
    pagina: MachineLearning/svm-kernel.md
    testo: >
      **Kernel trick in una pagina propria.** La sezione sulla Support Vector
      Machine è divisa in due: il margine massimo da una parte; kernel trick,
      regressione, rilevamento di anomalie e uso con scikit-learn dall'altra.

  - tipo: nuovo
    pagina: DeepReinforcementLearning/mcts-alphago.md
    testo: >
      **Ricerca ad albero Monte Carlo, AlphaGo e allineamento dei modelli
      linguistici.** Trattati in una pagina propria, separata dal gradiente di
      policy, che ora si conclude con PPO e con i riquadri finali.

  - tipo: nuovo
    pagina: NaturalLanguageProcessing/oltre-il-bpe.md
    testo: >
      **Oltre il BPE.** Nuova pagina su WordPiece, SentencePiece e
      tokenizzazione a byte, con quattro conseguenze pratiche: numeri spezzati,
      costo in token dell'italiano, spazio superfluo, vocabolario congelato. Il
      BPE resta nella pagina d'origine.

  - tipo: ampliato
    pagina: Python/basi.md
    testo: >
      **Lettura dei traceback e gestione delle eccezioni.** Le basi di Python
      spiegano come leggere un errore e come proteggere la riga fragile con un
      `try`/`except` mirato, secondo lo stile del chiedere scusa anziché del
      chiedere permesso.

  - tipo: ampliato
    testo: >
      **Cinque figure nuove.** Apprendimento contrastivo, spettrogramma
      dell'AST, parte mascherata di wav2vec, generazione audio a token; AlexNet
      ridisegnata con i due rami su GPU che comunicano soltanto in alcuni punti.

- versione: "1.9.4"
  data: 2026-08-20
  voci:

  - tipo: ampliato
    pagina: DeepReinforcementLearning/dqn.md
    testo: >
      **Replay con priorità e rete a due rami in DQN.** Aggiunta la sezione
      sulle due migliorie, con formule e fonti, la correzione dei pesi di
      campionamento e il richiamo a Rainbow, che le combina.

  - tipo: ampliato
    pagina: prefazione.md
    testo: >
      **Triangolo impossibile nella Prefazione.** Accanto al passaggio sul segno
      del libro è inserita l'illustrazione grande dei suoi tre tracciati, da
      osservare un angolo alla volta.

  - tipo: corretto
    testo: >
      **Rifiniture di lettura.** Nelle Conclusioni ogni capitolo citato è
      collegato con un link alla prima occorrenza soltanto; in due aperture di
      «Visione e linguaggio» si entra direttamente nella scena.

- versione: "1.9.3"
  data: 2026-08-20
  voci:

  - tipo: corretto
    pagina: prefazione.md
    testo: >
      **Correzioni in Prefazione, Conclusioni, Python, Ricerca e Visione e
      linguaggio.** Nella Prefazione la citazione di Anthropic rimanda al
      resoconto corretto e il teorema di Penrose ha due voci bibliografiche; i
      conti dei tre rapporti usano numeri verificati.

  - tipo: corretto
    pagina: Conclusioni/overview.md
    testo: >
      **Ripasso finale delle Conclusioni.** Allineato al libro attuale: cinque
      famiglie generative, capitoli recenti citati con link, rimando ad AlphaGo,
      coerenza fra i livelli sugli errori di un agente, riquadri prima del
      congedo.

  - tipo: corretto
    pagina: Ricerca/esplorare-lo-spazio.md
    testo: >
      **Parità dell'otto-tessere e attribuzioni nella Ricerca.** Corretto
      l'argomento di parità, che dimostrava il contrario di quanto affermava;
      indicati gli autori di IDA* e Monte Carlo Go, il punteggio di Deep Blue,
      il nome della potatura.

  - tipo: corretto
    pagina: Python/overview.md
    testo: >
      **Ambiente virtuale su Ubuntu e storia dei framework.** Indicato il
      componente mancante per il primo comando, l'uscita dall'ambiente e gli
      altri gestori; ripristinate le date (Theano precede AlexNet); la tabella
      delle vendite è generata dalla pagina.

  - tipo: corretto
    pagina: VisioneLinguaggio/allineare-due-spazi.md
    testo: >
      **Precisione dei risultati e rimandi in «Allineare due spazi».** Il
      divario fra i due gruppi è riportato alla precisione che il protocollo
      sostiene; corretti i rimandi e il conto di SigLIP, sedici domande al posto
      di otto interrogazioni.

  - tipo: ampliato
    testo: >
      **Formule aggiunte.** Equazione di Bellman per Q, RoPE e RMSNorm, word2vec
      e GloVe, gradiente di policy con GAE, riparametrizzazione di SAC, MMR e
      PSI sono ora scritti per esteso.

  - tipo: ampliato
    pagina: VisioneArtificiale/detection-segmentazione.md
    testo: >
      **Ancore, IoU e famiglia YOLO.** Precisato che il confronto con il
      riquadro vero esiste solo in addestramento e che in inferenza la IoU serve
      a eliminare i doppioni; aggiunta la storia di YOLO, con codice.

  - tipo: corretto
    testo: >
      **Numeri commentati stampati dal codice.** Escono ora da blocchi della
      pagina il conto del weight decay, il sorpasso dei banditi, i decimali del
      giudice di recensioni e il confronto della potatura con venti ordini
      casuali.

- versione: "1.9.2"
  data: 2026-08-20
  voci:

  - tipo: corretto
    testo: >
      **Aperture delle schede Elementari.** Meno inviti a immaginare: le schede
      entrano più spesso direttamente nella scena, e le analogie restano.

  - tipo: corretto
    testo: >
      **Immagine della catena di montaggio.** Sostituita dove era soltanto un
      modo di dire «una cosa dopo l'altra» da immagini scelte per il passaggio;
      resta dove regge, come nel capitolo sulla GPU e nella retropropagazione.

- versione: "1.9.1"
  data: 2026-08-20
  voci:

  - tipo: corretto
    testo: >
      **Correzioni di formule.** Risoluzione della trasformata a finestra,
      matrice condivisa della GAT, perdita del VQ-VAE, costo del calcolo a
      blocchi di Mamba-2, reticolo del trasduttore, penalità di gradiente delle
      GAN.

  - tipo: corretto
    testo: >
      **Numeri ricalcolati.** Ripartizione dei fallimenti della rete di
      Hopfield, punteggi di AST e V-JEPA 2, MOS di Tacotron 2, accuratezza di
      Hearsay-II, banda di previsione in «Forecasting neurale», ora stampata dal
      codice.

  - tipo: corretto
    testo: >
      **Coerenza fra schede Elementari e Superiori.** Riallineate le schede in
      «Verosimiglianza esatta», «Modelli latenti» e «Costo del coordinamento»;
      l'apertura delle PINN non attribuisce più l'idea a un lavoro che il
      capitolo fa risalire al 1994.

  - tipo: ampliato
    testo: >
      **Diciassette voci bibliografiche.** Aggiunte le fonti di lavori già
      nominati nel testo, tra cui la policy iteration di Howard, TRPO, DAgger,
      DistMult, ComplEx e RotatE.

  - tipo: corretto
    testo: >
      **Rimandi fra capitoli come link.** I richiami a capitoli e sezioni, per
      esempio alla backpropagation e agli ensemble, sono ora collegamenti
      diretti.

  - tipo: corretto
    testo: >
      **Revisione della prosa.** Ridotti i grassetti e le contrapposizioni del
      tipo «non è X, è Y»; le schede introducono direttamente la scena invece di
      annunciarla.

- versione: "1.9.0"
  data: 2026-08-19
  voci:

  - tipo: nuovo
    pagina: AutoSupervisione/capire-e-accorciare.md
    testo: >
      **Compressione e comprensione nell'auto-supervisione.** Nuova sezione sul
      perché prevedere bene richieda accorciare: complessità di Kolmogorov,
      rasoio di Occam in bit, argomento di Sutskever, misure di verifica, costo
      del vocabolario; con esperimento e figura animata.

  - tipo: corretto
    pagina: AutoSupervisione/capire-e-accorciare.md
    testo: >
      **Correzioni nella sezione sulla compressione.** Il 99% di iGPT su
      CIFAR-10 riguarda la rete rifinita, non il sondaggio a rete congelata
      (96,3%); corretti anche verosimiglianza, argomento di Sutskever e una
      frase autocontraddittoria.

  - tipo: corretto
    testo: >
      **Etichette delle figure.** In tre figure le etichette nere sono
      sostituite dal colore della curva corrispondente; in quella sulla
      compressione erano l'unica legenda.

- versione: "1.8.5"
  data: 2026-08-19
  voci:

  - tipo: corretto
    testo: >
      **Ricerca con testo già presente nel campo.** Corretto il caso in cui la
      finestra, aperta da un vecchio collegamento o al ritorno con il browser,
      non mostrava risultati: cerca ora subito il testo già scritto.

- versione: "1.8.4"
  data: 2026-08-19
  voci:

  - tipo: impianto
    testo: >
      **Ricerca incrementale.** I risultati compaiono a ogni tasto, raggruppati
      per pagina e capitolo, e portano alla singola sezione; apertura con Ctrl+K
      o ⌘K, navigazione da tastiera, termini evidenziati, suggerimento sui
      refusi.

  - tipo: corretto
    testo: >
      **Evidenziazione dei risultati di ricerca.** L'avviso «Nascondi i
      risultati della ricerca» compare solo se qualcosa è stato evidenziato, con
      il numero di corrispondenze; corretta l'evidenziazione, che sulle versioni
