- versione: "1.5.5"
  data: 2026-08-15
  voci:

  - tipo: corretto
    testo: >
      **Citazioni nelle didascalie del PDF.** In tre didascalie la citazione
      spezzava il rimando alla bibliografia nella versione a stampa; ora sta nel
      testo, e in un caso indica autori e anno degli insiemi di dati.


- versione: "1.5.4"
  data: 2026-08-15
  voci:

  - tipo: corretto
    testo: >
      **Leggibilità dei capitoli più tecnici.** Riscritti i passaggi più densi
