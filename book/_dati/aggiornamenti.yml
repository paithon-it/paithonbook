      PINN.** Un «92 %» dove la pagina misura 93, un «vent'anni» fra il 1994 e
      il 2019, affermazioni più forti delle fonti, promesse senza seguito.

  - tipo: corretto
    testo: >
      **Neretto ridotto in tutto il libro.** Segna un termine alla prima
      occorrenza, salvo dove una definizione serve a un capitolo successivo; le
      parole non cambiano.

- versione: "1.12.5"
  data: 2026-09-08
  voci:

  - tipo: nuovo
    pagina: Transformers/attenzione-in-pratica.md
    testo: >
      **L'attenzione in pratica.** Nuova sezione sui Transformer: costo della
      stessa formula in addestramento e in generazione, KV cache e varianti che
      la riducono (MQA, GQA, MLA), con i conti di memoria.

  - tipo: nuovo
    pagina: RetiNeurali/da-dove-viene-la-loss.md
    testo: >
      **Origine della funzione di perdita.** Nuova sezione sulle reti neurali:
      la perdita si ricava dalla distribuzione dichiarata sull'uscita, con
      minimi quadrati e cross-entropy come due casi della stessa costruzione.

  - tipo: corretto
    testo: >
      **Errori di fatto, termini anticipati e rimandi inesistenti.** Corretti un
      cancello attribuito al ramo sbagliato, un conto di memoria, una frase
      smentita dalla scheda gemella e i rimandi a sezioni che non esistono.

  - tipo: corretto
    testo: >
      **Neretto limitato alla prima occorrenza.** Il neretto segna un termine la
      prima volta che compare e non ritorna; le parole non cambiano.

- versione: "1.12.4"
