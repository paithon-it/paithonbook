- versione: "1.8.3"
  data: 2026-08-19
  voci:

  - tipo: corretto
    pagina: Matematica/analisi-numerica.md
    testo: >
      **Riproducibilità numerica fra calcolatori.** Corretta l'affermazione che
      due variabili d'ambiente rendano identiche le cifre: non vale per i
      prodotti fra matrici di PyTorch, quindi esecuzioni su macchine diverse si
      confrontano con una tolleranza.

- versione: "1.8.2"
  data: 2026-08-19
  voci:

  - tipo: corretto
    pagina: Python/overview.md
    testo: >
      **Definizione di SIMD.** Sciolta la sigla nel paragrafo sulla velocità di
      NumPy: una sola istruzione del processore che opera su più numeri insieme,
      quanti ne entrano nei registri.

  - tipo: corretto
    pagina: Matematica/analisi-numerica.md
    testo: >
      **Prerequisiti nella sezione sui due calcolatori.** Definiti SSE2, AVX2 e
      AVX-512 (registri da 128, 256 e 512 bit); tolto il riferimento anticipato
      a PyTorch; uniformata la precisione dei conti e alleggerita la chiusura.

- versione: "1.8.1"
  data: 2026-08-19
  voci:

  - tipo: ampliato
    pagina: Matematica/analisi-numerica.md
    testo: >
      **Risultati diversi dallo stesso codice su due calcolatori.** Nuova
      sezione: l'addizione in virgola mobile non è associativa e il kernel
      scelto dalla libreria fissa l'ordine delle somme; con esempio, definizione
      di kernel e variabili per fissare la scelta.

  - tipo: corretto
    pagina: Efficienza/meno-pesi.md
    testo: >
      **Potatura e quantizzazione rimisurate a kernel fissato.** Comporre le due
      leve costa 1,1 punti di accuratezza (prima 1,7); la rete potata del 90% ne
      perde meno di uno. La conclusione non cambia.

  - tipo: corretto
    testo: >
      **Verifica dei numeri stampati nel repository pubblico.** Il confronto fra
      i numeri delle pagine e quelli prodotti dal codice gira ora anche sulla
      copia pubblicata del libro.

- versione: "1.8.0"
  data: 2026-08-18
  voci:

  - tipo: nuovo
    pagina: MachineLearning/curve-al-posto-di-rette.md
    testo: >
      **Regressione spline e modelli additivi.** Nuova sezione: limiti del
      polinomio unico, spline con flessibilità localizzata e parametro di
      regolarizzazione, modelli additivi con una curva per colonna.

  - tipo: nuovo
    pagina: MachineLearning/il-bootstrap.md
    testo: >
      **Il bootstrap.** Nuova sezione sul metodo di Efron (1979) per stimare
      l'incertezza di una misura da un solo campione, e sui casi in cui
      fallisce: massimo, dati non indipendenti, campione raccolto male.

  - tipo: nuovo
    pagina: MachineLearning/modelli-generativi.md
    testo: >
      **Modelli generativi per la classificazione.** Nuova sezione su analisi
      discriminante lineare e quadratica e naive Bayes, con il confronto fra
      approccio generativo e discriminativo sui punti lontani dai dati
      osservati.

  - tipo: nuovo
    pagina: MachineLearning/valutare-un-raggruppamento.md
    testo: >
      **Valutazione di un raggruppamento.** Misure di qualità del clustering:
      l'indice più usato può preferire la risposta sbagliata, l'indice di Rand
      grezzo dà 0,9 al caso; un teorema del 2002 impone di dichiarare la scelta.

  - tipo: ampliato
    pagina: MachineLearning/alberi-ensemble.md
    testo: >
      **Uscite dei blocchi nel capitolo di Machine Learning.** Corretti due
      blocchi che misuravano i dati di un'altra pagina e un rilevatore di deriva
      che non segnalava scostamenti reali.

  - tipo: corretto
    testo: >
      **Correzioni alle sezioni nuove.** Corretti l'argomento della
      dimostrazione di un teorema, la provenienza non omogenea del più noto
      insieme di dati della statistica, la conclusione di un esperimento sulla
      copertura e un'animazione.

- versione: "1.7.0"
  data: 2026-08-18
  voci:

  - tipo: nuovo
    pagina: Efficienza/overview.md
    testo: >
      **Efficienza dei modelli.** Nuovo capitolo sulle tre leve per ridurre un
      modello (meno bit, meno pesi, distillazione) e sul loro costo misurato,
      che non sempre coincide con l'attesa.

  - tipo: nuovo
    pagina: Ricerca/overview.md
    testo: >
      **Ricerca prima dell'apprendimento.** Nuovo capitolo su albero dei futuri,
      stima della distanza dall'obiettivo e potatura dei rami, con le tre
      ipotesi che nel mondo reale spesso mancano e da cui muove il rinforzo.

  - tipo: nuovo
    pagina: ModelliLatenti/overview.md
    testo: >
      **Modelli a variabili latenti.** Nuovo capitolo: compressione con
      ricostruzione, rimedio ai buchi dello spazio latente (distribuzioni al
      posto di punti), applicazioni a codec audio, rinforzo, diffusione e world
      model.

  - tipo: ampliato
    testo: >
      **Rimandi e spiegazioni uniche dopo l'inserimento di tre capitoli.**
      Aggiornati numeri e rimandi, ora per nome del capitolo; quantizzazione,
      potatura e biglietto della lotteria hanno una sola spiegazione, richiamata
      altrove.

  - tipo: corretto
    testo: >
      **Correzioni nei capitoli nuovi.** Corretti la spiegazione elementare di
      A*, un conto di efficienza difforme da quello sulla GPU, un miglioramento
      dovuto al riavvio dell'ottimizzatore e non alla potatura, una frase
      imprecisa nella fonte.

- versione: "1.6.3"
  data: 2026-08-17
  voci:

  - tipo: corretto
    testo: >
      **Spiegazioni elementari corrette in auto-supervisione e modelli a
      energia.** Il collasso è fermato dalla coerenza fra due ritagli della
      stessa foto, non dal richiedere di non ripetersi; la descrizione locale
      del paesaggio energetico lascia indeterminata un'altezza per valle.

  - tipo: corretto
    testo: >
      **Allineamento fra livello Elementare e Superiore.** Corretti, fra gli
      altri, il passo di tempo dei modelli a spazio di stato, l'attenzione
      lineare, l'allineamento diretto e la verosimiglianza «esatta» di un
      flusso.

  - tipo: corretto
    pagina: prefazione.md
    testo: >
      **Chiusa della Prefazione.** Ripristinato il nesso fra le ultime due frasi
      e accorciato il paragrafo sul triangolo impossibile, che conserva il
      teorema e i tre isomorfismi che non si compongono.


- versione: "1.6.2"
  data: 2026-08-17
  voci:

  - tipo: ampliato
    pagina: prefazione.md
    testo: >
      **Il triangolo impossibile come segno del libro.** La Prefazione ne spiega
      la ragione: l'impossibilità è un teorema, i tre pezzi sono corretti e il
      difetto sta nella loro composizione, non in un luogo preciso.

  - tipo: corretto
    testo: >
      **Ultime formule della prima metà e cinque numeri.** Corretti la
      precisione media (la definizione elementare premiava un rilevatore quasi
      cieco), la ripartizione «due terzi e un terzo» in una rete e tre numeri di
      un confronto fra inizializzazioni.


- versione: "1.6.1"
  data: 2026-08-17
  voci:

  - tipo: corretto
    testo: >
      **Congedi di capitolo.** I capitoli non terminano più sull'elenco «Da
      ricordare»: chiude un breve raccordo che dice che cosa portare con sé e
      quale capitolo segue.

  - tipo: corretto
    testo: >
      **Simboli e glosse nelle formule.** Presentati i simboli usati senza
      definizione, distinte le lettere con due significati nello stesso
      capitolo, corretta una F1 di esempio calcolata con numeri di tabelle
      diverse.

  - tipo: corretto
    testo: >
      **Coerenza fra i livelli di lettura.** Riscritti i passaggi in cui la
      scheda Elementare affermava ciò che la Superiore smentiva, come la
      convergenza della discesa del gradiente da qualsiasi punto e
      l'assestamento graduale del percettrone.

  - tipo: nuovo
    pagina: Audio/generazione-audio.md
    testo: >
      **Figura animata sulla rappresentazione dello spartito.** In «Generazione
      audio» mostra la griglia che cresce a ogni sedicesimo anche senza eventi,
      mentre la rappresentazione a eventi resta ferma e poi salta.

  - tipo: corretto
    testo: >
      **Apertura di «Visione e linguaggio».** Il capitolo non ripete più
      l'aneddoto del 1966 di «Visione artificiale» e si apre con la pipa di
      Magritte (1929): il disegno non è la cosa.


- versione: "1.6.0"
  data: 2026-08-16
  voci:

  - tipo: nuovo
    pagina: AutoSupervisione/overview.md
    testo: >
      **Apprendimento auto-supervisionato.** Nuovo capitolo: i quattro modi di
      costruire il segnale senza etichette, il guasto comune (rispondere sempre
      la stessa cosa), i rimedi e il dibattito sul peso del rinforzo.

  - tipo: nuovo
    pagina: VerosimiglianzaEsatta/overview.md
    testo: >
      **Modelli a verosimiglianza esatta.** Nuovo capitolo sulle famiglie,
      autoregressive e a flussi, che assegnano un numero alla probabilità di un
      dato: costo e caso in cui probabilità alta e tipicità divergono.

  - tipo: nuovo
    pagina: WorldModels/inferenza-attiva.md
    testo: >
      **Inferenza attiva.** Sezione sull'agente che agisce per ridurre la
      propria sorpresa, alternativa di principio al rinforzo; il termine che
      nell'allineamento tiene un modello vicino a quello di partenza risulta
      formalmente lo stesso.

  - tipo: ampliato
    pagina: GAN/applicazioni-evoluzioni.md
    testo: >
      **StyleGAN e quantizzazione delle immagini.** Aggiunti la separazione fra
      stile e contenuto, l'artefatto a goccia rimasto un anno senza spiegazione
      e la quantizzazione in un vocabolario di simboli, ponte verso i modelli di
      linguaggio.

  - tipo: ampliato
    pagina: Audio/generazione-audio.md
    testo: >
      **Generazione dello spartito.** Confronto fra la rappresentazione a note e
      durate (venti kilobyte al minuto) e la registrazione (trenta megabyte):
      che cosa si guadagna, che cosa si perde, effetto della codifica sul tempo.

  - tipo: corretto
    testo: >
      **Correzioni di numeri e formule.** Corretti, fra gli altri, un rapporto
      errato di cento volte, una memoria sovrastimata di otto volte e un fattore
      invertito in una formula, giusta nella scheda Superiore e rovesciata
      nell'Elementare.

  - tipo: corretto
    testo: >
      **Apostrofi nella composizione del PDF.** Il compositore rendeva
      l'apostrofo a fine parola come una virgoletta doppia («un po” meno»);
      corretti in tutto il libro.

  - tipo: corretto
    testo: >
      **Aperture e congedi dei capitoli.** Citazione di Galileo sostituita con
      il passo del Saggiatore; matematica apre con von Neumann e Shannon;
      corretta l'affermazione sugli agenti; i congedi sostituiscono gli elenchi
      finali.


- versione: "1.5.8"
  data: 2026-08-15
  voci:

  - tipo: ampliato
    pagina: Introduzione/overview.md
    testo: >
