      partita giocare.

  - tipo: corretto
    testo: >
      **Descrizione uniforme del libro.** Copertina del PDF, anteprima di
      condivisione e titolo delle pagine riportano la stessa frase, prima in tre
      versioni; dalla home il libro si apre anche nel browser.


- versione: "1.5.7"
  data: 2026-08-15
  voci:

  - tipo: ampliato
    testo: >
      **Lettura nel browser e DOI.** Accanto al download del PDF un secondo
      pulsante apre il libro pagina per pagina; il DOI, identificativo
