  - tipo: ampliato
    testo: >
      **Tre figure nuove.** Le quattro mosse che amministrano la finestra di
      contesto, le tre forme di una rete multi-compito e il righello che traduce
      l'entropia nel numero di facce di un dado equivalente.

  - tipo: corretto
    pagina: AIResponsabile/allineamento-e-governance.md
    testo: >
      **AI Act: pratiche vietate.** Aggiornato l'elenco: dal 2 dicembre 2026 il
      regolamento europeo del 24 luglio 2026 vieta anche i sistemi che generano
      materiale intimo non consensuale e materiale di abuso sessuale su minori.

  - tipo: corretto
    testo: >
      **Disegno in copertina del PDF.** Sotto il titolo compare una conca con
      curve di livello e la traiettoria calcolata della discesa, che richiama il
      gesto del gradiente.


- versione: "1.5.1"
  data: 2026-08-13
  voci:

  - tipo: corretto
    pagina: Introduzione/overview.md
    testo: >
      **Due ingressi dell'intelligenza artificiale nella vita quotidiana.**
      L'Introduzione distingue gli anni Dieci, in cui è entrata inosservata
      (traduttori, suggerimenti, volti), dal novembre 2022, quando con ChatGPT è
      diventata interlocutore; il salto era cominciato cinque anni prima.

  - tipo: corretto
    pagina: Introduzione/overview.md
    testo: >
      **Terminologia: inverni.** Le due pause dell'AI sono chiamate «inverni»,
      come nel capitolo sulle reti neurali, e non più «gelate».

- versione: "1.5.0"
  data: 2026-08-13
  voci:

  - tipo: nuovo
    testo: >
      **Versione PDF.** Il libro è scaricabile in un unico PDF impaginato come
      volume, con indice, numeri di pagina e aperture di capitolo; il link nella
      pagina di apertura punta all'ultima edizione.

  - tipo: nuovo
    testo: >
      **Fermi immagine delle animazioni nel PDF.** Per ogni figura animata il
      PDF riporta tre fotogrammi (inizio, metà, fine) e l'indirizzo della pagina
      in cui la figura si muove.

  - tipo: ampliato
    pagina: prefazione.md
    testo: >
      **Modalità di scrittura nella Prefazione.** La Prefazione dichiara come il
      libro è composto, spiega il sottotesto «due volte» e indica la scommessa
      che le correzioni diventino rare, versione dopo versione.

  - tipo: impianto
    pagina: prefazione.md
    testo: >
      **Prefazione come parte autonoma.** La Prefazione esce da «Fondamenta» e
      apre il libro in una nuova parte dell'indice, «Prima di cominciare».

  - tipo: corretto
    pagina: Matematica/algebra-lineare.md
    testo: >
      **Caratteri delle figure.** Le etichette delle figure usano ora i
      caratteri del progetto e non quelli generici del sistema del lettore, e
      risultano uguali per tutti.

  - tipo: corretto
    pagina: NaturalLanguageProcessing/modelli-ngram.md
    testo: >
      **Formule in stampa in «Modelli n-gram».** Corrette quattro formule che il
      browser tollerava e la stampa no: tre sistemi di equazioni annidati male e
      una formula spezzata da un a capo.

- versione: "1.4.2"
  data: 2026-08-13
  voci:

  - tipo: ampliato
    pagina: MachineLearning/svm.md
    testo: >
      **Derivazione della Support Vector Machine.** Nuova sezione in cinque
      passi, sui due livelli: larghezza del margine e forma duale in cui i dati
      compaiono a coppie, base del kernel trick; segue la lezione di Winston.

  - tipo: ampliato
    pagina: MachineLearning/svm.md
    testo: >
      **Note storiche nella derivazione della SVM.** Due note riprendono i salti
      del conto segnalati da Winston; la sezione conclude che Vapnik aveva il
      kernel già nella tesi degli anni Sessanta e ne capì l'importanza
      trent'anni dopo.

- versione: "1.4.1"
  data: 2026-08-13
  voci:

  - tipo: ampliato
    testo: >
      **Sei figure animate.** Ciclo di addestramento con loss in discesa, due
      modi in cui il DQN rompe la correlazione, scan a raddoppio, agente con
      contesto crescente, spinta avversaria, residuo di una PINN.

  - tipo: corretto
    testo: >
      **Verifica numerica delle figure animate.** Ognuna delle sei calcola i
      numeri che mostra e non viene generata se non coincidono con quelli del
      capitolo; la figura della PINN addestra davvero per trentamila epoche.

  - tipo: corretto
    pagina: StateSpaceModel/mamba.md
    testo: >
      **Scan parallelo in Mamba.** Il testo attribuiva a Blelloch le operazioni
      della versione in fila, ma il codice è a raddoppio e ne fa di più: si
      guadagna sui turni, si paga in conti.

- versione: "1.4.0"
  data: 2026-08-12
  voci:

  - tipo: corretto
    testo: >
      **Correzioni in tutti i capitoli.** Il codice del libro viene ora eseguito
      e funziona.

  - tipo: corretto
    testo: >
      **Esempi di codice corretti.** Smentiti dal codice e corretti: la frase
      sulla negazione, le lettere dell'esempio BPE e l'analogia «re meno uomo
      più donna», che dà «re» senza escludere il punto di partenza.

  - tipo: corretto
    pagina: SistemiRaccomandazione/filtraggio-collaborativo.md
    testo: >
      **Valutazione nel filtraggio collaborativo.** L'esperimento misurava
      l'errore sui dati di addestramento; tenendo da parte un quinto dei voti
      l'errore passa da 0,019 a 0,418.

  - tipo: corretto
    pagina: PINN/come-funziona.md
    testo: >
      **Esempio delle PINN.** L'esempio non convergeva come dichiarato; ora
      mostra il caso che fallisce, una rete con il residuo più basso e la
      soluzione più sbagliata, con tre controlli nel codice.

  - tipo: corretto
    testo: >
      **Errori di fatto e attribuzioni.** Corretti, fra gli altri, il margine
      massimo (1963), il forget gate della LSTM (2000), le immagini di ImageNet
      nel 2009 (3,2 milioni) e il segno di BIC e AIC.

  - tipo: ampliato
    testo: >
      **Livello Elementare fuori dalle schede.** Didascalie, riquadri «Da
      ricordare» e raccordi, che usavano la lingua del livello Superiore, sono
      riscritti; i riquadri sono ora su entrambi i livelli.

  - tipo: corretto
    testo: >
      **Notebook scaricabili.** Il pulsante «Esegui il codice» apre ora notebook
      funzionanti: prima molte celle davano errore di sintassi.

  - tipo: ampliato
    testo: >
      **Tredici figure animate.** Ciascuna calcola i propri numeri e non viene
      generata se non coincidono con il testo; fra esse fusioni del BPE,
      k-means, online softmax di Flash Attention, rete di Hopfield.

  - tipo: corretto
    testo: >
      **Figure incoerenti con la pagina.** Corrette: 17 × 28 invece di 17 × 24,
      AlphaGo addestrato col solo self-play (è il successore), un blocco di
      memoria assente, una scelta fuori ordine in un albero.

  - tipo: ampliato
    testo: >
      **Notazione uniforme.** Il grassetto indica gli oggetti con più componenti
      (vettori, matrici), il tondo un numero solo: la distinzione valeva solo
      nei primi due capitoli.

  - tipo: corretto
    testo: >
      **Simboli con più significati.** Le lettere usate per due o tre cose nella
      stessa pagina sono rinominate; dove il nome è quello standard, il testo
      avverte che altrove il simbolo si chiama diversamente.

  - tipo: corretto
    testo: >
      **Misure su più semi.** I numeri che derivavano da una sola esecuzione, e
      su altre non reggevano la tesi, sono ora misurati su più semi, con la
      variabilità dei risultati.

- versione: "1.3.0"
  data: 2026-08-11
  voci:

  - tipo: ampliato
    pagina: GraphNeuralNetwork/architetture-applicazioni.md
    testo: >
      **Graph Transformer.** Ogni nodo dialoga con tutti gli altri e non solo
      con i vicini; la codifica di posizione sul grafo generalizza quella dei
      Transformer, e su una fila sono onde imparentate.

  - tipo: ampliato
    pagina: Transformers/confronti.md
    testo: >
      **Attenzione a costo ridotto.** Completate le tre strade (schema
      prefissato, scelta guidata dai dati con il Reformer, rinuncia alla
      softmax); aggiunti gli strati reversibili, scambio fra memoria e calcolo.

  - tipo: ampliato
    pagina: Transformers/multimodalita.md
    testo: >
      **ELECTRA.** Quarto modo di studiare accanto a GPT, BERT e T5, nato
      dall'obiezione che mascherando una parola su sette per le altre sei non si
      impara; limite dell'analogia con le GAN.

  - tipo: ampliato
    pagina: Transformers/tendenzefuture.md
    testo: >
      **Calcolo adattivo nei Transformer.** Perché lo stesso calcolo è speso su
      domande facili e difficili, e due modi di rimuovere il vincolo: pensare
      più a lungo in silenzio (meno costoso) o scrivendo (traccia leggibile).

  - tipo: ampliato
    pagina: Transformers/attenzione.md
    testo: >
      **Antenato dell'attenzione.** Un riquadro mostra che la struttura
      domanda-archivio nacque a metà degli anni Dieci per far ragionare una rete
      su un elenco di fatti, ed è quella dei sistemi di recupero.

  - tipo: ampliato
    pagina: MLOps/dati-e-pipeline.md
    testo: >
      **Formati dei dati nelle pipeline.** Il CSV è quasi sempre inadatto
      all'addestramento, che legge poche colonne su molte; la memorizzazione per
      colonna di Parquet e Arrow risolve il problema.

  - tipo: ampliato
    pagina: MachineLearning/overfitting-validazione.md
    testo: >
      **Curve di apprendimento e test set.** Come scegliere fra più dati e un
      altro modello dalla forma di due curve; aggiunti Elastic Net,
      campionamento stratificato e il rischio di sporcare il test set anche solo
      guardandolo.

  - tipo: ampliato
    pagina: MachineLearning/metriche.md
    testo: >
      **Metriche per target ordinali.** Quando la variabile ha un ordine (fasce
      d'età, stelle, gravità) l'accuratezza non distingue errori piccoli e
      grandi e sceglie il modello sbagliato; sono indicate misure alternative.

  - tipo: ampliato
    pagina: MachineLearning/alberi-ensemble.md
    testo: >
      **Combinazione di modelli eterogenei.** Per voto o con un modello che li
      pesa; nell'esperimento della pagina il voto peggiora rispetto al miglior
      modello singolo e l'alternativa lo supera.

  - tipo: ampliato
    pagina: MachineLearning/iperparametri.md
    testo: >
      **Torneo a eliminazione asincrono.** Su un cluster l'attesa della fine di
      ogni turno lascia ferme quasi tutte le macchine; la versione asincrona
      evita il problema.

  - tipo: ampliato
    pagina: RetiNeurali/backpropagation.md
    testo: >
      **Cross-entropia ed errore quadratico.** Nella classificazione la
      cross-entropia non è una convenzione: con l'errore quadratico il modello
      che sbaglia di più impara più lentamente, l'opposto di ciò che serve.

  - tipo: ampliato
    pagina: DeepLearning/ottimizzazione-regolarizzazione.md
    testo: >
      **Riscaldamento del learning rate.** Perché i primi passi
      dell'addestramento sono i più rischiosi e conviene farli piccoli; la
      tecnica compare in ogni ricetta moderna.

  - tipo: ampliato
    pagina: PyTorch/prestazioni.md
    testo: >
      **Misura del tempo su GPU.** La GPU esegue quando le è comodo e non quando
      le si chiede, per cui un cronometro ingenuo misura il nulla; spiegato come
      misurare correttamente.

  - tipo: ampliato
    pagina: PyTorch/replicare-un-paper.md
    testo: >
      **Diario degli esperimenti.** Le tre regole che lo rendono utile e ciò che
      gli strumenti di tracciamento non registrano: il motivo per cui un
      esperimento è stato provato.

  - tipo: ampliato
    pagina: PyTorch/dati-su-misura.md
    testo: >
      **Impacchettamento dei dataset grandi.** Conviene perché il costo
      dominante è aprire i file e non decodificarli; nello stesso passaggio si
      calcolano le statistiche per la normalizzazione.

  - tipo: ampliato
    pagina: NaturalLanguageProcessing/modelli-sequenza.md
    testo: >
      **Addestramento di reti ricorrenti su sequenze lunghe.** Spezzare la
      sequenza in blocchi impedisce di apprendere legami più lunghi del blocco:
      parte della «memoria corta» è una scelta ingegneristica e non un limite
      matematico.

  - tipo: ampliato
    pagina: ReinforcementLearning/mdp-valore.md
    testo: >
      **Osservabilità parziale.** Quando l'agente vede soltanto una parte
      rumorosa dello stato, caso comune, alcuni agenti impilano gli ultimi
      fotogrammi e altri hanno una memoria.

  - tipo: ampliato
    pagina: DeepReinforcementLearning/policy-gradient.md
    testo: >
      **Origine del vincolo di PPO.** Il vincolo di PPO è la versione economica
      di un vincolo preciso, formulato anni prima e troppo costoso da calcolare:
      meno rigorosa, ma più semplice e sufficiente.

  - tipo: ampliato
    pagina: SerieTemporali/forecasting-neurale.md
    testo: >
      **Scomposizione in tendenza e stagionalità.** Terza famiglia fra modelli
      classici e reti: tendenza, stagionalità e festività con curva interpolata;
      basta a molti problemi aziendali, e il motivo è anche quello del suo
      limite.

  - tipo: ampliato
    pagina: GPU/parallelismo-distribuito.md
    testo: >
      **Scambio dei gradienti ad anello.** Indicato lo schema che l'anello ha
      sostituito e perché non reggeva l'aumento del numero di macchine.

- versione: "1.2.0"
  data: 2026-08-10
  voci:

  - tipo: nuovo
    pagina: VisioneArtificiale/geometria-e-profondita.md
    testo: >
      **Geometria e profondità in visione artificiale.** Nuova sezione: modello
      di fotocamera, vincolo epipolare, profondità dalla disparità, flusso
      ottico e profondità da una sola immagine; il codice verifica i risultati
      invece di illustrarli.

  - tipo: nuovo
    pagina: VisioneArtificiale/rendering-neurale.md
    testo: >
      **Rendering neurale.** NeRF e splatting gaussiano: una scena come funzione
      addestrata, rendering volumetrico differenziabile, ruolo della codifica
      posizionale (come nelle PINN) e delle pose delle fotocamere, ricavate
      nella sezione precedente.

  - tipo: nuovo
    pagina: DeepLearning/multi-compito.md
    testo: >
      **Apprendimento multi-compito.** Nuova sezione: un compito in più può
      aiutare o danneggiare quello di interesse; nelle misure un compito affine
      riduce l'errore del 65% e uno estraneo lo aumenta del 25%.

  - tipo: nuovo
    pagina: DeepReinforcementLearning/imitazione.md
    testo: >
      **Apprendimento per imitazione.** Colma il passaggio fra rinforzo e
      addestramento degli assistenti conversazionali; gli errori si compongono e
      più il maestro è bravo meno insegna a rimediare.

  - tipo: ampliato
    pagina: MachineLearning/riduzione-clustering.md
    testo: >
      **Misture gaussiane e algoritmo EM.** Probabilità al posto di etichette,
      forma dei gruppi e criterio per scegliere quanti gruppi, nozioni che i
      capitoli su tokenizzatori e riconoscimento vocale davano per note.

  - tipo: ampliato
    pagina: DeepReinforcementLearning/mcts-alphago.md
    testo: >
      **Ricerca ad albero Monte Carlo.** Le quattro mosse, la scelta della mossa
      più visitata e non di quella con la media migliore, l'identità con la
      formula dei bandit; già invocata per AlphaGo e MuZero.

  - tipo: ampliato
    pagina: Python/basi.md
    testo: >
      **Il GIL in Python.** Perché i thread aiutano quando si attende e non
      quando si calcola; il capitolo su PyTorch usava il termine due volte senza
      introdurlo.

  - tipo: ampliato
    pagina: NaturalLanguageProcessing/rappresentare-testo.md
    testo: >
      **Embedding di frase.** Come ottenere un vettore per un'intera frase: un
      BERT usato così com'è dà vettori mediocri perché addestrato ad altro; due
      capitoli sul recupero poggiavano su embedding mai spiegati.

  - tipo: ampliato
    pagina: DeepLearning/architetture-storiche.md
    testo: >
      **Convoluzione separabile in profondità.** Il mattone di EfficientNet:
      stessa forma in uscita con quasi nove volte meno pesi, ragione per cui la
      visione artificiale gira su un telefono.

  - tipo: ampliato
    pagina: SerieTemporali/componenti-e-classici.md
    testo: >
      **Scelta e diagnostica di un modello ARIMA.** Come si scelgono i parametri
      e si verifica il modello sui residui; aggiunti i due modi di includere
      informazioni esterne: variabili esogene e serie che si influenzano a
      vicenda.

  - tipo: ampliato
    pagina: MachineLearning/alberi-ensemble.md
    testo: >
      **Ensemble di modelli diversi.** Combinazione per voto o con un modello
      addestrato a pesarli; nella misura riportata il voto peggiora rispetto al
      miglior modello singolo e l'alternativa lo supera.

- versione: "1.1.7"
  data: 2026-08-09
  voci:

  - tipo: corretto
    testo: >
      **Stampa sempre in versione chiara.** Con il tema scuro la stampa dava
      pagine nere e, a sfondi disattivati, testo chiarissimo su carta bianca;
      ora è sempre chiara e riporta entrambi i livelli.

  - tipo: corretto
    testo: >
      **Contrasto della riga di attribuzione.** La riga con l'autore di una
      citazione usa il grigio del libro in entrambi i temi, perché il precedente
      era sotto il contrasto minimo raccomandato.

- versione: "1.1.6"
  data: 2026-08-09
  voci:

  - tipo: corretto
    testo: >
      **Numerazione delle figure per capitolo.** Le figure portano il numero del
      capitolo («Fig. 3.2») e non più la numerazione continua, arrivata a «Fig.
      302»; i rimandi seguono e il numero coincide con quello dell'indice.

  - tipo: corretto
    testo: >
      **Apertura delle figure ingrandite.** La figura ingrandita si apre alla
      dimensione della finestra, senza zoom, così da mostrare prima l'intero
      disegno.

- versione: "1.1.5"
  data: 2026-08-09
  voci:

  - tipo: corretto
    testo: >
      **Figure a schermo intero su telefono.** Il testo delle figure scendeva
      sotto i sei pixel; la figura toccata si apre ora a schermo intero alla
      dimensione di progetto, con zoom a due dita e trascinamento.

- versione: "1.1.4"
  data: 2026-08-09
  voci:

  # Senza `pagina`: riguardano tutte.
  - tipo: corretto
    testo: >
      **Composizione del testo sullo schermo.** Il corpo cresce con la larghezza
      dello schermo senza scalini, la riga resta fra trentacinque e settanta
      caratteri e l'interlinea ne segue la lunghezza; il testo non cambia.

  - tipo: corretto
    testo: >
      **Colonna di lettura unica.** Testo, codice, figure e tabelle condividono
      lo stesso margine sinistro; sugli schermi da portatile l'indice di destra
      non è più tagliato.

- versione: "1.1.3"
  data: 2026-08-08
  voci:

  # Senza `pagina`: la landing è la radice del toc, non una sua voce, e il
  # generatore (giustamente) non sa da dove prendere il titolo del link.
  - tipo: corretto
    testo: >
      **Epigrafe di apertura.** Sostituita la frase attribuita a Marcus du
      Sautoy, senza fonte, con la domanda di Turing in «Computing Machinery and
      Intelligence» (1950): non simulare una mente adulta, ma una che impara.

- versione: "1.1.2"
  data: 2026-08-08
  voci:

  - tipo: corretto
    pagina: Introduzione/overview.md
    testo: >
      **Massima di Weizenbaum.** «To explain away» è reso con «dissolvere»
      invece della traduzione letterale, priva di senso in italiano; una nota
      riporta l'originale e il richiamo nelle Conclusioni è allineato.

- versione: "1.1.1"
  data: 2026-08-08
  voci:

  - tipo: corretto
    pagina: prefazione.md
    testo: >
      **Ultima riga della Prefazione.** La formula del 2019 «genera paura e
      alimenta false notizie» diventa «false speranze»: l'ignoranza sul
      funzionamento di una macchina produce anche l'attesa che sappia fare ciò
      che non sa fare.

- versione: "1.1.0"
  data: 2026-08-08
  titolo: Il libro ha una prefazione
  nota: >
    È saltata fuori la bozza del 2019, quella mandata a un editore: indice di
    quindici capitoli e una sola parte scritta, la prefazione. Quasi tutto
    quello che diceva era già nel libro, sparso fra l'introduzione e la sua
    conclusione. Mancava la prefazione in quanto tale, cioè l'unica pagina in
    cui l'autore parla in prima persona.
  voci:

  - tipo: nuovo
    pagina: prefazione.md
    testo: >
      **Prefazione.** Nuova pagina su perché il libro esiste e perché il mancato
      progetto a stampa del 2019 sia stato un vantaggio: l'indice non nominava i
      Transformer. Non è un capitolo.

  - tipo: ampliato
    pagina: Introduzione/conclusione.md
    testo: >
      **Genealogia dell'«elettricità» di Ng.** Prima della citazione di Andrew
      Ng sull'AI come «nuova elettricità» è inserita la genealogia a cui allude:
      le tecnologie che cambiano il modo di risolvere tutti gli altri problemi.

  - tipo: impianto
    testo: >
      **Comando di apertura delle sezioni nell'indice.** Il controllo che apre
      le sezioni di un capitolo senza entrarvi, prima un'icona di dodici pixel,
      è ora un comando alto quanto la riga, in teal, evidenziato al passaggio.

  - tipo: corretto
    testo: >
      **Numerazione dei capitoli nell'indice.** Il numero è assegnato ai soli
      capitoli (la pagina degli aggiornamenti compariva come trentaquattresima)
      e coincide con quello delle schede in prima pagina.

  - tipo: corretto
    pagina: Conclusioni/overview.md
    testo: >
      **Citazione di Weizenbaum nelle Conclusioni.** Il richiamo cita la frase
      con cui si apre l'Introduzione, «si dice che spiegare significhi
      dissolvere», al posto di una priva di riscontro nelle fonti primarie.

- versione: "1.0.3"
  data: 2026-08-08
  voci:

  - tipo: corretto
    testo: >
      **Storia del libro e manoscritto del 2019.** La storia presupponeva
      un'edizione a stampa mai uscita: il termine di riferimento per i capitoli
      aggiunti è il manoscritto del 2019, e questa è la prima forma pubblica del
      testo.

- versione: "1.0.2"
  data: 2026-08-08
  voci:

  - tipo: corretto
    testo: >
      **Data di nascita del libro.** Il libro nasce nel 2019, la versione online
      nel giugno 2024; la nota di copyright parte dal 2019.

- versione: "1.0.1"
  data: 2026-08-08
  voci:

  - tipo: corretto
    testo: >
      **Titolo e descrizione per i motori di ricerca.** Bibliografia e pagina
      degli aggiornamenti usavano titolo e descrizione della copertina; ora
      ognuna ha i propri. Il difetto riguardava le voci di primo livello
      dell'indice, prive di capitolo sovraordinato.

- versione: "1.0.0"
  data: 2026-08-08
  titolo: Il libro prende un numero
  nota: >
    La 1.0.0 non è il primo giorno del libro, che nasce nel 2019 (la storia
    breve è in fondo a questa pagina): è il primo giorno in
    cui il libro ha un numero, e il punto da cui si contano i cambiamenti.
    L'elenco qui sotto è il lavoro di agosto 2026, l'ultimo mese prima che il
    registro cominciasse.
  voci:

  - tipo: nuovo
    pagina: Matematica/matematica-llm.md
    testo: >
      **Matematica dei modelli linguistici.** Gli strumenti dei capitoli di
      matematica applicati a un token che entra in un modello e ne esce, da
      un'osservazione di Joseph Breeden: l'ostacolo è il vocabolario preso a
      prestito.

  - tipo: nuovo
    pagina: ReinforcementLearning/banditi.md
    testo: >
      **Banditi a più braccia.** Il dilemma fra esplorare e sfruttare nella
      forma più pura, dalla domanda posta da Thompson nel 1933 sulle
      sperimentazioni cliniche; precede gli MDP.

  - tipo: nuovo
    pagina: ReinforcementLearning/monte-carlo.md
    testo: >
      **Metodi Monte Carlo nel rinforzo.** Apprendere giocando fino in fondo,
      senza modello dell'ambiente: il passo fra la value iteration, che lo
      richiede, e il Q-learning.

  - tipo: nuovo
    pagina: GraphNeuralNetwork/knowledge-graph.md
    testo: >
      **Knowledge graph.** Grafi i cui archi sono fatti con verso e nome, dal
      principio «things, not strings» di Google alle rappresentazioni di entità
      e relazioni.

  - tipo: nuovo
    pagina: Transformers/multilingua.md
    testo: >
      **Modelli multilingua.** Un solo modello per cento lingue: vocabolari
      condivisi, trasferimento fra lingue lontane e costo dello spazio comune;
      riprende il filo della traduzione neurale, fermo al 2016.

  - tipo: nuovo
    pagina: MLOps/energia-e-impronta.md
    testo: >
      **Energia e impronta dei modelli.** Come si misura l'energia consumata,
      quasi mai dichiarata accanto a parametri, FLOP, accuratezza e latenza, e
      perché il valore cambia di un ordine di grandezza secondo il punto di
      misura.

  - tipo: ampliato
    pagina: GraphNeuralNetwork/message-passing.md
    testo: >
      **Matrice di adiacenza normalizzata e oversmoothing.** Origine della
      matrice normalizzata e perché l'oversmoothing è conseguenza del message
      passing e non un difetto da correggere.

  - tipo: ampliato
    pagina: Transformers/confronti.md
    testo: >
      **Self-attention come message passing.** Terzo filo del confronto: la
      self-attention è message passing su un grafo completo, e ciò collega
      questo capitolo a quello sulle graph neural network.

  - tipo: ampliato
    pagina: GAN/come-funziona.md
    testo: >
      **Valutazione delle GAN.** Come si misura una GAN, domanda lasciata aperta
      dall'addestramento avversario: Inception Score, FID e ciò che nessuno dei
      due coglie.

  - tipo: ampliato
    pagina: GPU/gemm-e-tensor-core.md
    testo: >
      **Array sistolico.** Il circuito contenuto in un tensor core e la ragione
      per cui la moltiplicazione di matrici in hardware procede come in una
      catena di montaggio.

  - tipo: ampliato
    pagina: PyTorch/errori-comuni.md
    testo: >
      **Lettura delle curve di addestramento.** Quali forme indicano
      overfitting, quali un learning rate errato, quali un errore nei dati.

  - tipo: ampliato
    pagina: Python/pandas-matplotlib.md
    testo: >
      **Join fra tabelle.** I quattro tipi di join, usati nel capitolo senza
      essere spiegati.

  - tipo: ampliato
    testo: >
      **Riquadri «Da ricordare».** Ogni capitolo si chiude con un riquadro su
      entrambi i livelli: cinque righe per rileggerlo in un minuto o valutare se
      aprirlo.

  - tipo: corretto
    testo: >
      **Correzioni generali.** Corrette date, attribuzioni, esempi numerici e
      notazione nei capitoli in cui servivano.

  - tipo: corretto
    testo: >
      **Codice e notebook allineati.** Il codice dei blocchi Python è stato
      eseguito e i notebook del pulsante «Esegui il codice» rigenerati dalle
      pagine corrette, così testo e notebook coincidono.

  - tipo: impianto
    testo: >
      **Palette del tema.** Rimosso il viola residuo delle impostazioni di
      fabbrica nei fondini delle schede: la palette del libro vale ovunque.

  - tipo: impianto
    testo: >
      **Pagina degli aggiornamenti e numero di versione.** Introdotta questa
      pagina, con il numero di versione in cima all'indice e nella prima pagina
      del libro.
