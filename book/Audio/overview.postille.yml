# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Il canto degli uccelli è solo"
  impronta: "1d216dae2324"
  postilla: "Musica, allarmi, guasti di motore: tutto audio, quasi niente voce"
- inizio: "Quanto è grande questo mondo? Un'idea"
  impronta: "ca070fd7f8ba"
  postilla: "Prima l'elenco ad albero, 632 categorie; poi oltre due milioni di frammenti"
- inizio: "Un catalogo così fitto presuppone che"
  impronta: "f0991e82fc70"
  postilla: "I suoni non verbali hanno tracce regolari, ma senza vocabolario né sintassi"
- inizio: "Nel riconoscimento vocale il traguardo è"
  impronta: "452b6a5c35f9"
  postilla: "Non sempre il traguardo è un testo: etichetta, tag, o un suono nuovo"
- inizio: "Ed è diverso anche il suono"
  impronta: "424ed66e88c6"
  postilla: "La voce ha regole sue; accordi, temporali e motori non le seguono"
- inizio: "Questi compiti non sono esercizi da"
  impronta: "22c0de895277"
  postilla: "Dai canti per la biodiversità agli apparecchi acustici: usi concreti"
- inizio: "In particolare, lo spettrogramma log-mel ricorre"
  impronta: "820b76f6aba4"
  postilla: "Il log-mel, un'immagine a un canale, vale identico per merli e temporali"
- inizio: "La strada già battuta è quella"
  impronta: "03e4cc5b886e"
  postilla: "Token in senso stretto: simbolo di un insieme finito, fissato in anticipo"
- inizio: "C'è infatti un secondo modo di"
  impronta: "4d0cfa3973ee"
  postilla: "Discreto e continuo: valori separati contro ogni valore di un intervallo"
- inizio: "Un testo nasce discreto, perché è"
  impronta: "a9b2d372b18c"
  postilla: "Il suono nasce continuo, ma nel computer è già discreto: 65.536 livelli"
- inizio: "Ogni livello è una lettera possibile,"
  impronta: "ac1d8cc2d4d0"
  postilla: "Alfabeto sbagliato: 65.536 lettere, e per il parlato sedicimila al secondo"
- inizio: "Lo spettrogramma di {numref}`fig-whisper-pipeline` il problema"
  impronta: "b5148c665621"
  postilla: "Chi scrive un simbolo alla volta ha bisogno di un vocabolario finito"
- inizio: "Si può generare anche senza alfabeto,"
  impronta: "df9625f9986f"
  postilla: "Un alfabeto piccolo e lento porterebbe al suono l'armamentario del linguaggio"
- inizio: "Il testo *nasce* discreto: le lettere"
  impronta: "a7093710dd40"
  postilla: "Troppo povero, suono metallico; fedele, fila più lunga: tocca ai codec neurali"
