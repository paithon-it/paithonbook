# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Quando un modello legge una domanda,"
  impronta: "1c21d8d93e8e"
  postilla: "Leggere la domanda è legato al calcolo solo oltre il ginocchio della macchina"
- inizio: "Leggere la domanda e scrivere la"
  impronta: "cf98351e65f0"
  postilla: "Con domande di duecento parole, scrivere è quasi duecento volte meno efficiente"
- inizio: "La prima idea è non rifare"
  impronta: "6dfd24f8429a"
  postilla: "Di ogni parola scritta bastano chiave e valore per strato, e si conservano"
- inizio: "La seconda idea è riempire la"
  impronta: "5f6765a5f183"
  postilla: "I pesi si leggono una volta per tutti: a testa, servire molti costa molto meno"
- inizio: "In questo modo ogni passata produce"
  impronta: "66b294da3eb7"
  postilla: "Stessa distribuzione del grande e, con una bozza buona, più parole a passata"
- inizio: "Non sono le sole risposte. Altre"
  impronta: "db8e610e3a54"
  postilla: "Sul modello o sul calcolo: cache più piccola, meno parametri a parola, meno byte"
- inizio: "Le tre leve si pagano, e"
  impronta: "403ef1f8b928"
  postilla: "Il costo di ogni leva cambia da modello a modello: va valutato su quello in uso"
