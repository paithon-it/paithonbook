# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Novanta pesi su cento si possono"
  impronta: "d07ffda9f4cd"
  postilla: "Nove volte meno parametri su AlexNet, tredici su VGG-16, e accuratezza intatta"
- inizio: "Fra le tre leve è quella"
  impronta: "24cd1c8005f5"
  postilla: "Il prodotto denso moltiplica gli zeri: cambiarlo conviene solo in certi casi"
- inizio: "A metà strada, con la metà"
  impronta: "9452f7c4fc04"
  postilla: "I due decimi in più vengono dall'ottimizzatore riavviato, non dalla potatura"
- inizio: "Fra gli schemi a densità fissa,"
  impronta: "7ace508cce11"
  postilla: "Regolare quanto basta per i tensor core, libero quanto basta per scegliere"
- inizio: "La via di mezzo a densità"
  impronta: "28ad4db14a79"
  postilla: "Un acceleratore per la sola risposta può saltare gli zeri ovunque stiano"
- inizio: "Staccare subito rende il 32,5% in"
  impronta: "9be4d13c5d46"
  postilla: "Pause di due specie: attesa migliore quindici cicli; senza memoria, zero"
- inizio: "In altri termini, non era il"
  impronta: "c2b6d50bf937"
  postilla: "Milioni di collegamenti a caso, qualcuno già disposto bene: biglietto vincente"
- inizio: "Per l'efficienza la conseguenza è che"
  impronta: "8d795c7ebed0"
  postilla: "La potatura si paga dopo un addestramento intero, non al posto suo"
- inizio: "Questa conclusione ha però due riserve,"
  impronta: "26fafa433e4b"
  postilla: "Potando unità intere, la forma addestrata da zero a lungo spesso fa altrettanto"
- inizio: "La seconda è che una maschera"
  impronta: "22c738f12736"
  postilla: "Potare all'inizio rende meno; cambiare maschera risparmia solo saltando gli zeri"
- inizio: "Componendo le due leve emerge anche"
  impronta: "7bd4a1ea4812"
  postilla: "Senza protezione, gruppi di zeri: scala zero e valori non numerici, in silenzio"
- inizio: "Duecentouno gruppi sono tutti zeri, e"
  impronta: "75763ab53451"
  postilla: "Senza protezione la rete risponde zero a tutto: 8,3%, la frequenza dello zero"
