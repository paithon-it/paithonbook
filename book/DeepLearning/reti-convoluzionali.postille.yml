# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Per un computer una fotografia è"
  impronta: "30c1b036a617"
  postilla: "Spostando la foto di dieci pixel quasi ogni numero cambia"
- inizio: "Questo scarto tra come *noi* vediamo"
  impronta: "3d5adc1495cf"
  postilla: "Da Hubel e Wiesel al Neocognitron, fino alla LeNet-5 di LeCun e colleghi (1998)"
- inizio: "Lo strato che conosciamo già è"
  impronta: "f034a1bcc82b"
  postilla: "Lo strato denso sulle immagini: troppi pesi, e sensibile alla posizione"
- inizio: "Il cuore della rete è la"
  impronta: "a6cdcb200a85"
  postilla: "In ogni posizione un prodotto scalare, alto dove c'è il motivo del filtro"
- inizio: "Due principi rendono tutto ciò possibile,"
  impronta: "a0c1bc341be8"
  postilla: "Ogni casella guarda una finestra piccola; lo stesso filtro serve ovunque"
- inizio: "L'uscita di un filtro è una"
  impronta: "a20d60b68696"
  postilla: "Un filtro, una feature map; le mappe sono i canali dello strato dopo"
- inizio: "La ReLU sta in mezzo, fra"
  impronta: "2dc8c9db8866"
  postilla: "Senza ReLU, due convoluzioni impilate valgono una sola, un po' più larga"
- inizio: "Questo scambio ha anche una ragione"
  impronta: "8b40eaf416b6"
  postilla: "Con lato dimezzato e filtri e canali doppi, ogni blocco costa uguale"
- inizio: "Il numero di moltiplicazioni di una"
  impronta: "70b13aa67834"
  postilla: "Winograd: meno moltiplicazioni e più somme sui filtri piccoli"
- inizio: "L'ordine delle somme conta, perché in"
  impronta: "4cb60e77622d"
  postilla: "Addizione non associativa: ordine fisso, e arrotondamenti uguali ovunque"
- inizio: "Le due dirette, invece, dicono qualcosa"
  impronta: "a2f466ef94e5"
  postilla: "In catena peggio del Winograd a tessere piccole; per canale, di poco la migliore"
- inizio: "Le somme sono $575$ in tutti"
  impronta: "23198ba314b7"
  postilla: "Stesse 575 somme, ma per canale un prodotto ne attraversa al più 71, non tutte"
- inizio: "L'errore di Winograd, quindi, dipende da"
  impronta: "fd1665b1cf23"
  postilla: "Trasformazioni a 16 bit: tessere grandi peggiori; a 32, alla pari (Lavin e Gray)"
- inizio: "Una convoluzione offre più riuso di"
  impronta: "7a442c65201f"
  postilla: "Eyeriss riusa pesi, pixel e uscite con il flusso row stationary"
- inizio: "La ricomposizione coincide con la convoluzione"
  impronta: "6cedf49f720e"
  postilla: "Ogni numero letto una volta: 45 letture per 144 moltiplicazioni, non 288"
