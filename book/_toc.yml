format: jb-book
root: intro.md

# I capitoli sono raggruppati in PARTI: la `caption` diventa l'intestazione
# che spezza l'indice di sinistra (trenta voci di fila non si scandivano).
# L'ordine dei capitoli NON cambia — le parti sono gruppi contigui — quindi la
# numerazione della landing (`intro.md`) resta valida, ed e' la stessa che
# `custom.css` stampa accanto a ogni capitolo nell'indice.
#
# `title:` e' l'etichetta BREVE nell'indice e nei pulsanti sfoglia: la pagina
# conserva il proprio titolo esteso (l'H1). Serve perche' nella colonna di
# sinistra un titolo lungo va a capo due o tre volte e la lista diventa un muro.

parts:
# La prefazione sta in una parte SENZA caption, cioe' fuori da «Fondamenta» e
# prima di essa. Una prefazione non e' un capitolo di fondamenta: viene prima
# di tutto, e in un libro stampato si vedeva ancora meglio che online, dove
# finiva sotto l'intestazione sbagliata.
#
# Sta in radice e non in una cartella, e questo non e' un dettaglio di ordine:
# `conta_capitoli()` e l'asse `landing` di `coerenza.py` chiamano capitolo una
# voce di primo livello che sta dentro una cartella, quindi di qui non passa.
# Non entra nel conteggio dei capitoli, non vuole una scheda nella landing e
# non sposta la numerazione, esattamente come `references.md` e
# `aggiornamenti.md`.
