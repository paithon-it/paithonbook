# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Ogni ingresso arriva con un peso"
  impronta: "fe6def5af4cc"
  postilla: "Pesi, somma pesata, bias, funzione di attivazione: i pezzi del neurone"
- inizio: "*Perceptrons*, il libro di Minsky e"
  impronta: "eab9e7957953"
  postilla: "Un neurone, una riga: non lo scoprirono Minsky e Papert, si sapeva da decenni"
- inizio: "Sulle reti a più strati, cioè"
  impronta: "43568b8bac35"
  postilla: "Sul multistrato solo una congettura, letta per vent'anni come un teorema"
- inizio: "Seguirono anni magri, che oggi si"
  impronta: "5cff1917bc89"
  postilla: "I tagli veri: il rapporto Lighthill del 1973 e la DARPA, non Minsky e Papert"
- inizio: "I teoremi erano corretti e limitati,"
  impronta: "b703dbdbd26b"
  postilla: "Teoremi letti male, fondi spostati; nessuno sapeva correggere i neuroni in mezzo"
- inizio: "C'è però una condizione: fra uno"
  impronta: "aa3a76fc88c1"
  postilla: "Senza non linearità fra gli strati, cento strati valgono quanto uno solo"
- inizio: "Si noti che nelle ultime due"
  impronta: "6e6f16eff994"
  postilla: "Lo strato nascosto non risolve lo XOR: lo sposta dove una riga basta"
