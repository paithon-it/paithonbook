title: Paithon Book
# Il tema antepone «Di » a questo campo: la frase deve quindi cominciare dal
# titolare, non dalla parola Copyright, o si legge «Di Copyright © 2019…».
#
# Il titolare è una persona fisica. paithon.it è un dominio e un marchio, e
# un dominio i diritti d'autore non può averli: in una contestazione la
# titolarità la prova chi la rivendica, e un'attribuzione a un'entità che
# non esiste è la prima cosa che una controparte attacca. Stessa correzione
# già fatta in b625fdf per il colophon di stampa e per il README; qui era
# rimasta indietro — cioè proprio nella versione che il sito mostra.
#
# La licenza del CODICE è nominata per esteso e non rinviata a un file: il
# deposito Zenodo dichiara Apache-2.0, e due dichiarazioni che non
# combaciano alla lettera creano l'ambiguità che un colophon serve a
# togliere. Chi legge non deve aprire GitHub per sapere cosa può riusare.
author: Francesco Messina — paithon.it. Copyright © 2019–2026.
        Testo e figure sotto
        <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="license noopener noreferrer">
        CC BY-NC-ND 4.0
        </a>
        <img style="height:1.05em!important;width:auto;margin:0 0 0 4px!important;vertical-align:-0.18em!important;box-shadow:none!important;border-radius:0!important;"
        src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="cc">
        <img style="height:1.05em!important;width:auto;margin:0 0 0 4px!important;vertical-align:-0.18em!important;box-shadow:none!important;border-radius:0!important;"
        src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="by">
        <img style="height:1.05em!important;width:auto;margin:0 0 0 4px!important;vertical-align:-0.18em!important;box-shadow:none!important;border-radius:0!important;"
        src="https://mirrors.creativecommons.org/presskit/icons/nc-eu.svg" alt="nc-eu">
        <img style="height:1.05em!important;width:auto;margin:0 0 0 4px!important;vertical-align:-0.18em!important;box-shadow:none!important;border-radius:0!important;"
        src="https://mirrors.creativecommons.org/presskit/icons/nd.svg" alt="nd">
        · Codice degli esempi sotto
