logo: _static/logo-light.svg #lockup bollo tribar + wordmark "paithon" (fallback; le varianti light/dark sono in html_theme_options.logo)
# Questo campo è il TITOLARE, non la licenza: Sphinx lo usa dove serve dire
# di chi è l'opera (metadati, output LaTeX/EPUB), e ci stava scritto
# «CC BY-NC-ND 4.0» — cioè una licenza al posto di una persona. Il tema in
# uso non lo stampa, quindi non si vedeva; ma un campo giusto solo finché
# nessuno lo legge è un campo sbagliato. La licenza resta dov'è, in `author`.
copyright: Francesco Messina

only_build_toc_files: true

execute:
  execute_notebooks: "auto"

html:
  favicon : "figures/favicon.svg"
  baseurl : "https://book.paithon.it/main"
  home_page_in_navbar: false
  use_multitoc_numbering: false
  extra_navbar: |
      <div>
          <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="paithon.it" data-color="#B5532C" data-emoji="🍕"  data-font="Cookie" data-text="Offrimi una pizza" data-outline-color="#1A1A1A" data-font-color="#ffffff" data-coffee-color="#C9A961" ></script>
      </div>

sphinx:
  config:
    # Il libro e' in italiano e finora non lo diceva: `<html lang="en">` e
    # `docsearch:language: en` su tutte le pagine. Conta per i motori di
    # ricerca, per gli assistenti che citano e per gli screen reader. Effetto
    # collaterale voluto: le etichette del tema passano all'italiano (Search ->
    # Cerca, previous/next -> precedente/successivo). Le etichette che
    # `pt-formato.js` scrive a mano («Torna su») non cambiano, le imposta lui.
    language: it

    # Ricopiata tal quale nella radice della build: robots.txt, sitemap.xml e
    # llms.txt, che li scrive `scripts/genera-radice.py` dal `_toc.yml`.
    # Arrivano alla radice del DOMINIO (dove robots.txt conta) perche' il
    # workflow ricopia il branch primario nella radice del sito: e' la
    # variabile di repository BEHAVIOR_PRIMARY=copy. Vedi il docstring dello
    # script.
    html_extra_path:
    - _extra

    html_css_files:
    - custom.css
    - tabs-enhanced.css
    - pt-formato.css
    html_js_files:
    - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    - custom.js
    - pt-formato.js
    # Lo scambio di tema per la stampa. Sta nel brand perche' serve identico
    # al sito, che nasce scuro come il libro: il CSS da solo non arriva alla
    # tavolozza del codice, che pende da data-theme.
    - brand/print.js

    # Sidebar sinistra: la scheda del repository sta SOPRA l'indice, come su
    # learnpytorch.io (Material for MkDocs). L'elenco replica il default di
    # sphinx-book-theme (navbar-logo, icon-links, search-button-field,
    # sbt-sidebar-nav) con `pt-repo-card.html` inserito dopo il logo.
    html_sidebars:
      "**":
      - navbar-logo.html
      - pt-repo-card.html
      - icon-links.html
      - search-button-field.html
      - sbt-sidebar-nav.html

    # Elenco delle pagine che hanno un notebook compagno in `notebooks/`.
    # SCRITTO da `scripts/genera-notebook.py`: non modificare a mano. Serve al
    # template `pt-notebook.html`, che il disco non può guardarlo.
    html_context:
      pt_notebooks:
      - AIResponsabile
      - Agenti
      - Audio
      - AutoSupervisione
      - DeepLearning
      - DeepReinforcementLearning
      - GraphNeuralNetwork
      - Interpretabilita
      - MLOps
      - MachineLearning
      - Matematica
      - ModelliDiffusione
      - NaturalLanguageProcessing
      - PINN
      - PyTorch
      - Python
      - ReinforcementLearning
      - SerieTemporali
      - SistemiMultiAgente
      - SistemiRaccomandazione
      - SpeechRecognition
      - StateSpaceModel
      - Transformers
      - VerosimiglianzaEsatta
      - VisioneArtificiale
      - VisioneLinguaggio
      - WorldModels

    templates_path:
    - _templates
    - _static

    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    thebe_config:
      use_thebe_lite: true
      exclude_patterns: ["**/_*.yml", "**/*.md", "**/*.ipynb"]
    html_theme_options:
      # Logo theme-aware: lockup bollo tribar + wordmark "paithon" (Fraunces
      # 800 vettorializzato) con "book" su una seconda riga, allineata a
      # destra, in Fraunces SemiBold — anch'essa vettoriale. La variante dark
      # usa inchiostro osso, così il wordmark resta leggibile sul fondo
      # quasi-nero del tema scuro. Si rigenera con
      # `python3 scripts/genera-logo-book.py`.
      logo:
        image_light: _static/logo-light.svg
        image_dark: _static/logo-dark.svg
        alt_text: Paithon Book
      repository_url: "https://github.com/paithon-it/paithonbook" #add your own repo URL here
      repository_branch: main
      path_to_docs: book/
      # Nella barra in alto restano solo le due icone che servono davvero:
      # ricerca e chiaro/scuro. Il repository e le issue vivono nella scheda
      # in cima alla sidebar; per segnalare un errore si seleziona il testo
      # (vedi _static/pt-formato.js). Il pulsante "tutto schermo" è tolto:
      # sul sito non funzionava.
      # Barra dell'articolo: dopo il pulsante della sidebar si infila il logo
      # compatto, che su schermo piccolo riempie il vuoto fra l'hamburger e le
      # icone (e riporta all'inizio del libro). Il primo template è il default
      # del tema: va ripetuto, altrimenti si perde.
      article_header_start:
      - toggle-primary-sidebar.html
      - pt-logo-compatto.html
      # "Esegui il codice": compare solo sulle pagine elencate in
      # html_context.pt_notebooks, cioè quelle con un notebook compagno.
      - pt-notebook.html
      # A destra l'interruttore del livello di lettura (Elementare /
      # Superiore) per tutto il libro, DOPO i pulsanti del tema: messo prima
      # finiva appiccicato al logo su schermo piccolo e sembrava farne parte.
      # Il primo template è il default del tema — va ripetuto o si perde.
      article_header_end:
      - article-header-buttons.html
      - pt-livello.html
      use_fullscreen_button: false
      use_download_button: false
      use_edit_page_button: false
      use_repository_button: false
      use_issues_button: false
      navigation_with_keys: true
      show_toc_level: 2
      # Quanti livelli dell'indice di sinistra restano APERTI da soli. Qui c'era
      # `show_nav_level: 2`, che è di pydata-sphinx-theme: questo tema è
      # sphinx-book-theme e legge `show_navbar_depth`, quindi quella riga non
      # ha mai fatto niente e l'indice si è sempre comportato come adesso.
      # Resta 1 apposta: aperto è il capitolo che si sta leggendo, gli altri si
      # aprono sul posto col comando a destra della riga (vedi custom.css,
      # «Il comando per aprire un capitolo»). A 2 si aprirebbero tutti, e
      # l'indice passerebbe da una quarantina di righe a quasi duecento.
      show_navbar_depth: 1
      navigation_depth: 3
      launch_buttons:
        thebe: true
        colab_url: "https://colab.research.google.com"
    html_show_copyright: false
    # LA STAMPA. Il libro esiste anche come PDF unico, che si costruisce con
    # `python3 scripts/genera-pdf.py`. Queste righe non toccano l'HTML.
    #
    # Il motore e' LuaLaTeX perche' e' l'unico installato che legge i font di
    # sistema (`fontspec`), e i font sono quelli del brand.
    #
    # Perche' `latex_engine` sta QUI e non sotto `latex:` come vorrebbe
    # jupyter-book: perche' `sphinx-jupyterbook-latex`, se acceso, lo
    # sovrascrive comunque con `xelatex`. Vedi `use_jupyterbook_latex` in
    # fondo a questo file, che infatti e' spento.
    latex_engine: lualatex
    # `author`, in cima a questo file, e' il blocco HTML del copyright che va
    # in fondo alle pagine del sito: in copertina ci vuole il nome dell'autore,
    # quindi il documento si dichiara per esteso invece di ereditarlo.
    latex_documents:
    - - intro
      - paithon-book.tex
      - Paithon Book
      - Francesco Messina
      - manual
    latex_elements:
      papersize: a4paper
      pointsize: 10pt
      # Le figure NON flottano. Due ragioni, e la seconda e' tecnica.
      #
      # La prima e' editoriale, ed e' una regola del libro: «una figura si
      # mette dove il testo gia' parla di quella cosa». Una figura che
      # galleggia due pagine piu' in la' contraddice il testo che la
      # richiama.
      #
      # La seconda: nel libro ci sono figure DENTRO le tab dei due livelli, e
      # un oggetto flottante di LaTeX non puo' stare dentro una scatola. Con
      # `htbp` la compilazione si ferma con «Not in outer par mode» e la
      # pagina perde pezzi.
      figure_align: H
      # Tutto lo stile sta in `_stampa/paithon.sty`. I font invece li
      # imposta `_ext/pt_stampa.py`, che e' l'unico a sapere il percorso
      # assoluto del submodule del brand.
      preamble: \usepackage{paithon}
    latex_additional_files:
    - _stampa/paithon.sty
    # Il marchio in copertina, gia' convertito in PDF: non passa dal
    # convertitore delle figure, perche' non sta nell'albero del documento
    # ma lo chiama una macro. Si rifa' con lo stesso Chromium quando cambia
    # nel brand.
    - _stampa/marchio.pdf
    # Il fregio di copertina, che sta sotto il blocco del titolo. Stessa
    # storia del marchio: lo chiama il frontespizio, non l'albero del
    # documento. Lo rifa' `python3 book/_stampa/copertina.py`.
    - _stampa/fregio.pdf
    # Le bande di apertura dei capitoli NON si elencano qui: sono una per
    # capitolo e cambierebbero a ogni capitolo nuovo. Le aggiunge
    # `_ext/pt_stampa.py`, che le trova da se'. (E comunque `latex_additional_files`
    # non prende cartelle: vuole un file per riga.)

  extra_extensions:
    # `sphinx.ext.imgconverter` stava qui e non convertiva niente: vuole
    # ImageMagick, che non c'e', e infatti si limitava a stampare un warning a
    # ogni build. Il suo mestiere lo fa `pt_stampa`, con Chromium.
    - jupyterbook_patches
    - sphinx_inline_tabs

  # Quanti capitoli ha il libro non si scrive a mano: `_ext/pt_conteggi.py` lo
  # legge dal `_toc.yml` e lo mette a disposizione del testo come sostituzione
  # MyST — `{{ n_capitoli_lettere }}` nella landing, `{{ n_capitoli_meno_uno_lettere }}`
  # nelle conclusioni. I percorsi sono relativi a questo file.
  # `pt_meta` mette nel contesto del template la descrizione di QUESTA pagina
  # (il suo primo paragrafo), che `_static/head_custom.html` usa per og:title,
  # og:description e i dati strutturati: prima erano identici su tutte e 160 le
  # pagine.
  # `pt_figure` numera figure, tabelle e blocchi di codice per capitolo
  # («Fig. 3.2»): il contatore di Sphinx e' unico per tutto il libro ed era
  # arrivato a Fig. 302, un numero che non dice dove si sta guardando. Il
  # numero di capitolo lo prende dal `_toc.yml`, la stessa fonte della landing
  # e del contatore dell'indice, cosi' le due numerazioni non possono
  # divergere.
  # `pt_stampa` e' l'estensione della stampa: converte le figure con Chromium,
  # da' un nome alle tab dei due livelli, sostituisce le animazioni con i fermi
  # immagine. Si accende solo per il builder LaTeX.
  local_extensions:
    pt_conteggi: _ext
    pt_meta: _ext
    pt_figure: _ext
    pt_stampa: _ext

# `sphinx-jupyterbook-latex` resta ACCESA, ma le si disfano tre cose.
#
# Serve perche' fa un lavoro che nessun altro fa: nel `_toc.yml` la radice e'
# `intro.md`, e senza di lei le sezioni della landing («Il percorso»,
# «Livelli di Complessità») diventano i capitoli 1, 2 e 3 del libro, con i
# capitoli veri che slittano dietro. Si vede solo guardando il PDF: nessuna
# build si lamenta.
#
# Quello che invece riscrive senza chiedere, a `config-inited`, e' questo:
#
#   latex_engine  ->  xelatex     che qui non e' installato, e comunque il
#                                 motore lo scegliamo noi (LuaLaTeX);
#   latex_theme   ->  jupyterBook che porta la sua impaginazione, mentre la
#                                 nostra sta in `_stampa/paithon.sty`;
#   preambolo     ->  ucharclasses, che funziona **solo con XeTeX**, e
#                     `\contentsname` = "Contents" in un libro italiano.
#
# Glieli disfa `_ext/pt_stampa.py` con un gancio che gira dopo il suo. Il
# rimedio e' brutto ed e' scritto apposta dove si vede: e' l'unico modo di
# tenere il pezzo che serve senza portarsi dietro il resto.

bibtex_bibfiles:
  - references.bib
