# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Per decenni le strade sono state"
  impronta: "41110346a7a9"
  postilla: "Triangoli o interpolazione fra foto: la prima fallisce con fumo e vetro"
- inizio: "Il metodo si chiama **NeRF**, dall'inglese"
  impronta: "d77aa00cd5b5"
  postilla: "NeRF: campo di radianza neurale, la luce da ogni punto in ogni direzione"
- inizio: "C'è un dettaglio che, tolto, fa"
  impronta: "a1eae8d07fbd"
  postilla: "Le reti faticano con ciò che cambia in fretta: limite che qui ha già il rimedio"
- inizio: "Per usare questi metodi servono da"
  impronta: "80e34084a954"
  postilla: "Servono decine di foto di una scena ferma e le pose; poi punti di vista nuovi"
- inizio: "Questi metodi non capiscono la scena."
  impronta: "b87b8a87878a"
  postilla: "Rigenerano le apparenze senza averne un modello: tema dei world model"
- inizio: "Quanto conta, in tutto, il raggio?"
  impronta: "430d68a3d2bb"
  postilla: "Non un errore: a ogni tratto la luce cala di una frazione fissa, mai fino a zero"
- inizio: "Possiamo rifare il calcolo. La densità"
  impronta: "eaf7a4875df0"
  postilla: "Ogni taglio riduce la luce a 0,368: sei tagli ne lasciano un quattrocentesimo"
- inizio: "A che distanza sta la superficie?"
  impronta: "138f5d67e6fb"
  postilla: "La media delle distanze, pesata per quanto conta ogni punto, dà la profondità"
- inizio: "Non viene quattro, però, e qui"
  impronta: "a5fc33efa348"
  postilla: "Senza dividere per il totale dei pesi, profondità corte, più se semitrasparente"
- inizio: "Se invece non c'è nessuna superficie,"
  impronta: "2aa1b536889d"
  postilla: "Nessun punto prevale, firma del torbido: per questo fumo e foschia riescono bene"
