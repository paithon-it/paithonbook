- inizio: "Il WER è comodo ma fragile,"
  impronta: "fbc53e6af78a"
  postilla: "«9:30» o una virgola valgono un errore; la normalizzazione va uguale per tutti"
- inizio: "Gli autori di Whisper ne hanno"
