# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Quando pronunci la parola «casa», il"
  impronta: "f6e7edea02aa"
  postilla: "Sedicimila al secondo bastano alla voce; la musica ne vuole quasi il triplo"
- inizio: "Il compito del riconoscimento vocale automatico"
  impronta: "f3c62cc5d61a"
  postilla: "Tanti numeri in ingresso, pochi caratteri in uscita, senza allineamento"
- inizio: "Prima di arrivare alla rete il"
  impronta: "be825af4d891"
  postilla: "Finestre di circa 25 ms, una ogni 10: ognuna è un frame, un centinaio al secondo"
- inizio: "La svolta arriva nel 2006, e"
  impronta: "84832f91a51f"
  postilla: "CTC: il «vuoto» occupa silenzi e respiri e separa due lettere uguali di fila"
- inizio: "Per ogni frame la rete non"
  impronta: "881ae48485e9"
  postilla: "Ogni frame: una distribuzione sui simboli, vuoto compreso, che somma a uno"
- inizio: "Alla CTC non importa da dove"
  impronta: "a1751b0cb343"
  postilla: "La CTC si monta su wav2vec 2.0 e HuBERT; restano i suoi vincoli"
- inizio: "La ricerca a fascio (*beam search*)"
  impronta: "b25c5bbc531a"
  postilla: "Nella CTC percorsi diversi che danno lo stesso testo sono la stessa ipotesi"
- inizio: "A ogni passo il decoder deve"
  impronta: "0fc92a9a4c21"
  postilla: "Attenzione: allineamento morbido, pesi sui frame invece di un cammino"
- inizio: "Una tecnica di addestramento ha contato,"
  impronta: "157580caa82b"
  postilla: "SpecAugment guasta lo spettrogramma, azzerando bande e tratti, in addestramento"
- inizio: "Con quel guasto nell'ingresso, e con"
  impronta: "e9914aef8958"
  postilla: "LAS più grande e col guasto: per gli autori l'overfitting diventa underfitting"
- inizio: "Messe una accanto all'altra, le due"
  impronta: "63e7b858ec79"
  postilla: "Trasduttore (Graves, 2012): avanza sull'audio e sa che cosa ha già scritto"
- inizio: "Scrivere mentre si ascolta, però, non"
  impronta: "2049da9d8e76"
  postilla: "Con un encoder solo sul passato CTC e trasduttore trascrivono in diretta"
- inizio: "Il trasduttore è anche l'architettura che"
  impronta: "7da8861ba450"
  postilla: "Trasduttore sul Pixel: in diretta e senza server, più veloce del tempo reale"
- inizio: "Nel settembre 2022 OpenAI rilascia **Whisper**,"
  impronta: "5e079eca2442"
  postilla: "Whisper: Transformer encoder-decoder; il log-mel misura come sente l'orecchio"
- inizio: "In {numref}`fig-whisper` mancano i pezzi che"
  impronta: "c3d86b218420"
  postilla: "Tre pezzi da mettere a punto lingua per lingua, dizionario di pronuncia compreso"
- inizio: "I tre compiti restano anche qui,"
  impronta: "17536634d2bb"
  postilla: "A pari calcolo, sull'inglese, tante lingue rendono solo nei modelli più grandi"
