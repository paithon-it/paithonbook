  impronta: "7e778974a78d"
  postilla: "Il rischio dei benchmark nei dati: controllo su una raccolta sola, e sul testo"
- inizio: "La prima: Whisper non ha mandato"
  impronta: "ac39c5b282d3"
  postilla: "I sistemi a stadi restano dove le parole sono poche e note in anticipo"
- inizio: "La seconda riguarda la trascrizione in"
  impronta: "2179d6b38619"
  postilla: "Whisper trascrive a blocchi; la dettatura in diretta è dei trasduttori"
- inizio: "Dal decoder con attenzione vengono anche"
  impronta: "6a1badb3b5c5"
