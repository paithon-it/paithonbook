- inizio: "Il modo di farlo entrare cambia"
  impronta: "64c455feea2f"
  postilla: "Prima di ascoltare, un'unica rete: stati degli HMM, fonemi, parole e frasi"
- inizio: "Ogni collegamento aveva un costo, il"
  impronta: "b4d289ea3a5a"
  postilla: "Il WFST somma costi lungo i percorsi; Viterbi cerca il meno costoso"
- inizio: "Nei modelli end-to-end quella rete non"
  impronta: "8cefa4f8a621"
  postilla: "Il modello esterno entra a ogni passo del fascio, o riordina a ricerca finita"
- inizio: "Quanto serva, però, dipende dall'architettura. Un"
  impronta: "5adf928b1ff0"
  postilla: "Col modello interno l'esterno serve ancora; con molte trascrizioni aggiunge poco"
- inizio: "Un modello CTC, invece, decide ogni"
  impronta: "ca61512955a7"
  postilla: "Dieci minuti trascritti: col modello di linguaggio la CTC va dal 40,2 al 4,8%"
- inizio: "dove $S$ è il numero di"
  impronta: "e88c82866f86"
  postilla: "Sostituzioni, cancellazioni, inserzioni: i nomi sono quelli del sistema"
- inizio: "Il WER si minimizza: $0$ è"
  impronta: "794d3f7bd7fd"
  postilla: "Il WER può superare 1 quando le inserzioni superano le parole indovinate"
- inizio: "Un esempio completo, calcolato come quello"
