  impronta: "8077c27613b6"
  postilla: "Stima fra le lingue: l'errore si dimezza se le ore si moltiplicano per sedici"
- inizio: "Con lo stesso modello Whisper trascrive,"
  impronta: "ce62f2eb7eec"
  postilla: "Token speciali scelgono compito e lingua; il decoder li scrive come predizioni"
- inizio: "Gli autori rivendicano per Whisper una"
