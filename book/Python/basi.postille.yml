# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Il primo gesto della programmazione è"
  impronta: "cea65390aeba"
  postilla: "L'uguale attacca un nome a un valore; il doppio uguale chiede se sono uguali"
- inizio: "Ogni valore appartiene a una famiglia,"
  impronta: "b8275e73ff9f"
  postilla: "Il tipo lo deduce Python dal valore; i più usati: numero, stringa, lista"
- inizio: "Dentro le graffe può stare qualsiasi"
  impronta: "bc900e6f993a"
  postilla: "Dopo i due punti il formato: quante cifre decimali e il tipo di presentazione"
- inizio: "Il secondo vantaggio è che una"
  impronta: "1d6e4a41ac52"
  postilla: "Il posto si calcola dalla chiave: serve una chiave che non cambi, neanche dentro"
- inizio: "La terza riga introduce la **fetta**"
  impronta: "b145ea34628b"
  postilla: "Fetta: seconda posizione esclusa, così le fette si incastrano senza buchi"
- inizio: "La seconda è quella di `numeri.append(9)`,"
  impronta: "d6c904a31fe7"
  postilla: "Oggetto, punto, metodo; ma se prima del punto c'è una libreria, è una funzione"
- inizio: "Con il controllo di flusso compare"
  impronta: "101a2f747b20"
  postilla: "In Python il rientro è sintassi: dice dove il blocco comincia e dove finisce"
- inizio: "Il rombo è il punto in"
  impronta: "c35e29d77e5b"
  postilla: "Ciclo infinito: la condizione resta vera, nessun errore, si ferma con Ctrl+C"
- inizio: "Costruire una lista trasformandone un'altra è"
  impronta: "d71dd314badd"
  postilla: "Nome preso dall'insieme per comprensione: in una riga dice ciò che dice il ciclo"
- inizio: "Nell'ultima riga lavorano insieme due segni."
  impronta: "79bade37f9d3"
  postilla: "Resto per due uguale a zero, cioè pari: la riga si legge quasi in italiano"
- inizio: "La stessa forma esiste per i"
  impronta: "6d875b442210"
  postilla: "Espressione generatrice: un valore alla volta, senza costruire la lista"
- inizio: "Un traceback si legge dal fondo."
  impronta: "e73ce7e7a10d"
  postilla: "Le righe sopra: la catena di chiamate, dalla prima in cima alla riga dell'errore"
- inizio: "Il codice delle librerie si usa"
  impronta: "ece72909c139"
  postilla: "Oggetto: dati e azioni insieme; in Python tutto è un oggetto, funzioni comprese"
- inizio: "C'è un secondo modo di dire"
  impronta: "5a0a6b549e78"
  postilla: "with: l'esempio classico è aprire un file, che va sempre richiuso"
- inizio: "L'oggetto usato con `with` si chiama"
  impronta: "3fc37fae7ecf"
  postilla: "Context manager: rimette a posto all'uscita, anche se c'è un'eccezione"
- inizio: "Il **tempo di parete** è quello"
  impronta: "6b14bd14c615"
  postilla: "I due tempi insieme distinguono un thread che lavora da uno che aspetta"
- inizio: "I numeri assoluti dipendono dalla macchina,"
  impronta: "e8f503892920"
  postilla: "Calcolo con quattro thread: il tempo di parete non scende, si alternano (GIL)"
- inizio: "L'esperimento vale solo su una macchina"
  impronta: "ac0926e91e05"
  postilla: "Guardare prima il carico: la prima riga aiuta a sospettarlo, non a escluderlo"
- inizio: "Sotto carico pesante può perfino capitare"
  impronta: "c32a21703574"
  postilla: "Sotto carico i thread finiscono a volte prima, ma non in parallelo: è instabile"
- inizio: "Il tempo di CPU stampato accanto"
  impronta: "b3b4c9239bf4"
  postilla: "Tempo di parete fermo: CPU alta, calcolo a turno (GIL); quasi a zero, attesa"
