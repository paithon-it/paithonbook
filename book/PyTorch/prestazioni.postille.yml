# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Perché numeri più corti facciano andare"
  impronta: "cd1ef7c99e3a"
  postilla: "Dove conta la memoria, numeri lunghi la metà: metà traffico, quasi metà tempo"
- inizio: "La seconda vale per i prodotti"
  impronta: "d18806eebc69"
  postilla: "Nei prodotti fra matrici grandi i tensor core lavorano di norma con numeri corti"
- inizio: "Il programma stampa tre righe, una"
  impronta: "beb71ea16556"
  postilla: "Prodotti fra tabelle a 16 bit, le delicate a 32: poche su CPU col bfloat16"
- inizio: "I due formati corti differiscono nella"
  impronta: "882fdf9fbae8"
  postilla: "Float16 ha più cifre, bfloat16 più grandezza: arriva agli estremi del float32"
- inizio: "La conseguenza pratica è che con"
  impronta: "68f3f265361a"
  postilla: "Bfloat16: di fatto nessun gradiente minuscolo va a zero, e lo scaler si toglie"
- inizio: "Nel codice della precisione mista lo"
  impronta: "a2abe7bca6fe"
  postilla: "Col bfloat16 lo scaler non fa né bene né male: se c'è solo bfloat16, si toglie"
- inizio: "Due precauzioni in questo codice sono"
  impronta: "4108495f94c5"
  postilla: "Prima qualche prova a vuoto, poi il minimo delle ripetizioni: la meno disturbata"
- inizio: "Su CPU, con queste due precauzioni,"
  impronta: "99235208a64a"
  postilla: "Su CPU tempi uguali a meno del rumore: la prova in bianco, dove la coda non c'è"
- inizio: "Il cronometro dice quanto, non dove."
  impronta: "afde126a00ae"
  postilla: "Il profilatore registra la durata di ogni operazione; in testa le più care"
- inizio: "Quando una GPU non basta, la"
  impronta: "ceea99590b5c"
  postilla: "Ogni GPU ha la rete intera e una fetta di batch; all-reduce media i gradienti"
- inizio: "Cambia invece il contorno del ciclo."
  impronta: "d44f2646226b"
  postilla: "Log e checkpoint da un solo processo; metriche da mettere in comune fra le fette"
- inizio: "Prima di imparare qualunque cosa, i"
  impronta: "5219fd128693"
  postilla: "Troppo piccoli smorzano segnale e correzioni, troppo grandi li fanno esplodere"
- inizio: "Le due inizializzazioni classiche sono quella"
  impronta: "c50bcd89016f"
  postilla: "Glorot e He fissano la varianza dei pesi dal numero di collegamenti dello strato"
- inizio: "La prima è pensata per le"
  impronta: "5d4d93a47d2c"
  postilla: "Glorot per le simmetriche, He per la ReLU, che perde circa metà del segnale"
- inizio: "Su uno strato da mille ingressi,"
  impronta: "fb0ea0827c34"
  postilla: "Pesi più piccoli di He: in una rete profonda con ReLU il segnale svanisce"
- inizio: "Prima di ogni ottimizzazione, a ogni"
  impronta: "2c5a4f8f6172"
  postilla: "Su un'epoca il riscaldamento pesa poco; su scheda grafica si sincronizza la coda"
