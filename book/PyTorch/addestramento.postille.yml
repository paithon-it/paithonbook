# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Le cinque righe del ciclo mostrato"
  impronta: "4d61a66e5f8d"
  postilla: "Il ciclo è scritto a mano per scelta: ogni passo resta visibile e modificabile"
- inizio: "L'ottimizzatore è l'oggetto che a ogni"
  impronta: "6755a7950aee"
  postilla: "Passo troppo piccolo: discesa lenta; troppo grande: scavalca, oscilla o diverge"
- inizio: "Di ottimizzatori ce ne sono parecchi,"
  impronta: "58f581c002fe"
  postilla: "SGD: passo unico per tutti; Adam: uno per peso, di solito il primo da provare"
- inizio: "Il terzo passo azzera i gradienti"
  impronta: "79f4797ed2c5"
  postilla: "Senza azzerarlo il gradiente si somma; voluta, la somma simula batch più grandi"
- inizio: "Sono le quattro operazioni con cui"
  impronta: "755918cb78a6"
  postilla: "Loss pesata per le immagini del batch: l'ultimo ne ha meno, la media è su tutte"
- inizio: "Prima di cominciare, con i pesi"
  impronta: "bb363f55154f"
  postilla: "Da pesi casuali (loss circa 2,3) a circa 97% di accuratezza in cinque epoche"
- inizio: "Quanto ci vuole dipende dalla macchina."
  impronta: "1ad3d995b382"
  postilla: "Modello piccolo: tempo soprattutto nel DataLoader; scheda più utile coi grandi"
- inizio: "Il numero stampato a fine epoca"
  impronta: "b1e1977cd9c6"
  postilla: "Decidere guardando il test lo consuma: non stima più l'errore su dati mai visti"
- inizio: "Per questo in un progetto serio"
  impronta: "db15d7d11d47"
  postilla: "Addestramento, validazione per decidere, test toccato una volta sola"
- inizio: "Dentro ci sono i pesi imparati"
  impronta: "adebcf819d8a"
  postilla: "Nel file anche i buffer, senza gradiente: medie della batch norm, una maschera"
- inizio: "Al ricaricamento Python va a cercare"
  impronta: "3f233cdc0f3c"
  postilla: "Salvato intero, va ricostruito da una classe cercata per nome: il codice cambia"
- inizio: "C'è anche una ragione di sicurezza."
  impronta: "053739f7984f"
  postilla: "Da PyTorch 2.6, di default, si caricano solo dati: pickle può eseguire comandi"
- inizio: "Il codice che definisce l'architettura resta"
  impronta: "dc5b4df02563"
  postilla: "Architettura nel codice, pesi nel file: così circolano i modelli pre-addestrati"
- inizio: "Il numero stampato dice che cosa"
  impronta: "1ae7837077f3"
  postilla: "Lo stato dell'ottimizzatore è la memoria accumulata; appena creato è vuoto"
