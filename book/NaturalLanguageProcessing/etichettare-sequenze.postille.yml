# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Un compito affine è il **riconoscimento"
  impronta: "02e53c1b2631"
  postilla: "NER e POS condividono forma e storia: HMM, CRF, poi reti ricorrenti"
- inizio: "Le sigle derivano dall'inglese: `DET` è"
  impronta: "e150b45134fa"
  postilla: "Sigle dall'inglese: preposizioni e posposizioni stanno in un'unica categoria"
- inizio: "Lo schema nasce nel 1995 con"
  impronta: "1a0392f2fa31"
  postilla: "Oggi in genere il «comincia» su ogni entità: ogni parola si legge per conto suo"
- inizio: "Come si insegna a una macchina"
  impronta: "76dfb403ff62"
  postilla: "HMM, la risposta classica: il nome rimanda al patto di Markov dei modelli n-gram"
- inizio: "Le osservazioni sono vettori numerici estratti"
  impronta: "5451b2950b2c"
  postilla: "Con segnali acustici gli HMM dominano la trascrizione per circa trent'anni"
- inizio: "Resta il problema pratico: *trovare* la"
  impronta: "1e46c0398a38"
  postilla: "Con venti parole le sequenze possibili sono troppe per provarle tutte"
- inizio: "La soluzione sta in una proprietà"
  impronta: "45f563bc36b3"
  postilla: "Per costruzione vale il patto di Markov: di qui il nome di modelli a catena"
- inizio: "In che senso questa proprietà viene"
  impronta: "f8755c0a298c"
  postilla: "Basta ricordare il miglior cammino per categoria: è programmazione dinamica"
- inizio: "Facciamo i conti fino in fondo"
  impronta: "a6c992c5bbf2"
  postilla: "Numeri inventati e tondi; in un sistema vero vengono da un corpus etichettato"
- inizio: "Nessuna di queste righe somma a"
  impronta: "6b640010d958"
  postilla: "Il resto va alle parole assenti; senza il pronome, «la» può essere solo articolo"
- inizio: "Un HMM è un modello *generativo*:"
  impronta: "6d7f5bf65319"
  postilla: "HMM e CRF rifanno sulle sequenze la coppia Naive Bayes e regressione logistica"
- inizio: "Il vantaggio è che un CRF,"
  impronta: "94f6abb00270"
  postilla: "Maiuscole e parole vicine fra gli indizi: per anni il riferimento del NER"
- inizio: "E le reti ricorrenti? Nella {doc}`sezione"
  impronta: "ae071d3b5d8f"
  postilla: "Etichettare è il caso ideale per leggere nei due sensi: la frase è già intera"
- inizio: "Un etichettatore neurale minimo (un **tagger**,"
  impronta: "1ab32f78c321"
  postilla: "Tagger: embedding, LSTM bidirezionale, strato lineare, punteggio più alto vince"
- inizio: "La misura dell'errore è quella di"
  impronta: "b29c22e9a8f4"
  postilla: "Perdita per parola, con il padding escluso: altrimenti la rete impara il vuoto"
- inizio: "Escluderle dalla perdita, però, non basta:"
  impronta: "28f445fa1386"
  postilla: "La LSTM all'indietro parte dai riempitivi: si impacchetta con le lunghezze vere"
- inizio: "Questo modello ha però un limite:"
  impronta: "5bb199656731"
  postilla: "Etichette scelte da sole possono dare successioni vietate; un CRF può escluderle"
- inizio: "Il tagger comincia con un embedding"
  impronta: "9708d7351d92"
  postilla: "ELMo impara il contesto prima, su testo senza etichette e non sui pochi esempi"
- inizio: "Questa seconda fase, più breve, si"
  impronta: "af7f89b62c09"
  postilla: "In BERT i due sensi stanno in ogni strato: indovina parole nascoste dai due lati"
