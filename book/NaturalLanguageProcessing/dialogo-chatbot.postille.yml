# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "In sessant'anni i sistemi di dialogo"
  impronta: "87c62d702606"
  postilla: "I sistemi a recupero scelgono battute già dette: non inventano, ma solo ripetono"
- inizio: "Della prima famiglia conosciamo già il"
  impronta: "bde9ce33d5f3"
  postilla: "DOCTOR imita uno psicoterapeuta perché lì si può fingere di sapere quasi nulla"
- inizio: "Trenta righe scarse, eppure l'effetto c'è."
  impronta: "ec891d7176b4"
  postilla: "Le parole dell'utente rigirate danno l'illusione di essere ascoltati"
- inizio: "Qui sta il limite. Quel rudimento"
  impronta: "062f38c87bb9"
  postilla: "A ogni battuta ELIZA riparte quasi da zero: non ha uno stato del dialogo"
- inizio: "La seconda famiglia nasce nel 1977"
  impronta: "05692cc76ed9"
  postilla: "GUS, 1977, Xerox PARC: sei autori e un agente di viaggio per voli a San Diego"
- inizio: "Al centro c'è un'idea che l'articolo"
  impronta: "595660c8515b"
  postilla: "Con GUS il modulo mezzo pieno è lo stato del dialogo, e torna negli assistenti"
- inizio: "La terza famiglia rovescia l'approccio: perché"
  impronta: "338169e08ae0"
  postilla: "I sistemi generativi trattano la risposta come traduzione della battuta"
- inizio: "Come valutare una macchina che conversa"
  impronta: "e0c3aceaf5ce"
  postilla: "Superarlo misura anche quanta comprensione si concede; fallirlo non prova niente"
- inizio: "Resta l'ultima domanda, quella da cui"
  impronta: "a3f4df5cbabe"
  postilla: "Un riflesso: per tutta la storia, linguaggio fluente solo da altri esseri umani"
- inizio: "Weizenbaum ne fu così turbato da"
  impronta: "76b2effba645"
  postilla: "Tesi precisa: la ragione che calcola può decidere, ma decidere non è scegliere"
- inizio: "Decidere, in questo senso stretto, è"
  impronta: "9c1ee8b4e1be"
  postilla: "Scegliere non ha criterio scritto: per Weizenbaum non si riduce a un calcolo"
- inizio: "Niente di tutto questo rende i"
  impronta: "f33642df524a"
  postilla: "Non da vietare: per Weizenbaum ciò che si affida loro va scelto a occhi aperti"
