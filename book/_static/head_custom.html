<!-- PAITHON BOOK - Custom Head Elements -->

<!-- Tema SCURO di default al primo accesso. Rispetta la scelta dell'utente se
     poi cambia col toggle nativo (localStorage). Setta subito data-theme per
     evitare il flash; i token brand commutano da soli su [data-theme="dark"]. -->
<script>
  (function () {
    var KEYS = ['mode', 'theme'];
    var stored = null;
    try {
      for (var i = 0; i < KEYS.length; i++) {
        var v = localStorage.getItem(KEYS[i]);
        if (v) { stored = v; break; }
      }
      if (stored === null) {                 // primo accesso: default scuro
        stored = 'dark';
        for (var j = 0; j < KEYS.length; j++) {
          try { localStorage.setItem(KEYS[j], 'dark'); } catch (e) {}
        }
      }
    } catch (e) { stored = 'dark'; }
    var dark = stored === 'dark' ||
      (stored === 'auto' && window.matchMedia &&
       window.matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    root.dataset.theme = dark ? 'dark' : 'light';
    root.dataset.mode = stored;
  })();
</script>

<!-- Livello di lettura (Elementare / Superiore) scelto dal lettore. Si applica
     subito su <html> perché l'icona in barra non sfarfalli; ad applicarlo alle
     tab ci pensa _static/pt-formato.js quando il DOM è pronto. -->
<script>
  (function () {
    try {
      var livello = localStorage.getItem('pt-livello');
      if ('superiore' === livello || 'elementare' === livello) {
        document.documentElement.dataset.ptLivello = livello;
      }
    } catch (e) { /* niente localStorage: si resta su elementare */ }
  })();
</script>

<!-- Coordinate della pagina, lette da _static/pt-formato.js per costruire il
     link "Segnala" quando il lettore seleziona un pezzo di testo: repo, ramo
     e percorso del file sorgente di QUESTA pagina dentro il repository. -->
<meta name="pt-repo-url" content="{{ theme_repository_url | default('', true) }}">
<meta name="pt-repo-branch" content="{{ theme_repository_branch | default('main', true) }}">
<meta name="pt-page-source" content="{{ theme_path_to_docs | default('', true) }}{{ pagename }}{{ page_source_suffix }}">

<!-- Pagina del magazine che raccoglie un passaggio selezionato qui e ci apre
     l'assistente di lettura (shortcode [paithon_libro] nel repo paithon). Il
     libro è statico e non può autenticare nessuno: là il lettore è loggato a
     casa sua, quindi niente CORS e niente cookie di terze parti.

     INTERRUTTORE: vuoto = la voce "Chiedi all'AI" non compare affatto, ed è
     giusto tenerlo vuoto finché la pagina che riceve il passaggio non esiste:
     un pulsante che porta in un vicolo cieco è peggio di nessun pulsante. -->
<meta name="pt-lettura-url" content="">
