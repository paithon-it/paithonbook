<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" role="img" aria-label="Progressione da scalare a vettore a matrice a tensore: un quadrato singolo, una fila di quattro celle, una griglia tre per quattro, tre griglie impilate">
  <rect x="0" y="0" width="760" height="280" fill="#F8F5EE"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1A1A1A" font-weight="bold">Dalla cifra alla scatola: la scala dei ranghi</text>
  <!-- Scalare -->
  <rect x="55" y="110" width="34" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="72" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1A1A1A" font-weight="bold">scalare</text>
  <text x="72" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5E5852">rango 0</text>
  <!-- freccia -->
  <line x1="110" y1="127" x2="145" y2="127" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M 152 127 l -9 -4.5 l 0 9 z" fill="#1A1A1A"/>
  <!-- Vettore -->
  <g stroke="#1A1A1A" stroke-width="1.5" fill="#2D5A5C">
    <rect x="165" y="110" width="30" height="30"/><rect x="195" y="110" width="30" height="30"/>
    <rect x="225" y="110" width="30" height="30"/><rect x="255" y="110" width="30" height="30"/>
  </g>
  <text x="225" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1A1A1A" font-weight="bold">vettore</text>
  <text x="225" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5E5852">rango 1 · (4,)</text>
  <!-- freccia -->
  <line x1="305" y1="127" x2="340" y2="127" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M 347 127 l -9 -4.5 l 0 9 z" fill="#1A1A1A"/>
  <!-- Matrice -->
  <g stroke="#1A1A1A" stroke-width="1.5" fill="#C9A961">
    <rect x="360" y="82" width="30" height="30"/><rect x="390" y="82" width="30" height="30"/><rect x="420" y="82" width="30" height="30"/><rect x="450" y="82" width="30" height="30"/>
    <rect x="360" y="112" width="30" height="30"/><rect x="390" y="112" width="30" height="30"/><rect x="420" y="112" width="30" height="30"/><rect x="450" y="112" width="30" height="30"/>
    <rect x="360" y="142" width="30" height="30"/><rect x="390" y="142" width="30" height="30"/><rect x="420" y="142" width="30" height="30"/><rect x="450" y="142" width="30" height="30"/>
  </g>
  <text x="420" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1A1A1A" font-weight="bold">matrice</text>
  <text x="420" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5E5852">rango 2 · (3, 4)</text>
  <!-- freccia -->
  <line x1="500" y1="127" x2="535" y2="127" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M 542 127 l -9 -4.5 l 0 9 z" fill="#1A1A1A"/>
  <!-- Tensore: griglie impilate -->
  <rect x="585" y="66" width="120" height="90" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="570" y="80" width="120" height="90" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <g stroke="#1A1A1A" stroke-width="1.5" fill="#2D5A5C">
    <rect x="555" y="94" width="30" height="30"/><rect x="585" y="94" width="30" height="30"/><rect x="615" y="94" width="30" height="30"/><rect x="645" y="94" width="30" height="30"/>
    <rect x="555" y="124" width="30" height="30"/><rect x="585" y="124" width="30" height="30"/><rect x="615" y="124" width="30" height="30"/><rect x="645" y="124" width="30" height="30"/>
    <rect x="555" y="154" width="30" height="30"/><rect x="585" y="154" width="30" height="30"/><rect x="615" y="154" width="30" height="30"/><rect x="645" y="154" width="30" height="30"/>
  </g>
  <text x="622" y="212" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1A1A1A" font-weight="bold">tensore</text>
  <text x="622" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5E5852">rango 3 · (3, 3, 4)</text>
</svg>
