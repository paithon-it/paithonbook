<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: una descrizione in linguaggio naturale entra nel modello Codex, che genera codice Python; il codice viene eseguito contro una batteria di test e solo se li supera è considerato corretto">
  <rect x="0" y="0" width="680" height="300" fill="#F8F5EE"/>
  <!-- Prompt: linguaggio naturale -->
  <rect x="24" y="70" width="170" height="120" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="109" y="95" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold">descrizione</text>
  <text x="109" y="128" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#2D5A5C" text-anchor="middle">def primi(n):</text>
  <text x="109" y="146" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#2D5A5C" text-anchor="middle">"""i primi &lt; n"""</text>
  <text x="109" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852" text-anchor="middle">linguaggio naturale</text>
  <!-- freccia -->
  <line x1="194" y1="130" x2="248" y2="130" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M248 130 l-10 -6 v12 z" fill="#1A1A1A"/>
  <!-- Modello -->
  <rect x="250" y="80" width="150" height="100" rx="8" fill="#C9A961"/>
  <text x="325" y="125" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Codex</text>
  <text x="325" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">GPT su codice</text>
  <!-- freccia -->
  <line x1="400" y1="130" x2="454" y2="130" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M454 130 l-10 -6 v12 z" fill="#1A1A1A"/>
  <!-- Codice generato -->
  <rect x="456" y="70" width="170" height="120" rx="8" fill="none" stroke="#B5532C" stroke-width="2"/>
  <text x="541" y="95" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold">codice generato</text>
  <text x="541" y="126" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#B5532C" text-anchor="middle">return [x for x</text>
  <text x="541" y="142" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#B5532C" text-anchor="middle">in range(2,n)...]</text>
  <text x="541" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852" text-anchor="middle">Python eseguibile</text>
  <!-- verifica: test -->
  <line x1="541" y1="190" x2="541" y2="222" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M541 222 l-6 -10 h12 z" fill="#1A1A1A"/>
  <rect x="416" y="224" width="250" height="46" rx="8" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="541" y="245" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle" font-weight="bold">esegui i test unitari</text>
  <text x="541" y="262" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852" text-anchor="middle">corretto solo se passano tutti (pass@k)</text>
  <text x="150" y="255" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">HumanEval: 164 problemi</text>
  <text x="150" y="272" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852" text-anchor="middle">~7,7 test ciascuno</text>
</svg>
