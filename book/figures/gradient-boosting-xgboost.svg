<svg viewBox="0 0 680 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema del gradient boosting: quattro modelli in sequenza, ognuno addestrato sui residui del precedente; le barre dell'errore si riducono da sinistra a destra e la somma dei contributi forma la predizione finale">
  <rect x="0" y="0" width="680" height="340" fill="#F8F5EE"/>
  <!-- Modello 1 -->
  <rect x="30" y="60" width="110" height="70" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="85" y="90" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">albero 1</text>
  <text x="85" y="110" font-family="sans-serif" font-size="12" fill="#2D5A5C" text-anchor="middle">predice y</text>
  <!-- barra errore 1 -->
  <rect x="55" y="160" width="60" height="90" fill="#B5532C"/>
  <text x="85" y="270" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">errore</text>
  <!-- freccia 1->2 -->
  <line x1="140" y1="95" x2="190" y2="95" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M190 95 l-9 -5 v10 z" fill="#1A1A1A"/>
  <text x="165" y="82" font-family="sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">residui</text>
  <!-- Modello 2 -->
  <rect x="195" y="60" width="110" height="70" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="250" y="90" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">albero 2</text>
  <text x="250" y="110" font-family="sans-serif" font-size="12" fill="#2D5A5C" text-anchor="middle">corregge 1</text>
  <rect x="220" y="195" width="60" height="55" fill="#B5532C"/>
  <text x="250" y="270" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">errore</text>
  <!-- freccia 2->3 -->
  <line x1="305" y1="95" x2="355" y2="95" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M355 95 l-9 -5 v10 z" fill="#1A1A1A"/>
  <text x="330" y="82" font-family="sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">residui</text>
  <!-- Modello 3 -->
  <rect x="360" y="60" width="110" height="70" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="415" y="90" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">albero 3</text>
  <text x="415" y="110" font-family="sans-serif" font-size="12" fill="#2D5A5C" text-anchor="middle">corregge 1+2</text>
  <rect x="385" y="220" width="60" height="30" fill="#B5532C"/>
  <text x="415" y="270" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">errore</text>
  <!-- freccia 3->somma -->
  <line x1="470" y1="95" x2="520" y2="95" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M520 95 l-9 -5 v10 z" fill="#1A1A1A"/>
  <text x="495" y="82" font-family="sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">residui</text>
  <!-- Somma finale -->
  <rect x="525" y="50" width="130" height="90" rx="8" fill="#C9A961"/>
  <text x="590" y="85" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="bold">somma pesata</text>
  <text x="590" y="105" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">η·(1+2+3+…)</text>
  <rect x="560" y="238" width="60" height="12" fill="#B5532C"/>
  <text x="590" y="270" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">errore finale</text>
  <!-- linea base errori -->
  <line x1="30" y1="250" x2="655" y2="250" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="340" y="315" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">ogni modello riduce l'errore residuo lasciato dai precedenti</text>
</svg>
