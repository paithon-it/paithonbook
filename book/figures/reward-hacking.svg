<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grafico: all'aumentare dell'ottimizzazione la metrica-proxy continua a salire mentre l'obiettivo vero, dopo un punto di divergenza detto punto di Goodhart, comincia a scendere">
  <rect x="0" y="0" width="760" height="420" fill="#F8F5EE"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">La metrica sale, l'intento la abbandona</text>

  <!-- axes -->
  <line x1="95" y1="70" x2="95" y2="350" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="95" y1="350" x2="700" y2="350" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="90" y="60" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5E5852">valore</text>
  <text x="398" y="388" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">quanto ottimizzo la metrica &#8594;</text>

  <!-- Goodhart marker -->
  <line x1="400" y1="70" x2="400" y2="350" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="400" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1A1A">punto di Goodhart</text>

  <!-- proxy metric (teal), keeps rising -->
  <path d="M 95 320 C 240 250, 330 160, 400 130 C 500 95, 620 88, 685 86" fill="none" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="692" y="86" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2D5A5C">metrica</text>

  <!-- true objective (terracotta), rises then falls -->
  <path d="M 95 320 C 220 250, 330 205, 400 200 C 500 195, 610 275, 685 330" fill="none" stroke="#B5532C" stroke-width="2.5"/>
  <text x="692" y="336" font-family="sans-serif" font-size="12" font-weight="bold" fill="#B5532C">intento vero</text>

  <!-- gap annotation -->
  <line x1="600" y1="112" x2="600" y2="300" stroke="#C9A961" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="588" y="208" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5E5852">il divario</text>
  <text x="588" y="224" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5E5852">tra numero e scopo</text>

  <text x="150" y="300" font-family="sans-serif" font-size="11" fill="#5E5852">qui salgono insieme</text>
</svg>
