<svg viewBox="0 0 760 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Masked language model: la frase Il gatto MASK sul divano, con il contesto sinistro e destro che convergono sulla parola mascherata, un encoder bidirezionale che predice la parola dorme">
  <defs>
    <marker id="ah147" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" fill="#F8F5EE"/>

  <!-- context arrows converging on MASK -->
  <path d="M 250 96 Q 315 40 373 90" fill="none" stroke="#2D5A5C" stroke-width="2" marker-end="url(#ah147)"/>
  <path d="M 515 96 Q 450 40 397 90" fill="none" stroke="#C9A961" stroke-width="2" marker-end="url(#ah147)"/>
  <text x="270" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2D5A5C">contesto sinistro</text>
  <text x="500" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#C9A961">contesto destro</text>

  <!-- tokens -->
  <rect x="55" y="98" width="110" height="54" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="110" y="131" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1A1A1A">Il</text>
  <rect x="185" y="98" width="110" height="54" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="240" y="131" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1A1A1A">gatto</text>
  <rect x="315" y="98" width="110" height="54" rx="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="370" y="131" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">[MASK]</text>
  <rect x="445" y="98" width="110" height="54" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="131" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1A1A1A">sul</text>
  <rect x="575" y="98" width="130" height="54" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="640" y="131" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1A1A1A">divano</text>

  <!-- connectors token -> encoder -->
  <line x1="110" y1="152" x2="110" y2="222" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="240" y1="152" x2="240" y2="222" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="370" y1="152" x2="370" y2="222" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="500" y1="152" x2="500" y2="222" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="640" y1="152" x2="640" y2="222" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- encoder -->
  <rect x="55" y="222" width="650" height="66" rx="6" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="380" y="252" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#F8F5EE">Encoder Transformer bidirezionale</text>
  <text x="380" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">ogni parola vede tutte le altre, a sinistra e a destra</text>

  <!-- output -->
  <line x1="370" y1="288" x2="370" y2="330" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah147)"/>
  <rect x="300" y="330" width="140" height="40" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="370" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#B5532C">predice: dorme</text>
</svg>
