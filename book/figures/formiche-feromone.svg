  <path class="via" d="M 138 214 Q 340 34 542 214" stroke="#C9A961" stroke-width="5.7" style="animation:vial var(--d) infinite"/><path class="via" d="M 138 214 Q 340 292 542 214" stroke="#B5532C" stroke-width="17.0" style="animation:viac var(--d) infinite"/><circle class="nodo" cx="108" cy="214" r="30"/><text class="lbl" x="108" y="268" text-anchor="middle">formicaio</text><circle class="nodo" cx="572" cy="214" r="30"/><text class="lbl" x="572" y="268" text-anchor="middle">cibo</text><text class="lbs" x="340" y="76" text-anchor="middle" style="fill:#C9A961">strada lunga · venti minuti</text><text class="lbs" x="340" y="300" text-anchor="middle" style="fill:#B5532C">strada corta · dieci minuti</text><text class="cnt" x="340" y="366" text-anchor="middle" opacity="0" style="animation:cnt0 var(--d) infinite">50 formiche su cento prendono la corta</text><text class="lbs" x="340" y="390" text-anchor="middle" opacity="0" style="animation:cnt0 var(--d) infinite">giro 1</text><text class="cnt" x="340" y="366" text-anchor="middle" opacity="0" style="animation:cnt1 var(--d) infinite">66 formiche su cento prendono la corta</text><text class="lbs" x="340" y="390" text-anchor="middle" opacity="0" style="animation:cnt1 var(--d) infinite">giro 2</text><text class="cnt" x="340" y="366" text-anchor="middle" opacity="0" style="animation:cnt2 var(--d) infinite">73 formiche su cento prendono la corta</text><text class="lbs" x="340" y="390" text-anchor="middle" opacity="0" style="animation:cnt2 var(--d) infinite">giro 3</text><text class="cnt" x="340" y="366" text-anchor="middle" opacity="0" style="animation:cnt3 var(--d) infinite">77 formiche su cento prendono la corta</text><text class="lbs" x="340" y="390" text-anchor="middle" opacity="0" style="animation:cnt3 var(--d) infinite">giro 4</text><text class="cnt" x="340" y="366" text-anchor="middle" opacity="0" style="animation:cnt4 var(--d) infinite">80 formiche su cento prendono la corta</text><text class="lbs" x="340" y="390" text-anchor="middle" opacity="0" style="animation:cnt4 var(--d) infinite">giro 5</text><text class="cnt" x="340" y="366" text-anchor="middle" opacity="1" style="animation:cnt5 var(--d) infinite">82 formiche su cento prendono la corta</text><text class="lbs" x="340" y="390" text-anchor="middle" opacity="1" style="animation:cnt5 var(--d) infinite">giro 6</text><text class="lbl" x="340" y="36" text-anchor="middle">lo spessore è il feromone depositato</text><text class="lbs" x="340" y="416" text-anchor="middle">nessuna formica ha misurato le due strade</text>
</svg>
