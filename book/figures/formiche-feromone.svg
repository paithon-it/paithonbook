    @keyframes viac{0.00%{stroke-width:2.5}0.00%{stroke-width:2.5}7.50%{stroke-width:2.5}16.67%{stroke-width:4.6}24.17%{stroke-width:4.6}33.33%{stroke-width:7.4}40.83%{stroke-width:7.4}50.00%{stroke-width:10.4}57.50%{stroke-width:10.4}66.67%{stroke-width:13.7}74.17%{stroke-width:13.7}83.33%{stroke-width:17.0}90.83%{stroke-width:17.0}100.00%{stroke-width:17.0}}
    @keyframes cnt0{0.00%{opacity:0}0.00%{opacity:1}7.50%{opacity:1}8.70%{opacity:0}100.00%{opacity:0}}
    @keyframes cnt1{0.00%{opacity:0}15.47%{opacity:0}16.67%{opacity:1}24.17%{opacity:1}25.37%{opacity:0}100.00%{opacity:0}}
