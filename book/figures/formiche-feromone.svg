<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436"
     role="img" aria-label="Formicaio a sinistra e cibo a destra, uniti da due strade: una lunga che sale in alto e una corta in basso. Giro dopo giro entrambe si ispessiscono, perché su entrambe passano formiche, ma la corta molto più in fretta, e il divario fra le due cresce. Il contatore in basso dice quante formiche su cento scelgono la corta: si parte da cinquanta e si arriva a ottantadue.">
  <style>
