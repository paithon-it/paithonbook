  <line x1="372" y1="97.7" x2="372" y2="120.7" stroke="#C9A961" stroke-width="2.5"/><polygon points="372,93.7 367,105.7 377,105.7" fill="#C9A961"/><polygon points="372,124.7 367,112.7 377,112.7" fill="#C9A961"/>
  <line x1="96" y1="337" x2="126" y2="337" stroke="#1A1A1A" stroke-width="3"/><text x="142" y="347" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">quanto era probabile il dato, per davvero</text><text x="142" y="366" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" opacity="0.68">non si sa calcolare, e sale anche lui mentre il modello migliora</text>
  <line x1="96" y1="385" x2="126" y2="385" stroke="#B5532C" stroke-width="3"/><text x="142" y="395" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">la stima prudente, che spingiamo in su</text><text x="142" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" opacity="0.68">sale per tutte e due le ragioni: modello migliore, divario più stretto</text>
  <line x1="111" y1="427" x2="111" y2="449" stroke="#C9A961" stroke-width="2.5"/><polygon points="111,424 106,434 116,434" fill="#C9A961"/><polygon points="111,452 106,442 116,442" fill="#C9A961"/><text x="142" y="443" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">il divario</text><text x="142" y="462" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" opacity="0.68">quanto l’archivista sbaglia a dire dove guardare, e si stringe da sé</text>
</svg>
