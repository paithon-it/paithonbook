  <polyline points="100,298.0 112,282.4 124,268.0 136,254.6 148,242.3 160,230.8 172,220.2 184,210.5 196,201.4 208,193.0 220,185.2 232,178.1 244,171.4 256,165.2 268,159.5 280,154.2 292,149.3 304,144.8 316,140.6 328,136.7 340,133.1 352,129.8 364,126.7 376,123.8 388,121.1 400,118.7 412,116.4 424,114.2 436,112.3 448,110.4 460,108.7 472,107.2 484,105.7 496,104.4 508,103.1 520,101.9 532,100.8 544,99.8 556,98.9 568,98.0 580,97.2 592,96.5 604,95.8 616,95.1 628,94.5 640,93.9 652,93.4" fill="none" stroke="#B5532C" stroke-width="3"/>
