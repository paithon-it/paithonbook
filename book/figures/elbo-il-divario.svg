  <line x1="88" y1="56" x2="88" y2="300" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="88" y1="300" x2="660" y2="300" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="88" y="46" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">nat</text>
  <text x="660" y="322" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="end">addestramento</text>
