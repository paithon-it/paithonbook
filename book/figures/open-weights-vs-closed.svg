  <line x1="120" y1="430" x2="120" y2="90" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="370" y1="90" x2="370" y2="430" stroke="#C5BEAA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="120" y1="270" x2="620" y2="270" stroke="#C5BEAA" stroke-width="1.5" stroke-dasharray="6 5"/>

