<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" role="img" aria-label="Mappa a quadranti. Sull'asse orizzontale come il modello è messo a disposizione, da chiuso e raggiungibile solo via interfaccia, a sinistra, a pesi scaricabili da chiunque, a destra. Sull'asse verticale la capacità, dal basso verso l'alto. I punti sono distribuiti in tutti e quattro i quadranti e nessuno dei due lati domina l'altro: ce ne sono di capaci fra i chiusi e fra gli aperti, e di contenuti in entrambi. I punti non portano nomi.">
  <rect x="0" y="0" width="700" height="500" fill="#F8F5EE"/>
  <text x="350" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Due assi indipendenti</text>

