<svg viewBox="0 0 760 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: il bias entra dai dati storici, attraversa il modello che lo amplifica e riappare negli output; una freccia di feedback mostra che gli output diventano i dati del futuro">
  <rect x="0" y="0" width="760" height="400" fill="#F8F5EE"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Come il bias attraversa la catena</text>

  <!-- boxes -->
  <rect x="45" y="150" width="185" height="90" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="137" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#F8F5EE">DATI</text>
  <text x="137" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">il mondo, così com'è</text>

  <rect x="288" y="150" width="185" height="90" rx="8" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="380" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">MODELLO</text>
  <text x="380" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">impara e amplifica</text>

  <rect x="531" y="150" width="185" height="90" rx="8" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="623" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#F8F5EE">OUTPUT</text>
  <text x="623" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">decisioni, punteggi</text>

  <!-- arrows between boxes -->
  <line x1="230" y1="195" x2="284" y2="195" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="284,195 274,190 274,200" fill="#1A1A1A"/>
  <line x1="473" y1="195" x2="527" y2="195" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="527,195 517,190 517,200" fill="#1A1A1A"/>

  <!-- bias entering at data -->
  <text x="137" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">bias storico e di</text>
  <text x="137" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">rappresentazione entra qui</text>
  <line x1="137" y1="120" x2="137" y2="146" stroke="#B5532C" stroke-width="2"/>
  <polygon points="137,150 132,140 142,140" fill="#B5532C"/>

  <!-- feedback loop -->
  <path d="M 623 244 C 623 330, 137 330, 137 244" fill="none" stroke="#2D5A5C" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="137,244 132,254 142,254" fill="#2D5A5C"/>
  <text x="380" y="352" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#2D5A5C">il feedback: le decisioni di oggi diventano i dati di domani</text>
</svg>
