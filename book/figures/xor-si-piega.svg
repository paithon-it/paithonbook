="436" y="334.5">0</text><line class="ax" x1="614.9" y1="378" x2="614.9" y2="384"/><text class="lbs" x="614.9" y="370" text-anchor="middle">1</text><line class="ax" x1="424" y1="193.1" x2="430" y2="193.1"/><text class="lbs" x="436" y="198.1">1</text><line class="scia mobile via" x1="487.0" y1="201.6" x2="538.2" y2="252.8"/><circle class="ombra mobile via" cx="478.5" cy="193.1" r="9"/><line class="scia mobile via" x1="606.4" y1="321.0" x2="555.2" y2="269.8"/><circle class="ombra mobile via" cx="614.9" cy="329.5" r="9"/><line class="scia mobile via" x1="478.5" y1="317.5" x2="478.5" y2="136.9"/><circle class="ombra mobile via" cx="478.5" cy="329.5" r="9"/><line class="scia mobile via" x1="620.3" y1="203.8" x2="677.7" y2="318.7"/><circle class="ombra mobile via" cx="614.9" cy="193.1" r="9"/><g clip-path="url(#campoD)"><rect class="zona mobile esce" x="-620" y="0" width="1240" height="620" transform="translate(563.3,244.7) rotate(45.0)"/><line class="sep mobile esce" x1="-620" y1="0" x2="620" y2="0" transform="translate(563.3,244.7) rotate(45.0)"/></g><text class="lbs mobile esce" x="540" y="320">ŷ = 1</text><text class="lbs mobile esce" x="710" y="130" text-anchor="end">ŷ = 0</text><circle class="anello mobile giunti" cx="546.7" cy="261.3" r="16"/><circle class="pt mobile pos v0" cx="546.7" cy="261.3" r="9"/><circle class="pt mobile pos v1" cx="546.7" cy="261.3" r="9"/><circle class="pt mobile neg v2" cx="478.5" cy="124.9" r="9"/><circle class="pt mobile neg v3" cx="683.1" cy="329.5" r="9"/><text class="lbl" x="424" y="68">le rappresentazioni intermedie (h₁, h₂)</text><text class="eti mobile" x="56" y="418" style="animation:dida0 var(--d) infinite">i quattro casi dello XOR: le due classi occupano gli angoli opposti</text><text class="eti mobile" x="56" y="418" style="animation:dida1 var(--d) infinite">due neuroni nascosti, due rette: in mezzo restano i casi con uscita 1</text><text class="eti mobile" x="56" y="418" style="animation:dida2 var(--d) infinite">il primo strato dà a ogni punto due coordinate nuove</text><text class="eti mobile" x="56" y="418" style="animation:dida3 var(--d) infinite;opacity:1">nelle coordinate nuove una retta sola basta, e i due casi con uscita 1 coincidono</text><text class="cnt mobile esce" x="56" y="448">nessun punto sbagliato: la rete calcola 0, 1, 1, 0, cioè lo XOR</text><text class="lbs" x="56" y="478">h₁ = ReLU(x₁ + x₂ − 0,5)</text><text class="lbs" x="424" y="478">h₂ = ReLU(−x₁ − x₂ + 1,5)</text><text class="lbs" x="56" y="498">ŷ = g(−0,71·h₁ − 0,71·h₂ + 0,88), con g il gradino e i pesi dell'uscita trovati addestrando</text><circle class="pt pos" cx="62" cy="30" r="9"/><text class="lbs" x="80" y="35">XOR = 1</text><circle class="pt neg" cx="174" cy="30" r="9"/><text class="lbs" x="192" y="35">XOR = 0</text><line class="nas" x1="376" y1="30" x2="402" y2="30"/><text class="lbs" x="410" y="35">neuroni nascosti</text><line class="sep" x1="562" y1="30" x2="588" y2="30"/><text class="lbs" x="596" y="35">neurone di uscita</text>
