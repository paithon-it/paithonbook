<!--
  paithon book, figura animata: due strati piegano lo XOR
  Generata da animazioni/svg/xor-si-piega.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 524"
     role="img" aria-label="Due pannelli affiancati. A sinistra i quattro casi dello XOR agli angoli del quadrato unitario, in terracotta i due con uscita 1 e in teal i due con uscita 0, tagliati da due rette parallele, i due neuroni nascosti, che lasciano in mezzo una fascia con i soli punti terracotta. A destra gli stessi quattro punti si spostano nelle coordinate calcolate da quei neuroni: i due terracotta finiscono esattamente nello stesso posto e i due teal si allontanano ai lati opposti, e a quel punto una sola retta li separa.">
  <style>
    svg  { --d: 9.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .pt  { stroke:#F8F5EE; stroke-width:1.5; }
    .pos { fill:#B5532C; }
    .neg { fill:#2D5A5C; }
    .sep { stroke:#1A1A1A; stroke-width:3; fill:none; }
    .nas { stroke:#C9A961; stroke-width:2.5; fill:none; }
    .banda { stroke:#C9A961; stroke-opacity:0.16; fill:none; }
    .zona { fill:#B5532C; fill-opacity:0.09; }
    .scia { stroke:#C5BEAA; stroke-width:1.6; stroke-dasharray:5 5; }
    .ombra { fill:none; stroke:#C5BEAA; stroke-width:1.6; }
    .anello { fill:none; stroke:#C9A961; stroke-width:2; }
    .nom { font-family:Inter, system-ui, sans-serif; font-size:15px; font-weight:700; fill:#C9A961; }
    .eti { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#5A524A; opacity:0; }
    .cnt { font-family:Inter, system-ui, sans-serif; font-size:16px; font-weight:700; fill:#B5532C; }
    #partenza { animation:attenua var(--d) infinite; }
    .nasc   { animation:nasc var(--d) infinite; }
    .via    { animation:via var(--d) infinite; }
    .esce   { animation:esce var(--d) infinite; }
    .giunti { animation:giunti var(--d) infinite; }
    .v0 { animation:vola0 var(--d) infinite; transform-box:view-box; }
    .v1 { animation:vola1 var(--d) infinite; transform-box:view-box; }
    .v2 { animation:vola2 var(--d) infinite; transform-box:view-box; }
    .v3 { animation:vola3 var(--d) infinite; transform-box:view-box; }
        @keyframes attenua{0.00%{opacity:1}68.00%{opacity:1}72.00%{opacity:0.8}100.00%{opacity:0.8}}
    @keyframes nasc{0.00%{opacity:0}20.00%{opacity:0}22.00%{opacity:1}100.00%{opacity:1}}
    @keyframes via{0.00%{opacity:0}42.00%{opacity:0}44.00%{opacity:1}100.00%{opacity:1}}
    @keyframes esce{0.00%{opacity:0}70.00%{opacity:0}72.00%{opacity:1}100.00%{opacity:1}}
    @keyframes giunti{0.00%{opacity:0}56.00%{opacity:0}58.00%{opacity:1}100.00%{opacity:1}}
    @keyframes vola0{0.00%{transform:translate(-68.2px,-68.2px)}44.00%{transform:translate(-68.2px,-68.2px)}58.00%{transform:translate(0px,0px)}100.00%{transform:translate(0px,0px)}}
    @keyframes vola1{0.00%{transform:translate(68.2px,68.2px)}44.00%{transform:translate(68.2px,68.2px)}58.00%{transform:translate(0px,0px)}100.00%{transform:translate(0px,0px)}}
    @keyframes vola2{0.00%{transform:translate(0.0px,204.5px)}44.00%{transform:translate(0.0px,204.5px)}58.00%{transform:translate(0px,0px)}100.00%{transform:translate(0px,0px)}}
    @keyframes vola3{0.00%{transform:translate(-68.2px,-136.4px)}44.00%{transform:translate(-68.2px,-136.4px)}58.00%{transform:translate(0px,0px)}100.00%{transform:translate(0px,0px)}}
    @keyframes dida0{0.00%{opacity:1}20.00%{opacity:1}22.00%{opacity:0}100.00%{opacity:0}}
    @keyframes dida1{0.00%{opacity:0}20.00%{opacity:0}22.00%{opacity:1}40.00%{opacity:1}42.00%{opacity:0}100.00%{opacity:0}}
    @keyframes dida2{0.00%{opacity:0}40.00%{opacity:0}42.00%{opacity:1}70.00%{opacity:1}72.00%{opacity:0}100.00%{opacity:0}}
    @keyframes dida3{0.00%{opacity:0}70.00%{opacity:0}72.00%{opacity:1}100.00%{opacity:1}}
    @media (prefers-reduced-motion:reduce) { #partenza, .mobile { animation:none !important; } }
  </style>
