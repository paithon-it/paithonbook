<svg viewBox="0 0 800 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: pipeline AutoML automatizzata, dal dataset al modello migliore attraverso un loop di ricerca">
  <rect x="0" y="0" width="800" height="430" fill="#F8F5EE"/>
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">La pipeline automatizzata dell'AutoML</text>
  <!-- dataset -->
  <rect x="40" y="80" width="150" height="60" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="115" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Dataset</text>
  <text x="115" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">+ budget di tempo</text>
  <line x1="190" y1="110" x2="250" y2="110" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="250,110 238,104 238,116" fill="#1A1A1A"/>
  <!-- loop box -->
  <rect x="255" y="60" width="330" height="290" fill="none" stroke="#2D5A5C" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="420" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2D5A5C">LOOP DI RICERCA (automatico)</text>
  <!-- step 1 -->
  <rect x="290" y="95" width="260" height="50" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="420" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8F5EE">1. Scegli candidato</text>
  <text x="420" y="133" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">modello + iperparametri</text>
  <line x1="420" y1="145" x2="420" y2="170" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="420,170 414,158 426,158" fill="#1A1A1A"/>
  <!-- step 2 -->
  <rect x="290" y="172" width="260" height="50" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="420" y="193" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8F5EE">2. Addestra e valuta</text>
  <text x="420" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">cross-validation sul train</text>
  <line x1="420" y1="222" x2="420" y2="247" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="420,247 414,235 426,235" fill="#1A1A1A"/>
  <!-- step 3 -->
  <rect x="290" y="249" width="260" height="50" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="420" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8F5EE">3. Aggiorna le stime</text>
  <text x="420" y="287" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">cosa e' promettente? cosa costa?</text>
  <!-- loop arrow back -->
  <line x1="290" y1="274" x2="268" y2="274" stroke="#B5532C" stroke-width="2"/>
  <line x1="268" y1="274" x2="268" y2="120" stroke="#B5532C" stroke-width="2"/>
  <line x1="268" y1="120" x2="290" y2="120" stroke="#B5532C" stroke-width="2"/>
  <polygon points="290,120 278,114 278,126" fill="#B5532C"/>
  <text x="264" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B5532C" transform="rotate(-90 264 200)">finche' c'e' budget</text>
  <!-- output -->
  <line x1="585" y1="205" x2="640" y2="205" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="640,205 628,199 628,211" fill="#1A1A1A"/>
  <rect x="645" y="175" width="130" height="60" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="710" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8F5EE">Modello</text>
  <text x="710" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8F5EE">migliore</text>
  <!-- human review -->
  <rect x="615" y="290" width="160" height="60" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="695" y="313" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">Il tuo giudizio</text>
  <text x="695" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">baseline, costi, vincoli</text>
  <line x1="710" y1="235" x2="700" y2="290" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="700,290 696,277 708,279" fill="#1A1A1A"/>
  <text x="400" y="405" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">La macchina cicla, tu decidi: l'ultimo passo non si automatizza.</text>
</svg>
