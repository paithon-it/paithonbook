<?xml version="1.0" encoding="UTF-8"?>
<!--
  paithon book - figura: AlexNet 2012, due tronchi e il salto.
  Sinistra: gli otto strati addestrabili spezzati in DUE colonne, una per GPU,
  come nel paper: fra conv1-conv2 e fra conv3-conv4-conv5 le colonne restano
  separate; dopo conv2 e su tutti i passaggi densi le connessioni incrociano
  (linee a X). Destra: il salto dell'errore top-5, 26,2% -> 15,3%.
  Palette-locked, fondo trasparente.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" role="img"
     aria-label="A sinistra gli otto strati addestrabili di AlexNet divisi in due colonne, una per ciascuna delle due GPU: cinque strati convolutivi in teal e tre densi in ocra. Fra il primo e il secondo strato, e fra il terzo, il quarto e il quinto, le due colonne restano separate; dopo il secondo strato e su tutti i passaggi fra gli strati densi le connessioni incrociano da una GPU all'altra, disegnate come linee a X. A destra il confronto dell'errore top-5: 26,2% per i metodi costruiti a mano, 15,3% per AlexNet.">
  <style>
    .tit { font-family:Inter, system-ui, sans-serif; font-size:16px; font-weight:bold; fill:#1A1A1A; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:11px; fill:#1A1A1A; }
    .leg { font-family:Inter, system-ui, sans-serif; font-size:11px; fill:#5E5852; }
    .num { font-family:Inter, system-ui, sans-serif; font-size:14px; font-weight:bold; fill:#1A1A1A; }
  </style>
  <text class="tit" x="350" y="30" text-anchor="middle">Profondità + GPU = svolta</text>

  <!-- DUE TRONCHI -->
  <g transform="translate(60,58)">
    <text class="leg" x="90" y="0" text-anchor="middle">8 strati addestrabili, spezzati in due</text>
    <!-- conv1 -->
    <rect x="20"  y="12" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <rect x="100" y="12" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <!-- dritte -->
    <line x1="42" y1="28" x2="42" y2="40" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="58" y1="28" x2="58" y2="40" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="122" y1="28" x2="122" y2="40" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="138" y1="28" x2="138" y2="40" stroke="#1A1A1A" stroke-width="1.6"/>
    <!-- conv2 -->
    <rect x="20"  y="40" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <rect x="100" y="40" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <!-- INCROCIO dopo conv2 -->
    <g stroke="#B5532C" stroke-width="1.8">
      <line x1="50" y1="56" x2="50" y2="70"/><line x1="130" y1="56" x2="130" y2="70"/>
      <line x1="50" y1="56" x2="130" y2="70"/><line x1="130" y1="56" x2="50" y2="70"/>
    </g>
    <!-- conv3 -->
    <rect x="20"  y="70" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <rect x="100" y="70" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <line x1="42" y1="86" x2="42" y2="98" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="58" y1="86" x2="58" y2="98" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="122" y1="86" x2="122" y2="98" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="138" y1="86" x2="138" y2="98" stroke="#1A1A1A" stroke-width="1.6"/>
    <!-- conv4 -->
    <rect x="20"  y="98" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <rect x="100" y="98" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <line x1="42" y1="114" x2="42" y2="126" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="58" y1="114" x2="58" y2="126" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="122" y1="114" x2="122" y2="126" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="138" y1="114" x2="138" y2="126" stroke="#1A1A1A" stroke-width="1.6"/>
    <!-- conv5 -->
    <rect x="20"  y="126" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <rect x="100" y="126" width="60" height="16" rx="4" fill="#2D5A5C"/>
    <!-- INCROCIO conv5 -> fc6 -->
    <g stroke="#B5532C" stroke-width="1.8">
      <line x1="50" y1="142" x2="50" y2="156"/><line x1="130" y1="142" x2="130" y2="156"/>
      <line x1="50" y1="142" x2="130" y2="156"/><line x1="130" y1="142" x2="50" y2="156"/>
    </g>
    <!-- fc6 -->
    <rect x="20"  y="156" width="60" height="16" rx="4" fill="#C9A961"/>
    <rect x="100" y="156" width="60" height="16" rx="4" fill="#C9A961"/>
    <!-- INCROCIO fc6 -> fc7 -->
    <g stroke="#B5532C" stroke-width="1.8">
      <line x1="50" y1="172" x2="50" y2="186"/><line x1="130" y1="172" x2="130" y2="186"/>
      <line x1="50" y1="172" x2="130" y2="186"/><line x1="130" y1="172" x2="50" y2="186"/>
    </g>
    <!-- fc7 -->
    <rect x="20"  y="186" width="60" height="16" rx="4" fill="#C9A961"/>
    <rect x="100" y="186" width="60" height="16" rx="4" fill="#C9A961"/>
    <!-- INCROCIO fc7 -> fc8 -->
    <g stroke="#B5532C" stroke-width="1.8">
      <line x1="50" y1="202" x2="50" y2="216"/><line x1="130" y1="202" x2="130" y2="216"/>
      <line x1="50" y1="202" x2="130" y2="216"/><line x1="130" y1="202" x2="50" y2="216"/>
    </g>
    <!-- fc8 -->
    <rect x="20"  y="216" width="60" height="16" rx="4" fill="#C9A961"/>
    <rect x="100" y="216" width="60" height="16" rx="4" fill="#C9A961"/>
    <!-- etichette laterali -->
    <text class="leg" x="172" y="80">conv</text>
    <text class="leg" x="172" y="198">densi</text>
    <!-- GPU -->
    <rect x="20"  y="248" width="60" height="22" rx="5" fill="none" stroke="#1A1A1A" stroke-width="1.6"/>
    <rect x="100" y="248" width="60" height="22" rx="5" fill="none" stroke="#1A1A1A" stroke-width="1.6"/>
    <text class="lbl" x="50"  y="263" text-anchor="middle">GPU 1</text>
    <text class="lbl" x="130" y="263" text-anchor="middle">GPU 2</text>
    <text class="leg" x="90" y="292" text-anchor="middle">2× GTX 580, ~6 giorni</text>
    <text class="leg" x="90" y="308" text-anchor="middle">in terracotta: dove le due metà si parlano</text>
  </g>

  <!-- freccia -->
  <path d="M 270,175 L 420,175" stroke="#1A1A1A" stroke-width="2.4"/>
  <polygon points="428,175 414,168 414,182" fill="#1A1A1A"/>
  <text class="lbl" x="349" y="163" text-anchor="middle">profondità + GPU</text>

  <!-- SALTO DELL'ERRORE -->
  <g transform="translate(440,58)">
    <line x1="20" y1="14" x2="20" y2="230" stroke="#1A1A1A" stroke-width="1.6"/>
    <line x1="20" y1="230" x2="220" y2="230" stroke="#1A1A1A" stroke-width="1.6"/>
    <text class="leg" x="38" y="20">errore top-5</text>
    <circle cx="75" cy="52" r="7" fill="#8B847C"/>
    <circle cx="190" cy="122" r="7" fill="#B5532C"/>
    <line x1="80" y1="56" x2="184" y2="118" stroke="#B5532C" stroke-width="2.4"/>
    <text class="num" x="75" y="38" text-anchor="middle">26,2%</text>
    <text class="num" x="190" y="108" text-anchor="middle">15,3%</text>
    <text class="leg" x="75" y="250" text-anchor="middle">metodi a mano</text>
    <text class="lbl" x="190" y="250" text-anchor="middle">AlexNet</text>
  </g>
</svg>
