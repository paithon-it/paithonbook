  <!-- ===================== processo in avanti ===================== -->
  <text x="60" y="30" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#2D5A5C">Processo in avanti &#8212; fisso: a ogni passo si aggiunge un velo di rumore</text>
  <text x="760" y="30" text-anchor="end" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">t cresce &#8594;</text>

  <!-- riquadri -->
  <rect x="60" y="48" width="110" height="110" rx="8" fill="#2D5A5C" fill-opacity="0.10" stroke="#2D5A5C" stroke-width="2"/>
  <g transform="translate(60,48)"><use href="#paesaggio" xlink:href="#paesaggio"/></g>

  <rect x="250" y="48" width="110" height="110" rx="8" fill="#2D5A5C" fill-opacity="0.10" stroke="#2D5A5C" stroke-width="2"/>
  <g transform="translate(250,48)" opacity="0.75"><use href="#paesaggio" xlink:href="#paesaggio"/></g>
  <use href="#rumore-lieve" xlink:href="#rumore-lieve" x="250" y="48"/>

  <rect x="440" y="48" width="110" height="110" rx="8" fill="#2D5A5C" fill-opacity="0.10" stroke="#2D5A5C" stroke-width="2"/>
  <g transform="translate(440,48)" opacity="0.40"><use href="#paesaggio" xlink:href="#paesaggio"/></g>
  <use href="#rumore-medio" xlink:href="#rumore-medio" x="440" y="48"/>

  <rect x="630" y="48" width="110" height="110" rx="8" fill="#2D5A5C" fill-opacity="0.10" stroke="#2D5A5C" stroke-width="2.5"/>
  <use href="#rumore-pieno" xlink:href="#rumore-pieno" x="630" y="48"/>

  <!-- frecce in avanti -->
  <line x1="176" y1="103" x2="244" y2="103" stroke="#2D5A5C" stroke-width="2.5" marker-end="url(#freccia-avanti)"/>
  <text x="210" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">+ rumore</text>
  <line x1="366" y1="103" x2="434" y2="103" stroke="#2D5A5C" stroke-width="2.5" marker-end="url(#freccia-avanti)"/>
  <text x="400" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5E5852">&#8230;</text>
  <line x1="556" y1="103" x2="624" y2="103" stroke="#2D5A5C" stroke-width="2.5" marker-end="url(#freccia-avanti)"/>
  <text x="590" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5E5852">&#8230;</text>

  <!-- etichette -->
  <text x="115" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8320;</text>
  <text x="305" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8321;</text>
  <text x="495" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8348;</text>
  <text x="685" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x<tspan dy="4" font-size="10">T</tspan></text>

  <!-- ===================== processo inverso ===================== -->
  <text x="60" y="240" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#B5532C">Processo inverso &#8212; appreso: la rete toglie un velo di rumore alla volta</text>
  <text x="760" y="240" text-anchor="end" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">&#8592; t decresce</text>

  <!-- riquadri (da leggere da destra a sinistra) -->
  <rect x="60" y="258" width="110" height="110" rx="8" fill="#B5532C" fill-opacity="0.10" stroke="#B5532C" stroke-width="2.5"/>
  <g transform="translate(60,258)"><use href="#paesaggio" xlink:href="#paesaggio"/></g>

  <rect x="250" y="258" width="110" height="110" rx="8" fill="#B5532C" fill-opacity="0.10" stroke="#B5532C" stroke-width="2"/>
  <g transform="translate(250,258)" opacity="0.75"><use href="#paesaggio" xlink:href="#paesaggio"/></g>
  <use href="#rumore-lieve" xlink:href="#rumore-lieve" x="250" y="258"/>

  <rect x="440" y="258" width="110" height="110" rx="8" fill="#B5532C" fill-opacity="0.10" stroke="#B5532C" stroke-width="2"/>
  <g transform="translate(440,258)" opacity="0.40"><use href="#paesaggio" xlink:href="#paesaggio"/></g>
  <use href="#rumore-medio" xlink:href="#rumore-medio" x="440" y="258"/>

  <rect x="630" y="258" width="110" height="110" rx="8" fill="#B5532C" fill-opacity="0.10" stroke="#B5532C" stroke-width="2"/>
  <use href="#rumore-pieno" xlink:href="#rumore-pieno" x="630" y="258"/>

  <!-- frecce all'indietro, con la rete su ogni passo -->
  <line x1="624" y1="313" x2="556" y2="313" stroke="#B5532C" stroke-width="2.5" marker-end="url(#freccia-indietro)"/>
  <line x1="434" y1="313" x2="366" y2="313" stroke="#B5532C" stroke-width="2.5" marker-end="url(#freccia-indietro)"/>
  <line x1="244" y1="313" x2="176" y2="313" stroke="#B5532C" stroke-width="2.5" marker-end="url(#freccia-indietro)"/>

  <rect x="572" y="300" width="36" height="26" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="590" y="318" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1A1A1A">&#949;<tspan dy="3" font-size="9">&#952;</tspan></text>
  <rect x="382" y="300" width="36" height="26" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="400" y="318" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1A1A1A">&#949;<tspan dy="3" font-size="9">&#952;</tspan></text>
  <rect x="192" y="300" width="36" height="26" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="210" y="318" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1A1A1A">&#949;<tspan dy="3" font-size="9">&#952;</tspan></text>

  <!-- etichette -->
  <text x="115" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8320;</text>
  <text x="305" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8321;</text>
  <text x="495" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8348;</text>
