  <!-- didascalia interna -->
  <text x="410" y="412" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">l'andata distrugge con una regola fissa; il ritorno ricostruisce con la rete: partendo da neve nuova, l'immagine che emerge &#232; nuova</text>
</svg>
