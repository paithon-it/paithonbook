<svg viewBox="0 0 720 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A sinistra DBSCAN: due cluster a forma irregolare con punti core, border e rumore. A destra un dendrogramma con linea di taglio.">
  <rect x="0" y="0" width="720" height="340" fill="#F8F5EE"/>
  <!-- Pannello sinistro: DBSCAN -->
  <text x="180" y="30" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">DBSCAN: cluster = zone dense</text>
  <rect x="20" y="45" width="320" height="230" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- cluster terracotta a forma allungata (arco) -->
  <circle cx="60" cy="120" r="6" fill="#B5532C"/><circle cx="80" cy="100" r="6" fill="#B5532C"/><circle cx="105" cy="88" r="6" fill="#B5532C"/><circle cx="132" cy="82" r="6" fill="#B5532C"/><circle cx="160" cy="85" r="6" fill="#B5532C"/><circle cx="185" cy="95" r="6" fill="#B5532C"/>
  <circle cx="72" cy="112" r="4" fill="none" stroke="#B5532C" stroke-width="1.5"/><circle cx="145" cy="95" r="4" fill="none" stroke="#B5532C" stroke-width="1.5"/><circle cx="200" cy="110" r="4" fill="none" stroke="#B5532C" stroke-width="1.5"/>
  <!-- cluster teal compatto -->
  <circle cx="230" cy="210" r="6" fill="#2D5A5C"/><circle cx="252" cy="198" r="6" fill="#2D5A5C"/><circle cx="270" cy="215" r="6" fill="#2D5A5C"/><circle cx="248" cy="228" r="6" fill="#2D5A5C"/><circle cx="272" cy="238" r="6" fill="#2D5A5C"/>
  <circle cx="292" cy="222" r="4" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
  <!-- raggio eps attorno a un core -->
  <circle cx="132" cy="82" r="30" fill="none" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="132" y="62" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">eps</text>
  <!-- rumore -->
  <path d="M 300 75 l 8 8 m 0 -8 l -8 8" stroke="#1A1A1A" stroke-width="1.5" fill="none"/>
  <path d="M 55 235 l 8 8 m 0 -8 l -8 8" stroke="#1A1A1A" stroke-width="1.5" fill="none"/>
  <!-- legenda -->
  <circle cx="35" cy="295" r="6" fill="#B5532C"/>
  <text x="47" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">core</text>
  <circle cx="95" cy="295" r="4" fill="none" stroke="#B5532C" stroke-width="1.5"/>
  <text x="107" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">border</text>
  <path d="M 165 291 l 8 8 m 0 -8 l -8 8" stroke="#1A1A1A" stroke-width="1.5" fill="none"/>
  <text x="182" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">rumore</text>
  <!-- Pannello destro: dendrogramma -->
  <text x="540" y="30" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">Dendrogramma: la storia delle fusioni</text>
  <rect x="380" y="45" width="320" height="230" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- foglie: A B C D E F -->
  <text x="420" y="265" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">A</text>
  <text x="465" y="265" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">B</text>
  <text x="510" y="265" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">C</text>
  <text x="570" y="265" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">D</text>
  <text x="615" y="265" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">E</text>
  <text x="660" y="265" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">F</text>
  <!-- fusioni gruppo sinistro (terracotta) -->
  <path d="M 420 250 V 210 H 465 V 250" fill="none" stroke="#B5532C" stroke-width="2"/>
  <path d="M 442 210 V 170 H 510 V 250" fill="none" stroke="#B5532C" stroke-width="2"/>
  <!-- fusioni gruppo destro (teal) -->
  <path d="M 570 250 V 200 H 615 V 250" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <path d="M 592 200 V 160 H 660 V 250" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <!-- fusione finale (warm black) -->
  <path d="M 476 170 V 90 H 626 V 160" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- linea di taglio -->
  <line x1="392" y1="125" x2="688" y2="125" stroke="#C9A961" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="396" y="115" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">taglio → 2 cluster</text>
  <text x="540" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">in basso: punti singoli · in alto: fusioni sempre più grandi</text>
</svg>
