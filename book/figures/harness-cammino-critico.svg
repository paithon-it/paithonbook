<!--
  Paithon Book, figura animata: lo stesso lavoro in serie, in parallelo e con le azioni speculative
  Generata da animazioni/svg/harness-cammino-critico.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448"
     role="img" aria-label="Tre corsie orizzontali sulla stessa scala dei tempi, da 0 a 25 secondi, attraversate da un cursore verticale che avanza a velocità costante. Nella prima, in serie, si alternano quattro blocchi di pensiero del modello da 4 secondi e tre letture da 3: il lavoro finisce a 25. Nella seconda, in parallelo, un pensiero, poi le tre letture impilate l'una sull'altra nello stesso intervallo, poi l'ultimo pensiero: finisce a 11. Nella terza, speculativa, all'inizio di ciascuno dei primi tre pensieri parte una previsione da 1 secondo e subito dopo la lettura prevista; la prima e la terza previsione sono giuste e la loro lettura finisce insieme al pensiero, la seconda è sbagliata, la sua lettura viene scartata e quella vera parte dopo il pensiero; il quarto pensiero, che scrive la risposta, non ha previsione: finisce a 19.">
  <style>
    svg  { --d: 15.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .rit  { transform-box:view-box; transform-origin:128px 0px; }
    .nome { font-weight:700; }
    .grig { stroke:#E2DCC9; stroke-width:1; stroke-dasharray:2 4; }
    .b-pensa { fill:#2D5A5C; }
    .b-legge { fill:#C9A961; fill-opacity:0.45; stroke:#C9A961; stroke-width:1.6; }
    .b-prevede { fill:#B5532C; }
    .b-scartata { fill:none; stroke:#B5532C; stroke-width:1.6;
                  stroke-dasharray:4 3; }
    .t-legge { font-family:Inter, system-ui, sans-serif; font-size:13px; font-weight:700; fill:#1A1A1A; }
    .t-risposta { font-family:Inter, system-ui, sans-serif; font-size:12px; fill:#F8F5EE; }
    .t-scartata { font-family:Inter, system-ui, sans-serif; font-size:12px; fill:#B5532C; }
    .t-tot { font-family:Inter, system-ui, sans-serif; font-size:13.5px; font-weight:700; fill:#1A1A1A; }
    .fine { stroke:#1A1A1A; stroke-width:1.6; stroke-dasharray:5 3; }
    .cur  { stroke:#1A1A1A; stroke-width:2; }
    .punta { fill:#1A1A1A; }
    #cursore { animation:scorre var(--d) linear infinite; transform-box:view-box; }
        @keyframes scopri{0.00%{transform:scaleX(0)}80.00%{transform:scaleX(1)}100.00%{transform:scaleX(1)}}
    @keyframes scorre{0.00%{transform:translateX(-642px)}80.00%{transform:translateX(0px)}100.00%{transform:translateX(0px)}}
    @keyframes prima{0.00%{opacity:1}25.60%{opacity:1}26.20%{opacity:0}100.00%{opacity:0}}
    @keyframes dopo{0.00%{opacity:0}25.60%{opacity:0}26.20%{opacity:1}100.00%{opacity:1}}
    @keyframes tot0{0.00%{opacity:0}80.00%{opacity:0}81.20%{opacity:1}100.00%{opacity:1}}
    @keyframes tot1{0.00%{opacity:0}35.20%{opacity:0}36.40%{opacity:1}100.00%{opacity:1}}
    @keyframes tot2{0.00%{opacity:0}60.80%{opacity:0}62.00%{opacity:1}100.00%{opacity:1}}
    @media (prefers-reduced-motion:reduce) { #cursore, .rit, .tot, .cambio { animation:none !important; } }
  </style>
