130.0" y1="328" x2="130.0" y2="404"/><line class="grig" x1="258.4" y1="328" x2="258.4" y2="404"/><line class="grig" x1="386.8" y1="328" x2="386.8" y2="404"/><line class="grig" x1="515.2" y1="328" x2="515.2" y2="404"/><line class="grig" x1="643.6" y1="328" x2="643.6" y2="404"/><line class="grig" x1="772.0" y1="328" x2="772.0" y2="404"/><clipPath id="cscopri"><rect class="rit" x="128" y="70" width="646" height="340" style="animation:scopri var(--d) linear infinite"/></clipPath><g clip-path="url(#cscopri)"><rect class="b-pensa" x="131.0" y="100" width="100.7" height="20" rx="3"/><rect class="b-legge" x="233.7" y="124" width="75.0" height="20" rx="3"/><text class="t-legge" x="271.2" y="138.5" text-anchor="middle">A</text><rect class="b-pensa" x="310.8" y="100" width="100.7" height="20" rx="3"/><rect class="b-legge" x="413.5" y="124" width="75.0" height="20" rx="3"/><text class="t-legge" x="451.0" y="138.5" text-anchor="middle">B</text><rect class="b-pensa" x="490.5" y="100" width="100.7" height="20" rx="3"/><rect class="b-legge" x="593.2" y="124" width="75.0" height="20" rx="3"/><text class="t-legge" x="630.8" y="138.5" text-anchor="middle">C</text><rect class="b-pensa" x="670.3" y="100" width="100.7" height="20" rx="3"/><text class="t-risposta" x="720.6" y="114.5" text-anchor="middle">risposta</text><line class="fine" x1="772.0" y1="74" x2="772.0" y2="149"/><rect class="b-pensa" x="131.0" y="192" width="100.7" height="20" rx="3"/><rect class="b-legge" x="233.7" y="216" width="75.0" height="20" rx="3"/><text class="t-legge" x="271.2" y="230.5" text-anchor="middle">A</text><rect class="b-legge" x="233.7" y="240" width="75.0" height="20" rx="3"/><text class="t-legge" x="271.2" y="254.5" text-anchor="middle">B</text><rect class="b-legge" x="233.7" y="264" width="75.0" height="20" rx="3"/><text class="t-legge" x="271.2" y="278.5" text-anchor="middle">C</text><rect class="b-pensa" x="310.8" y="192" width="100.7" height="20" rx="3"/><text class="t-risposta" x="361.1" y="206.5