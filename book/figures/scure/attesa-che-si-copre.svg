<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420"
     role="img" aria-label="Due pannelli sovrapposti, ciascuno una linea del tempo di dodici istanti disegnati come caselle. Nel pannello di sopra, intestato «una sola unità di calcolo», una riga mostra l'unità che conta in un istante su quattro (casella piena) e aspetta un dato negli altri tre (casella tratteggiata); la riga sotto, «la macchina conta», ha lo stesso disegno, e una nota dice che la macchina resta ferma nove istanti su dodici. Nel pannello di sotto, intestato «quattro unità che si danno il cambio», quattro righe mostrano quattro unità sfalsate di un istante l'una dall'altra: ognuna conta in un istante su quattro e aspetta negli altri tre, esattamente come l'unità sola di sopra, ma in ogni istante è il turno di una di loro. La riga «la macchina conta» è quindi piena da un capo all'altro, e la nota dice che resta ferma zero istanti su dodici. In basso la legenda: casella piena vuol dire che conta, casella tratteggiata che aspetta un dato.">
