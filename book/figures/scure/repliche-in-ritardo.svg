<!--
  Paithon Book, figura animata: le repliche inseguono il traffico e al salto arrivano tardi
  Generata da animazioni/svg/repliche-in-ritardo.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360"
     role="img" aria-label="Due grafici affiancati. A sinistra, fermo, una giornata intera: la curva nera del traffico sale nel pomeriggio fino a sessanta richieste al secondo e ridiscende, e una scala teal, la capacità delle repliche accese, la segue da sopra con un margine; un rettangolo stretto segna l'ora attorno alle nove di sera. A destra quell'ora ingrandita si scopre da sinistra a destra: alle 21:00 il traffico salta di colpo a oltre quaranta richieste al secondo, la scala teal di chi insegue il traffico sale solo alle 21:08 e lascia sotto di sé una fascia terracotta, otto minuti scoperti in cui la capacità non basta, mentre una scala ocra tratteggiata, col calendario, sale nello stesso minuto del traffico, perché le sue repliche erano state chiamate otto minuti prima, e copre il salto.">
