<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../gdpr-e-llm.svg
-->
<svg viewBox="0 0 760 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flusso dei dati personali in un sistema LLM e basi giuridiche a ogni passaggio">
  <rect x="0" y="0" width="760" height="430" fill="#0E0C0A"/>
  <text x="380" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#F4ECDD">Dove passano i dati, quale base giuridica serve</text>
  <!-- flow boxes -->
  <rect x="30" y="70" width="160" height="70" rx="8" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="110" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F4ECDD">Raccolta</text>
  <text x="110" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">web, clienti, documenti</text>
  <line x1="190" y1="105" x2="240" y2="105" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="240,100 250,105 240,110" fill="#F4ECDD"/>
  <rect x="250" y="70" width="160" height="70" rx="8" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="330" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0E0C0A">Training / fine-tuning</text>
  <text x="330" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A">dati → pesi del modello</text>
  <line x1="410" y1="105" x2="460" y2="105" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="460,100 470,105 460,110" fill="#F4ECDD"/>
  <rect x="470" y="70" width="160" height="70" rx="8" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="550" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0E0C0A">Inferenza</text>
  <text x="550" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A">prompt con dati personali</text>
  <line x1="630" y1="105" x2="680" y2="105" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="680,100 690,105 680,110" fill="#F4ECDD"/>
  <rect x="690" y="70" width="50" height="70" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="715" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E27B52">Out-</text>
  <text x="715" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E27B52">put</text>
  <!-- basi giuridiche labels -->
  <line x1="330" y1="140" x2="330" y2="180" stroke="#DDB874" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="220" y="180" width="220" height="56" rx="8" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="330" y="203" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F4ECDD">Base: legittimo interesse</text>
  <text x="330" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#F4ECDD">test in 3 passi, da documentare</text>
  <line x1="550" y1="140" x2="550" y2="180" stroke="#DDB874" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="460" y="180" width="220" height="56" rx="8" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="570" y="203" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F4ECDD">Base: contratto / consenso</text>
  <text x="570" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#F4ECDD">il trattamento serve al servizio richiesto</text>
  <!-- diritti row -->
  <rect x="30" y="270" width="710" height="2" fill="#221F1A"/>
  <text x="380" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#E27B52">A ogni passaggio, i diritti degli interessati restano attaccati ai dati</text>
  <rect x="60" y="320" width="150" height="46" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="1.5"/>
  <text x="135" y="348" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">accesso (art. 15)</text>
  <rect x="230" y="320" width="150" height="46" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="1.5"/>
  <text x="305" y="348" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">rettifica (art. 16)</text>
  <rect x="400" y="320" width="150" height="46" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="1.5"/>
  <text x="475" y="348" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">cancellazione (art. 17)</text>
  <rect x="570" y="320" width="150" height="46" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="1.5"/>
  <text x="645" y="348" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">opposizione (art. 21)</text>
  <text x="380" y="404" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">Il punto critico: dentro i pesi del modello i diritti sono difficili da esercitare; vanno garantiti prima e dopo</text>
</svg>
