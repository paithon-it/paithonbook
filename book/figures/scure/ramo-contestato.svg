<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     role="img" aria-label="Un albero di affermazioni che si apre un ramo per volta. In cima un nodo con un punto interrogativo, la domanda e la risposta che il primo contendente sostiene. Sotto compaiono tre nodi, la sua scomposizione in tre parti; il secondo contendente ne cerchia uno, quello centrale, e gli altri due restano grigi e non vengono più aperti. Sotto il nodo cerchiato compaiono altri tre nodi, e il secondo ne cerchia uno diverso, il terzo da sinistra; gli altri due restano grigi. Da quel nodo scende un tratto fino alla scritta «il giudice controlla questa, e basta». In basso i due conti: catene di ragionamento possibili nove, affermazioni messe per iscritto sei, controllate dal giudice una.">
