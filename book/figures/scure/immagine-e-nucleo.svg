<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../immagine-e-nucleo.svg
-->
<svg viewBox="0 0 720 430" width="100%" role="img" aria-label="Una lampada a sinistra proietta un oggetto tridimensionale su un muro a destra. Due punti diversi, allineati sullo stesso raggio di luce, cadono nello stesso punto del muro: quella direzione e' il nucleo. Sul muro una regione ovale e' raggiungibile e si chiama immagine, mentre il resto del muro resta fuori portata." xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="430" fill="#0E0C0A"/>
  <defs>
    <marker id="inFrec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E27B52"/></marker>
    <marker id="inFrecK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BCB3A1"/></marker>
  </defs>

  <!-- ===== il muro, spazio di arrivo ===== -->
  <rect x="556" y="52" width="128" height="330" fill="#16130F" stroke="#34302A" stroke-width="1.5" rx="4"/>
  <text x="620" y="42" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1" text-anchor="middle">il muro</text>
  <!-- la regione raggiungibile -->
  <ellipse cx="620" cy="200" rx="55" ry="95" fill="#5BA39C" fill-opacity="0.16" stroke="#5BA39C" stroke-width="2"/>
  <text x="620" y="196" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#5BA39C" text-anchor="middle">immagine</text>
  <text x="620" y="212" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C" text-anchor="middle">le ombre che</text>
  <text x="620" y="226" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C" text-anchor="middle">si possono fare</text>
  <!-- una sagoma fuori portata -->
  <g stroke="#E27B52" stroke-width="2.2" stroke-linecap="round">
    <line x1="646" y1="330" x2="662" y2="346"/>
    <line x1="662" y1="330" x2="646" y2="346"/>
  </g>
  <text x="654" y="368" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52" text-anchor="middle">fuori portata</text>

  <!-- ===== la lampada ===== -->
  <circle cx="70" cy="215" r="7" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <g stroke="#DDB874" stroke-width="1.6" stroke-linecap="round">
    <line x1="70" y1="199" x2="70" y2="191"/>
    <line x1="82" y1="203" x2="88" y2="197"/>
    <line x1="86" y1="215" x2="94" y2="215"/>
    <line x1="82" y1="227" x2="88" y2="233"/>
    <line x1="70" y1="231" x2="70" y2="239"/>
  </g>
  <text x="70" y="264" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1" text-anchor="middle">lampada</text>

  <!-- ===== raggi che delimitano il cono di luce ===== -->
  <g stroke="#DDB874" stroke-width="1.1" stroke-dasharray="3 5" opacity="0.85">
    <line x1="70" y1="215" x2="556" y2="73"/>
    <line x1="70" y1="215" x2="556" y2="326"/>
  </g>

  <!-- ===== spazio di partenza: un cubo di filo ===== -->
  <g stroke="#8E8676" stroke-width="1.4" fill="none">
    <rect x="185" y="140" width="100" height="100"/>
    <rect x="223" y="106" width="100" height="100"/>
    <line x1="185" y1="140" x2="223" y2="106"/>
    <line x1="285" y1="140" x2="323" y2="106"/>
    <line x1="185" y1="240" x2="223" y2="206"/>
    <line x1="285" y1="240" x2="323" y2="206"/>
  </g>
  <text x="254" y="88" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1" text-anchor="middle">spazio di partenza: tre direzioni</text>

  <!-- ===== il raggio che porta il nucleo ===== -->
  <line x1="70" y1="215" x2="600" y2="132" stroke="#F4ECDD" stroke-width="1.3" stroke-dasharray="6 5"/>

  <!-- i due punti che danno la stessa ombra -->
  <circle cx="210" cy="193" r="6" fill="#E27B52"/>
  <circle cx="300" cy="179" r="6" fill="#E27B52"/>
  <line x1="219" y1="192" x2="291" y2="181" stroke="#E27B52" stroke-width="2.4" marker-end="url(#inFrec)" marker-start="url(#inFrec)"/>
  <text x="255" y="150" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E27B52" text-anchor="middle">nucleo</text>
  <text x="254" y="288" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#E27B52" text-anchor="middle">spostarsi lungo il raggio</text>
  <text x="254" y="304" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#E27B52" text-anchor="middle">non muove l’ombra</text>

  <!-- l'ombra unica sul muro -->
  <circle cx="600" cy="132" r="6" fill="#E27B52"/>
  <text x="548" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52" text-anchor="end">una sola ombra</text>
  <line x1="552" y1="122" x2="590" y2="130" stroke="#E27B52" stroke-width="1" marker-end="url(#inFrec)"/>

  <!-- ===== il conto in basso ===== -->
  <rect x="40" y="392" width="640" height="30" fill="none" stroke="#34302A" stroke-width="1.2" rx="6"/>
  <text x="360" y="412" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">3 direzioni di partenza  =  2 che arrivano sul muro  +  1 che si perde nel nucleo</text>
</svg>
