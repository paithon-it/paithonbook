<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../regolarizzazione-l1-l2.svg
-->
<svg viewBox="0 0 720 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto geometrico tra vincolo L1 (rombo) e L2 (cerchio) con curve di livello dell'errore">
  <rect width="720" height="340" fill="#0E0C0A"/>
  <!-- Pannello L1 -->
  <g transform="translate(180,180)">
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#F4ECDD" stroke-width="1.5"/>
    <line x1="0" y1="-140" x2="0" y2="120" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="146" y="4" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">w₁</text>
    <text x="6" y="-126" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">w₂</text>
    <!-- rombo -->
    <path d="M 0 -70 L 70 0 L 0 70 L -70 0 Z" fill="none" stroke="#E27B52" stroke-width="2"/>
    <!-- curve di livello -->
    <ellipse cx="85" cy="-75" rx="26" ry="15" fill="none" stroke="#5BA39C" stroke-width="1.5" transform="rotate(-25 85 -75)"/>
    <ellipse cx="85" cy="-75" rx="52" ry="30" fill="none" stroke="#5BA39C" stroke-width="1.5" transform="rotate(-25 85 -75)"/>
    <ellipse cx="85" cy="-75" rx="80" ry="47" fill="none" stroke="#5BA39C" stroke-width="1.5" transform="rotate(-25 85 -75)"/>
    <!-- punto di contatto sul vertice -->
    <circle cx="0" cy="-70" r="6" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="-116" y="-88" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">w₁ = 0 esatto</text>
    <text x="0" y="108" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#E27B52" text-anchor="middle">L1: rombo</text>
  </g>
  <!-- Pannello L2 -->
  <g transform="translate(540,180)">
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#F4ECDD" stroke-width="1.5"/>
    <line x1="0" y1="-140" x2="0" y2="120" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="146" y="4" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">w₁</text>
    <text x="6" y="-126" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">w₂</text>
    <!-- cerchio -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#E27B52" stroke-width="2"/>
    <!-- curve di livello -->
    <ellipse cx="85" cy="-75" rx="26" ry="15" fill="none" stroke="#5BA39C" stroke-width="1.5" transform="rotate(-25 85 -75)"/>
    <ellipse cx="85" cy="-75" rx="52" ry="30" fill="none" stroke="#5BA39C" stroke-width="1.5" transform="rotate(-25 85 -75)"/>
    <ellipse cx="85" cy="-75" rx="80" ry="47" fill="none" stroke="#5BA39C" stroke-width="1.5" transform="rotate(-25 85 -75)"/>
    <!-- punto di contatto fuori dagli assi -->
    <circle cx="46" cy="-53" r="6" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="-134" y="-88" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">entrambi piccoli, non zero</text>
    <text x="0" y="108" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#E27B52" text-anchor="middle">L2: cerchio</text>
  </g>
  <text x="360" y="28" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="middle">Le curve di livello dell'errore (teal) toccano il vincolo (terracotta) nel punto ottimo (ocra)</text>
</svg>
