<!--
  Paithon Book, figura: tre punti frantumati da una retta, quattro no.
  In alto le otto colorazioni di tre punti non allineati, ciascuna con una
  retta che separa i due colori. In basso i due casi di quattro punti in cui
  una colorazione non si separa: le diagonali di un quadrilatero e un punto
  dentro il triangolo degli altri tre.
  Palette-locked, fondo trasparente (light e dark).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"
     aria-label="In alto otto riquadri, uno per ciascuna colorazione di tre punti disposti a triangolo: in ognuno una retta tratteggiata separa i due colori, o lascia tutti i punti dalla stessa parte quando il colore è uno solo. In basso due riquadri con quattro punti ciascuno, in cui nessuna retta separa i colori: nel primo i quattro punti stanno ai vertici di un quadrilatero e hanno lo stesso colore a due a due sulle diagonali; nel secondo un punto sta dentro il triangolo formato dagli altri tre e ha un colore diverso dal loro.">
