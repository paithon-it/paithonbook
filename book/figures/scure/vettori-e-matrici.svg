<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../vettori-e-matrici.svg
-->
<svg viewBox="0 0 720 420" width="100%" role="img" aria-label="Piano cartesiano con due vettori come frecce dall'origine, la loro somma e il parallelogramma tratteggiato; a destra la stessa informazione come liste di numeri" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="420" fill="#0E0C0A"/>
  <defs>
    <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E27B52"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5BA39C"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DDB874"/></marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F4ECDD"/></marker>
  </defs>
  <!-- griglia leggera -->
  <g stroke="#34302A" stroke-width="0.7">
    <line x1="135" y1="40" x2="135" y2="360"/><line x1="190" y1="40" x2="190" y2="360"/><line x1="245" y1="40" x2="245" y2="360"/><line x1="300" y1="40" x2="300" y2="360"/><line x1="355" y1="40" x2="355" y2="360"/><line x1="410" y1="40" x2="410" y2="360"/>
    <line x1="80" y1="285" x2="440" y2="285"/><line x1="80" y1="230" x2="440" y2="230"/><line x1="80" y1="175" x2="440" y2="175"/><line x1="80" y1="120" x2="440" y2="120"/><line x1="80" y1="65" x2="440" y2="65"/>
  </g>
  <!-- assi -->
  <line x1="80" y1="340" x2="450" y2="340" stroke="#F4ECDD" stroke-width="2" marker-end="url(#arrK)"/>
  <line x1="80" y1="340" x2="80" y2="45" stroke="#F4ECDD" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="455" y="345" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">x</text>
  <text x="72" y="38" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">y</text>
  <text x="66" y="356" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">0</text>
  <!-- parallelogramma tratteggiato -->
  <line x1="245" y1="230" x2="300" y2="65" stroke="#8E8676" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="135" y1="175" x2="300" y2="65" stroke="#8E8676" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- vettori -->
  <line x1="80" y1="340" x2="245" y2="230" stroke="#E27B52" stroke-width="2" marker-end="url(#arrT)"/>
  <line x1="80" y1="340" x2="135" y2="175" stroke="#5BA39C" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="80" y1="340" x2="300" y2="65" stroke="#DDB874" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="200" y="290" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#E27B52">v</text>
  <text x="92" y="235" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#5BA39C">w</text>
  <text x="250" y="130" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#DDB874">v + w</text>
  <!-- pannello liste -->
  <rect x="490" y="70" width="200" height="280" fill="#0E0C0A" stroke="#34302A" stroke-width="1.5" rx="8"/>
  <text x="590" y="102" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#BCB3A1" text-anchor="middle">stessa cosa, come liste</text>
  <text x="510" y="150" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#E27B52">v = [3, 2]</text>
  <text x="510" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#5BA39C">w = [1, 3]</text>
  <line x1="510" y1="228" x2="670" y2="228" stroke="#34302A" stroke-width="1.5"/>
  <text x="510" y="266" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#DDB874">v + w = [4, 5]</text>
  <text x="510" y="310" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">somma elemento</text>
  <text x="510" y="328" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">per elemento</text>
</svg>
