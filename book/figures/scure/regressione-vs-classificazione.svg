<?xml version="1.0" encoding="UTF-8"?>
<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../regressione-vs-classificazione.svg
-->
<!--
  paithon book - figura: apprendimento supervisionato, due pannelli.
  Sinistra: scatter con retta di regressione (best fit) che segue i punti.
  Destra: due nuvole di punti (classi terracotta e teal) separate da un
  confine di decisione tratteggiato (ocra).
  Palette-locked: terracotta #E27B52, teal #5BA39C, ocra #DDB874,
  warm-black #F4ECDD, neutri warm. Fondo trasparente (light e dark).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img"
     aria-label="Due pannelli affiancati. A sinistra uno scatter di punti attraversato da una retta di regressione crescente. A destra due nuvole di punti di colore diverso separate da una retta tratteggiata, il confine di decisione.">
  <style>
    .axis  { stroke:#8E8676; stroke-width:1.4; }
    .reg   { stroke:#F4ECDD; stroke-width:2.6; stroke-linecap:round; }
    .bound { stroke:#DDB874; stroke-width:2.6; stroke-dasharray:7 5; stroke-linecap:round; }
    .ptA   { fill:#E27B52; stroke:#0E0C0A; stroke-width:1; }
    .ptB   { fill:#5BA39C; stroke:#0E0C0A; stroke-width:1; }
    .title { font-family:Fraunces, Georgia, serif; font-size:16px; font-weight:600; fill:#F4ECDD; text-anchor:middle; }
    .lbl   { font-family:Inter, system-ui, sans-serif; font-size:12px; fill:#BCB3A1; }
  </style>

  <!-- ===================== PANNELLO SINISTRO: REGRESSIONE ===================== -->
  <text class="title" x="165" y="28">Regressione</text>

  <!-- assi -->
  <line class="axis" x1="40" y1="250" x2="295" y2="250"/>
  <line class="axis" x1="40" y1="250" x2="40"  y2="45"/>
  <polygon points="295,250 285,245 285,255" fill="#8E8676"/>
  <polygon points="40,45 35,55 45,55" fill="#8E8676"/>
  <text class="lbl" x="282" y="268">X</text>
  <text class="lbl" x="22"  y="52">y</text>

  <!-- retta di best fit -->
  <line class="reg" x1="60" y1="220" x2="275" y2="75"/>

  <!-- punti dello scatter -->
  <circle class="ptA" cx="70"  cy="210" r="4.5"/>
  <circle class="ptA" cx="90"  cy="205" r="4.5"/>
  <circle class="ptA" cx="110" cy="178" r="4.5"/>
  <circle class="ptA" cx="130" cy="185" r="4.5"/>
  <circle class="ptA" cx="150" cy="155" r="4.5"/>
  <circle class="ptA" cx="170" cy="165" r="4.5"/>
  <circle class="ptA" cx="190" cy="128" r="4.5"/>
  <circle class="ptA" cx="210" cy="122" r="4.5"/>
  <circle class="ptA" cx="230" cy="100" r="4.5"/>
  <circle class="ptA" cx="250" cy="105" r="4.5"/>
  <circle class="ptA" cx="270" cy="78"  r="4.5"/>

  <!-- ===================== PANNELLO DESTRO: CLASSIFICAZIONE ===================== -->
  <text class="title" x="475" y="28">Classificazione</text>

  <!-- assi -->
  <line class="axis" x1="360" y1="250" x2="610" y2="250"/>
  <line class="axis" x1="360" y1="250" x2="360" y2="45"/>
  <polygon points="610,250 600,245 600,255" fill="#8E8676"/>
  <polygon points="360,45 355,55 365,55" fill="#8E8676"/>
  <text class="lbl" x="597" y="268">X&#8321;</text>
  <text class="lbl" x="340" y="52">X&#8322;</text>

  <!-- confine di decisione -->
  <line class="bound" x1="400" y1="60" x2="560" y2="220"/>
  <text class="lbl" x="470" y="58" font-style="italic">confine di decisione</text>

  <!-- classe A (terracotta), regione inferiore-sinistra -->
  <circle class="ptA" cx="400" cy="200" r="4.5"/>
  <circle class="ptA" cx="420" cy="185" r="4.5"/>
  <circle class="ptA" cx="440" cy="210" r="4.5"/>
  <circle class="ptA" cx="410" cy="165" r="4.5"/>
  <circle class="ptA" cx="455" cy="195" r="4.5"/>
  <circle class="ptA" cx="435" cy="155" r="4.5"/>
  <circle class="ptA" cx="470" cy="205" r="4.5"/>
  <circle class="ptA" cx="390" cy="175" r="4.5"/>

  <!-- classe B (teal), regione superiore-destra -->
  <circle class="ptB" cx="520" cy="90"  r="4.5"/>
  <circle class="ptB" cx="540" cy="110" r="4.5"/>
  <circle class="ptB" cx="555" cy="75"  r="4.5"/>
  <circle class="ptB" cx="500" cy="120" r="4.5"/>
  <circle class="ptB" cx="530" cy="130" r="4.5"/>
  <circle class="ptB" cx="560" cy="100" r="4.5"/>
  <circle class="ptB" cx="515" cy="145" r="4.5"/>
  <circle class="ptB" cx="545" cy="85"  r="4.5"/>
</svg>
