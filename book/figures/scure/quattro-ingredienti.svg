hor="middle">la sorgente</text><text class="ets" x="405.0" y="216.0" text-anchor="middle" fill="#5BA39C">che cosa la scalda da dentro,</text><text class="ets" x="405.0" y="234.0" text-anchor="middle" fill="#5BA39C">in ogni punto e in ogni istante</text><text class="eti" x="405.0" y="336.0" text-anchor="middle">la condizione iniziale: com'era calda prima che tutto cominciasse</text><text class="et" x="574.0" y="288.0">il dominio</text><text class="ets" x="574.0" y="306.0">tutto il rettangolo</text>
