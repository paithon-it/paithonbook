<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     role="img" aria-label="Un rettangolo: in orizzontale la posizione lungo la sbarra, in verticale il tempo, che sale. Il rettangolo intero è etichettato «il dominio». Il suo lato di sotto, marcato in ocra, è «la condizione iniziale: com'era calda prima che tutto cominciasse». I due fianchi, marcati in terracotta, sono le «condizioni al contorno», e portano l'uno l'etichetta «la fiamma», l'altro «il ghiaccio». Dentro il rettangolo otto crocette in teal, sparse e mai appoggiate a un bordo, sono «la sorgente: che cosa la scalda da dentro, in ogni punto e in ogni istante». Il lato di sopra è l'unico lasciato con il tratto sottile del bordo, e sopra di lui c'è scritto che lì non si impone niente, perché il tempo finale non è un dato del problema ma il punto in cui il conto arriva.">
  <style>
    svg  { --d: 8.0s; }
    .ax  { stroke:#34302A; stroke-width:2; fill:none; }
    .axc { stroke:#221F1A; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#F4ECDD; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#BCB3A1; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#F4ECDD; }
    .dom  { fill:#5BA39C; fill-opacity:0.06; stroke:none; }
    .nudo { stroke:#34302A; stroke-width:1.4; stroke-dasharray:5 4; }
    .cont { stroke:#E27B52; stroke-width:5; stroke-linecap:round; }
    .iniz { stroke:#DDB874; stroke-width:5; stroke-linecap:round; }
    .src  { stroke:#5BA39C; stroke-width:2; stroke-linecap:round; fill:none; }
    .ass  { stroke:#BCB3A1; stroke-width:1.4; }
    .et   { font-family:Inter, system-ui, sans-serif; font-size:15px; font-weight:700; fill:#F4ECDD; }
    .etc  { font-family:Inter, system-ui, sans-serif; font-size:15px; font-weight:700;
            fill:#E27B52; }
    .eti  { font-family:Inter, system-ui, sans-serif; font-size:14px; font-weight:700;
            fill:#F4ECDD; }
    .etd  { font-family:Inter, system-ui, sans-serif; font-size:15px; font-weight:700; fill:#5BA39C; }
    .ets  { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#BCB3A1; }
    
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
