<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../teorema-bayes-test-medici.svg
-->
<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagramma ad albero: 10.000 persone si dividono in malate e sane, poi in positivi veri, falsi positivi e negativi">
  <rect x="0" y="0" width="760" height="420" fill="#0E0C0A"/>
  <!-- root -->
  <rect x="290" y="24" width="180" height="52" rx="6" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="380" y="46" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD">10.000 persone</text>
  <text x="380" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">popolazione screening</text>
  <!-- branches level 1 -->
  <line x1="340" y1="76" x2="185" y2="150" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="420" y1="76" x2="575" y2="150" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="230" y="112" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">1 su 1.000</text>
  <text x="530" y="112" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">999 su 1.000</text>
  <rect x="95" y="150" width="180" height="52" rx="6" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="185" y="172" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0E0C0A">10 malate</text>
  <text x="185" y="192" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A">prevalenza 0,1%</text>
  <rect x="485" y="150" width="180" height="52" rx="6" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="575" y="172" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0E0C0A">9.990 sane</text>
  <text x="575" y="192" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A">99,9%</text>
  <!-- branches level 2 -->
  <line x1="185" y1="202" x2="120" y2="276" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="185" y1="202" x2="285" y2="276" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="530" y1="202" x2="450" y2="276" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="620" y1="202" x2="655" y2="276" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="120" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">99%</text>
  <text x="262" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">1%</text>
  <text x="465" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">5%</text>
  <text x="662" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">95%</text>
  <rect x="40" y="276" width="160" height="52" rx="6" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="120" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0E0C0A">≈ 10 positivi veri</text>
  <text x="120" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0E0C0A">malati e rilevati</text>
  <rect x="220" y="276" width="130" height="52" rx="6" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="285" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">≈ 0 negativi</text>
  <text x="285" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">falsi negativi</text>
  <rect x="370" y="276" width="160" height="52" rx="6" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="450" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F4ECDD">≈ 500 falsi positivi</text>
  <text x="450" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">sani ma positivi</text>
  <rect x="550" y="276" width="180" height="52" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="640" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5BA39C">≈ 9.490 negativi</text>
  <text x="640" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C">sani e riconosciuti</text>
  <!-- conclusion strip -->
  <rect x="40" y="356" width="690" height="44" rx="6" fill="#F4ECDD"/>
  <text x="385" y="383" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#0E0C0A">Positivi totali ≈ 510 → davvero malati: 10 su 510 ≈ 2%</text>
</svg>
