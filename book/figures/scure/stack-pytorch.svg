<?xml version="1.0" encoding="UTF-8"?>
<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../stack-pytorch.svg
-->
<!--
  paithon book, figura: lo stack di PyTorch come strati sovrapposti.
  Dal basso: l'hardware (CPU/GPU/acceleratori) -> il motore C++ (ATen e
  autograd) -> l'API Python (torch, torch.nn, torch.optim) -> il tuo modello.
  Palette-locked: box color cream, bordi terracotta/ocra/teal/warm-black,
  testo warm-black e grigi warm. Fondo trasparente (leggibile in light e
  dark). Nessun colore fuori palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img"
     aria-label="Diagramma a strati dello stack di PyTorch: alla base l'hardware con CPU, GPU e altri acceleratori; sopra il motore C++ con ATen e autograd; sopra ancora l'API Python con torch, torch.nn e torch.optim; in cima il tuo modello">
  <style>
    .box  { fill:#0E0C0A; }
    .name { font-family:Fraunces, Georgia, serif; font-size:19px; font-weight:600; fill:#F4ECDD; }
    .desc { font-family:Inter, system-ui, sans-serif; font-size:12px; fill:#BCB3A1; }
    .hw   { font-family:Fraunces, Georgia, serif; font-size:17px; font-weight:600; fill:#F4ECDD; }
    .conn { stroke:#8E8676; stroke-width:1.5; stroke-dasharray:3 4; }
    .cap  { font-family:Inter, system-ui, sans-serif; font-size:12px; fill:#8E8676; }
  </style>

  <!-- connettori: ogni strato poggia su quello sotto (freccia verso l'alto) -->
  <line class="conn" x1="260" y1="264" x2="260" y2="246"/>
  <polygon points="260,242 255,252 265,252" fill="#8E8676"/>
  <line class="conn" x1="260" y1="184" x2="260" y2="166"/>
  <polygon points="260,162 255,172 265,172" fill="#8E8676"/>
  <line class="conn" x1="260" y1="104" x2="260" y2="86"/>
  <polygon points="260,82 255,92 265,92" fill="#8E8676"/>

  <!-- in cima: il tuo modello (terracotta) -->
  <rect class="box" x="40" y="24" width="440" height="56" rx="6" stroke="#E27B52" stroke-width="2.5"/>
  <text class="name" x="260" y="50" text-anchor="middle">Il tuo modello</text>
  <text class="desc" x="260" y="69" text-anchor="middle">quello che progetti e addestri, in normale codice Python</text>

  <!-- API Python (ocra) -->
  <rect class="box" x="40" y="104" width="440" height="56" rx="6" stroke="#DDB874" stroke-width="2.5"/>
  <text class="name" x="260" y="130" text-anchor="middle">API Python</text>
  <text class="desc" x="260" y="149" text-anchor="middle">torch &#183; torch.nn &#183; torch.optim &#183; DataLoader</text>

  <!-- motore C++ (teal) -->
  <rect class="box" x="40" y="184" width="440" height="56" rx="6" stroke="#5BA39C" stroke-width="2.5"/>
  <text class="name" x="260" y="210" text-anchor="middle">Il motore C++</text>
  <text class="desc" x="260" y="229" text-anchor="middle">ATen e autograd &#183; kernel ottimizzati, gradienti automatici</text>

  <!-- alla base: l'hardware (warm-black) -->
  <rect class="box" x="40"  y="264" width="136" height="56" rx="6" stroke="#F4ECDD" stroke-width="3"/>
  <text class="hw" x="108" y="298" text-anchor="middle">CPU</text>
  <rect class="box" x="192" y="264" width="136" height="56" rx="6" stroke="#F4ECDD" stroke-width="3"/>
  <text class="hw" x="260" y="298" text-anchor="middle">GPU</text>
  <rect class="box" x="344" y="264" width="136" height="56" rx="6" stroke="#F4ECDD" stroke-width="3"/>
  <text class="hw" x="412" y="291" text-anchor="middle">MPS</text>
  <text class="desc" x="412" y="309" text-anchor="middle">Apple Silicon</text>
  <text class="cap" x="260" y="340" text-anchor="middle">Hardware &#183; dove avvengono davvero le moltiplicazioni di matrici</text>
</svg>
