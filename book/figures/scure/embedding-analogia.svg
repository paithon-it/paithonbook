<?xml version="1.0" encoding="UTF-8"?>
<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../embedding-analogia.svg
-->
<!--
  paithon book, figura: spazio degli embedding bidimensionale. I quattro
  vettori uomo/re/donna/regina formano un parallelogramma che illustra
  l'analogia semantica re - uomo + donna ≈ regina. Palette-locked: offset
  "femminile" in ocra, offset "regalità" in teal, regina evidenziata in
  terracotta, tratti e label warm-black su neutri warm. Fondo trasparente:
  leggibile in light e in dark mode. Nessun colore fuori palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" role="img"
     aria-label="Piano con quattro punti etichettati uomo, re, donna, regina. Le frecce che li collegano formano un parallelogramma: l'offset regalità separa uomo da re e donna da regina, l'offset femminile separa uomo da donna e re da regina.">
  <defs>
    <marker id="ah-ocra" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DDB874"/>
    </marker>
    <marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5BA39C"/>
    </marker>
  </defs>
  <style>
    .axis  { stroke:#8E8676; stroke-width:1.5; }
    .constr{ stroke:#34302A; stroke-width:1.3; stroke-dasharray:3 4; }
    .off-o { stroke:#DDB874; stroke-width:2.6; stroke-linecap:round; }
    .off-t { stroke:#5BA39C; stroke-width:2.6; stroke-linecap:round; }
    .lbl   { font-family:Fraunces, Georgia, serif; font-size:17px; font-weight:600; fill:#F4ECDD; }
    .ann   { font-family:Inter, system-ui, sans-serif; font-size:12.5px; font-style:italic; }
  </style>

  <!-- assi: uno spazio bidimensionale degli embedding -->
  <line class="axis" x1="55" y1="295" x2="450" y2="295"/>
  <line class="axis" x1="55" y1="295" x2="55"  y2="40"/>
  <polygon points="450,295 440,290 440,300" fill="#8E8676"/>
  <polygon points="55,40 50,50 60,50" fill="#8E8676"/>

  <!-- vettori posizione dall'origine (costruzione, tratteggio leggero) -->
  <line class="constr" x1="55" y1="295" x2="140" y2="235"/>
  <line class="constr" x1="55" y1="295" x2="310" y2="210"/>
  <line class="constr" x1="55" y1="295" x2="175" y2="105"/>
  <line class="constr" x1="55" y1="295" x2="345" y2="80"/>

  <!-- offset "regalità" (teal): uomo->re e donna->regina -->
  <line class="off-t" x1="140" y1="235" x2="310" y2="210" marker-end="url(#ah-teal)"/>
  <line class="off-t" x1="175" y1="105" x2="345" y2="80"  marker-end="url(#ah-teal)"/>

  <!-- offset "femminile" (ocra): uomo->donna e re->regina -->
  <line class="off-o" x1="140" y1="235" x2="175" y2="105" marker-end="url(#ah-ocra)"/>
  <line class="off-o" x1="310" y1="210" x2="345" y2="80"  marker-end="url(#ah-ocra)"/>

  <!-- punti -->
  <circle cx="140" cy="235" r="5" fill="#F4ECDD"/>
  <circle cx="310" cy="210" r="5" fill="#F4ECDD"/>
  <circle cx="175" cy="105" r="5" fill="#F4ECDD"/>
  <circle cx="345" cy="80"  r="6" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.4"/>

  <!-- etichette dei punti -->
  <text class="lbl" x="140" y="255" text-anchor="middle">uomo</text>
  <text class="lbl" x="322" y="214">re</text>
  <text class="lbl" x="168" y="98"  text-anchor="end">donna</text>
  <text class="lbl" x="357" y="84"  style="fill:#E27B52">regina</text>

  <!-- annotazioni degli offset -->
  <text class="ann" x="78"  y="163" fill="#DDB874">+ femminile</text>
  <text class="ann" x="225" y="208" text-anchor="middle" fill="#5BA39C">+ regalità</text>

  <!-- origine -->
  <circle cx="55" cy="295" r="3.5" fill="#F4ECDD"/>
</svg>