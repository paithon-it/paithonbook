<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../bag-of-words-tf-idf.svg
-->
<svg viewBox="0 0 720 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: un documento di testo viene trasformato in un vettore di conteggi delle parole">
  <rect x="0" y="0" width="720" height="300" fill="#0E0C0A"/>
  <!-- documento -->
  <rect x="30" y="60" width="200" height="180" rx="6" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="130" y="45" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F4ECDD" text-anchor="middle">Documento</text>
  <line x1="50" y1="90" x2="210" y2="90" stroke="#DDB874" stroke-width="2"/>
  <line x1="50" y1="115" x2="190" y2="115" stroke="#8E8676" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="205" y2="140" stroke="#8E8676" stroke-width="1.5"/>
  <line x1="50" y1="165" x2="180" y2="165" stroke="#E27B52" stroke-width="2"/>
  <line x1="50" y1="190" x2="200" y2="190" stroke="#8E8676" stroke-width="1.5"/>
  <line x1="50" y1="215" x2="150" y2="215" stroke="#5BA39C" stroke-width="2"/>
  <!-- freccia -->
  <line x1="250" y1="150" x2="330" y2="150" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="330,150 318,143 318,157" fill="#F4ECDD"/>
  <text x="290" y="135" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1" text-anchor="middle">conta</text>
  <!-- vettore di conteggi -->
  <text x="520" y="45" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F4ECDD" text-anchor="middle">Vettore di conteggi</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">
    <text x="360" y="87" text-anchor="start">rete</text>
    <rect x="440" y="72" width="120" height="22" fill="#E27B52"/>
    <text x="570" y="87" fill="#BCB3A1">3</text>
    <text x="360" y="122" text-anchor="start">dati</text>
    <rect x="440" y="107" width="160" height="22" fill="#5BA39C"/>
    <text x="610" y="122" fill="#BCB3A1">4</text>
    <text x="360" y="157" text-anchor="start">modello</text>
    <rect x="440" y="142" width="80" height="22" fill="#DDB874"/>
    <text x="530" y="157" fill="#BCB3A1">2</text>
    <text x="360" y="192" text-anchor="start">gatto</text>
    <rect x="440" y="177" width="40" height="22" fill="#E27B52"/>
    <text x="490" y="192" fill="#BCB3A1">1</text>
    <text x="360" y="227" text-anchor="start">spread</text>
    <rect x="440" y="212" width="4" height="22" fill="#8E8676"/>
    <text x="456" y="227" fill="#BCB3A1">0</text>
  </g>
  <text x="360" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">… e così via per tutte le ~50.000 parole del vocabolario (quasi tutte a 0)</text>
</svg>
