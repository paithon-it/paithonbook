<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La mappa dei colori e' quella del brand,
  book/_static/brand/figure/palette.json.
  fonte: ../funzioni-args-kwargs-lambda.svg
-->
<svg viewBox="0 0 720 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La funzione come scatola: argomenti in ingresso, corpo interno, valore di ritorno in uscita">
  <rect x="0" y="0" width="720" height="340" fill="#16130F"/>
  <!-- input -->
  <rect x="30" y="60" width="150" height="42" rx="6" fill="#C9A961" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="105" y="86" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">prezzo = 100</text>
  <rect x="30" y="120" width="150" height="42" rx="6" fill="#C9A961" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="105" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">sconto = 0.25</text>
  <rect x="30" y="180" width="150" height="42" rx="6" fill="#16130F" stroke="#C9A961" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="105" y="206" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">default se assente</text>
  <!-- frecce in ingresso -->
  <line x1="180" y1="81" x2="250" y2="130" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="180" y1="141" x2="250" y2="150" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="180" y1="201" x2="250" y2="170" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="258,150 246,144 246,156" fill="#F4ECDD"/>
  <!-- scatola -->
  <rect x="262" y="70" width="220" height="170" rx="10" fill="#5BA39C" stroke="#F4ECDD" stroke-width="2"/>
  <text x="372" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#16130F">prezzo_scontato()</text>
  <line x1="290" y1="128" x2="454" y2="128" stroke="#16130F" stroke-width="1.5"/>
  <text x="372" y="158" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#16130F">finale = prezzo · (1 − sconto)</text>
  <text x="372" y="184" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#16130F">variabili locali: invisibili</text>
  <text x="372" y="204" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#16130F">fuori dalla scatola</text>
  <!-- freccia in uscita -->
  <line x1="482" y1="155" x2="552" y2="155" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="560,155 548,149 548,161" fill="#F4ECDD"/>
  <!-- output -->
  <rect x="564" y="132" width="130" height="46" rx="6" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="629" y="153" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#16130F">return 75.0</text>
  <text x="629" y="170" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#16130F">(l'unico canale)</text>
  <!-- etichette -->
  <text x="105" y="46" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" font-weight="bold">argomenti</text>
  <text x="372" y="56" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" font-weight="bold">corpo (privato)</text>
  <text x="629" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" font-weight="bold">output</text>
  <text x="360" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">chi chiama vede solo i due lati: cosa entra, cosa esce</text>
</svg>
