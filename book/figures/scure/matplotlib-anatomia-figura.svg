  <line x1="118.0" y1="300" x2="118.0" y2="305" stroke="#F4ECDD" stroke-width="1.2"/>
  <text x="118.0" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#BCB3A1">gen</text>
