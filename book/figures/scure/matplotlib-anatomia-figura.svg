  <text x="56" y="200.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" transform="rotate(-90 56 200.0)">euro</text>
  <text x="490" y="96" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" font-weight="bold">Titolo</text>
  <text x="490" y="111" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">ax.set_title()</text>
  <line x1="482" y1="92" x2="366.0" y2="82.0" stroke="#DDB874" stroke-width="1.2" stroke-dasharray="3 3"/>
