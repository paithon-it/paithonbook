<svg viewBox="0 0 700 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un grafico Matplotlib annotato con i nomi delle sue parti. Il grafico disegna il fatturato dei primi sei mesi, da gennaio a giugno, con una linea che sale, scende a marzo e risale fino a maggio. Un riquadro tratteggiato che racchiude tutto &#232; la Figure, cio&#232; il foglio; il riquadro pieno delimitato dai due assi sono gli Axes, cio&#232; l'area di disegno. Cinque didascalie collegate da tratteggi indicano il titolo (ax.set_title), la legenda (ax.legend), la linea dei dati (ax.plot), le tacche degli assi con i loro numeri, e le etichette degli assi (ax.set_xlabel e ax.set_ylabel). In fondo: una Figure pu&#242; contenere pi&#249; Axes, e quasi tutti i metodi appartengono agli Axes.">
  <rect x="0" y="0" width="700" height="430" fill="#0E0C0A"/>
  <text x="350.0" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#F4ECDD" font-weight="bold">I nomi delle parti di un grafico</text>
  <rect x="40" y="54" width="430" height="300" rx="6" fill="none" stroke="#E27B52" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="48" y="72" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#E27B52" font-weight="bold">Figure: il foglio (fig)</text>
  <rect x="118" y="100" width="320" height="200" fill="none" stroke="#5BA39C" stroke-width="2"/>
  <text x="432" y="290" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C" font-weight="bold">Axes: il riquadro (ax)</text>
  <text x="278.0" y="86" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" font-weight="bold">Fatturato dei primi sei mesi</text>
  <line x1="113" y1="300.0" x2="118" y2="300.0" stroke="#F4ECDD" stroke-width="1.2"/>
