  <line x1="482" y1="146" x2="228.0" y2="126.0" stroke="#DDB874" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="490" y="204" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" font-weight="bold">Linea dati</text>
  <text x="490" y="219" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">ax.plot(x, y)</text>
  <line x1="482" y1="200" x2="374.0" y2="140.0" stroke="#DDB874" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="490" y="258" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" font-weight="bold">Tacche e valori</text>
  <text x="490" y="273" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">gli assi, con i numeri</text>
  <line x1="482" y1="254" x2="438.0" y2="310.0" stroke="#DDB874" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="490" y="312" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" font-weight="bold">Etichette degli assi</text>
  <text x="490" y="327" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">ax.set_xlabel(), set_ylabel()</text>
  <line x1="482" y1="308" x2="418.0" y2="336.0" stroke="#DDB874" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="40" y1="396" x2="660" y2="396" stroke="#34302A" stroke-width="1"/>
  <text x="350.0" y="416" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">Una Figure pu&#242; contenere pi&#249; Axes; quasi tutti i metodi appartengono agli Axes.</text>
