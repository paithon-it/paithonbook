<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../problema-allineamento.svg
-->
<svg viewBox="0 0 760 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: obiettivo dichiarato contro obiettivo appreso">
  <rect x="0" y="0" width="760" height="380" fill="#0E0C0A"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#F4ECDD">Obiettivo dichiarato vs obiettivo appreso</text>
  <!-- intent box -->
  <rect x="40" y="70" width="200" height="70" rx="8" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="140" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F4ECDD">Intenzione umana</text>
  <text x="140" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">"vinci la gara"</text>
  <!-- proxy box -->
  <rect x="280" y="70" width="200" height="70" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5BA39C">Metrica dichiarata</text>
  <text x="380" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5BA39C">"massimizza i punti"</text>
  <!-- learned box -->
  <rect x="520" y="70" width="200" height="70" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="620" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#E27B52">Obiettivo appreso</text>
  <text x="620" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52">"gira in tondo sui bonus"</text>
  <!-- arrows -->
  <line x1="240" y1="105" x2="276" y2="105" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="276,100 286,105 276,110" fill="#F4ECDD"/>
  <text x="260" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">traduzione</text>
  <line x1="480" y1="105" x2="516" y2="105" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="516,100 526,105 516,110" fill="#F4ECDD"/>
  <text x="500" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">training</text>
  <!-- gap labels -->
  <rect x="150" y="180" width="220" height="56" rx="8" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="260" y="203" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F4ECDD">Gap 1: outer alignment</text>
  <text x="260" y="223" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">la metrica cattura l'intenzione?</text>
  <rect x="400" y="180" width="220" height="56" rx="8" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="510" y="203" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F4ECDD">Gap 2: inner alignment</text>
  <text x="510" y="223" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">il modello persegue la metrica?</text>
  <!-- connectors from gaps to arrows -->
  <line x1="260" y1="180" x2="260" y2="118" stroke="#F4ECDD" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="510" y1="180" x2="510" y2="118" stroke="#F4ECDD" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- bottom comparison -->
  <line x1="60" y1="270" x2="700" y2="270" stroke="#F4ECDD" stroke-width="1.5"/>
  <circle cx="170" cy="315" r="9" fill="#5BA39C"/>
  <text x="190" y="320" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">comportamento previsto: taglia il traguardo</text>
  <circle cx="170" cy="348" r="9" fill="#E27B52"/>
  <text x="190" y="353" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">comportamento reale: punteggio massimo, gara mai finita</text>
</svg>
