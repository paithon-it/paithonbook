  <text x="352" y="234" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#BCB3A1">…</text>

  <text x="24" y="266" font-family="Inter, sans-serif" font-size="11.5" fill="#BCB3A1">Un quadretto è una riga, una mossa è una colonna.</text>
  <text x="24" y="284" font-family="Inter, sans-serif" font-size="11.5" fill="#BCB3A1">Per decidere si guarda la riga in cui si è e si prende il voto più alto.</text>
</svg>
