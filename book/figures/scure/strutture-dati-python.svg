<?xml version="1.0" encoding="UTF-8"?>
<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../strutture-dati-python.svg
-->
<!--
  paithon book, figura: le quattro strutture dati native di Python a
  confronto (list, tuple, dict, set). Ogni scheda: nome (serif), un tag
  con le proprietà e un piccolo schema dei dati. Palette-locked:
  schede cream, bordi terracotta/teal/ocra/warm-black, testo warm-black
  e grigi warm, valori in monospace. Fondo trasparente (leggibile in
  light e dark). Nessun colore fuori palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img"
     aria-label="Quattro schede a confronto: list ordinata e modificabile, tuple ordinata e immutabile, dict con coppie chiave-valore, set senza duplicati">
  <style>
    .card  { fill:#0E0C0A; }
    .name  { font-family:Fraunces, Georgia, serif; font-size:19px; font-weight:600; fill:#F4ECDD; }
    .tag   { font-family:Inter, system-ui, sans-serif; font-size:12px; fill:#BCB3A1; }
    .val   { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:15px; fill:#F4ECDD; }
    .kv    { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:13px; fill:#F4ECDD; }
    .setv  { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:19px; fill:#F4ECDD; }
    .arrow { fill:#BCB3A1; font-family:"JetBrains Mono", ui-monospace, monospace; font-size:15px; }
  </style>

  <!-- ===== list (terracotta) ===== -->
  <rect class="card" x="20" y="20" width="230" height="150" rx="8" stroke="#E27B52" stroke-width="2.5"/>
  <text class="name" x="40" y="56">list</text>
  <text class="tag"  x="40" y="76">ordinata &#183; modificabile</text>
  <!-- celle in fila -->
  <rect x="42"  y="105" width="34" height="34" rx="5" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <rect x="82"  y="105" width="34" height="34" rx="5" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <rect x="122" y="105" width="34" height="34" rx="5" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text class="val" x="59"  y="127" text-anchor="middle">3</text>
  <text class="val" x="99"  y="127" text-anchor="middle">1</text>
  <text class="val" x="139" y="127" text-anchor="middle">4</text>
  <!-- cella fantasma: si puo' aggiungere (mutabile) -->
  <rect x="166" y="105" width="34" height="34" rx="5" fill="none" stroke="#E27B52" stroke-width="2" stroke-dasharray="3 4"/>
  <text class="val" x="183" y="127" text-anchor="middle" fill="#E27B52">+</text>

  <!-- ===== tuple (teal) ===== -->
  <rect class="card" x="270" y="20" width="230" height="150" rx="8" stroke="#5BA39C" stroke-width="2.5"/>
  <text class="name" x="290" y="56">tuple</text>
  <text class="tag"  x="290" y="76">ordinata &#183; immutabile</text>
  <rect x="292" y="105" width="52" height="34" rx="5" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <rect x="350" y="105" width="52" height="34" rx="5" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text class="val" x="318" y="127" text-anchor="middle" font-size="12">45.46</text>
  <text class="val" x="376" y="127" text-anchor="middle" font-size="13">9.19</text>
  <!-- lucchetto: immutabile -->
  <rect x="420" y="117" width="26" height="20" rx="3" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <path d="M 426 117 v-4 a7 7 0 0 1 14 0 v4" fill="none" stroke="#5BA39C" stroke-width="2"/>
  <circle cx="433" cy="126" r="2.5" fill="#5BA39C"/>

  <!-- ===== dict (ocra) ===== -->
  <rect class="card" x="20" y="190" width="230" height="150" rx="8" stroke="#DDB874" stroke-width="2.5"/>
  <text class="name" x="40" y="226">dict</text>
  <text class="tag"  x="40" y="246">chiave &#8594; valore</text>
  <!-- riga 1 -->
  <rect x="42" y="262" width="78" height="28" rx="6" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text class="kv" x="81" y="281" text-anchor="middle">pane</text>
  <text class="arrow" x="132" y="281">&#8594;</text>
  <text class="kv" x="160" y="281">1.2</text>
  <!-- riga 2 -->
  <rect x="42" y="300" width="78" height="28" rx="6" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text class="kv" x="81" y="319" text-anchor="middle">latte</text>
  <text class="arrow" x="132" y="319">&#8594;</text>
  <text class="kv" x="160" y="319">0.9</text>

  <!-- ===== set (warm-black) ===== -->
  <rect class="card" x="270" y="190" width="230" height="150" rx="8" stroke="#F4ECDD" stroke-width="2.5"/>
  <text class="name" x="290" y="226">set</text>
  <text class="tag"  x="290" y="246">senza duplicati</text>
  <!-- input con doppione, sbiadito -->
  <!-- Un solo <text> con un <tspan> barrato: con tre <text> a coordinate
       fissate a mano il duplicato finiva sopra il «4,» e in stampa i due
       glifi si impastavano, cioe' la figura nascondeva proprio la cosa che
       esiste per mostrare. Qui le posizioni le calcola il compositore. -->
  <text class="kv" x="300" y="278" fill="#8E8676">{ 3, 1, 4, <tspan text-decoration="line-through">1</tspan> }</text>
  <text class="arrow" x="300" y="304">&#8595;</text>
  <!-- risultato: insieme senza duplicati -->
  <rect x="322" y="290" width="150" height="36" rx="18" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text class="setv" x="397" y="314" text-anchor="middle">{ 3, 1, 4 }</text>
</svg>
