<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../ppo-2017.svg
-->
<svg viewBox="0 0 760 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagramma: dalla policy vecchia un piccolo passo verso la policy nuova resta dentro la fascia consentita ed è permesso, mentre un salto lungo esce dalla fascia e viene tagliato">
  <rect x="0" y="0" width="760" height="320" fill="#0E0C0A"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F4ECDD">Un passo alla volta, dentro la fascia</text>

  <!-- fascia consentita -->
  <ellipse cx="250" cy="180" rx="150" ry="96" fill="none" stroke="#5BA39C" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="250" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5BA39C">zona consentita: rapporto tra 0,8 e 1,2</text>

  <!-- policy vecchia -->
  <circle cx="250" cy="180" r="9" fill="#F4ECDD"/>
  <text x="250" y="214" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F4ECDD">policy vecchia</text>

  <!-- piccolo passo consentito -->
  <line x1="259" y1="176" x2="332" y2="150" stroke="#5BA39C" stroke-width="3"/>
  <path d="M332 150 L 320 149 L 325 159 Z" fill="#5BA39C"/>
  <circle cx="336" cy="149" r="8" fill="#5BA39C"/>
  <text x="360" y="132" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#5BA39C">policy nuova</text>
  <text x="360" y="147" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C">passo piccolo: ok</text>

  <!-- salto lungo tagliato -->
  <line x1="259" y1="186" x2="470" y2="252" stroke="#E27B52" stroke-width="3" stroke-dasharray="9 6"/>
  <path d="M470 252 L 458 248 L 460 259 Z" fill="#E27B52"/>
  <!-- barriera / taglio -->
  <line x1="398" y1="212" x2="430" y2="248" stroke="#E27B52" stroke-width="2.5"/>
  <line x1="430" y1="212" x2="398" y2="248" stroke="#E27B52" stroke-width="2.5"/>
  <text x="560" y="244" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E27B52">salto lungo: tagliato</text>
  <text x="560" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52">oltre la fascia l'obiettivo</text>
  <text x="560" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52">non premia più</text>

  <text x="250" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">il clip tiene la nuova strategia vicina alla vecchia, aggiornamento dopo aggiornamento</text>
</svg>
