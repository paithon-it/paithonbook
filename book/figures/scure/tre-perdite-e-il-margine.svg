<svg viewBox="0 0 700 404" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un grafico con in orizzontale il margine del punto, cioè la sua classe moltiplicata per il punteggio del classificatore, da meno due a tre e mezzo, e in verticale la perdita. Tre curve. La perdita zero-uno, tratteggiata, vale uno a sinistra dello zero e cade a zero a destra. La hinge della SVM, in terracotta, scende dritta da tre fino a toccare lo zero esattamente nel punto uno, il bordo del corridoio, e da lì in poi resta appoggiata all'asse. La log-loss della regressione logistica, in teal, scende anche lei ma senza mai toccare l'asse: nel punto uno vale ancora zero virgola quarantacinque e nel punto tre zero virgola zero sette. Una riga verticale tratteggiata segna il punto uno. In basso tre zone: a sinistra dello zero il punto sta dalla parte sbagliata, fra zero e uno sta dentro il corridoio, oltre uno sta fuori e dalla parte giusta. Sotto, la riga che chiude: solo la hinge diventa esattamente zero, ed è da lì che vengono i vettori di supporto.">
