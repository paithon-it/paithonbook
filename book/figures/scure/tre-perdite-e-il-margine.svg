  <text x="350.0" y="26.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#F4ECDD" font-weight="bold">Quanto paga un punto, a seconda di dove sta</text>
  <text x="350.0" y="46.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">e perché una sola delle due perdite lascia perdere i punti facili</text>
