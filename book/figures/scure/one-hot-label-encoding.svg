  <text x="130" y="107" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0E0C0A">città</text>
  <circle cx="88" cy="138" r="6" fill="#E27B52"/><text x="104" y="143" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Milano</text>
  <circle cx="88" cy="174" r="6" fill="#5BA39C"/><text x="104" y="179" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Roma</text>
  <circle cx="88" cy="210" r="6" fill="#DDB874"/><text x="104" y="215" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Napoli</text>
  <circle cx="88" cy="246" r="6" fill="#5BA39C"/><text x="104" y="251" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Roma</text>

