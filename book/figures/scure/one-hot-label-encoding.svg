  <text x="402" y="307" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0E0C0A">Milano</text>
  <text x="466" y="307" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0E0C0A">Roma</text>
