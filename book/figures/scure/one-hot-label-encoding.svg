<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tabella prima e dopo la codifica: la colonna città diventa una colonna di interi con ordinal encoding oppure tre colonne binarie con one-hot encoding">
