<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../proiezione-minimi-quadrati.svg
-->
<svg viewBox="0 0 720 400" width="100%" role="img" aria-label="Un piano disegnato in prospettiva rappresenta l'immagine della matrice, con due frecce corte che vi giacciono sopra: sono le colonne. Una freccia b parte dall'origine e punta fuori dal piano. La sua ombra sul piano e' la freccia p, e il segmento verticale fra la punta di p e la punta di b, marcato con un angolo retto, e' il residuo. Un altro punto del piano e' collegato alla punta di b da un tratteggio visibilmente piu' lungo." xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="400" fill="#0E0C0A"/>
  <defs>
    <marker id="prB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E27B52"/></marker>
    <marker id="prT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5BA39C"/></marker>
    <marker id="prO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DDB874"/></marker>
  </defs>

  <!-- il piano: l'immagine della matrice -->
  <polygon points="70,300 450,300 600,185 220,185" fill="#5BA39C" fill-opacity="0.10" stroke="#5BA39C" stroke-width="1.8"/>
  <text x="76" y="322" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#5BA39C">immagine di A: tutto quello che le colonne sanno fare</text>

  <!-- un altro punto del piano, piu' lontano -->
  <circle cx="300" cy="275" r="4.5" fill="#8E8676"/>
  <line x1="300" y1="275" x2="450" y2="128" stroke="#8E8676" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="95" y="150" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">qualunque altro punto</text>
  <text x="95" y="166" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">del piano dista di più</text>
  <path d="M 226 160 Q 300 168 348 210" fill="none" stroke="#8E8676" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- le colonne, dentro al piano -->
  <line x1="190" y1="285" x2="330" y2="298" stroke="#DDB874" stroke-width="2" marker-end="url(#prO)"/>
  <line x1="190" y1="285" x2="262" y2="232" stroke="#DDB874" stroke-width="2" marker-end="url(#prO)"/>
  <text x="338" y="296" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#DDB874">a₁</text>
  <text x="256" y="224" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#DDB874">a₂</text>

  <!-- il vettore dei dati, che sporge -->
  <line x1="190" y1="285" x2="450" y2="128" stroke="#E27B52" stroke-width="2.6" marker-end="url(#prB)"/>
  <text x="458" y="124" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#E27B52">b</text>
  <text x="472" y="124" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52">i dati, fuori dal piano</text>

  <!-- l'ombra -->
  <line x1="190" y1="285" x2="450" y2="253" stroke="#5BA39C" stroke-width="2.6" marker-end="url(#prT)"/>
  <text x="392" y="274" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5BA39C">p</text>
  <text x="406" y="274" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5BA39C">l’ombra di b sul piano</text>

  <!-- il residuo, perpendicolare al piano -->
  <line x1="450" y1="253" x2="450" y2="128" stroke="#F4ECDD" stroke-width="2"/>
  <polyline points="450,239 436,239 436,253" fill="none" stroke="#F4ECDD" stroke-width="1.3"/>
  <text x="462" y="203" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#F4ECDD">residuo</text>
  <text x="462" y="219" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">ad angolo retto</text>

  <!-- origine -->
  <circle cx="190" cy="285" r="4" fill="#F4ECDD"/>
  <text x="172" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">0</text>

  <!-- il conto, in basso -->
  <rect x="60" y="340" width="600" height="48" fill="none" stroke="#34302A" stroke-width="1.2" rx="6"/>
  <text x="360" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#BCB3A1" text-anchor="middle">il triangolo è rettangolo, quindi l’ipotenusa è più lunga del cateto:</text>
  <text x="360" y="379" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#F4ECDD" text-anchor="middle">l’ombra è il punto del piano più vicino a b</text>
</svg>
