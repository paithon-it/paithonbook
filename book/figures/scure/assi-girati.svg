<!--
  Paithon Book, figura animata: la stessa nuvola di schede, letta con due coppie di assi
  Generata da animazioni/svg/assi-girati.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     role="img" aria-label="Due riquadri affiancati con dentro la stessa nuvola di punti, negli stessi posti. A sinistra la nuvola è letta con una coppia di assi orizzontale e verticale, intestati «prima riga: inclinazione» e «seconda riga: luce»; a destra con una coppia di assi girata di 30 gradi. In tutti e due i riquadri è marcato lo stesso punto, con le linee tratteggiate che lo proiettano sui due assi: a sinistra si legge 0,50 e 0,90, a destra 0,88 e 0,53, e la sua distanza dal centro resta 1,03 in tutti e due.">
