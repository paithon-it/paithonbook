  <text x="380" y="87" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0E0C0A">CATEGORICO</text>
  <circle cx="320" cy="150" r="18" fill="#E27B52"/>
  <rect x="362" y="132" width="36" height="36" fill="#DDB874"/>
  <path d="M 440 132 L 458 168 L 422 168 Z" fill="#5BA39C"/>
  <text x="380" y="215" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">quartiere, colore</text>
