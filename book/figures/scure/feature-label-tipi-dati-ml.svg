  <rect x="510" y="60" width="220" height="270" fill="none" stroke="#DDB874" stroke-width="2" rx="8"/>
  <rect x="510" y="60" width="220" height="42" fill="#DDB874" rx="8"/>
  <text x="620" y="87" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD">ORDINALE</text>
  <rect x="540" y="158" width="34" height="20" fill="none" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="584" y="146" width="34" height="32" fill="none" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="628" y="134" width="34" height="44" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="557" y="172" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">C</text>
  <text x="601" y="166" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">B</text>
  <text x="645" y="160" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">A</text>
  <text x="620" y="215" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">classe energetica, taglie</text>
  <text x="620" y="255" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">ordine s&#236;,</text>
  <text x="620" y="273" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">distanze no</text>
  <text x="620" y="311" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-style="italic" fill="#F4ECDD">A &gt; B &#10003;  A&#8722;B = ? &#10007;</text>
  <!-- riga finale -->
  <text x="380" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Ogni tipo richiede un trattamento diverso prima di entrare nel modello</text>
</svg>
