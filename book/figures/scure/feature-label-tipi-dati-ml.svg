<svg viewBox="0 0 760 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="I tre tipi di feature: numerico, categorico, ordinale">
  <rect x="0" y="0" width="760" height="400" fill="#0E0C0A"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#F4ECDD">I tre tipi di feature</text>
  <!-- colonna NUMERICO -->
  <rect x="30" y="60" width="220" height="270" fill="none" stroke="#E27B52" stroke-width="2" rx="8"/>
  <rect x="30" y="60" width="220" height="42" fill="#E27B52" rx="8"/>
  <text x="140" y="87" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0E0C0A">NUMERICO</text>
  <line x1="55" y1="150" x2="225" y2="150" stroke="#F4ECDD" stroke-width="2"/>
  <line x1="55" y1="143" x2="55" y2="157" stroke="#F4ECDD" stroke-width="2"/>
  <line x1="112" y1="143" x2="112" y2="157" stroke="#F4ECDD" stroke-width="2"/>
  <line x1="169" y1="143" x2="169" y2="157" stroke="#F4ECDD" stroke-width="2"/>
  <line x1="225" y1="143" x2="225" y2="157" stroke="#F4ECDD" stroke-width="2"/>
  <text x="55" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">48</text>
  <text x="112" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">75</text>
  <text x="169" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">95</text>
  <text x="225" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">120</text>
  <text x="140" y="215" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">mq, prezzo, bagni</text>
  <text x="140" y="255" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">distanze e medie</text>
  <text x="140" y="273" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">hanno senso</text>
  <text x="140" y="311" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-style="italic" fill="#E27B52">110 = 65 + 45 &#10003;</text>
  <!-- colonna CATEGORICO -->
  <rect x="270" y="60" width="220" height="270" fill="none" stroke="#5BA39C" stroke-width="2" rx="8"/>
