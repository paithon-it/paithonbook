<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../gan-architettura.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-label="Schema dell'architettura di una GAN: un vettore di rumore z entra nel generatore G che produce un dato sintetico; il dato sintetico e i dati reali entrano nel discriminatore D che restituisce una probabilita reale o falso; i gradienti dell'errore tornano indietro dal discriminatore al generatore">
  <defs>
    <marker id="gan-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F4ECDD"/>
    </marker>
    <marker id="gan-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8E8676"/>
    </marker>
  </defs>

  <!-- rumore z -->
  <rect x="20" y="78" width="122" height="58" rx="8" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="81" y="102" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="22" font-style="italic" fill="#F4ECDD">z</text>
  <text x="81" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#BCB3A1">rumore</text>

  <!-- Generatore G -->
  <rect x="182" y="70" width="134" height="74" rx="10" fill="#E27B52" stroke="#F4ECDD" stroke-width="2"/>
  <text x="249" y="104" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="700" fill="#0E0C0A">G</text>
  <text x="249" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0E0C0A">generatore</text>

  <!-- dato sintetico -->
  <rect x="356" y="74" width="156" height="66" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2.5"/>
  <text x="434" y="101" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" font-style="italic" fill="#F4ECDD">x&#771; = G(z)</text>
  <text x="434" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#BCB3A1">dato sintetico</text>

  <!-- dati reali -->
  <rect x="356" y="250" width="156" height="66" rx="8" fill="#5BA39C" stroke="#F4ECDD" stroke-width="2"/>
  <text x="434" y="278" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" font-style="italic" fill="#0E0C0A">x</text>
  <text x="434" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0E0C0A">dati reali</text>

  <!-- Discriminatore D -->
  <rect x="556" y="150" width="120" height="96" rx="10" fill="#DDB874" stroke="#F4ECDD" stroke-width="2"/>
  <text x="616" y="192" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="700" fill="#F4ECDD">D</text>
  <text x="616" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#F4ECDD">discriminatore</text>

  <!-- output -->
  <text x="700" y="188" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" fill="#F4ECDD">D(x)</text>
  <text x="700" y="206" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="11" fill="#BCB3A1">reale?</text>

  <!-- frecce percorso in avanti -->
  <line x1="142" y1="107" x2="176" y2="107" stroke="#F4ECDD" stroke-width="2.5" marker-end="url(#gan-arrow)"/>
  <line x1="316" y1="107" x2="350" y2="107" stroke="#F4ECDD" stroke-width="2.5" marker-end="url(#gan-arrow)"/>
  <path d="M512,110 C540,120 540,168 550,178" fill="none" stroke="#F4ECDD" stroke-width="2.5" marker-end="url(#gan-arrow)"/>
  <path d="M512,280 C540,270 540,222 550,212" fill="none" stroke="#F4ECDD" stroke-width="2.5" marker-end="url(#gan-arrow)"/>
  <line x1="676" y1="198" x2="694" y2="198" stroke="#F4ECDD" stroke-width="2.5" marker-end="url(#gan-arrow)"/>

  <!-- retroazione gradienti (tratteggiata) -->
  <path d="M600,246 C600,352 249,360 249,150" fill="none" stroke="#8E8676" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gan-arrow-muted)"/>
  <text x="420" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8E8676">gradienti dell'errore (retropropagazione)</text>
</svg>