<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../lstm-gru-cancelli-memoria.svg
-->
<svg viewBox="0 0 720 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema della cella LSTM con i tre gate">
  <rect x="0" y="0" width="720" height="400" fill="#0E0C0A"/>
  <rect x="60" y="40" width="600" height="320" fill="none" stroke="#F4ECDD" stroke-width="2" rx="12"/>
  <text x="360" y="30" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#F4ECDD" text-anchor="middle" font-weight="bold">Cella LSTM</text>
  <!-- cell state top line -->
  <line x1="20" y1="90" x2="700" y2="90" stroke="#5BA39C" stroke-width="2"/>
  <text x="30" y="78" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5BA39C">C(t-1)</text>
  <text x="655" y="78" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5BA39C">C(t)</text>
  <!-- forget gate -->
  <rect x="130" y="180" width="110" height="56" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5" rx="8"/>
  <text x="185" y="204" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A" text-anchor="middle">forget gate</text>
  <text x="185" y="222" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A" text-anchor="middle">σ · cancella</text>
  <!-- input gate -->
  <rect x="305" y="180" width="110" height="56" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5" rx="8"/>
  <text x="360" y="204" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">input gate</text>
  <text x="360" y="222" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">σ · scrive</text>
  <!-- output gate -->
  <rect x="480" y="180" width="110" height="56" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5" rx="8"/>
  <text x="535" y="204" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A" text-anchor="middle">output gate</text>
  <text x="535" y="222" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A" text-anchor="middle">σ · legge</text>
  <!-- operations on cell line -->
  <circle cx="185" cy="90" r="14" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="185" y="95" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#E27B52" text-anchor="middle">×</text>
  <circle cx="360" cy="90" r="14" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text x="360" y="95" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="middle">+</text>
  <!-- arrows gates to line -->
  <line x1="185" y1="180" x2="185" y2="106" stroke="#E27B52" stroke-width="1.5"/>
  <polygon points="185,104 180,114 190,114" fill="#E27B52"/>
  <line x1="360" y1="180" x2="360" y2="106" stroke="#DDB874" stroke-width="1.5"/>
  <polygon points="360,104 355,114 365,114" fill="#DDB874"/>
  <!-- output path -->
  <line x1="535" y1="180" x2="535" y2="130" stroke="#5BA39C" stroke-width="1.5"/>
  <line x1="535" y1="130" x2="620" y2="130" stroke="#5BA39C" stroke-width="1.5"/>
  <line x1="620" y1="130" x2="620" y2="320" stroke="#5BA39C" stroke-width="1.5"/>
  <line x1="620" y1="320" x2="700" y2="320" stroke="#5BA39C" stroke-width="1.5"/>
  <polygon points="700,320 690,315 690,325" fill="#5BA39C"/>
  <text x="660" y="308" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5BA39C">h(t)</text>
  <!-- input bottom line -->
  <line x1="20" y1="320" x2="360" y2="320" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="26" y="308" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">x(t), h(t-1)</text>
  <line x1="185" y1="320" x2="185" y2="236" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="360" y1="320" x2="360" y2="236" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="360" y1="320" x2="535" y2="320" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="535" y1="320" x2="535" y2="236" stroke="#F4ECDD" stroke-width="1.5"/>
</svg>
