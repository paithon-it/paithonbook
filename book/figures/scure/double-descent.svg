<svg viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Curva del double descent: l'errore di test disegna una U, sale fino a un picco alla soglia di interpolazione e poi riscende nel regime sovraparametrizzato; l'errore di training scende a zero e resta a zero">
