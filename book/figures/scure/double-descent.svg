  <circle cx="330" cy="90" r="6" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="395" y="88" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52">picco</text>
