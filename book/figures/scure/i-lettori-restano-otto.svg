    .ax  { stroke:#34302A; stroke-width:2; fill:none; }
    .axc { stroke:#221F1A; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#F4ECDD; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#BCB3A1; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#F4ECDD; }
    .sg  { font-family:Inter, system-ui, sans-serif; font-size:14px; font-weight:600;
            letter-spacing:0.06em; fill:#F4ECDD; }
    .lt  { fill:#E27B52; fill-opacity:0.20; stroke:#E27B52;
            stroke-width:1.6; }
    .tc  { fill:#0E0C0A; stroke:#5BA39C; stroke-width:1.6; }
    .st  { stroke-dasharray:5 3; }
    .or  { fill:#0E0C0A; stroke:#DDB874; stroke-width:1.6; }
    .cn  { stroke:#34302A; stroke-width:1.1; }
    .lb  { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#F4ECDD; }
    .ls  { font-family:Inter, system-ui, sans-serif; font-size:11.5px; fill:#BCB3A1; }
    
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
