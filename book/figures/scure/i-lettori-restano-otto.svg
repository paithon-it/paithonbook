<!--
  Paithon Book, figura animata: le quattro formulazioni, e i lettori che restano otto
  Generata da animazioni/svg/i-lettori-restano-otto.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292"
     role="img" aria-label="Quattro schemi affiancati, uno per formulazione. In ciascuno, in alto, la stessa fila di otto pallini: i lettori, cioè le teste di query. Sotto, i taccuini di chiave e valore, e una linea porta ogni lettore al taccuino che consulta. In MHA i taccuini sono otto, uno per lettore. In GQA sono due, ciascuno condiviso da quattro lettori, e lo spazio scende a un quarto. In MQA è uno solo, letto da tutti e otto, e lo spazio scende a un ottavo. In MLA è ancora uno, letto da tutti e otto, ma tratteggiato perché dentro c'è un riassunto stenografato, e accanto sta una striscia ocra a parte che porta il segnale dell'ordine delle parole. La fila di otto pallini in cima resta identica nei quattro schemi.">
