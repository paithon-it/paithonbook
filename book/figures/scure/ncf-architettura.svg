<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../ncf-architettura.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Architettura del Neural Collaborative Filtering: gli identificativi di utente e film passano da due tabelle di embedding, i due vettori risultanti vengono concatenati e un percettrone multistrato produce il punteggio di affinità.">
  <defs>
    <marker id="freccia-ncf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BCB3A1"/>
    </marker>
  </defs>

  <!-- input: id utente e id film -->
  <rect x="30" y="70" width="110" height="44" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="1.5"/>
  <text x="85" y="97" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#F4ECDD">utente u</text>
  <rect x="30" y="206" width="110" height="44" rx="6" fill="#0E0C0A" stroke="#DDB874" stroke-width="1.5"/>
  <text x="85" y="233" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#F4ECDD">film i</text>

  <line x1="144" y1="92" x2="172" y2="92" stroke="#BCB3A1" stroke-width="2" marker-end="url(#freccia-ncf)"/>
  <line x1="144" y1="228" x2="172" y2="228" stroke="#BCB3A1" stroke-width="2" marker-end="url(#freccia-ncf)"/>

  <!-- embedding -->
  <rect x="178" y="64" width="150" height="56" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="253" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#5BA39C">embedding</text>
  <text x="253" y="107" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#F4ECDD">vettore P<tspan font-size="9" baseline-shift="sub">u</tspan></text>
  <rect x="178" y="200" width="150" height="56" rx="8" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text x="253" y="224" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#F4ECDD">embedding</text>
  <text x="253" y="243" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#F4ECDD">vettore Q<tspan font-size="9" baseline-shift="sub">i</tspan></text>

  <!-- convergenza sulla concatenazione -->
  <line x1="332" y1="92" x2="390" y2="138" stroke="#BCB3A1" stroke-width="2" marker-end="url(#freccia-ncf)"/>
  <line x1="332" y1="228" x2="390" y2="182" stroke="#BCB3A1" stroke-width="2" marker-end="url(#freccia-ncf)"/>

  <!-- concatenazione -->
  <rect x="396" y="100" width="90" height="120" rx="8" fill="#0E0C0A" stroke="#BCB3A1" stroke-width="1.5"/>
  <rect x="400" y="104" width="82" height="56" rx="4" fill="#5BA39C" fill-opacity="0.18"/>
  <text x="441" y="137" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#5BA39C">P<tspan font-size="10" baseline-shift="sub">u</tspan></text>
  <rect x="400" y="160" width="82" height="56" rx="4" fill="#DDB874" fill-opacity="0.3"/>
  <text x="441" y="193" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#F4ECDD">Q<tspan font-size="10" baseline-shift="sub">i</tspan></text>
  <text x="441" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#BCB3A1">concatenazione</text>

  <line x1="490" y1="160" x2="518" y2="160" stroke="#BCB3A1" stroke-width="2" marker-end="url(#freccia-ncf)"/>

  <!-- MLP -->
  <rect x="524" y="75" width="150" height="170" rx="10" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="599" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#E27B52">MLP</text>
  <rect x="544" y="115" width="110" height="20" rx="4" fill="#E27B52" fill-opacity="0.15" stroke="#E27B52" stroke-width="1.2"/>
  <rect x="554" y="143" width="90" height="20" rx="4" fill="#E27B52" fill-opacity="0.15" stroke="#E27B52" stroke-width="1.2"/>
  <rect x="564" y="171" width="70" height="20" rx="4" fill="#E27B52" fill-opacity="0.15" stroke="#E27B52" stroke-width="1.2"/>
  <text x="599" y="222" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#BCB3A1">strati densi · ReLU</text>

  <line x1="678" y1="160" x2="706" y2="160" stroke="#BCB3A1" stroke-width="2" marker-end="url(#freccia-ncf)"/>

  <!-- output -->
  <text x="714" y="156" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#E27B52">&#375;<tspan font-size="12" baseline-shift="sub">ui</tspan></text>
  <text x="714" y="180" font-family="Inter, sans-serif" font-size="12" fill="#BCB3A1">punteggio</text>
  <text x="714" y="196" font-family="Inter, sans-serif" font-size="12" fill="#BCB3A1">di affinità</text>
</svg>
