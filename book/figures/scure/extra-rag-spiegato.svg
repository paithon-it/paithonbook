<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../extra-rag-spiegato.svg
-->
<svg viewBox="0 0 760 300" width="100%" role="img" aria-label="Pipeline RAG divisa in due fasi. La prima, di indicizzazione, si esegue una volta sola: i documenti vengono spezzati in passaggi, ognuno convertito in un vettore e depositato in un archivio di vettori. La seconda, a ogni domanda: la domanda diventa un vettore, si recuperano i passaggi più vicini, e questi entrano nel prompt del modello, che risponde citando le fonti." xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="760" height="300" fill="#0E0C0A"/>
  <defs>
    <marker id="fr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#F4ECDD"/>
    </marker>
  </defs>

  <!-- fase 1: indicizzazione -->
  <text x="30" y="40" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">FASE 1 · INDICIZZAZIONE (una volta)</text>
  <rect x="30" y="55" width="110" height="60" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="85" y="82" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">Documenti</text>
  <text x="85" y="100" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">PDF, wiki, ticket</text>

  <rect x="180" y="55" width="100" height="60" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="230" y="82" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">Chunk</text>
  <text x="230" y="100" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">passaggi brevi</text>

  <rect x="320" y="55" width="100" height="60" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="370" y="82" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">Embedding</text>
  <text x="370" y="100" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">testo → vettore</text>

  <rect x="460" y="55" width="110" height="60" rx="6" fill="#5BA39C"/>
  <text x="515" y="82" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A" text-anchor="middle">Vector store</text>
  <text x="515" y="100" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#34302A" text-anchor="middle">indice dei vicini</text>

  <line x1="140" y1="85" x2="172" y2="85" stroke="#F4ECDD" stroke-width="1.5" marker-end="url(#fr)"/>
  <line x1="280" y1="85" x2="312" y2="85" stroke="#F4ECDD" stroke-width="1.5" marker-end="url(#fr)"/>
  <line x1="420" y1="85" x2="452" y2="85" stroke="#F4ECDD" stroke-width="1.5" marker-end="url(#fr)"/>

  <!-- fase 2: query -->
  <text x="30" y="185" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">FASE 2 · A OGNI DOMANDA</text>
  <rect x="30" y="200" width="110" height="60" rx="6" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text x="85" y="227" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">Domanda</text>
  <text x="85" y="245" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">→ vettore</text>

  <rect x="180" y="200" width="120" height="60" rx="6" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text x="240" y="227" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">Retrieval</text>
  <text x="240" y="245" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">passaggi più vicini</text>

  <rect x="340" y="200" width="110" height="60" rx="6" fill="#E27B52"/>
  <text x="395" y="227" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A" text-anchor="middle">LLM</text>
  <text x="395" y="245" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0E0C0A" text-anchor="middle">domanda + fonti</text>

  <rect x="490" y="200" width="140" height="60" rx="6" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="560" y="227" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">Risposta</text>
  <text x="560" y="245" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">con citazioni [1][2]</text>

  <line x1="140" y1="230" x2="172" y2="230" stroke="#F4ECDD" stroke-width="1.5" marker-end="url(#fr)"/>
  <line x1="300" y1="230" x2="332" y2="230" stroke="#F4ECDD" stroke-width="1.5" marker-end="url(#fr)"/>
  <line x1="450" y1="230" x2="482" y2="230" stroke="#F4ECDD" stroke-width="1.5" marker-end="url(#fr)"/>

  <!-- collegamento tra le fasi -->
  <line x1="515" y1="115" x2="515" y2="150" stroke="#5BA39C" stroke-width="1.5"/>
  <line x1="515" y1="150" x2="240" y2="150" stroke="#5BA39C" stroke-width="1.5"/>
  <line x1="240" y1="150" x2="240" y2="192" stroke="#5BA39C" stroke-width="1.5" marker-end="url(#fr)"/>
  <text x="260" y="145" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C">il retrieval interroga l'indice</text>
</svg>
