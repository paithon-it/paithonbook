<svg viewBox="0 0 720 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclo percezione-azione di un agente: percezione, decisione, azione, osservazione, con la memoria al centro che alimenta ogni fase">
  <rect x="0" y="0" width="720" height="360" fill="#0E0C0A"/>
  <text x="360" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F4ECDD">Il ciclo percezione-azione</text>
  <!-- nodi -->
  <rect x="45" y="150" width="150" height="62" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="120" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5BA39C">Percezione</text>
  <text x="120" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">richiesta + ultimo esito</text>
  <rect x="285" y="62" width="150" height="62" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#E27B52">Decisione</text>
  <text x="360" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">il modello sceglie</text>
  <rect x="525" y="150" width="150" height="62" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="600" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#E27B52">Azione</text>
  <text x="600" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">chiama uno strumento</text>
  <rect x="285" y="238" width="150" height="62" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="360" y="264" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5BA39C">Osservazione</text>
  <text x="360" y="284" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">risultato dell'azione</text>
  <!-- memoria centrale -->
  <circle cx="360" cy="181" r="44" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="360" y="178" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F4ECDD">Memoria</text>
  <text x="360" y="195" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#F4ECDD">tiene il filo</text>
  <defs>
    <marker id="ar103" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F4ECDD"/>
    </marker>
  </defs>
  <path d="M 175 148 Q 225 92 282 96" fill="none" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ar103)"/>
  <path d="M 438 96 Q 498 92 545 148" fill="none" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ar103)"/>
  <path d="M 545 214 Q 498 270 438 266" fill="none" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ar103)"/>
  <path d="M 282 266 Q 225 270 175 214" fill="none" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ar103)"/>
  <text x="205" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#F4ECDD">osserva</text>
  <text x="515" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#F4ECDD">agisce</text>
  <text x="515" y="282" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#F4ECDD">rientra</text>
  <text x="205" y="282" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#F4ECDD">aggiorna</text>
  <text x="360" y="338" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic" fill="#F4ECDD">finché il compito è chiuso, o un guardrail lo ferma</text>
</svg>
