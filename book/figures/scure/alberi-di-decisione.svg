<svg viewBox="0 0 640 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di un albero di decisione con split successivi">
  <rect x="0" y="0" width="640" height="400" fill="#0E0C0A"/>
  <line x1="320" y1="88" x2="180" y2="160" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="320" y1="88" x2="460" y2="160" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="180" y1="208" x2="100" y2="280" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="180" y1="208" x2="260" y2="280" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="460" y1="208" x2="390" y2="280" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="460" y1="208" x2="530" y2="280" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="230" y="40" width="180" height="48" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="320" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">reddito &gt; 30k?</text>
  <text x="320" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52">nodo radice</text>
  <text x="235" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5BA39C">sì</text>
  <text x="405" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52">no</text>
  <rect x="95" y="160" width="170" height="48" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="180" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">età &gt; 40?</text>
  <text x="180" y="198" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C">nodo interno</text>
  <rect x="375" y="160" width="170" height="48" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="460" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">rate in corso?</text>
  <text x="460" y="198" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C">nodo interno</text>
  <rect x="45" y="280" width="110" height="44" rx="22" fill="#5BA39C"/>
  <text x="100" y="307" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A">approva</text>
  <rect x="205" y="280" width="110" height="44" rx="22" fill="#DDB874"/>
  <text x="260" y="307" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">verifica</text>
  <rect x="335" y="280" width="110" height="44" rx="22" fill="#E27B52"/>
  <text x="390" y="307" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A">rifiuta</text>
  <rect x="475" y="280" width="110" height="44" rx="22" fill="#DDB874"/>
  <text x="530" y="307" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">verifica</text>
  <text x="320" y="368" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">ogni split divide i dati; le foglie colorate sono le decisioni finali</text>
</svg>
