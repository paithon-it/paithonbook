  <text x="380" y="276" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">le tre righe combaciano su film e voto, e le date distano pochi giorni</text>

  <line x1="380" y1="288" x2="380" y2="300" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="380,308 374,297 386,297" fill="#F4ECDD"/>

  <rect x="150" y="312" width="460" height="46" fill="none" stroke="#E27B52" stroke-width="2"/>
  <text x="380" y="341" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#E27B52">#4231 è Anna Rossi</text>

  <text x="380" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">e adesso si legge tutto il resto della sua riga:</text>
  <text x="380" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">i 180 film che non aveva mai messo sotto il proprio nome</text>

  <text x="380" y="448" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">Le tre coincidenze sono la cerniera; il guadagno di chi guarda è quello che alla cerniera resta attaccato.</text>
</svg>
