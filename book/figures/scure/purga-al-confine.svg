ta" x="138" y="248" text-anchor="end">t₀−1</text><g class="tolta"><rect class="feat" x="286.0" y="238" width="117.0" height="14"/><rect class="bers" x="524.0" y="238" width="15.0" height="14"/></g><line class="barra" x1="282.0" y1="245" x2="543.0" y2="245"/><text class="lbs tolta" x="138" y="270" text-anchor="end">t₀</text><g class="tolta"><rect class="feat" x="303.0" y="260" width="117.0" height="14"/><rect class="bers" x="541.0" y="260" width="15.0" height="14"/></g><line class="barra" x1="299.0" y1="267" x2="560.0" y2="267"/><text class="lbs " x="138" y="302" text-anchor="end">test t₀+1</text><g><rect class="feat feat-test" x="320.0" y="292" width="117.0" height="14"/><rect class="bers" x="558.0" y="292" width="15.0" height="14"/></g><line class="confine" x1="438.0" y1="50" x2="438.0" y2="316"/><text class="lbl" x="438.0" y="42" text-anchor="middle">confine</text><rect class="feat" x="150" y="335" width="13" height="13"/><text class="lbs" x="170" y="346">feature: i giorni che la riga legge</text><rect class="bers" x="400" y="335" width="13" height="13"/><text class="lbs" x="420" y="346">bersaglio, h giorni dopo</text><text class="lbs" x="150" y="370">barrate: le 7 righe tolte, il cui bersaglio cade oltre il confine (h = 7)</text><text class="lbs" x="150" y="390">la riga di test legge 3 bersagli di righe tenute: è lecito, quei giorni sono già passati</text>
