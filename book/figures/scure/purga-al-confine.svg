<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 406"
     role="img" aria-label="Le ultime dieci righe di training e la prima di test, una per riga. Ogni riga ha a sinistra la finestra di 7 giorni che legge e a destra il bersaglio, 7 giorni dopo. Una linea verticale segna il confine. Le 7 righe più vicine al confine hanno il bersaglio oltre il confine e sono barrate: sono quelle da togliere, esattamente h. La riga di test legge 3 giorni che sono bersagli di righe tenute, e non è una fuga.">
  <style>
    svg  { --d: 8.0s; }
    .ax  { stroke:#34302A; stroke-width:2; fill:none; }
    .axc { stroke:#221F1A; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#F4ECDD; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#BCB3A1; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#F4ECDD; }
    .feat { fill:#5BA39C; opacity:.35; }
    .feat-test { fill:#DDB874; opacity:.7; }
    .bers { fill:#E27B52; }
    .tolta { opacity:.45; }
    .barra { stroke:#F4ECDD; stroke-width:1.5; }
    .confine { stroke:#F4ECDD; stroke-width:2; stroke-dasharray:5 4; }
    
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
  </style>
