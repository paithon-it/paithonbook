<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../emergent-abilities.svg
-->
<svg viewBox="0 0 720 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Due grafici a confronto: metrica discontinua con curva a gradino, metrica continua con curva liscia">
  <rect x="0" y="0" width="720" height="340" fill="#0E0C0A"/>
  <text x="360" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F4ECDD">Stesso modello, due righelli</text>
  <!-- Pannello sinistro -->
  <text x="185" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E27B52">Metrica discontinua (exact match)</text>
  <line x1="70" y1="270" x2="300" y2="270" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="70" y1="270" x2="70" y2="80" stroke="#F4ECDD" stroke-width="1.5"/>
  <path d="M 70 265 L 200 263 L 215 255 L 228 180 L 240 110 L 300 95" fill="none" stroke="#E27B52" stroke-width="2"/>
  <text x="185" y="292" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">scala del modello (log)</text>
  <text x="58" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" transform="rotate(-90 58 175)">accuratezza</text>
  <text x="185" y="315" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">sembra un salto improvviso</text>
  <!-- Pannello destro -->
  <text x="535" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5BA39C">Metrica continua (es. edit distance)</text>
  <line x1="420" y1="270" x2="650" y2="270" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="420" y1="270" x2="420" y2="80" stroke="#F4ECDD" stroke-width="1.5"/>
  <path d="M 420 260 C 490 245, 540 200, 580 150 C 605 120, 630 102, 650 95" fill="none" stroke="#5BA39C" stroke-width="2"/>
  <text x="535" y="292" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">scala del modello (log)</text>
  <text x="408" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" transform="rotate(-90 408 175)">qualità</text>
  <text x="535" y="315" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">è un miglioramento graduale</text>
  <!-- Separatore e freccia -->
  <line x1="360" y1="70" x2="360" y2="280" stroke="#DDB874" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
