<!--
  Paithon Book, figura animata: il voto retrocede dalla meta, partita dopo partita
  Generata da animazioni/svg/voto-che-retrocede.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     role="img" aria-label="Griglia di tre righe per quattro colonne: la meta che paga più uno in alto a destra, la trappola che ne toglie uno subito sotto, un muro al centro, e nove caselle libere in ciascuna delle quali si legge il voto della mossa migliore, con la casella tinta tanto più intensamente quanto più quel voto è alto. Si parte con tutte e nove le caselle a zero dopo 7 partite; alla 8ª la sola casella accanto alla meta prende 0,50; alla 11ª quella sale a 0,75 e la casella prima prende 0,23; alla 13ª le caselle con un voto sono quattro, alla 21ª sei, alla 60ª tutte e nove. L'ultima a prendere un voto è la casella in basso a destra, sotto la trappola, e non l'angolo più lontano dalla meta, che ce l'ha già alla 21ª. Dopo 5000 partite i voti sono 0,81, 0,90, 1,00; 0,73, 0,90; 0,66, 0,73, 0,81, 0,73, riga per riga dall'alto in basso.">
