<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../toy-models-superposition.svg
-->
<svg viewBox="0 0 720 400" width="100%" role="img" aria-label="Schema: due dimensioni interne contengono due feature ortogonali se dense, cinque feature sovrapposte se sparse" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="400" fill="#0E0C0A"/>
  <text x="360" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#F4ECDD">Lo stesso spazio, due regimi</text>
  <!-- left panel: dense -->
  <rect x="40" y="70" width="280" height="280" fill="#0E0C0A" stroke="#34302A" stroke-width="1.5" rx="6"/>
  <text x="180" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F4ECDD">Feature dense</text>
  <!-- axes -->
  <line x1="180" y1="320" x2="180" y2="130" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="90" y1="230" x2="290" y2="230" stroke="#F4ECDD" stroke-width="1.5"/>
  <!-- 2 orthogonal features -->
  <line x1="180" y1="230" x2="180" y2="145" stroke="#E27B52" stroke-width="3"/>
  <polygon points="180,140 174,152 186,152" fill="#E27B52"/>
  <line x1="180" y1="230" x2="278" y2="230" stroke="#5BA39C" stroke-width="3"/>
  <polygon points="283,230 271,224 271,236" fill="#5BA39C"/>
  <text x="180" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic" fill="#F4ECDD">2 dimensioni, 2 concetti: assi separati</text>
  <!-- middle arrow -->
  <line x1="325" y1="210" x2="395" y2="210" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="395,210 385,204 385,216" fill="#F4ECDD"/>
  <text x="360" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">più sparse</text>
  <!-- right panel: sparse -->
  <rect x="400" y="70" width="280" height="280" fill="#0E0C0A" stroke="#34302A" stroke-width="1.5" rx="6"/>
  <text x="540" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F4ECDD">Feature sparse</text>
  <!-- axes -->
  <line x1="540" y1="320" x2="540" y2="130" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="450" y1="230" x2="630" y2="230" stroke="#F4ECDD" stroke-width="1.5"/>
  <!-- 5 features arranged like a pentagon around center (540,225) -->
  <line x1="540" y1="225" x2="540" y2="145" stroke="#E27B52" stroke-width="2.5"/>
  <line x1="540" y1="225" x2="616" y2="200" stroke="#5BA39C" stroke-width="2.5"/>
  <line x1="540" y1="225" x2="587" y2="290" stroke="#DDB874" stroke-width="2.5"/>
  <line x1="540" y1="225" x2="493" y2="290" stroke="#F4ECDD" stroke-width="2.5"/>
  <line x1="540" y1="225" x2="464" y2="200" stroke="#E27B52" stroke-width="2.5"/>
  <circle cx="540" cy="225" r="4" fill="#F4ECDD"/>
  <text x="540" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic" fill="#F4ECDD">2 dimensioni, 5 concetti: direzioni sovrapposte</text>
</svg>
