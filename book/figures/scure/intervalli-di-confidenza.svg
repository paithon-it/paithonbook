<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../intervalli-di-confidenza.svg
-->
<svg viewBox="0 0 660 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tre modelli con barre d'errore: A e B si sovrappongono, C è nettamente sotto">
  <rect width="660" height="380" fill="#0E0C0A"/>
  <!-- assi -->
  <line x1="90" y1="40" x2="90" y2="320" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="90" y1="320" x2="600" y2="320" stroke="#F4ECDD" stroke-width="1.5"/>
  <!-- tick e griglia: 14 px per punto percentuale, da 92% (y=40) a 72% (y=320) -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">
    <line x1="84" y1="264" x2="90" y2="264" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="76" y="269" text-anchor="end">76%</text>
    <line x1="90" y1="264" x2="600" y2="264" stroke="#DDB874" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="84" y1="208" x2="90" y2="208" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="76" y="213" text-anchor="end">80%</text>
    <line x1="90" y1="208" x2="600" y2="208" stroke="#DDB874" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="84" y1="152" x2="90" y2="152" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="76" y="157" text-anchor="end">84%</text>
    <line x1="90" y1="152" x2="600" y2="152" stroke="#DDB874" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="84" y1="96" x2="90" y2="96" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="76" y="101" text-anchor="end">88%</text>
    <line x1="90" y1="96" x2="600" y2="96" stroke="#DDB874" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="84" y1="40" x2="90" y2="40" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="76" y="45" text-anchor="end">92%</text>
  </g>
  <text x="40" y="180" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="middle" transform="rotate(-90 40 180)">accuratezza</text>
  <!-- modello A: 87,2 ± 2,9 -->
  <g>
    <line x1="200" y1="66" x2="200" y2="148" stroke="#E27B52" stroke-width="2"/>
    <line x1="184" y1="66" x2="216" y2="66" stroke="#E27B52" stroke-width="2"/>
    <line x1="184" y1="148" x2="216" y2="148" stroke="#E27B52" stroke-width="2"/>
    <circle cx="200" cy="107" r="7" fill="#E27B52"/>
    <text x="200" y="348" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="middle">modello A</text>
    <text x="200" y="366" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">87,2%</text>
  </g>
  <!-- modello B: 86,8 ± 3,0 -->
  <g>
    <line x1="350" y1="71" x2="350" y2="154" stroke="#5BA39C" stroke-width="2"/>
    <line x1="334" y1="71" x2="366" y2="71" stroke="#5BA39C" stroke-width="2"/>
    <line x1="334" y1="154" x2="366" y2="154" stroke="#5BA39C" stroke-width="2"/>
    <circle cx="350" cy="113" r="7" fill="#5BA39C"/>
    <text x="350" y="348" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="middle">modello B</text>
    <text x="350" y="366" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">86,8%</text>
  </g>
  <!-- modello C: 78,0 ± 3,6 -->
  <g>
    <line x1="500" y1="185" x2="500" y2="287" stroke="#DDB874" stroke-width="2"/>
    <line x1="484" y1="185" x2="516" y2="185" stroke="#DDB874" stroke-width="2"/>
    <line x1="484" y1="287" x2="516" y2="287" stroke="#DDB874" stroke-width="2"/>
    <circle cx="500" cy="236" r="7" fill="#DDB874"/>
    <text x="500" y="348" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="middle">modello C</text>
    <text x="500" y="366" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">78,0%</text>
  </g>
  <!-- annotazione sovrapposizione -->
  <rect x="160" y="60" width="230" height="100" fill="none" stroke="#F4ECDD" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="275" y="52" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">intervalli sovrapposti: nessun vincitore</text>
</svg>
