<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../react-2022.svg
-->
<svg viewBox="0 0 720 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclo ReAct: sequenza verticale che alterna passi di pensiero, azione e osservazione, ripetuti fino alla risposta">
  <rect x="0" y="0" width="720" height="600" fill="#0E0C0A"/>
  <text x="360" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F4ECDD">Il ciclo ReAct</text>

  <!-- Box 1: Pensiero -->
  <rect x="170" y="56" width="380" height="56" rx="6" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <rect x="170" y="56" width="10" height="56" fill="#E27B52"/>
  <text x="196" y="80" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#E27B52">PENSIERO</text>
  <text x="196" y="99" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Mi serve il film d'esordio del regista. Lo cerco.</text>

  <!-- Box 2: Azione -->
  <rect x="170" y="144" width="380" height="56" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <rect x="170" y="144" width="10" height="56" fill="#5BA39C"/>
  <text x="196" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#5BA39C">AZIONE</text>
  <text x="196" y="187" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" font-style="italic">cerca[«nome regista»]</text>

  <!-- Box 3: Osservazione -->
  <rect x="170" y="232" width="380" height="56" rx="6" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <rect x="170" y="232" width="10" height="56" fill="#DDB874"/>
  <text x="196" y="256" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#DDB874">OSSERVAZIONE</text>
  <text x="196" y="275" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Ha esordito con un film, ma manca l'anno.</text>

  <!-- Box 4: Pensiero -->
  <rect x="170" y="320" width="380" height="56" rx="6" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <rect x="170" y="320" width="10" height="56" fill="#E27B52"/>
  <text x="196" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#E27B52">PENSIERO</text>
  <text x="196" y="363" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Apro la pagina di quel film per l'anno di uscita.</text>

  <!-- Box 5: Azione -->
  <rect x="170" y="408" width="380" height="56" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <rect x="170" y="408" width="10" height="56" fill="#5BA39C"/>
  <text x="196" y="432" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#5BA39C">AZIONE</text>
  <text x="196" y="451" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" font-style="italic">cerca[«titolo del film»]</text>

  <!-- Box 6: Osservazione -->
  <rect x="170" y="496" width="380" height="56" rx="6" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <rect x="170" y="496" width="10" height="56" fill="#DDB874"/>
  <text x="196" y="520" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#DDB874">OSSERVAZIONE</text>
  <text x="196" y="539" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Uscito nel 1994 → ora posso rispondere.</text>

  <!-- Arrows between boxes -->
  <g stroke="#F4ECDD" stroke-width="1.5" fill="#F4ECDD">
    <line x1="360" y1="112" x2="360" y2="138"/><polygon points="360,144 356,136 364,136"/>
    <line x1="360" y1="200" x2="360" y2="226"/><polygon points="360,232 356,224 364,224"/>
    <line x1="360" y1="288" x2="360" y2="314"/><polygon points="360,320 356,312 364,312"/>
    <line x1="360" y1="376" x2="360" y2="402"/><polygon points="360,408 356,400 364,400"/>
    <line x1="360" y1="464" x2="360" y2="490"/><polygon points="360,496 356,488 364,488"/>
  </g>

  <!-- Right bracket grouping one iteration (boxes 1-3) -->
  <path d="M566,58 h12 v226 h-12" fill="none" stroke="#BCB3A1" stroke-width="1.5"/>
  <text x="588" y="175" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1" transform="rotate(90 588 175)" text-anchor="middle">un giro del ciclo</text>
</svg>
