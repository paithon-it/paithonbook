<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../controllo-di-flusso.svg
-->
<svg viewBox="0 0 720 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flowchart di un loop: inizio, condizione, corpo del ciclo, aggiornamento, uscita">
  <rect x="0" y="0" width="720" height="420" fill="#0E0C0A"/>
  <!-- il blocco rientrato: racchiude corpo e aggiornamento. E' il contorno
       che nel codice viene disegnato dal rientro. Sta prima dei box cosi'
       da restare dietro. -->
  <rect x="26" y="284" width="438" height="72" rx="8" fill="none"
        stroke="#8E8676" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="245" y="374" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="12.5" fill="#BCB3A1">il blocco rientrato: tutto ciò che il rientro tiene dentro</text>
  <!-- inizio -->
  <rect x="290" y="20" width="140" height="44" rx="22" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="360" y="47" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#0E0C0A">inizio</text>
  <line x1="360" y1="64" x2="360" y2="108" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="360,116 354,104 366,104" fill="#F4ECDD"/>
  <!-- condizione (rombo) -->
  <polygon points="360,120 480,180 360,240 240,180" fill="#DDB874" stroke="#F4ECDD" stroke-width="2"/>
  <text x="360" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#F4ECDD">condizione</text>
  <text x="360" y="195" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">vera?</text>
  <!-- ramo sì -->
  <line x1="360" y1="240" x2="360" y2="284" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="360,292 354,280 366,280" fill="#F4ECDD"/>
  <text x="378" y="268" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#5BA39C">sì</text>
  <!-- corpo -->
  <rect x="270" y="296" width="180" height="48" rx="6" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="360" y="325" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#0E0C0A">corpo del ciclo</text>
  <!-- aggiornamento e ritorno -->
  <line x1="270" y1="320" x2="130" y2="320" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="40" y="296" width="130" height="48" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="105" y="316" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">aggiorna</text>
  <text x="105" y="334" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">lo stato</text>
  <line x1="105" y1="296" x2="105" y2="180" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="105" y1="180" x2="232" y2="180" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="240,180 228,174 228,186" fill="#F4ECDD"/>
  <!-- ramo no -->
  <line x1="480" y1="180" x2="560" y2="180" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="568,180 556,174 556,186" fill="#F4ECDD"/>
  <text x="512" y="168" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#E27B52">no</text>
  <rect x="572" y="158" width="120" height="44" rx="22" fill="#F4ECDD" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="632" y="185" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#0E0C0A">uscita</text>
</svg>
