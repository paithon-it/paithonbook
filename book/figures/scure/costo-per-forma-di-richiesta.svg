<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../costo-per-forma-di-richiesta.svg
-->
<svg viewBox="0 0 800 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grafico a barre orizzontali in scala logaritmica: quanti token consuma un'operazione in quattro forme di richiesta, da una quarantina a sessantatremila. Le tacche verticali segnano cento, mille, diecimila e centomila token.">
  <rect x="0" y="0" width="800" height="420" fill="#0E0C0A"/>
  <text x="400" y="42" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#F4ECDD" text-anchor="middle" font-weight="bold">Token per operazione (scala logaritmica)</text>

  <!-- le decadi: senza di loro una barra in scala logaritmica non si sa leggere -->
  <line x1="294" y1="70" x2="294" y2="330" stroke="#34302A" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="424" y1="70" x2="424" y2="330" stroke="#34302A" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="553" y1="70" x2="553" y2="330" stroke="#34302A" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="682" y1="70" x2="682" y2="330" stroke="#34302A" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="294" y="348" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1" text-anchor="middle">100</text>
  <text x="424" y="348" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1" text-anchor="middle">1.000</text>
  <text x="553" y="348" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1" text-anchor="middle">10.000</text>
  <text x="682" y="348" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1" text-anchor="middle">100.000</text>

  <!-- l'asse: le barre partono tutte da qui, e qui la scala vale una ventina di token -->
  <line x1="215" y1="70" x2="215" y2="330" stroke="#F4ECDD" stroke-width="2"/>

  <text x="200" y="98" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="end">Classificare una frase</text>
  <rect x="215" y="82" width="28" height="24" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="251" y="99" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">~40</text>

  <text x="200" y="168" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="end">Domanda su documenti</text>
  <rect x="215" y="152" width="290" height="24" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="513" y="169" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">~4.300</text>

  <text x="200" y="238" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="end">Conversazione, 8 turni</text>
  <rect x="215" y="222" width="332" height="24" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="555" y="239" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">~9.000</text>

  <text x="200" y="308" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="end">Report da un dossier</text>
  <rect x="215" y="292" width="442" height="24" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="665" y="309" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">~63.000</text>

  <text x="400" y="380" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#BCB3A1" text-anchor="middle">Il prezzo per token è un listino e cambia. Quanti token servono lo decide la forma</text>
  <text x="400" y="400" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#BCB3A1" text-anchor="middle">della richiesta, e fra la prima riga e l'ultima ci sono più di mille volte.</text>
</svg>
