<svg viewBox="0 0 760 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: la piramide dei livelli di rischio dell'AI Act">
  <rect x="0" y="0" width="760" height="400" fill="#0E0C0A"/>
  <text x="380" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#F4ECDD">I quattro livelli di rischio dell'AI Act</text>

  <!-- Tier 1: vietato -->
  <polygon points="225,75 295,75 335,137 185,137" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="260" y="112" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0E0C0A">Inaccettabile</text>

  <!-- Tier 2: alto rischio -->
  <polygon points="182,141 338,141 379,204 141,204" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="260" y="178" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F4ECDD">Alto rischio</text>

  <!-- Tier 3: limitato -->
  <polygon points="139,208 381,208 422,271 98,271" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="260" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0E0C0A">Rischio limitato</text>

  <!-- Tier 4: minimo -->
  <polygon points="95,275 425,275 468,342 52,342" fill="#F4ECDD" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="260" y="313" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0E0C0A">Rischio minimo</text>

  <!-- connectors + annotations -->
  <line x1="315" y1="106" x2="486" y2="106" stroke="#BCB3A1" stroke-width="1.5"/>
  <text x="492" y="103" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#E27B52" font-weight="bold">Divieto totale</text>
  <text x="492" y="121" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">social scoring, manipolazione</text>

  <line x1="360" y1="172" x2="486" y2="172" stroke="#BCB3A1" stroke-width="1.5"/>
  <text x="492" y="169" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#F4ECDD" font-weight="bold">Conformità completa</text>
  <text x="492" y="187" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">log, sorveglianza umana, marchio CE</text>

  <line x1="404" y1="240" x2="486" y2="240" stroke="#BCB3A1" stroke-width="1.5"/>
  <text x="492" y="237" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#5BA39C" font-weight="bold">Solo trasparenza</text>
  <text x="492" y="255" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">"stai parlando con un'AI"</text>

  <line x1="448" y1="308" x2="486" y2="308" stroke="#BCB3A1" stroke-width="1.5"/>
  <text x="492" y="305" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#F4ECDD" font-weight="bold">Nessun obbligo specifico</text>
  <text x="492" y="323" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">qui sta la maggioranza dei prodotti</text>
</svg>
