  <text x="132.0" y="196.0" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">chiede finch&#233;</text>
  <text x="132.0" y="210.0" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">non passa</text>
