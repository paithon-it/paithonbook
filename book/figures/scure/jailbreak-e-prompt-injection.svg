<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../jailbreak-e-prompt-injection.svg
-->
<svg viewBox="0 0 640 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto tra jailbreak (attacco diretto) e prompt injection (attacco iniettato)">
  <rect x="0" y="0" width="640" height="420" fill="#0E0C0A"/>
  <line x1="320" y1="40" x2="320" y2="390" stroke="#DDB874" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="160" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD">Jailbreak</text>
  <text x="160" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52">attacco diretto</text>
  <text x="480" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD">Prompt injection</text>
  <text x="480" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5BA39C">attacco iniettato</text>

  <!-- LEFT: jailbreak -->
  <rect x="90" y="80" width="140" height="46" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="160" y="102" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Utente =</text>
  <text x="160" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E27B52">attaccante</text>
  <line x1="160" y1="126" x2="160" y2="252" stroke="#E27B52" stroke-width="2"/>
  <polygon points="160,262 154,248 166,248" fill="#E27B52"/>
  <text x="176" y="196" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">prompt</text>
  <text x="176" y="210" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">manipolato</text>
  <rect x="90" y="262" width="140" height="60" rx="8" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="160" y="288" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Modello</text>
  <text x="160" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52">regole aggirate</text>
  <text x="160" y="360" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">un solo attore,</text>
  <text x="160" y="375" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">davanti allo schermo</text>

  <!-- RIGHT: prompt injection -->
  <rect x="356" y="72" width="118" height="44" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="415" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">Utente</text>
  <text x="415" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C">(vittima)</text>
  <rect x="520" y="72" width="100" height="44" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="570" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52">Attaccante</text>

  <rect x="470" y="158" width="150" height="56" rx="8" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text x="545" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">Contenuto esterno</text>
  <text x="545" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52">istruzione nascosta</text>

  <rect x="400" y="300" width="150" height="60" rx="8" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="475" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Modello</text>
  <text x="475" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">esegue l'ordine iniettato</text>

  <!-- attacker hides instruction in content -->
  <line x1="570" y1="116" x2="558" y2="158" stroke="#E27B52" stroke-width="2"/>
  <polygon points="555,166 551,152 563,155" fill="#E27B52"/>
  <!-- user asks legit task -->
  <line x1="415" y1="116" x2="440" y2="300" stroke="#5BA39C" stroke-width="2"/>
  <polygon points="441,300 431,296 442,290" fill="#5BA39C"/>
  <!-- injected content flows into model -->
  <line x1="540" y1="214" x2="512" y2="300" stroke="#E27B52" stroke-width="2"/>
  <polygon points="510,300 512,286 520,296" fill="#E27B52"/>
  <text x="480" y="378" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">l'attaccante non parla mai col modello:</text>
  <text x="480" y="393" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">lascia l'ordine nei dati</text>
</svg>
