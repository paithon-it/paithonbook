  <text x="642" y="194.83333333333334" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#E27B52">istruzione nascosta</text>
  <line x1="654" y1="106" x2="646" y2="158" stroke="#E27B52" stroke-width="2" marker-end="url(#fB5532C)"/>
  <line x1="542" y1="106" x2="574" y2="286" stroke="#5BA39C" stroke-width="2" marker-end="url(#f2D5A5C)"/>
  <text x="530" y="196" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">domanda</text>
  <text x="530" y="210" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">normale</text>
  <line x1="658" y1="208" x2="618" y2="286" stroke="#DDB874" stroke-width="2" marker-end="url(#fC9A961)" marker-start="url(#fC9A961)"/>
  <text x="644" y="246" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">il modello</text>
  <text x="644" y="260" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#BCB3A1">va a leggere</text>
  <rect x="508.0" y="286" width="176" height="54" rx="8" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="596" y="308.3333333333333" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Modello</text>
  <text x="596" y="325.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5BA39C">esegue l&#8217;ordine del terzo</text>
  <text x="596" y="372" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">due attori, e chi parla col modello</text>
