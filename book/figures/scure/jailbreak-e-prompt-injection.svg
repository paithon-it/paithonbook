  <line x1="34" y1="418" x2="686" y2="418" stroke="#34302A" stroke-width="1"/>
  <text x="360.0" y="438" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">Nel jailbreak e nell&#8217;iniezione diretta l&#8217;attore &#232; uno solo, e cambia quale regola salta.</text>
  <text x="360.0" y="456" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">Nell&#8217;indiretta chi attacca non parla mai col modello: lascia l&#8217;ordine dove il modello andr&#224; a leggere.</text>
