<svg viewBox="0 0 720 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tre schemi affiancati. A sinistra il jailbreak: una scatola sola, «utente uguale attaccante», con una freccia che scende al modello, e sotto la riga «ci rimette chi offre il modello». In mezzo la prompt injection diretta: lo stesso attore solo, ma fra lui e il modello c'e' una scatola con le istruzioni del programma, «traduci quello che segue», che il suo «ignora quanto sopra» scavalca; ci rimette chi ha scritto il programma. A destra la prompt injection indiretta: due scatole in alto, l'utente vittima e un attaccante distinto; l'attaccante nasconde un'istruzione dentro un documento, l'utente manda al modello una domanda normale, e una freccia a due punte fra documento e modello dice che e' il modello ad andare a leggere e a portarsi il testo in contesto. L'attaccante non parla mai col modello.">
  <defs><marker id="fB5532C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E27B52"/></marker><marker id="f2D5A5C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5BA39C"/></marker><marker id="fC9A961" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DDB874"/></marker></defs>
  <rect x="0" y="0" width="720" height="470" fill="#0E0C0A"/>
  <line x1="242" y1="34" x2="242" y2="418" stroke="#34302A" stroke-width="1.2" stroke-dasharray="4 5"/>
  <line x1="478" y1="34" x2="478" y2="418" stroke="#34302A" stroke-width="1.2" stroke-dasharray="4 5"/>
  <text x="124" y="26" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#F4ECDD" font-weight="bold">Jailbreak</text>
  <text x="124" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52">l&#8217;utente scavalca il fornitore</text>
  <text x="360" y="26" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#F4ECDD" font-weight="bold">Prompt injection diretta</text>
  <text x="360" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#DDB874">l&#8217;utente scavalca il programma</text>
