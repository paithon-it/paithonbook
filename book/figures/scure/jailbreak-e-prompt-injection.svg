  <text x="360" y="308.3333333333333" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Modello</text>
  <text x="360" y="325.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#DDB874">esegue l&#8217;ordine dell&#8217;utente</text>
  <text x="360" y="372" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">un attore solo, come nel jailbreak</text>
  <text x="360" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">ci rimette chi ha scritto il programma</text>
  <rect x="492.0" y="62" width="100" height="44" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
