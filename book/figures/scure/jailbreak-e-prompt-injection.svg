  <text x="124" y="308.3333333333333" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Modello</text>
  <text x="124" y="325.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#E27B52">regole del fornitore aggirate</text>
  <text x="124" y="372" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">un attore solo</text>
  <text x="124" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">ci rimette chi offre il modello</text>
  <rect x="272.0" y="70" width="176" height="48" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="360" y="98.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">Utente = attaccante</text>
