<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../numpy-array-vs-liste.svg
-->
<svg viewBox="0 0 760 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto tra la memoria sparsa di una lista Python e la memoria contigua di un array NumPy">
  <rect x="0" y="0" width="760" height="400" fill="#0E0C0A"/>
  <text x="30" y="38" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#F4ECDD">Lista Python: memoria sparsa</text>
  <!-- lista: fila di puntatori -->
  <g stroke="#F4ECDD" stroke-width="1.5">
    <rect x="30" y="55" width="52" height="40" fill="#DDB874"/>
    <rect x="82" y="55" width="52" height="40" fill="#DDB874"/>
    <rect x="134" y="55" width="52" height="40" fill="#DDB874"/>
    <rect x="186" y="55" width="52" height="40" fill="#DDB874"/>
  </g>
  <text x="56" y="80" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">rimando</text>
  <text x="108" y="80" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">rimando</text>
  <text x="160" y="80" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">rimando</text>
  <text x="212" y="80" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">rimando</text>
  <!-- oggetti sparsi -->
  <g stroke="#E27B52" stroke-width="2" fill="#0E0C0A">
    <rect x="320" y="60" width="90" height="38"/>
    <rect x="520" y="100" width="90" height="38"/>
    <rect x="380" y="150" width="90" height="38"/>
    <rect x="600" y="45" width="90" height="38"/>
  </g>
  <text x="365" y="84" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">int 1</text>
  <text x="565" y="124" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">int 2</text>
  <text x="425" y="174" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">int 3</text>
  <text x="645" y="69" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">int 4</text>
  <!-- frecce dai puntatori agli oggetti -->
  <g stroke="#5BA39C" stroke-width="1.5" fill="none">
    <path d="M 82 75 C 200 75, 260 78, 318 78"/>
    <path d="M 134 95 C 300 200, 450 130, 518 120"/>
    <path d="M 186 95 C 260 170, 320 168, 378 168"/>
    <path d="M 238 75 C 400 20, 520 40, 598 60"/>
  </g>
  <g fill="#5BA39C">
    <path d="M 318 78 l -9 -4 v 8 z"/>
    <path d="M 518 120 l -10 -1 l 4 8 z"/>
    <path d="M 378 168 l -9 -4 v 8 z"/>
    <path d="M 598 60 l -10 -1 l 6 7 z"/>
  </g>
  <text x="30" y="232" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">4 salti in zone diverse della memoria: la CPU aspetta a ogni salto</text>

  <line x1="30" y1="252" x2="730" y2="252" stroke="#F4ECDD" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="30" y="286" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#F4ECDD">Array NumPy: memoria contigua</text>
  <g stroke="#F4ECDD" stroke-width="1.5">
    <rect x="30" y="302" width="80" height="44" fill="#5BA39C"/>
    <rect x="110" y="302" width="80" height="44" fill="#5BA39C"/>
    <rect x="190" y="302" width="80" height="44" fill="#5BA39C"/>
    <rect x="270" y="302" width="80" height="44" fill="#5BA39C"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#0E0C0A" text-anchor="middle">
    <text x="70" y="329">1</text>
    <text x="150" y="329">2</text>
    <text x="230" y="329">3</text>
    <text x="310" y="329">4</text>
  </g>
  <path d="M 30 358 h 320" stroke="#E27B52" stroke-width="2" fill="none"/>
  <path d="M 350 358 l -9 -4 v 8 z" fill="#E27B52"/>
  <text x="365" y="362" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E27B52">una sola lettura sequenziale</text>
  <text x="30" y="388" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">Valori uno accanto all'altro, tutti dello stesso tipo: la CPU li carica a blocchi</text>
</svg>
