<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../pandas-selezione-filtri-groupby.svg
-->
<svg viewBox="0 0 700 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema del pattern split-apply-combine: una tabella unica viene divisa in tre gruppi per prodotto, su ogni gruppo si applica la somma, e i risultati vengono ricombinati in una tabella riassuntiva con una riga per gruppo">
  <rect x="0" y="0" width="700" height="400" fill="#0E0C0A"/>
  <!-- fasi -->
  <text x="90" y="30" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD" text-anchor="middle">Tabella</text>
  <text x="320" y="30" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD" text-anchor="middle">1. SPLIT</text>
  <text x="480" y="30" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD" text-anchor="middle">2. APPLY</text>
  <text x="620" y="30" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD" text-anchor="middle">3. COMBINE</text>
  <!-- tabella origine: righe mescolate -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">
    <rect x="35" y="88" width="110" height="28" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="35" y="116" width="110" height="28" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="35" y="144" width="110" height="28" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="35" y="172" width="110" height="28" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="35" y="200" width="110" height="28" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="35" y="228" width="110" height="28" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="90" y="107" fill="#0E0C0A">tastiera · 149.7</text>
    <text x="90" y="135" fill="#0E0C0A">mouse · 99.5</text>
    <text x="90" y="163" fill="#F4ECDD">monitor · 378.0</text>
    <text x="90" y="191" fill="#0E0C0A">tastiera · 49.9</text>
    <text x="90" y="219" fill="#0E0C0A">mouse · 79.6</text>
    <text x="90" y="247" fill="#F4ECDD">monitor · 189.0</text>
  </g>
  <!-- frecce split -->
  <line x1="150" y1="130" x2="255" y2="86" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="255,86 241,86 246,97" fill="#F4ECDD"/>
  <line x1="150" y1="172" x2="255" y2="180" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="255,180 243,173 242,186" fill="#F4ECDD"/>
  <line x1="150" y1="214" x2="255" y2="272" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="255,272 246,261 240,272" fill="#F4ECDD"/>
  <!-- gruppi -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">
    <rect x="262" y="58" width="116" height="26" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="262" y="84" width="116" height="26" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="320" y="76" fill="#0E0C0A">tastiera · 149.7</text>
    <text x="320" y="102" fill="#0E0C0A">tastiera · 49.9</text>
    <rect x="262" y="152" width="116" height="26" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="262" y="178" width="116" height="26" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="320" y="170" fill="#0E0C0A">mouse · 99.5</text>
    <text x="320" y="196" fill="#0E0C0A">mouse · 79.6</text>
    <rect x="262" y="246" width="116" height="26" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="262" y="272" width="116" height="26" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="320" y="264" fill="#F4ECDD">monitor · 378.0</text>
    <text x="320" y="290" fill="#F4ECDD">monitor · 189.0</text>
  </g>
  <!-- frecce apply -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">
    <line x1="382" y1="84" x2="438" y2="84" stroke="#F4ECDD" stroke-width="2"/>
    <polygon points="438,84 426,77 426,91" fill="#F4ECDD"/>
    <text x="410" y="72">sum()</text>
    <line x1="382" y1="178" x2="438" y2="178" stroke="#F4ECDD" stroke-width="2"/>
    <polygon points="438,178 426,171 426,185" fill="#F4ECDD"/>
    <text x="410" y="166">sum()</text>
    <line x1="382" y1="272" x2="438" y2="272" stroke="#F4ECDD" stroke-width="2"/>
    <polygon points="438,272 426,265 426,279" fill="#F4ECDD"/>
    <text x="410" y="260">sum()</text>
  </g>
  <!-- risultati parziali -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle">
    <rect x="444" y="70" width="76" height="28" fill="none" stroke="#E27B52" stroke-width="2"/>
    <text x="482" y="89" fill="#F4ECDD">199.6</text>
    <rect x="444" y="164" width="76" height="28" fill="none" stroke="#5BA39C" stroke-width="2"/>
    <text x="482" y="183" fill="#F4ECDD">179.1</text>
    <rect x="444" y="258" width="76" height="28" fill="none" stroke="#DDB874" stroke-width="2"/>
    <text x="482" y="277" fill="#F4ECDD">567.0</text>
  </g>
  <!-- frecce combine -->
  <line x1="524" y1="84" x2="570" y2="150" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="570,150 564,137 555,146" fill="#F4ECDD"/>
  <line x1="524" y1="178" x2="570" y2="180" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="570,180 558,173 557,186" fill="#F4ECDD"/>
  <line x1="524" y1="272" x2="570" y2="210" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="570,210 556,213 564,224" fill="#F4ECDD"/>
  <!-- tabella finale -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">
    <rect x="576" y="138" width="88" height="28" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="576" y="166" width="88" height="28" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
    <rect x="576" y="194" width="88" height="28" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="620" y="157" fill="#0E0C0A">tast. 199.6</text>
    <text x="620" y="185" fill="#0E0C0A">mouse 179.1</text>
    <text x="620" y="213" fill="#F4ECDD">monit. 567.0</text>
  </g>
  <text x="350" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">vendite.groupby("prodotto")["incasso"].sum(): una riga, tre fasi</text>
</svg>
