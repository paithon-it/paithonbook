<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../mdp-grafo.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="100%" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Grafo di un MDP con tre stati collegati da azioni etichettate con le rispettive ricompense">
  <defs>
    <marker id="mdp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5BA39C"/>
    </marker>
  </defs>

  <!-- archi (azioni) -->
  <path d="M305,97 C250,35 185,55 144,190" fill="none" stroke="#5BA39C" stroke-width="2.5" marker-end="url(#mdp-arrow)"/>
  <path d="M151,201 L299,134" fill="none" stroke="#5BA39C" stroke-width="2.5" marker-end="url(#mdp-arrow)"/>
  <path d="M361,134 L508,199" fill="none" stroke="#5BA39C" stroke-width="2.5" marker-end="url(#mdp-arrow)"/>
  <path d="M98,241 C45,282 100,320 144,240" fill="none" stroke="#5BA39C" stroke-width="2.5" marker-end="url(#mdp-arrow)"/>

  <!-- etichette archi: azione e ricompensa -->
  <text x="166" y="150" font-size="14" fill="#BCB3A1" text-anchor="middle">su · <tspan fill="#8E8676">r = 0</tspan></text>
  <text x="232" y="40" font-size="14" fill="#BCB3A1" text-anchor="middle">torna · <tspan fill="#BCB3A1">r = −1</tspan></text>
  <text x="458" y="146" font-size="14" fill="#BCB3A1" text-anchor="middle">giù · <tspan fill="#E27B52" font-weight="700">r = +10</tspan></text>
  <text x="96" y="334" font-size="14" fill="#BCB3A1" text-anchor="middle">resta · <tspan fill="#BCB3A1">r = −1</tspan></text>

  <!-- stati -->
  <circle cx="120" cy="215" r="34" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2.5"/>
  <text x="120" y="222" font-size="20" fill="#F4ECDD" text-anchor="middle">s₀</text>

  <circle cx="330" cy="120" r="34" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2.5"/>
  <text x="330" y="127" font-size="20" fill="#F4ECDD" text-anchor="middle">s₁</text>

  <circle cx="545" cy="215" r="40" fill="#E27B52" stroke="#F4ECDD" stroke-width="2.5"/>
  <circle cx="545" cy="215" r="32" fill="none" stroke="#0E0C0A" stroke-width="2"/>
  <text x="545" y="222" font-size="20" fill="#0E0C0A" text-anchor="middle">s₂</text>

  <!-- didascalie di stato -->
  <text x="58" y="219" font-size="12" fill="#8E8676" text-anchor="middle">partenza</text>
  <text x="545" y="278" font-size="12" fill="#8E8676" text-anchor="middle">obiettivo (terminale)</text>
</svg>