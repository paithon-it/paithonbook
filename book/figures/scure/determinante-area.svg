<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../determinante-area.svg
-->
<svg viewBox="0 0 720 330" width="100%" role="img" aria-label="Tre riquadri affiancati. Nel primo un quadratino unitario su una griglia, con i due lati disegnati come frecce e l'area annotata uguale a uno. Nel secondo lo stesso quadratino e' diventato un parallelogramma di area cinque, e il quadratino di partenza resta tratteggiato accanto per il confronto. Nel terzo le due frecce cadono sulla stessa retta e il quadratino si riduce a un segmento spesso: l'area e' zero, e l'annotazione dice che da li' non si torna indietro." xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="330" fill="#0E0C0A"/>
  <defs>
    <marker id="dtT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E27B52"/></marker>
    <marker id="dtG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5BA39C"/></marker>
  </defs>

  <!-- ============ 1. il quadretto di partenza ============ -->
  <g stroke="#34302A" stroke-width="0.7">
    <line x1="18" y1="292" x2="228" y2="292"/><line x1="18" y1="250" x2="228" y2="250"/>
    <line x1="18" y1="208" x2="228" y2="208"/><line x1="18" y1="166" x2="228" y2="166"/>
    <line x1="18" y1="124" x2="228" y2="124"/>
    <line x1="60" y1="110" x2="60" y2="300"/><line x1="102" y1="110" x2="102" y2="300"/>
    <line x1="144" y1="110" x2="144" y2="300"/><line x1="186" y1="110" x2="186" y2="300"/>
  </g>
  <polygon points="60,250 102,250 102,208 60,208" fill="#DDB874" fill-opacity="0.30" stroke="#DDB874" stroke-width="1.6"/>
  <line x1="60" y1="250" x2="102" y2="250" stroke="#E27B52" stroke-width="2.4" marker-end="url(#dtT)"/>
  <line x1="60" y1="250" x2="60" y2="208" stroke="#5BA39C" stroke-width="2.4" marker-end="url(#dtG)"/>
  <circle cx="60" cy="250" r="3.5" fill="#F4ECDD"/>
  <text x="122" y="322" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#BCB3A1" text-anchor="middle">il quadretto di partenza</text>
  <text x="122" y="94" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F4ECDD" text-anchor="middle">area 1</text>

  <!-- ============ 2. dopo lo stiramento ============ -->
  <polygon points="270,265 300,265 300,235 270,235" fill="none" stroke="#34302A" stroke-width="1.4" stroke-dasharray="4 4"/>
  <polygon points="270,265 360,235 390,175 300,205" fill="#DDB874" fill-opacity="0.30" stroke="#DDB874" stroke-width="1.6"/>
  <line x1="270" y1="265" x2="360" y2="235" stroke="#E27B52" stroke-width="2.4" marker-end="url(#dtT)"/>
  <line x1="270" y1="265" x2="300" y2="205" stroke="#5BA39C" stroke-width="2.4" marker-end="url(#dtG)"/>
  <circle cx="270" cy="265" r="3.5" fill="#F4ECDD"/>
  <text x="352" y="322" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#BCB3A1" text-anchor="middle">dopo lo stiramento</text>
  <text x="352" y="94" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F4ECDD" text-anchor="middle">area 5, cioè il determinante</text>
  <text x="352" y="112" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1" text-anchor="middle">tratteggiato, il quadretto di prima</text>

  <!-- ============ 3. schiacciato ============ -->
  <polygon points="500,255 526,255 526,229 500,229" fill="none" stroke="#34302A" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="500" y1="255" x2="656" y2="177" stroke="#DDB874" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="500" y1="255" x2="552" y2="229" stroke="#E27B52" stroke-width="2.4" marker-end="url(#dtT)"/>
  <line x1="500" y1="255" x2="604" y2="203" stroke="#5BA39C" stroke-width="2.4" marker-end="url(#dtG)"/>
  <circle cx="500" cy="255" r="3.5" fill="#F4ECDD"/>
  <text x="590" y="322" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#BCB3A1" text-anchor="middle">schiacciato su una retta</text>
  <text x="590" y="94" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#E27B52" text-anchor="middle">area 0</text>
  <text x="590" y="112" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#E27B52" text-anchor="middle">da qui non si torna indietro</text>
  <text x="590" y="290" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1" text-anchor="middle">le due direzioni sono finite sulla stessa retta</text>
</svg>
