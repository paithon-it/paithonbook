<svg viewBox="0 0 760 396" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tre grafici affiancati, ciascuno con quattro anni di dati mensili, la linea di tendenza tratteggiata e una freccia verticale che misura l'altezza del picco estivo sopra la tendenza, nel primo anno e nell'ultimo. Nel primo grafico la stagione &#232; additiva e le due frecce misurano tutte e due ventidue: la stessa cifra ogni anno. Nel secondo la stagione &#232; moltiplicativa e le due frecce misurano venticinque virgola sei e quarantaquattro virgola tre: l'oscillazione cresce insieme al livello. Nel terzo si disegna il logaritmo della seconda serie, e le due frecce tornano lunghe uguali. In fondo: portare la serie sui logaritmi riporta una stagione moltiplicativa al caso additivo.">
  <rect x="0" y="0" width="760" height="396" fill="#0E0C0A"/>
  <text x="380.0" y="26.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#F4ECDD" font-weight="bold">La stessa stagione, nelle due forme</text>
