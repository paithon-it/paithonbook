<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../inizializzazione-pesi.svg
-->
<svg viewBox="0 0 760 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grafico della varianza del segnale strato per strato: con pesi troppo grandi esplode, troppo piccoli collassa, con inizializzazione Xavier/He resta stabile">
  <rect x="0" y="0" width="760" height="360" fill="#0E0C0A"/>
  <text x="380" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#F4ECDD">Varianza del segnale, strato per strato</text>
  <!-- axes -->
  <line x1="80" y1="300" x2="700" y2="300" stroke="#F4ECDD" stroke-width="2"/>
  <line x1="80" y1="300" x2="80" y2="60" stroke="#F4ECDD" stroke-width="2"/>
  <text x="390" y="336" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">profondità (strato 1 → 8)</text>
  <text x="40" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" transform="rotate(-90 40 180)">varianza</text>
  <!-- layer ticks -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">
    <text x="120" y="316">1</text><text x="200" y="316">2</text><text x="280" y="316">3</text>
    <text x="360" y="316">4</text><text x="440" y="316">5</text><text x="520" y="316">6</text>
    <text x="600" y="316">7</text><text x="680" y="316">8</text>
  </g>
  <!-- exploding: weights too large (ocra) -->
  <polyline points="120,240 200,228 280,210 360,185 440,152 520,115 600,82 680,62" fill="none" stroke="#DDB874" stroke-width="2"/>
  <circle cx="120" cy="240" r="4" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <circle cx="680" cy="62" r="4" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="560" y="92" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">pesi troppo grandi: esplode</text>
  <!-- vanishing: weights too small (terracotta) -->
  <polyline points="120,240 200,258 280,272 360,283 440,290 520,294 600,296 680,297" fill="none" stroke="#E27B52" stroke-width="2"/>
  <circle cx="120" cy="240" r="4" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <circle cx="680" cy="297" r="4" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="540" y="278" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">pesi troppo piccoli: collassa</text>
  <!-- stable: Xavier/He (teal) -->
  <polyline points="120,240 200,236 280,242 360,238 440,241 520,237 600,240 680,239" fill="none" stroke="#5BA39C" stroke-width="2.5"/>
  <circle cx="120" cy="240" r="4" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <circle cx="680" cy="239" r="4" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="470" y="222" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#5BA39C">Xavier / He: stabile</text>
</svg>
