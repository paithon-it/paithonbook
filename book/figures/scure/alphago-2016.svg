<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../alphago-2016.svg
-->
<svg viewBox="0 0 700 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le reti di AlphaGo partono dalle partite umane, poi il self-play le affina; le due reti guidano una ricerca ad albero che gioca meglio di entrambe e le cui partite tornano ad allenarle, chiudendo il giro">
  <defs>
    <marker id="ago-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#F4ECDD"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="400" fill="#0E0C0A"/>
  <text x="350" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#F4ECDD" font-weight="bold">Self-play, reti neurali e ricerca ad albero</text>
  <!-- il punto di partenza del 2016, che AlphaGo Zero toglie -->
  <rect x="248" y="58" width="170" height="46" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="333" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52" font-weight="bold">partite umane</text>
  <text x="333" y="95" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">il punto di partenza, nel 2016</text>
  <line x1="333" y1="104" x2="333" y2="114" stroke="#E27B52" stroke-width="2" marker-end="url(#ago-arrow)"/>
  <text x="428" y="86" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">è il passo che</text>
  <text x="428" y="101" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">AlphaGo Zero toglie</text>
  <!-- stage 1: self play -->
  <rect x="45" y="150" width="120" height="64" rx="10" fill="#E27B52"/>
  <text x="105" y="178" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A">AlphaGo</text>
  <text x="105" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A">vs se stesso</text>
  <path d="M60 148 A 40 26 0 1 1 150 148" fill="none" stroke="#F4ECDD" stroke-width="1.5" marker-end="url(#ago-arrow)"/>
  <text x="105" y="248" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">self-play:</text>
  <text x="105" y="264" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">milioni di partite</text>
  <!-- arrow to stage 2 -->
  <line x1="167" y1="182" x2="243" y2="182" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ago-arrow)"/>
  <text x="205" y="172" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">allena</text>
  <!-- stage 2: networks -->
  <rect x="248" y="128" width="170" height="48" rx="8" fill="#5BA39C"/>
  <text x="333" y="149" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A">rete policy</text>
  <text x="333" y="166" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#DDB874">quali mosse (larghezza)</text>
  <rect x="248" y="190" width="170" height="48" rx="8" fill="#DDB874"/>
  <text x="333" y="211" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">rete value</text>
  <text x="333" y="228" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">chi vince (profondità)</text>
  <text x="333" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">reti neurali</text>
  <!-- arrows to tree -->
  <line x1="420" y1="152" x2="486" y2="150" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ago-arrow)"/>
  <line x1="420" y1="214" x2="486" y2="182" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ago-arrow)"/>
  <text x="452" y="238" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">guidano</text>
  <!-- stage 3: tree -->
  <circle cx="580" cy="95" r="12" fill="none" stroke="#F4ECDD" stroke-width="2"/>
  <line x1="571" y1="103" x2="530" y2="142" stroke="#34302A" stroke-width="1.5"/>
  <line x1="580" y1="107" x2="580" y2="142" stroke="#5BA39C" stroke-width="2.5"/>
  <line x1="589" y1="103" x2="630" y2="142" stroke="#5BA39C" stroke-width="2.5"/>
  <circle cx="530" cy="152" r="10" fill="none" stroke="#34302A" stroke-width="1.5"/>
  <circle cx="580" cy="152" r="10" fill="#5BA39C"/>
  <circle cx="630" cy="152" r="10" fill="#5BA39C"/>
  <line x1="580" y1="162" x2="560" y2="196" stroke="#5BA39C" stroke-width="2.5"/>
  <line x1="630" y1="162" x2="650" y2="196" stroke="#34302A" stroke-width="1.5"/>
  <rect x="532" y="200" width="56" height="26" rx="4" fill="none" stroke="#DDB874" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="560" y="217" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">v ≈ 0,7</text>
  <circle cx="650" cy="206" r="10" fill="none" stroke="#34302A" stroke-width="1.5"/>
  <text x="580" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">ricerca ad albero (MCTS)</text>
  <!-- il ritorno che chiude il giro: le partite giocate dalla ricerca tornano al self-play -->
  <path d="M580 272 L580 296 L25 296 L25 182 L41 182" fill="none" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ago-arrow)"/>
  <text x="350" y="288" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">la ricerca gioca meglio delle reti: le sue partite tornano ad allenarle</text>
  <text x="350" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">la policy taglia i rami inutili, la value valuta senza arrivare alla fine della partita</text>
  <text x="350" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">e le partite contro se stesso migliorano entrambe le reti</text>
</svg>
