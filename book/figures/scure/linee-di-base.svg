    .ax  { stroke:#34302A; stroke-width:2; fill:none; }
    .axc { stroke:#221F1A; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#F4ECDD; }
