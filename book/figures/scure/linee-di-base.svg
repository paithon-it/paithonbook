<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 452"
     role="img" aria-label="Un grafico a linee. A sinistra la serie osservata, 36 mesi che salgono lentamente con un'onda annuale che ha la punta a dicembre; una riga verticale segna l'ultimo mese osservato, un dicembre. A destra della riga, 15 mesi di previsione, con le quattro linee di base sovrapposte alla stessa scala: grigia e piatta a mezz'altezza la media di tutta la serie, ocra e piatta all'altezza dell'ultimo valore il naive, teal e ondulata il naive stagionale, che ricopia in avanti i mesi dell'ultimo anno osservato, e terracotta in salita il drift, che prolunga la retta fra il primo e l'ultimo punto. Un arco collega il marzo osservato, nove mesi prima dell'ultimo, al marzo previsto quindici mesi dopo: è il valore che il naive stagionale copia, e la ragione per cui oltre un ciclo intero si ricicla sempre l'ultimo anno osservato invece di un anno che non è ancora accaduto.">
  <style>
