    @keyframes ln3{0.00%{opacity:0}74.40%{opacity:0}80.00%{opacity:1}100.00%{opacity:1}}
    @keyframes lg0{0.00%{opacity:0}14.40%{opacity:0}20.00%{opacity:1}100.00%{opacity:1}}
    @keyframes lg1{0.00%{opacity:0}34.40%{opacity:0}40.00%{opacity:1}100.00%{opacity:1}}
    @keyframes lg2{0.00%{opacity:0}54.40%{opacity:0}60.00%{opacity:1}100.00%{opacity:1}}
    @keyframes lg3{0.00%{opacity:0}74.40%{opacity:0}80.00%{opacity:1}100.00%{opacity:1}}
    @keyframes tx0{0.00%{opacity:1}18.40%{opacity:1}20.00%{opacity:0}100.00%{opacity:0}}
    @keyframes tx1{0.00%{opacity:0}18.20%{opacity:0}20.00%{opacity:1}38.40%{opacity:1}40.00%{opacity:0}100.00%{opacity:0}}
    @keyframes tx2{0.00%{opacity:0}38.20%{opacity:0}40.00%{opacity:1}58.40%{opacity:1}60.00%{opacity:0}100.00%{opacity:0}}
