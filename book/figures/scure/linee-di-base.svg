  <line class="axc" x1="66" y1="290" x2="632" y2="290"/><line class="org" x1="462.2" y1="36" x2="462.2" y2="290"/><text class="lbs" x="448.2" y="28" text-anchor="end">osservato, fino a dicembre</text><text class="lbs" x="476.2" y="28">previsione, 15 mesi</text><polyline class="oss" points="66.0,201.9 77.3,203.6 88.6,218.5 100.0,249.4 111.3,269.2 122.6,263.2 133.9,250.9 145.2,227.9 156.6,221.0 167.9,197.4 179.2,164.0 190.5,157.5 201.8,153.1 213.2,170.9 224.5,198.6 235.8,219.4 247.1,211.7 258.4,236.7 269.8,232.2 281.1,216.5 292.4,183.0 303.7,158.4 315.0,143.7 326.4,133.4 337.7,134.4 349.0,144.9 360.3,161.4 371.6,187.6 383.0,216.3 394.3,201.1 405.6,208.9 416.9,181.1 428.2,166.7 439.6,131.3 450.9,118.8 462.2,103.2"/><polyline class="prev" stroke="#BCB3A1" points="473.5,189.9 484.8,189.9 496.2,189.9 507.5,189.9 518.8,189.9 530.1,189.9 541.4,189.9 552.8,189.9 564.1,189.9 575.4,189.9 586.7,189.9 598.0,189.9 609.4,189.9 620.7,189.9 632.0,189.9" style="animation:ln0 var(--d) infinite;opacity:1"/><polyline class="prev" stroke="#DDB874" points="473.5,103.2 484.8,103.2 496.2,103.2 507.5,103.2 518.8,103.2 530.1,103.2 541.4,103.2 552.8,103.2 564.1,103.2 575.4,103.2 586.7,103.2 598.0,103.2 609.4,103.2 620.7,103.2 632.0,103.2" style="animation:ln1 var(--d) infinite;opacity:1"/><polyline class="prev" stroke="#5BA39C" points="473.5,134.4 484.8,144.9 496.2,161.4 507.5,187.6 518.8,216.3 530.1,201.1 541.4,208.9 552.8,181.1 564.1,166.7 575.4,131.3 586.7,118.8 598.0,103.2 609.4,134.4 620.7,144.9 632.0,161.4" style="animation:ln2 var(--d) infinite;opacity:1"/><path class="arc" d="M 360.3 161.4 C 360.3 103.4 632.0 103.4 632.0 161.4" style="animation:arco var(--d) infinite;opacity:1"/><circle class="pun" cx="360.3" cy="161.4" r="4" style="animation:arco var(--d) infinite;opacity:1"/><text class="arl" x="360.3" y="95.4" text-anchor="middle" style="animation:arco var(--d) infinite;opacity:1">il marzo osservato</text><circle class="pun" cx="632.0" cy="161.4" r="4" style="animation:arco var(--d) infinite;opacity:1"/><text class="arl" x="632.0" y="95.4" text-anchor="end" style="animation:arco var(--d) infinite;opacity:1">il marzo previsto</text><polyline class="prev" stroke="#E27B52" points="473.5,100.3 484.8,97.5 496.2,94.7 507.5,91.9 518.8,89.1 530.1,86.2 541.4,83.4 552.8,80.6 564.1,77.8 575.4,74.9 586.7,72.1 598.0,69.3 609.4,66.5 620.7,63.7 632.0,60.8" style="animation:ln3 var(--d) infinite;opacity:1"/><line class="lgl" x1="66" y1="318" x2="92" y2="318" stroke="#BCB3A1" style="animation:lg0 var(--d) infinite;opacity:1"/><text class="lgt" x="100" y="322" style="animation:lg0 var(--d) infinite;opacity:1">la media di tutta la serie</text><line class="lgl" x1="366" y1="318" x2="392" y2="318" stroke="#DDB874" style="animation:lg1 var(--d) infinite;opacity:1"/><text class="lgt" x="400" y="322" style="animation:lg1 var(--d) infinite;opacity:1">l'ultimo valore, ripetuto</text><line class="lgl" x1="66" y1="342" x2="92" y2="342" stroke="#5BA39C" style="animation:lg2 var(--d) infinite;opacity:1"/><text class="lgt" x="100" y="346" style="animation:lg2 var(--d) infinite;opacity:1">l'ultimo anno osservato, ricopiato</text><line class="lgl" x1="366" y1="342" x2="392" y2="342" stroke="#E27B52" style="animation:lg3 var(--d) infinite;opacity:1"/><text class="lgt" x="400" y="346" style="animation:lg3 var(--d) infinite;opacity:1">la retta fra il primo e l'ultimo punto</text><text class="tit" x="66" y="396" style="animation:tx0 var(--d) infinite">la serie, e il punto da cui si guarda avanti</text><text class="rig" x="66" y="420" style="animation:tx0 var(--d) infinite">tre anni di mesi, l'ultimo osservato è un dicembre</text><text class="tit" x="66" y="396" style="animation:tx1 var(--d) infinite">la 1ª linea di base: la media di tutta la serie</text><text class="rig" x="66" y="420" style="animation:tx1 var(--d) infinite">non guarda né la salita né la stagione: sta ferma a mezz'altezza</text><text class="tit" x="66" y="396" style="animation:tx2 var(--d) infinite">la 2ª linea di base: l'ultimo valore, ripetuto</text><text class="rig" x="66" y="420" style="animation:tx2 var(--d) infinite">durissima da battere dove ogni scossa sposta il livello per sempre</text><text class="tit" x="66" y="396" style="animation:tx3 var(--d) infinite">la 3ª linea di base: l'ultimo anno osservato, ricopiato</text><text class="rig" x="66" y="420" style="animation:tx3 var(--d) infinite">il marzo fra 15 mesi lo prevede con il marzo di nove mesi fa, l'ultimo davvero visto</text><text class="tit" x="66" y="396" style="animation:tx4 var(--d) infinite;opacity:1">le quattro linee di base, tutte insieme</text><text class="rig" x="66" y="420" style="animation:tx4 var(--d) infinite;opacity:1">un modello che non le batte non serve: quello che sa fare lo fa già una riga di codice</text>
</svg>
