    .arc { fill:none; stroke:#5BA39C; stroke-width:1.5; stroke-dasharray:5 4;
            opacity:0; }
    .pun { fill:#5BA39C; opacity:0; }
    .arl { font-family:Inter, system-ui, sans-serif; font-size:12px; fill:#5BA39C; opacity:0; }
