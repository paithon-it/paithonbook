<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../knn-classificare-per-somiglianza.svg
-->
<svg viewBox="0 0 640 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un piano con punti di due classi già etichettati. Un punto nuovo, di classe ignota, è al centro di un cerchio che racchiude i suoi cinque vicini più prossimi: tre appartengono a una classe e due all'altra, e il punto nuovo riceve l'etichetta della maggioranza. Il più vicino di tutti, però, è uno dei due della minoranza, sicché con un vicino solo il verdetto sarebbe l'opposto.">
  <rect x="0" y="0" width="640" height="400" fill="#0E0C0A"/>
  <text x="320" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#F4ECDD" font-weight="bold">Il punto nuovo tra i suoi vicini (k = 5)</text>
  <!-- cerchio del vicinato -->
  <circle cx="330" cy="215" r="105" fill="none" stroke="#F4ECDD" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- classe A: terracotta -->
  <circle cx="150" cy="120" r="10" fill="#E27B52"/>
  <circle cx="185" cy="180" r="10" fill="#E27B52"/>
  <circle cx="130" cy="250" r="10" fill="#E27B52"/>
  <circle cx="215" cy="300" r="10" fill="#E27B52"/>
  <circle cx="265" cy="160" r="10" fill="#E27B52"/>
  <circle cx="290" cy="270" r="10" fill="#E27B52"/>
  <circle cx="255" cy="230" r="10" fill="#E27B52"/>
  <!-- classe B: teal -->
  <circle cx="500" cy="110" r="10" fill="#5BA39C"/>
  <circle cx="540" cy="190" r="10" fill="#5BA39C"/>
  <circle cx="470" cy="260" r="10" fill="#5BA39C"/>
  <circle cx="520" cy="320" r="10" fill="#5BA39C"/>
  <circle cx="352" cy="160" r="10" fill="#5BA39C"/>
  <circle cx="405" cy="265" r="10" fill="#5BA39C"/>
  <!-- linee verso i 5 vicini -->
  <line x1="330" y1="215" x2="265" y2="160" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="330" y1="215" x2="290" y2="270" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="330" y1="215" x2="255" y2="230" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="330" y1="215" x2="400" y2="170" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="330" y1="215" x2="405" y2="265" stroke="#F4ECDD" stroke-width="1.5"/>
  <!-- punto nuovo: ocra -->
  <circle cx="330" cy="215" r="13" fill="#DDB874" stroke="#F4ECDD" stroke-width="2"/>
  <text x="330" y="192" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" font-weight="bold">?</text>
  <!-- legenda -->
  <circle cx="120" cy="368" r="8" fill="#E27B52"/>
  <text x="136" y="373" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">classe A (3 voti)</text>
  <circle cx="290" cy="368" r="8" fill="#5BA39C"/>
  <text x="306" y="373" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">classe B (2 voti)</text>
  <circle cx="470" cy="368" r="8" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="486" y="373" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">punto nuovo → A</text>
</svg>
