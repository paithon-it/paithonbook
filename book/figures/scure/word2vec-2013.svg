<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../word2vec-2013.svg
-->
<svg viewBox="0 0 680 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagramma di aritmetica vettoriale: i vettori di uomo, re, donna, regina formano un parallelogramma, e re meno uomo più donna cade su regina">
  <rect x="0" y="0" width="680" height="400" fill="#0E0C0A"/>
  <text x="340" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#F4ECDD" font-weight="bold">re − uomo + donna ≈ regina</text>

  <!-- assi leggeri -->
  <line x1="80" y1="340" x2="620" y2="340" stroke="#34302A" stroke-width="1"/>
  <line x1="120" y1="70" x2="120" y2="360" stroke="#34302A" stroke-width="1"/>

  <!-- vettore "regalità": uomo -> re e donna -> regina (terracotta) -->
  <line x1="180" y1="300" x2="260" y2="150" stroke="#E27B52" stroke-width="2"/>
  <path d="M 260 150 L 251 162 L 265 165 Z" fill="#E27B52"/>
  <line x1="440" y1="300" x2="520" y2="150" stroke="#E27B52" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 520 150 L 511 162 L 525 165 Z" fill="#E27B52"/>

  <!-- vettore "genere": uomo -> donna e re -> regina (teal) -->
  <line x1="180" y1="300" x2="440" y2="300" stroke="#5BA39C" stroke-width="2"/>
  <path d="M 440 300 L 428 294 L 428 306 Z" fill="#5BA39C"/>
  <line x1="260" y1="150" x2="520" y2="150" stroke="#5BA39C" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 520 150 L 508 144 L 508 156 Z" fill="#5BA39C"/>

  <!-- punti -->
  <circle cx="180" cy="300" r="6" fill="#F4ECDD"/>
  <text x="180" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">uomo</text>
  <circle cx="260" cy="150" r="6" fill="#F4ECDD"/>
  <text x="248" y="140" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">re</text>
  <circle cx="440" cy="300" r="6" fill="#F4ECDD"/>
  <text x="440" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">donna</text>
  <circle cx="520" cy="150" r="7" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="540" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" font-weight="bold">regina</text>

  <!-- legenda -->
  <line x1="150" y1="372" x2="185" y2="372" stroke="#E27B52" stroke-width="2"/>
  <text x="193" y="376" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">direzione "regalità" (re − uomo)</text>
  <line x1="420" y1="372" x2="455" y2="372" stroke="#5BA39C" stroke-width="2"/>
  <text x="463" y="376" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">direzione "genere"</text>
</svg>
