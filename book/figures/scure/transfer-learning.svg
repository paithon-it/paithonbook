  <!-- arrow -->
  <line x1="492" y1="160" x2="530" y2="160" stroke="#F4ECDD" stroke-width="2"/>
  <path d="M530 160 L522 155 L522 165 Z" fill="#F4ECDD"/>
  <!-- new head -->
  <rect x="538" y="95" width="120" height="130" fill="#E27B52" opacity="0.15" stroke="#E27B52" stroke-width="2"/>
  <rect x="560" y="120" width="34" height="80" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
