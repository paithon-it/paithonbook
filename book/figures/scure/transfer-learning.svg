  <rect x="158" y="80" width="330" height="160" fill="#5BA39C" opacity="0.15" stroke="#5BA39C" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="180" y="110" width="52" height="100" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
