<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../chinchilla-2022.svg
-->
<svg viewBox="0 0 720 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Due allocazioni dello stesso budget di calcolo: Gopher con molti parametri e pochi token, Chinchilla con pochi parametri e molti token">
  <rect x="0" y="0" width="720" height="420" fill="#0E0C0A"/>
  <text x="360" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F4ECDD">Stesso budget di calcolo, due modi di spenderlo</text>
  <!-- baseline -->
  <line x1="50" y1="330" x2="670" y2="330" stroke="#F4ECDD" stroke-width="2"/>
  <!-- divider -->
  <line x1="360" y1="70" x2="360" y2="360" stroke="#34302A" stroke-width="1.5" stroke-dasharray="4 5"/>
  <!-- GOPHER panel -->
  <text x="205" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD">Gopher</text>
  <!-- params bar (tall) -->
  <rect x="120" y="120" width="64" height="210" fill="#E27B52"/>
  <text x="152" y="112" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">280 mld</text>
  <text x="152" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">parametri</text>
  <!-- tokens bar (short) -->
  <rect x="228" y="285" width="64" height="45" fill="#5BA39C"/>
  <text x="260" y="277" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">300 mld</text>
  <text x="260" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">token</text>
  <!-- CHINCHILLA panel -->
  <text x="515" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD">Chinchilla</text>
  <!-- params bar (short) -->
  <rect x="430" y="278" width="64" height="52" fill="#E27B52"/>
  <text x="462" y="270" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">70 mld</text>
  <text x="462" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">parametri</text>
  <!-- tokens bar (tall) -->
  <rect x="538" y="112" width="64" height="218" fill="#5BA39C"/>
  <text x="570" y="104" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">1400 mld</text>
  <text x="570" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">token</text>
  <!-- legend -->
  <rect x="205" y="384" width="16" height="16" fill="#E27B52"/>
  <text x="228" y="397" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">parametri (capacità)</text>
  <rect x="390" y="384" width="16" height="16" fill="#5BA39C"/>
  <text x="413" y="397" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">token (esperienza)</text>
</svg>
