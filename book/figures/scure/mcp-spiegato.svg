<svg viewBox="0 0 720 350" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architettura MCP: un host con il modello e due client collegati via protocollo a due server, che a loro volta espongono tool e resource verso file e database">
  <rect x="0" y="0" width="720" height="350" fill="#0E0C0A"/>
  <text x="360" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F4ECDD">MCP: host · client · server</text>
  <!-- host -->
  <rect x="38" y="66" width="238" height="222" rx="10" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="157" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#E27B52">Host (app AI)</text>
  <rect x="62" y="106" width="190" height="44" rx="6" fill="#E27B52"/>
  <text x="157" y="133" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A">Modello (LLM)</text>
  <rect x="62" y="166" width="190" height="40" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="1.5"/>
  <text x="157" y="191" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5BA39C">Client 1</text>
  <rect x="62" y="220" width="190" height="40" rx="6" fill="#0E0C0A" stroke="#5BA39C" stroke-width="1.5"/>
  <text x="157" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5BA39C">Client 2</text>
  <!-- server -->
  <rect x="415" y="150" width="176" height="60" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="503" y="174" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#5BA39C">Server A</text>
  <text x="503" y="194" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">tool · resource</text>
  <rect x="415" y="234" width="176" height="60" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="503" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#5BA39C">Server B</text>
  <text x="503" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">tool · prompt</text>
  <!-- target -->
  <rect x="628" y="158" width="72" height="44" rx="6" fill="#DDB874"/>
  <text x="664" y="184" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">File</text>
  <rect x="628" y="242" width="72" height="44" rx="6" fill="#DDB874"/>
  <text x="664" y="268" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">Database</text>
  <defs>
    <marker id="ar104" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F4ECDD"/>
    </marker>
  </defs>
  <line x1="253" y1="186" x2="413" y2="180" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ar104)"/>
  <line x1="253" y1="240" x2="413" y2="264" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ar104)"/>
  <line x1="591" y1="180" x2="626" y2="180" stroke="#F4ECDD" stroke-width="1.5" marker-end="url(#ar104)"/>
  <line x1="591" y1="264" x2="626" y2="264" stroke="#F4ECDD" stroke-width="1.5" marker-end="url(#ar104)"/>
  <text x="333" y="168" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#F4ECDD">protocollo MCP</text>
  <text x="333" y="272" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#F4ECDD">(JSON-RPC)</text>
  <text x="157" y="312" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic" fill="#F4ECDD">una porta sola, tante periferiche</text>
</svg>
