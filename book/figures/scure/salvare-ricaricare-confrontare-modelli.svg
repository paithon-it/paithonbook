<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../salvare-ricaricare-confrontare-modelli.svg
-->
<svg viewBox="0 0 760 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema del ciclo di serializzazione di un modello">
  <rect x="0" y="0" width="760" height="300" fill="#0E0C0A"/>
  <text x="380" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F4ECDD">Il ciclo di vita di un modello serializzato</text>
  <!-- modello in memoria -->
  <rect x="40" y="80" width="180" height="110" rx="8" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="130" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0E0C0A">Modello addestrato</text>
  <text x="130" y="136" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A">pipeline in memoria</text>
  <text x="130" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#DDB874">scaler + coefficienti</text>
  <!-- freccia dump -->
  <line x1="220" y1="120" x2="300" y2="120" stroke="#E27B52" stroke-width="2"/>
  <polygon points="300,120 288,113 288,127" fill="#E27B52"/>
  <text x="260" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E27B52">joblib.dump</text>
  <!-- file su disco -->
  <rect x="300" y="70" width="160" height="130" rx="8" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <rect x="300" y="70" width="160" height="28" rx="8" fill="#DDB874" stroke="#F4ECDD" stroke-width="2"/>
  <text x="380" y="89" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F4ECDD">disco</text>
  <text x="380" y="125" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#F4ECDD">modello.joblib</text>
  <text x="380" y="147" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#F4ECDD">modello.json</text>
  <text x="380" y="170" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52">bytes + metadati</text>
  <!-- freccia load -->
  <line x1="460" y1="120" x2="540" y2="120" stroke="#E27B52" stroke-width="2"/>
  <polygon points="540,120 528,113 528,127" fill="#E27B52"/>
  <text x="500" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E27B52">joblib.load</text>
  <!-- modello ricaricato -->
  <rect x="540" y="80" width="180" height="110" rx="8" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="630" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0E0C0A">Modello ricaricato</text>
  <text x="630" y="136" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A">identico all'originale</text>
  <text x="630" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#DDB874">pronto per predict()</text>
  <!-- barra tempo -->
  <rect x="40" y="230" width="330" height="34" rx="6" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="205" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0E0C0A">addestramento: minuti/ore (una volta sola)</text>
  <rect x="540" y="230" width="180" height="34" rx="6" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="630" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F4ECDD">ricaricamento: secondi</text>
</svg>
