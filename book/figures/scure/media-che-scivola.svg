<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330"
     role="img" aria-label="Animazione: cento punti sparsi attorno a un'onda sinusoidale tratteggiata. Una campana ocra scorre da sinistra a destra lungo l'asse orizzontale, e mentre avanza si traccia dietro di lei una curva terracotta, la media dei punti pesata dalla campana. La curva segue l'onda all'interno e se ne stacca ai due estremi, dove la campana ha punti da una parte sola: all'estremo sinistro resta sopra l'onda, all'estremo destro sotto.">
