<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../prompt-engineering-le-prove.svg
-->
<svg viewBox="0 0 720 496" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tecniche di prompting divise per cosa dicono le misure: quelle che reggono ovunque, quelle che reggono solo sui compiti di ragionamento, e quelle misurate con effetto nullo">
  <rect width="720" height="496" fill="#0E0C0A"/>
  <text x="30" y="250" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="middle" transform="rotate(-90 30 250)">cosa dicono le misure</text>
  <line x1="60" y1="430" x2="60" y2="65" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="52,77 68,77 60,62" fill="#F4ECDD"/>
  <rect x="90" y="60" width="600" height="124" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="106" y="86" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#5BA39C" font-weight="600">Misurato, e regge</text>
  <text x="106" y="106" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">vale su compiti diversi e su modelli diversi</text>
  <rect x="106" y="120" width="238" height="34" rx="17" fill="#0E0C0A" stroke="#5BA39C" stroke-width="1.5"/>
  <text x="225" y="142" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">esempi svolti (few-shot)</text>
  <text x="360" y="142" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#BCB3A1">in cima ci arriva poco: una sola tecnica</text>
  <rect x="90" y="196" width="600" height="124" rx="8" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text x="106" y="222" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#DDB874" font-weight="600">Misurato, ma solo dove</text>
  <text x="106" y="242" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">la catena vale +12 e +14 punti su matematica e simbolico; altrove quasi niente</text>
  <rect x="106" y="256" width="190" height="34" rx="17" fill="#0E0C0A" stroke="#DDB874" stroke-width="1.5"/>
  <text x="201" y="278" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">catena di pensiero</text>
  <rect x="312" y="256" width="176" height="34" rx="17" fill="#0E0C0A" stroke="#DDB874" stroke-width="1.5"/>
  <text x="400" y="278" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">self-consistency</text>
  <rect x="90" y="332" width="600" height="124" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="106" y="358" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#E27B52" font-weight="600">Misurato, effetto nullo</text>
  <text x="106" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">provate in studi controllati, non spostano niente</text>
  <rect x="106" y="392" width="172" height="34" rx="17" fill="#0E0C0A" stroke="#E27B52" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="192" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">mance e minacce</text>
  <rect x="294" y="392" width="116" height="34" rx="17" fill="#0E0C0A" stroke="#E27B52" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="352" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">cortesia</text>
  <text x="90" y="482" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#BCB3A1">In fondo non ci sono tecniche non verificate: ci sono tecniche verificate che non funzionano.</text>
</svg>
