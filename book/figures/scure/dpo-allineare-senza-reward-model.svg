<svg viewBox="0 0 760 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto tra la pipeline RLHF in tre passi e la pipeline DPO in un passo solo">
  <rect x="0" y="0" width="760" height="400" fill="#0E0C0A"/>
  <text x="380" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#F4ECDD">RLHF e DPO: gli stessi dati, con meno macchinari</text>
  <!-- RLHF row -->
  <text x="30" y="80" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5BA39C">RLHF</text>
  <rect x="30" y="95" width="170" height="60" rx="9" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="115" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#F4ECDD">Dati di preferenza</text>
  <text x="115" y="138" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">A preferita a B</text>
  <line x1="200" y1="125" x2="240" y2="125" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="240,120 250,125 240,130" fill="#F4ECDD"/>
  <rect x="252" y="95" width="170" height="60" rx="9" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text x="337" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#F4ECDD">Reward model</text>
  <text x="337" y="138" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">modello separato</text>
  <line x1="422" y1="125" x2="462" y2="125" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="462,120 472,125 462,130" fill="#F4ECDD"/>
  <rect x="474" y="95" width="170" height="60" rx="9" fill="#0E0C0A" stroke="#DDB874" stroke-width="2"/>
  <text x="559" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#F4ECDD">RL con PPO</text>
  <text x="559" y="138" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">genera, valuta, aggiorna</text>
  <line x1="644" y1="125" x2="684" y2="125" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="684,120 694,125 684,130" fill="#F4ECDD"/>
  <rect x="696" y="103" width="44" height="44" rx="9" fill="#5BA39C"/>
  <text x="718" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A">LLM</text>
  <text x="337" y="185" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">fino a 4 modelli in memoria · campionamento a ogni passo · training instabile</text>
  <!-- DPO row -->
  <text x="30" y="245" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#E27B52">DPO</text>
  <rect x="30" y="260" width="170" height="60" rx="9" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="115" y="285" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#F4ECDD">Dati di preferenza</text>
  <text x="115" y="303" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">gli stessi di sopra</text>
  <line x1="200" y1="290" x2="462" y2="290" stroke="#E27B52" stroke-width="2"/>
  <polygon points="462,285 472,290 462,295" fill="#E27B52"/>
  <text x="336" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52">una sola loss di classificazione</text>
  <rect x="474" y="260" width="170" height="60" rx="9" fill="#E27B52"/>
  <text x="559" y="285" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#0E0C0A">Training diretto</text>
  <text x="559" y="303" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#0E0C0A">reward implicito</text>
  <line x1="644" y1="290" x2="684" y2="290" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="684,285 694,290 684,295" fill="#F4ECDD"/>
  <rect x="696" y="268" width="44" height="44" rx="9" fill="#E27B52"/>
  <text x="718" y="295" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A">LLM</text>
  <text x="337" y="350" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#BCB3A1">2 modelli in memoria (policy + riferimento) · nessuna generazione durante il training</text>
  <text x="380" y="385" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">Le due tappe centrali dell'RLHF collassano in un'unica passata supervisionata.</text>
</svg>
