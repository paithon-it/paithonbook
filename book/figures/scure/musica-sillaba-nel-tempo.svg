<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-label="Due pannelli uno sopra l’altro. In alto, la prima riga di una strofa inventata come fila di otto sillabe in ordine, Sul, la, ri, va, del, la, not, te, senza nessun istante associato. In basso, la stessa riga distesa sull’asse del tempo da 0 a 8 secondi, su una griglia di note a varie altezze, con una sillaba su ogni nota. La sillaba ri cade su una nota lunga, in cui la vocale è tenuta; fra va e del c’è una pausa di un secondo e mezzo in cui non cade nessuna sillaba; l’ultima sillaba, te, occupa una nota di due secondi. Linee tratteggiate collegano ogni sillaba in alto all’inizio della sua nota e non si incrociano mai: l’ordine del testo resta quello della musica.">
