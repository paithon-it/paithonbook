<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto tra modello base e modello instruction-tuned sullo stesso prompt">
  <rect x="0" y="0" width="760" height="420" fill="#0E0C0A"/>
  <rect x="230" y="20" width="300" height="58" rx="8" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="380" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle" font-weight="bold">Prompt (identico)</text>
  <text x="380" y="64" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">«Scrivi una ricetta della carbonara»</text>
  <line x1="310" y1="78" x2="190" y2="130" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="450" y1="78" x2="570" y2="130" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="40" y="130" width="300" height="48" rx="8" fill="#DDB874" stroke="#F4ECDD" stroke-width="2"/>
  <text x="190" y="150" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle" font-weight="bold">Modello base</text>
  <text x="190" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">solo pre-training</text>
  <rect x="420" y="130" width="300" height="48" rx="8" fill="#5BA39C" stroke="#F4ECDD" stroke-width="2"/>
  <text x="570" y="150" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A" text-anchor="middle" font-weight="bold">Modello instruction-tuned</text>
  <text x="570" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A" text-anchor="middle">pre-training + SFT su istruzioni</text>
  <line x1="190" y1="178" x2="190" y2="210" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="570" y1="178" x2="570" y2="210" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="40" y="210" width="300" height="150" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="60" y="236" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">«Scrivi una ricetta dell'amatriciana.</text>
  <text x="60" y="256" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">Scrivi una ricetta della gricia.</text>
  <text x="60" y="276" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">Scrivi una ricetta della cacio e pepe.</text>
  <text x="60" y="296" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">Esercizio 4: descrivi il pesto…»</text>
  <text x="60" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52" font-weight="bold">Continua il pattern del testo</text>
  <rect x="420" y="210" width="300" height="150" rx="8" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
  <text x="440" y="236" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">«Ingredienti per 4 persone:</text>
  <text x="440" y="256" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">320 g di spaghetti, 150 g di guanciale,</text>
  <text x="440" y="276" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">4 tuorli, pecorino romano, pepe.</text>
  <text x="440" y="296" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">1. Rosolare il guanciale…»</text>
  <text x="440" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5BA39C" font-weight="bold">Esegue l'istruzione</text>
  <text x="380" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">Stessa conoscenza, comportamento diverso: cambia il formato appreso, non i fatti.</text>
</svg>
