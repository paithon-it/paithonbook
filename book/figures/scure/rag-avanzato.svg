<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../rag-avanzato.svg
-->
<svg viewBox="0 0 700 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline di RAG avanzato: la domanda viene riscritta, poi cercata in parallelo con ricerca densa e sparsa, i risultati vengono fusi in una lista di candidati, un reranker li riordina per precisione e solo i primi passano al modello linguistico">
  <rect x="0" y="0" width="700" height="380" fill="#0E0C0A"/>
  <!-- Domanda -->
  <rect x="20" y="150" width="100" height="60" rx="8" fill="none" stroke="#F4ECDD" stroke-width="2"/>
  <text x="70" y="178" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">domanda</text>
  <text x="70" y="196" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">utente</text>
  <line x1="120" y1="180" x2="158" y2="180" stroke="#F4ECDD" stroke-width="1.5"/>
  <path d="M158 180 l-9 -5 v10 z" fill="#F4ECDD"/>
  <!-- Query rewriting -->
  <rect x="160" y="150" width="112" height="60" rx="8" fill="none" stroke="#DDB874" stroke-width="2"/>
  <text x="216" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">query</text>
  <text x="216" y="194" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">rewriting</text>
  <!-- biforcazione -->
  <line x1="272" y1="180" x2="300" y2="118" stroke="#F4ECDD" stroke-width="1.5"/>
  <path d="M300 118 l0 -10 -8 5 z" fill="#F4ECDD"/>
  <line x1="272" y1="180" x2="300" y2="242" stroke="#F4ECDD" stroke-width="1.5"/>
  <path d="M300 242 l-8 -5 0 10 z" fill="#F4ECDD"/>
  <!-- Ricerca densa -->
  <rect x="302" y="88" width="122" height="55" rx="8" fill="none" stroke="#5BA39C" stroke-width="2"/>
  <text x="363" y="111" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5BA39C" text-anchor="middle">ricerca densa</text>
  <text x="363" y="129" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">(embedding)</text>
  <!-- Ricerca sparsa -->
  <rect x="302" y="217" width="122" height="55" rx="8" fill="none" stroke="#E27B52" stroke-width="2"/>
  <text x="363" y="240" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52" text-anchor="middle">ricerca sparsa</text>
  <text x="363" y="258" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">(BM25)</text>
  <!-- verso fusione -->
  <line x1="424" y1="115" x2="452" y2="165" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="424" y1="245" x2="452" y2="195" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="454" y="150" width="92" height="60" rx="8" fill="#DDB874"/>
  <text x="500" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle" font-weight="bold">fusione</text>
  <text x="500" y="194" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">~50 candidati</text>
  <!-- verso reranker -->
  <line x1="546" y1="180" x2="574" y2="180" stroke="#F4ECDD" stroke-width="1.5"/>
  <path d="M574 180 l-9 -5 v10 z" fill="#F4ECDD"/>
  <!-- Reranker -->
  <rect x="576" y="140" width="84" height="80" rx="8" fill="#5BA39C"/>
  <text x="618" y="172" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A" text-anchor="middle" font-weight="bold">reranker</text>
  <text x="618" y="192" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0E0C0A" text-anchor="middle">top 5</text>
  <!-- verso LLM -->
  <line x1="618" y1="220" x2="618" y2="288" stroke="#F4ECDD" stroke-width="1.5"/>
  <path d="M618 288 l-5 -9 h10 z" fill="#F4ECDD"/>
  <rect x="540" y="290" width="156" height="52" rx="8" fill="none" stroke="#F4ECDD" stroke-width="2"/>
  <text x="618" y="321" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">modello (LLM)</text>
  <text x="300" y="366" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">recupero generoso a monte → filtro severo a valle</text>
</svg>
