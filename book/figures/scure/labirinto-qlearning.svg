<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../labirinto-qlearning.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-label="Griglia 3 per 4 con partenza, meta, trappola, muro e frecce della politica appresa" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F4ECDD"/>
    </marker>
  </defs>

  <!-- Celle libere (cream) -->
  <rect x="60" y="40" width="90" height="90" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <rect x="150" y="40" width="90" height="90" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <rect x="240" y="40" width="90" height="90" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>

  <rect x="60" y="130" width="90" height="90" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <rect x="240" y="130" width="90" height="90" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>

  <rect x="150" y="220" width="90" height="90" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <rect x="240" y="220" width="90" height="90" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>
  <rect x="330" y="220" width="90" height="90" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2"/>

  <!-- Muro -->
  <rect x="150" y="130" width="90" height="90" fill="#34302A" stroke="#F4ECDD" stroke-width="2"/>
  <text x="195" y="180" text-anchor="middle" font-size="14" fill="#BCB3A1">muro</text>

  <!-- Meta (goal) -->
  <rect x="330" y="40" width="90" height="90" fill="#E27B52" stroke="#F4ECDD" stroke-width="2"/>
  <text x="375" y="80" text-anchor="middle" font-size="26" font-weight="700" fill="#0E0C0A">+1</text>
  <text x="375" y="105" text-anchor="middle" font-size="13" fill="#0E0C0A">meta</text>

  <!-- Trappola -->
  <rect x="330" y="130" width="90" height="90" fill="#DDB874" stroke="#F4ECDD" stroke-width="2"/>
  <text x="375" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#F4ECDD">−1</text>
  <text x="375" y="195" text-anchor="middle" font-size="13" fill="#F4ECDD">trappola</text>

  <!-- Partenza -->
  <rect x="60" y="220" width="90" height="90" fill="#0E0C0A" stroke="#5BA39C" stroke-width="4"/>
  <text x="74" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#5BA39C">S</text>

  <!-- Frecce della politica -->
  <!-- (0,0) destra -->
  <line x1="90" y1="85" x2="120" y2="85" stroke="#F4ECDD" stroke-width="3" marker-end="url(#punta)"/>
  <!-- (0,1) destra -->
  <line x1="180" y1="85" x2="210" y2="85" stroke="#F4ECDD" stroke-width="3" marker-end="url(#punta)"/>
  <!-- (0,2) destra verso meta -->
  <line x1="270" y1="85" x2="300" y2="85" stroke="#F4ECDD" stroke-width="3" marker-end="url(#punta)"/>
  <!-- (1,0) su -->
  <line x1="105" y1="190" x2="105" y2="160" stroke="#F4ECDD" stroke-width="3" marker-end="url(#punta)"/>
  <!-- (1,2) su -->
  <line x1="285" y1="190" x2="285" y2="160" stroke="#F4ECDD" stroke-width="3" marker-end="url(#punta)"/>
  <!-- (2,0) partenza: su -->
  <line x1="105" y1="290" x2="105" y2="260" stroke="#F4ECDD" stroke-width="3" marker-end="url(#punta)"/>
  <!-- (2,1) destra -->
  <line x1="180" y1="265" x2="210" y2="265" stroke="#F4ECDD" stroke-width="3" marker-end="url(#punta)"/>
  <!-- (2,2) su -->
  <line x1="285" y1="290" x2="285" y2="260" stroke="#F4ECDD" stroke-width="3" marker-end="url(#punta)"/>
  <!-- (2,3) sinistra, per evitare la trappola -->
  <line x1="390" y1="265" x2="360" y2="265" stroke="#F4ECDD" stroke-width="3" marker-end="url(#punta)"/>
</svg>