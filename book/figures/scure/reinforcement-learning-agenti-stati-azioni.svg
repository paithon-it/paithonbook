<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../reinforcement-learning-agenti-stati-azioni.svg
-->
<svg viewBox="0 0 680 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loop agente-ambiente: l'agente manda un'azione all'ambiente, l'ambiente restituisce nuovo stato e ricompensa, in ciclo continuo">
  <rect x="0" y="0" width="680" height="320" fill="#0E0C0A"/>
  <!-- agente -->
  <rect x="60" y="110" width="180" height="100" rx="10" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="150" y="152" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#0E0C0A" text-anchor="middle" font-weight="bold">AGENTE</text>
  <text x="150" y="180" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A" text-anchor="middle">sceglie l'azione (policy)</text>
  <!-- ambiente -->
  <rect x="440" y="110" width="180" height="100" rx="10" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="530" y="152" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#0E0C0A" text-anchor="middle" font-weight="bold">AMBIENTE</text>
  <text x="530" y="180" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0E0C0A" text-anchor="middle">reagisce e giudica</text>
  <!-- freccia azione (sopra) -->
  <path d="M 240 130 C 300 70 380 70 434 124" fill="none" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="440,128 426,124 432,114" fill="#F4ECDD"/>
  <text x="340" y="66" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#F4ECDD" text-anchor="middle" font-weight="bold">azione aₜ</text>
  <!-- freccia stato+reward (sotto) -->
  <path d="M 440 195 C 380 255 300 255 246 200" fill="none" stroke="#DDB874" stroke-width="2"/>
  <polygon points="240,194 254,197 248,208 " fill="#DDB874"/>
  <text x="340" y="278 " font-family="Inter, system-ui, sans-serif" font-size="15" fill="#F4ECDD" text-anchor="middle" font-weight="bold">nuovo stato sₜ₊₁ + ricompensa rₜ₊₁</text>
  <!-- ciclo -->
  <text x="340" y="165" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">il ciclo si ripete</text>
  <text x="340" y="183" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">migliaia di volte</text>
</svg>
