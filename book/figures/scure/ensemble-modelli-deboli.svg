    <text x="208" y="76" text-anchor="middle" font-size="11" fill="#F4ECDD">debole</text>
    <text x="208" y="90" text-anchor="middle" font-size="10" fill="#BCB3A1">&#8776;57%</text>
    <rect x="288" y="52" width="104" height="46" rx="8" fill="none" stroke="#DDB874" stroke-width="1.5"/>
    <text x="340" y="76" text-anchor="middle" font-size="11" fill="#F4ECDD">debole</text>
    <text x="340" y="90" text-anchor="middle" font-size="10" fill="#BCB3A1">&#8776;54%</text>
    <rect x="420" y="52" width="104" height="46" rx="8" fill="none" stroke="#5BA39C" stroke-width="1.5"/>
    <text x="472" y="76" text-anchor="middle" font-size="11" fill="#F4ECDD">debole</text>
    <text x="472" y="90" text-anchor="middle" font-size="10" fill="#BCB3A1">&#8776;56%</text>
    <rect x="552" y="52" width="104" height="46" rx="8" fill="none" stroke="#E27B52" stroke-width="1.5"/>
    <text x="604" y="76" text-anchor="middle" font-size="11" fill="#F4ECDD">debole</text>
    <text x="604" y="90" text-anchor="middle" font-size="10" fill="#BCB3A1">&#8776;55%</text>
  </g>
  <line x1="76" y1="100" x2="330" y2="176" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="208" y1="100" x2="335" y2="176" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="340" y1="100" x2="340" y2="176" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="472" y1="100" x2="345" y2="176" stroke="#F4ECDD" stroke-width="1.5"/>
  <line x1="604" y1="100" x2="350" y2="176" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="238" y="180" width="204" height="48" rx="24" fill="#F4ECDD"/>
  <text x="340" y="209" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#0E0C0A">voto aggregato</text>
  <line x1="340" y1="228" x2="340" y2="262" stroke="#F4ECDD" stroke-width="1.5"/>
