<svg viewBox="0 0 680 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cinque riquadri affiancati, ciascuno etichettato &#171;debole&#187; con la propria accuratezza fra il 54 e il 57 per cento; da ognuno parte una linea verso un ovale &#171;voto aggregato&#187;. Sotto, tre barre a confronto: un modello solo, circa 55 per cento; questi cinque messi a votare, circa 60; centosessanta modelli come loro, circa 90.">
  <rect x="0" y="0" width="680" height="430" fill="#0E0C0A"/>
  <text x="340" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD">tanti voti appena migliori del caso &#8594; una decisione forte</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="24" y="52" width="104" height="46" rx="8" fill="none" stroke="#E27B52" stroke-width="1.5"/>
