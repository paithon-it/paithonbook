<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../traduzione-automatica-da-regole-a-llm.svg
-->
<svg viewBox="0 0 760 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline dei quattro paradigmi della traduzione automatica: regole, statistica, neurale, LLM">
  <rect x="0" y="0" width="760" height="340" fill="#0E0C0A"/>
  <text x="380" y="34" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#F4ECDD" text-anchor="middle" font-weight="bold">Quattro paradigmi in settant'anni</text>
  <!-- asse timeline -->
  <line x1="40" y1="250" x2="720" y2="250" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="720,250 710,245 710,255" fill="#F4ECDD"/>
  <!-- tacche e anni -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">
    <line x1="80" y1="245" x2="80" y2="255" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="80" y="275" text-anchor="middle">1954</text>
    <line x1="250" y1="245" x2="250" y2="255" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="250" y="275" text-anchor="middle">~1990</text>
    <line x1="430" y1="245" x2="430" y2="255" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="430" y="275" text-anchor="middle">2014-16</text>
    <line x1="600" y1="245" x2="600" y2="255" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="600" y="275" text-anchor="middle">~2020</text>
  </g>
  <!-- blocco 1: regole -->
  <rect x="55" y="70" width="160" height="130" fill="#0E0C0A" stroke="#F4ECDD" stroke-width="2" rx="8"/>
  <rect x="55" y="70" width="160" height="34" fill="#F4ECDD" rx="8"/>
  <text x="135" y="92" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#0E0C0A" text-anchor="middle">Regole</text>
  <text x="135" y="128" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" text-anchor="middle">dizionari + grammatiche</text>
  <text x="135" y="146" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" text-anchor="middle">scritte a mano</text>
  <text x="135" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">sa la grammatica,</text>
  <text x="135" y="188" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">non il contesto</text>
  <line x1="135" y1="200" x2="135" y2="244" stroke="#F4ECDD" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- blocco 2: statistica -->
  <rect x="228" y="70" width="160" height="130" fill="#0E0C0A" stroke="#DDB874" stroke-width="2" rx="8"/>
  <rect x="228" y="70" width="160" height="34" fill="#DDB874" rx="8"/>
  <text x="308" y="92" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" text-anchor="middle">Statistica</text>
  <text x="308" y="128" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" text-anchor="middle">probabilità contate</text>
  <text x="308" y="146" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" text-anchor="middle">sui corpora paralleli</text>
  <text x="308" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">frasi a pezzetti,</text>
  <text x="308" y="188" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">mai la frase intera</text>
  <line x1="308" y1="200" x2="308" y2="244" stroke="#DDB874" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- blocco 3: neurale -->
  <rect x="401" y="70" width="160" height="130" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2" rx="8"/>
  <rect x="401" y="70" width="160" height="34" fill="#5BA39C" rx="8"/>
  <text x="481" y="92" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#0E0C0A" text-anchor="middle">Neurale</text>
  <text x="481" y="128" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" text-anchor="middle">seq2seq + attention,</text>
  <text x="481" y="146" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" text-anchor="middle">poi transformer</text>
  <text x="481" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">legge tutta la frase,</text>
  <text x="481" y="188" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">impara end-to-end</text>
  <line x1="481" y1="200" x2="481" y2="244" stroke="#5BA39C" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- blocco 4: LLM -->
  <rect x="574" y="70" width="160" height="130" fill="#0E0C0A" stroke="#E27B52" stroke-width="2" rx="8"/>
  <rect x="574" y="70" width="160" height="34" fill="#E27B52" rx="8"/>
  <text x="654" y="92" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#0E0C0A" text-anchor="middle">LLM</text>
  <text x="654" y="128" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" text-anchor="middle">tradurre è un caso</text>
  <text x="654" y="146" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#F4ECDD" text-anchor="middle">particolare di generare</text>
  <text x="654" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">contesto, tono,</text>
  <text x="654" y="188" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1" text-anchor="middle">istruzioni in prompt</text>
  <line x1="654" y1="200" x2="654" y2="244" stroke="#E27B52" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- domanda di fondo -->
  <text x="380" y="315" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#BCB3A1" text-anchor="middle" font-style="italic">La stessa domanda, quattro risposte: che cosa deve sapere una macchina per tradurre?</text>
</svg>
