<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../attention-prima-dei-transformer.svg
-->
<svg viewBox="0 0 800 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Allineamento di traduzione appreso dall'attention: le parole italiane generate si collegano alle parole inglesi di origine con linee di spessore proporzionale al peso, incrociandosi dove l'ordine cambia">
  <rect x="0" y="0" width="800" height="340" fill="#0E0C0A"/>
  <text x="400" y="32" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F4ECDD" text-anchor="middle">L'allineamento che il modello impara da solo</text>
  <!-- source (english) row -->
  <text x="70" y="85" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">originale</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">
    <rect x="150" y="60" width="110" height="38" rx="4" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
    <text x="205" y="84" fill="#F4ECDD">the</text>
    <rect x="290" y="60" width="110" height="38" rx="4" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
    <text x="345" y="84" fill="#F4ECDD">black</text>
    <rect x="430" y="60" width="110" height="38" rx="4" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
    <text x="485" y="84" fill="#F4ECDD">cat</text>
    <rect x="570" y="60" width="110" height="38" rx="4" fill="#0E0C0A" stroke="#5BA39C" stroke-width="2"/>
    <text x="625" y="84" fill="#F4ECDD">sleeps</text>
  </g>
  <!-- attention lines: strong terracotta, weak ocra -->
  <g fill="none">
    <!-- il -> the (strong) -->
    <line x1="205" y1="98" x2="205" y2="240" stroke="#E27B52" stroke-width="4"/>
    <!-- gatto -> cat (strong, crossing) -->
    <line x1="485" y1="98" x2="345" y2="240" stroke="#E27B52" stroke-width="4"/>
    <!-- gatto -> black (weak) -->
    <line x1="345" y1="98" x2="345" y2="240" stroke="#DDB874" stroke-width="1.5"/>
    <!-- nero -> black (strong, crossing) -->
    <line x1="345" y1="98" x2="485" y2="240" stroke="#E27B52" stroke-width="4"/>
    <!-- nero -> cat (weak) -->
    <line x1="485" y1="98" x2="485" y2="240" stroke="#DDB874" stroke-width="1.5"/>
    <!-- dorme -> sleeps (strong) -->
    <line x1="625" y1="98" x2="625" y2="240" stroke="#E27B52" stroke-width="4"/>
  </g>
  <!-- target (italian) row -->
  <text x="70" y="265" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">traduzione</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">
    <rect x="150" y="240" width="110" height="38" rx="4" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="205" y="264" fill="#0E0C0A">il</text>
    <rect x="290" y="240" width="110" height="38" rx="4" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="345" y="264" fill="#0E0C0A">gatto</text>
    <rect x="430" y="240" width="110" height="38" rx="4" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="485" y="264" fill="#0E0C0A">nero</text>
    <rect x="570" y="240" width="110" height="38" rx="4" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
    <text x="625" y="264" fill="#0E0C0A">dorme</text>
  </g>
  <!-- legend -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12">
    <line x1="150" y1="312" x2="190" y2="312" stroke="#E27B52" stroke-width="4"/>
    <text x="198" y="316" fill="#F4ECDD">peso di attention alto</text>
    <line x1="390" y1="312" x2="430" y2="312" stroke="#DDB874" stroke-width="1.5"/>
    <text x="438" y="316" fill="#F4ECDD">peso basso</text>
  </g>
</svg>
