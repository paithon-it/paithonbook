<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../float16-precisione-stabilita-numerica.svg
-->
<svg viewBox="0 0 760 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Griglia dei bit di float32, float16 e bfloat16">
  <rect x="0" y="0" width="760" height="300" fill="#0E0C0A"/>
  <!-- legenda -->
  <rect x="40" y="20" width="14" height="14" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="62" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">segno</text>
  <rect x="130" y="20" width="14" height="14" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="152" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">esponente (portata)</text>
  <rect x="310" y="20" width="14" height="14" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="332" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD">mantissa (precisione)</text>
  <!-- float32: 1+8+23, scala 21px/bit -->
  <text x="40" y="78" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" font-weight="bold">float32</text>
  <rect x="40" y="88" width="21" height="30" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="61" y="88" width="168" height="30" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="229" y="88" width="483" height="30" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="145" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A" text-anchor="middle">8 bit</text>
  <text x="470" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">23 bit</text>
  <!-- float16: 1+5+10 -->
  <text x="40" y="158" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" font-weight="bold">float16</text>
  <rect x="40" y="168" width="21" height="30" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="61" y="168" width="105" height="30" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="166" y="168" width="210" height="30" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="113" y="188" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A" text-anchor="middle">5 bit</text>
  <text x="271" y="188" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">10 bit</text>
  <text x="392" y="188" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">← portata ridotta: max ~65 504</text>
  <!-- bfloat16: 1+8+7 -->
  <text x="40" y="238" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F4ECDD" font-weight="bold">bfloat16</text>
  <rect x="40" y="248" width="21" height="30" fill="#E27B52" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="61" y="248" width="168" height="30" fill="#5BA39C" stroke="#F4ECDD" stroke-width="1.5"/>
  <rect x="229" y="248" width="147" height="30" fill="#DDB874" stroke="#F4ECDD" stroke-width="1.5"/>
  <text x="145" y="268" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A" text-anchor="middle">8 bit</text>
  <text x="302" y="268" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">7 bit</text>
  <text x="392" y="268" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD">← stessa portata di float32, grana grossa</text>
</svg>
