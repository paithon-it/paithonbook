    .etf    { font-family:Inter, system-ui, sans-serif; font-size:14px; font-weight:700; fill:#E27B52; }
    #scorre-r { transform-box:fill-box; transform-origin:0% 50%; }
        @keyframes scorre{0.00%{transform:scaleX(0)}6.00%{transform:scaleX(0)}90.00%{transform:scaleX(1)}100.00%{transform:scaleX(1)}}
