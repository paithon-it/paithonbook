  <rect x="688" y="140" width="60" height="44" rx="8" fill="#DDB874" fill-opacity="0.22" stroke="#DDB874" stroke-width="2.5"/>
  <text x="718" y="167" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#F4ECDD">specifico</text>
