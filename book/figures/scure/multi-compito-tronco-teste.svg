  <path d="M 444 228 L 486 228" fill="none" stroke="#DDB874" stroke-width="2" stroke-dasharray="4 3" marker-start="url(#fr-mc-o)" marker-end="url(#fr-mc-o)"/>
  <text x="465" y="266" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#DDB874">penalità</text>

  <path d="M 410 283 L 410 252" fill="none" stroke="#F4ECDD" stroke-width="2" marker-end="url(#fr-mc)"/>
  <path d="M 520 283 L 520 252" fill="none" stroke="#F4ECDD" stroke-width="2" marker-end="url(#fr-mc)"/>
  <rect x="380" y="285" width="60" height="30" rx="6" fill="none" stroke="#BCB3A1" stroke-width="1.5"/>
  <text x="410" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#BCB3A1">ingresso</text>
  <rect x="490" y="285" width="60" height="30" rx="6" fill="none" stroke="#BCB3A1" stroke-width="1.5"/>
  <text x="520" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#BCB3A1">ingresso</text>

  <text x="465" y="352" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#BCB3A1">Niente è condiviso per forza: una penalità</text>
  <text x="465" y="368" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#BCB3A1">impedisce alle due di allontanarsi.</text>

