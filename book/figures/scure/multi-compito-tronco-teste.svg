  <path d="M 165 283 L 165 252" fill="none" stroke="#F4ECDD" stroke-width="2" marker-end="url(#fr-mc)"/>
  <rect x="125" y="285" width="80" height="30" rx="6" fill="none" stroke="#BCB3A1" stroke-width="1.5"/>
  <text x="165" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#BCB3A1">ingresso</text>

  <text x="165" y="352" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#BCB3A1">Il lavoro si fa una volta sola, e ogni</text>
  <text x="165" y="368" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#BCB3A1">testa lo traduce nella sua risposta.</text>

