<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../toolformer-2023.svg
-->
<svg viewBox="0 0 760 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di Toolformer: mentre genera testo il modello raggiunge un punto di decisione, sceglie di chiamare un tool esterno, ne inserisce il risultato e prosegue la frase">
  <rect x="0" y="0" width="760" height="430" fill="#0E0C0A"/>
  <!-- flusso di testo in ingresso -->
  <rect x="30" y="60" width="200" height="50" fill="none" stroke="#F4ECDD" stroke-width="2"/>
  <text x="130" y="82" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">"...400 su 1400,</text>
  <text x="130" y="99" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">cioè il ..."</text>
  <line x1="230" y1="85" x2="290" y2="85" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="290,85 280,80 280,90" fill="#F4ECDD"/>
  <!-- decisione -->
  <polygon points="360,45 425,85 360,125 295,85" fill="#DDB874" fill-opacity="0.18" stroke="#DDB874" stroke-width="2"/>
  <text x="360" y="82" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">chiamo</text>
  <text x="360" y="98" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">un tool?</text>
  <!-- ramo NO -->
  <line x1="360" y1="125" x2="360" y2="175" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="360,175 355,165 365,165" fill="#F4ECDD"/>
  <text x="378" y="152" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1">no: continua a scrivere</text>
  <rect x="270" y="175" width="180" height="40" fill="none" stroke="#F4ECDD" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1" text-anchor="middle">genera la parola successiva</text>
  <!-- ramo SI -->
  <line x1="425" y1="85" x2="500" y2="85" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="500,85 490,80 490,90" fill="#F4ECDD"/>
  <text x="462" y="76" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E27B52" text-anchor="middle">sì</text>
  <!-- chiamata API -->
  <rect x="500" y="60" width="230" height="50" fill="#5BA39C" fill-opacity="0.12" stroke="#5BA39C" stroke-width="2"/>
  <text x="615" y="90" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#F4ECDD" text-anchor="middle">[Calculator(400/1400)</text>
  <!-- tool esterno -->
  <line x1="615" y1="110" x2="615" y2="160" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="615,160 610,150 620,150" fill="#F4ECDD"/>
  <rect x="540" y="160" width="150" height="46" fill="#E27B52" fill-opacity="0.12" stroke="#E27B52" stroke-width="2"/>
  <text x="615" y="180" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">strumento esterno</text>
  <text x="615" y="197" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">esegue: → 0.29</text>
  <!-- risultato reinserito nel testo -->
  <line x1="615" y1="206" x2="615" y2="250" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="615,250 610,240 620,240" fill="#F4ECDD"/>
  <rect x="120" y="300" width="520" height="60" fill="#DDB874" fill-opacity="0.15" stroke="#DDB874" stroke-width="2"/>
  <text x="380" y="326" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">"...400 su 1400, cioè il [Calculator(400/1400) → 0.29] 29%."</text>
  <text x="380" y="347" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#BCB3A1" text-anchor="middle">il risultato rientra nella frase e la generazione riprende</text>
  <line x1="615" y1="250" x2="615" y2="300" stroke="#F4ECDD" stroke-width="0"/>
  <path d="M 615 250 C 615 275, 500 285, 420 300" fill="none" stroke="#F4ECDD" stroke-width="1.5"/>
</svg>
