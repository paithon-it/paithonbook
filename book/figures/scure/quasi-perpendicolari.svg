<!--
  Paithon Book, figura animata: il coseno fra due direzioni a caso, al crescere delle dimensioni
  Generata da animazioni/svg/quasi-perpendicolari.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356"
     role="img" aria-label="Tre istogrammi affiancati, con la stessa scala verticale da zero a cento per cento, mostrano come si distribuisce il coseno fra due direzioni sorteggiate a caso. A sinistra, in tre dimensioni, le venti fasce sono tutte alte uguali, un tappeto piatto al cinque per cento: ogni angolo è ugualmente probabile, e il coseno medio vale zero virgola cinquanta. Al centro, in cento dimensioni, le fasce calano da sinistra a destra e dopo la sesta non ce n'è quasi più nessuna: il coseno medio vale zero virgola zero otto. A destra, in mille dimensioni, resta un picco solo appoggiato allo zero, alto quasi il novanta per cento, e il coseno medio vale zero virgola zero tre. Sotto ogni istogramma, la quota di coppie con coseno sotto un decimo: dieci per cento in tre dimensioni, sessantotto in cento, novantanove virgola otto in mille.">
