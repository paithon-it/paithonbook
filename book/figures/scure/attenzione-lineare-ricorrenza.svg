<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../attenzione-lineare-ricorrenza.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Inter', -apple-system, Segoe UI, sans-serif" role="img" aria-label="Confronto tra l'attenzione classica, la cui cache di chiavi e valori cresce a ogni token, e l'attenzione lineare, che riassume tutto il passato in uno stato di dimensione fissa aggiornato token per token con la somma dell'outer product del valore per la chiave.">
  <defs>
    <marker id="alr-terra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E27B52"/>
    </marker>
    <marker id="alr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8E8676"/>
    </marker>
  </defs>

  <!-- divisore centrale -->
  <line x1="390" y1="60" x2="390" y2="392" stroke="#8E8676" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>

  <!-- ===================== PANNELLO SINISTRO: KV cache ===================== -->
  <text x="196" y="40" font-size="17" text-anchor="middle" fill="#F4ECDD" font-weight="700">Attenzione classica</text>
  <text x="196" y="60" font-size="13" text-anchor="middle" fill="#BCB3A1">la cache K/V cresce con la lunghezza</text>

  <!-- 4 passi con pila crescente di coppie (k,v) -->
  <!-- passo 1 -->
  <g>
    <rect x="60" y="300" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="88" y="300" width="26" height="16" rx="2" fill="#5BA39C"/>
    <text x="87" y="336" font-size="12" text-anchor="middle" fill="#F4ECDD">t=1</text>
  </g>
  <!-- passo 2 -->
  <g>
    <rect x="130" y="282" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="158" y="282" width="26" height="16" rx="2" fill="#5BA39C"/>
    <rect x="130" y="300" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="158" y="300" width="26" height="16" rx="2" fill="#5BA39C"/>
    <text x="157" y="336" font-size="12" text-anchor="middle" fill="#F4ECDD">t=2</text>
  </g>
  <!-- passo 3 -->
  <g>
    <rect x="200" y="264" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="228" y="264" width="26" height="16" rx="2" fill="#5BA39C"/>
    <rect x="200" y="282" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="228" y="282" width="26" height="16" rx="2" fill="#5BA39C"/>
    <rect x="200" y="300" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="228" y="300" width="26" height="16" rx="2" fill="#5BA39C"/>
    <text x="227" y="336" font-size="12" text-anchor="middle" fill="#F4ECDD">t=3</text>
  </g>
  <!-- passo 4 -->
  <g>
    <rect x="270" y="246" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="298" y="246" width="26" height="16" rx="2" fill="#5BA39C"/>
    <rect x="270" y="264" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="298" y="264" width="26" height="16" rx="2" fill="#5BA39C"/>
    <rect x="270" y="282" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="298" y="282" width="26" height="16" rx="2" fill="#5BA39C"/>
    <rect x="270" y="300" width="26" height="16" rx="2" fill="#DDB874"/>
    <rect x="298" y="300" width="26" height="16" rx="2" fill="#5BA39C"/>
    <text x="297" y="336" font-size="12" text-anchor="middle" fill="#F4ECDD">t=4</text>
  </g>

  <!-- asse tempo sinistra -->
  <line x1="52" y1="356" x2="336" y2="356" stroke="#8E8676" stroke-width="1.5" marker-end="url(#alr-muted)"/>
  <text x="344" y="360" font-size="12" font-style="italic" fill="#8E8676">tempo</text>
  <!-- nota crescita -->
  <text x="196" y="384" font-size="12.5" text-anchor="middle" fill="#E27B52" font-weight="600">memoria &#8733; lunghezza della sequenza</text>

  <!-- ===================== PANNELLO DESTRO: stato fisso ===================== -->
  <text x="584" y="40" font-size="17" text-anchor="middle" fill="#F4ECDD" font-weight="700">Attenzione lineare</text>
  <text x="584" y="60" font-size="13" text-anchor="middle" fill="#BCB3A1">un solo stato S di dimensione fissa</text>

  <!-- 4 stati S della STESSA dimensione, collegati -->
  <!-- riuso una funzione a mano: box 44x44 con griglia 2x2 -->
  <!-- S1 -->
  <g>
    <rect x="452" y="270" width="44" height="44" rx="4" fill="#0E0C0A" stroke="#E27B52" stroke-width="2.5"/>
    <line x1="474" y1="270" x2="474" y2="314" stroke="#E27B52" stroke-width="1" opacity="0.55"/>
    <line x1="452" y1="292" x2="496" y2="292" stroke="#E27B52" stroke-width="1" opacity="0.55"/>
    <text x="474" y="335" font-size="12" text-anchor="middle" fill="#F4ECDD">t=1</text>
  </g>
  <!-- freccia + update -->
  <line x1="500" y1="292" x2="524" y2="292" stroke="#E27B52" stroke-width="2.5" marker-end="url(#alr-terra)"/>
  <!-- S2 -->
  <g>
    <rect x="528" y="270" width="44" height="44" rx="4" fill="#0E0C0A" stroke="#E27B52" stroke-width="2.5"/>
    <line x1="550" y1="270" x2="550" y2="314" stroke="#E27B52" stroke-width="1" opacity="0.55"/>
    <line x1="528" y1="292" x2="572" y2="292" stroke="#E27B52" stroke-width="1" opacity="0.55"/>
    <text x="550" y="335" font-size="12" text-anchor="middle" fill="#F4ECDD">t=2</text>
  </g>
  <line x1="576" y1="292" x2="600" y2="292" stroke="#E27B52" stroke-width="2.5" marker-end="url(#alr-terra)"/>
  <!-- S3 -->
  <g>
    <rect x="604" y="270" width="44" height="44" rx="4" fill="#0E0C0A" stroke="#E27B52" stroke-width="2.5"/>
    <line x1="626" y1="270" x2="626" y2="314" stroke="#E27B52" stroke-width="1" opacity="0.55"/>
    <line x1="604" y1="292" x2="648" y2="292" stroke="#E27B52" stroke-width="1" opacity="0.55"/>
    <text x="626" y="335" font-size="12" text-anchor="middle" fill="#F4ECDD">t=3</text>
  </g>
  <line x1="652" y1="292" x2="676" y2="292" stroke="#E27B52" stroke-width="2.5" marker-end="url(#alr-terra)"/>
  <!-- S4 -->
  <g>
    <rect x="680" y="270" width="44" height="44" rx="4" fill="#0E0C0A" stroke="#E27B52" stroke-width="2.5"/>
    <line x1="702" y1="270" x2="702" y2="314" stroke="#E27B52" stroke-width="1" opacity="0.55"/>
    <line x1="680" y1="292" x2="724" y2="292" stroke="#E27B52" stroke-width="1" opacity="0.55"/>
    <text x="702" y="335" font-size="12" text-anchor="middle" fill="#F4ECDD">t=4</text>
  </g>

  <!-- etichetta della regola di aggiornamento -->
  <text x="584" y="230" font-size="12.5" text-anchor="middle" fill="#BCB3A1">aggiornamento (rango 1)</text>
  <text x="584" y="252" font-size="16" text-anchor="middle" fill="#5BA39C" font-weight="700">S &#8592; S + v k<tspan font-size="11" dy="-7">&#8868;</tspan></text>

  <text x="584" y="384" font-size="12.5" text-anchor="middle" fill="#5BA39C" font-weight="600">memoria costante a ogni token</text>

  <!-- ===================== LEGENDA ===================== -->
  <rect x="250" y="404" width="15" height="11" rx="2" fill="#DDB874"/>
  <text x="270" y="413" font-size="12" fill="#BCB3A1">chiave k</text>
  <rect x="330" y="404" width="15" height="11" rx="2" fill="#5BA39C"/>
  <text x="350" y="413" font-size="12" fill="#BCB3A1">valore v</text>
  <rect x="410" y="403" width="13" height="13" rx="2" fill="#0E0C0A" stroke="#E27B52" stroke-width="2"/>
  <text x="428" y="413" font-size="12" fill="#BCB3A1">stato S (matrice d&#215;d)</text>
</svg>
