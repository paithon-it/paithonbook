<svg viewBox="0 0 760 516" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Due volte lo stesso grafo, prima e dopo il trucco della riparametrizzazione. In tutti e due i pannelli la catena scende dal dato x all’encoder di parametri phi, alle sue uscite mu e sigma che dicono dove sta la zona e quanto è larga, alla causa nascosta z, al decoder di parametri theta e infine al costo; una corsia di frecce scende, ed è l’andata, e una corsia accanto risale, ed è la correzione. Nel pannello di sinistra, senza il trucco, z è disegnata con il bordo tratteggiato perché viene pescata dalla zona: la corsia che risale parte dal costo, attraversa il decoder e si ferma davanti a z contro un segno di divieto, perché z è uscita a caso. Nel pannello di destra, con il trucco, z è scritta come mu più sigma per epsilon, ed epsilon arriva da un riquadro esterno: è lo scarto, deciso prima, e di phi non sa niente. Lì la corsia che risale non incontra più nessun ostacolo e arriva fino all’encoder. In fondo, la legenda delle due corsie: l’andata e il ritorno, cioè la correzione.">
