="lbs" x="368.0" y="270.0" text-anchor="middle">0,100</text><rect class="bozza" x="488.0" y="293.6" width="10" height="36.4"/><rect class="acc" x="444.0" y="298.8" width="40" height="31.2" style="--k:1.1667;animation:sgonfia var(--d) infinite;transform-box:fill-box;transform-origin:50% 100%"/><rect class="tgt" x="444.0" y="298.8" width="40" height="31.2"/><text class="lbl" x="471.0" y="352" text-anchor="middle">quel</text><text class="lbs" x="464.0" y="290.8" text-anchor="middle">0,060</text><rect class="bozza" x="584.0" y="314.4" width="10" height="15.6"/><rect class="acc" x="540.0" y="314.4" width="40" height="15.6" style="--k:1.0000;animation:sgonfia var(--d) infinite;transform-box:fill-box;transform-origin:50% 100%"/><rect class="ric" x="540.0" y="309.2" width="40" height="5.2" style="animation:riempie var(--d) infinite;transform-box:fill-box;transform-origin:50% 100%"/><rect class="tgt" x="540.0" y="309.2" width="40" height="20.8"/><text class="lbl" x="567.0" y="352" text-anchor="middle">molto</text><text class="lbs" x="560.0" y="301.2" text-anchor="middle">0,040</text><line class="asse" x1="50" y1="330" x2="606" y2="330"/><rect class="acc" x="60" y="375" width="13" height="13"/><text class="lbs" x="80" y="386">accettata dalla bozza: min(pᵇ, pᵗ)</text><rect class="ric" x="360" y="375" width="13" height="13"/><text class="lbs" x="380" y="386">ricampionata dal residuo, se scartata</text><rect class="bozza" x="60" y="397" width="13" height="13"/><text class="lbs" x="80" y="408">la bozza pᵇ</text><rect class="tgt" x="360" y="397" width="13" height="13"/><text class="lbs" x="380" y="408">il modello grande pᵗ</text><text class="lbs" x="60" y="438">sopra le barre: frequenze in 200 mila sorteggi con la regola (la bozza passa 79 volte su 100)</text>
</svg>
