<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 456"
     role="img" aria-label="Sei parole, ciascuna con una barra. Parte dalla probabilità della bozza; si accorcia alla parte che il modello grande condivide, quella accettata; poi le si aggiunge sopra la parte ricampionata dal residuo. Alla fine ogni barra è alta esattamente quanto la probabilità del modello grande, e le frequenze di 200 mila sorteggi fatti con la regola lo confermano.">
  <style>
    svg  { --d: 9.0s; }
    .ax  { stroke:#34302A; stroke-width:2; fill:none; }
    .axc { stroke:#221F1A; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#F4ECDD; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#BCB3A1; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#F4ECDD; }
    .acc { fill:#5BA39C; }
    .ric { fill:#E27B52; }
    .bozza { fill:#DDB874; opacity:.8; }
    .tgt { fill:none; stroke:#F4ECDD; stroke-width:1.5; }
    .asse { stroke:#34302A; stroke-width:2; }
        @keyframes sgonfia{0.00%{transform:scaleY(var(--k))}18.33%{transform:scaleY(var(--k))}33.33%{transform:scaleY(1)}100.00%{transform:scaleY(1)}}
    @keyframes riempie{0.00%{transform:scaleY(0)}51.67%{transform:scaleY(0)}66.67%{transform:scaleY(1)}100.00%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce) { .acc, .ric { animation:none !important; } }
  </style>
