<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../actor-critic.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img"
     aria-label="Ciclo attore-critico: dentro il riquadro Agente ci sono l'Attore e il Critico; il Critico invia all'Attore il vantaggio; l'Attore invia un'azione all'Ambiente, che restituisce all'Agente lo stato successivo e la ricompensa.">
  <defs>
    <marker id="ar-terra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E27B52"/>
    </marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5BA39C"/>
    </marker>
    <marker id="ar-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F4ECDD"/>
    </marker>
  </defs>
  <style>
    .box   { fill:none; stroke:#F4ECDD; stroke-width:2.5; }
    .env   { fill:none; stroke:#DDB874; stroke-width:3; }
    .ttl   { font-family:Inter, system-ui, sans-serif; font-weight:700; fill:#F4ECDD; }
    .in    { font-family:Inter, system-ui, sans-serif; fill:#0E0C0A; }
    .lbl   { font-family:Inter, system-ui, sans-serif; font-weight:600; }
    .sm    { font-family:Inter, system-ui, sans-serif; font-size:11px; fill:#BCB3A1; }
  </style>

  <text class="ttl" x="150" y="70" text-anchor="middle" font-size="15">Agente</text>
  <rect class="box" x="50" y="80" width="200" height="150" rx="12"/>

  <rect x="80" y="100" width="140" height="45" rx="8" fill="#E27B52"/>
  <text class="in" x="150" y="127" text-anchor="middle" font-size="15">Attore  &#960;(a|s)</text>

  <rect x="80" y="170" width="140" height="45" rx="8" fill="#5BA39C"/>
  <text class="in" x="150" y="197" text-anchor="middle" font-size="15">Critico  V(s)</text>

  <line x1="120" y1="168" x2="120" y2="149" stroke="#F4ECDD" stroke-width="2" marker-end="url(#ar-dark)"/>
  <text class="sm" x="133" y="162">vantaggio</text>

  <rect class="env" x="370" y="105" width="150" height="95" rx="12"/>
  <text class="ttl" x="445" y="158" text-anchor="middle" font-size="17">Ambiente</text>

  <path d="M250,120 C300,102 330,105 366,124" fill="none" stroke="#E27B52" stroke-width="2.5" marker-end="url(#ar-terra)"/>
  <text class="lbl" x="308" y="96" text-anchor="middle" font-size="13" fill="#E27B52">azione a<tspan baseline-shift="sub" font-size="9">t</tspan></text>

  <path d="M368,182 C330,202 300,199 254,192" fill="none" stroke="#5BA39C" stroke-width="2.5" marker-end="url(#ar-teal)"/>
  <text class="lbl" x="320" y="246" text-anchor="middle" font-size="12" fill="#5BA39C">stato s<tspan baseline-shift="sub" font-size="9">t+1</tspan> &#183; ricompensa r<tspan baseline-shift="sub" font-size="9">t</tspan></text>
</svg>