<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Un albero di harness numerati nell'ordine di nascita, colorati dal chiaro (voto basso) allo scuro (voto alto). Dalla radice, il nodo 0, nascono l'1, il più scuro, il 4 e il 2, il più chiaro. L'1 porta al 3 e al 6, il ramo su cui resta chi riparte sempre dal migliore; dal 4 nascono il 9 e un figlio barrato, scartato perché non funziona. Dal 2 nascono il 5 e poi il 7, e dal 7 il 10 e l'8, il più scuro di tutti. La discendenza 0, 2, 5, 7, 8 è in terracotta.">

