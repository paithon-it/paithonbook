<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../autoencoder-comprimere-per-capire.svg
-->
<svg viewBox="0 0 720 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema a clessidra di un autoencoder: encoder, spazio latente, decoder">
  <rect x="0" y="0" width="720" height="380" fill="#0E0C0A"/>
  <!-- encoder trapezoid -->
  <polygon points="80,60 300,140 300,240 80,320" fill="#5BA39C" stroke="#F4ECDD" stroke-width="2"/>
  <text x="175" y="185" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#0E0C0A" text-anchor="middle" font-weight="bold">Encoder</text>
  <text x="175" y="207" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A" text-anchor="middle">comprime</text>
  <!-- latent bottleneck -->
  <rect x="320" y="140" width="80" height="100" fill="#DDB874" stroke="#F4ECDD" stroke-width="2" rx="8"/>
  <text x="360" y="180" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F4ECDD" text-anchor="middle">z</text>
  <text x="360" y="200" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">spazio</text>
  <text x="360" y="214" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">latente</text>
  <!-- decoder trapezoid -->
  <polygon points="420,140 640,60 640,320 420,240" fill="#E27B52" stroke="#F4ECDD" stroke-width="2"/>
  <text x="545" y="185" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#0E0C0A" text-anchor="middle" font-weight="bold">Decoder</text>
  <text x="545" y="207" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0E0C0A" text-anchor="middle">ricostruisce</text>
  <!-- input / output labels -->
  <rect x="20" y="130" width="44" height="120" fill="none" stroke="#F4ECDD" stroke-width="1.5" rx="4"/>
  <text x="42" y="200" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">x</text>
  <text x="42" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">input</text>
  <rect x="656" y="130" width="44" height="120" fill="none" stroke="#F4ECDD" stroke-width="1.5" rx="4"/>
  <text x="678" y="200" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD" text-anchor="middle">x̂</text>
  <text x="678" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">output</text>
  <!-- arrows -->
  <line x1="300" y1="190" x2="316" y2="190" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="320,190 310,185 310,195" fill="#F4ECDD"/>
  <line x1="400" y1="190" x2="416" y2="190" stroke="#F4ECDD" stroke-width="1.5"/>
  <polygon points="420,190 410,185 410,195" fill="#F4ECDD"/>
  <!-- dimension annotations -->
  <text x="175" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">784 → 128 → 32 dimensioni</text>
  <text x="360" y="130" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">bottleneck</text>
  <text x="545" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F4ECDD" text-anchor="middle">32 → 128 → 784 dimensioni</text>
  <!-- loss annotation -->
  <text x="360" y="40" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E27B52" text-anchor="middle">loss = distanza tra x e x̂</text>
</svg>
