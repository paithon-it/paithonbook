<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-label="Tre righe di quattro fotogrammi, ciascuno una griglia di tre per tre token. In ogni riga un token del terzo fotogramma, in alto a sinistra, è in terracotta. Riga A1, strato spaziale: sono in teal i token dello stesso fotogramma. Riga A2, strato temporale: sono in ocra i token nello stesso posto negli altri fotogrammi. Riga B, attenzione piena: sono in teal tutti i token di tutti i fotogrammi. Un riquadro tratteggiato segna il token al centro del secondo fotogramma: nei due strati fattorizzati il token in terracotta non lo guarda direttamente, con l’attenzione piena sì.">
