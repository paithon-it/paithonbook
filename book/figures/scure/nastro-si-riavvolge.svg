<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 436"
     role="img" aria-label="Il grafo del conto y uguale a x al quadrato più due x, con x che vale 3. A sinistra il riquadro di x, da cui partono due frecce verso due stazioni: quella in alto moltiplica x per x, quella in basso moltiplica x per 2; le due si ritrovano nel riquadro di y a destra. All'andata lungo le frecce compaiono i valori 3 e 3, poi 9 e 6, e y vale 15; sotto ciascuna stazione compare un appunto tratteggiato, 3 per il quadrato e 2 per il ramo lineare. Al ritorno le frecce si percorrono al contrario partendo da 1 dal fondo, e ogni appunto lascia il posto al proprio conto: uno per due per tre uguale sei nel ramo del quadrato, uno per due uguale due in quello lineare. In basso a sinistra il contatore x.grad si riempie in due tempi, prima 6 e poi 6 più 2 uguale 8. Una riga in fondo ricorda che gli appunti dell'andata li consuma il ritorno, e che per riavvolgere una seconda volta bisogna rifare l'andata oppure chiedere prima che restino.">
