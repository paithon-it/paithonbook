to, prima di farlo: x comanda in due punti</text><text class="ttl" x="350" y="34" text-anchor="middle" opacity="0" style="animation:m1 var(--d) infinite">andata: x entra nei due rami</text><text class="ttl" x="350" y="34" text-anchor="middle" opacity="0" style="animation:m2 var(--d) infinite">andata: i rami si ritrovano, e y vale 15</text><text class="ttl" x="350" y="34" text-anchor="middle" opacity="0" style="animation:m3 var(--d) infinite">ritorno: si riparte dalla fine, dove la derivata vale 1</text><text class="ttl" x="350" y="34" text-anchor="middle" opacity="0" style="animation:m4 var(--d) infinite">ritorno: ogni stazione rilegge il proprio appunto e lo consuma</text><text class="ttl" x="350" y="34" text-anchor="middle" opacity="0" style="animation:m5 var(--d) infinite">il ramo del quadrato deposita 6</text><text class="ttl" x="350" y="34" text-anchor="middle" opacity="0" style="animation:m6 var(--d) infinite">il ramo lineare deposita 2, e si somma al primo</text><text class="ttl" x="350" y="34" text-anchor="middle" opacity="1" style="animation:m7 var(--d) infinite">x.grad vale 8: un contributo per ramo, sommati</text><text class="lbs" x="26" y="404">gli appunti dell'andata li consuma il ritorno: per riavvolgere una seconda volta</text><text class="lbs" x="26" y="424">bisogna rifare l'andata, oppure chiedere prima che restino</text>
