<!--
  GENERATO da scripts/genera-figure-scure.py: non modificare a mano.
  La prossima rigenerazione cancella qualunque cosa venga scritta
  qui dentro. La palette e' quella del blocco [data-theme=dark]
  di book/_static/brand/tokens.css.
  fonte: ../docker-per-data-scientist.svg
-->
<svg viewBox="0 0 760 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rapporto tra immagine Docker, container e volume">
  <rect x="0" y="0" width="760" height="340" fill="#0E0C0A"/>
  <text x="380" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F4ECDD">Immagine, container e volume</text>
  <!-- immagine -->
  <rect x="40" y="70" width="180" height="150" rx="8" fill="#5BA39C" stroke="#F4ECDD" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0E0C0A">IMMAGINE</text>
  <text x="130" y="122" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0E0C0A">ricetta congelata</text>
  <text x="130" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#DDB874">Python 3.12</text>
  <text x="130" y="164" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#DDB874">scikit-learn</text>
  <text x="130" y="182" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#DDB874">il tuo codice</text>
  <text x="130" y="205" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0E0C0A">immutabile</text>
  <!-- freccia docker run -->
  <line x1="220" y1="145" x2="310" y2="145" stroke="#E27B52" stroke-width="2"/>
  <polygon points="310,145 298,138 298,152" fill="#E27B52"/>
  <text x="265" y="132" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#E27B52">docker run</text>
  <!-- container -->
  <rect x="310" y="70" width="180" height="150" rx="8" fill="#0E0C0A" stroke="#E27B52" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="400" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F4ECDD">CONTAINER</text>
  <text x="400" y="122" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">ricetta in esecuzione</text>
  <text x="400" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">processo isolato e vivo</text>
  <text x="400" y="172" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52">usa e getta:</text>
  <text x="400" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E27B52">allo stop, sparisce tutto</text>
  <!-- freccia volume bidirezionale -->
  <line x1="400" y1="220" x2="400" y2="265" stroke="#F4ECDD" stroke-width="2"/>
  <polygon points="400,265 393,253 407,253" fill="#F4ECDD"/>
  <polygon points="400,220 393,232 407,232" fill="#F4ECDD"/>
  <text x="500" y="248" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">-v cartella:/app/dati</text>
  <!-- volume -->
  <rect x="290" y="270" width="220" height="50" rx="8" fill="#DDB874" stroke="#F4ECDD" stroke-width="2"/>
  <text x="400" y="292" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F4ECDD">VOLUME</text>
  <text x="400" y="310" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4ECDD">cartella del tuo PC: i dati sopravvivono</text>
  <!-- copie multiple container -->
  <rect x="560" y="90" width="150" height="40" rx="6" fill="#0E0C0A" stroke="#E27B52" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="635" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">altro container</text>
  <rect x="560" y="140" width="150" height="40" rx="6" fill="#0E0C0A" stroke="#E27B52" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="635" y="165" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#BCB3A1">altro container</text>
  <text x="635" y="205" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5BA39C">1 immagine → N container</text>
</svg>
