<svg viewBox="0 0 700 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gerarchia di classi: Dataset in cima con il contratto dei due metodi, tre sottoclassi che lo rispettano leggendo immagini, CSV e audio, e in basso il DataLoader che chiama sempre gli stessi due metodi">
  <rect x="0" y="0" width="700" height="400" fill="#F8F5EE"/>
  <!-- classe base -->
  <rect x="235" y="28" width="230" height="86" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="235" y="28" width="230" height="30" fill="#B5532C"/>
  <text x="350" y="48" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE" text-anchor="middle">Dataset</text>
  <text x="350" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">__len__()</text>
  <text x="350" y="100" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#2D5A5C" text-anchor="middle">__getitem__()</text>
  <!-- linee di ereditarieta -->
  <line x1="350" y1="114" x2="350" y2="150" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="150" x2="580" y2="150" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="150" x2="120" y2="188" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="350" y1="150" x2="350" y2="188" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="580" y1="150" x2="580" y2="188" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="120,188 114,178 126,178" fill="#1A1A1A"/>
  <polygon points="350,188 344,178 356,178" fill="#1A1A1A"/>
  <polygon points="580,188 574,178 586,178" fill="#1A1A1A"/>
  <!-- sottoclassi -->
  <rect x="30" y="188" width="180" height="80" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="30" y="188" width="180" height="28" fill="#2D5A5C"/>
  <text x="120" y="207" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE" text-anchor="middle">DatasetImmagini</text>
  <text x="120" y="236" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#B5532C" text-anchor="middle">apre un file .jpg</text>
  <text x="120" y="256" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#8B847C" text-anchor="middle">stessi due metodi</text>
  <rect x="260" y="188" width="180" height="80" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="260" y="188" width="180" height="28" fill="#2D5A5C"/>
  <text x="350" y="207" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE" text-anchor="middle">DatasetCSV</text>
  <text x="350" y="236" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#B5532C" text-anchor="middle">legge una riga</text>
  <text x="350" y="256" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#8B847C" text-anchor="middle">stessi due metodi</text>
  <rect x="490" y="188" width="180" height="80" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="490" y="188" width="180" height="28" fill="#2D5A5C"/>
  <text x="580" y="207" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE" text-anchor="middle">DatasetAudio</text>
  <text x="580" y="236" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#B5532C" text-anchor="middle">apre un file .wav</text>
  <text x="580" y="256" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#8B847C" text-anchor="middle">stessi due metodi</text>
  <!-- polimorfismo -->
  <rect x="130" y="316" width="440" height="52" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="350" y="338" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle">DataLoader(dati, batch_size=32)</text>
  <text x="350" y="358" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="middle">chiede sempre le stesse due cose, e non sa che cosa ha davanti</text>
  <line x1="120" y1="268" x2="210" y2="316" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="350" y1="268" x2="350" y2="316" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="580" y1="268" x2="490" y2="316" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="5 4"/>
</svg>
