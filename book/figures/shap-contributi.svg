<?xml version="1.0" encoding="UTF-8"?>
<!--
  paithon book - figura: grafico a cascata (waterfall) dei valori SHAP.
  Scompone UNA predizione. A sinistra il valore base E[f(x)] = 0,20; poi barre
  orizzontali impilate che aggiungono (verso destra, terracotta) o sottraggono
  (verso sinistra, teal) il contributo di ciascuna feature, fino all'output
  f(x) = 0,44 a destra. Etichette delle feature a sinistra in warm-black.
  Palette-locked, fondo trasparente.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"
     aria-label="Grafico a cascata che scompone una singola predizione. Si parte da un valore base E[f(x)] pari a 0,20, segnato da una linea verticale tratteggiata ocra a sinistra. Da lì, quattro barre orizzontali si impilano una sopra l'altra: 'storia = buona' aggiunge +0,18 verso destra in terracotta, 'reddito = alto' aggiunge +0,10 verso destra, 'eta = 40' aggiunge +0,04 verso destra, mentre 'debito = alto' sottrae 0,08 tornando verso sinistra in teal. La somma dei contributi porta all'output f(x) pari a 0,44, segnato da una seconda linea verticale tratteggiata ocra a destra.">
  <style>
    .titolo { font-family:'Fraunces', Georgia, serif; font-size:19px; fill:#1A1A1A; text-anchor:middle; }
    .barpos { fill:#B5532C; }
    .barneg { fill:#2D5A5C; }
    .ref    { stroke:#C9A961; stroke-width:2; stroke-dasharray:6 5; }
    .conn   { stroke:#C9A961; stroke-width:1.4; stroke-dasharray:3 3; }
    .flabel { font-family:Inter, system-ui, sans-serif; font-size:15px; font-weight:600; fill:#1A1A1A; text-anchor:end; }
    .vpos   { font-family:Inter, system-ui, sans-serif; font-size:13px; font-weight:600; fill:#B5532C; }
    .vneg   { font-family:Inter, system-ui, sans-serif; font-size:13px; font-weight:600; fill:#2D5A5C; text-anchor:end; }
    .base   { font-family:Inter, system-ui, sans-serif; font-size:14px; font-weight:600; fill:#1A1A1A; text-anchor:middle; }
    .outp   { font-family:Inter, system-ui, sans-serif; font-size:14px; font-weight:600; fill:#1A1A1A; text-anchor:middle; }
  </style>

  <text class="titolo" x="360" y="34">Scomposizione di una predizione (valori SHAP)</text>

  <!-- linee di riferimento: valore base (sinistra) e output (destra) -->
  <line class="ref" x1="240" y1="112" x2="240" y2="378"/>
  <line class="ref" x1="528" y1="112" x2="528" y2="378"/>
  <text class="outp" x="528" y="104">f(x) = 0,44</text>
  <text class="base" x="240" y="398">E[f(x)] = 0,20</text>

  <!-- connettori a scalino tra le barre adiacenti -->
  <line class="conn" x1="456" y1="295" x2="456" y2="313"/>
  <line class="conn" x1="576" y1="243" x2="576" y2="261"/>
  <line class="conn" x1="624" y1="191" x2="624" y2="209"/>

  <!-- debito = alto: -0,08 (teal, verso sinistra: da 624 a 528) -->
  <rect class="barneg" x="528" y="157" width="96" height="34" rx="2"/>
  <text class="flabel" x="222" y="179">debito = alto</text>
  <text class="vneg"   x="522" y="178">-0,08</text>

  <!-- eta = 40: +0,04 (terracotta, verso destra: da 576 a 624) -->
  <rect class="barpos" x="576" y="209" width="48" height="34" rx="2"/>
  <text class="flabel" x="222" y="231">eta = 40</text>
  <text class="vpos"   x="632" y="230">+0,04</text>

  <!-- reddito = alto: +0,10 (terracotta, verso destra: da 456 a 576) -->
  <rect class="barpos" x="456" y="261" width="120" height="34" rx="2"/>
  <text class="flabel" x="222" y="283">reddito = alto</text>
  <text class="vpos"   x="584" y="282">+0,10</text>

  <!-- storia = buona: +0,18 (terracotta, verso destra: da 240 a 456) -->
  <rect class="barpos" x="240" y="313" width="216" height="34" rx="2"/>
  <text class="flabel" x="222" y="335">storia = buona</text>
  <text class="vpos"   x="464" y="334">+0,18</text>

</svg>
