<svg viewBox="0 0 720 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema annotato di un blocco transformer">
  <rect x="0" y="0" width="720" height="460" fill="#F8F5EE"/>
  <text x="360" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Un blocco transformer, annotato</text>
  <!-- flusso centrale -->
  <line x1="360" y1="430" x2="360" y2="52" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="354,58 366,58 360,46" fill="#1A1A1A"/>
  <!-- input label -->
  <text x="360" y="450" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">embedding in ingresso (token + posizione)</text>
  <!-- LayerNorm 1 -->
  <rect x="290" y="368" width="140" height="34" fill="#F8F5EE" stroke="#C9A961" stroke-width="2" rx="6"/>
  <text x="360" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">layer norm</text>
  <!-- Attention -->
  <rect x="260" y="296" width="200" height="46" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5" rx="6"/>
  <text x="360" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F8F5EE">multi-head attention</text>
  <!-- residual 1 -->
  <path d="M 360 412 L 200 412 L 200 264 L 344 264" fill="none" stroke="#2D5A5C" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="360" cy="264" r="13" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="360" y="269" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#2D5A5C">+</text>
  <text x="192" y="336" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2D5A5C">connessione residua:</text>
  <text x="192" y="352" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2D5A5C">l'input scavalca il blocco</text>
  <!-- LayerNorm 2 -->
  <rect x="290" y="200" width="140" height="34" fill="#F8F5EE" stroke="#C9A961" stroke-width="2" rx="6"/>
  <text x="360" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">layer norm</text>
  <!-- FFN -->
  <rect x="260" y="128" width="200" height="46" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5" rx="6"/>
  <text x="360" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F8F5EE">feed-forward</text>
  <!-- residual 2 -->
  <path d="M 360 246 L 200 246 L 200 96 L 344 96" fill="none" stroke="#2D5A5C" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="360" cy="96" r="13" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="360" y="101" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#2D5A5C">+</text>
  <!-- annotations right -->
  <text x="480" y="315" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C">i token si scambiano</text>
  <text x="480" y="331" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C">informazioni tra loro</text>
  <text x="480" y="146" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2D5A5C">ogni token viene elaborato</text>
  <text x="480" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2D5A5C">da solo (~2/3 dei parametri)</text>
  <text x="480" y="385" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#C9A961">riporta i valori</text>
  <text x="480" y="401" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#C9A961">su scala standard</text>
  <!-- ripetizione -->
  <rect x="240" y="72" width="240" height="356" fill="none" stroke="#8B847C" stroke-width="1.5" stroke-dasharray="3 5" rx="10"/>
  <text x="360" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8B847C">questo blocco si ripete L volte (32, 64, 100+)</text>
</svg>
