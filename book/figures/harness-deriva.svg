<!--
  Paithon Book, figura animata: la deriva del codice con la pulizia continua e con quella a ondate
  Generata da animazioni/svg/harness-deriva.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430"
