    .lin-o { fill:none; stroke:#C9A961; stroke-width:3; stroke-linejoin:round; }
    .lin-v { fill:none; stroke:#2D5A5C; stroke-width:3; stroke-linejoin:round; }
    .fin-v { fill:#2D5A5C; font-weight:700; }
    .fin-o { fill:#5A524A; font-weight:700; }
    .med { fill:#B5532C; }
