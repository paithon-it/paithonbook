<!--
  Paithon Book, figura animata: la somma cumulata si accumula dopo un cambio di regime
  Generata da animazioni/svg/somma-che-si-accumula.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370"
     role="img" aria-label="Animazione in due fasce sovrapposte. In alto, un giorno dopo l'altro compaiono puntini teal che oscillano attorno a una linea, e dopo una linea verticale segnata qui cambia si spostano appena verso l'alto; in basso, una spezzata terracotta traccia la somma cumulata, che prima del cambio sale e ricade restando sotto una linea tratteggiata, la soglia, e dopo il cambio, tornata a zero un'ultima volta, sale fino a oltrepassarla, dove compare un segno di allarme.">
  <style>
    svg  { --d: 8.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .asse    { stroke:#C5BEAA; stroke-width:1.2; }
    .soglia  { stroke:#1A1A1A; stroke-width:1.4; stroke-dasharray:6 5; }
    .cambio  { stroke:#5A524A; stroke-width:1.2; stroke-dasharray:2 4; }
    .dato    { fill:#2D5A5C; opacity:.8; }
    .somma   { fill:none; stroke:#B5532C; stroke-width:2.6; stroke-linejoin:round; }
    .allarme { fill:#C9A961; stroke:#1A1A1A; stroke-width:1.2; }
    .all     { font-family:Inter, system-ui, sans-serif; font-size:14px; font-weight:700; fill:#1A1A1A; }
    #avanza-r { transform-box:fill-box; transform-origin:0% 50%; }
        @keyframes accendi{0.00%{opacity:0}80.97%{opacity:0}81.47%{opacity:1}100.00%{opacity:1}}
    @keyframes avanza{0.00%{transform:scaleX(0)}8.00%{transform:scaleX(0)}88.00%{transform:scaleX(1)}100.00%{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce) { #avanza-r, .acceso { animation:none !important; } }
