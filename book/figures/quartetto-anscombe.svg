<?xml version="1.0" encoding="UTF-8"?>
<!--
  paithon book - figura: il quartetto di Anscombe (1973). Quattro insiemi di
  dati con statistiche riassuntive quasi identiche (stessa media, varianza,
  correlazione e stessa retta di regressione y = 3 + 0.5x) ma forme
  completamente diverse. Solo il grafico rivela la differenza.
  Palette-locked: punti terracotta, retta warm-black, assi neutri warm.
  Fondo trasparente (leggibile in light e dark).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img"
     aria-label="Quattro grafici a dispersione del quartetto di Anscombe: stessa retta di regressione ma nubi di punti molto diverse (una lineare, una curva, una lineare con un valore anomalo, una con i punti allineati verticalmente piu un punto isolato).">
  <style>
    .axis { stroke:#8B847C; stroke-width:1.4; }
    .reg  { stroke:#1A1A1A; stroke-width:2.2; }
    .pt   { fill:#B5532C; stroke:#F8F5EE; stroke-width:1; }
    .ptag { font-family:Fraunces, Georgia, serif; font-size:18px; font-weight:700; fill:#2D5A5C; }
    .cap  { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5E5852; text-anchor:middle; }
    .capb { fill:#1A1A1A; font-weight:700; }
  </style>

