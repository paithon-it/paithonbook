<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     role="img" aria-label="Due riquadri affiancati, ciascuno un piano dei codici con sedici codici disposti in due gruppi. A sinistra, «senza l’alone», i codici sono punti isolati e i due gruppi sono lontani, con un largo vuoto in mezzo; un segnalino cammina in linea retta da un codice del gruppo di sinistra a uno del gruppo di destra e attraversa quel vuoto. A destra, «con l’alone», i gruppi sono più vicini e ogni codice occupa un alone che si sovrappone a quelli dei vicini, cosicché il segnalino percorre un cammino altrettanto dritto senza mai uscire davvero allo scoperto. Sotto ogni riquadro un profilo misura quanto il punto in cui si trova il segnalino sia terra già battuta: a sinistra la curva crolla a zero a metà strada, a destra scende appena e non tocca mai il fondo.">
