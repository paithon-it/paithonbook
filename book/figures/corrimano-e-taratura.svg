<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paithon Book, figura animata: post-LN e pre-LN: dove sta la taratura, e che cosa incontra chi scende
  Generata da animazioni/svg/corrimano-e-taratura.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 702"
     role="img" aria-label="Due torri affiancate, ciascuna con 2 blocchi da 2 sotto-strati. In ognuna una retta verticale, la scorciatoia, va dall'ingresso in fondo all'uscita in cima, e da essa si stacca a ogni sotto-strato un ramo che attraversa un riquadro («attenzione» o «lavoro a parte») e rientra in una sommatoria segnata con un più. A sinistra, intestata «post-LN, il montaggio del 2017» e «LayerNorm(x + Sub(x))», una taratura sta sulla scorciatoia subito sopra ogni sommatoria e la interrompe 4 volte. A destra, intestata «pre-LN, i modelli di oggi» e «x + Sub(LayerNorm(x))», le tarature stanno sui rami all'ingresso dei sotto-strati e la scorciatoia corre intera dall'alto in basso. Un pallino, il gradiente, scende lungo le due scorciatoie. In fondo il conto: in una pila da 96 blocchi sono 192 interruzioni contro nessuna.">
  <style>
    svg  { --d: 7.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .corrimano { stroke:#B5532C; stroke-width:5; stroke-linecap:round; }
    .ramo { stroke:#2D5A5C; stroke-width:2; fill:none; }
    .stanza { fill:#2D5A5C; fill-opacity:0.14; stroke:#2D5A5C; stroke-width:1.5; }
    .tar { fill:#F8F5EE; stroke:#C9A961; stroke-width:2; }
    .somma { fill:#F8F5EE; stroke:#B5532C; stroke-width:2; }
    .sgn, .stz, .trt { text-anchor:middle; }
    .giu { fill:#1A1A1A; }
        @keyframes scende{0.00%{transform:translateY(-440px)}10.00%{transform:translateY(-440px)}90.00%{transform:translateY(0px)}100.00%{transform:translateY(0px)}}
    @media (prefers-reduced-motion:reduce) { .giu { animation:none !important; } }
  </style>
