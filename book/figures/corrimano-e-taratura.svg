path class="ramo" d="M 452 444 H 572 V 425 M 572 393 V 374 H 452"/><path class="ramo" d="M 452 348 H 572 V 329 M 572 297 V 278 H 452"/><path class="ramo" d="M 452 252 H 572 V 233 M 572 201 V 182 H 452"/><line class="corrimano" x1="452" y1="118" x2="452" y2="558"/><rect class="stanza" x="506" y="489" width="132" height="32" rx="5"/><text class="lbs stz" x="572" y="510">attenzione</text><rect class="tar" x="483" y="529" width="58" height="22" rx="4"/><text class="lbs trt" x="512.0" y="545">taratura</text><circle class="somma" cx="452" cy="470" r="10"/><text class="lbl sgn" x="452" y="475">+</text><rect class="stanza" x="506" y="393" width="132" height="32" rx="5"/><text class="lbs stz" x="572" y="414">lavoro a parte</text><rect class="tar" x="483" y="433" width="58" height="22" rx="4"/><text class="lbs trt" x="512.0" y="449">taratura</text><circle class="somma" cx="452" cy="374" r="10"/><text class="lbl sgn" x="452" y="379">+</text><rect class="stanza" x="506" y="297" width="132" height="32" rx="5"/><text class="lbs stz" x="572" y="318">attenzione</text><rect class="tar" x="483" y="337" width="58" height="22" rx="4"/><text class="lbs trt" x="512.0" y="353">taratura</text><circle class="somma" cx="452" cy="278" r="10"/><text class="lbl sgn" x="452" y="283">+</text><rect class="stanza" x="506" y="201" width="132" height="32" rx="5"/><text class="lbs stz" x="572" y="222">lavoro a parte</text><rect class="tar" x="483" y="241" width="58" height="22" rx="4"/><text class="lbs trt" x="512.0" y="257">taratura</text><circle class="somma" cx="452" cy="182" r="10"/><text class="lbl sgn" x="452" y="187">+</text><circle class="giu" cx="150" cy="558" r="7" style="animation:scende var(--d) infinite"/><circle class="giu" cx="452" cy="558" r="7" style="animation:scende var(--d) infinite"/><text class="ttl" x="54" y="34">post-LN, il montaggio del 2017</text><text class="lbs" x="54" y="56">LayerNorm(x + Sub(x))</text><text class="lbl" x="54" y="614">il corrimano attraversa 4 tarature</text><text class="lbs stz" x="150" y="106">uscita</text><text class="lbs stz" x="150" y="584">ingresso</text><text class="ttl" x="356" y="34">pre-LN, i modelli di oggi</text><text class="lbs" x="356" y="56">x + Sub(LayerNorm(x))</text><text class="lbl" x="356" y="614">il corrimano non ne attraversa nessuna</text><text class="lbs stz" x="452" y="106">uscita</text><text class="lbs stz" x="452" y="584">ingresso</text><text class="lbs" x="54" y="640">il pallino è il gradiente, che scende dall'uscita verso l'ingresso</text><text class="lbs" x="54" y="662">in una pila da 96 blocchi, due sotto-strati per blocco, fanno 192 interruzioni contro nessuna</text><text class="lbs" x="54" y="684">(qui i blocchi disegnati sono 2, cioè 4 sommatorie)</text>
</svg>
