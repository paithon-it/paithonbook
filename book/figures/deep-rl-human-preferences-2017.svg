<svg viewBox="0 0 800 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclo: l'agente RL genera coppie di traiettorie, un umano sceglie la preferita, un modello di ricompensa impara dalle preferenze e restituisce la ricompensa predetta che riaddestra l'agente">
  <defs>
    <marker id="ah146" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#F8F5EE"/>
  <!-- nodes -->
  <rect x="70" y="70" width="210" height="80" rx="6" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="175" y="104" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#F8F5EE">Agente RL</text>
  <text x="175" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">massimizza r&#770;</text>

  <rect x="500" y="64" width="230" height="92" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="615" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Due segmenti a confronto</text>
  <rect x="518" y="94" width="90" height="40" rx="4" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="563" y="119" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F8F5EE">&#963;&#185;</text>
  <rect x="622" y="94" width="90" height="40" rx="4" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="667" y="119" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">&#963;&#178;</text>

  <rect x="500" y="290" width="230" height="80" rx="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="615" y="324" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">Umano: quale preferisci?</text>
  <text x="615" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">scelta binaria &#10003;</text>

  <rect x="70" y="290" width="210" height="80" rx="6" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="175" y="324" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Modello di ricompensa</text>
  <text x="175" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">apprende r&#770; dai confronti</text>

  <!-- arrows clockwise -->
  <line x1="280" y1="110" x2="496" y2="110" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah146)"/>
  <text x="388" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">genera coppie di traiettorie</text>

  <line x1="615" y1="156" x2="615" y2="286" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah146)"/>
  <text x="632" y="223" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852" transform="rotate(-90 632 223)">mostrati all'umano</text>

  <line x1="500" y1="330" x2="284" y2="330" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah146)"/>
  <text x="392" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">preferenza: &#963;&#185; &#8827; &#963;&#178;</text>

  <line x1="175" y1="290" x2="175" y2="154" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah146)"/>
  <text x="140" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852" transform="rotate(-90 140 222)">ricompensa r&#770;</text>
</svg>
