  Paithon Book, figura animata: il peso del trapezio, e la conca dello scarto
  Generata da animazioni/svg/trapezio-e-il-peso.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442"
     role="img" aria-label="Due grafici affiancati. A sinistra, un passo solo di una curva di prova: una curva che sale, e l'area sotto di lei, tinta, è quello che entra davvero, 0,380. Tre righe orizzontali la attraversano, e ciascuna è l'altezza con cui un peso stima quella stessa area: la riga bassa, in teal, è il peso 0, che guarda solo il campione di prima e dà 0,164; quella di mezzo, in ocra, è il peso un mezzo, il trapezio della geometria, e dà 0,368; quella alta, in terracotta, è il peso 1, cioè il conto di Mamba-2, e dà 0,573. Le due righe estreme stanno una tutta sotto e una tutta sopra la curva; quella di mezzo la taglia, e il pezzo che avanza da una parte compensa quello che manca dall'altra. Un segmento tratteggiato in ocra unisce i due estremi della curva: è il trapezio della geometria, e racchiude la stessa area della riga di mezzo. A destra, lo scarto quadratico medio su 120 punti di partenza al variare del peso fra zero e uno: una conca. Vale 0,146 al peso zero, 0,030 al peso un mezzo e 0,156 al peso uno, e un trattino segna il minimo vero, che cade a 0,48. I due estremi sbagliano quasi uguale, e il fondo della conca sbaglia quasi cinque volte meno di tutti e due.">
