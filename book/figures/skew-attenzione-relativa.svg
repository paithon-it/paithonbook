<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" role="img" aria-label="Due tabelle di quattro righe per quattro colonne, affiancate. A sinistra, «quello che si calcola»: ogni riga è una parola e ogni colonna una distanza, e tutte e quattro le righe portano gli stessi numeri 3, 2, 1, 0 da sinistra a destra. Una freccia in mezzo dice che ogni riga scivola a sinistra di una casella in più di quella sotto, mentre l'ultima resta ferma. A destra, «quello che serve»: ogni colonna è adesso una posizione della frase, sulla diagonale c'è ovunque lo zero, cioè la parola stessa, e a sinistra della diagonale le distanze crescono verso il bordo (la quarta riga porta 3, 2, 1, 0). Le dieci caselle sotto la diagonale sono piene; le sei sopra sono tratteggiate e vuote, perché guardano avanti e la maschera causale le butta.">
