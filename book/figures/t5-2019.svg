  <text x="656" y="236" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#B5532C">4.2</text>

  <rect x="556" y="284" width="200" height="52" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="656" y="316" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#B5532C">riassunto breve</text>
