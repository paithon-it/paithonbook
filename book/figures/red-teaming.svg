<svg viewBox="0 0 720 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Il ciclo del red teaming: policy, attacco, scoperta delle falle, patch, verifica, e di nuovo attacco">
  <rect x="0" y="0" width="720" height="460" fill="#F8F5EE"/>
  <text x="360" y="36" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Il ciclo attacco → patch</text>
  <!-- Frecce circolari -->
  <path d="M 360 78 A 150 150 0 0 1 505 190" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="505,190 494,178 490,193" fill="#1A1A1A"/>
  <path d="M 505 270 A 150 150 0 0 1 360 382" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="360,382 373,375 371,390" fill="#1A1A1A"/>
  <path d="M 215 270 A 150 150 0 0 0 360 382" fill="none" stroke="#1A1A1A" stroke-width="2" transform="translate(0,0)"/>
  <path d="M 360 78 A 150 150 0 0 0 215 190" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="360,78 347,71 349,86" fill="#1A1A1A"/>
  <polygon points="215,190 219,175 228,187" fill="#1A1A1A"/>
  <!-- Nodo 1: Policy (alto) -->
  <rect x="270" y="52" width="180" height="52" rx="26" fill="#1A1A1A"/>
  <text x="360" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8F5EE">1 · POLICY</text>
  <text x="360" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#C9C2B4">cosa NON deve fare</text>
  <!-- Nodo 2: Attacco (destra) -->
  <rect x="475" y="185" width="180" height="90" rx="10" fill="#B5532C"/>
  <text x="565" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8F5EE">2 · ATTACCO</text>
  <text x="565" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">jailbreak, injection,</text>
  <text x="565" y="253" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">attacchi automatizzati</text>
  <!-- Nodo 3: Scoperta (basso) -->
  <rect x="255" y="356" width="210" height="70" rx="10" fill="#C9A961"/>
  <text x="360" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">3 · SCOPERTA</text>
  <text x="360" y="404" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">falle documentate e classificate</text>
  <!-- Nodo 4: Patch (sinistra) -->
  <rect x="65" y="185" width="180" height="90" rx="10" fill="#2D5A5C"/>
  <text x="155" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8F5EE">4 · PATCH</text>
  <text x="155" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">fine-tuning, filtri,</text>
  <text x="155" y="253" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">system prompt</text>
  <!-- Centro -->
  <circle cx="360" cy="232" r="62" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">si ricomincia:</text>
  <text x="360" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">ogni patch invita</text>
  <text x="360" y="261" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">un nuovo attacco</text>
</svg>
