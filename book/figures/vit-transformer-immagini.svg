<svg viewBox="0 0 800 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un'immagine viene divisa in patch, le patch diventano una sequenza di token che entra in un transformer encoder e produce una classe">
  <rect x="0" y="0" width="800" height="300" fill="#F8F5EE"/>
  <!-- immagine a griglia 3x3 -->
  <rect x="30" y="70" width="132" height="132" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="74" y1="70" x2="74" y2="202" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="118" y1="70" x2="118" y2="202" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="30" y1="114" x2="162" y2="114" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="30" y1="158" x2="162" y2="158" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="118" cy="114" r="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="30,202 96,140 162,202" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="96" y="230" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">immagine in patch</text>
  <text x="96" y="248" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">(qui 3×3, nel ViT 14×14)</text>

  <!-- freccia 1 -->
  <line x1="175" y1="136" x2="235" y2="136" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="235,131 247,136 235,141" fill="#1A1A1A"/>
  <text x="211" y="118" font-family="sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">proiezione</text>
  <text x="211" y="132" font-family="sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">lineare</text>

  <!-- sequenza di token: CLS + 9 -->
  <rect x="258" y="120" width="26" height="32" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="271" y="141" font-family="sans-serif" font-size="10" fill="#F8F5EE" text-anchor="middle">CLS</text>
  <rect x="288" y="120" width="26" height="32" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="318" y="120" width="26" height="32" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="348" y="120" width="26" height="32" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="378" y="120" width="26" height="32" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="408" y="120" width="26" height="32" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="438" y="120" width="26" height="32" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="468" y="120" width="26" height="32" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="498" y="120" width="26" height="32" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="528" y="120" width="26" height="32" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="301" y="168" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">1</text>
  <text x="331" y="168" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">2</text>
  <text x="361" y="168" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">3</text>
  <text x="391" y="168" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">4</text>
  <text x="421" y="168" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">5</text>
  <text x="451" y="168" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">6</text>
  <text x="481" y="168" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">7</text>
  <text x="511" y="168" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">8</text>
  <text x="541" y="168" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">9</text>
  <text x="406" y="192" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">token + position embedding</text>

  <!-- freccia 2 -->
  <line x1="566" y1="136" x2="600" y2="136" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="600,131 612,136 600,141" fill="#1A1A1A"/>

  <!-- encoder -->
  <rect x="620" y="96" width="150" height="80" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="695" y="130" font-family="sans-serif" font-size="13" fill="#2D5A5C" text-anchor="middle" font-weight="bold">Transformer</text>
  <text x="695" y="148" font-family="sans-serif" font-size="13" fill="#2D5A5C" text-anchor="middle" font-weight="bold">encoder</text>

  <!-- freccia 3 e output -->
  <line x1="695" y1="180" x2="695" y2="210" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="690,210 695,222 700,210" fill="#1A1A1A"/>
  <text x="695" y="244" font-family="sans-serif" font-size="14" fill="#B5532C" text-anchor="middle" font-weight="bold">«gatto» — 0.94</text>
  <text x="695" y="264" font-family="sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">classe dal token CLS</text>
</svg>
