<svg viewBox="0 0 760 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema del ciclo di serializzazione di un modello">
  <rect x="0" y="0" width="760" height="300" fill="#F8F5EE"/>
  <text x="380" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Il ciclo di vita di un modello serializzato</text>
  <!-- modello in memoria -->
  <rect x="40" y="80" width="180" height="110" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="130" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">Modello addestrato</text>
  <text x="130" y="136" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F8F5EE">pipeline in memoria</text>
  <text x="130" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#C9A961">scaler + coefficienti</text>
  <!-- freccia dump -->
  <line x1="220" y1="120" x2="300" y2="120" stroke="#B5532C" stroke-width="2"/>
  <polygon points="300,120 288,113 288,127" fill="#B5532C"/>
  <text x="260" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#B5532C">joblib.dump</text>
  <!-- file su disco -->
  <rect x="300" y="70" width="160" height="130" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="300" y="70" width="160" height="28" rx="8" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="380" y="89" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">disco</text>
  <text x="380" y="125" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#1A1A1A">modello.joblib</text>
  <text x="380" y="147" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#1A1A1A">modello.json</text>
  <text x="380" y="170" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#B5532C">bytes + metadati</text>
  <!-- freccia load -->
  <line x1="460" y1="120" x2="540" y2="120" stroke="#B5532C" stroke-width="2"/>
  <polygon points="540,120 528,113 528,127" fill="#B5532C"/>
  <text x="500" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#B5532C">joblib.load</text>
  <!-- modello ricaricato -->
  <rect x="540" y="80" width="180" height="110" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="630" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">Modello ricaricato</text>
  <text x="630" y="136" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F8F5EE">identico all'originale</text>
  <text x="630" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#C9A961">pronto per predict()</text>
  <!-- barra tempo -->
  <rect x="40" y="230" width="330" height="34" rx="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="205" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F8F5EE">addestramento: minuti/ore (una volta sola)</text>
  <rect x="540" y="230" width="180" height="34" rx="6" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="630" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">ricaricamento: secondi</text>
</svg>
