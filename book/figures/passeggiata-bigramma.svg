<!--
  Paithon Book, figura animata: la passeggiata del bigramma, e l'anello in cui inciampa
  Generata da animazioni/svg/passeggiata-bigramma.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360"
     role="img" aria-label="In alto una frase si scrive parola per parola, «il cane guarda il cane guarda il gatto nero», e due archetti sotto di essa collegano ciascun «guarda» al «il» che lo segue, cioè le due volte in cui la passeggiata torna sui propri passi. Sotto, un riquadro mostra a ogni passo la pagina del quaderno intestata all'ultima parola scritta, con le continuazioni viste nel corpus disegnate come barrette lunghe quanto i loro foglietti: dopo «il» ci sono «gatto» tre su quattro e «cane» uno su quattro, dopo «cane» soltanto «guarda», e alla fine, dopo «nero», la scommessa è pari fra «salta» e la fine della frase. La barretta della parola pescata è in terracotta, le altre smorzate.">
