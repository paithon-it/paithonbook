<svg viewBox="0 0 800 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: una sequenza di testo entra nel modello, che restituisce una distribuzione di probabilità sulla parola successiva">
  <rect x="0" y="0" width="800" height="380" fill="#F8F5EE"/>
  <text x="40" y="46" font-family="sans-serif" font-size="15" fill="#1A1A1A" font-weight="bold">Contesto (token in ingresso)</text>
  <g font-family="sans-serif" font-size="15" fill="#1A1A1A">
    <rect x="40" y="66" width="46" height="40" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="63" y="91" text-anchor="middle">Il</text>
    <rect x="94" y="66" width="72" height="40" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="130" y="91" text-anchor="middle">gatto</text>
    <rect x="174" y="66" width="76" height="40" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="212" y="91" text-anchor="middle">dorme</text>
    <rect x="258" y="66" width="52" height="40" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="284" y="91" text-anchor="middle">sul</text>
    <rect x="318" y="66" width="40" height="40" fill="#F8F5EE" stroke="#C9A961" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="338" y="91" text-anchor="middle" fill="#C9A961">?</text>
  </g>
  <line x1="200" y1="120" x2="200" y2="160" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M 194 152 L 200 162 L 206 152" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="80" y="165" width="240" height="56" fill="#B5532C"/>
  <text x="200" y="199" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#F8F5EE" font-weight="bold">modello linguistico</text>
  <line x1="200" y1="228" x2="200" y2="268" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M 194 260 L 200 270 L 206 260" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="40" y="300" font-family="sans-serif" font-size="15" fill="#1A1A1A" font-weight="bold">Probabilità del token successivo</text>
  <g font-family="sans-serif" font-size="14">
    <text x="470" y="90" text-anchor="end" fill="#1A1A1A">divano</text>
    <rect x="480" y="76" width="228" height="20" fill="#B5532C"/>
    <text x="716" y="91" fill="#1A1A1A">38%</text>
    <text x="470" y="130" text-anchor="end" fill="#1A1A1A">letto</text>
    <rect x="480" y="116" width="132" height="20" fill="#2D5A5C"/>
    <text x="620" y="131" fill="#1A1A1A">22%</text>
    <text x="470" y="170" text-anchor="end" fill="#1A1A1A">tappeto</text>
    <rect x="480" y="156" width="84" height="20" fill="#2D5A5C"/>
    <text x="572" y="171" fill="#1A1A1A">14%</text>
    <text x="470" y="210" text-anchor="end" fill="#1A1A1A">tetto</text>
    <rect x="480" y="196" width="42" height="20" fill="#C9A961"/>
    <text x="530" y="211" fill="#1A1A1A">7%</text>
    <text x="470" y="250" text-anchor="end" fill="#1A1A1A">tavolo</text>
    <rect x="480" y="236" width="24" height="20" fill="#C9A961"/>
    <text x="512" y="251" fill="#1A1A1A">4%</text>
    <text x="470" y="290" text-anchor="end" fill="#1A1A1A">… (tutto il vocabolario)</text>
    <rect x="480" y="276" width="90" height="20" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="578" y="291" fill="#1A1A1A">15%</text>
  </g>
  <text x="400" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">Il modello non sceglie una parola: assegna una probabilità a tutte, e una viene campionata.</text>
</svg>
