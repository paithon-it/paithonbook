<svg viewBox="0 0 720 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: la distribuzione dei token tagliata da top-p e riscalata dalla temperature">
  <rect x="0" y="0" width="720" height="400" fill="#F8F5EE"/>
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Una distribuzione, tre manipolazioni</text>
  <!-- Panel 1: original -->
  <g font-family="sans-serif" font-size="12">
    <text x="130" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">originale (T = 1)</text>
    <line x1="40" y1="200" x2="220" y2="200" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="50" y="110" width="24" height="90" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="82" y="130" width="24" height="70" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="114" y="155" width="24" height="45" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="146" y="175" width="24" height="25" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="178" y="188" width="24" height="12" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="130" y="222" text-anchor="middle" fill="#1A1A1A">token ordinati per probabilità</text>
  </g>
  <!-- Panel 2: temperature -->
  <g font-family="sans-serif" font-size="12">
    <text x="360" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#B5532C">temperature alta: riscalata</text>
    <line x1="270" y1="200" x2="450" y2="200" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="280" y="140" width="24" height="60" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="312" y="148" width="24" height="52" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="344" y="156" width="24" height="44" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="376" y="164" width="24" height="36" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="408" y="172" width="24" height="28" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="360" y="222" text-anchor="middle" fill="#1A1A1A">la distribuzione si appiattisce</text>
  </g>
  <!-- Panel 3: top-p -->
  <g font-family="sans-serif" font-size="12">
    <text x="590" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A5C">top-p: tagliata</text>
    <line x1="500" y1="200" x2="680" y2="200" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="510" y="110" width="24" height="90" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="542" y="130" width="24" height="70" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="574" y="155" width="24" height="45" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="606" y="175" width="24" height="25" fill="#E8E2D5" stroke="#8B847C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="638" y="188" width="24" height="12" fill="#E8E2D5" stroke="#8B847C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="602" y1="100" x2="602" y2="205" stroke="#B5532C" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="602" y="92" text-anchor="middle" fill="#B5532C" font-weight="bold">soglia p = 0,9</text>
    <text x="590" y="222" text-anchor="middle" fill="#1A1A1A">la coda viene azzerata</text>
  </g>
  <!-- Bottom: beam search -->
  <g font-family="sans-serif" font-size="12">
    <text x="360" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#C9A961">beam search: più sequenze in parallelo</text>
    <circle cx="120" cy="330" r="9" fill="#1A1A1A"/>
    <line x1="129" y1="325" x2="248" y2="300" stroke="#C9A961" stroke-width="2"/>
    <line x1="129" y1="335" x2="248" y2="360" stroke="#C9A961" stroke-width="2"/>
    <circle cx="258" cy="298" r="9" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="258" cy="362" r="9" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="267" y1="294" x2="386" y2="284" stroke="#C9A961" stroke-width="2"/>
    <line x1="267" y1="302" x2="386" y2="320" stroke="#8B847C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="267" y1="362" x2="386" y2="362" stroke="#C9A961" stroke-width="2"/>
    <circle cx="396" cy="283" r="9" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="396" cy="322" r="9" fill="#F8F5EE" stroke="#8B847C" stroke-width="1.5"/>
    <circle cx="396" cy="362" r="9" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="405" y1="281" x2="524" y2="281" stroke="#B5532C" stroke-width="2"/>
    <line x1="405" y1="364" x2="524" y2="368" stroke="#8B847C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="534" cy="281" r="9" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="534" cy="369" r="9" fill="#F8F5EE" stroke="#8B847C" stroke-width="1.5"/>
    <text x="620" y="286" font-weight="bold" fill="#B5532C">vince</text>
    <text x="112" y="358" fill="#1A1A1A">prompt</text>
  </g>
</svg>
