<svg viewBox="0 0 720 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto di tokenizzazione tra la stessa frase in inglese e in italiano">
  <rect x="0" y="0" width="720" height="340" fill="#F8F5EE"/>
  <text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1A1A1A">Stessa frase, due bollette</text>
  <text x="40" y="76" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D5A5C">EN: "The cat is on the table"</text>
  <g font-family="sans-serif" font-size="13" fill="#1A1A1A">
    <rect x="40" y="90" width="58" height="34" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="69" y="112" text-anchor="middle">The</text>
    <rect x="106" y="90" width="58" height="34" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="135" y="112" text-anchor="middle">cat</text>
    <rect x="172" y="90" width="48" height="34" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="196" y="112" text-anchor="middle">is</text>
    <rect x="228" y="90" width="52" height="34" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="254" y="112" text-anchor="middle">on</text>
    <rect x="288" y="90" width="58" height="34" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="317" y="112" text-anchor="middle">the</text>
    <rect x="354" y="90" width="66" height="34" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="387" y="112" text-anchor="middle">table</text>
  </g>
  <text x="440" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D5A5C">= 6 token</text>
  <text x="40" y="176" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B5532C">IT: "Il gatto è sopra il tavolo"</text>
  <g font-family="sans-serif" font-size="13" fill="#1A1A1A">
    <rect x="40" y="190" width="44" height="34" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="62" y="212" text-anchor="middle">Il</text>
    <rect x="92" y="190" width="52" height="34" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="118" y="212" text-anchor="middle">g</text>
    <rect x="152" y="190" width="56" height="34" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="180" y="212" text-anchor="middle">atto</text>
    <rect x="216" y="190" width="44" height="34" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="238" y="212" text-anchor="middle">è</text>
    <rect x="268" y="190" width="64" height="34" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="300" y="212" text-anchor="middle">sopra</text>
    <rect x="340" y="190" width="44" height="34" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="362" y="212" text-anchor="middle">il</text>
    <rect x="392" y="190" width="52" height="34" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="418" y="212" text-anchor="middle">tav</text>
    <rect x="452" y="190" width="52" height="34" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="478" y="212" text-anchor="middle">olo</text>
  </g>
  <text x="524" y="212" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B5532C">= 8 token</text>
  <line x1="40" y1="256" x2="680" y2="256" stroke="#C9A961" stroke-width="1.5"/>
  <text x="40" y="286" font-family="sans-serif" font-size="13" fill="#1A1A1A">Le parole rare nel corpus vengono spezzate in frammenti: ogni frammento è un token,</text>
  <text x="40" y="308" font-family="sans-serif" font-size="13" fill="#1A1A1A">e ogni token si paga (in denaro, latenza e finestra di contesto).</text>
</svg>
