<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tre assi orizzontali sovrapposti, ognuno con un capo a sinistra e uno a destra: si legge da s&#233; (trasparente) contro si spiega dopo (post-hoc); tutto il modello (globale) contro una risposta sola (locale); un tipo di modello (specifico) contro qualunque modello (agnostico). Su ogni asse sono appoggiati tre metodi, ciascuno con il suo colore e una spezzata che unisce le sue tre scelte. I coefficienti di una regressione lineare stanno a sinistra su tutti e tre gli assi e la loro spezzata &#232; diritta; LIME, il metodo che spiega una risposta per volta, sta a destra su tutti e tre e anche la sua &#232; diritta; rimescolare una colonna per vedere quanto peggiora il modello sta a destra sul primo asse, a sinistra sul secondo e a destra sul terzo, e la sua spezzata zigzaga.">
  <rect x="0" y="0" width="760" height="420" fill="#F8F5EE"/>
  <text x="380" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Le tre domande, e dove cade ogni metodo</text>

  <circle cx="120" cy="56" r="6" fill="#2D5A5C"/>
  <text x="134" y="60" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">coefficienti di una regressione lineare</text>
  <circle cx="470" cy="56" r="6" fill="#B5532C"/>
  <text x="484" y="60" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">LIME</text>
  <circle cx="120" cy="80" r="6" fill="#C9A961"/>
  <text x="134" y="84" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">rimescolare una colonna e vedere quanto peggiora</text>

  <line x1="255" y1="150" x2="555" y2="150" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="255" y1="142" x2="255" y2="158" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="555" y1="142" x2="555" y2="158" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="240" y="147" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">si legge da sé</text>
  <text x="240" y="164" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">trasparente</text>
  <text x="570" y="147" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">si spiega dopo</text>
  <text x="570" y="164" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">post-hoc</text>

  <line x1="255" y1="235" x2="555" y2="235" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="255" y1="227" x2="255" y2="243" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="555" y1="227" x2="555" y2="243" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="240" y="232" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">tutto il modello</text>
  <text x="240" y="249" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">globale</text>
  <text x="570" y="232" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">una risposta sola</text>
  <text x="570" y="249" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">locale</text>

  <line x1="255" y1="320" x2="555" y2="320" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="255" y1="312" x2="255" y2="328" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="555" y1="312" x2="555" y2="328" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="240" y="317" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">un tipo di modello</text>
  <text x="240" y="334" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">specifico</text>
  <text x="570" y="317" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">qualunque modello</text>
  <text x="570" y="334" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">agnostico</text>

  <polyline points="270,150 270,235 270,320" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <polyline points="500,150 295,235 500,320" fill="none" stroke="#C9A961" stroke-width="2"/>
  <polyline points="540,150 540,235 540,320" fill="none" stroke="#B5532C" stroke-width="2"/>

  <circle cx="270" cy="150" r="6" fill="#2D5A5C"/>
  <circle cx="270" cy="235" r="6" fill="#2D5A5C"/>
  <circle cx="270" cy="320" r="6" fill="#2D5A5C"/>
  <circle cx="500" cy="150" r="6" fill="#C9A961"/>
  <circle cx="295" cy="235" r="6" fill="#C9A961"/>
  <circle cx="500" cy="320" r="6" fill="#C9A961"/>
  <circle cx="540" cy="150" r="6" fill="#B5532C"/>
  <circle cx="540" cy="235" r="6" fill="#B5532C"/>
  <circle cx="540" cy="320" r="6" fill="#B5532C"/>

  <text x="380" y="388" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">Se i tre assi fossero legati fra loro, tutte le spezzate sarebbero diritte come le due esterne.</text>
</svg>
