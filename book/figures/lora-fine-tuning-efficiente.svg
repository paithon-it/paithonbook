<svg viewBox="0 0 720 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di LoRA: il peso pre-addestrato W resta congelato mentre due matrici a basso rango A e B, addestrabili, gli vengono affiancate e sommate all'uscita">
  <defs>
    <marker id="lora-ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="440" fill="#F8F5EE"/>
  <text x="360" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">LoRA: l'aggiornamento a basso rango affianca il peso congelato</text>

  <!-- output -->
  <text x="360" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">h = W&#183;x + B&#183;A&#183;x</text>
  <line x1="360" y1="78" x2="360" y2="60" stroke="#1A1A1A" stroke-width="2" marker-end="url(#lora-ah)"/>

  <!-- merge node -->
  <circle cx="360" cy="98" r="20" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="360" y="106" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1A1A1A">+</text>

  <!-- frozen W -->
  <rect x="110" y="175" width="160" height="110" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="190" y="223" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#F8F5EE">W</text>
  <text x="190" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">pesi pre-addestrati</text>
  <text x="190" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2D5A5C">congelato &#183; non si addestra</text>
  <line x1="348" y1="381" x2="198" y2="288" stroke="#1A1A1A" stroke-width="2" marker-end="url(#lora-ah)"/>
  <line x1="200" y1="175" x2="350" y2="116" stroke="#1A1A1A" stroke-width="2" marker-end="url(#lora-ah)"/>

  <!-- LoRA path: A then B -->
  <rect x="450" y="300" width="150" height="44" fill="#B5532C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="525" y="327" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#F8F5EE">A &#183; (r &#215; d)</text>
  <rect x="450" y="170" width="150" height="44" fill="#B5532C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="525" y="197" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#F8F5EE">B &#183; (d &#215; r)</text>
  <line x1="372" y1="381" x2="518" y2="344" stroke="#1A1A1A" stroke-width="2" marker-end="url(#lora-ah)"/>
  <line x1="525" y1="300" x2="525" y2="220" stroke="#1A1A1A" stroke-width="2" marker-end="url(#lora-ah)"/>
  <line x1="518" y1="170" x2="370" y2="116" stroke="#1A1A1A" stroke-width="2" marker-end="url(#lora-ah)"/>
  <text x="612" y="266" text-anchor="start" font-family="sans-serif" font-size="12" fill="#B5532C">r &#8810; d</text>
  <text x="525" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B5532C">si addestrano solo A e B</text>

  <!-- input -->
  <circle cx="360" cy="395" r="20" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="360" y="401" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1A1A1A">x</text>
  <text x="360" y="432" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">input</text>
</svg>
