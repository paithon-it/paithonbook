<!--
  paithon book, figura animata: il cancello respinge tre volte, e la memoria del fallimento cresce
  Generata da animazioni/svg/cancello-che-respinge.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376"
     role="img" aria-label="Una esecuzione del ciclo genera, verifica e raffina. In alto a sinistra la stringa candidata, che si riscrive a ogni tentativo; sotto, una barriera con due ante incernierate, il cancello della verifica. Al primo tentativo «Guida Introduttiva a PyTorch» ha le maiuscole accese in terracotta e il cancello resta chiuso; al secondo «guida introduttiva a pytorch» si accendono gli spazi; al terzo «guida-introduttiva-a-pytorch-per-tutti» un righello sotto la stringa segna il tetto di venti caratteri e i diciotto di troppo restano oltre la tacca, in terracotta. Ogni rifiuto manda il suo motivo nella colonna di destra, che si allunga di una riga per volta e non ne perde nessuna: deve essere tutto minuscolo, niente spazi usa il trattino, troppo lungo. Al quarto tentativo «guida-pytorch» le due ante si aprono in teal e la stringa passa verso la casella «accettato», mentre i tre motivi restano tutti in vista. In basso il contagiri arriva a tentativo 4 di 5.">
