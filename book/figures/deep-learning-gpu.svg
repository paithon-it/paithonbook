<svg viewBox="0 0 760 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline parallela: evoluzione dell'hardware sopra, evoluzione dei modelli sotto, dal 1958 al 2020">
  <rect x="0" y="0" width="760" height="340" fill="#F8F5EE"/>
  <text x="380" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Due storie che si inseguono</text>
  <!-- asse centrale -->
  <line x1="60" y1="170" x2="700" y2="170" stroke="#1A1A1A" stroke-width="2"/>
  <!-- etichette lane -->
  <text x="60" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2D5A5C">HARDWARE</text>
  <text x="60" y="290" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#B5532C">MODELLI</text>
  <!-- tacche anni -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">
    <line x1="90" y1="164" x2="90" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="90" y="192">1958</text>
    <line x1="215" y1="164" x2="215" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="215" y="192">1986</text>
    <line x1="330" y1="164" x2="330" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="330" y="192">1998</text>
    <line x1="445" y1="164" x2="445" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="445" y="192">2007</text>
    <line x1="560" y1="164" x2="560" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="560" y="192">2012</text>
    <line x1="670" y1="164" x2="670" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="670" y="192">2017+</text>
  </g>
  <!-- hardware (sopra) -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11">
    <line x1="90" y1="130" x2="90" y2="164" stroke="#2D5A5C" stroke-width="1.5"/>
    <rect x="50" y="86" width="80" height="44" rx="4" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="1.5"/>
    <text x="90" y="104" text-anchor="middle" fill="#1A1A1A">CPU</text>
    <text x="90" y="120" text-anchor="middle" fill="#1A1A1A">sequenziali</text>
    <line x1="445" y1="130" x2="445" y2="164" stroke="#2D5A5C" stroke-width="1.5"/>
    <rect x="400" y="86" width="90" height="44" rx="4" fill="#2D5A5C" stroke="#2D5A5C" stroke-width="1.5"/>
    <text x="445" y="104" text-anchor="middle" fill="#F8F5EE">CUDA</text>
    <text x="445" y="120" text-anchor="middle" fill="#F8F5EE">GPU generiche</text>
    <line x1="670" y1="130" x2="670" y2="164" stroke="#2D5A5C" stroke-width="1.5"/>
    <rect x="622" y="86" width="96" height="44" rx="4" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="1.5"/>
    <text x="670" y="104" text-anchor="middle" fill="#1A1A1A">chip dedicati</text>
    <text x="670" y="120" text-anchor="middle" fill="#1A1A1A">all&#8217;AI</text>
  </g>
  <!-- modelli (sotto) -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11">
    <line x1="90" y1="176" x2="90" y2="210" stroke="#B5532C" stroke-width="1.5"/>
    <rect x="48" y="210" width="84" height="44" rx="4" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.5"/>
    <text x="90" y="228" text-anchor="middle" fill="#1A1A1A">Perceptron</text>
    <text x="90" y="244" text-anchor="middle" fill="#1A1A1A">(Rosenblatt)</text>
    <line x1="215" y1="176" x2="215" y2="210" stroke="#B5532C" stroke-width="1.5"/>
    <rect x="170" y="210" width="90" height="44" rx="4" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.5"/>
    <text x="215" y="228" text-anchor="middle" fill="#1A1A1A">Backprop</text>
    <text x="215" y="244" text-anchor="middle" fill="#1A1A1A">popolarizzata</text>
    <line x1="330" y1="176" x2="330" y2="210" stroke="#B5532C" stroke-width="1.5"/>
    <rect x="290" y="210" width="80" height="44" rx="4" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.5"/>
    <text x="330" y="228" text-anchor="middle" fill="#1A1A1A">LeNet-5</text>
    <text x="330" y="244" text-anchor="middle" fill="#1A1A1A">(LeCun)</text>
    <line x1="560" y1="176" x2="560" y2="210" stroke="#B5532C" stroke-width="1.5"/>
    <rect x="516" y="210" width="88" height="44" rx="4" fill="#B5532C" stroke="#B5532C" stroke-width="1.5"/>
    <text x="560" y="228" text-anchor="middle" fill="#F8F5EE">AlexNet</text>
    <text x="560" y="244" text-anchor="middle" fill="#F8F5EE">su 2 GPU</text>
    <line x1="670" y1="176" x2="670" y2="210" stroke="#B5532C" stroke-width="1.5"/>
    <rect x="624" y="210" width="92" height="44" rx="4" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.5"/>
    <text x="670" y="228" text-anchor="middle" fill="#1A1A1A">Transformer,</text>
    <text x="670" y="244" text-anchor="middle" fill="#1A1A1A">LLM</text>
  </g>
  <!-- zona attesa -->
  <rect x="130" y="150" width="290" height="40" fill="#C9A961" opacity="0.25"/>
  <text x="275" y="152" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic" fill="#1A1A1A" dy="-6">~50 anni di attesa: le idee ci sono, il calcolo no</text>
</svg>
