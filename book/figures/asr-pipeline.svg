<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="Pipeline del riconoscimento vocale automatico in cinque stadi: audio, estrazione delle feature, modello acustico, modello di linguaggio, testo">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B5532C"/>
    </marker>
  </defs>

  <!-- stadio 1: audio -->
  <rect x="15" y="60" width="130" height="100" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <polyline points="32,92 44,74 54,106 64,78 74,100 84,82 94,102 104,76 114,98 124,88 130,92" fill="none" stroke="#B5532C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="80" y="140" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Audio</text>

  <!-- stadio 2: feature -->
  <rect x="190" y="60" width="130" height="100" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="206" y="90"  width="12" height="28" fill="#2D5A5C"/>
  <rect x="223" y="72"  width="12" height="46" fill="#C9A961"/>
  <rect x="240" y="98"  width="12" height="20" fill="#B5532C"/>
  <rect x="257" y="78"  width="12" height="40" fill="#2D5A5C"/>
  <rect x="274" y="86"  width="12" height="32" fill="#C9A961"/>
  <rect x="291" y="94"  width="12" height="24" fill="#B5532C"/>
  <text x="255" y="140" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Feature</text>

  <!-- stadio 3: modello acustico -->
  <rect x="365" y="60" width="130" height="100" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="430" y="104" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Modello</text>
  <text x="430" y="126" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">acustico</text>

  <!-- stadio 4: modello di linguaggio -->
  <rect x="540" y="60" width="130" height="100" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="605" y="104" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Modello di</text>
  <text x="605" y="126" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">linguaggio</text>

  <!-- stadio 5: testo -->
  <rect x="715" y="60" width="130" height="100" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="780" y="116" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Testo</text>

  <!-- frecce -->
  <line x1="148" y1="110" x2="185" y2="110" stroke="#B5532C" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="323" y1="110" x2="360" y2="110" stroke="#B5532C" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="498" y1="110" x2="535" y2="110" stroke="#B5532C" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="673" y1="110" x2="710" y2="110" stroke="#B5532C" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- output di esempio -->
  <line x1="780" y1="162" x2="780" y2="186" stroke="#B5532C" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="780" y="212" font-family="Fraunces, Georgia, serif" font-size="17" font-style="italic" fill="#B5532C" text-anchor="middle">&#171;che ore sono?&#187;</text>
</svg>