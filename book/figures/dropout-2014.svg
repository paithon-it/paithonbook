<svg viewBox="0 0 720 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A sinistra una rete in addestramento con due neuroni nascosti spenti a caso; al centro tre sottoreti campionate diverse tra le 2 elevato a n possibili con pesi condivisi; a destra la rete intera usata al test con i pesi moltiplicati per p">
  <rect x="0" y="0" width="720" height="360" fill="#F8F5EE"/>
  <text x="130" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">Addestramento</text>
  <text x="378" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">2&#8319; sottoreti</text>
  <text x="612" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">Test</text>

  <!-- PANEL A: network with dropped nodes -->
  <!-- active edges: I(3) -> H1,H3 ; H1,H3 -> O1,O2 -->
  <g stroke="#C9C2B4" stroke-width="1.3">
    <line x1="60" y1="130" x2="135" y2="110"/><line x1="60" y1="180" x2="135" y2="110"/><line x1="60" y1="230" x2="135" y2="110"/>
    <line x1="60" y1="130" x2="135" y2="210"/><line x1="60" y1="180" x2="135" y2="210"/><line x1="60" y1="230" x2="135" y2="210"/>
    <line x1="135" y1="110" x2="205" y2="160"/><line x1="135" y1="110" x2="205" y2="210"/>
    <line x1="135" y1="210" x2="205" y2="160"/><line x1="135" y1="210" x2="205" y2="210"/>
  </g>
  <!-- input nodes -->
  <g fill="#B5532C">
    <circle cx="60" cy="130" r="11"/><circle cx="60" cy="180" r="11"/><circle cx="60" cy="230" r="11"/>
  </g>
  <!-- active hidden + output -->
  <g fill="#B5532C">
    <circle cx="135" cy="110" r="11"/><circle cx="135" cy="210" r="11"/>
    <circle cx="205" cy="160" r="11"/><circle cx="205" cy="210" r="11"/>
  </g>
  <!-- dropped hidden nodes -->
  <g fill="#F8F5EE" stroke="#8B847C" stroke-width="1.5" stroke-dasharray="3 3">
    <circle cx="135" cy="160" r="11"/><circle cx="135" cy="260" r="11"/>
  </g>
  <g stroke="#8B847C" stroke-width="1.5">
    <line x1="128" y1="153" x2="142" y2="167"/><line x1="142" y1="153" x2="128" y2="167"/>
    <line x1="128" y1="253" x2="142" y2="267"/><line x1="142" y1="253" x2="128" y2="267"/>
  </g>
  <text x="130" y="305" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1A1A1A">a ogni passo si spegne</text>
  <text x="130" y="321" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1A1A1A">un sottoinsieme casuale</text>

  <!-- arrow A -> B -->
  <line x1="232" y1="185" x2="272" y2="185" stroke="#1A1A1A" stroke-width="1.8"/>
  <polygon points="272,185 262,180 262,190" fill="#1A1A1A"/>

  <!-- PANEL B: three sampled subnets (dot columns) -->
  <text x="378" y="95" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1A1A1A">sottoreti campionate</text>
  <!-- col 1 -->
  <g><circle cx="320" cy="125" r="7" fill="#B5532C"/><circle cx="320" cy="165" r="7" fill="#F8F5EE" stroke="#8B847C" stroke-width="1.3" stroke-dasharray="2 2"/><circle cx="320" cy="205" r="7" fill="#B5532C"/><circle cx="320" cy="245" r="7" fill="#B5532C"/></g>
  <!-- col 2 -->
  <g><circle cx="378" cy="125" r="7" fill="#F8F5EE" stroke="#8B847C" stroke-width="1.3" stroke-dasharray="2 2"/><circle cx="378" cy="165" r="7" fill="#B5532C"/><circle cx="378" cy="205" r="7" fill="#B5532C"/><circle cx="378" cy="245" r="7" fill="#F8F5EE" stroke="#8B847C" stroke-width="1.3" stroke-dasharray="2 2"/></g>
  <!-- col 3 -->
  <g><circle cx="436" cy="125" r="7" fill="#B5532C"/><circle cx="436" cy="165" r="7" fill="#B5532C"/><circle cx="436" cy="205" r="7" fill="#F8F5EE" stroke="#8B847C" stroke-width="1.3" stroke-dasharray="2 2"/><circle cx="436" cy="245" r="7" fill="#B5532C"/></g>
  <text x="378" y="292" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1A1A1A">2&#8319; combinazioni</text>
  <text x="378" y="308" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1A1A1A">con pesi condivisi</text>

  <!-- arrow B -> C -->
  <line x1="472" y1="185" x2="512" y2="185" stroke="#1A1A1A" stroke-width="1.8"/>
  <polygon points="512,185 502,180 502,190" fill="#1A1A1A"/>
  <text x="492" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">media</text>

  <!-- PANEL C: full network at test -->
  <g stroke="#2D5A5C" stroke-width="1.3">
    <line x1="545" y1="140" x2="615" y2="120"/><line x1="545" y1="140" x2="615" y2="165"/><line x1="545" y1="140" x2="615" y2="210"/><line x1="545" y1="140" x2="615" y2="255"/>
    <line x1="545" y1="185" x2="615" y2="120"/><line x1="545" y1="185" x2="615" y2="165"/><line x1="545" y1="185" x2="615" y2="210"/><line x1="545" y1="185" x2="615" y2="255"/>
    <line x1="545" y1="230" x2="615" y2="120"/><line x1="545" y1="230" x2="615" y2="165"/><line x1="545" y1="230" x2="615" y2="210"/><line x1="545" y1="230" x2="615" y2="255"/>
    <line x1="615" y1="120" x2="680" y2="165"/><line x1="615" y1="120" x2="680" y2="210"/>
    <line x1="615" y1="165" x2="680" y2="165"/><line x1="615" y1="165" x2="680" y2="210"/>
    <line x1="615" y1="210" x2="680" y2="165"/><line x1="615" y1="210" x2="680" y2="210"/>
    <line x1="615" y1="255" x2="680" y2="165"/><line x1="615" y1="255" x2="680" y2="210"/>
  </g>
  <g fill="#2D5A5C">
    <circle cx="545" cy="140" r="10"/><circle cx="545" cy="185" r="10"/><circle cx="545" cy="230" r="10"/>
    <circle cx="615" cy="120" r="10"/><circle cx="615" cy="165" r="10"/><circle cx="615" cy="210" r="10"/><circle cx="615" cy="255" r="10"/>
    <circle cx="680" cy="165" r="10"/><circle cx="680" cy="210" r="10"/>
  </g>
  <text x="612" y="305" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1A1A1A">rete intera, tutti accesi</text>
  <text x="612" y="321" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1A1A1A">pesi &#215; p</text>
</svg>
