<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Matrice di confusione 2 per 2 con veri positivi, falsi positivi, falsi negativi e veri negativi">
  <rect x="0" y="0" width="760" height="420" fill="#F8F5EE"/>
  <!-- Column headers -->
  <text x="380" y="35" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">PREVISIONE DEL MODELLO</text>
  <text x="310" y="70" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5E5852" text-anchor="middle">positivo</text>
  <text x="530" y="70" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5E5852" text-anchor="middle">negativo</text>
  <!-- Row headers -->
  <text x="55" y="200" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" transform="rotate(-90 55 200)">REALTÀ</text>
  <text x="120" y="150" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5E5852" text-anchor="middle">positivo</text>
  <text x="120" y="300" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5E5852" text-anchor="middle">negativo</text>
  <!-- TP cell -->
  <rect x="200" y="85" width="220" height="130" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="310" y="135" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#F8F5EE" text-anchor="middle">TP</text>
  <text x="310" y="162" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle">vero positivo</text>
  <text x="310" y="185" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#C9A961" text-anchor="middle">frode trovata</text>
  <!-- FN cell -->
  <rect x="430" y="85" width="220" height="130" rx="8" fill="#B5532C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="540" y="135" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#F8F5EE" text-anchor="middle">FN</text>
  <text x="540" y="162" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle">falso negativo</text>
  <text x="540" y="185" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">frode sfuggita</text>
  <!-- FP cell -->
  <rect x="200" y="235" width="220" height="130" rx="8" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="310" y="285" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1A1A1A" text-anchor="middle">FP</text>
  <text x="310" y="312" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">falso positivo</text>
  <text x="310" y="335" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">falso allarme</text>
  <!-- TN cell -->
  <rect x="430" y="235" width="220" height="130" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="540" y="285" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1A1A1A" text-anchor="middle">TN</text>
  <text x="540" y="312" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">vero negativo</text>
  <text x="540" y="335" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5E5852" text-anchor="middle">silenzio giusto</text>
  <!-- Metric brackets -->
  <text x="310" y="395" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2D5A5C" text-anchor="middle">precision = TP / (TP + FP) ↓ colonna</text>
  <text x="700" y="150" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2D5A5C" text-anchor="middle" transform="rotate(90 700 150)">recall = TP / (TP + FN) → riga</text>
</svg>
