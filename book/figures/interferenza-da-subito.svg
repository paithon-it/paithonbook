<!--
  Paithon Book, figura animata: le briciole crescono da subito, non a soglia
  Generata da animazioni/svg/interferenza-da-subito.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"
     role="img" aria-label="Due grafici affiancati, sullo stesso foglio-registro da 32 caselle. A sinistra, due riletture messe a confronto con delle barre: dopo 8 voci scritte la voce cercata pesa 1,00 e le briciole delle altre 0,46; dopo 32 voci, cioè tante quante le caselle, la voce cercata pesa sempre 1,00 e le briciole 0,98, cioè altrettanto. A destra, la stessa misura per ogni numero di voci da 1 a 64: una curva che sale da 0,00 e attraversa la riga orizzontale del pari poco dopo le 32 voci. La curva non ha nessun gradino e nessun ginocchio: comincia a salire dalla prima voce scritta. Due punti marcati la segnano a 8 e a 32 voci, e un trattino verticale scende dal secondo.">
  <style>
    svg  { --d: 8.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .gcur { fill:none; stroke:#1A1A1A; stroke-width:2.2;
            stroke-linejoin:round; }
    .pAs  { fill:#B5532C; fill-opacity:0.75; stroke:#B5532C;
            stroke-width:1.2; }
    .pBs  { fill:#2D5A5C; fill-opacity:0.75; stroke:#2D5A5C; stroke-width:1.2; }
    .pAp  { fill:#B5532C; stroke:none; }
    .pBp  { fill:#2D5A5C; stroke:none; }
    .pt   { fill:#1A1A1A; stroke:none; }
    .pari { stroke:#C9A961; stroke-width:1.8; stroke-dasharray:6 4; }
    .tick { stroke:#5A524A; stroke-width:1.2; stroke-dasharray:3 3; }
    .val  { font-family:Inter, system-ui, sans-serif; font-size:13px; font-weight:600; fill:#1A1A1A; }

    
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
  </style>
  <text class="ttl" x="70.0" y="46.0">due riletture</text><text class="lbs" x="70.0" y="64.0">un foglio da 32 caselle, riletto dopo 8 voci e dopo 32</text><text class="lbs" transform="rotate(-90 56.0 185.0)" x="56.0" y="185.0" text-anchor="middle">quanto pesa</text><rect class="ax" x="70" y="80" width="300" height="210" rx="4"/><rect class="pBs" x="97.0" y="134.4" width="46.0" height="155.6"/><text class="val" x="120.0" y="126.4" text-anchor="middle">1,00</text><rect class="pAs" x="147.0" y="219.2" width="46.0" height="70.8"/><text class="val" x="170.0" y="211.2" text-anchor="middle">0,46</text><text class="lbs" x="145.0" y="308.0" text-anchor="middle">8 voci scritte</text><rect class="pBs" x="247.0" y="134.4" width="46.0" height="155.6"/><text class="val" x="270.0" y="126.4" text-anchor="middle">1,00</text><rect class="pAs" x="297.0" y="138.0" width="46.0" height="152.0"/><text class="val" x="320.0" y="130.0" text-anchor="middle">0,98</text><text class="lbs" x="295.0" y="308.0" text-anchor="middle">32 voci scritte</text><rect class="pBs" x="70.0" y="322.0" width="15" height="12"/><text class="lbs" x="93.0" y="332.0">la voce che si cercava</text><rect class="pAs" x="70.0" y="341.0" width="15" height="12"/><text class="lbs" x="93.0" y="351.0">le briciole di tutte le altre</text><text class="ttl" x="530.0" y="46.0">tutte le riletture</text><text class="lbs" x="530.0" y="64.0">media su 400 estrazioni per ogni punto</text><text class="lbs" transform="rotate(-90 516.0 185.0)" x="516.0" y="185.0" text-anchor="middle">quanto pesano le briciole</text><rect class="ax" x="530" y="80" width="300" height="210" rx="4"/><line class="pari" x1="530.0" y1="154.5" x2="830.0" y2="154.5"/><text class="lbs" x="538.0" y="147.5">quanto la voce cercata</text><path class="gcur" d="M 534.7 290.0 L 539.4 269.9 L 544.1 259.9 L 548.8 251.6 L 558.1 239.3 L 567.5 228.3 L 581.6 215.9 L 605.0 199.1 L 633.1 182.9 L 680.0 157.6 L 740.9 135.0 L 830.0 102.8"/><circle class="pt" cx="534.7" cy="290.0" r="2.6"/><circle class="pt" cx="539.4" cy="269.9" r="2.6"/><circle class="pt" cx="544.1" cy="259.9" r="2.6"/><circle class="pt" cx="548.8" cy="251.6" r="2.6"/><circle class="pt" cx="558.1" cy="239.3" r="2.6"/><circle class="pBp" cx="567.5" cy="228.3" r="4.5"/><circle class="pt" cx="581.6" cy="215.9" r="2.6"/><circle class="pt" cx="605.0" cy="199.1" r="2.6"/><circle class="pt" cx="633.1" cy="182.9" r="2.6"/><circle class="pAp" cx="680.0" cy="157.6" r="4.5"/><circle class="pt" cx="740.9" cy="135.0" r="2.6"/><circle class="pt" cx="830.0" cy="102.8" r="2.6"/><line class="tick" x1="680.0" y1="157.6" x2="680.0" y2="290.0"/><text class="lbs" x="530.0" y="308.0" text-anchor="start">0 voci</text><text class="lbs" x="680.0" y="308.0" text-anchor="middle">32, quante le caselle</text><text class="lbs" x="830.0" y="308.0" text-anchor="end">64</text><text class="lbs" x="70.0" y="396.0">La curva non ha un ginocchio: sale dalla prima voce scritta, e a un quarto delle caselle è già a metà strada.</text><text class="lbs" x="70.0" y="416.0">Chiavi e valori sorteggiati, memoria fatta di somme di prodotti esterni: nessun addestramento, solo algebra.</text>
</svg>
