<svg viewBox="0 0 720 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema del flusso pigro di dati: sorgente, generatore, map, filter e consumatore collegati in catena, con un solo elemento in transito alla volta">
  <rect x="0" y="0" width="720" height="300" fill="#F8F5EE"/>
  <text x="360" y="36" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Il flusso pigro dei dati</text>
  <rect x="20" y="100" width="120" height="70" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="80" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">sorgente</text>
  <text x="80" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">file / lista</text>
  <rect x="190" y="100" width="120" height="70" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="250" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#B5532C">generatore</text>
  <text x="250" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">yield</text>
  <rect x="360" y="100" width="100" height="70" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="410" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2D5A5C">map</text>
  <text x="410" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">trasforma</text>
  <rect x="510" y="100" width="100" height="70" rx="8" fill="#F8F5EE" stroke="#C9A961" stroke-width="2"/>
  <text x="560" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">filter</text>
  <text x="560" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">setaccia</text>
  <rect x="640" y="95" width="66" height="80" rx="8" fill="#1A1A1A"/>
  <text x="673" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">for</text>
  <text x="673" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#C9A961">consuma</text>
  <line x1="140" y1="135" x2="186" y2="135" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="186,135 176,130 176,140" fill="#1A1A1A"/>
  <line x1="310" y1="135" x2="356" y2="135" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="356,135 346,130 346,140" fill="#1A1A1A"/>
  <line x1="460" y1="135" x2="506" y2="135" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="506,135 496,130 496,140" fill="#1A1A1A"/>
  <line x1="610" y1="135" x2="636" y2="135" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="636,135 626,130 626,140" fill="#1A1A1A"/>
  <circle cx="163" cy="135" r="8" fill="#B5532C"/>
  <circle cx="333" cy="135" r="8" fill="#2D5A5C"/>
  <circle cx="483" cy="135" r="8" fill="#C9A961"/>
  <text x="360" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">un solo elemento in transito alla volta: niente viene calcolato prima che serva</text>
  <path d="M 640 230 L 200 230" stroke="#B5532C" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <polygon points="200,230 210,225 210,235" fill="#B5532C"/>
  <text x="420" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B5532C">la richiesta ("dammi il prossimo") risale la catena all'indietro</text>
</svg>
