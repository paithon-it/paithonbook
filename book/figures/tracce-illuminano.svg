-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330"
     role="img" aria-label="Due griglie identiche di tre righe per quattro colonne, con la partenza in basso a sinistra, la meta che paga più uno in alto a destra, la trappola sotto di lei e un muro al centro. In tutte e due, cinque frecce disegnano lo stesso cammino dalla partenza alla meta. Nella griglia di sinistra, «un passo alla volta», una sola freccia è colorata, l'ultima, quella che entra nella meta, con peso 1,00; le altre quattro sono grigie. Nella griglia di destra, «con le tracce», sono colorate tutte e cinque, e il loro peso sfuma all'indietro: 1,00, 0,81, 0,66, 0,53 e 0,43 per la prima mossa del cammino, che resta comunque accesa.">
