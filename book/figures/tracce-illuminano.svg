  Paithon Book, figura animata: un passo alla volta contro le tracce: chi si rinforza
  Generata da animazioni/svg/tracce-illuminano.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
