<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500"
     role="img" aria-label="I 6 punti A, B, C, D, E, F su un piano, e 2 centroidi segnati con una x. I due centroidi partono tutti e due nel gruppo di sinistra, poi si alternano due mosse: l'assegnazione, in cui ogni punto prende il colore del centroide più vicino, e l'aggiornamento, in cui ogni centroide si sposta nella media dei suoi punti. Alla seconda assegnazione il punto C passa dal gruppo di destra a quello di sinistra; dopo il secondo aggiornamento nessun punto cambia più colore e l'algoritmo si ferma. Una scia tratteggiata mostra il cammino percorso da ciascun centroide, e l'inerzia scende a ogni mezzo passo.">
