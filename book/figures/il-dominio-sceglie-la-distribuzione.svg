  <text x="104" y="244" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5A524A">un segmento</text>
  <line x1="180" y1="182" x2="180" y2="246" stroke="#C5BEAA" stroke-width="1.2"/>
