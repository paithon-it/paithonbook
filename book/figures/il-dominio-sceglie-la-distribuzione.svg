  <text x="525.0" y="315" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5A524A">…</text>
  <text x="472" y="348" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5A524A">K nomi</text>
