  <text x="472" y="140" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5A524A">i numeri positivi</text>
  <line x1="548" y1="78" x2="548" y2="142" stroke="#C5BEAA" stroke-width="1.2"/>
  <text x="564" y="104" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#2D5A5C" font-weight="bold">esponenziale, gamma</text>
  <text x="564" y="124" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5A524A">una durata, una grandezza</text>
