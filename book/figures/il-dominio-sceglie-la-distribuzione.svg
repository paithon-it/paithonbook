  <text x="564" y="436" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5A524A">più risposte insieme</text>
  <line x1="24" y1="484" x2="736" y2="484" stroke="#C5BEAA" stroke-width="1"/>
  <text x="380" y="504" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5A524A">E il dominio del parametro sceglie la funzione dell&#8217;ultimo strato: nessuna sulla retta, sigmoide sul segmento, softmax sulle caselle.</text>
