  <line x1="548" y1="182" x2="548" y2="246" stroke="#C5BEAA" stroke-width="1.2"/>
  <text x="564" y="208" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#2D5A5C" font-weight="bold">von Mises</text>
