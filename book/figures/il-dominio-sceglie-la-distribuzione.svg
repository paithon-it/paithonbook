  <text x="564" y="312" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#B5532C" font-weight="bold">categorica</text>
  <text x="564" y="332" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5A524A">una classe fra K</text>
  <rect x="24" y="374" width="344" height="96" rx="6" fill="none" stroke="#C5BEAA" stroke-width="1.2"/>
  <line x1="56" y1="414" x2="150" y2="414" stroke="#C5BEAA" stroke-width="1.2"/>
  <polygon points="160,414 150,409 150,419" fill="#C5BEAA"/>
  <circle cx="56" cy="414" r="4" fill="#B5532C"/>
  <circle cx="76" cy="414" r="4" fill="#B5532C"/>
  <circle cx="96" cy="414" r="4" fill="#B5532C"/>
  <circle cx="116" cy="414" r="4" fill="#B5532C"/>
  <circle cx="136" cy="414" r="4" fill="#B5532C"/>
  <text x="56" y="402" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">0</text>
  <text x="104" y="452" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5A524A">i conteggi</text>
  <line x1="180" y1="390" x2="180" y2="454" stroke="#C5BEAA" stroke-width="1.2"/>
  <text x="196" y="416" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#B5532C" font-weight="bold">Poisson</text>
  <text x="196" y="436" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5A524A">quante volte</text>
  <rect x="392" y="374" width="344" height="96" rx="6" fill="none" stroke="#C5BEAA" stroke-width="1.2"/>
  <line x1="432" y1="401" x2="506" y2="401" stroke="#2D5A5C" stroke-width="1.4"/>
