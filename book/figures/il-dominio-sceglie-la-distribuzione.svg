  <text x="104" y="348" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5A524A">due esiti</text>
  <line x1="180" y1="286" x2="180" y2="350" stroke="#C5BEAA" stroke-width="1.2"/>
  <text x="196" y="312" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#B5532C" font-weight="bold">Bernoulli</text>
  <text x="196" y="332" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5A524A">sì o no</text>
  <rect x="392" y="270" width="344" height="96" rx="6" fill="none" stroke="#C5BEAA" stroke-width="1.2"/>
  <rect x="431.0" y="297" width="16" height="26" rx="3" fill="none" stroke="#B5532C" stroke-width="1.6"/>
  <rect x="453.0" y="297" width="16" height="26" rx="3" fill="none" stroke="#B5532C" stroke-width="1.6"/>
