<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="Tre strategie per dividere il lavoro su piu GPU affiancate. Pannello DATI: due GPU con lo stesso modello replicato ma fette di dati diverse, i gradienti si mediano con un all-reduce. Pannello TENSOR: una singola matrice dei pesi tagliata a meta, la colonna sinistra su GPU 0 e la destra su GPU 1, i risultati ricomposti con un all-gather. Pannello PIPELINE: strati diversi su GPU diverse, GPU 0 tiene gli strati 1-2 e GPU 1 gli strati 3-4, e i micro-batch scorrono come su una catena di montaggio.">
  <defs>
    <marker id="frn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="frt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5532C"/>
    </marker>
  </defs>

  <!-- cornici dei tre pannelli -->
  <rect x="15" y="15" width="270" height="310" rx="10" fill="none" stroke="#C9A961" stroke-width="1.5"/>
  <rect x="305" y="15" width="270" height="310" rx="10" fill="none" stroke="#C9A961" stroke-width="1.5"/>
  <rect x="595" y="15" width="270" height="310" rx="10" fill="none" stroke="#C9A961" stroke-width="1.5"/>

  <!-- titoli -->
  <text x="150" y="43" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#B5532C">DATI</text>
  <text x="150" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">modello replicato &#183; dati divisi</text>
  <text x="440" y="43" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#B5532C">TENSOR</text>
  <text x="440" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">una matrice divisa</text>
  <text x="730" y="43" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#B5532C">PIPELINE</text>
  <text x="730" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">strati su GPU diverse</text>

  <!-- ============ PANNELLO 1: DATI ============ -->
  <!-- fette di dati per GPU 0 (diverse) -->
  <rect x="38" y="99"  width="22" height="14" rx="2" fill="#C9A961" fill-opacity="0.55" stroke="#C9A961" stroke-width="1"/>
  <rect x="38" y="117" width="22" height="14" rx="2" fill="#C9A961" fill-opacity="0.55" stroke="#C9A961" stroke-width="1"/>
  <rect x="38" y="135" width="22" height="14" rx="2" fill="#C9A961" fill-opacity="0.55" stroke="#C9A961" stroke-width="1"/>
  <text x="49" y="166" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#1A1A1A">dati A</text>
  <line x1="62" y1="124" x2="93" y2="124" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#frn)"/>

  <!-- GPU 0 -->
  <rect x="95" y="85" width="150" height="78" rx="9" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="170" y="104" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2D5A5C">GPU 0</text>
  <rect x="110" y="114" width="120" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>
  <rect x="110" y="129" width="120" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>
  <rect x="110" y="144" width="120" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>

  <!-- fette di dati per GPU 1 (diverse) -->
  <rect x="38" y="205" width="22" height="14" rx="2" fill="#C9A961" fill-opacity="0.55" stroke="#C9A961" stroke-width="1"/>
  <rect x="38" y="223" width="22" height="14" rx="2" fill="#C9A961" fill-opacity="0.55" stroke="#C9A961" stroke-width="1"/>
  <rect x="38" y="241" width="22" height="14" rx="2" fill="#C9A961" fill-opacity="0.55" stroke="#C9A961" stroke-width="1"/>
  <text x="49" y="272" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#1A1A1A">dati B</text>
  <line x1="62" y1="230" x2="93" y2="230" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#frn)"/>

  <!-- GPU 1 -->
  <rect x="95" y="191" width="150" height="78" rx="9" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="170" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2D5A5C">GPU 1</text>
  <rect x="110" y="220" width="120" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>
  <rect x="110" y="235" width="120" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>
  <rect x="110" y="250" width="120" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>

  <!-- all-reduce dei gradienti: collega le due repliche identiche -->
  <path d="M245,124 L260,124 L260,230 L245,230" fill="none" stroke="#B5532C" stroke-width="1.6" stroke-dasharray="5 4" marker-start="url(#frt)" marker-end="url(#frt)"/>
  <text x="150" y="299" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#B5532C">all-reduce dei gradienti</text>
  <text x="150" y="314" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#1A1A1A">(le repliche restano identiche)</text>

  <!-- ============ PANNELLO 2: TENSOR ============ -->
  <text x="440" y="87" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">matrice dei pesi W</text>
  <!-- meta sinistra: GPU 0 -->
  <rect x="345" y="95" width="95" height="120" fill="#2D5A5C" fill-opacity="0.16" stroke="none"/>
  <!-- meta destra: GPU 1 -->
  <rect x="440" y="95" width="95" height="120" fill="#C9A961" fill-opacity="0.30" stroke="none"/>
  <!-- contorno matrice -->
  <rect x="345" y="95" width="190" height="120" fill="none" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- righe della matrice -->
  <line x1="345" y1="125" x2="535" y2="125" stroke="#1A1A1A" stroke-width="0.7" stroke-opacity="0.35"/>
  <line x1="345" y1="155" x2="535" y2="155" stroke="#1A1A1A" stroke-width="0.7" stroke-opacity="0.35"/>
  <line x1="345" y1="185" x2="535" y2="185" stroke="#1A1A1A" stroke-width="0.7" stroke-opacity="0.35"/>
  <!-- colonne (accennate) -->
  <line x1="376" y1="95" x2="376" y2="215" stroke="#1A1A1A" stroke-width="0.7" stroke-opacity="0.25"/>
  <line x1="408" y1="95" x2="408" y2="215" stroke="#1A1A1A" stroke-width="0.7" stroke-opacity="0.25"/>
  <line x1="471" y1="95" x2="471" y2="215" stroke="#1A1A1A" stroke-width="0.7" stroke-opacity="0.25"/>
  <line x1="503" y1="95" x2="503" y2="215" stroke="#1A1A1A" stroke-width="0.7" stroke-opacity="0.25"/>
  <!-- taglio centrale -->
  <line x1="440" y1="88" x2="440" y2="222" stroke="#B5532C" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- etichette meta -->
  <text x="392" y="234" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D5A5C">GPU 0</text>
  <text x="488" y="234" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#B5532C">GPU 1</text>
  <!-- freccia verso all-gather -->
  <line x1="440" y1="240" x2="440" y2="256" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#frn)"/>
  <rect x="372" y="259" width="136" height="24" rx="12" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.6"/>
  <text x="440" y="275" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B5532C">all-gather</text>
  <text x="440" y="303" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#1A1A1A">ricompone il risultato</text>

  <!-- ============ PANNELLO 3: PIPELINE ============ -->
  <!-- micro-batch in coda che entrano in GPU 0 -->
  <rect x="611" y="105" width="12" height="12" rx="2" fill="#B5532C" fill-opacity="0.75" stroke="#B5532C" stroke-width="0.8"/>
  <rect x="611" y="121" width="12" height="12" rx="2" fill="#C9A961" fill-opacity="0.8" stroke="#C9A961" stroke-width="0.8"/>
  <rect x="611" y="137" width="12" height="12" rx="2" fill="#2D5A5C" fill-opacity="0.7" stroke="#2D5A5C" stroke-width="0.8"/>
  <text x="617" y="163" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#1A1A1A">micro-batch</text>
  <line x1="625" y1="123" x2="653" y2="123" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#frn)"/>

  <!-- GPU 0: strati 1-2 -->
  <rect x="655" y="90" width="168" height="66" rx="9" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="739" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2D5A5C">GPU 0 &#183; strati 1&#8211;2</text>
  <rect x="672" y="118" width="134" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>
  <rect x="672" y="132" width="134" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>

  <!-- flusso di attivazioni verso GPU 1 -->
  <line x1="739" y1="158" x2="739" y2="206" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#frn)"/>
  <text x="752" y="186" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#1A1A1A">attivazioni</text>

  <!-- GPU 1: strati 3-4 -->
  <rect x="655" y="208" width="168" height="66" rx="9" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="739" y="226" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2D5A5C">GPU 1 &#183; strati 3&#8211;4</text>
  <rect x="672" y="236" width="134" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>
  <rect x="672" y="250" width="134" height="9" rx="2" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="1"/>

  <text x="730" y="299" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#1A1A1A">una catena di montaggio</text>
</svg>
