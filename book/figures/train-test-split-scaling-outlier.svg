<svg viewBox="0 0 800 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: dataset diviso in train e test, scaler tarato solo sul train e applicato a entrambi">
  <rect x="0" y="0" width="800" height="400" fill="#F8F5EE"/>
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Dividere e scalare senza barare</text>
  <rect x="150" y="55" width="500" height="44" fill="#F8F5EE" stroke="#C9A961" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1A1A1A">Dataset completo (100%)</text>
  <line x1="300" y1="99" x2="240" y2="150" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="500" y1="99" x2="580" y2="150" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="80" y="152" width="330" height="46" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="245" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#F8F5EE">Train (80%)</text>
  <rect x="490" y="152" width="200" height="46" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="590" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#F8F5EE">Test (20%)</text>
  <line x1="245" y1="198" x2="310" y2="256" stroke="#B5532C" stroke-width="2"/>
  <text x="222" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B5532C">fit</text>
  <rect x="320" y="258" width="160" height="44" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="400" y="279" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">StandardScaler</text>
  <text x="400" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">media, deviazione</text>
  <line x1="350" y1="302" x2="245" y2="352" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="256" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">transform</text>
  <line x1="450" y1="302" x2="555" y2="352" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="548" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">transform</text>
  <rect x="120" y="354" width="250" height="34" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="245" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">Train scalato (media 0, dev 1)</text>
  <rect x="440" y="354" width="230" height="34" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="555" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">Test scalato (stesse statistiche)</text>
</svg>
