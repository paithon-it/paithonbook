<svg viewBox="0 0 760 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sequenza di quattro riquadri da rumore puro a immagine nitida: la freccia in alto verso destra mostra il denoising in fase di generazione, la freccia in basso verso sinistra mostra l'aggiunta di rumore in fase di addestramento">
  <defs>
    <marker id="df-t" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#B5532C"/></marker>
    <marker id="df-e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2D5A5C"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="#F8F5EE"/>
  <text x="380" y="36" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Dal rumore all'immagine, un passo alla volta</text>
  <!-- riquadro 1: rumore puro -->
  <rect x="40" y="100" width="130" height="130" rx="6" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <g fill="#1A1A1A">
    <circle cx="60" cy="118" r="2.5"/><circle cx="88" cy="112" r="2.5"/><circle cx="120" cy="122" r="2.5"/><circle cx="150" cy="114" r="2.5"/>
    <circle cx="52" cy="146" r="2.5"/><circle cx="80" cy="152" r="2.5"/><circle cx="110" cy="140" r="2.5"/><circle cx="142" cy="150" r="2.5"/>
    <circle cx="66" cy="178" r="2.5"/><circle cx="96" cy="184" r="2.5"/><circle cx="126" cy="172" r="2.5"/><circle cx="156" cy="182" r="2.5"/>
    <circle cx="56" cy="210" r="2.5"/><circle cx="86" cy="204" r="2.5"/><circle cx="116" cy="214" r="2.5"/><circle cx="148" cy="208" r="2.5"/>
  </g>
  <text x="105" y="256" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">rumore puro</text>
  <!-- riquadro 2: forme vaghe -->
  <rect x="225" y="100" width="130" height="130" rx="6" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="290" cy="150" r="26" fill="none" stroke="#C9A961" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M240,212 L268,186 L296,206 L322,182 L344,212" fill="none" stroke="#C9A961" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#1A1A1A" opacity="0.5">
    <circle cx="250" cy="120" r="2.5"/><circle cx="300" cy="114" r="2.5"/><circle cx="336" cy="130" r="2.5"/>
    <circle cx="244" cy="170" r="2.5"/><circle cx="330" cy="164" r="2.5"/><circle cx="280" cy="222" r="2.5"/>
  </g>
  <text x="290" y="256" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">forme vaghe</text>
  <!-- riquadro 3: quasi nitida -->
  <rect x="410" y="100" width="130" height="130" rx="6" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="475" cy="146" r="24" fill="none" stroke="#C9A961" stroke-width="2"/>
  <path d="M424,214 L452,184 L480,206 L508,180 L528,214" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <g fill="#1A1A1A" opacity="0.25">
    <circle cx="432" cy="118" r="2.5"/><circle cx="516" cy="126" r="2.5"/><circle cx="446" cy="160" r="2.5"/>
  </g>
  <text x="475" y="256" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">quasi nitida</text>
  <!-- riquadro 4: immagine finale -->
  <rect x="595" y="100" width="130" height="130" rx="6" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="660" cy="144" r="24" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M609,214 L637,182 L665,206 L693,178 L713,214 Z" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="609" y1="215" x2="713" y2="215" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="660" y="256" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">immagine</text>
  <!-- frecce denoising -->
  <line x1="175" y1="150" x2="220" y2="150" stroke="#B5532C" stroke-width="2" marker-end="url(#df-t)"/>
  <line x1="360" y1="150" x2="405" y2="150" stroke="#B5532C" stroke-width="2" marker-end="url(#df-t)"/>
  <line x1="545" y1="150" x2="590" y2="150" stroke="#B5532C" stroke-width="2" marker-end="url(#df-t)"/>
  <text x="380" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#B5532C" text-anchor="middle">generazione: la rete toglie rumore a ogni passo →</text>
  <!-- freccia forward (training) -->
  <path d="M660,286 L110,286" fill="none" stroke="#2D5A5C" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#df-e)"/>
  <text x="380" y="316" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#2D5A5C" text-anchor="middle">← addestramento: si aggiunge rumore a immagini vere (processo noto, nessuna rete)</text>
</svg>
