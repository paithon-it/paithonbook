<svg viewBox="0 0 780 310" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La stessa foto con tre output: etichetta di classificazione, bounding box di detection, maschera di segmentazione">
  <rect x="0" y="0" width="780" height="310" fill="#F8F5EE"/>
  <text x="130" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Classificazione</text>
  <text x="390" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Detection</text>
  <text x="650" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Segmentazione</text>

  <!-- Pannello 1: classificazione -->
  <rect x="20" y="42" width="220" height="180" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="20" y1="182" x2="240" y2="182" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="110" cy="165" rx="38" ry="20" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="152" cy="142" r="15" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="146,130 152,116 158,130" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="88" y1="183" x2="88" y2="200" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="128" y1="183" x2="128" y2="200" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="72" y1="160" x2="56" y2="146" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="200" cy="172" r="12" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="130" y="252" font-family="sans-serif" font-size="15" fill="#B5532C" text-anchor="middle" font-weight="bold">«cane»: 0.92</text>
  <text x="130" y="274" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">un'etichetta per tutta l'immagine</text>

  <!-- Pannello 2: detection -->
  <rect x="280" y="42" width="220" height="180" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="280" y1="182" x2="500" y2="182" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="370" cy="165" rx="38" ry="20" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="412" cy="142" r="15" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="406,130 412,116 418,130" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="348" y1="183" x2="348" y2="200" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="388" y1="183" x2="388" y2="200" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="332" y1="160" x2="316" y2="146" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="460" cy="172" r="12" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="310" y="110" width="124" height="96" fill="none" stroke="#B5532C" stroke-width="2"/>
  <text x="312" y="104" font-family="sans-serif" font-size="11" fill="#B5532C">cane 0.91</text>
  <rect x="444" y="156" width="34" height="32" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="443" y="150" font-family="sans-serif" font-size="11" fill="#2D5A5C">palla 0.88</text>
  <text x="390" y="252" font-family="sans-serif" font-size="15" fill="#B5532C" text-anchor="middle" font-weight="bold">riquadri + etichette</text>
  <text x="390" y="274" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">che cosa e dove</text>

  <!-- Pannello 3: segmentazione -->
  <rect x="540" y="42" width="220" height="180" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="541" y="182" width="218" height="39" fill="#2D5A5C"/>
  <ellipse cx="630" cy="165" rx="38" ry="20" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="672" cy="142" r="15" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="666,130 672,116 678,130" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="605" y="180" width="6" height="20" fill="#B5532C"/>
  <rect x="645" y="180" width="6" height="20" fill="#B5532C"/>
  <line x1="592" y1="160" x2="576" y2="146" stroke="#B5532C" stroke-width="4"/>
  <circle cx="720" cy="172" r="12" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="650" y="252" font-family="sans-serif" font-size="15" fill="#B5532C" text-anchor="middle" font-weight="bold">una classe per pixel</text>
  <text x="650" y="274" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">sagome esatte, non riquadri</text>
</svg>
