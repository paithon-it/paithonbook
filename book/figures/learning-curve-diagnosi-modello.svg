<svg viewBox="0 0 800 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: due learning curve a confronto, high bias con curve convergenti in basso e high variance con divario ampio tra train e validazione">
  <rect x="0" y="0" width="800" height="360" fill="#F8F5EE"/>
  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Leggere una learning curve: due diagnosi</text>
  <text x="210" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">High bias (underfitting)</text>
  <line x1="70" y1="280" x2="360" y2="280" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="70" y1="280" x2="70" y2="80" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="215" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">esempi di addestramento →</text>
  <text x="55" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A" transform="rotate(-90 55 180)">punteggio →</text>
  <path d="M 85 95 C 140 150, 200 175, 350 180" fill="none" stroke="#B5532C" stroke-width="2"/>
  <path d="M 85 265 C 140 215, 200 195, 350 190" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <line x1="70" y1="185" x2="360" y2="185" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="215" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B5532C">train</text>
  <text x="215" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2D5A5C">validazione</text>
  <text x="215" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">convergono presto, ma in basso:</text>
  <text x="215" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1A1A">più dati NON aiutano</text>
  <text x="590" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">High variance (overfitting)</text>
  <line x1="450" y1="280" x2="740" y2="280" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="450" y1="280" x2="450" y2="80" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="595" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">esempi di addestramento →</text>
  <path d="M 465 90 C 540 92, 620 95, 730 98" fill="none" stroke="#B5532C" stroke-width="2"/>
  <path d="M 465 265 C 540 225, 620 200, 730 185" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <line x1="700" y1="100" x2="700" y2="188" stroke="#C9A961" stroke-width="2"/>
  <polygon points="700,100 694,112 706,112" fill="#C9A961"/>
  <polygon points="700,188 694,176 706,176" fill="#C9A961"/>
  <text x="672" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">divario</text>
  <text x="560" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B5532C">train</text>
  <text x="560" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2D5A5C">validazione</text>
  <text x="595" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1A1A">la validazione sale ancora: più dati (o regolarizzazione) aiutano</text>
  <text x="215" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1A1A">serve un modello più espressivo o feature migliori</text>
</svg>
