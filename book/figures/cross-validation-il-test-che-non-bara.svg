<svg viewBox="0 0 600 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema della 5-fold cross-validation: il fold di test ruota a ogni iterazione">
  <rect x="0" y="0" width="600" height="340" fill="#F8F5EE"/>
  <text x="300" y="30" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">5-fold cross-validation: il test ruota</text>
  <!-- legend -->
  <rect x="150" y="46" width="18" height="14" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="174" y="58" font-family="sans-serif" font-size="12" fill="#1A1A1A">training</text>
  <rect x="250" y="46" width="18" height="14" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="274" y="58" font-family="sans-serif" font-size="12" fill="#1A1A1A">test</text>
  <!-- rows: each iteration, 5 folds of width 76 starting x=120 -->
  <!-- iter 1 -->
  <text x="105" y="102" font-family="sans-serif" font-size="13" fill="#5E5852" text-anchor="end">giro 1</text>
  <rect x="120" y="86" width="76" height="24" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="196" y="86" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="272" y="86" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="348" y="86" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="424" y="86" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="522" y="102" font-family="sans-serif" font-size="12" fill="#5E5852">score₁</text>
  <!-- iter 2 -->
  <text x="105" y="146" font-family="sans-serif" font-size="13" fill="#5E5852" text-anchor="end">giro 2</text>
  <rect x="120" y="130" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="196" y="130" width="76" height="24" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="272" y="130" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="348" y="130" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="424" y="130" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="522" y="146" font-family="sans-serif" font-size="12" fill="#5E5852">score₂</text>
  <!-- iter 3 -->
  <text x="105" y="190" font-family="sans-serif" font-size="13" fill="#5E5852" text-anchor="end">giro 3</text>
  <rect x="120" y="174" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="196" y="174" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="272" y="174" width="76" height="24" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="348" y="174" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="424" y="174" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="522" y="190" font-family="sans-serif" font-size="12" fill="#5E5852">score₃</text>
  <!-- iter 4 -->
  <text x="105" y="234" font-family="sans-serif" font-size="13" fill="#5E5852" text-anchor="end">giro 4</text>
  <rect x="120" y="218" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="196" y="218" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="272" y="218" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="348" y="218" width="76" height="24" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="424" y="218" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="522" y="234" font-family="sans-serif" font-size="12" fill="#5E5852">score₄</text>
  <!-- iter 5 -->
  <text x="105" y="278" font-family="sans-serif" font-size="13" fill="#5E5852" text-anchor="end">giro 5</text>
  <rect x="120" y="262" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="196" y="262" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="272" y="262" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="348" y="262" width="76" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="424" y="262" width="76" height="24" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="522" y="278" font-family="sans-serif" font-size="12" fill="#5E5852">score₅</text>
  <!-- summary -->
  <text x="300" y="320" font-family="sans-serif" font-size="14" fill="#C9A961" text-anchor="middle" font-weight="bold">risultato = media ± deviazione standard dei 5 score</text>
</svg>
