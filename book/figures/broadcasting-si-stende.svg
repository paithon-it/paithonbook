:fa3 var(--d) infinite">ogni cella somma i due valori che legge</text><text class="lbs" x="30" y="430">Dodici celle, sette numeri veri: a è riletto per ogni riga, b per ogni colonna.</text><text class="lbs" x="30" y="450">Le caselle tratteggiate sono letture, non copie: nulla viene ricopiato in memoria.</text>
