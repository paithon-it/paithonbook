<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 470"
     role="img" aria-label="Una riga di quattro numeri (10, 20, 30, 40) sta sopra una griglia vuota di tre righe per quattro colonne, e una colonna di tre numeri (1, 2, 3) sta alla sua sinistra. La riga scende di riga in riga e lascia in ogni cella una casella tratteggiata con il proprio valore; poi la colonna attraversa le colonne e lascia accanto la seconda casella tratteggiata. Infine ogni cella si riempie con la somma dei due valori che legge, dando la matrice tre per quattro da 11 a 43. I due array di partenza restano al loro posto: le caselle tratteggiate sono letture ripetute dello stesso dato, non copie in memoria, perché sul lato trasmesso lo stride vale zero.">
