<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paithon Book, figura animata: l'algoritmo di Winograd F(2,3), quattro moltiplicazioni invece di sei
  Generata da animazioni/svg/miscele-di-winograd.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380"
     role="img" aria-label="Animazione in quattro tempi. In alto una striscia di quattro caselle teal con 1, 2, 3, 4 e uno stampino di tre caselle terracotta con 1, 2, 3. Poi compaiono quattro coppie di caselle: le miscele della striscia, meno 2, 5, 1 e meno 2, fatte di sole somme e differenze, accanto alle miscele dello stampino, 1, 3, 1 e 3. Poi, sotto ogni coppia, un cerchio ocra con il prodotto: meno 2, 15, 1 e meno 6, e la scritta quattro moltiplicazioni, il conto diretto ne fa sei. Infine le due uscite: meno 2 più 15 più 1 fa 14, e 15 meno 1 meno meno 6 fa 20.">
  <style>
    svg  { --d: 8.8s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .cd   { fill:none; stroke:#2D5A5C; stroke-width:2; }
    .cg   { fill:none; stroke:#B5532C; stroke-width:2; }
    .val  { font-family:Inter, system-ui, sans-serif; font-size:19px; font-weight:700; fill:#1A1A1A; }
    .prod { fill:none; stroke:#C9A961; stroke-width:2.6; }
    .filo { stroke:#C5BEAA; stroke-width:1.2; }
    .per  { font-family:Inter, system-ui, sans-serif; font-size:18px; fill:#5A524A; }
    .cont { font-family:Inter, system-ui, sans-serif; font-size:15px; font-weight:700; fill:#C9A961; }
    .espr { font-family:Inter, system-ui, sans-serif; font-size:17px; fill:#1A1A1A; }
    .usc  { font-weight:700; fill:#B5532C; }
        @keyframes t1{0.00%{opacity:0}24.00%{opacity:0}27.00%{opacity:1}100.00%{opacity:1}}
    @keyframes t2{0.00%{opacity:0}49.00%{opacity:0}52.00%{opacity:1}100.00%{opacity:1}}
    @keyframes t3{0.00%{opacity:0}74.00%{opacity:0}77.00%{opacity:1}100.00%{opacity:1}}
    @media (prefers-reduced-motion:reduce) { g { animation:none !important; } }
  </style>
  <g><text class="lbl" x="40" y="68">striscia</text><rect class="cd" x="110.0" y="42.0" width="40" height="40" rx="4"/><text class="val" x="130.0" y="69.0" text-anchor="middle">1</text><rect class="cd" x="154.0" y="42.0" width="40" height="40" rx="4"/><text class="val" x="174.0" y="69.0" text-anchor="middle">2</text><rect class="cd" x="198.0" y="42.0" width="40" height="40" rx="4"/><text class="val" x="218.0" y="69.0" text-anchor="middle">3</text><rect class="cd" x="242.0" y="42.0" width="40" height="40" rx="4"/><text class="val" x="262.0" y="69.0" text-anchor="middle">4</text><text class="lbl" x="420" y="68">stampino</text><rect class="cg" x="510.0" y="42.0" width="40" height="40" rx="4"/><text class="val" x="530.0" y="69.0" text-anchor="middle">1</text><rect class="cg" x="554.0" y="42.0" width="40" height="40" rx="4"/><text class="val" x="574.0" y="69.0" text-anchor="middle">2</text><rect class="cg" x="598.0" y="42.0" width="40" height="40" rx="4"/><text class="val" x="618.0" y="69.0" text-anchor="middle">3</text></g><g style="animation:t1 var(--d) infinite"><text class="lbs" x="40" y="175">miscele</text><text class="lbs" x="124" y="142" text-anchor="middle">1−3</text><text class="lbs" x="176" y="208" text-anchor="middle">1</text><rect class="cd" x="104.0" y="150.0" width="40" height="40" rx="4"/><text class="val" x="124.0" y="177.0" text-anchor="middle">−2</text><rect class="cg" x="156.0" y="150.0" width="40" height="40" rx="4"/><text class="val" x="176.0" y="177.0" text-anchor="middle">1</text><text class="lbs" x="274" y="142" text-anchor="middle">2+3</text><text class="lbs" x="326" y="208" text-anchor="middle">(1+2+3)/2</text><rect class="cd" x="254.0" y="150.0" width="40" height="40" rx="4"/><text class="val" x="274.0" y="177.0" text-anchor="middle">5</text><rect class="cg" x="306.0" y="150.0" width="40" height="40" rx="4"/><text class="val" x="326.0" y="177.0" text-anchor="middle">3</text><text class="lbs" x="424" y="142" text-anchor="middle">3−2</text><text class="lbs" x="476" y="208" text-anchor="middle">(1−2+3)/2</text><rect class="cd" x="404.0" y="150.0" width="40" height="40" rx="4"/><text class="val" x="424.0" y="177.0" text-anchor="middle">1</text><rect class="cg" x="456.0" y="150.0" width="40" height="40" rx="4"/><text class="val" x="476.0" y="177.0" text-anchor="middle">1</text><text class="lbs" x="574" y="142" text-anchor="middle">2−4</text><text class="lbs" x="626" y="208" text-anchor="middle">3</text><rect class="cd" x="554.0" y="150.0" width="40" height="40" rx="4"/><text class="val" x="574.0" y="177.0" text-anchor="middle">−2</text><rect class="cg" x="606.0" y="150.0" width="40" height="40" rx="4"/><text class="val" x="626.0" y="177.0" text-anchor="middle">3</text></g><g style="animation:t2 var(--d) infinite"><text class="lbs" x="40" y="277">prodotti</text><line class="filo" x1="150" y1="212.0" x2="150" y2="250"/><text class="per" x="150" y="176" text-anchor="middle">×</text><circle class="prod" cx="150" cy="272" r="21"/><text class="val" x="150" y="279" text-anchor="middle">−2</text><line class="filo" x1="300" y1="212.0" x2="300" y2="250"/><text class="per" x="300" y="176" text-anchor="middle">×</text><circle class="prod" cx="300" cy="272" r="21"/><text class="val" x="300" y="279" text-anchor="middle">15</text><line class="filo" x1="450" y1="212.0" x2="450" y2="250"/><text class="per" x="450" y="176" text-anchor="middle">×</text><circle class="prod" cx="450" cy="272" r="21"/><text class="val" x="450" y="279" text-anchor="middle">1</text><line class="filo" x1="600" y1="212.0" x2="600" y2="250"/><text class="per" x="600" y="176" text-anchor="middle">×</text><circle class="prod" cx="600" cy="272" r="21"/><text class="val" x="600" y="279" text-anchor="middle">−6</text><text class="cont" x="660" y="278">4 moltiplicazioni</text><text class="lbs" x="660" y="296">il conto diretto ne fa 6</text></g><g style="animation:t3 var(--d) infinite"><text class="lbs" x="40" y="355">uscite</text><text class="espr" x="120.0" y="356">(−2) + 15 + 1 = <tspan class="usc">14</tspan></text><text class="espr" x="420.0" y="356">15 − 1 − (−6) = <tspan class="usc">20</tspan></text></g>
</svg>
