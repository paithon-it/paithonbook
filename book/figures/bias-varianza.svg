<svg viewBox="0 0 660 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quattro bersagli che illustrano le combinazioni di bias e varianza">
  <rect width="660" height="560" fill="#F8F5EE"/>
  <text x="205" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1A1A1A" font-weight="bold">varianza bassa</text>
  <text x="490" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1A1A1A" font-weight="bold">varianza alta</text>
  <text x="28" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1A1A1A" font-weight="bold" transform="rotate(-90 28 170)">bias basso</text>
  <text x="28" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1A1A1A" font-weight="bold" transform="rotate(-90 28 420)">bias alto</text>

  <!-- bias basso, varianza bassa -->
  <g>
    <circle cx="205" cy="170" r="90" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="205" cy="170" r="58" fill="none" stroke="#C9A961" stroke-width="1.5"/>
    <circle cx="205" cy="170" r="26" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
    <circle cx="205" cy="170" r="4" fill="#1A1A1A"/>
    <circle cx="198" cy="164" r="6" fill="#B5532C"/>
    <circle cx="212" cy="176" r="6" fill="#B5532C"/>
    <circle cx="200" cy="180" r="6" fill="#B5532C"/>
    <circle cx="213" cy="162" r="6" fill="#B5532C"/>
    <circle cx="205" cy="158" r="6" fill="#B5532C"/>
  </g>

  <!-- bias basso, varianza alta -->
  <g>
    <circle cx="490" cy="170" r="90" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="490" cy="170" r="58" fill="none" stroke="#C9A961" stroke-width="1.5"/>
    <circle cx="490" cy="170" r="26" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
    <circle cx="490" cy="170" r="4" fill="#1A1A1A"/>
    <circle cx="440" cy="130" r="6" fill="#B5532C"/>
    <circle cx="545" cy="150" r="6" fill="#B5532C"/>
    <circle cx="470" cy="225" r="6" fill="#B5532C"/>
    <circle cx="525" cy="215" r="6" fill="#B5532C"/>
    <circle cx="455" cy="180" r="6" fill="#B5532C"/>
    <circle cx="505" cy="105" r="6" fill="#B5532C"/>
  </g>

  <!-- bias alto, varianza bassa -->
  <g>
    <circle cx="205" cy="420" r="90" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="205" cy="420" r="58" fill="none" stroke="#C9A961" stroke-width="1.5"/>
    <circle cx="205" cy="420" r="26" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
    <circle cx="205" cy="420" r="4" fill="#1A1A1A"/>
    <circle cx="150" cy="378" r="6" fill="#B5532C"/>
    <circle cx="163" cy="370" r="6" fill="#B5532C"/>
    <circle cx="152" cy="392" r="6" fill="#B5532C"/>
    <circle cx="165" cy="384" r="6" fill="#B5532C"/>
    <circle cx="158" cy="380" r="6" fill="#B5532C"/>
  </g>

  <!-- bias alto, varianza alta -->
  <g>
    <circle cx="490" cy="420" r="90" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="490" cy="420" r="58" fill="none" stroke="#C9A961" stroke-width="1.5"/>
    <circle cx="490" cy="420" r="26" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
    <circle cx="490" cy="420" r="4" fill="#1A1A1A"/>
    <circle cx="425" cy="360" r="6" fill="#B5532C"/>
    <circle cx="470" cy="345" r="6" fill="#B5532C"/>
    <circle cx="418" cy="415" r="6" fill="#B5532C"/>
    <circle cx="462" cy="392" r="6" fill="#B5532C"/>
    <circle cx="510" cy="352" r="6" fill="#B5532C"/>
  </g>
</svg>
