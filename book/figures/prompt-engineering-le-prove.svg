<svg viewBox="0 0 720 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tecniche di prompting classificate per forza dell'evidenza">
  <rect width="720" height="470" fill="#F8F5EE"/>
  <!-- evidence axis -->
  <line x1="60" y1="420" x2="60" y2="55" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="52,67 68,67 60,52" fill="#1A1A1A"/>
  <text x="30" y="240" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle" transform="rotate(-90 30 240)">forza dell'evidenza</text>
  <!-- Band A: solid -->
  <rect x="90" y="60" width="600" height="110" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="106" y="86" font-family="sans-serif" font-size="16" fill="#2D5A5C" font-weight="600">Prove solide</text>
  <rect x="106" y="112" width="170" height="34" rx="17" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="191" y="134" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">esempi (few-shot)</text>
  <rect x="292" y="112" width="170" height="34" rx="17" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="377" y="134" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">formato esplicito</text>
  <rect x="478" y="112" width="196" height="34" rx="17" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="576" y="134" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">catena di pensiero</text>
  <!-- Band B: hints -->
  <rect x="90" y="185" width="600" height="110" rx="8" fill="#F8F5EE" stroke="#C9A961" stroke-width="2"/>
  <text x="106" y="211" font-family="sans-serif" font-size="16" fill="#B5532C" font-weight="600">Indizi promettenti</text>
  <rect x="106" y="237" width="170" height="34" rx="17" fill="#F8F5EE" stroke="#C9A961" stroke-width="1.5"/>
  <text x="191" y="259" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">self-consistency</text>
  <rect x="292" y="237" width="170" height="34" rx="17" fill="#F8F5EE" stroke="#C9A961" stroke-width="1.5"/>
  <text x="377" y="259" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">decomposizione</text>
  <rect x="478" y="237" width="196" height="34" rx="17" fill="#F8F5EE" stroke="#C9A961" stroke-width="1.5"/>
  <text x="576" y="259" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">role prompt</text>
  <!-- Band C: folklore -->
  <rect x="90" y="310" width="600" height="110" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="106" y="336" font-family="sans-serif" font-size="16" fill="#B5532C" font-weight="600">Folklore</text>
  <rect x="106" y="362" width="180" height="34" rx="17" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="196" y="384" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">«esperto mondiale»</text>
  <rect x="302" y="362" width="180" height="34" rx="17" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="392" y="384" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">mance e minacce</text>
  <rect x="498" y="362" width="176" height="34" rx="17" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="586" y="384" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">cortesia / emozioni</text>
</svg>
