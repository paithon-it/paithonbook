<svg viewBox="0 0 640 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di un albero di decisione con split successivi">
  <rect x="0" y="0" width="640" height="400" fill="#F8F5EE"/>
  <line x1="320" y1="88" x2="180" y2="160" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="320" y1="88" x2="460" y2="160" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="180" y1="208" x2="100" y2="280" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="180" y1="208" x2="260" y2="280" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="460" y1="208" x2="390" y2="280" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="460" y1="208" x2="530" y2="280" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="230" y="40" width="180" height="48" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="320" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">reddito &gt; 30k?</text>
  <text x="320" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B5532C">nodo radice</text>
  <text x="235" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2D5A5C">sì</text>
  <text x="405" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B5532C">no</text>
  <rect x="95" y="160" width="170" height="48" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">età &gt; 40?</text>
  <text x="180" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2D5A5C">nodo interno</text>
  <rect x="375" y="160" width="170" height="48" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="460" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">rate in corso?</text>
  <text x="460" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2D5A5C">nodo interno</text>
  <rect x="45" y="280" width="110" height="44" rx="22" fill="#2D5A5C"/>
  <text x="100" y="307" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F8F5EE">approva</text>
  <rect x="205" y="280" width="110" height="44" rx="22" fill="#C9A961"/>
  <text x="260" y="307" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">verifica</text>
  <rect x="335" y="280" width="110" height="44" rx="22" fill="#B5532C"/>
  <text x="390" y="307" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F8F5EE">rifiuta</text>
  <rect x="475" y="280" width="110" height="44" rx="22" fill="#C9A961"/>
  <text x="530" y="307" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">verifica</text>
  <text x="320" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">ogni split divide i dati; le foglie colorate sono le decisioni finali</text>
</svg>
