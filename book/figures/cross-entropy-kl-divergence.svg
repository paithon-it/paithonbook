<svg viewBox="0 0 720 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Due distribuzioni sovrapposte: p, la realtà, in teal e q, il modello, in terracotta; lo scarto tra le due è ciò che la KL divergence misura">
  <rect x="0" y="0" width="720" height="400" fill="#F8F5EE"/>
  <!-- assi -->
  <line x1="60" y1="310" x2="670" y2="310" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="60" y1="310" x2="60" y2="50" stroke="#1A1A1A" stroke-width="2"/>
  <text x="365" y="345" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">parole del vocabolario</text>
  <text x="30" y="180" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle" transform="rotate(-90 30 180)">probabilità</text>
  <!-- p: la realtà (teal, riempita) -->
  <path d="M 80 310 C 150 306, 200 260, 250 160 C 285 92, 320 70, 350 70 C 380 70, 415 92, 450 160 C 500 260, 550 306, 620 310 Z" fill="#2D5A5C" fill-opacity="0.30" stroke="#2D5A5C" stroke-width="2"/>
  <!-- q: il modello (terracotta, spostata e più stretta) -->
  <path d="M 180 310 C 240 306, 285 270, 325 190 C 355 130, 385 112, 410 112 C 435 112, 465 130, 495 190 C 535 270, 580 306, 640 310 Z" fill="#B5532C" fill-opacity="0.30" stroke="#B5532C" stroke-width="2"/>
  <!-- freccia dello scarto tra i picchi -->
  <line x1="350" y1="58" x2="410" y2="58" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="350" y1="53" x2="350" y2="63" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="410" y1="53" x2="410" y2="63" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="380" y="46" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">scarto</text>
  <!-- zona critica: coda di p ignorata da q -->
  <circle cx="150" cy="290" r="5" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="150" y="272" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">qui p esiste, q quasi no:</text>
  <text x="150" y="257" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">la KL esplode</text>
  <!-- legenda -->
  <rect x="480" y="66" width="18" height="18" fill="#2D5A5C" fill-opacity="0.30" stroke="#2D5A5C" stroke-width="2"/>
  <text x="506" y="80" font-family="sans-serif" font-size="13" fill="#1A1A1A">p — la realtà</text>
  <rect x="480" y="94" width="18" height="18" fill="#B5532C" fill-opacity="0.30" stroke="#B5532C" stroke-width="2"/>
  <text x="506" y="108" font-family="sans-serif" font-size="13" fill="#1A1A1A">q — il modello</text>
  <!-- formula -->
  <text x="365" y="380" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">KL(p ∥ q) = H(p, q) − H(p)  ≥ 0</text>
</svg>
