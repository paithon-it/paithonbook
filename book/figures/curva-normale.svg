<?xml version="1.0" encoding="UTF-8"?>
<!--
  paithon book, figura: curva a campana della distribuzione normale.
  Media mu al centro, bande evidenziate a mu +/- sigma (circa 68%) e
  mu +/- 2 sigma (circa 95%). Palette-locked: terracotta/ocra/teal su
  tratto warm-black, fondo trasparente (leggibile in light e dark).
  Nessun colore fuori palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" role="img"
     aria-label="Curva normale a campana con media mu al centro e bande a mu piu o meno sigma (circa 68%) e mu piu o meno 2 sigma (circa 95%)">
  <style>
    .axis  { stroke:#8B847C; stroke-width:1.5; }
    .curve { fill:none; stroke:#2D5A5C; stroke-width:3; stroke-linejoin:round; }
    .dash  { stroke:#8B847C; stroke-width:1.2; stroke-dasharray:3 4; }
    .mud   { stroke:#1A1A1A; stroke-width:1.4; stroke-dasharray:2 3; }
    .lbl   { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5E5852; }
    .pct   { font-family:Inter, system-ui, sans-serif; font-size:15px; font-weight:600; }
    .axlbl { font-family:Fraunces, Georgia, serif; font-size:15px; fill:#5E5852; font-style:italic; }
  </style>

  <!-- bande laterali (mu+/-sigma .. mu+/-2sigma), ocra -->
  <path d="M 140,250 L 140,222.9 L 160,197.6 L 180,161.0 L 195,128.7 L 195,250 Z" fill="#C9A961" opacity="0.45"/>
  <path d="M 305,250 L 305,128.7 L 320,161.0 L 340,197.6 L 360,222.9 L 360,250 Z" fill="#C9A961" opacity="0.45"/>

  <!-- banda centrale (mu+/-sigma), terracotta -->
  <path d="M 195,250 L 195,128.7 L 215,86.7 L 235,57.3 L 250,50 L 265,57.3 L 285,86.7 L 305,128.7 L 305,250 Z" fill="#B5532C" opacity="0.35"/>

  <!-- verticali di riferimento -->
  <line class="dash" x1="140" y1="250" x2="140" y2="222.9"/>
  <line class="dash" x1="195" y1="250" x2="195" y2="128.7"/>
  <line class="dash" x1="305" y1="250" x2="305" y2="128.7"/>
  <line class="dash" x1="360" y1="250" x2="360" y2="222.9"/>
  <line class="mud"  x1="250" y1="250" x2="250" y2="50"/>

  <!-- curva a campana -->
  <path class="curve" d="M 85,247.8 L 105,243.8 L 125,234.9 L 140,222.9 L 160,197.6 L 180,161.0 L 195,128.7 L 215,86.7 L 235,57.3 L 250,50 L 265,57.3 L 285,86.7 L 305,128.7 L 320,161.0 L 340,197.6 L 360,222.9 L 380,237.8 L 400,245.1 L 415,247.8"/>

  <!-- assi -->
  <line class="axis" x1="50" y1="250" x2="470" y2="250"/>
  <line class="axis" x1="50" y1="250" x2="50"  y2="45"/>
  <polygon points="470,250 460,245 460,255" fill="#8B847C"/>
  <polygon points="50,45 45,55 55,55" fill="#8B847C"/>
  <text class="axlbl" x="58" y="52">f(x)</text>
  <text class="axlbl" x="474" y="255">x</text>

  <!-- annotazione 68% dentro la banda centrale -->
  <text class="pct" x="250" y="205" text-anchor="middle" fill="#1A1A1A">&#8776;68%</text>

  <!-- etichette sull'asse -->
  <text class="lbl" x="140" y="267" text-anchor="middle">&#956;&#8722;2&#963;</text>
  <text class="lbl" x="195" y="267" text-anchor="middle">&#956;&#8722;&#963;</text>
  <text class="lbl" x="250" y="267" text-anchor="middle" style="fill:#1A1A1A">&#956;</text>
  <text class="lbl" x="305" y="267" text-anchor="middle">&#956;+&#963;</text>
  <text class="lbl" x="360" y="267" text-anchor="middle">&#956;+2&#963;</text>

  <!-- graffa 95% -->
  <path d="M 140,284 L 140,290 L 360,290 L 360,284" fill="none" stroke="#5E5852" stroke-width="1.2"/>
  <text class="pct" x="250" y="305" text-anchor="middle" fill="#5E5852">&#8776;95%</text>
</svg>
