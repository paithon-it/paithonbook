<svg viewBox="0 0 680 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema RLHF: gli esseri umani ordinano più risposte per preferenza; da questi ordinamenti si addestra un reward model che assegna punteggi; il reward model guida l'ottimizzazione della policy del modello linguistico">
  <rect x="0" y="0" width="680" height="320" fill="#F8F5EE"/>
  <!-- Preferenze umane -->
  <rect x="24" y="60" width="180" height="200" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="114" y="86" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold">preferenze umane</text>
  <rect x="44" y="104" width="140" height="34" rx="5" fill="#2D5A5C"/>
  <text x="114" y="126" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">risposta A  (migliore)</text>
  <rect x="44" y="148" width="140" height="30" rx="5" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="114" y="168" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">risposta B</text>
  <rect x="44" y="188" width="140" height="30" rx="5" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="114" y="208" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">risposta C</text>
  <text x="114" y="242" font-family="sans-serif" font-size="11" fill="#5E5852" text-anchor="middle">gli umani ordinano</text>
  <!-- freccia 1 -->
  <line x1="204" y1="160" x2="256" y2="160" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M256 160 l-10 -6 v12 z" fill="#1A1A1A"/>
  <!-- Reward model -->
  <rect x="258" y="110" width="160" height="100" rx="8" fill="#C9A961"/>
  <text x="338" y="150" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="bold">reward model</text>
  <text x="338" y="174" font-family="sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">impara a dare</text>
  <text x="338" y="190" font-family="sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">un punteggio</text>
  <!-- freccia 2 -->
  <line x1="418" y1="160" x2="470" y2="160" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M470 160 l-10 -6 v12 z" fill="#1A1A1A"/>
  <text x="444" y="150" font-family="sans-serif" font-size="10" fill="#5E5852" text-anchor="middle">reward</text>
  <!-- Policy allineata -->
  <rect x="472" y="110" width="184" height="100" rx="8" fill="none" stroke="#B5532C" stroke-width="2"/>
  <text x="564" y="148" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="bold">policy allineata</text>
  <text x="564" y="172" font-family="sans-serif" font-size="11" fill="#B5532C" text-anchor="middle">ottimizzata con PPO</text>
  <text x="564" y="190" font-family="sans-serif" font-size="11" fill="#B5532C" text-anchor="middle">per massimizzare il reward</text>
  <!-- freccia di ritorno: la policy genera risposte da giudicare -->
  <path d="M564 210 C 564 270, 338 270, 338 214" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M338 214 l-6 12 h12 z" fill="#1A1A1A"/>
  <text x="451" y="288" font-family="sans-serif" font-size="11" fill="#5E5852" text-anchor="middle">le nuove risposte tornano al giudizio del reward model</text>
</svg>
