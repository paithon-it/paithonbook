    .lb  { font-family:Inter, system-ui, sans-serif; font-size:12.5px; fill:#1A1A1A; }
    .ls  { font-family:Inter, system-ui, sans-serif; font-size:11.5px; fill:#5A524A; }
    
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
