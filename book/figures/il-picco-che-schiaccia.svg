<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372"
     role="img" aria-label="Due colonne a confronto. A sinistra, in alto, una corsia di sedici caselle disegnate come barrette sopra e sotto una mezzeria; in basso la stessa corsia dopo la taratura, che divide per quanto la corsia oscilla, e le barrette restano ben visibili. A destra la stessa corsia con una sola casella cambiata, un picco in terracotta molto più alto di tutte le altre barrette, con il suo valore, 8,0, scritto sopra perché la scala del disegno non arriva fin lì. Dopo la taratura, che ora divide per un numero molto più grande, tutte le altre barrette escono schiacciate, di poco più di tre volte, mentre il picco resta altissimo, col suo nuovo valore, 3,7, scritto sopra. In fondo il conto: l'ampiezza passa da 0,60 a 2,03 e il resto della corsia esce 3,4 volte più piccolo.">
