<svg viewBox="0 0 800 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Allineamento di traduzione appreso dall'attention: le parole italiane generate si collegano alle parole inglesi di origine con linee di spessore proporzionale al peso, incrociandosi dove l'ordine cambia">
  <rect x="0" y="0" width="800" height="340" fill="#F8F5EE"/>
  <text x="400" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">L'allineamento che il modello impara da solo</text>
  <!-- source (english) row -->
  <text x="70" y="85" font-family="sans-serif" font-size="12" fill="#5E5852">originale</text>
  <g font-family="sans-serif" font-size="14" text-anchor="middle">
    <rect x="150" y="60" width="110" height="38" rx="4" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="205" y="84" fill="#1A1A1A">the</text>
    <rect x="290" y="60" width="110" height="38" rx="4" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="345" y="84" fill="#1A1A1A">black</text>
    <rect x="430" y="60" width="110" height="38" rx="4" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="485" y="84" fill="#1A1A1A">cat</text>
    <rect x="570" y="60" width="110" height="38" rx="4" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="625" y="84" fill="#1A1A1A">sleeps</text>
  </g>
  <!-- attention lines: strong terracotta, weak ocra -->
  <g fill="none">
    <!-- il -> the (strong) -->
    <line x1="205" y1="98" x2="205" y2="240" stroke="#B5532C" stroke-width="4"/>
    <!-- gatto -> cat (strong, crossing) -->
    <line x1="485" y1="98" x2="345" y2="240" stroke="#B5532C" stroke-width="4"/>
    <!-- gatto -> black (weak) -->
    <line x1="345" y1="98" x2="345" y2="240" stroke="#C9A961" stroke-width="1.5"/>
    <!-- nero -> black (strong, crossing) -->
    <line x1="345" y1="98" x2="485" y2="240" stroke="#B5532C" stroke-width="4"/>
    <!-- nero -> cat (weak) -->
    <line x1="485" y1="98" x2="485" y2="240" stroke="#C9A961" stroke-width="1.5"/>
    <!-- dorme -> sleeps (strong) -->
    <line x1="625" y1="98" x2="625" y2="240" stroke="#B5532C" stroke-width="4"/>
  </g>
  <!-- target (italian) row -->
  <text x="70" y="265" font-family="sans-serif" font-size="12" fill="#5E5852">traduzione</text>
  <g font-family="sans-serif" font-size="14" text-anchor="middle">
    <rect x="150" y="240" width="110" height="38" rx="4" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="205" y="264" fill="#F8F5EE">il</text>
    <rect x="290" y="240" width="110" height="38" rx="4" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="345" y="264" fill="#F8F5EE">gatto</text>
    <rect x="430" y="240" width="110" height="38" rx="4" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="485" y="264" fill="#F8F5EE">nero</text>
    <rect x="570" y="240" width="110" height="38" rx="4" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="625" y="264" fill="#F8F5EE">dorme</text>
  </g>
  <!-- legend -->
  <g font-family="sans-serif" font-size="12">
    <line x1="150" y1="312" x2="190" y2="312" stroke="#B5532C" stroke-width="4"/>
    <text x="198" y="316" fill="#1A1A1A">peso di attention alto</text>
    <line x1="390" y1="312" x2="430" y2="312" stroke="#C9A961" stroke-width="1.5"/>
    <text x="438" y="316" fill="#1A1A1A">peso basso</text>
  </g>
</svg>
