<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Confronto tra grid search e random search: a sinistra una griglia tre per tre prova nove combinazioni ma solo tre valori distinti del parametro importante; a destra nove punti casuali provano nove valori distinti e campionano meglio la curva del punteggio disegnata sopra ciascun pannello.">
