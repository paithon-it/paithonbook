  <line x1="592.3" y1="324" x2="592.3" y2="340" stroke="#5E5852" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="619.6" y1="324" x2="619.6" y2="340" stroke="#5E5852" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="638.5" y1="324" x2="638.5" y2="340" stroke="#5E5852" stroke-width="1.2" stroke-dasharray="3 3"/>
