<svg viewBox="0 0 720 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un singolo modello linguistico al centro, addestrato solo a prevedere la parola successiva, si dirama verso cinque compiti diversi (traduzione, riassunto, domande e risposte, coreferenza, completamento) senza addestramento specifico per ciascuno">
  <rect x="0" y="0" width="720" height="380" fill="#F8F5EE"/>
  <text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Un modello, molti compiti, nessun addestramento dedicato</text>

  <!-- modello centrale -->
  <rect x="270" y="158" width="180" height="80" rx="8" fill="#B5532C"/>
  <text x="360" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">un solo modello</text>
  <text x="360" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">addestrato solo a prevedere</text>
  <text x="360" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">la parola successiva</text>

  <!-- compiti a destra -->
  <g font-family="sans-serif" font-size="12" fill="#1A1A1A">
    <rect x="530" y="60" width="160" height="42" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="610" y="86" text-anchor="middle">traduzione</text>
    <rect x="530" y="120" width="160" height="42" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="610" y="146" text-anchor="middle">riassunto</text>
    <rect x="530" y="180" width="160" height="42" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="610" y="206" text-anchor="middle">domande e risposte</text>
    <rect x="530" y="240" width="160" height="42" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="610" y="266" text-anchor="middle">coreferenza</text>
    <rect x="530" y="300" width="160" height="42" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="610" y="326" text-anchor="middle">completamento</text>
  </g>

  <!-- frecce modello -> compiti -->
  <g stroke="#1A1A1A" stroke-width="1.5" fill="none">
    <path d="M450 178 C 500 150, 500 90, 526 82"/>
    <path d="M450 190 C 500 175, 500 145, 526 141"/>
    <path d="M450 200 L 526 201"/>
    <path d="M450 212 C 500 225, 500 255, 526 261"/>
    <path d="M450 222 C 500 250, 500 315, 526 321"/>
  </g>
  <g fill="#1A1A1A">
    <path d="M526 82 L 518 79 L 520 87 Z"/>
    <path d="M526 141 L 518 138 L 519 146 Z"/>
    <path d="M526 201 L 518 197 L 518 205 Z"/>
    <path d="M526 261 L 519 256 L 517 264 Z"/>
    <path d="M526 321 L 520 315 L 517 323 Z"/>
  </g>

  <!-- ingresso a sinistra -->
  <rect x="30" y="168" width="180" height="60" rx="6" fill="#C9A961"/>
  <text x="120" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">testo del web</text>
  <text x="120" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">(WebText, 8 mln pagine)</text>
  <line x1="210" y1="198" x2="266" y2="198" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M266 198 L 258 194 L 258 202 Z" fill="#1A1A1A"/>

  <text x="360" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">il compito non è programmato: è evocato dalla forma del testo che si dà in ingresso</text>
</svg>
