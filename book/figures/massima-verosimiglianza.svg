<svg viewBox="0 0 720 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Curve di verosimiglianza per 7 teste su 10 lanci e 70 su 100: stesso massimo, curva più stretta con più dati">
  <rect x="0" y="0" width="720" height="360" fill="#F8F5EE"/>
  <!-- assi -->
  <line x1="80" y1="290" x2="660" y2="290" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="80" y1="290" x2="80" y2="50" stroke="#1A1A1A" stroke-width="2"/>
  <text x="370" y="330" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">p (probabilità di testa dell'ipotesi)</text>
  <text x="40" y="170" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle" transform="rotate(-90 40 170)">verosimiglianza L(p)</text>
  <!-- tick -->
  <line x1="80" y1="290" x2="80" y2="296" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="80" y="312" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">0</text>
  <line x1="370" y1="290" x2="370" y2="296" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="370" y="312" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">0,5</text>
  <line x1="486" y1="290" x2="486" y2="296" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="486" y="312" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C" font-weight="bold" text-anchor="middle">0,7</text>
  <line x1="660" y1="290" x2="660" y2="296" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="660" y="312" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">1</text>
  <!-- curva larga: 7/10 -->
  <path d="M 84 289 C 220 284, 300 220, 370 150 C 420 102, 460 80, 486 80 C 512 80, 546 108, 580 170 C 612 228, 640 275, 656 289"
        fill="none" stroke="#C9A961" stroke-width="2"/>
  <!-- curva stretta: 70/100 -->
  <path d="M 84 290 C 300 290, 400 285, 440 220 C 462 180, 474 80, 486 80 C 498 80, 510 180, 532 220 C 572 285, 620 290, 656 290"
        fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <!-- massimo -->
  <line x1="486" y1="80" x2="486" y2="290" stroke="#B5532C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="486" cy="80" r="5" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="486" y="62" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C" text-anchor="middle" font-weight="bold">massimo: p̂ = 0,7</text>
  <!-- legenda -->
  <line x1="110" y1="82" x2="140" y2="82" stroke="#C9A961" stroke-width="2"/>
  <text x="148" y="86" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">7 teste su 10 lanci (curva larga: molta incertezza)</text>
  <line x1="110" y1="106" x2="140" y2="106" stroke="#2D5A5C" stroke-width="2"/>
  <text x="148" y="110" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">70 teste su 100 lanci (curva stretta: stima più sicura)</text>
</svg>
