<svg viewBox="0 0 700 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema del pattern split-apply-combine: una tabella unica viene divisa in tre gruppi per prodotto, su ogni gruppo si applica la somma, e i risultati vengono ricombinati in una tabella riassuntiva con una riga per gruppo">
  <rect x="0" y="0" width="700" height="400" fill="#F8F5EE"/>
  <!-- fasi -->
  <text x="90" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Tabella</text>
  <text x="320" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">1. SPLIT</text>
  <text x="480" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">2. APPLY</text>
  <text x="620" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">3. COMBINE</text>
  <!-- tabella origine: righe mescolate -->
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <rect x="35" y="88" width="110" height="28" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="35" y="116" width="110" height="28" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="35" y="144" width="110" height="28" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="35" y="172" width="110" height="28" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="35" y="200" width="110" height="28" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="35" y="228" width="110" height="28" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="90" y="107" fill="#F8F5EE">tastiera · 149.7</text>
    <text x="90" y="135" fill="#F8F5EE">mouse · 99.5</text>
    <text x="90" y="163" fill="#1A1A1A">monitor · 378.0</text>
    <text x="90" y="191" fill="#F8F5EE">tastiera · 49.9</text>
    <text x="90" y="219" fill="#F8F5EE">mouse · 79.6</text>
    <text x="90" y="247" fill="#1A1A1A">monitor · 189.0</text>
  </g>
  <!-- frecce split -->
  <line x1="150" y1="130" x2="255" y2="86" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="255,86 241,86 246,97" fill="#1A1A1A"/>
  <line x1="150" y1="172" x2="255" y2="180" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="255,180 243,173 242,186" fill="#1A1A1A"/>
  <line x1="150" y1="214" x2="255" y2="272" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="255,272 246,261 240,272" fill="#1A1A1A"/>
  <!-- gruppi -->
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <rect x="262" y="58" width="116" height="26" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="262" y="84" width="116" height="26" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="320" y="76" fill="#F8F5EE">tastiera · 149.7</text>
    <text x="320" y="102" fill="#F8F5EE">tastiera · 49.9</text>
    <rect x="262" y="152" width="116" height="26" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="262" y="178" width="116" height="26" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="320" y="170" fill="#F8F5EE">mouse · 99.5</text>
    <text x="320" y="196" fill="#F8F5EE">mouse · 79.6</text>
    <rect x="262" y="246" width="116" height="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="262" y="272" width="116" height="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="320" y="264" fill="#1A1A1A">monitor · 378.0</text>
    <text x="320" y="290" fill="#1A1A1A">monitor · 189.0</text>
  </g>
  <!-- frecce apply -->
  <g font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">
    <line x1="382" y1="84" x2="438" y2="84" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="438,84 426,77 426,91" fill="#1A1A1A"/>
    <text x="410" y="72">sum()</text>
    <line x1="382" y1="178" x2="438" y2="178" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="438,178 426,171 426,185" fill="#1A1A1A"/>
    <text x="410" y="166">sum()</text>
    <line x1="382" y1="272" x2="438" y2="272" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="438,272 426,265 426,279" fill="#1A1A1A"/>
    <text x="410" y="260">sum()</text>
  </g>
  <!-- risultati parziali -->
  <g font-family="sans-serif" font-size="12.5" text-anchor="middle">
    <rect x="444" y="70" width="76" height="28" fill="none" stroke="#B5532C" stroke-width="2"/>
    <text x="482" y="89" fill="#1A1A1A">199.6</text>
    <rect x="444" y="164" width="76" height="28" fill="none" stroke="#2D5A5C" stroke-width="2"/>
    <text x="482" y="183" fill="#1A1A1A">179.1</text>
    <rect x="444" y="258" width="76" height="28" fill="none" stroke="#C9A961" stroke-width="2"/>
    <text x="482" y="277" fill="#1A1A1A">567.0</text>
  </g>
  <!-- frecce combine -->
  <line x1="524" y1="84" x2="570" y2="150" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="570,150 564,137 555,146" fill="#1A1A1A"/>
  <line x1="524" y1="178" x2="570" y2="180" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="570,180 558,173 557,186" fill="#1A1A1A"/>
  <line x1="524" y1="272" x2="570" y2="210" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="570,210 556,213 564,224" fill="#1A1A1A"/>
  <!-- tabella finale -->
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <rect x="576" y="138" width="88" height="28" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="576" y="166" width="88" height="28" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="576" y="194" width="88" height="28" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="620" y="157" fill="#F8F5EE">tast. 199.6</text>
    <text x="620" y="185" fill="#F8F5EE">mouse 179.1</text>
    <text x="620" y="213" fill="#1A1A1A">monit. 567.0</text>
  </g>
  <text x="350" y="360" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">vendite.groupby("prodotto")["incasso"].sum() — una riga, tre fasi</text>
</svg>
