<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <!-- pannello di fondo cream: garantisce leggibilità dei tratti scuri anche in dark mode -->
  <rect x="8" y="8" width="704" height="384" rx="14" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- intestazione -->
  <text x="120" y="42" font-size="15" font-weight="600" fill="#2D5A5C">Walk-forward (finestra espansa)</text>

  <!-- ===== iterazione 1 ===== -->
  <text x="112" y="86" font-size="12" text-anchor="end" fill="#1A1A1A">iter. 1</text>
  <rect x="120" y="64" width="216" height="34" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="228" y="85" font-size="12" text-anchor="middle" fill="#F8F5EE">train</text>
  <rect x="336" y="64" width="54" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="363" y="85" font-size="12" text-anchor="middle" fill="#F8F5EE">test</text>
  <rect x="390" y="64" width="270" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== iterazione 2 ===== -->
  <text x="112" y="132" font-size="12" text-anchor="end" fill="#1A1A1A">iter. 2</text>
  <rect x="120" y="110" width="270" height="34" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="255" y="131" font-size="12" text-anchor="middle" fill="#F8F5EE">train</text>
  <rect x="390" y="110" width="54" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="417" y="131" font-size="12" text-anchor="middle" fill="#F8F5EE">test</text>
  <rect x="444" y="110" width="216" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== iterazione 3 ===== -->
  <text x="112" y="178" font-size="12" text-anchor="end" fill="#1A1A1A">iter. 3</text>
  <rect x="120" y="156" width="324" height="34" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="282" y="177" font-size="12" text-anchor="middle" fill="#F8F5EE">train</text>
  <rect x="444" y="156" width="54" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="471" y="177" font-size="12" text-anchor="middle" fill="#F8F5EE">test</text>
  <rect x="498" y="156" width="162" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== iterazione 4 ===== -->
  <text x="112" y="224" font-size="12" text-anchor="end" fill="#1A1A1A">iter. 4</text>
  <rect x="120" y="202" width="378" height="34" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="309" y="223" font-size="12" text-anchor="middle" fill="#F8F5EE">train</text>
  <rect x="498" y="202" width="54" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="525" y="223" font-size="12" text-anchor="middle" fill="#F8F5EE">test</text>
  <rect x="552" y="202" width="108" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== iterazione 5 ===== -->
  <text x="112" y="270" font-size="12" text-anchor="end" fill="#1A1A1A">iter. 5</text>
  <rect x="120" y="248" width="432" height="34" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="336" y="269" font-size="12" text-anchor="middle" fill="#F8F5EE">train</text>
  <rect x="552" y="248" width="54" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1"/>
  <text x="579" y="269" font-size="12" text-anchor="middle" fill="#F8F5EE">test</text>
  <rect x="606" y="248" width="54" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- asse tempo -->
  <line x1="120" y1="312" x2="666" y2="312" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="666,306 682,312 666,318" fill="#1A1A1A"/>
  <text x="120" y="332" font-size="12" fill="#1A1A1A">passato</text>
  <text x="628" y="332" font-size="12" text-anchor="end" fill="#1A1A1A">futuro</text>
  <text x="646" y="332" font-size="12" fill="#C9A961" font-weight="600">tempo</text>
</svg>
