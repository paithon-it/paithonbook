<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404"
     role="img" aria-label="Cinque barre orizzontali, una per candidato, ordinate per probabilità, con accanto la percentuale e la somma cumulata. La figura ripete un ciclo di sei tappe. A temperatura 1 le percentuali sono 45 · 30 · 16 · 6 · 3 e le cumulate 45 · 75 · 91 · 97 · 100: una linea orizzontale segnata «taglio» scende sotto la riga 3, perché lì la cumulata fa 91 e supera la soglia di novanta; le barre escluse spariscono e le altre si allargano fino a ricomporre cento. Poi la temperatura sale a 2: tornano tutte e cinque le barre, più vicine fra loro (33 · 27 · 20 · 12 · 8, cumulate 33 · 60 · 80 · 92 · 100), e la stessa linea del taglio, con la stessa soglia, scende di una riga, sotto la 4, perché alla riga 3 la cumulata adesso fa 80 e non basta più.">
