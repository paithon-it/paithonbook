  Paithon Book, figura animata: Le due manopole in fila: la temperatura ripesa, il top_p taglia
  Generata da animazioni/svg/temperature-top-p.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
