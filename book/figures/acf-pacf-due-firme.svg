  <text x="60" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Due firme, e si leggono a coppie</text>
  <text x="60" y="44" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">400 giorni simulati; la fascia chiara &#232; dove una barra non dice niente</text>
