<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 344" role="img" aria-label="Griglia di quattro righe per dodici colonne. Nella riga in basso, la partenza a sinistra e la meta a destra; fra le due, dieci caselle nere sono il burrone. Due cammini uniscono la partenza alla meta. Quello del Q-learning, in terracotta, sale di una casella e corre lungo il bordo del burrone: è il più corto. Quello del SARSA, in teal, sale fino alla riga più alta, corre di là e ridiscende: quattro passi in più, e nessuna casella affacciata sul vuoto.">
