  <rect x="206" y="175" width="256" height="20" fill="#F8F5EE"/>
  <text x="334" y="189" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5532C">Q-learning: la via corta, sull&#8217;orlo</text>

  <text x="70" y="308" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#1A1A1A">Chi cade paga cento punti e si ritrova a S, con la partita che continua.</text>
  <text x="70" y="326" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#5E5852">Il dado si tira ogni tanto, e sull&#8217;orlo un passo storto basta.</text>
