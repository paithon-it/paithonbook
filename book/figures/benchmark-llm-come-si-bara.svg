<svg viewBox="0 0 720 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagramma della contaminazione: un grande insieme di dati di addestramento e un piccolo insieme di test si sovrappongono; le domande del test filtrano dentro l'addestramento nella zona di sovrapposizione">
  <rect x="0" y="0" width="720" height="380" fill="#F8F5EE"/>
  <text x="360" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">La contaminazione dei dati</text>
  <ellipse cx="290" cy="215" rx="230" ry="120" fill="none" stroke="#B5532C" stroke-width="2"/>
  <text x="185" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#B5532C">Dati di addestramento</text>
  <text x="185" y="140" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">miliardi di pagine dal web</text>
  <ellipse cx="540" cy="215" rx="120" ry="90" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="588" y="150" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2D5A5C">Test</text>
  <text x="588" y="170" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">domande d'esame</text>
  <path d="M 452 133 A 120 90 0 0 0 452 297 A 230 120 0 0 1 452 133 Z" fill="#C9A961" fill-opacity="0.55" stroke="none"/>
  <text x="455" y="212" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">sovrapposizione</text>
  <text x="455" y="230" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">= contaminazione</text>
  <line x1="600" y1="300" x2="470" y2="250" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="470,250 482,251 476,261" fill="#1A1A1A"/>
  <text x="600" y="325" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">il test filtra nell'addestramento</text>
</svg>
