<svg viewBox="0 0 720 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: probabilità della frase token per token">
  <rect x="0" y="0" width="720" height="340" fill="#F8F5EE"/>
  <text x="360" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">La probabilità di una frase, un token alla volta</text>
  <!-- token boxes -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14">
    <rect x="41" y="70" width="88" height="40" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2" rx="6"/>
    <text x="85" y="95" text-anchor="middle" fill="#1A1A1A">Il</text>
    <rect x="151" y="70" width="88" height="40" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2" rx="6"/>
    <text x="195" y="95" text-anchor="middle" fill="#1A1A1A">gatto</text>
    <rect x="261" y="70" width="88" height="40" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2" rx="6"/>
    <text x="305" y="95" text-anchor="middle" fill="#1A1A1A">dorme</text>
    <rect x="371" y="70" width="88" height="40" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2" rx="6"/>
    <text x="415" y="95" text-anchor="middle" fill="#1A1A1A">sul</text>
    <rect x="481" y="70" width="88" height="40" fill="#F8F5EE" stroke="#B5532C" stroke-width="2" rx="6"/>
    <text x="525" y="95" text-anchor="middle" fill="#B5532C">divano</text>
    <rect x="591" y="70" width="88" height="40" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2" rx="6"/>
    <text x="635" y="95" text-anchor="middle" fill="#1A1A1A">&lt;/s&gt;</text>
  </g>
  <!-- arrows -->
  <g stroke="#1A1A1A" stroke-width="1.5">
    <line x1="129" y1="90" x2="149" y2="90"/>
    <line x1="239" y1="90" x2="259" y2="90"/>
    <line x1="349" y1="90" x2="369" y2="90"/>
    <line x1="459" y1="90" x2="479" y2="90"/>
    <line x1="569" y1="90" x2="589" y2="90"/>
  </g>
  <!-- probability bars under each token -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12">
    <rect x="55" y="130" width="60" height="14" fill="#E8E2D5" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="55" y="130" width="36" height="14" fill="#2D5A5C"/>
    <text x="85" y="162" text-anchor="middle" fill="#1A1A1A">p = 0,60</text>
    <rect x="165" y="130" width="60" height="14" fill="#E8E2D5" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="165" y="130" width="9" height="14" fill="#2D5A5C"/>
    <text x="195" y="162" text-anchor="middle" fill="#1A1A1A">p = 0,15</text>
    <rect x="275" y="130" width="60" height="14" fill="#E8E2D5" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="275" y="130" width="18" height="14" fill="#2D5A5C"/>
    <text x="305" y="162" text-anchor="middle" fill="#1A1A1A">p = 0,30</text>
    <rect x="385" y="130" width="60" height="14" fill="#E8E2D5" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="385" y="130" width="27" height="14" fill="#2D5A5C"/>
    <text x="415" y="162" text-anchor="middle" fill="#1A1A1A">p = 0,45</text>
    <rect x="495" y="130" width="60" height="14" fill="#E8E2D5" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="495" y="130" width="7" height="14" fill="#B5532C"/>
    <text x="525" y="162" text-anchor="middle" fill="#1A1A1A">p = 0,12</text>
    <rect x="605" y="130" width="60" height="14" fill="#E8E2D5" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="605" y="130" width="30" height="14" fill="#2D5A5C"/>
    <text x="635" y="162" text-anchor="middle" fill="#1A1A1A">p = 0,50</text>
  </g>
  <text x="360" y="192" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">ogni probabilità è condizionata ai token precedenti</text>
  <!-- product line -->
  <rect x="90" y="220" width="540" height="80" fill="#F8F5EE" stroke="#C9A961" stroke-width="2" rx="8"/>
  <text x="360" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">P(frase) = 0,60 × 0,15 × 0,30 × 0,45 × 0,12 × 0,50 ≈ 0,00073</text>
  <text x="360" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#B5532C">perplexity = P(frase)^(−1/6) ≈ 3,3 alternative "effettive" per token</text>
</svg>
