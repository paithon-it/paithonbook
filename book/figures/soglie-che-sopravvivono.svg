<!--
  Paithon Book, figura animata: le soglie compatibili si stringono mentre arrivano gli esempi
  Generata da animazioni/svg/soglie-che-sopravvivono.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296"
     role="img" aria-label="Animazione su un segmento orizzontale da zero a uno. Gli esempi compaiono a gruppi, cinque, dieci, venti, quaranta e ottanta, come puntini color terracotta se positivi e teal se negativi; una banda ocra segna le soglie ancora compatibili con tutti gli esempi e a ogni gruppo si restringe o resta ferma, senza mai allargarsi. Sopra il segmento una parentesi segna le soglie con errore al massimo del cinque per cento attorno alla soglia vera. Alla fine la banda ocra sta tutta dentro la parentesi.">
  <style>
    svg  { --d: 9.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
