    .pos   { fill:#B5532C; stroke:#F8F5EE; stroke-width:.8; }
    .neg   { fill:#2D5A5C; stroke:#F8F5EE; stroke-width:.8; }
    .cont  { font-family:Inter, system-ui, sans-serif; font-size:16px; font-weight:700; fill:#B5532C; opacity:0; }
