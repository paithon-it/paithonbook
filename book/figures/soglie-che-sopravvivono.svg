    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .asse  { stroke:#1A1A1A; stroke-width:1.6; }
    .guida { stroke:#C5BEAA; stroke-width:1.2; stroke-dasharray:3 4; }
    .toll  { stroke:#1A1A1A; stroke-width:1.4; fill:none; }
    .vera  { fill:#1A1A1A; }
