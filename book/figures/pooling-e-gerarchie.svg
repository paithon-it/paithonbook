<svg viewBox="0 0 760 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gerarchia di una rete convoluzionale: dai bordi alle forme agli oggetti, con griglie sempre piu piccole">
  <rect x="0" y="0" width="760" height="400" fill="#F8F5EE"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Da pixel a concetti: la piramide della rete</text>
  <!-- level 1: edges -->
  <g>
    <g stroke="#1A1A1A" stroke-width="1.5">
      <rect x="50" y="90" width="160" height="160" fill="#F8F5EE"/>
      <line x1="90" y1="90" x2="90" y2="250"/><line x1="130" y1="90" x2="130" y2="250"/><line x1="170" y1="90" x2="170" y2="250"/>
      <line x1="50" y1="130" x2="210" y2="130"/><line x1="50" y1="170" x2="210" y2="170"/><line x1="50" y1="210" x2="210" y2="210"/>
    </g>
    <g stroke="#B5532C" stroke-width="2">
      <line x1="70" y1="98" x2="70" y2="122"/>
      <line x1="138" y1="150" x2="162" y2="150"/>
      <line x1="98" y1="242" x2="122" y2="218"/>
      <line x1="178" y1="98" x2="202" y2="122"/>
      <line x1="58" y1="190" x2="82" y2="190"/>
      <line x1="190" y1="218" x2="190" y2="242"/>
    </g>
    <text x="130" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B5532C">bordi</text>
    <text x="130" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">strati iniziali</text>
    <text x="130" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">griglia grande, pattern locali</text>
  </g>
  <!-- arrow 1 -->
  <path d="M222 170 L288 170" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <path d="M281 164 L290 170 L281 176" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="256" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">conv + pooling</text>
  <!-- level 2: shapes -->
  <g>
    <g stroke="#1A1A1A" stroke-width="1.5">
      <rect x="300" y="110" width="120" height="120" fill="#F8F5EE"/>
      <line x1="360" y1="110" x2="360" y2="230"/>
      <line x1="300" y1="170" x2="420" y2="170"/>
    </g>
    <circle cx="330" cy="140" r="16" fill="none" stroke="#2D5A5C" stroke-width="2"/>
    <path d="M376 126 L404 154 L376 154 Z" fill="none" stroke="#2D5A5C" stroke-width="2"/>
    <rect x="316" y="186" width="28" height="28" fill="none" stroke="#2D5A5C" stroke-width="2"/>
    <path d="M372 214 Q390 182 408 214" fill="none" stroke="#2D5A5C" stroke-width="2"/>
    <text x="360" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D5A5C">forme</text>
    <text x="360" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">strati intermedi</text>
    <text x="360" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">griglia media, parti di oggetti</text>
  </g>
  <!-- arrow 2 -->
  <path d="M432 170 L498 170" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <path d="M491 164 L500 170 L491 176" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="466" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">conv + pooling</text>
  <!-- level 3: object (cat face) -->
  <g>
    <rect x="510" y="130" width="80" height="80" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="550" cy="176" r="22" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M534 162 L528 144 L544 154 Z" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M566 162 L572 144 L556 154 Z" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="542" cy="172" r="2.5" fill="#1A1A1A"/>
    <circle cx="558" cy="172" r="2.5" fill="#1A1A1A"/>
    <path d="M547 182 L553 182 L550 186 Z" fill="#1A1A1A"/>
    <text x="550" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#C9A961">oggetti</text>
    <text x="550" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">strati profondi</text>
    <text x="550" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">griglia piccola, concetti interi</text>
  </g>
  <!-- output arrow -->
  <path d="M602 170 L668 170" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <path d="M661 164 L670 170 L661 176" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="700" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">"gatto"</text>
  <text x="700" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">classe</text>
  <!-- bottom note -->
  <text x="380" y="368" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">← risoluzione spaziale in calo · astrazione in crescita →</text>
</svg>
