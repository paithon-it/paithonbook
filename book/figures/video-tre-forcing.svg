<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-label="Tre righe, una per regime di addestramento autoregressivo. In ogni riga quattro fotogrammi di contesto, da x1 a x4, precedono il fotogramma x5 da ripulire. Prima riga, teacher forcing: il contesto è il video vero, in teal, tutto pulito, e la perdita si calcola fotogramma per fotogramma. Seconda riga, Diffusion Forcing: il contesto è ancora il video vero, ma ogni fotogramma ha un livello di rumore indipendente, 0,3, 0,7, 0,1 e 0,5, reso con un'ombreggiatura ocra più o meno densa, e la perdita si calcola fotogramma per fotogramma. Terza riga, Self Forcing: il contesto è generato dal modello stesso, in terracotta, con frecce che collegano ogni fotogramma al successivo come in un rollout, e la perdita, segnata da una parentesi in terracotta, riguarda il video intero, confrontato con i video del maestro bidirezionale.">
  <defs>
    <marker id="freccia-tf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E5852"/>
    </marker>
    <marker id="freccia-tf-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5532C"/>
    </marker>
  </defs>

  <!-- ===================== RIGA 1: TEACHER FORCING ===================== -->
  <text x="24" y="52" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">1 &#183; Teacher forcing</text>
  <text x="24" y="74" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">il contesto è il video vero,</text>
  <text x="24" y="90" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">pulito, preso dai dati</text>

  <rect x="270" y="40" width="64" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="302" y="73" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#185;</text>
  <rect x="350" y="40" width="64" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="382" y="73" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#178;</text>
  <rect x="430" y="40" width="64" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="462" y="73" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#179;</text>
  <rect x="510" y="40" width="64" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.18" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="542" y="73" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8308;</text>

  <line x1="578" y1="67" x2="644" y2="67" stroke="#5E5852" stroke-width="2" marker-end="url(#freccia-tf)"/>
  <rect x="650" y="40" width="110" height="54" rx="8" fill="#5E5852" fill-opacity="0.10" stroke="#5E5852" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="705" y="63" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8309;</text>
  <text x="705" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">da ripulire</text>

  <text x="270" y="116" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">il contesto non è mai passato dal modello</text>
  <text x="705" y="116" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">perdita fotogramma per fotogramma</text>

  <line x1="24" y1="140" x2="836" y2="140" stroke="#5E5852" stroke-width="1" stroke-opacity="0.3"/>

  <!-- ===================== RIGA 2: DIFFUSION FORCING ===================== -->
  <text x="24" y="192" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">2 &#183; Diffusion Forcing</text>
  <text x="24" y="214" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">il contesto è il video vero, con</text>
  <text x="24" y="230" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">un rumore diverso per ogni fotogramma</text>

  <text x="302" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">t&#8321; = 0,3</text>
  <text x="382" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">t&#8322; = 0,7</text>
  <text x="462" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">t&#8323; = 0,1</text>
  <text x="542" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">t&#8324; = 0,5</text>

  <rect x="270" y="180" width="64" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.18"/>
  <rect x="270" y="180" width="64" height="54" rx="8" fill="#C9A961" fill-opacity="0.30" stroke="#2D5A5C" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="302" y="213" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#185;</text>
  <rect x="350" y="180" width="64" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.18"/>
  <rect x="350" y="180" width="64" height="54" rx="8" fill="#C9A961" fill-opacity="0.70" stroke="#2D5A5C" stroke-width="2.5" stroke-dasharray="2 3"/>
  <text x="382" y="213" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#178;</text>
  <rect x="430" y="180" width="64" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.18"/>
  <rect x="430" y="180" width="64" height="54" rx="8" fill="#C9A961" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2.5" stroke-dasharray="8 2"/>
  <text x="462" y="213" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#179;</text>
  <rect x="510" y="180" width="64" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.18"/>
  <rect x="510" y="180" width="64" height="54" rx="8" fill="#C9A961" fill-opacity="0.50" stroke="#2D5A5C" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="542" y="213" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8308;</text>

  <line x1="578" y1="207" x2="644" y2="207" stroke="#5E5852" stroke-width="2" marker-end="url(#freccia-tf)"/>
  <rect x="650" y="180" width="110" height="54" rx="8" fill="#5E5852" fill-opacity="0.10" stroke="#5E5852" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="705" y="203" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8309;</text>
  <text x="705" y="222" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">da ripulire</text>

  <text x="270" y="256" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">più ocra, più rumore; il contesto resta il video vero</text>
  <text x="705" y="256" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">perdita fotogramma per fotogramma</text>

  <line x1="24" y1="280" x2="836" y2="280" stroke="#5E5852" stroke-width="1" stroke-opacity="0.3"/>

  <!-- ===================== RIGA 3: SELF FORCING ===================== -->
  <text x="24" y="332" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">3 &#183; Self Forcing</text>
  <text x="24" y="354" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">il contesto lo ha generato il modello,</text>
  <text x="24" y="370" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">un fotogramma dopo l'altro, con la cache</text>

  <rect x="270" y="320" width="64" height="54" rx="8" fill="#B5532C" fill-opacity="0.15" stroke="#B5532C" stroke-width="2.5"/>
  <text x="302" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#185;</text>
  <rect x="350" y="320" width="64" height="54" rx="8" fill="#B5532C" fill-opacity="0.15" stroke="#B5532C" stroke-width="2.5"/>
  <text x="382" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#178;</text>
  <rect x="430" y="320" width="64" height="54" rx="8" fill="#B5532C" fill-opacity="0.15" stroke="#B5532C" stroke-width="2.5"/>
  <text x="462" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#179;</text>
  <rect x="510" y="320" width="64" height="54" rx="8" fill="#B5532C" fill-opacity="0.15" stroke="#B5532C" stroke-width="2.5"/>
  <text x="542" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8308;</text>

  <line x1="336" y1="347" x2="346" y2="347" stroke="#B5532C" stroke-width="2" marker-end="url(#freccia-tf-t)"/>
  <line x1="416" y1="347" x2="426" y2="347" stroke="#B5532C" stroke-width="2" marker-end="url(#freccia-tf-t)"/>
  <line x1="496" y1="347" x2="506" y2="347" stroke="#B5532C" stroke-width="2" marker-end="url(#freccia-tf-t)"/>
  <line x1="578" y1="347" x2="644" y2="347" stroke="#B5532C" stroke-width="2" marker-end="url(#freccia-tf-t)"/>
  <rect x="650" y="320" width="110" height="54" rx="8" fill="#B5532C" fill-opacity="0.10" stroke="#B5532C" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="705" y="343" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">x&#8309;</text>
  <text x="705" y="362" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">da ripulire</text>

  <!-- parentesi: perdita sul video intero -->
  <path d="M270,392 L270,402 L760,402 L760,392" fill="none" stroke="#B5532C" stroke-width="2"/>
  <text x="515" y="424" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#B5532C">perdita sul video intero, confrontato con i video del maestro bidirezionale</text>
</svg>
