<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 478"
     role="img" aria-label="Una battuta di musica disegnata come rullo di pianola: tre rettangoli, un DO grave lungo tutta la battuta e due SOL da mezza battuta ciascuno. Un cursore la percorre da sinistra a destra, e sotto crescono due file: quella a griglia aggiunge due caselle a ogni sedicesimo e arriva a trentadue, quella a eventi aggiunge scatole solo dove accade qualcosa e si ferma a otto.">
