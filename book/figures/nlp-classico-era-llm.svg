<svg viewBox="0 0 720 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto tra pipeline NLP classica e approccio a prompt con LLM">
  <rect x="0" y="0" width="720" height="400" fill="#F8F5EE"/>
  <text x="360" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1A1A1A">Due strade per lo stesso output</text>
  <text x="40" y="70" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2D5A5C">Pipeline classica (settimane)</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">
    <rect x="40" y="84" width="110" height="46" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="95" y="104" text-anchor="middle">Raccolta</text>
    <text x="95" y="120" text-anchor="middle">dati</text>
    <line x1="150" y1="107" x2="176" y2="107" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M176 107 l-7 -4 v8 z" fill="#1A1A1A"/>
    <rect x="180" y="84" width="110" height="46" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="235" y="104" text-anchor="middle">Etichettatura</text>
    <text x="235" y="120" text-anchor="middle">manuale</text>
    <line x1="290" y1="107" x2="316" y2="107" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M316 107 l-7 -4 v8 z" fill="#1A1A1A"/>
    <rect x="320" y="84" width="110" height="46" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="375" y="104" text-anchor="middle">Training</text>
    <text x="375" y="120" text-anchor="middle">(fine-tuning)</text>
    <line x1="430" y1="107" x2="456" y2="107" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M456 107 l-7 -4 v8 z" fill="#1A1A1A"/>
    <rect x="460" y="84" width="110" height="46" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="515" y="104" text-anchor="middle">Valutazione</text>
    <text x="515" y="120" text-anchor="middle">su test set</text>
    <line x1="570" y1="107" x2="596" y2="107" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M596 107 l-7 -4 v8 z" fill="#1A1A1A"/>
    <rect x="600" y="84" width="90" height="46" rx="8" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="645" y="104" text-anchor="middle">Output</text>
    <text x="645" y="120" text-anchor="middle">strutturato</text>
  </g>
  <text x="40" y="190" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#B5532C">Approccio LLM (ore)</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">
    <rect x="40" y="204" width="150" height="46" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="115" y="224" text-anchor="middle">Prompt + esempi</text>
    <text x="115" y="240" text-anchor="middle">(few-shot)</text>
    <line x1="190" y1="227" x2="256" y2="227" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M256 227 l-7 -4 v8 z" fill="#1A1A1A"/>
    <rect x="260" y="204" width="150" height="46" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="335" y="224" text-anchor="middle">LLM generalista</text>
    <text x="335" y="240" text-anchor="middle">(zero training)</text>
    <line x1="410" y1="227" x2="476" y2="227" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M476 227 l-7 -4 v8 z" fill="#1A1A1A"/>
    <rect x="480" y="204" width="110" height="46" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
    <text x="535" y="224" text-anchor="middle">Validazione</text>
    <text x="535" y="240" text-anchor="middle">output</text>
    <line x1="590" y1="227" x2="596" y2="227" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M596 227 l-7 -4 v8 z" fill="#1A1A1A"/>
    <rect x="600" y="204" width="90" height="46" rx="8" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="645" y="224" text-anchor="middle">Output</text>
    <text x="645" y="240" text-anchor="middle">strutturato</text>
  </g>
  <line x1="40" y1="290" x2="680" y2="290" stroke="#C9A961" stroke-width="1.5"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">
    <text x="40" y="318">Classica: costo iniziale alto, costo per predizione bassissimo, massima accuratezza sul dominio.</text>
    <text x="40" y="342">LLM: costo iniziale quasi nullo, costo per chiamata ricorrente, flessibilità immediata.</text>
    <text x="40" y="366">Il punto di pareggio dipende dal volume: a milioni di testi al giorno, il modello piccolo vince.</text>
  </g>
</svg>
