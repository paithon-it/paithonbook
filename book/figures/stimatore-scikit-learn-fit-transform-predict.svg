<svg viewBox="0 0 800 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema: ciclo di vita di uno stimatore scikit-learn, da istanza a previsione">
  <rect x="0" y="0" width="800" height="420" fill="#F8F5EE"/>
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Il ciclo di vita di uno stimatore</text>
  <rect x="60" y="70" width="220" height="70" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="170" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">1. Istanza</text>
  <text x="170" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">iperparametri: li scegli tu</text>
  <line x1="280" y1="105" x2="380" y2="105" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="380,105 368,99 368,111" fill="#1A1A1A"/>
  <text x="330" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">fit(X, y)</text>
  <rect x="385" y="70" width="240" height="70" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="505" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">2. Stimatore addestrato</text>
  <text x="505" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">parametri imparati: coef_, mean_</text>
  <line x1="460" y1="140" x2="290" y2="230" stroke="#2D5A5C" stroke-width="2"/>
  <polygon points="290,230 303,228 297,216" fill="#2D5A5C"/>
  <text x="330" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2D5A5C">transform(X)</text>
  <line x1="550" y1="140" x2="650" y2="230" stroke="#2D5A5C" stroke-width="2"/>
  <polygon points="650,230 638,227 645,216" fill="#2D5A5C"/>
  <text x="632" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2D5A5C">predict(X)</text>
  <rect x="110" y="235" width="240" height="64" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="230" y="261" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8F5EE">Trasformatore</text>
  <text x="230" y="283" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">dati trasformati (scaler, PCA)</text>
  <rect x="470" y="235" width="240" height="64" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="590" y="261" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8F5EE">Predittore</text>
  <text x="590" y="283" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">previsioni (classi, valori)</text>
  <line x1="590" y1="299" x2="590" y2="345" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="590,345 584,333 596,333" fill="#1A1A1A"/>
  <rect x="470" y="348" width="240" height="46" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="590" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">score(X, y) → valutazione</text>
  <text x="230" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">fit_transform = fit + transform</text>
  <text x="230" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">(scorciatoia, solo sul train)</text>
</svg>
