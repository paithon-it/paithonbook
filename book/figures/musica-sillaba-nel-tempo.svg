  <text x="221.9" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">vocale tenuta</text>
  <text x="406.9" y="296" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">pausa:</text>
  <text x="406.9" y="311" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">nessuna sillaba</text>
