<svg viewBox="0 0 720 400" width="100%" role="img" aria-label="Schema: traiettoria tortuosa della diffusione a molti passi contro traiettoria dritta del flow matching a pochi passi" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="400" fill="#F8F5EE"/>
  <text x="360" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Due modi di andare dal rumore all'immagine</text>
  <!-- start and end nodes -->
  <circle cx="90" cy="210" r="30" fill="#C9A961"/>
  <text x="90" y="206" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">rumore</text>
  <text x="90" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">semplice</text>
  <circle cx="630" cy="210" r="30" fill="#2D5A5C"/>
  <text x="630" y="206" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F8F5EE">dati</text>
  <text x="630" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F8F5EE">immagine</text>
  <!-- diffusion: wiggly path with many dots (top) -->
  <text x="360" y="95" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#B5532C">Diffusione: tanti passi tortuosi</text>
  <path d="M120 150 C 180 110, 210 200, 270 150 S 360 100, 400 160 S 500 110, 560 150" fill="none" stroke="#B5532C" stroke-width="2"/>
  <circle cx="120" cy="150" r="4" fill="#B5532C"/>
  <circle cx="185" cy="128" r="4" fill="#B5532C"/>
  <circle cx="235" cy="168" r="4" fill="#B5532C"/>
  <circle cx="290" cy="140" r="4" fill="#B5532C"/>
  <circle cx="345" cy="128" r="4" fill="#B5532C"/>
  <circle cx="400" cy="160" r="4" fill="#B5532C"/>
  <circle cx="460" cy="138" r="4" fill="#B5532C"/>
  <circle cx="515" cy="126" r="4" fill="#B5532C"/>
  <circle cx="560" cy="150" r="4" fill="#B5532C"/>
  <line x1="120" y1="180" x2="120" y2="188" stroke="#8B847C" stroke-width="1.5"/>
  <line x1="560" y1="180" x2="560" y2="188" stroke="#8B847C" stroke-width="1.5"/>
  <!-- flow matching: straight arrow with few dots (bottom) -->
  <text x="360" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2D5A5C">Flow matching: pochi passi dritti</text>
  <line x1="120" y1="255" x2="555" y2="255" stroke="#2D5A5C" stroke-width="2.5"/>
  <polygon points="565,255 551,248 551,262" fill="#2D5A5C"/>
  <circle cx="120" cy="255" r="4" fill="#2D5A5C"/>
  <circle cx="265" cy="255" r="4" fill="#2D5A5C"/>
  <circle cx="410" cy="255" r="4" fill="#2D5A5C"/>
  <circle cx="555" cy="255" r="4" fill="#2D5A5C"/>
  <text x="192" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#2D5A5C">1 freccia</text>
  <!-- shared start/end connectors -->
  <line x1="112" y1="188" x2="118" y2="152" stroke="#8B847C" stroke-width="1.2"/>
  <text x="360" y="360" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-style="italic" fill="#5E5852">stessa partenza, stesso arrivo, molti meno passaggi da calcolare</text>
</svg>
