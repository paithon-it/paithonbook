<svg viewBox="0 0 760 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="In alto le colonne di un esempio entrano in un conto solo, moltiplicate per i loro pesi e sommate, e ne esce un punteggio che può valere qualsiasi cosa. Da lì tre rami. Nel primo il punteggio si legge così com'è, il graficino è una retta a quarantacinque gradi, la distribuzione è la gaussiana, la risposta è un prezzo e lo scarto è lo stesso dappertutto. Nel secondo il punteggio viene schiacciato fra zero e uno da una curva a esse, la distribuzione è la Bernoulli, la risposta è un sì o un no con la sua probabilità e lo scarto è massimo a metà strada. Nel terzo il punteggio è il logaritmo della risposta, il graficino è una curva che sale e non scende mai sotto lo zero, la distribuzione è la Poisson, la risposta è un conteggio e lo scarto va come la radice della media. In fondo: quello che cambia da un ramo all'altro sono due cose sole, come si legge il punteggio e con che regola si misura lo scarto.">
  <rect x="0" y="0" width="760" height="520" fill="#F8F5EE"/>
  <text x="380.0" y="26.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#1A1A1A" font-weight="bold">Un punteggio solo, tre modi di leggerlo</text>
  <text x="380.0" y="46.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#5A524A">lineare, logistica e Poisson sono la stessa macchina con tre impostazioni</text>
