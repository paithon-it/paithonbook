<svg viewBox="0 0 760 260" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline dal notebook alla produzione in cinque tappe">
  <rect x="0" y="0" width="760" height="260" fill="#F8F5EE"/>
  <text x="380" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Dal notebook alla produzione: le cinque tappe</text>
  <!-- tappa 1 -->
  <rect x="20" y="70" width="120" height="70" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="80" y="100" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">Notebook</text>
  <text x="80" y="118" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">esplorazione</text>
  <!-- freccia -->
  <line x1="140" y1="105" x2="168" y2="105" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="168,100 178,105 168,110" fill="#1A1A1A"/>
  <!-- tappa 2 -->
  <rect x="178" y="70" width="120" height="70" rx="8" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="238" y="100" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">Script + Git</text>
  <text x="238" y="118" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">codice riproducibile</text>
  <!-- freccia -->
  <line x1="298" y1="105" x2="326" y2="105" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="326,100 336,105 326,110" fill="#1A1A1A"/>
  <!-- tappa 3 -->
  <rect x="336" y="70" width="120" height="70" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="396" y="100" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">API FastAPI</text>
  <text x="396" y="118" font-family="sans-serif" font-size="10" fill="#F8F5EE" text-anchor="middle">/predict + /health</text>
  <!-- freccia -->
  <line x1="456" y1="105" x2="484" y2="105" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="484,100 494,105 484,110" fill="#1A1A1A"/>
  <!-- tappa 4 -->
  <rect x="494" y="70" width="120" height="70" rx="8" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="554" y="100" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">Container</text>
  <text x="554" y="118" font-family="sans-serif" font-size="10" fill="#F8F5EE" text-anchor="middle">stesso ambiente</text>
  <!-- freccia -->
  <line x1="614" y1="105" x2="642" y2="105" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="642,100 652,105 642,110" fill="#1A1A1A"/>
  <!-- tappa 5 -->
  <rect x="652" y="70" width="95" height="70" rx="8" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="699" y="100" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">Prod</text>
  <text x="699" y="118" font-family="sans-serif" font-size="10" fill="#F8F5EE" text-anchor="middle">monitorata</text>
  <!-- loop feedback -->
  <path d="M 699 140 L 699 195 L 80 195 L 80 140" fill="none" stroke="#2D5A5C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polygon points="75,145 80,135 85,145" fill="#2D5A5C"/>
  <text x="390" y="215" font-family="sans-serif" font-size="11" fill="#2D5A5C" text-anchor="middle">feedback: drift e nuovi dati riportano all'esplorazione</text>
  <!-- artefatti versionati -->
  <text x="238" y="55" font-family="sans-serif" font-size="10" fill="#1A1A1A" text-anchor="middle">dati + modello versionati</text>
</svg>
