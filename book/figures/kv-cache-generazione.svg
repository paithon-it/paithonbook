<svg viewBox="0 0 720 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema della KV cache che cresce token per token">
  <rect x="0" y="0" width="720" height="300" fill="#F8F5EE"/>
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">La cache cresce token per token</text>

  <!-- Step 1 -->
  <text x="40" y="72" font-family="sans-serif" font-size="12" fill="#1A1A1A">Passo 1</text>
  <rect x="120" y="55" width="52" height="26" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="146" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">Il</text>
  <text x="640" y="72" font-family="sans-serif" font-size="11" fill="#5E5852" text-anchor="end">1 coppia K/V</text>

  <!-- Step 2 -->
  <text x="40" y="122" font-family="sans-serif" font-size="12" fill="#1A1A1A">Passo 2</text>
  <rect x="120" y="105" width="52" height="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="146" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">Il</text>
  <rect x="176" y="105" width="52" height="26" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="202" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">gatto</text>
  <text x="640" y="122" font-family="sans-serif" font-size="11" fill="#5E5852" text-anchor="end">2 coppie K/V</text>

  <!-- Step 3 -->
  <text x="40" y="172" font-family="sans-serif" font-size="12" fill="#1A1A1A">Passo 3</text>
  <rect x="120" y="155" width="52" height="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="146" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">Il</text>
  <rect x="176" y="155" width="52" height="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="202" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">gatto</text>
  <rect x="232" y="155" width="52" height="26" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="258" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">dorme</text>
  <text x="640" y="172" font-family="sans-serif" font-size="11" fill="#5E5852" text-anchor="end">3 coppie K/V</text>

  <!-- Step 4 -->
  <text x="40" y="222" font-family="sans-serif" font-size="12" fill="#1A1A1A">Passo 4</text>
  <rect x="120" y="205" width="52" height="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="146" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">Il</text>
  <rect x="176" y="205" width="52" height="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="202" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">gatto</text>
  <rect x="232" y="205" width="52" height="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="258" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">dorme</text>
  <rect x="288" y="205" width="52" height="26" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="314" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">sul</text>
  <text x="640" y="222" font-family="sans-serif" font-size="11" fill="#5E5852" text-anchor="end">4 coppie K/V</text>

  <!-- Legend -->
  <rect x="120" y="258" width="16" height="16" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="144" y="271" font-family="sans-serif" font-size="11" fill="#1A1A1A">in cache: mai ricalcolato</text>
  <rect x="330" y="258" width="16" height="16" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="354" y="271" font-family="sans-serif" font-size="11" fill="#1A1A1A">token nuovo: unico calcolo del passo</text>
  <line x1="120" y1="248" x2="600" y2="248" stroke="#2D5A5C" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
