            stroke-linejoin:round; }
    .rif  { fill:none; stroke:#5A524A; stroke-width:1.6;
            stroke-dasharray:6 5; stroke-linejoin:round; }
    .sco  { stroke:#B5532C; stroke-width:2; }
    .sca  { stroke:#2D5A5C; stroke-width:2.4; stroke-dasharray:3 3; }
    .pun  { fill:#F8F5EE; stroke:#2D5A5C; stroke-width:2.4; }
    .num  { font-family:Inter, system-ui, sans-serif; font-size:13px; font-weight:700;
            fill:#B5532C; }
    .pan  { font-family:Inter, system-ui, sans-serif; font-size:16px; font-weight:700;
            fill:#1A1A1A; }
    
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
