<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352"
     role="img" aria-label="Due grafici affiancati, stesso asse verticale, con il tempo in orizzontale. Le due serie partono dallo stesso valore, salgono con la stessa spinta e ricevono le stesse scosse, fra cui una grossa, di più 18, al settimo istante, segnata in tutti e due i grafici da una freccia verticale. A sinistra, «tendenza deterministica», la serie oscilla attorno a una retta tratteggiata: nell'istante della scossa schizza sopra la retta, e già il punto dopo, cerchiato, è tornato ad appoggiarsi alla retta come tutti gli altri. A destra, «tendenza stocastica», il tratteggio è il cammino che la serie avrebbe fatto senza quella scossa: dall'istante della scossa in poi le due linee corrono parallele, e la distanza fra loro all'ultimo istante è segnata «ancora più 18», la stessa di quando la scossa è arrivata.">
