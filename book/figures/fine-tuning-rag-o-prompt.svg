<svg viewBox="0 0 700 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Albero di decisione: dal problema iniziale, se al modello mancano fatti o documenti tuoi si usa il RAG; altrimenti se serve un formato o uno stile costante si usa il fine-tuning; altrimenti basta lavorare sul prompt">
  <rect x="0" y="0" width="700" height="500" fill="#F8F5EE"/>
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Da dove cominciare</text>

  <!-- start -->
  <rect x="240" y="46" width="220" height="52" rx="10" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="350" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">Il modello non fa</text>
  <text x="350" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">quello che voglio</text>

  <line x1="350" y1="98" x2="350" y2="124" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="350,134 344,122 356,122" fill="#1A1A1A"/>

  <!-- diamante 1 -->
  <polygon points="350,138 460,193 350,248 240,193" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">Gli mancano fatti</text>
  <text x="350" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">o documenti tuoi?</text>

  <!-- ramo sì verso RAG -->
  <line x1="460" y1="193" x2="556" y2="193" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="566,193 554,187 554,199" fill="#1A1A1A"/>
  <text x="508" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2D5A5C">sì</text>
  <rect x="568" y="167" width="120" height="52" rx="10" fill="#2D5A5C"/>
  <text x="628" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">RAG</text>

  <!-- ramo no verso il basso -->
  <text x="368" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">no</text>
  <line x1="350" y1="248" x2="350" y2="286" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="350,296 344,284 356,284" fill="#1A1A1A"/>

  <!-- diamante 2 -->
  <polygon points="350,300 460,355 350,410 240,355" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">Serve un formato</text>
  <text x="350" y="367" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">o stile costante?</text>

  <!-- ramo sì verso fine-tuning -->
  <line x1="460" y1="355" x2="556" y2="355" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="566,355 554,349 554,361" fill="#1A1A1A"/>
  <text x="508" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C9A961">sì</text>
  <rect x="568" y="329" width="120" height="52" rx="10" fill="#C9A961"/>
  <text x="628" y="353" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Fine-</text>
  <text x="628" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">tuning</text>

  <!-- ramo no verso prompt -->
  <text x="368" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">no</text>
  <line x1="350" y1="410" x2="350" y2="444" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="350,454 344,442 356,442" fill="#1A1A1A"/>
  <rect x="280" y="456" width="140" height="44" rx="10" fill="#B5532C"/>
  <text x="350" y="484" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">Prompt</text>
</svg>
