<svg viewBox="0 0 720 620" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Albero di decisione: si parte sempre dal prompt, che è la leva più economica; se non basta e al modello mancano fatti o documenti propri si aggiunge il RAG; se non basta e serve un comportamento costante su molti casi si passa al fine-tuning; altrimenti si torna a riscrivere il prompt e a misurare">
  <rect x="0" y="0" width="720" height="620" fill="#F8F5EE"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Da dove cominciare, e quando salire</text>

  <rect x="250" y="52" width="220" height="52" rx="10" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="360" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">Il modello non fa</text>
  <text x="360" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">quello che voglio</text>
  <line x1="360" y1="104" x2="360" y2="128" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="360,138 354,126 366,126" fill="#1A1A1A"/>

  <!-- 1: il prompt, la leva piu' economica: si prova per prima -->
  <rect x="260" y="140" width="200" height="52" rx="10" fill="#B5532C"/>
  <text x="360" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">1 · Prompt</text>
  <text x="478" y="160" font-family="sans-serif" font-size="12" fill="#5A524A">istruzioni, esempi, formato:</text>
  <text x="478" y="177" font-family="sans-serif" font-size="12" fill="#5A524A">costa meno, si prova per prima</text>
  <text x="378" y="214" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">non basta</text>
  <line x1="360" y1="192" x2="360" y2="228" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="360,238 354,226 366,226" fill="#1A1A1A"/>

  <!-- 2: mancano fatti? -->
  <polygon points="360,242 480,300 360,358 240,300" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">Gli mancano fatti</text>
  <text x="360" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">o documenti tuoi?</text>
  <line x1="480" y1="300" x2="556" y2="300" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="566,300 554,294 554,306" fill="#1A1A1A"/>
  <text x="518" y="291" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2D5A5C">sì</text>
  <rect x="568" y="274" width="120" height="52" rx="10" fill="#2D5A5C"/>
  <text x="628" y="306" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">2 · RAG</text>
  <text x="378" y="382" font-family="sans-serif" font-size="12" fill="#1A1A1A">no</text>
  <line x1="360" y1="358" x2="360" y2="396" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="360,406 354,394 366,394" fill="#1A1A1A"/>

  <!-- 3: comportamento costante che il prompt non tiene? -->
  <polygon points="360,410 500,478 360,546 220,478" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="464" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">Serve un comportamento</text>
  <text x="360" y="481" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">costante che il prompt</text>
  <text x="360" y="498" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">non riesce a tenere?</text>
  <line x1="500" y1="478" x2="556" y2="478" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="566,478 554,472 554,484" fill="#1A1A1A"/>
  <text x="528" y="469" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C9A961">sì</text>
  <rect x="568" y="452" width="130" height="52" rx="10" fill="#C9A961"/>
  <text x="633" y="476" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">3 · Fine-</text>
  <text x="633" y="493" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">tuning</text>

  <line x1="220" y1="478" x2="150" y2="478" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="140,478 152,472 152,484" fill="#1A1A1A"/>
  <text x="184" y="469" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">no</text>
  <rect x="14" y="452" width="126" height="52" rx="10" fill="none" stroke="#B5532C" stroke-width="2"/>
  <text x="77" y="476" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#B5532C">riscrivi il prompt</text>
  <text x="77" y="493" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#B5532C">e misura</text>

  <text x="360" y="588" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#5A524A">Si sale solo quando serve: il fine-tuning non è più avanzato del prompt, è più caro.</text>
</svg>
