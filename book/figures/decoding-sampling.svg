<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="Tre istogrammi della stessa distribuzione sulla parola successiva dopo Il gatto nero salta sul, a temperatura 0,5, 1 e 2: a temperatura bassa quasi tutta la probabilita' va su muro, a temperatura alta la distribuzione si appiattisce; sul pannello centrale un riquadro tratteggiato racchiude il nucleo del top-p pari a 0,9 con muro, tetto e divano, ed esclude pigiama.">

  <!-- titolo interno -->
  <text x="430" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A">Con che parola continua &#171;Il gatto nero salta sul&#8230;&#187;?</text>

  <!-- ============ pannello 1: T = 0,5 ============ -->
  <text x="149" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#B5532C">T = 0,5</text>

  <rect x="48" y="113" width="40" height="199" rx="4" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="102" y="285" width="40" height="27" rx="4" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="156" y="308" width="40" height="4" rx="1" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="210" y="310.5" width="40" height="1.5" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="1.5"/>

  <text x="68" y="106" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,87</text>
  <text x="122" y="278" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,12</text>
  <text x="176" y="301" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,02</text>
  <text x="230" y="304" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">0,00</text>

  <line x1="40" y1="312" x2="258" y2="312" stroke="#5E5852" stroke-width="1.5"/>
  <text x="68" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">muro</text>
  <text x="122" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">tetto</text>
  <text x="176" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">divano</text>
  <text x="230" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">pigiama</text>
  <text x="149" y="354" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">quasi greedy: vince quasi sempre &#171;muro&#187;</text>

  <!-- ============ pannello 2: T = 1 ============ -->
  <text x="429" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#B5532C">T = 1</text>

  <!-- nucleo del top-p: riquadro tratteggiato attorno alle prime tre barre -->
  <rect x="320" y="138" width="164" height="178" rx="8" fill="none" stroke="#C9A961" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="402" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#C9A961">nucleo top-p = 0,9</text>

  <rect x="328" y="161" width="40" height="151" rx="4" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="382" y="256" width="40" height="56" rx="4" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="436" y="292" width="40" height="20" rx="4" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="490" y="309" width="40" height="3" rx="1" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="1.5"/>

  <text x="348" y="154" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,66</text>
  <text x="402" y="249" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,24</text>
  <text x="456" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,09</text>
  <text x="510" y="302" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">0,01</text>

  <text x="510" y="268" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">fuori dal</text>
  <text x="510" y="281" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">nucleo</text>

  <line x1="320" y1="312" x2="538" y2="312" stroke="#5E5852" stroke-width="1.5"/>
  <text x="348" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">muro</text>
  <text x="402" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">tetto</text>
  <text x="456" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">divano</text>
  <text x="510" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">pigiama</text>
  <text x="429" y="354" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">la distribuzione del modello</text>

  <!-- ============ pannello 3: T = 2 ============ -->
  <text x="709" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#B5532C">T = 2</text>

  <rect x="608" y="203" width="40" height="109" rx="4" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="662" y="246" width="40" height="66" rx="4" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="716" y="272" width="40" height="40" rx="4" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="770" y="297" width="40" height="15" rx="4" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>

  <text x="628" y="196" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,47</text>
  <text x="682" y="239" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,29</text>
  <text x="736" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,17</text>
  <text x="790" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">0,06</text>

  <line x1="600" y1="312" x2="818" y2="312" stroke="#5E5852" stroke-width="1.5"/>
  <text x="628" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">muro</text>
  <text x="682" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">tetto</text>
  <text x="736" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">divano</text>
  <text x="790" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A1A1A">pigiama</text>
  <text x="709" y="354" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">quasi uniforme: pi&#249; variet&#224;, pi&#249; rischio</text>

  <!-- didascalia interna -->
  <text x="430" y="386" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">temperatura bassa = dado truccato verso &#171;muro&#187;; il tratteggio &#232; il nucleo tenuto in gioco dal top-p</text>
</svg>
