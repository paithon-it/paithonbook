    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .curva { fill:none; stroke-width:2.6; stroke-linejoin:round; stroke-dasharray:1000; }
    .guida { stroke-width:1.2; opacity:0.7; }
    .fondo { stroke:#5A524A; stroke-width:1.6; stroke-dasharray:7 5; }
    .lbf   { font-family:Inter, system-ui, sans-serif; font-size:12px; fill:#5A524A; }
        @keyframes tira2{0.00%{stroke-dashoffset:1000}78.00%{stroke-dashoffset:0}100.00%{stroke-dashoffset:0}}
    @keyframes tira1{0.00%{stroke-dashoffset:1000}78.00%{stroke-dashoffset:0}100.00%{stroke-dashoffset:0}}
    @keyframes tira0{0.00%{stroke-dashoffset:1000}78.00%{stroke-dashoffset:0}100.00%{stroke-dashoffset:0}}
