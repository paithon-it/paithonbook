<svg viewBox="0 0 720 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le due direzioni di un modello a variabile latente: generare e risalire">
  <rect x="0" y="0" width="720" height="470" fill="#F8F5EE"/>

  <!-- ============ riquadro alto: il latente ============ -->
  <rect x="150" y="24" width="420" height="140" fill="none" stroke="#2D5A5C" stroke-width="2" rx="10"/>
  <text x="360" y="50" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2D5A5C" text-anchor="middle">quello che non si vede</text>

  <!-- campana gaussiana -->
  <path d="M215,138 C255,138 262,72 300,72 C338,72 345,138 385,138"
        fill="#2D5A5C" fill-opacity="0.16" stroke="#2D5A5C" stroke-width="2"/>
  <line x1="205" y1="138" x2="395" y2="138" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="300" cy="105" r="4.5" fill="#2D5A5C"/>
  <circle cx="336" cy="121" r="4.5" fill="#2D5A5C"/>
  <circle cx="271" cy="118" r="4.5" fill="#2D5A5C"/>

  <text x="430" y="98" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">z: una nuvola semplice,</text>
  <text x="430" y="118" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">scelta da noi</text>
  <text x="430" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" opacity="0.62">qui si sorteggia per primo</text>

  <!-- ============ frecce ============ -->
  <line x1="240" y1="172" x2="240" y2="296" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="240,306 234,292 246,292" fill="#1A1A1A"/>
  <text x="228" y="228" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="end">generare</text>
  <text x="228" y="248" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" opacity="0.62" text-anchor="end">un passaggio</text>
  <text x="228" y="264" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" opacity="0.62" text-anchor="end">della rete</text>

  <line x1="480" y1="296" x2="480" y2="172" stroke="#B5532C" stroke-width="2" stroke-dasharray="7 6"/>
  <polygon points="480,162 474,176 486,176" fill="#B5532C"/>
  <text x="494" y="228" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#B5532C">risalire</text>
  <text x="494" y="248" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" opacity="0.62">da quale punto</text>
  <text x="494" y="264" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" opacity="0.62">sarà venuto?</text>

  <!-- ============ riquadro basso: i dati ============ -->
  <rect x="150" y="306" width="420" height="140" fill="none" stroke="#B5532C" stroke-width="2" rx="10"/>
  <text x="360" y="332" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#B5532C" text-anchor="middle">quello che si vede</text>

  <!-- nuvola irregolare di dati -->
  <circle cx="213" cy="404" r="4" fill="#B5532C"/>
  <circle cx="228" cy="388" r="4" fill="#B5532C"/>
  <circle cx="236" cy="410" r="4" fill="#B5532C"/>
  <circle cx="249" cy="371" r="4" fill="#B5532C"/>
  <circle cx="253" cy="397" r="4" fill="#B5532C"/>
  <circle cx="266" cy="416" r="4" fill="#B5532C"/>
  <circle cx="272" cy="380" r="4" fill="#B5532C"/>
  <circle cx="288" cy="399" r="4" fill="#B5532C"/>
  <circle cx="296" cy="366" r="4" fill="#B5532C"/>
  <circle cx="305" cy="421" r="4" fill="#B5532C"/>
  <circle cx="318" cy="386" r="4" fill="#B5532C"/>
  <circle cx="331" cy="408" r="4" fill="#B5532C"/>
  <circle cx="343" cy="374" r="4" fill="#B5532C"/>
  <circle cx="352" cy="418" r="4" fill="#B5532C"/>
  <circle cx="361" cy="392" r="4" fill="#B5532C"/>
  <circle cx="374" cy="369" r="4" fill="#B5532C"/>
  <circle cx="381" cy="412" r="4" fill="#B5532C"/>
  <circle cx="393" cy="389" r="4" fill="#B5532C"/>

  <text x="430" y="380" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">x: i dati veri,</text>
  <text x="430" y="400" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A">sparsi come capita</text>
  <text x="430" y="422" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" opacity="0.62">gli unici che si osservano</text>
</svg>
