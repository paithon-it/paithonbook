<svg viewBox="0 0 760 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Catena di tokenizzazione: la parola straordinariamente viene spezzata in cinque subword e poi convertita in cinque id numerici">
  <rect x="0" y="0" width="760" height="300" fill="#F8F5EE"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Da parola a numeri, in due tagli</text>
  <!-- fase 1: parola -->
  <text x="90" y="72" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2D5A5C">1. PAROLA</text>
  <rect x="90" y="84" width="580" height="48" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="380" y="114" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#1A1A1A">straordinariamente</text>
  <!-- frecce -->
  <g stroke="#1A1A1A" stroke-width="1.5" fill="none">
    <line x1="380" y1="132" x2="380" y2="152"/>
    <path d="M 374 146 L 380 154 L 386 146"/>
  </g>
  <!-- fase 2: subword, come le taglia il tokenizzatore di GPT-2 -->
  <text x="90" y="150" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2D5A5C">2. SUBWORD</text>
  <rect x="90" y="160" width="100" height="48" rx="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="140" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#F8F5EE">stra</text>
  <rect x="210" y="160" width="100" height="48" rx="6" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="260" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#F8F5EE">ord</text>
  <rect x="330" y="160" width="100" height="48" rx="6" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="380" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#1A1A1A">inar</text>
  <rect x="450" y="160" width="100" height="48" rx="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#F8F5EE">iam</text>
  <rect x="570" y="160" width="100" height="48" rx="6" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="620" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#F8F5EE">ente</text>
  <!-- frecce verso id -->
  <g stroke="#1A1A1A" stroke-width="1.5" fill="none">
    <line x1="140" y1="208" x2="140" y2="228"/>
    <path d="M 134 222 L 140 230 L 146 222"/>
    <line x1="260" y1="208" x2="260" y2="228"/>
    <path d="M 254 222 L 260 230 L 266 222"/>
    <line x1="380" y1="208" x2="380" y2="228"/>
    <path d="M 374 222 L 380 230 L 386 222"/>
    <line x1="500" y1="208" x2="500" y2="228"/>
    <path d="M 494 222 L 500 230 L 506 222"/>
    <line x1="620" y1="208" x2="620" y2="228"/>
    <path d="M 614 222 L 620 230 L 626 222"/>
  </g>
  <!-- fase 3: id -->
  <text x="90" y="228" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2D5A5C">3. ID</text>
  <rect x="95" y="236" width="90" height="40" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="140" y="262" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#1A1A1A">3534</text>
  <rect x="215" y="236" width="90" height="40" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="260" y="262" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#1A1A1A">585</text>
  <rect x="335" y="236" width="90" height="40" rx="6" fill="#F8F5EE" stroke="#C9A961" stroke-width="2"/>
  <text x="380" y="262" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#1A1A1A">22050</text>
  <rect x="455" y="236" width="90" height="40" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="500" y="262" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#1A1A1A">1789</text>
  <rect x="575" y="236" width="90" height="40" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="620" y="262" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#1A1A1A">21872</text>
</svg>
