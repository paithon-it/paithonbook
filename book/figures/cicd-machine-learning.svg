<svg viewBox="0 0 680 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline CI/CD per il machine learning: dalla pull request si passa a build e test, poi all'addestramento e alla valutazione in cross-validation, quindi a un gate di qualita' a forma di rombo. Se il modello supera la soglia ed e' migliore della baseline, si procede a merge e deploy; se non la supera, il merge viene bloccato e si torna a correggere.">
  <rect x="0" y="0" width="680" height="360" fill="#F8F5EE"/>
  <!-- flusso principale -->
  <g font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">
    <rect x="16" y="52" width="96" height="52" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
    <text x="64" y="83">pull request</text>
    <rect x="140" y="52" width="96" height="52" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
    <text x="188" y="76">build +</text>
    <text x="188" y="92">test codice</text>
    <rect x="264" y="52" width="88" height="52" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
    <text x="308" y="83">addestra</text>
    <rect x="380" y="52" width="96" height="52" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
    <text x="428" y="76">valuta</text>
    <text x="428" y="92">(cross-val)</text>
  </g>
  <!-- frecce flusso principale -->
  <g stroke="#1A1A1A" stroke-width="1.5" fill="#1A1A1A">
    <line x1="112" y1="78" x2="136" y2="78"/><path d="M140 78 l-9 -5 v10 z"/>
    <line x1="236" y1="78" x2="260" y2="78"/><path d="M264 78 l-9 -5 v10 z"/>
    <line x1="352" y1="78" x2="376" y2="78"/><path d="M380 78 l-9 -5 v10 z"/>
  </g>
  <!-- gate a rombo -->
  <polygon points="560,44 616,88 560,132 504,88" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="560" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A" font-weight="bold">gate</text>
  <text x="560" y="98" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">F1 &#8805; soglia?</text>
  <!-- freccia valuta -> gate -->
  <g stroke="#1A1A1A" stroke-width="1.5" fill="#1A1A1A">
    <line x1="476" y1="78" x2="500" y2="82"/><path d="M504 82 l-10 -3 v10 z"/>
  </g>
  <!-- ramo SI -> merge/deploy -->
  <rect x="360" y="252" width="140" height="56" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="430" y="277" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">merge + deploy</text>
  <text x="430" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2D5A5C">nuova baseline</text>
  <path d="M545 128 C 500 175, 445 200, 432 248" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <path d="M432 252 l2 -11 l-8 6 z" fill="#2D5A5C"/>
  <text x="470" y="180" font-family="sans-serif" font-size="12" fill="#2D5A5C" font-weight="bold">s&#236;</text>
  <!-- ramo NO -> blocca -->
  <rect x="150" y="252" width="140" height="56" rx="8" fill="none" stroke="#B5532C" stroke-width="2.5"/>
  <text x="220" y="277" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">blocca il merge</text>
  <text x="220" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B5532C">torna a correggere</text>
  <path d="M540 120 C 420 190, 300 200, 240 248" fill="none" stroke="#B5532C" stroke-width="2"/>
  <path d="M240 252 l6 -10 l-9 3 z" fill="#B5532C"/>
  <text x="360" y="168" font-family="sans-serif" font-size="12" fill="#B5532C" font-weight="bold">no</text>
</svg>
