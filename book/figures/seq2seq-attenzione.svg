<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-label="Encoder-decoder con attenzione: in basso sei stati dell'encoder bidirezionale per Il gatto nero salta sul muro, in alto il decoder che genera The black cat; mentre produce cat, frecce di spessore diverso collegano ogni stato dell'encoder al decoder, e la piu spessa parte da gatto.">
  <defs>
    <marker id="freccia-s2s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E5852"/>
    </marker>
  </defs>

  <!-- etichette di riga -->
  <text x="14" y="76" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#B5532C">decoder</text>
  <text x="14" y="320" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#2D5A5C">encoder</text>
  <text x="14" y="337" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">(bidirezionale)</text>

  <!-- parole generate dal decoder -->
  <text x="250" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">The</text>
  <text x="390" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">black</text>
  <text x="530" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="700" fill="#B5532C">cat</text>
  <line x1="250" y1="46" x2="250" y2="34" stroke="#5E5852" stroke-width="1.5" marker-end="url(#freccia-s2s)"/>
  <line x1="390" y1="46" x2="390" y2="34" stroke="#5E5852" stroke-width="1.5" marker-end="url(#freccia-s2s)"/>
  <line x1="530" y1="46" x2="530" y2="34" stroke="#B5532C" stroke-width="2" marker-end="url(#freccia-s2s)"/>

  <!-- celle del decoder -->
  <rect x="204" y="50" width="92" height="44" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="250" y="77" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">s&#8321;</text>
  <rect x="344" y="50" width="92" height="44" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="390" y="77" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">s&#8322;</text>
  <rect x="484" y="50" width="92" height="44" rx="8" fill="#B5532C" fill-opacity="0.15" stroke="#B5532C" stroke-width="2.5"/>
  <text x="530" y="77" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">s&#8323;</text>
  <rect x="624" y="50" width="92" height="44" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="670" y="77" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#5E5852">&#8230;</text>

  <!-- ricorrenza del decoder (solo in avanti) -->
  <line x1="298" y1="72" x2="340" y2="72" stroke="#5E5852" stroke-width="2" marker-end="url(#freccia-s2s)"/>
  <line x1="438" y1="72" x2="480" y2="72" stroke="#5E5852" stroke-width="2" marker-end="url(#freccia-s2s)"/>
  <line x1="578" y1="72" x2="620" y2="72" stroke="#5E5852" stroke-width="2" marker-end="url(#freccia-s2s)"/>

  <!-- frecce di attenzione: da ogni stato encoder verso s3, spessore = peso -->
  <line x1="156" y1="296" x2="506" y2="98" stroke="#C9A961" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="268" y1="296" x2="516" y2="98" stroke="#C9A961" stroke-width="5"/>
  <line x1="380" y1="296" x2="526" y2="98" stroke="#C9A961" stroke-width="2.5" stroke-opacity="0.9"/>
  <line x1="492" y1="296" x2="536" y2="98" stroke="#C9A961" stroke-width="1.2" stroke-opacity="0.55"/>
  <line x1="604" y1="296" x2="546" y2="98" stroke="#C9A961" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="716" y1="296" x2="556" y2="98" stroke="#C9A961" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- pesi delle due frecce principali -->
  <text x="338" y="258" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1A1A1A">&#945; = 0,62</text>
  <text x="447" y="220" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">&#945; = 0,20</text>

  <!-- vettore di contesto -->
  <text x="24" y="150" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">c&#8323; = media pesata</text>
  <text x="24" y="166" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">degli stati dell'encoder</text>

  <!-- legenda -->
  <line x1="24" y1="206" x2="64" y2="206" stroke="#C9A961" stroke-width="5"/>
  <text x="72" y="210" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">peso &#945; grande</text>
  <line x1="24" y1="228" x2="64" y2="228" stroke="#C9A961" stroke-width="1" stroke-opacity="0.55"/>
  <text x="72" y="232" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">peso &#945; piccolo</text>

  <!-- celle dell'encoder -->
  <rect x="110" y="300" width="92" height="44" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <text x="156" y="327" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">h&#8321;</text>
  <rect x="222" y="300" width="92" height="44" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="268" y="327" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">h&#8322;</text>
  <rect x="334" y="300" width="92" height="44" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <text x="380" y="327" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">h&#8323;</text>
  <rect x="446" y="300" width="92" height="44" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <text x="492" y="327" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">h&#8324;</text>
  <rect x="558" y="300" width="92" height="44" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <text x="604" y="327" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">h&#8325;</text>
  <rect x="670" y="300" width="92" height="44" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <text x="716" y="327" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">h&#8326;</text>

  <!-- ricorrenza bidirezionale dell'encoder -->
  <line x1="204" y1="314" x2="220" y2="314" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>
  <line x1="220" y1="332" x2="204" y2="332" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>
  <line x1="316" y1="314" x2="332" y2="314" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>
  <line x1="332" y1="332" x2="316" y2="332" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>
  <line x1="428" y1="314" x2="444" y2="314" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>
  <line x1="444" y1="332" x2="428" y2="332" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>
  <line x1="540" y1="314" x2="556" y2="314" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>
  <line x1="556" y1="332" x2="540" y2="332" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>
  <line x1="652" y1="314" x2="668" y2="314" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>
  <line x1="668" y1="332" x2="652" y2="332" stroke="#5E5852" stroke-width="1.6" marker-end="url(#freccia-s2s)"/>

  <!-- parole sorgente -->
  <text x="156" y="374" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">Il</text>
  <text x="268" y="374" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="700" fill="#2D5A5C">gatto</text>
  <text x="380" y="374" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">nero</text>
  <text x="492" y="374" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">salta</text>
  <text x="604" y="374" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">sul</text>
  <text x="716" y="374" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A">muro</text>
  <line x1="156" y1="362" x2="156" y2="350" stroke="#5E5852" stroke-width="1.5" marker-end="url(#freccia-s2s)"/>
  <line x1="268" y1="362" x2="268" y2="350" stroke="#5E5852" stroke-width="1.5" marker-end="url(#freccia-s2s)"/>
  <line x1="380" y1="362" x2="380" y2="350" stroke="#5E5852" stroke-width="1.5" marker-end="url(#freccia-s2s)"/>
  <line x1="492" y1="362" x2="492" y2="350" stroke="#5E5852" stroke-width="1.5" marker-end="url(#freccia-s2s)"/>
  <line x1="604" y1="362" x2="604" y2="350" stroke="#5E5852" stroke-width="1.5" marker-end="url(#freccia-s2s)"/>
  <line x1="716" y1="362" x2="716" y2="350" stroke="#5E5852" stroke-width="1.5" marker-end="url(#freccia-s2s)"/>

  <!-- didascalia interna -->
  <text x="410" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">mentre genera &#171;cat&#187;, il decoder pesa tutti gli stati dell'encoder: il peso maggiore va a &#171;gatto&#187;</text>
</svg>
