<svg viewBox="0 0 720 420" width="100%" role="img" aria-label="Piano bidimensionale con cluster di parole: animali, città, verbi; frecce parallele da re a regina e da uomo a donna" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="420" fill="#F8F5EE"/>
  <line x1="60" y1="360" x2="680" y2="360" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="60" y1="360" x2="60" y2="30" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="655" y="385" font-family="sans-serif" font-size="13" fill="#1A1A1A">dim. 1</text>
  <text x="30" y="45" font-family="sans-serif" font-size="13" fill="#1A1A1A">dim. 2</text>

  <!-- cluster animali (teal) -->
  <circle cx="150" cy="110" r="7" fill="#2D5A5C"/>
  <text x="163" y="106" font-family="sans-serif" font-size="14" fill="#1A1A1A">gatto</text>
  <circle cx="185" cy="140" r="7" fill="#2D5A5C"/>
  <text x="198" y="136" font-family="sans-serif" font-size="14" fill="#1A1A1A">cane</text>
  <circle cx="130" cy="160" r="7" fill="#2D5A5C"/>
  <text x="143" y="172" font-family="sans-serif" font-size="14" fill="#1A1A1A">volpe</text>
  <text x="120" y="80" font-family="sans-serif" font-size="12" fill="#2D5A5C">ANIMALI</text>

  <!-- cluster città (ocra) -->
  <circle cx="560" cy="100" r="7" fill="#C9A961"/>
  <text x="573" y="96" font-family="sans-serif" font-size="14" fill="#1A1A1A">Milano</text>
  <circle cx="600" cy="135" r="7" fill="#C9A961"/>
  <text x="613" y="131" font-family="sans-serif" font-size="14" fill="#1A1A1A">Roma</text>
  <circle cx="545" cy="150" r="7" fill="#C9A961"/>
  <text x="558" y="164" font-family="sans-serif" font-size="14" fill="#1A1A1A">Torino</text>
  <text x="540" y="70" font-family="sans-serif" font-size="12" fill="#9A8342">CITTÀ</text>

  <!-- cluster verbi (warm black) -->
  <circle cx="340" cy="310" r="7" fill="#1A1A1A"/>
  <text x="353" y="306" font-family="sans-serif" font-size="14" fill="#1A1A1A">correre</text>
  <circle cx="300" cy="330" r="7" fill="#1A1A1A"/>
  <text x="220" y="335" font-family="sans-serif" font-size="14" fill="#1A1A1A">saltare</text>
  <circle cx="370" cy="340" r="7" fill="#1A1A1A"/>
  <text x="383" y="346" font-family="sans-serif" font-size="14" fill="#1A1A1A">nuotare</text>
  <text x="300" y="285" font-family="sans-serif" font-size="12" fill="#5E5852">VERBI</text>

  <!-- analogia re->regina, uomo->donna (terracotta) -->
  <defs>
    <marker id="freccia" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#B5532C"/>
    </marker>
  </defs>
  <circle cx="420" cy="210" r="7" fill="#B5532C"/>
  <text x="400" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">re</text>
  <circle cx="530" cy="250" r="7" fill="#B5532C"/>
  <text x="543" y="256" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">regina</text>
  <line x1="430" y1="214" x2="518" y2="246" stroke="#B5532C" stroke-width="2" marker-end="url(#freccia)"/>

  <circle cx="300" cy="185" r="7" fill="#B5532C"/>
  <text x="255" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">uomo</text>
  <circle cx="410" cy="125" r="7" fill="#B5532C"/>
  <text x="423" y="121" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">donna</text>
  <line x1="310" y1="181" x2="398" y2="130" stroke="#B5532C" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#freccia)"/>
  <line x1="430" y1="206" x2="518" y2="155" stroke="#B5532C" stroke-width="2" stroke-dasharray="6 4" opacity="0.45" marker-end="url(#freccia)"/>
  <text x="450" y="170" font-family="sans-serif" font-size="12" fill="#B5532C">stessa direzione</text>
</svg>
