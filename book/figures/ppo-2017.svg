<svg viewBox="0 0 760 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagramma: dalla policy vecchia un piccolo passo verso la policy nuova resta dentro la fascia consentita ed è permesso, mentre un salto lungo esce dalla fascia e viene tagliato">
  <rect x="0" y="0" width="760" height="320" fill="#F8F5EE"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Un passo alla volta, dentro la fascia</text>

  <!-- fascia consentita -->
  <ellipse cx="250" cy="180" rx="150" ry="96" fill="none" stroke="#2D5A5C" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="250" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2D5A5C">zona consentita: rapporto tra 0,8 e 1,2</text>

  <!-- policy vecchia -->
  <circle cx="250" cy="180" r="9" fill="#1A1A1A"/>
  <text x="250" y="214" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">policy vecchia</text>

  <!-- piccolo passo consentito -->
  <line x1="259" y1="176" x2="332" y2="150" stroke="#2D5A5C" stroke-width="3"/>
  <path d="M332 150 L 320 149 L 325 159 Z" fill="#2D5A5C"/>
  <circle cx="336" cy="149" r="8" fill="#2D5A5C"/>
  <text x="360" y="132" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2D5A5C">policy nuova</text>
  <text x="360" y="147" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#2D5A5C">passo piccolo: ok</text>

  <!-- salto lungo tagliato -->
  <line x1="259" y1="186" x2="470" y2="252" stroke="#B5532C" stroke-width="3" stroke-dasharray="9 6"/>
  <path d="M470 252 L 458 248 L 460 259 Z" fill="#B5532C"/>
  <!-- barriera / taglio -->
  <line x1="398" y1="212" x2="430" y2="248" stroke="#B5532C" stroke-width="2.5"/>
  <line x1="430" y1="212" x2="398" y2="248" stroke="#B5532C" stroke-width="2.5"/>
  <text x="560" y="244" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#B5532C">salto lungo: tagliato</text>
  <text x="560" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#B5532C">oltre la fascia l'obiettivo</text>
  <text x="560" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#B5532C">non premia più</text>

  <text x="250" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">il clip tiene la nuova strategia vicina alla vecchia, aggiornamento dopo aggiornamento</text>
</svg>
