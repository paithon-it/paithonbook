<svg viewBox="0 0 720 420" width="100%" role="img" aria-label="Piano cartesiano con due vettori come frecce dall'origine, la loro somma e il parallelogramma tratteggiato; a destra la stessa informazione come liste di numeri" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="420" fill="#F8F5EE"/>
  <defs>
    <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5532C"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2D5A5C"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A961"/></marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker>
  </defs>
  <!-- griglia leggera -->
  <g stroke="#C9C2B4" stroke-width="0.7">
    <line x1="135" y1="40" x2="135" y2="360"/><line x1="190" y1="40" x2="190" y2="360"/><line x1="245" y1="40" x2="245" y2="360"/><line x1="300" y1="40" x2="300" y2="360"/><line x1="355" y1="40" x2="355" y2="360"/><line x1="410" y1="40" x2="410" y2="360"/>
    <line x1="80" y1="285" x2="440" y2="285"/><line x1="80" y1="230" x2="440" y2="230"/><line x1="80" y1="175" x2="440" y2="175"/><line x1="80" y1="120" x2="440" y2="120"/><line x1="80" y1="65" x2="440" y2="65"/>
  </g>
  <!-- assi -->
  <line x1="80" y1="340" x2="450" y2="340" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrK)"/>
  <line x1="80" y1="340" x2="80" y2="45" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="455" y="345" font-family="sans-serif" font-size="14" fill="#1A1A1A">x</text>
  <text x="72" y="38" font-family="sans-serif" font-size="14" fill="#1A1A1A">y</text>
  <text x="66" y="356" font-family="sans-serif" font-size="12" fill="#5E5852">0</text>
  <!-- parallelogramma tratteggiato -->
  <line x1="245" y1="230" x2="300" y2="65" stroke="#8B847C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="135" y1="175" x2="300" y2="65" stroke="#8B847C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- vettori -->
  <line x1="80" y1="340" x2="245" y2="230" stroke="#B5532C" stroke-width="2" marker-end="url(#arrT)"/>
  <line x1="80" y1="340" x2="135" y2="175" stroke="#2D5A5C" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="80" y1="340" x2="300" y2="65" stroke="#C9A961" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="200" y="290" font-family="sans-serif" font-size="15" font-weight="bold" fill="#B5532C">v</text>
  <text x="92" y="235" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2D5A5C">w</text>
  <text x="250" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#C9A961">v + w</text>
  <!-- pannello liste -->
  <rect x="490" y="70" width="200" height="280" fill="#F8F5EE" stroke="#C9C2B4" stroke-width="1.5" rx="8"/>
  <text x="590" y="102" font-family="sans-serif" font-size="13" fill="#5E5852" text-anchor="middle">stessa cosa, come liste</text>
  <text x="510" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#B5532C">v = [3, 2]</text>
  <text x="510" y="200" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2D5A5C">w = [1, 3]</text>
  <line x1="510" y1="228" x2="670" y2="228" stroke="#C9C2B4" stroke-width="1.5"/>
  <text x="510" y="266" font-family="sans-serif" font-size="16" font-weight="bold" fill="#C9A961">v + w = [4, 5]</text>
  <text x="510" y="310" font-family="sans-serif" font-size="12" fill="#5E5852">somma elemento</text>
  <text x="510" y="328" font-family="sans-serif" font-size="12" fill="#5E5852">per elemento</text>
</svg>
