<svg viewBox="0 0 760 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Griglia dei bit di float32, float16 e bfloat16">
  <rect x="0" y="0" width="760" height="300" fill="#F8F5EE"/>
  <!-- legenda -->
  <rect x="40" y="20" width="14" height="14" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="62" y="32" font-family="sans-serif" font-size="13" fill="#1A1A1A">segno</text>
  <rect x="130" y="20" width="14" height="14" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="152" y="32" font-family="sans-serif" font-size="13" fill="#1A1A1A">esponente (portata)</text>
  <rect x="310" y="20" width="14" height="14" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="332" y="32" font-family="sans-serif" font-size="13" fill="#1A1A1A">mantissa (precisione)</text>
  <!-- float32: 1+8+23, scala 21px/bit -->
  <text x="40" y="78" font-family="sans-serif" font-size="14" fill="#1A1A1A" font-weight="bold">float32</text>
  <rect x="40" y="88" width="21" height="30" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="61" y="88" width="168" height="30" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="229" y="88" width="483" height="30" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="145" y="108" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">8 bit</text>
  <text x="470" y="108" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">23 bit</text>
  <!-- float16: 1+5+10 -->
  <text x="40" y="158" font-family="sans-serif" font-size="14" fill="#1A1A1A" font-weight="bold">float16</text>
  <rect x="40" y="168" width="21" height="30" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="61" y="168" width="105" height="30" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="166" y="168" width="210" height="30" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="113" y="188" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">5 bit</text>
  <text x="271" y="188" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">10 bit</text>
  <text x="392" y="188" font-family="sans-serif" font-size="12" fill="#1A1A1A">← portata ridotta: max ~65 504</text>
  <!-- bfloat16: 1+8+7 -->
  <text x="40" y="238" font-family="sans-serif" font-size="14" fill="#1A1A1A" font-weight="bold">bfloat16</text>
  <rect x="40" y="248" width="21" height="30" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="61" y="248" width="168" height="30" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="229" y="248" width="147" height="30" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="145" y="268" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">8 bit</text>
  <text x="302" y="268" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">7 bit</text>
  <text x="392" y="268" font-family="sans-serif" font-size="12" fill="#1A1A1A">← stessa portata di float32, grana grossa</text>
</svg>
