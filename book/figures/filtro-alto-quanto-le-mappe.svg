<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340"
     role="img" aria-label="Due pannelli affiancati mostrano lo stesso percorso a due strati diversi. A sinistra, il primo strato: tre mappe quadrate sfalsate in un mazzo, ciascuna divisa in venticinque celle, con la stessa finestra da tre per tre evidenziata nello stesso punto di tutte e tre. Una freccia porta a un mazzo di tre griglie da nove, che è il filtro, poi a un cerchio col simbolo di somma, poi a una mappa in uscita in cui una sola casella è colorata. Sotto, il conto: una griglia per ogni mappa che arriva, tre per tre per tre fa ventisette pesi, ventotto col bias, e con trentadue filtri escono trentadue mappe e trentadue per ventotto fa ottocentonovantasei pesi. A destra, lo strato dopo: identico, ma le mappe in ingresso sono trentadue, disegnate come quattro mappe più dei puntini di continuazione, e il mazzo del filtro è alto trentadue allo stesso modo; l'uscita resta una casella sola.">
