<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" role="img" aria-label="Il ciclo del loop engineering a quattro fasi disposte in cerchio: in alto PLAN (pianifica), a destra EXECUTE (esegui con gli strumenti), in basso VERIFY (verifica con test e lint: il cancello), a sinistra REFLECT (rifletti sugli errori). Frecce in senso orario chiudono il cerchio; dal nodo VERIFY una freccia di uscita porta a un traguardo 'consegna', raggiungibile solo se i controlli passano; se falliscono, si torna a REFLECT e si ripianifica.">
  <defs>
    <marker id="fn-lp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="ft-lp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2D5A5C"/>
    </marker>
  </defs>

  <!-- frecce del ciclo (orario) -->
  <path d="M 462 100 Q 600 118 634 214" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fn-lp)"/>
  <path d="M 634 286 Q 606 392 462 402" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fn-lp)"/>
  <path d="M 298 402 Q 156 392 126 286" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fn-lp)"/>
  <path d="M 126 214 Q 156 118 298 100" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fn-lp)"/>

  <!-- etichette sulle transizioni -->
  <text x="150" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#5E5852">ripianifica</text>
  <text x="150" y="454" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#5E5852">fallisce &#8594; corregge</text>

  <!-- centro -->
  <text x="380" y="244" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">il ciclo si ripete</text>
  <text x="380" y="261" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">finché il cancello non passa</text>

  <!-- PLAN -->
  <rect x="300" y="54" width="160" height="64" rx="10" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="380" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="700" fill="#1A1A1A">1 &#183; PLAN</text>
  <text x="380" y="101" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">pianifica: scompone il compito</text>

  <!-- EXECUTE -->
  <rect x="560" y="218" width="160" height="64" rx="10" fill="#B5532C" fill-opacity="0.14" stroke="#B5532C" stroke-width="2.5"/>
  <text x="640" y="246" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="700" fill="#1A1A1A">2 &#183; EXECUTE</text>
  <text x="640" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">esegue con gli strumenti</text>

  <!-- VERIFY -->
  <rect x="300" y="382" width="160" height="64" rx="10" fill="#C9A961" fill-opacity="0.16" stroke="#C9A961" stroke-width="2.5"/>
  <text x="380" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="700" fill="#1A1A1A">3 &#183; VERIFY</text>
  <text x="380" y="429" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">test e lint: il cancello</text>

  <!-- REFLECT -->
  <rect x="40" y="218" width="160" height="64" rx="10" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="120" y="246" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="700" fill="#1A1A1A">4 &#183; REFLECT</text>
  <text x="120" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">riflette sugli errori</text>

  <!-- uscita: cancello verso la consegna -->
  <path d="M 380 448 L 380 466" fill="none" stroke="#2D5A5C" stroke-width="2.5" marker-end="url(#ft-lp)"/>
  <rect x="312" y="484" width="136" height="38" rx="19" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="380" y="508" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1A1A1A">&#10003; consegna</text>
  <text x="468" y="471" text-anchor="start" font-family="Inter, sans-serif" font-size="10.5" fill="#5E5852">esce solo se i test passano</text>

  <!-- didascalia interna -->
  <text x="380" y="538" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">Il loop esterno: pianifica &#8594; esegui &#8594; verifica &#8594; rifletti, e si ripete. Il cancello lascia uscire solo ciò che supera i controlli.</text>
</svg>
