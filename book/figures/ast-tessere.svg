<?xml version="1.0" encoding="UTF-8"?>
<!--
  paithon book - figura: l'Audio Spectrogram Transformer.
  Sinistra: lo spettrogramma (tempo in orizzontale, frequenza in verticale)
  con un colpo secco (banda terracotta) e la sua eco (banda piu' tenue),
  tagliato in tessere dalla griglia. Destra: le tessere in fila; la tessera
  del colpo e quella dell'eco, lontane nella fila, si «guardano» con un arco
  di attenzione. Palette-locked, fondo trasparente.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img"
     aria-label="A sinistra uno spettrogramma stilizzato con il tempo in orizzontale e la frequenza in verticale: una banda verticale terracotta segna un colpo secco, e una banda piu' tenue, piu' avanti nel tempo, la sua eco; una griglia lo taglia in tessere quadrate. A destra le stesse tessere sono messe in fila come parole; un arco collega la tessera del colpo a quella dell'eco, lontane nella fila: e' l'attenzione che le fa guardare.">
  <style>
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:12px; font-weight:600; fill:#1A1A1A; }
    .leg { font-family:Inter, system-ui, sans-serif; font-size:11px; fill:#5E5852; }
  </style>

  <!-- SPETTROGRAMMA -->
  <g transform="translate(24,28)">
    <rect x="0" y="0" width="240" height="160" fill="#2D5A5C" opacity="0.14"/>
    <!-- colpo secco -->
    <rect x="48" y="0" width="26" height="160" fill="#B5532C" opacity="0.9"/>
    <!-- eco -->
    <rect x="150" y="30" width="20" height="130" fill="#B5532C" opacity="0.42"/>
    <!-- un po' di energia bassa continua -->
    <rect x="0" y="128" width="240" height="32" fill="#2D5A5C" opacity="0.35"/>
    <!-- griglia -->
    <g stroke="#1A1A1A" stroke-width="1.4" opacity="0.8">
      <line x1="0" y1="0" x2="240" y2="0"/><line x1="0" y1="40" x2="240" y2="40"/>
      <line x1="0" y1="80" x2="240" y2="80"/><line x1="0" y1="120" x2="240" y2="120"/>
      <line x1="0" y1="160" x2="240" y2="160"/>
      <line x1="0" y1="0" x2="0" y2="160"/><line x1="40" y1="0" x2="40" y2="160"/>
      <line x1="80" y1="0" x2="80" y2="160"/><line x1="120" y1="0" x2="120" y2="160"/>
      <line x1="160" y1="0" x2="160" y2="160"/><line x1="200" y1="0" x2="200" y2="160"/>
      <line x1="240" y1="0" x2="240" y2="160"/>
    </g>
    <text class="leg" x="120" y="180" text-anchor="middle">tempo →</text>
    <text class="leg" x="-12" y="80" text-anchor="middle" transform="rotate(-90,-12,80)">frequenza →</text>
    <text class="lbl" x="61" y="-8" text-anchor="middle" fill="#B5532C">il colpo</text>
    <text class="lbl" x="185" y="-8" text-anchor="middle" fill="#B5532C" opacity="0.75">l'eco</text>
  </g>

  <!-- freccia -->
  <path d="M 280,110 C 300,110 305,110 322,110" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="326,110 316,105 316,115" fill="#1A1A1A"/>
  <text class="leg" x="303" y="98" text-anchor="middle">in fila</text>

  <!-- LA FILA DI TESSERE -->
  <g transform="translate(338,84)">
    <g stroke="#1A1A1A" stroke-width="1.4">
      <rect x="0"   y="0" width="34" height="34" fill="#2D5A5C" opacity="0.25"/>
      <rect x="40"  y="0" width="34" height="34" fill="#B5532C" opacity="0.9"/>
      <rect x="80"  y="0" width="34" height="34" fill="#2D5A5C" opacity="0.25"/>
      <rect x="120" y="0" width="34" height="34" fill="#2D5A5C" opacity="0.4"/>
      <rect x="160" y="0" width="34" height="34" fill="#C9A961" opacity="0.5"/>
      <rect x="200" y="0" width="34" height="34" fill="#B5532C" opacity="0.42"/>
      <rect x="240" y="0" width="34" height="34" fill="#2D5A5C" opacity="0.25"/>
    </g>
    <!-- arco di attenzione fra colpo ed eco -->
    <path d="M 57,-6 C 100,-52 180,-52 217,-6" fill="none" stroke="#1A1A1A" stroke-width="2.2"/>
    <polygon points="217,-6 208,-14 215,-18" fill="#1A1A1A"/>
    <polygon points="57,-6 66,-14 59,-18" fill="#1A1A1A"/>
    <text class="lbl" x="137" y="-44" text-anchor="middle">si guardano</text>
    <text class="leg" x="137" y="58" text-anchor="middle">le tessere, come parole di una frase</text>
    <text class="leg" x="137" y="76" text-anchor="middle">niente filtri che scorrono: ogni tessera</text>
    <text class="leg" x="137" y="90" text-anchor="middle">sceglie da sola chi ascoltare</text>
  </g>
</svg>
