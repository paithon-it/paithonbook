<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Un kernel 3x3 su una porzione di griglia di input, con una freccia verso la cella corrispondente della feature map">
  <!-- Palette: terracotta #B5532C, teal #2D5A5C, ocra #C9A961, warm-black #1A1A1A, cream #F8F5EE, neutri #5E5852 #8B847C #C9C2B4 #E8E2D5 -->
  <defs>
    <marker id="cnn-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- ===== INPUT GRID 5x5 ===== -->
  <rect x="60" y="90" width="200" height="200" fill="#F8F5EE" stroke="#C9C2B4" stroke-width="1.5"/>
  <!-- linee verticali -->
  <line x1="100" y1="90" x2="100" y2="290" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="140" y1="90" x2="140" y2="290" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="180" y1="90" x2="180" y2="290" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="220" y1="90" x2="220" y2="290" stroke="#C9C2B4" stroke-width="1.5"/>
  <!-- linee orizzontali -->
  <line x1="60" y1="130" x2="260" y2="130" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="60" y1="170" x2="260" y2="170" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="60" y1="210" x2="260" y2="210" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="60" y1="250" x2="260" y2="250" stroke="#C9C2B4" stroke-width="1.5"/>

  <!-- kernel 3x3 evidenziato: finestra centrale (righe 2-4, colonne 2-4) -->
  <rect x="100" y="130" width="120" height="120" fill="#B5532C" fill-opacity="0.16" stroke="#B5532C" stroke-width="3.5"/>

  <!-- etichetta kernel -->
  <text x="160" y="120" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B5532C">kernel 3×3</text>
  <!-- titolo input -->
  <text x="160" y="318" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1A1A1A">Input (griglia di pixel)</text>

  <!-- ===== FRECCIA ===== -->
  <line x1="236" y1="190" x2="532" y2="190" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#cnn-arrow)"/>
  <text x="384" y="176" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#2D5A5C">somma pesata</text>
  <text x="384" y="212" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#5E5852">+ attivazione</text>

  <!-- ===== FEATURE MAP 3x3 ===== -->
  <rect x="540" y="130" width="120" height="120" fill="#F8F5EE" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="580" y1="130" x2="580" y2="250" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="620" y1="130" x2="620" y2="250" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="540" y1="170" x2="660" y2="170" stroke="#C9C2B4" stroke-width="1.5"/>
  <line x1="540" y1="210" x2="660" y2="210" stroke="#C9C2B4" stroke-width="1.5"/>

  <!-- cella di output corrispondente (centrale) -->
  <rect x="580" y="170" width="40" height="40" fill="#2D5A5C" fill-opacity="0.30" stroke="#2D5A5C" stroke-width="3"/>

  <!-- titolo feature map -->
  <text x="600" y="278" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#1A1A1A">Feature map</text>
  <text x="600" y="120" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#2D5A5C">una cella</text>
</svg>