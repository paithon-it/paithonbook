<svg viewBox="0 0 700 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema del confronto a coppie: la stessa domanda genera due risposte da due modelli diversi; un terzo modello, il giudice, le legge entrambe ed emette un verdetto">
  <rect x="0" y="0" width="700" height="420" fill="#F8F5EE"/>
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Il confronto a coppie</text>

  <!-- domanda -->
  <rect x="275" y="46" width="150" height="48" rx="10" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">Stessa domanda</text>

  <!-- frecce dalla domanda alle due risposte -->
  <line x1="320" y1="94" x2="185" y2="148" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="180,150 193,146 187,157" fill="#1A1A1A"/>
  <line x1="380" y1="94" x2="515" y2="148" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="520,150 507,157 513,146" fill="#1A1A1A"/>

  <!-- risposta A -->
  <rect x="60" y="150" width="190" height="72" rx="10" fill="#2D5A5C"/>
  <text x="155" y="181" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">Risposta A</text>
  <text x="155" y="203" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">dal modello 1</text>

  <!-- risposta B -->
  <rect x="450" y="150" width="190" height="72" rx="10" fill="#C9A961"/>
  <text x="545" y="181" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">Risposta B</text>
  <text x="545" y="203" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">dal modello 2</text>

  <!-- frecce verso il giudice -->
  <line x1="155" y1="222" x2="300" y2="288" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="305,290 292,290 298,281" fill="#1A1A1A"/>
  <line x1="545" y1="222" x2="400" y2="288" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="395,290 402,281 408,290" fill="#1A1A1A"/>

  <!-- giudice -->
  <rect x="255" y="290" width="190" height="66" rx="10" fill="#B5532C"/>
  <text x="350" y="319" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">Giudice</text>
  <text x="350" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">un terzo modello</text>

  <!-- freccia al verdetto -->
  <line x1="350" y1="356" x2="350" y2="388" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="350,398 344,386 356,386" fill="#1A1A1A"/>
  <text x="460" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" fill="#1A1A1A">verdetto: vince A</text>
</svg>
