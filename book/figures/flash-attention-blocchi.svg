<!--
  paithon book, figura animata: la online softmax scorre i blocchi e ricalibra
  Generata da animazioni/svg/flash-attention-blocchi.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 506"
     role="img" aria-label="Una riga di otto punteggi divisa in quattro blocchi da due. Una finestra scorre da sinistra a destra e in ogni istante mostra i numeri di un solo blocco: fuori dalla finestra le celle restano vuote, perché la matrice dei punteggi non viene mai scritta. Sotto, una tabella si riempie riga per riga con il massimo del blocco, il massimo corrente m, il fattore di riscalatura alfa, la somma corrente l e l'output accumulato O: quando arriva un massimo più grande, alfa scende sotto 1 e l'accumulatore viene riscalato. L'ultima riga dà O diviso l, che coincide con la softmax calcolata in un colpo solo.">
  <style>
    svg  { --d: 9.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .vuS  { fill:none; stroke:#B5532C; stroke-width:1.4;
            stroke-opacity:0.35; stroke-dasharray:4 4; }
    .vuV  { fill:none; stroke:#C5BEAA; stroke-width:1.4; }
    .pieS { fill:#B5532C; fill-opacity:0.18; stroke:#B5532C; stroke-width:2; }
    .pieV { fill:#C9A961; fill-opacity:0.3; stroke:#C9A961; stroke-width:1.8; }
    .valS { font-family:Inter, system-ui, sans-serif; font-size:19px; font-weight:700; fill:#1A1A1A; }
    .valV { font-family:Inter, system-ui, sans-serif; font-size:14px; fill:#1A1A1A; }
    .bloc { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .fbox { fill:none; stroke:#2D5A5C; stroke-width:3; }
    .ftag { font-family:Inter, system-ui, sans-serif; font-size:12.5px; font-weight:700; fill:#2D5A5C; }
    .fin  { transform-box:view-box; }
    .sim  { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .glo  { font-family:Inter, system-ui, sans-serif; font-size:11px; fill:#5A524A; }
    .cel1 { font-family:Inter, system-ui, sans-serif; font-size:14.5px; fill:#1A1A1A; }
    .su   { fill:#B5532C; font-weight:700; }
    .spento { fill:#5A524A; }
    .esito { font-family:Inter, system-ui, sans-serif; font-size:14.5px; font-weight:700; fill:#2D5A5C; }
        @keyframes c0{0.00%{opacity:1}12.40%{opacity:1}14.90%{opacity:0}100.00%{opacity:0}}
    @keyframes c1{0.00%{opacity:0}17.50%{opacity:0}20.00%{opacity:1}32.40%{opacity:1}34.90%{opacity:0}100.00%{opacity:0}}
    @keyframes c2{0.00%{opacity:0}37.50%{opacity:0}40.00%{opacity:1}52.40%{opacity:1}54.90%{opacity:0}100.00%{opacity:0}}
    @keyframes c3{0.00%{opacity:0}57.50%{opacity:0}60.00%{opacity:1}100.00%{opacity:1}}
    @keyframes fin{0.00%{transform:translate(-456px,0px)}12.40%{transform:translate(-456px,0px)}20.00%{transform:translate(-304px,0px)}32.40%{transform:translate(-304px,0px)}40.00%{transform:translate(-152px,0px)}52.40%{transform:translate(-152px,0px)}60.00%{transform:translate(0px,0px)}72.40%{transform:translate(0px,0px)}80.00%{transform:translate(0px,0px)}92.40%{transform:translate(0px,0px)}100.00%{transform:translate(0px,0px)}}
    @keyframes r0{0.00%{opacity:1}100.00%{opacity:1}}
    @keyframes r1{0.00%{opacity:0}17.50%{opacity:0}20.00%{opacity:1}100.00%{opacity:1}}
    @keyframes r2{0.00%{opacity:0}37.50%{opacity:0}40.00%{opacity:1}100.00%{opacity:1}}
    @keyframes r3{0.00%{opacity:0}57.50%{opacity:0}60.00%{opacity:1}100.00%{opacity:1}}
    @keyframes esi{0.00%{opacity:0}77.50%{opacity:0}80.00%{opacity:1}100.00%{opacity:1}}
    @media (prefers-reduced-motion:reduce) { .cel, .fin, .rig, .esito { animation:none !important; } }
  </style>
  <text class="lbl" x="30" y="26">s: i punteggi di una query contro otto chiavi (una riga di S), letti a blocchi di due</text><rect class="vuS" x="118" y="58" width="58" height="44" rx="5"/><rect class="vuV" x="118" y="108" width="58" height="30" rx="5"/><rect class="vuS" x="184" y="58" width="58" height="44" rx="5"/><rect class="vuV" x="184" y="108" width="58" height="30" rx="5"/><rect class="vuS" x="270" y="58" width="58" height="44" rx="5"/><rect class="vuV" x="270" y="108" width="58" height="30" rx="5"/><rect class="vuS" x="336" y="58" width="58" height="44" rx="5"/><rect class="vuV" x="336" y="108" width="58" height="30" rx="5"/><rect class="vuS" x="422" y="58" width="58" height="44" rx="5"/><rect class="vuV" x="422" y="108" width="58" height="30" rx="5"/><rect class="vuS" x="488" y="58" width="58" height="44" rx="5"/><rect class="vuV" x="488" y="108" width="58" height="30" rx="5"/><rect class="vuS" x="574" y="58" width="58" height="44" rx="5"/><rect class="vuV" x="574" y="108" width="58" height="30" rx="5"/><rect class="vuS" x="640" y="58" width="58" height="44" rx="5"/><rect class="vuV" x="640" y="108" width="58" height="30" rx="5"/><g class="cel" opacity="0" style="animation:c0 var(--d) infinite"><rect class="pieS" x="118" y="58" width="58" height="44" rx="5"/><text class="valS" x="147" y="87" text-anchor="middle">1</text><rect class="pieV" x="118" y="108" width="58" height="30" rx="5"/><text class="valV" x="147" y="128" text-anchor="middle">1</text><rect class="pieS" x="184" y="58" width="58" height="44" rx="5"/><text class="valS" x="213" y="87" text-anchor="middle">3</text><rect class="pieV" x="184" y="108" width="58" height="30" rx="5"/><text class="valV" x="213" y="128" text-anchor="middle">4</text></g><g class="cel" opacity="0" style="animation:c1 var(--d) infinite"><rect class="pieS" x="270" y="58" width="58" height="44" rx="5"/><text class="valS" x="299" y="87" text-anchor="middle">2</text><rect class="pieV" x="270" y="108" width="58" height="30" rx="5"/><text class="valV" x="299" y="128" text-anchor="middle">2</text><rect class="pieS" x="336" y="58" width="58" height="44" rx="5"/><text class="valS" x="365" y="87" text-anchor="middle">4</text><rect class="pieV" x="336" y="108" width="58" height="30" rx="5"/><text class="valV" x="365" y="128" text-anchor="middle">5</text></g><g class="cel" opacity="0" style="animation:c2 var(--d) infinite"><rect class="pieS" x="422" y="58" width="58" height="44" rx="5"/><text class="valS" x="451" y="87" text-anchor="middle">0</text><rect class="pieV" x="422" y="108" width="58" height="30" rx="5"/><text class="valV" x="451" y="128" text-anchor="middle">0</text><rect class="pieS" x="488" y="58" width="58" height="44" rx="5"/><text class="valS" x="517" y="87" text-anchor="middle">1</text><rect class="pieV" x="488" y="108" width="58" height="30" rx="5"/><text class="valV" x="517" y="128" text-anchor="middle">3</text></g><g class="cel" opacity="1" style="animation:c3 var(--d) infinite"><rect class="pieS" x="574" y="58" width="58" height="44" rx="5"/><text class="valS" x="603" y="87" text-anchor="middle">5</text><rect class="pieV" x="574" y="108" width="58" height="30" rx="5"/><text class="valV" x="603" y="128" text-anchor="middle">6</text><rect class="pieS" x="640" y="58" width="58" height="44" rx="5"/><text class="valS" x="669" y="87" text-anchor="middle">2</text><rect class="pieV" x="640" y="108" width="58" height="30" rx="5"/><text class="valV" x="669" y="128" text-anchor="middle">2</text></g><text class="lbs" x="100" y="86" text-anchor="end">punteggi s</text><text class="lbs" x="100" y="128" text-anchor="end">valori v</text><text class="bloc" x="180" y="164" text-anchor="middle">K₁,V₁</text><text class="bloc" x="332" y="164" text-anchor="middle">K₂,V₂</text><text class="bloc" x="484" y="164" text-anchor="middle">K₃,V₃</text><text class="bloc" x="636" y="164" text-anchor="middle">K₄,V₄</text><g class="fin" style="animation:fin var(--d) infinite"><rect class="fbox" x="566" y="48" width="140" height="98" rx="8"/><text class="ftag" x="636" y="42" text-anchor="middle">in memoria veloce adesso</text></g><text class="lbs" x="30" y="192">la finestra scorre da sinistra a destra; fuori, quei punteggi non esistono: la matrice N×N non viene mai scritta.</text><text class="ttl" x="30" y="222">l'accumulatore, blocco per blocco</text><text class="glo" x="90" y="262" text-anchor="middle">blocco</text><text class="sim" x="202" y="246" text-anchor="middle">m̃</text><text class="glo" x="202" y="262" text-anchor="middle">max del blocco</text><text class="sim" x="320" y="246" text-anchor="middle">m</text><text class="glo" x="320" y="262" text-anchor="middle">massimo corrente</text><text class="sim" x="420" y="246" text-anchor="middle">α</text><text class="glo" x="420" y="262" text-anchor="middle">riscalatura</text><text class="sim" x="530" y="246" text-anchor="middle">l</text><text class="glo" x="530" y="262" text-anchor="middle">somma corrente</text><text class="sim" x="645" y="246" text-anchor="middle">O</text><text class="glo" x="645" y="262" text-anchor="middle">output accumulato</text><line class="axc" x1="55" y1="272" x2="700" y2="272"/><g class="rig" style="animation:r0 var(--d) infinite"><text class="cel1" x="90" y="294" text-anchor="middle">K₁,V₁</text><text class="cel1" x="202" y="294" text-anchor="middle">3</text><text class="cel1 su" x="320" y="294" text-anchor="middle">3</text><text class="cel1" x="530" y="294" text-anchor="middle">1,135</text><text class="cel1" x="645" y="294" text-anchor="middle">4,135</text><text class="glo" x="420" y="294" text-anchor="middle">niente ancora</text></g><g class="rig" style="animation:r1 var(--d) infinite"><text class="cel1" x="90" y="322" text-anchor="middle">K₂,V₂</text><text class="cel1" x="202" y="322" text-anchor="middle">4</text><text class="cel1 su" x="320" y="322" text-anchor="middle">4</text><text class="cel1" x="530" y="322" text-anchor="middle">1,553</text><text class="cel1" x="645" y="322" text-anchor="middle">6,792</text><text class="cel1 su" x="420" y="322" text-anchor="middle">0,368</text></g><g class="rig" style="animation:r2 var(--d) infinite"><text class="cel1" x="90" y="350" text-anchor="middle">K₃,V₃</text><text class="cel1" x="202" y="350" text-anchor="middle">1</text><text class="cel1" x="320" y="350" text-anchor="middle">4</text><text class="cel1" x="530" y="350" text-anchor="middle">1,621</text><text class="cel1" x="645" y="350" text-anchor="middle">6,941</text><text class="cel1 spento" x="420" y="350" text-anchor="middle">1,000</text></g><g class="rig" style="animation:r3 var(--d) infinite"><text class="cel1" x="90" y="378" text-anchor="middle">K₄,V₄</text><text class="cel1" x="202" y="378" text-anchor="middle">5</text><text class="cel1 su" x="320" y="378" text-anchor="middle">5</text><text class="cel1" x="530" y="378" text-anchor="middle">1,646</text><text class="cel1" x="645" y="378" text-anchor="middle">8,653</text><text class="cel1 su" x="420" y="378" text-anchor="middle">0,368</text></g><text class="lbs" x="30" y="410">α = e<tspan dy="-6" font-size="11">m vecchio − m nuovo</tspan><tspan dy="6"> riscala ciò che era già stato accumulato, ogni volta che arriva un massimo più grande;</tspan></text><text class="lbs" x="30" y="430">se il massimo non cambia, α = 1 e non c'è niente da riscalare.</text><text class="lbs" x="30" y="450">i v qui sono scalari, così O si legge come un numero: nel kernel sono righe di V.</text><text class="esito" x="30" y="484" style="animation:esi var(--d) infinite">alla fine O / l = 5,257: lo stesso numero della softmax calcolata in un colpo solo.</text>
</svg>
