<svg viewBox="0 0 760 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di una GAN: il generatore trasforma rumore casuale in un campione falso, il discriminatore riceve campioni veri e falsi e decide, e il suo verdetto torna indietro come segnale di apprendimento al generatore">
  <defs>
    <marker id="gan-teal" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2D5A5C"/></marker>
    <marker id="gan-terra" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#B5532C"/></marker>
    <marker id="gan-ocra" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#C9A961"/></marker>
    <marker id="gan-dark" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A1A1A"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" fill="#F8F5EE"/>

  <!-- noise -->
  <rect x="24" y="120" width="86" height="46" rx="8" fill="none" stroke="#C9A961" stroke-width="1.5"/>
  <text x="67" y="141" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">rumore</text>
  <text x="67" y="157" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">casuale z</text>
  <line x1="110" y1="143" x2="150" y2="143" stroke="#C9A961" stroke-width="2" fill="none" marker-end="url(#gan-ocra)"/>

  <!-- generator -->
  <rect x="152" y="112" width="118" height="62" rx="10" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="211" y="140" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2D5A5C" text-anchor="middle">GENERATORE</text>
  <text x="211" y="159" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5E5852" text-anchor="middle">G</text>
  <line x1="270" y1="143" x2="320" y2="143" stroke="#2D5A5C" stroke-width="2" fill="none" marker-end="url(#gan-teal)"/>

  <!-- fake sample -->
  <rect x="322" y="118" width="90" height="50" rx="8" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="367" y="139" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">campione</text>
  <text x="367" y="156" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">falso</text>
  <line x1="412" y1="143" x2="470" y2="170" stroke="#2D5A5C" stroke-width="2" fill="none" marker-end="url(#gan-teal)"/>

  <!-- real sample -->
  <rect x="322" y="250" width="90" height="50" rx="8" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="367" y="271" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">dati</text>
  <text x="367" y="288" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">reali</text>
  <line x1="412" y1="275" x2="470" y2="210" stroke="#1A1A1A" stroke-width="2" fill="none" marker-end="url(#gan-dark)"/>

  <!-- discriminator -->
  <rect x="472" y="150" width="128" height="70" rx="10" fill="none" stroke="#B5532C" stroke-width="2"/>
  <text x="536" y="180" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#B5532C" text-anchor="middle">DISCRIMI-</text>
  <text x="536" y="198" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#B5532C" text-anchor="middle">NATORE D</text>

  <!-- verdict -->
  <line x1="600" y1="185" x2="650" y2="185" stroke="#B5532C" stroke-width="2" fill="none" marker-end="url(#gan-terra)"/>
  <rect x="652" y="160" width="86" height="50" rx="8" fill="#1A1A1A"/>
  <text x="695" y="181" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">vero /</text>
  <text x="695" y="198" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">falso?</text>

  <!-- feedback loop to generator -->
  <path d="M 695 210 L 695 345 L 211 345 L 211 174" fill="none" stroke="#C9A961" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gan-ocra)"/>
  <text x="453" y="338" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5E5852" text-anchor="middle">segnale di apprendimento (la correzione torna al generatore)</text>
</svg>
