<!--
  Paithon Book, figura animata: un bit alla fine, spalmato su tutta la traiettoria
  Generata da animazioni/svg/credito-spalmato.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 282"
     role="img" aria-label="Una fila di dodici riquadri, i passi di una traiettoria; cinque sono bordati di terracotta perché in quei passi l'agente ha sbagliato. Una testa percorre la fila da sinistra a destra un passo alla volta; alla fine compare un solo riquadro con il ritorno, più uno. Da lì partono dodici archi che tornano indietro fino a ogni riquadro e li riempiono tutti dello stesso colore. Sotto, due righe di numeri: la riga del peso porta più uno dodici volte identiche, la riga del merito cambia fra più uno e meno uno da un passo all'altro.">
  <style>
