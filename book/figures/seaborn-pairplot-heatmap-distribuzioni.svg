<svg viewBox="0 0 760 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Matrice di correlazione dei pinguini come heatmap: celle colorate per intensità, diagonale a 1, pinna e massa fortemente correlate">
  <rect x="0" y="0" width="760" height="470" fill="#F8F5EE"/>
  <text x="30" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">La matrice di correlazione dei pinguini, a colori</text>
  <!-- etichette colonne -->
  <g font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">
    <text x="240" y="80">becco L</text>
    <text x="360" y="80">becco P</text>
    <text x="480" y="80">pinna</text>
    <text x="600" y="80">massa</text>
  </g>
  <!-- etichette righe -->
  <g font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="end">
    <text x="170" y="132">becco L</text>
    <text x="170" y="202">becco P</text>
    <text x="170" y="272">pinna</text>
    <text x="170" y="342">massa</text>
  </g>
  <!-- riga 1: becco L -->
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="180" y="92" width="120" height="70" fill="#1A1A1A"/>
    <rect x="300" y="92" width="120" height="70" fill="#2D5A5C"/>
    <rect x="420" y="92" width="120" height="70" fill="#B5532C"/>
    <rect x="540" y="92" width="120" height="70" fill="#B5532C"/>
  </g>
  <!-- riga 2: becco P -->
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="180" y="162" width="120" height="70" fill="#2D5A5C"/>
    <rect x="300" y="162" width="120" height="70" fill="#1A1A1A"/>
    <rect x="420" y="162" width="120" height="70" fill="#2D5A5C"/>
    <rect x="540" y="162" width="120" height="70" fill="#2D5A5C"/>
  </g>
  <!-- riga 3: pinna -->
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="180" y="232" width="120" height="70" fill="#B5532C"/>
    <rect x="300" y="232" width="120" height="70" fill="#2D5A5C"/>
    <rect x="420" y="232" width="120" height="70" fill="#1A1A1A"/>
    <rect x="540" y="232" width="120" height="70" fill="#B5532C"/>
  </g>
  <!-- riga 4: massa -->
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="180" y="302" width="120" height="70" fill="#B5532C"/>
    <rect x="300" y="302" width="120" height="70" fill="#2D5A5C"/>
    <rect x="420" y="302" width="120" height="70" fill="#B5532C"/>
    <rect x="540" y="302" width="120" height="70" fill="#1A1A1A"/>
  </g>
  <!-- valori -->
  <g font-family="sans-serif" font-size="15" fill="#F8F5EE" text-anchor="middle" font-weight="bold">
    <text x="240" y="132">1.00</text><text x="360" y="132">−0.24</text><text x="480" y="132">0.66</text><text x="600" y="132">0.60</text>
    <text x="240" y="202">−0.24</text><text x="360" y="202">1.00</text><text x="480" y="202">−0.58</text><text x="600" y="202">−0.47</text>
    <text x="240" y="272">0.66</text><text x="360" y="272">−0.58</text><text x="480" y="272">1.00</text><text x="600" y="272">0.87</text>
    <text x="240" y="342">0.60</text><text x="360" y="342">−0.47</text><text x="480" y="342">0.87</text><text x="600" y="342">1.00</text>
  </g>
  <!-- legenda -->
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="180" y="405" width="26" height="26" fill="#B5532C"/>
    <rect x="380" y="405" width="26" height="26" fill="#2D5A5C"/>
    <rect x="560" y="405" width="26" height="26" fill="#1A1A1A"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#1A1A1A">
    <text x="214" y="423">positiva forte (&gt; 0.5)</text>
    <text x="414" y="423">negativa</text>
    <text x="594" y="423">diagonale (= 1)</text>
  </g>
</svg>
