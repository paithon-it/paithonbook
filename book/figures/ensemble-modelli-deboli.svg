<svg viewBox="0 0 680 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cinque modelli deboli, ciascuno appena migliore del caso, i cui voti vengono aggregati in una decisione forte">
  <rect x="0" y="0" width="680" height="430" fill="#F8F5EE"/>
  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1A1A1A">tanti voti appena migliori del caso &#8594; una decisione forte</text>
  <g font-family="sans-serif">
    <rect x="24" y="52" width="104" height="46" rx="8" fill="none" stroke="#B5532C" stroke-width="1.5"/>
    <text x="76" y="76" text-anchor="middle" font-size="11" fill="#1A1A1A">debole</text>
    <text x="76" y="90" text-anchor="middle" font-size="10" fill="#5E5852">&#8776;55%</text>
    <rect x="156" y="52" width="104" height="46" rx="8" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
    <text x="208" y="76" text-anchor="middle" font-size="11" fill="#1A1A1A">debole</text>
    <text x="208" y="90" text-anchor="middle" font-size="10" fill="#5E5852">&#8776;57%</text>
    <rect x="288" y="52" width="104" height="46" rx="8" fill="none" stroke="#C9A961" stroke-width="1.5"/>
    <text x="340" y="76" text-anchor="middle" font-size="11" fill="#1A1A1A">debole</text>
    <text x="340" y="90" text-anchor="middle" font-size="10" fill="#5E5852">&#8776;54%</text>
    <rect x="420" y="52" width="104" height="46" rx="8" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
    <text x="472" y="76" text-anchor="middle" font-size="11" fill="#1A1A1A">debole</text>
    <text x="472" y="90" text-anchor="middle" font-size="10" fill="#5E5852">&#8776;56%</text>
    <rect x="552" y="52" width="104" height="46" rx="8" fill="none" stroke="#B5532C" stroke-width="1.5"/>
    <text x="604" y="76" text-anchor="middle" font-size="11" fill="#1A1A1A">debole</text>
    <text x="604" y="90" text-anchor="middle" font-size="10" fill="#5E5852">&#8776;55%</text>
  </g>
  <line x1="76" y1="100" x2="330" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="208" y1="100" x2="335" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="340" y1="100" x2="340" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="472" y1="100" x2="345" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="604" y1="100" x2="350" y2="176" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="238" y="180" width="204" height="48" rx="24" fill="#1A1A1A"/>
  <text x="340" y="209" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#F8F5EE">voto aggregato</text>
  <line x1="340" y1="228" x2="340" y2="262" stroke="#1A1A1A" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="11" fill="#1A1A1A">
    <text x="188" y="298" text-anchor="end">singolo</text>
    <rect x="200" y="288" width="90" height="16" fill="#C9A961"/>
    <text x="298" y="300" font-size="10" fill="#5E5852">&#8776;55%</text>
    <text x="188" y="336" text-anchor="end">ensemble</text>
    <rect x="200" y="326" width="264" height="16" fill="#2D5A5C"/>
    <text x="472" y="338" font-size="10" fill="#5E5852">&#8776;91%</text>
  </g>
  <text x="340" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">se gli errori sono scorrelati, l'aggregazione li cancella e l'accuratezza sale</text>
  <text x="340" y="412" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8B847C">(valori illustrativi)</text>
</svg>
