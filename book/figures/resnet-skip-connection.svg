<svg viewBox="0 0 720 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di un blocco residuale: l'input segue due percorsi, i layer e la scorciatoia, e si ricongiunge in una somma">
  <rect x="0" y="0" width="720" height="340" fill="#F8F5EE"/>
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1A1A1A" font-weight="bold">Il blocco residuale: y = F(x) + x</text>
  <!-- input x -->
  <circle cx="120" cy="170" r="26" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="120" y="176" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1A1A1A" font-weight="bold">x</text>
  <!-- percorso principale -->
  <line x1="146" y1="170" x2="200" y2="170" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="200,170 190,164 190,176" fill="#1A1A1A"/>
  <rect x="200" y="140" width="120" height="60" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2" rx="6"/>
  <text x="260" y="167" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">layer conv</text>
  <text x="260" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">+ ReLU</text>
  <line x1="320" y1="170" x2="374" y2="170" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="374,170 364,164 364,176" fill="#1A1A1A"/>
  <rect x="374" y="140" width="120" height="60" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2" rx="6"/>
  <text x="434" y="167" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">layer conv</text>
  <text x="434" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">F(x)</text>
  <line x1="494" y1="170" x2="552" y2="170" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="552,170 542,164 542,176" fill="#1A1A1A"/>
  <!-- somma -->
  <circle cx="578" cy="170" r="26" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <line x1="566" y1="170" x2="590" y2="170" stroke="#B5532C" stroke-width="2"/>
  <line x1="578" y1="158" x2="578" y2="182" stroke="#B5532C" stroke-width="2"/>
  <!-- skip connection -->
  <path d="M 120 196 L 120 268 L 578 268 L 578 196" fill="none" stroke="#B5532C" stroke-width="2"/>
  <polygon points="578,196 572,206 584,206" fill="#B5532C"/>
  <text x="349" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#B5532C" font-weight="bold">skip connection: x passa intatto</text>
  <!-- output -->
  <line x1="604" y1="170" x2="654" y2="170" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="654,170 644,164 644,176" fill="#1A1A1A"/>
  <text x="678" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1A1A1A" font-weight="bold">y</text>
  <!-- etichette percorsi -->
  <text x="347" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">percorso appreso: la correzione F(x)</text>
</svg>
