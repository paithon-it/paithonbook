<svg viewBox="0 0 720 380" width="100%" role="img" aria-label="Schema: dal prompt ai due modelli, al voto umano, al punteggio Elo, alla classifica" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="380" fill="#F8F5EE"/>
  <text x="360" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Come nasce il punteggio di un modello</text>
  <!-- prompt -->
  <rect x="28" y="150" width="105" height="60" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2" rx="6"/>
  <text x="80" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Prompt</text>
  <text x="80" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">dell'utente</text>
  <!-- model A -->
  <line x1="133" y1="172" x2="178" y2="128" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="178" y="98" width="130" height="52" fill="#B5532C" rx="6"/>
  <text x="243" y="129" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8F5EE">Modello A</text>
  <!-- model B -->
  <line x1="133" y1="188" x2="178" y2="232" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="178" y="210" width="130" height="52" fill="#2D5A5C" rx="6"/>
  <text x="243" y="241" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8F5EE">Modello B</text>
  <!-- vote -->
  <line x1="308" y1="124" x2="352" y2="168" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="308" y1="236" x2="352" y2="192" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="352" y="150" width="120" height="60" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2" rx="6"/>
  <text x="412" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Voto umano</text>
  <text x="412" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">quale preferisci?</text>
  <!-- elo -->
  <line x1="472" y1="180" x2="512" y2="180" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="512" y="148" width="180" height="64" fill="#C9A961" rx="6"/>
  <text x="602" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Bradley-Terry / Elo</text>
  <text x="602" y="193" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">aggiorna i punteggi</text>
  <!-- arrow down to leaderboard -->
  <line x1="602" y1="212" x2="602" y2="248" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="602" y1="248" x2="440" y2="248" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="440" y1="248" x2="440" y2="266" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- leaderboard -->
  <rect x="230" y="266" width="420" height="96" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2" rx="6"/>
  <text x="248" y="288" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">Classifica (scala Elo)</text>
  <text x="248" y="312" font-family="sans-serif" font-size="11" fill="#1A1A1A">1º</text>
  <rect x="270" y="303" width="200" height="10" fill="#B5532C"/>
  <text x="248" y="330" font-family="sans-serif" font-size="11" fill="#1A1A1A">2º</text>
  <rect x="270" y="321" width="160" height="10" fill="#2D5A5C"/>
  <text x="248" y="348" font-family="sans-serif" font-size="11" fill="#1A1A1A">3º</text>
  <rect x="270" y="339" width="120" height="10" fill="#C9A961"/>
</svg>
