<svg viewBox="0 0 760 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di una convoluzione: un kernel 3 per 3 scorre su una griglia immagine e produce una feature map">
  <rect x="0" y="0" width="760" height="360" fill="#F8F5EE"/>
  <text x="380" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Il kernel scorre sulla griglia</text>
  <g>
    <text x="150" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">immagine (input)</text>
    <g stroke="#1A1A1A" stroke-width="1.5">
      <rect x="60" y="85" width="180" height="180" fill="#F8F5EE"/>
      <line x1="90" y1="85" x2="90" y2="265"/><line x1="120" y1="85" x2="120" y2="265"/>
      <line x1="150" y1="85" x2="150" y2="265"/><line x1="180" y1="85" x2="180" y2="265"/>
      <line x1="210" y1="85" x2="210" y2="265"/>
      <line x1="60" y1="115" x2="240" y2="115"/><line x1="60" y1="145" x2="240" y2="145"/>
      <line x1="60" y1="175" x2="240" y2="175"/><line x1="60" y1="205" x2="240" y2="205"/>
      <line x1="60" y1="235" x2="240" y2="235"/>
    </g>
    <rect x="90" y="115" width="90" height="90" fill="#B5532C" fill-opacity="0.25" stroke="#B5532C" stroke-width="2"/>
    <path d="M186 132 L212 132" stroke="#B5532C" stroke-width="2" fill="none"/>
    <path d="M206 126 L214 132 L206 138" fill="none" stroke="#B5532C" stroke-width="2"/>
    <path d="M132 211 L132 237" stroke="#B5532C" stroke-width="2" fill="none"/>
    <path d="M126 231 L132 239 L138 231" fill="none" stroke="#B5532C" stroke-width="2"/>
  </g>
  <g>
    <text x="380" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">kernel 3×3</text>
    <g stroke="#1A1A1A" stroke-width="1.5">
      <rect x="335" y="115" width="90" height="90" fill="#C9A961"/>
      <line x1="365" y1="115" x2="365" y2="205"/><line x1="395" y1="115" x2="395" y2="205"/>
      <line x1="335" y1="145" x2="425" y2="145"/><line x1="335" y1="175" x2="425" y2="175"/>
    </g>
    <g font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">
      <text x="350" y="134">1</text><text x="380" y="134">0</text><text x="410" y="134">-1</text>
      <text x="350" y="164">1</text><text x="380" y="164">0</text><text x="410" y="164">-1</text>
      <text x="350" y="194">1</text><text x="380" y="194">0</text><text x="410" y="194">-1</text>
    </g>
    <text x="380" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">moltiplica e somma</text>
  </g>
  <path d="M250 160 L325 160" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <path d="M318 154 L327 160 L318 166" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M435 160 L510 160" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <path d="M503 154 L512 160 L503 166" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <g>
    <text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">feature map (output)</text>
    <g stroke="#1A1A1A" stroke-width="1.5">
      <rect x="540" y="100" width="120" height="120" fill="#F8F5EE"/>
      <line x1="570" y1="100" x2="570" y2="220"/><line x1="600" y1="100" x2="600" y2="220"/>
      <line x1="630" y1="100" x2="630" y2="220"/>
      <line x1="540" y1="130" x2="660" y2="130"/><line x1="540" y1="160" x2="660" y2="160"/>
      <line x1="540" y1="190" x2="660" y2="190"/>
    </g>
    <rect x="570" y="130" width="30" height="30" fill="#2D5A5C"/>
    <text x="600" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5E5852">un valore per posizione</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#1A1A1A">
    <rect x="100" y="315" width="16" height="16" fill="#B5532C" fill-opacity="0.25" stroke="#B5532C" stroke-width="1.5"/>
    <text x="124" y="328">finestra corrente</text>
    <rect x="290" y="315" width="16" height="16" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="314" y="328">pesi del kernel (appresi)</text>
    <rect x="510" y="315" width="16" height="16" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="534" y="328">risposta: pattern trovato qui</text>
  </g>
</svg>
