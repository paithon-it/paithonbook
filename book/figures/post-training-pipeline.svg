<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Pipeline del post-training in quattro stadi: pre-addestramento, SFT su coppie istruzione-risposta, preferenze umane con reward model e PPO sotto vincolo KL, e infine il modello assistente; una freccia tratteggiata mostra la DPO come scorciatoia che salta lo stadio del reward model.">
  <defs>
    <marker id="freccia-pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="freccia-dpo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9A961"/>
    </marker>
  </defs>

  <!-- annotazioni sopra i blocchi -->
  <text x="105" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">miliardi di parole dal web</text>
  <text x="324" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">migliaia di esempi svolti</text>
  <text x="550" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">confronti umani:</text>
  <text x="550" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5E5852">quale risposta &#232; migliore?</text>

  <!-- stadio 1: pre-addestramento -->
  <rect x="16" y="118" width="178" height="66" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <text x="105" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Pre-addestramento</text>
  <text x="105" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">predice la parola dopo</text>

  <!-- stadio 2: SFT -->
  <rect x="240" y="118" width="168" height="66" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <text x="324" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">SFT</text>
  <text x="324" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">istruzione &#8594; risposta</text>

  <!-- stadio 3: preferenze -->
  <rect x="454" y="118" width="192" height="66" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <text x="550" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Preferenze umane</text>
  <text x="550" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">reward model + PPO</text>
  <text x="550" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">penalit&#224; KL: non allontanarsi troppo</text>

  <!-- stadio 4: assistente -->
  <rect x="700" y="118" width="184" height="66" rx="8" fill="#B5532C" fill-opacity="0.15" stroke="#B5532C" stroke-width="2.5"/>
  <text x="792" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#B5532C">Assistente</text>
  <text x="792" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">risponde, non completa</text>

  <!-- frecce della pipeline -->
  <line x1="194" y1="151" x2="234" y2="151" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#freccia-pt)"/>
  <line x1="408" y1="151" x2="448" y2="151" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#freccia-pt)"/>
  <line x1="646" y1="151" x2="694" y2="151" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#freccia-pt)"/>

  <!-- scorciatoia DPO: salta il reward model -->
  <path d="M 340 190 C 385 272, 700 272, 758 192" fill="none" stroke="#C9A961" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#freccia-dpo)"/>
  <text x="550" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5E5852"><tspan font-weight="700" fill="#1A1A1A">DPO</tspan>: impara direttamente dai confronti, senza reward model n&#233; RL</text>
</svg>
