<svg viewBox="0 0 760 462" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Una catena di cinque riquadri in fila: dati di addestramento, encoder visivo, connettore, modello di linguaggio, risposta. Sopra la catena, in terracotta, i tre punti in cui il difetto nasce: nei dati di addestramento, perché le istruzioni le ha scritte un modello che l'immagine non l'ha vista; nell'encoder visivo, il punto cieco, perché quello che le didascalie non nominano non arriva; nel modello di linguaggio, il priore linguistico, perché quello che di solito si scrive batte un indizio debole. Sotto la catena, in teal, i quattro punti in cui si ripara: un secondo encoder addestrato sulle sole immagini, agganciato all'encoder; ancorare la risposta alle coordinate, agganciato all'addestramento; decodificare per differenza, agganciato al momento in cui la parola si sceglie; una seconda passata, agganciata alla risposta già scritta. In fondo: ogni rimedio agisce nel suo punto e non arriva a quello di un altro, perché quello che l'encoder ha perso la decodifica non lo fa tornare.">
  <rect x="0" y="0" width="760" height="462" fill="#F8F5EE"/>
  <text x="380.0" y="26.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#1A1A1A" font-weight="bold">Dove nasce, e dove si ripara</text>
  <text x="380.0" y="46.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#5A524A">la catena da cui esce una risposta, letta due volte</text>
  <text x="380.0" y="64.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5A524A">sopra, in terracotta, dove il difetto nasce; sotto, in teal, dove si ripara</text>
  <text x="86.0" y="96.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#B5532C" font-weight="bold">nei dati</text>
  <text x="86.0" y="111.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">le istruzioni le ha scritte</text>
  <text x="86.0" y="124.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">un modello che non ha visto</text>
  <line x1="86.0" y1="143" x2="86.0" y2="181" stroke="#B5532C" stroke-width="1.3" stroke-dasharray="4 3"/>
  <polygon points="86.0,189 81.5,180 90.5,180" fill="#B5532C"/>
  <text x="233.0" y="96.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#B5532C" font-weight="bold">punto cieco</text>
  <text x="233.0" y="111.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">quel che le didascalie</text>
  <text x="233.0" y="124.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">non nominano non arriva</text>
  <line x1="233.0" y1="143" x2="233.0" y2="181" stroke="#B5532C" stroke-width="1.3" stroke-dasharray="4 3"/>
  <polygon points="233.0,189 228.5,180 237.5,180" fill="#B5532C"/>
  <text x="527.0" y="96.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#B5532C" font-weight="bold">priore linguistico</text>
  <text x="527.0" y="111.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">quel che di solito si scrive</text>
  <text x="527.0" y="124.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">batte un indizio debole</text>
  <line x1="527.0" y1="143" x2="527.0" y2="181" stroke="#B5532C" stroke-width="1.3" stroke-dasharray="4 3"/>
  <polygon points="527.0,189 522.5,180 531.5,180" fill="#B5532C"/>
  <rect x="24" y="190" width="124" height="52" rx="5" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="86.0" y="213.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="bold">dati di</text>
  <text x="86.0" y="227.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="bold">addestramento</text>
  <line x1="148" y1="216.0" x2="162" y2="216.0" stroke="#1A1A1A" stroke-width="1.2"/>
  <polygon points="170,216.0 161,211.5 161,220.5" fill="#1A1A1A"/>
  <rect x="171" y="190" width="124" height="52" rx="5" fill="#E2DCC9" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="233.0" y="213.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="bold">encoder</text>
  <text x="233.0" y="227.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="bold">visivo</text>
  <line x1="295" y1="216.0" x2="309" y2="216.0" stroke="#1A1A1A" stroke-width="1.2"/>
  <polygon points="317,216.0 308,211.5 308,220.5" fill="#1A1A1A"/>
  <rect x="318" y="190" width="124" height="52" rx="5" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="380.0" y="220.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="bold">connettore</text>
  <line x1="442" y1="216.0" x2="456" y2="216.0" stroke="#1A1A1A" stroke-width="1.2"/>
  <polygon points="464,216.0 455,211.5 455,220.5" fill="#1A1A1A"/>
  <rect x="465" y="190" width="124" height="52" rx="5" fill="#E2DCC9" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="527.0" y="213.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="bold">modello di</text>
  <text x="527.0" y="227.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="bold">linguaggio</text>
  <line x1="589" y1="216.0" x2="603" y2="216.0" stroke="#1A1A1A" stroke-width="1.2"/>
  <polygon points="611,216.0 602,211.5 602,220.5" fill="#1A1A1A"/>
  <rect x="612" y="190" width="124" height="52" rx="5" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="674.0" y="220.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="bold">risposta</text>
  <polygon points="233.0,243 228.5,252 237.5,252" fill="#2D5A5C"/>
  <line x1="233.0" y1="243" x2="233.0" y2="353" stroke="#2D5A5C" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="233.0" y="366.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#2D5A5C" font-weight="bold">un secondo encoder</text>
  <text x="233.0" y="381.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">addestrato sulle sole</text>
  <text x="233.0" y="394.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">immagini, e messo accanto</text>
  <polygon points="86.0,243 81.5,252 90.5,252" fill="#2D5A5C"/>
  <line x1="86.0" y1="243" x2="86.0" y2="287" stroke="#2D5A5C" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="86.0" y="300.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#2D5A5C" font-weight="bold">ancorare alle coordinate</text>
  <text x="86.0" y="315.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">in addestramento: indovinare</text>
  <text x="86.0" y="328.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">non basta più</text>
  <polygon points="527.0,243 522.5,252 531.5,252" fill="#2D5A5C"/>
  <line x1="527.0" y1="243" x2="527.0" y2="287" stroke="#2D5A5C" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="527.0" y="300.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#2D5A5C" font-weight="bold">decodificare per differenza</text>
  <text x="527.0" y="315.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">al momento in cui</text>
  <text x="527.0" y="328.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">la parola si sceglie</text>
  <polygon points="674.0,243 669.5,252 678.5,252" fill="#2D5A5C"/>
  <line x1="674.0" y1="243" x2="674.0" y2="353" stroke="#2D5A5C" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="674.0" y="366.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#2D5A5C" font-weight="bold">una seconda passata</text>
  <text x="674.0" y="381.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">sulla risposta</text>
  <text x="674.0" y="394.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5A524A">già scritta</text>
  <line x1="24" y1="424" x2="736" y2="424" stroke="#C5BEAA" stroke-width="1"/>
  <text x="380.0" y="444.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5A524A">Ogni rimedio agisce nel suo punto e non arriva a quello di un altro: ciò che l&#8217;encoder ha perso, la decodifica non lo fa tornare.</text>
</svg>
