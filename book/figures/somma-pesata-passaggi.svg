    @keyframes rami{0.00%{transform:scaleX(0)}50.00%{transform:scaleX(0)}63.75%{transform:scaleX(1)}100.00%{transform:scaleX(1)}}
    @keyframes somm{0.00%{transform:scaleX(0)}75.00%{transform:scaleX(0)}88.75%{transform:scaleX(1)}100.00%{transform:scaleX(1)}}
    @keyframes nrami{0.00%{opacity:0}50.00%{opacity:0}63.75%{opacity:1}100.00%{opacity:1}}
