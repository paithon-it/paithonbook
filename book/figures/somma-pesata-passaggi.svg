    @media (prefers-reduced-motion:reduce) { .cresce, g[style], text[style] { animation:none !important; } }
  </style>
  <text class="ttl" x="34.0" y="36">«Dove avviene la fotosintesi?» Ogni pagina risponde da sola, poi le risposte si sommano</text><text class="lbs" x="34.0" y="58">le tre bozze nascono insieme e nessuna corregge le altre; i pesi vengono dal recupero, e non cambiano più</text><text class="et" x="34.0" y="92.0">le tre bozze, una per pagina</text><rect class="pann" x="34.0" y="106.0" width="382.0" height="110.0" rx="5"/><text class="pAt" x="48.0" y="130.0">pag. 214</text><g style="animation:pesi var(--d) infinite" opacity="1"><text class="lbs" x="142.0" y="130.0">peso</text><rect class="pAb" x="182.0" y="119.0" width="90.0" height="13"/><text class="val" x="352.0" y="130.0" text-anchor="end">0,600</text></g><text class="et" x="48.0" y="159.0">nelle foglie</text><rect class="pAb cresce" x="144.0" y="148.0" width="105.0" height="14" style="animation:rami var(--d) infinite"/><text class="lbs" x="302.0" y="159.0" opacity="1" style="animation:nrami var(--d) infinite">0,700</text><text class="et" x="48.0" y="180.0">nel fusto</text><rect class="pAb cresce" x="144.0" y="169.0" width="30.0" height="14" style="animation:rami var(--d) infinite"/><text class="lbs" x="302.0" y="180.0" opacity="1" style="animation:nrami var(--d) infinite">0,200</text><text class="et" x="48.0" y="201.0">nelle radici</text><rect class="pAb cresce" x="144.0" y="190.0" width="15.0" height="14" style="animation:rami var(--d) infinite"/><text class="lbs" x="302.0" y="201.0" opacity="1" style="animation:nrami var(--d) infinite">0,100</text><rect class="pann" x="34.0" y="230.0" width="382.0" height="110.0" rx="5"/><text class="pBt" x="48.0" y="254.0">pag. 380</text><g style="animation:pesi var(--d) infinite" opacity="1"><text class="lbs" x="142.0" y="254.0">peso</text><rect class="pBb" x="182.0" y="243.0" width="33.0" height="13"/><text class="val" x="352.0" y="254.0" text-anchor="end">0,220</text></g><text class="et" x="48.0" y="283.0">nelle foglie</text><rect class="pBb cresce" x="144.0" y="272.0" width="22.5" height="14" style="animation:rami var(--d) infinite"/><text class="lbs" x="302.0" y="283.0" opacity="1" style="animation:nrami var(--d) infinite">0,150</text><text class="et" x="48.0" y="304.0">nel fusto</text><rect class="pBb cresce" x="144.0" y="293.0" width="112.5" height="14" style="animation:rami var(--d) infinite"/><text class="lbs" x="302.0" y="304.0" opacity="1" style="animation:nrami var(--d) infinite">0,750</text><text class="et" x="48.0" y="325.0">nelle radici</text><rect class="pBb cresce" x="144.0" y="314.0" width="15.0" height="14" style="animation:rami var(--d) infinite"/><text class="lbs" x="302.0" y="325.0" opacity="1" style="animation:nrami var(--d) infinite">0,100</text><rect class="pann" x="34.0" y="354.0" width="382.0" height="110.0" rx="5"/><text class="pCt" x="48.0" y="378.0">pag. 91</text><g style="animation:pesi var(--d) infinite" opacity="1"><text class="lbs" x="142.0" y="378.0">peso</text><rect class="pCb" x="182.0" y="367.0" width="27.0" height="13"/><text class="val" x="352.0" y="378.0" text-anchor="end">0,180</text></g><text class="et" x="48.0" y="407.0">nelle foglie</text><rect class="pCb cresce" x="144.0" y="396.0" width="15.0" height="14" style="animation:rami var(--d) infinite"/><text class="lbs" x="302.0" y="407.0" opacity="1" style="animation:nrami var(--d) infinite">0,100</text><text class="et" x="48.0" y="428.0">nel fusto</text><rect class="pCb cresce" x="144.0" y="417.0" width="105.0" height="14" style="animation:rami var(--d) infinite"/><text class="lbs" x="302.0" y="428.0" opacity="1" style="animation:nrami var(--d) infinite">0,700</text><text class="et" x="48.0" y="449.0">nelle radici</text><rect class="pCb cresce" x="144.0" y="438.0" width="30.0" height="14" style="animation:rami var(--d) infinite"/><text class="lbs" x="302.0" y="449.0" opacity="1" style="animation:nrami var(--d) infinite">0,200</text><text class="et" x="470.0" y="92.0">la somma, ciascuna contata per quanto pesa</text><text class="et" x="470.0" y="173.0" opacity="1" style="animation:nsomm var(--d) infinite">nelle foglie</text><g class="cresce" style="animation:somm var(--d) infinite"><rect class="pAb" x="566.0" y="150.0" width="73.9" height="34.0"/><rect class="pBb" x="639.9" y="150.0" width="5.8" height="34.0"/><rect class="pCb" x="645.7" y="150.0" width="3.2" height="34.0"/></g><text class="val" x="800.0" y="173.0" text-anchor="end" opacity="1" style="animation:nsomm var(--d) infinite">0,471</text><text class="lbs" x="566.0" y="200.0" opacity="1" style="animation:nsomm var(--d) infinite">0,60×0,70 + 0,22×0,15 + 0,18×0,10 = 0,471</text><text class="et" x="470.0" y="249.0" opacity="1" style="animation:nsomm var(--d) infinite">nel fusto</text><g class="cresce" style="animation:somm var(--d) infinite"><rect class="pAb" x="566.0" y="226.0" width="21.1" height="34.0"/><rect class="pBb" x="587.1" y="226.0" width="29.0" height="34.0"/><rect class="pCb" x="616.2" y="226.0" width="22.2" height="34.0"/></g><text class="val" x="800.0" y="249.0" text-anchor="end" opacity="1" style="animation:nsomm var(--d) infinite">0,411</text><text class="et" x="470.0" y="325.0" opacity="1" style="animation:nsomm var(--d) infinite">nelle radici</text><g class="cresce" style="animation:somm var(--d) infinite"><rect class="pAb" x="566.0" y="302.0" width="10.6" height="34.0"/><rect class="pBb" x="576.6" y="302.0" width="3.9" height="34.0"/><rect class="pCb" x="580.4" y="302.0" width="6.3" height="34.0"/></g><text class="val" x="800.0" y="325.0" text-anchor="end" opacity="1" style="animation:nsomm var(--d) infinite">0,118</text><text class="lbs" x="470.0" y="382.0" opacity="1" style="animation:nsomm var(--d) infinite">«nel fusto» piace a due pagine su tre, e perde.</text><rect class="pAb" x="34.0" y="485.0" width="15" height="13"/><text class="lbs" x="56.0" y="496.0">pag. 214</text><rect class="pBb" x="166.0" y="485.0" width="15" height="13"/><text class="lbs" x="188.0" y="496.0">pag. 380</text><rect class="pCb" x="298.0" y="485.0" width="15" height="13"/><text class="lbs" x="320.0" y="496.0">pag. 91</text><text class="lbs" x="470.0" y="496.0">le tre risposte sommano a uno.</text>
