<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 442" role="img" aria-label="Due colonne a confronto, con il tempo in ascissa e la stessa oscillazione smorzata di una molla. A sinistra, sotto il titolo «rete di sole ReLU», la curva è una spezzata di otto segmenti dritti incollati fra loro, e uno dei vertici è cerchiato; nel riquadro sotto, la curvatura è una riga piatta appoggiata sullo zero, interrotta da un cerchietto vuoto in corrispondenza di ogni vertice, dove non esiste. A destra, sotto il titolo «rete con tanh», la stessa oscillazione è una curva continua senza spigoli; nel riquadro sotto, la sua curvatura è a sua volta una curva continua che oscilla attorno allo zero e parte da meno quattro. La curvatura è il termine principale della regola della molla: a sinistra non c'è niente da misurare, a destra sì.">
  <text x="243.0" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#B5532C">rete di sole ReLU</text>
  <text x="243.0" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">segmenti dritti incollati</text>
  <text x="687.0" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#2D5A5C">rete con tanh</text>
  <text x="687.0" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">una curva sola, senza spigoli</text>
