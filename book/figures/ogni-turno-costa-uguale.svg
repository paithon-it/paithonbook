    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .cl  { fill:#F8F5EE; stroke:#2D5A5C; stroke-width:1.2; }
    .vn  { fill:#B5532C; fill-opacity:0.18; stroke:#B5532C;
            stroke-width:1.6; }
    .lb  { font-family:Inter, system-ui, sans-serif; font-size:12.5px; fill:#1A1A1A; }
    .ls  { font-family:Inter, system-ui, sans-serif; font-size:11.5px; fill:#5A524A; }
    
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
  </style>
