  Paithon Book, figura animata: cinque turni, e ogni turno costa quanto gli altri
  Generata da animazioni/svg/ogni-turno-costa-uguale.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
