-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348"
     role="img" aria-label="Cinque righe orizzontali lunghe uguali, una per turno del torneo. La prima è divisa in ottantun celle sottilissime, ed è etichettata ottantuno candidate con una epoca a testa; la seconda in ventisette celle tre volte più larghe, con tre epoche a testa; la terza in nove celle, con nove epoche; la quarta in tre celle, con ventisette epoche; l'ultima è un blocco solo, in terracotta, con ottantuno epoche. A destra di ogni riga il prodotto, che vale ottantuno tutte e cinque le volte. Sotto, la somma: cinque turni da ottantuno fanno quattrocentocinque epoche in tutto.">
