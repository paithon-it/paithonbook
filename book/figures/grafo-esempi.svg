<?xml version="1.0" encoding="UTF-8"?>
<!--
  paithon book - figura: dietro cose diverse, la stessa struttura a grafo.
  Tre pannelli in alto condividono la STESSA topologia (5 nodi, 6 archi):
  (1) una molecola (atomi = nodi, legami = archi); (2) una rete sociale
  (persone = nodi, amicizie = archi); (3) una mappa stradale (incroci = nodi,
  strade = archi). Sotto, il grafo astratto comune con nodi e archi "spogliati".
  Palette-locked, fondo trasparente, nessuna width fissa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img"
     aria-label="Tre pannelli affiancati mostrano la stessa struttura di cinque nodi e sei archi in tre vesti diverse: a sinistra una molecola con atomi come nodi e legami come archi, al centro una rete sociale con persone come nodi e amicizie come archi, a destra una mappa stradale con incroci come nodi e strade come archi. Sotto i tre pannelli, il medesimo grafo astratto con nodi e archi spogliati di ogni apparenza, a indicare che dietro cose diverse c'e la stessa struttura.">
  <defs>
    <marker id="ge-arrow" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E5852"/>
    </marker>
  </defs>
  <style>
    .ttl   { font-family:Inter, system-ui, sans-serif; font-size:16px; font-weight:600; fill:#1A1A1A; text-anchor:middle; }
    .atom  { font-family:Inter, system-ui, sans-serif; font-size:13px; font-weight:700; fill:#1A1A1A; text-anchor:middle; }
    .cap   { font-family:Georgia, "Times New Roman", serif; font-size:16px; font-style:italic; fill:#5E5852; text-anchor:middle; }
    .bond  { stroke:#8B847C; stroke-width:3; }
    .tie   { stroke:#8B847C; stroke-width:2; }
    .road  { stroke:#C9A961; stroke-width:6; stroke-linecap:round; }
    .abed  { stroke:#1A1A1A; stroke-width:2.5; }
  </style>

  <!-- ============ PANNELLO 1: MOLECOLA ============ -->
  <text class="ttl" x="152" y="48">Molecola</text>
  <!-- legami (archi): 0-1,1-2,2-3,3-4,4-0,1-3 -->
  <line class="bond" x1="90"  y1="90"  x2="200" y2="85"/>
  <line class="bond" x1="200" y1="85"  x2="235" y2="170"/>
  <line class="bond" x1="235" y1="170" x2="150" y2="205"/>
  <line class="bond" x1="150" y1="205" x2="70"  y2="160"/>
  <line class="bond" x1="70"  y1="160" x2="90"  y2="90"/>
  <line class="bond" x1="200" y1="85"  x2="150" y2="205"/>
  <!-- atomi (nodi) -->
  <circle cx="90"  cy="90"  r="14" fill="#F8F5EE" stroke="#B5532C" stroke-width="2.5"/>
  <text class="atom" x="90"  y="95">O</text>
  <circle cx="200" cy="85"  r="14" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2.5"/>
  <text class="atom" x="200" y="90">C</text>
  <circle cx="235" cy="170" r="14" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2.5"/>
  <text class="atom" x="235" y="175">N</text>
  <circle cx="150" cy="205" r="14" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2.5"/>
  <text class="atom" x="150" y="210">C</text>
  <circle cx="70"  cy="160" r="14" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2.5"/>
  <text class="atom" x="70"  y="165">C</text>

  <!-- ============ PANNELLO 2: RETE SOCIALE ============ -->
  <text class="ttl" x="382" y="48">Rete sociale</text>
  <line class="tie" x1="320" y1="90"  x2="430" y2="85"/>
  <line class="tie" x1="430" y1="85"  x2="465" y2="170"/>
  <line class="tie" x1="465" y1="170" x2="380" y2="205"/>
  <line class="tie" x1="380" y1="205" x2="300" y2="160"/>
  <line class="tie" x1="300" y1="160" x2="320" y2="90"/>
  <line class="tie" x1="430" y1="85"  x2="380" y2="205"/>
  <!-- persone (nodi): testa + spalle stilizzate -->
  <g fill="#2D5A5C">
    <circle cx="320" cy="86"  r="7"/><path d="M310,100 a10,9 0 0 1 20,0 z"/>
    <circle cx="430" cy="81"  r="7"/><path d="M420,95  a10,9 0 0 1 20,0 z"/>
    <circle cx="465" cy="166" r="7"/><path d="M455,180 a10,9 0 0 1 20,0 z"/>
    <circle cx="380" cy="201" r="7"/><path d="M370,215 a10,9 0 0 1 20,0 z"/>
    <circle cx="300" cy="156" r="7"/><path d="M290,170 a10,9 0 0 1 20,0 z"/>
  </g>

  <!-- ============ PANNELLO 3: MAPPA STRADALE ============ -->
  <text class="ttl" x="612" y="48">Mappa stradale</text>
  <line class="road" x1="550" y1="90"  x2="660" y2="85"/>
  <line class="road" x1="660" y1="85"  x2="695" y2="170"/>
  <line class="road" x1="695" y1="170" x2="610" y2="205"/>
  <line class="road" x1="610" y1="205" x2="530" y2="160"/>
  <line class="road" x1="530" y1="160" x2="550" y2="90"/>
  <line class="road" x1="660" y1="85"  x2="610" y2="205"/>
  <!-- incroci (nodi) -->
  <g fill="#1A1A1A">
    <rect x="543" y="83"  width="14" height="14" rx="2"/>
    <rect x="653" y="78"  width="14" height="14" rx="2"/>
    <rect x="688" y="163" width="14" height="14" rx="2"/>
    <rect x="603" y="198" width="14" height="14" rx="2"/>
    <rect x="523" y="153" width="14" height="14" rx="2"/>
  </g>

  <!-- ============ FRECCIA + DIDASCALIA ============ -->
  <text class="cap" x="380" y="270">Spogliate le apparenze, la struttura e la stessa</text>
  <line x1="380" y1="286" x2="380" y2="322" stroke="#5E5852" stroke-width="2"
        marker-end="url(#ge-arrow)"/>

  <!-- ============ GRAFO ASTRATTO COMUNE ============ -->
  <line class="abed" x1="320" y1="360" x2="430" y2="355"/>
  <line class="abed" x1="430" y1="355" x2="465" y2="440"/>
  <line class="abed" x1="465" y1="440" x2="380" y2="475"/>
  <line class="abed" x1="380" y1="475" x2="300" y2="430"/>
  <line class="abed" x1="300" y1="430" x2="320" y2="360"/>
  <line class="abed" x1="430" y1="355" x2="380" y2="475"/>
  <g fill="#1A1A1A">
    <circle cx="320" cy="360" r="13"/>
    <circle cx="430" cy="355" r="13"/>
    <circle cx="465" cy="440" r="13"/>
    <circle cx="380" cy="475" r="13"/>
    <circle cx="300" cy="430" r="13"/>
  </g>
  <text class="ttl" x="380" y="515">Grafo: nodi e archi</text>
</svg>
