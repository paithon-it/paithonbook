<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Due modi di dare le istruzioni a un agente. A sinistra, un manuale: un file unico e lunghissimo, disegnato come una colonna di righe fitte; una riga terracotta a metà della colonna è la regola importante, e una nota dice che lì, a metà, il modello la legge peggio. Tutta la colonna entra nel contesto a ogni sessione. A destra, un indice: un file corto di poche righe che entra sempre nel contesto, con frecce verso quattro schede della cartella docs (architettura, piani, specifiche, riferimenti); soltanto la scheda dei piani, quella che serve al compito del giorno, è evidenziata ed entra nel contesto.">
