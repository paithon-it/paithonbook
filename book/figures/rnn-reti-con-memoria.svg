<svg viewBox="0 0 720 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Una cella ricorrente con un cappio su sé stessa, e la sua versione srotolata in tre copie identiche lungo il tempo">
  <rect width="720" height="440" fill="#F8F5EE"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <text x="360" y="40" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600">La stessa cella, srotolata nel tempo</text>

  <!-- cella ripiegata -->
  <rect x="70" y="200" width="70" height="64" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="105" y="238" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#F8F5EE" text-anchor="middle" font-weight="600">A</text>
  <path d="M140,210 C185,195 185,255 140,254" fill="none" stroke="#B5532C" stroke-width="2" marker-end="url(#ar)"/>
  <text x="192" y="232" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#B5532C">stato</text>
  <line x1="105" y1="300" x2="105" y2="266" stroke="#1A1A1A" stroke-width="2" marker-end="url(#ar)"/>
  <text x="105" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">input</text>
  <line x1="105" y1="198" x2="105" y2="160" stroke="#1A1A1A" stroke-width="2" marker-end="url(#ar)"/>
  <text x="105" y="150" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">output</text>

  <text x="235" y="238" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#1A1A1A" text-anchor="middle">=</text>

  <!-- versione srotolata: tre celle -->
  <g>
    <line x1="290" y1="232" x2="345" y2="232" stroke="#B5532C" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="345" y="200" width="70" height="64" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
    <text x="380" y="238" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#F8F5EE" text-anchor="middle" font-weight="600">A</text>

    <line x1="415" y1="232" x2="470" y2="232" stroke="#B5532C" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="470" y="200" width="70" height="64" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
    <text x="505" y="238" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#F8F5EE" text-anchor="middle" font-weight="600">A</text>

    <line x1="540" y1="232" x2="595" y2="232" stroke="#B5532C" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="595" y="200" width="70" height="64" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
    <text x="630" y="238" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#F8F5EE" text-anchor="middle" font-weight="600">A</text>
    <line x1="665" y1="232" x2="700" y2="232" stroke="#B5532C" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- input dal basso -->
  <g stroke="#1A1A1A" stroke-width="2">
    <line x1="380" y1="300" x2="380" y2="266" marker-end="url(#ar)"/>
    <line x1="505" y1="300" x2="505" y2="266" marker-end="url(#ar)"/>
    <line x1="630" y1="300" x2="630" y2="266" marker-end="url(#ar)"/>
  </g>
  <text x="380" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">x(t-1)</text>
  <text x="505" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">x(t)</text>
  <text x="630" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">x(t+1)</text>

  <!-- output verso l'alto -->
  <g stroke="#1A1A1A" stroke-width="2">
    <line x1="380" y1="198" x2="380" y2="164" marker-end="url(#ar)"/>
    <line x1="505" y1="198" x2="505" y2="164" marker-end="url(#ar)"/>
    <line x1="630" y1="198" x2="630" y2="164" marker-end="url(#ar)"/>
  </g>
  <text x="380" y="154" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">h(t-1)</text>
  <text x="505" y="154" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">h(t)</text>
  <text x="630" y="154" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">h(t+1)</text>

  <text x="360" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5E5852" text-anchor="middle" font-style="italic">Le tre celle "A" sono la stessa rete, con gli stessi pesi, applicata a istanti diversi.</text>
</svg>
