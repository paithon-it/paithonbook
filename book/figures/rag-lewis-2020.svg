<svg viewBox="0 0 760 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di RAG: la domanda entra nel retriever, che pesca i passaggi piu rilevanti dall'indice di Wikipedia; i passaggi selezionati e la domanda entrano nel generatore, che produce la risposta">
  <rect x="0" y="0" width="760" height="380" fill="#F8F5EE"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Recupero e generazione, in fila</text>

  <!-- domanda -->
  <rect x="24" y="150" width="120" height="60" rx="6" fill="#B5532C"/>
  <text x="84" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F8F5EE">domanda</text>
  <text x="84" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">dell'utente</text>

  <!-- arrow domanda -> retriever -->
  <line x1="144" y1="180" x2="196" y2="180" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M196 180 L 186 175 L 186 185 Z" fill="#1A1A1A"/>

  <!-- retriever -->
  <rect x="196" y="150" width="130" height="60" rx="6" fill="#2D5A5C"/>
  <text x="261" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">retriever</text>
  <text x="261" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">(DPR)</text>

  <!-- indice: stack of docs -->
  <text x="261" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">indice Wikipedia · 21M passaggi</text>
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="176" y="268" width="34" height="44" rx="3" fill="#F8F5EE"/>
    <rect x="216" y="268" width="34" height="44" rx="3" fill="#C9A961"/>
    <rect x="256" y="268" width="34" height="44" rx="3" fill="#C9A961"/>
    <rect x="296" y="268" width="34" height="44" rx="3" fill="#F8F5EE"/>
    <rect x="336" y="268" width="34" height="44" rx="3" fill="#C9A961"/>
  </g>
  <!-- retriever <-> indice -->
  <line x1="261" y1="210" x2="261" y2="264" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- top-k selezionati -->
  <text x="470" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">i k passaggi piu rilevanti</text>
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="422" y="268" width="34" height="44" rx="3" fill="#C9A961"/>
    <rect x="462" y="268" width="34" height="44" rx="3" fill="#C9A961"/>
    <rect x="502" y="268" width="34" height="44" rx="3" fill="#C9A961"/>
  </g>
  <!-- arrow indice selez -> generatore -->
  <path d="M479 268 C 500 220, 560 205, 596 200" fill="none" stroke="#C9A961" stroke-width="3"/>
  <path d="M596 200 L 585 199 L 590 209 Z" fill="#C9A961"/>

  <!-- arrow retriever -> generatore (query passa oltre) -->
  <path d="M326 168 C 430 150, 520 150, 596 165" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M596 165 L 585 161 L 587 171 Z" fill="#1A1A1A"/>

  <!-- generatore -->
  <rect x="598" y="140" width="138" height="70" rx="6" fill="#B5532C"/>
  <text x="667" y="168" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">generatore</text>
  <text x="667" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">(BART) &#8594; risposta</text>

  <text x="380" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">la risposta e condizionata insieme dalla domanda e dai passaggi recuperati</text>
</svg>
