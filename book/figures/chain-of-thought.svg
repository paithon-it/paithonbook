<svg viewBox="0 0 720 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto tra risposta diretta e catena di pensiero">
  <rect width="720" height="440" fill="#F8F5EE"/>
  <text x="180" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="600">risposta diretta</text>
  <text x="540" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="600">catena di pensiero</text>
  <line x1="360" y1="55" x2="360" y2="400" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="5 6"/>
  <!-- left: direct -->
  <rect x="110" y="60" width="140" height="46" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="180" y="88" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">17 × 24 = ?</text>
  <line x1="180" y1="106" x2="180" y2="300" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="172,300 188,300 180,312" fill="#1A1A1A"/>
  <rect x="110" y="312" width="140" height="46" rx="6" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="180" y="340" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#B5532C" text-anchor="middle">388</text>
  <text x="180" y="384" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#B5532C" text-anchor="middle">tiro a indovinare</text>
  <!-- right: chain -->
  <rect x="470" y="60" width="140" height="46" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="540" y="88" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">17 × 24 = ?</text>
  <line x1="540" y1="106" x2="540" y2="126" stroke="#2D5A5C" stroke-width="1.5"/>
  <polygon points="533,126 547,126 540,136" fill="#2D5A5C"/>
  <rect x="470" y="136" width="140" height="34" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="540" y="158" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">17 × 20 = 340</text>
  <line x1="540" y1="170" x2="540" y2="186" stroke="#2D5A5C" stroke-width="1.5"/>
  <polygon points="533,186 547,186 540,196" fill="#2D5A5C"/>
  <rect x="470" y="196" width="140" height="34" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="540" y="218" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">17 × 4 = 68</text>
  <line x1="540" y1="230" x2="540" y2="246" stroke="#2D5A5C" stroke-width="1.5"/>
  <polygon points="533,246 547,246 540,256" fill="#2D5A5C"/>
  <rect x="470" y="256" width="140" height="34" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="540" y="278" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">340 + 68</text>
  <line x1="540" y1="290" x2="540" y2="306" stroke="#2D5A5C" stroke-width="1.5"/>
  <polygon points="533,306 547,306 540,316" fill="#2D5A5C"/>
  <rect x="470" y="316" width="140" height="46" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="540" y="344" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#2D5A5C" text-anchor="middle">408</text>
  <text x="540" y="388" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#2D5A5C" text-anchor="middle">un passo per volta</text>
</svg>
