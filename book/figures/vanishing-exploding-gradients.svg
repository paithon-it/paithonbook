<svg viewBox="0 0 720 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Il gradiente si attenua strato dopo strato tornando indietro nella rete">
  <rect x="0" y="0" width="720" height="300" fill="#F8F5EE"/>
  <text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1A1A1A" font-weight="bold">Il gradiente torna indietro e si spegne</text>
  <!-- layers -->
  <g font-family="sans-serif" font-size="12" fill="#1A1A1A">
    <rect x="60"  y="70" width="70" height="150" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <rect x="185" y="70" width="70" height="150" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <rect x="310" y="70" width="70" height="150" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <rect x="435" y="70" width="70" height="150" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <rect x="560" y="70" width="70" height="150" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
    <text x="95"  y="245" text-anchor="middle">strato 1</text>
    <text x="220" y="245" text-anchor="middle">strato 2</text>
    <text x="345" y="245" text-anchor="middle">strato 3</text>
    <text x="470" y="245" text-anchor="middle">strato 4</text>
    <text x="595" y="245" text-anchor="middle">strato 5</text>
  </g>
  <!-- gradient bars inside layers, shrinking right-to-left -->
  <rect x="580" y="90"  width="30" height="110" fill="#B5532C"/>
  <rect x="455" y="125" width="30" height="75"  fill="#B5532C"/>
  <rect x="330" y="155" width="30" height="45"  fill="#B5532C"/>
  <rect x="205" y="178" width="30" height="22"  fill="#B5532C"/>
  <rect x="80"  y="193" width="30" height="7"   fill="#B5532C"/>
  <!-- backward arrows -->
  <g stroke="#C9A961" stroke-width="2" fill="none">
    <line x1="560" y1="145" x2="510" y2="145"/>
    <line x1="435" y1="145" x2="385" y2="145"/>
    <line x1="310" y1="145" x2="260" y2="145"/>
    <line x1="185" y1="145" x2="135" y2="145"/>
  </g>
  <g fill="#C9A961">
    <path d="M510 145 l10 -5 v10 z"/>
    <path d="M385 145 l10 -5 v10 z"/>
    <path d="M260 145 l10 -5 v10 z"/>
    <path d="M135 145 l10 -5 v10 z"/>
  </g>
  <text x="360" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">direzione della retropropagazione: dall'uscita (destra) verso l'ingresso (sinistra)</text>
</svg>
