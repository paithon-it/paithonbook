<svg viewBox="0 0 760 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di un GAN: il rumore entra nel generatore che produce un'immagine falsa; il discriminatore riceve sia immagini false sia immagini reali dal dataset ed emette un verdetto vero o falso; il verdetto torna come feedback a entrambe le reti">
  <defs>
    <marker id="gan-t" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#B5532C"/></marker>
    <marker id="gan-k" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A1A1A"/></marker>
    <marker id="gan-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#C9A961"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#F8F5EE"/>
  <!-- rumore z -->
  <circle cx="70" cy="130" r="34" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="60" cy="122" r="3" fill="#1A1A1A"/><circle cx="80" cy="118" r="3" fill="#1A1A1A"/>
  <circle cx="72" cy="140" r="3" fill="#1A1A1A"/><circle cx="58" cy="142" r="3" fill="#1A1A1A"/>
  <circle cx="84" cy="134" r="3" fill="#1A1A1A"/>
  <text x="70" y="190" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">rumore z</text>
  <line x1="108" y1="130" x2="160" y2="130" stroke="#1A1A1A" stroke-width="2" marker-end="url(#gan-k)"/>
  <!-- generatore -->
  <rect x="165" y="90" width="150" height="80" rx="8" fill="#B5532C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="240" y="124" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE" text-anchor="middle">GENERATORE</text>
  <text x="240" y="146" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">il falsario</text>
  <line x1="315" y1="130" x2="380" y2="130" stroke="#B5532C" stroke-width="2" marker-end="url(#gan-t)"/>
  <!-- immagine falsa -->
  <rect x="385" y="100" width="60" height="60" rx="4" fill="none" stroke="#B5532C" stroke-width="2"/>
  <circle cx="415" cy="122" r="9" fill="none" stroke="#B5532C" stroke-width="1.5"/>
  <path d="M398,152 Q415,136 432,152" fill="none" stroke="#B5532C" stroke-width="1.5"/>
  <text x="415" y="180" font-family="sans-serif" font-size="13" fill="#B5532C" text-anchor="middle">falsa</text>
  <!-- dataset reale -->
  <rect x="385" y="240" width="60" height="60" rx="4" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <circle cx="415" cy="262" r="9" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
  <path d="M398,292 Q415,276 432,292" fill="none" stroke="#2D5A5C" stroke-width="1.5"/>
  <text x="415" y="322" font-family="sans-serif" font-size="13" fill="#2D5A5C" text-anchor="middle">reale (dataset)</text>
  <!-- frecce verso discriminatore -->
  <line x1="445" y1="130" x2="520" y2="180" stroke="#1A1A1A" stroke-width="2" marker-end="url(#gan-k)"/>
  <line x1="445" y1="270" x2="520" y2="220" stroke="#1A1A1A" stroke-width="2" marker-end="url(#gan-k)"/>
  <!-- discriminatore -->
  <rect x="525" y="160" width="160" height="80" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="605" y="194" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE" text-anchor="middle">DISCRIMINATORE</text>
  <text x="605" y="216" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">il detective</text>
  <!-- verdetto -->
  <line x1="605" y1="240" x2="605" y2="288" stroke="#1A1A1A" stroke-width="2" marker-end="url(#gan-k)"/>
  <rect x="545" y="292" width="120" height="40" rx="20" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="605" y="317" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="middle">vera / falsa?</text>
  <!-- feedback -->
  <path d="M545,318 C300,330 240,260 240,178" fill="none" stroke="#C9A961" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gan-o)"/>
  <text x="330" y="350" font-family="sans-serif" font-size="12" fill="#8B6a30">feedback: "sei stato smascherato così"</text>
  <text x="380" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Il duello del GAN: chi migliora costringe l'altro a migliorare</text>
</svg>
