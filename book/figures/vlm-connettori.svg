  <text x="765" y="335" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#2D5A5C">una patch, un token</text>

  <line x1="765" y1="400" x2="765" y2="344" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fr-conn)"/>

  <rect x="665" y="400" width="200" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="765" y="420" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">encoder visivo</text>
