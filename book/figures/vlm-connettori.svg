    <rect x="370" y="120" width="180" height="20" rx="3"/>
    <rect x="370" y="145" width="180" height="20" rx="3"/>
    <rect x="370" y="170" width="180" height="20" rx="3"/>
    <rect x="370" y="195" width="180" height="20" rx="3"/>
