    <text x="460" y="134">blocco LM congelato</text>
    <text x="460" y="159">blocco LM congelato</text>
    <text x="460" y="184">blocco LM congelato</text>
    <text x="460" y="209">blocco LM congelato</text>
    <text x="460" y="234">blocco LM congelato</text>
  </g>

  <line x1="460" y1="286" x2="460" y2="254" stroke="#B5532C" stroke-width="2" marker-end="url(#fr-conn-t)"/>
  <text x="472" y="272" font-family="Inter, sans-serif" font-size="10.5" fill="#B5532C">32 token</text>

  <line x1="565" y1="300" x2="565" y2="254" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fr-conn)"/>
  <text x="565" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#1A1A1A">prompt</text>

  <rect x="380" y="286" width="160" height="80" rx="7" fill="#B5532C" fill-opacity="0.16" stroke="#B5532C" stroke-width="2.5"/>
  <text x="460" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#1A1A1A">Q-Former</text>
  <g fill="#B5532C">
    <circle cx="410" cy="330" r="5.5"/>
    <circle cx="430" cy="330" r="5.5"/>
    <circle cx="450" cy="330" r="5.5"/>
    <circle cx="470" cy="330" r="5.5"/>
    <circle cx="490" cy="330" r="5.5"/>
    <circle cx="510" cy="330" r="5.5"/>
  </g>
  <text x="460" y="356" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#2D5A5C">32 query apprese</text>

  <line x1="460" y1="400" x2="460" y2="366" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fr-conn)"/>

  <rect x="360" y="400" width="200" height="54" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2" stroke-dasharray="7 5"/>
