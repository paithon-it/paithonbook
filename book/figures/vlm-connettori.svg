  <polyline points="741,512 755,492 764,503 773,489 789,512" fill="none" stroke="#B5532C" stroke-width="2" stroke-linejoin="round"/>

  <text x="765" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#1A1A1A">connettore: 21 milioni di parametri</text>

  <!-- =================== LEGENDA =================== -->
