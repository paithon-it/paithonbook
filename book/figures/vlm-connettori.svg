  <text x="460" y="438" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#2D5A5C">congelato</text>

  <line x1="460" y1="474" x2="460" y2="456" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fr-conn)"/>
  <rect x="430" y="474" width="60" height="44" rx="5" fill="#C9A961" fill-opacity="0.14" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="476" cy="486" r="5" fill="#C9A961"/>
  <polyline points="436,512 450,492 459,503 468,489 484,512" fill="none" stroke="#B5532C" stroke-width="2" stroke-linejoin="round"/>

  <text x="460" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#1A1A1A">connettore: 188 milioni di parametri</text>

