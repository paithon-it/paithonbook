  <line x1="765" y1="92" x2="765" y2="74" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fr-conn)"/>

  <rect x="665" y="92" width="200" height="160" rx="8" fill="#C9A961" fill-opacity="0.12" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="765" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1A1A1A">modello di linguaggio</text>
  <g fill="#C9A961" fill-opacity="0.28" stroke="#1A1A1A" stroke-width="1.2">
    <rect x="675" y="120" width="180" height="20" rx="3"/>
    <rect x="675" y="145" width="180" height="20" rx="3"/>
    <rect x="675" y="170" width="180" height="20" rx="3"/>
    <rect x="675" y="195" width="180" height="20" rx="3"/>
    <rect x="675" y="220" width="180" height="20" rx="3"/>
  </g>
