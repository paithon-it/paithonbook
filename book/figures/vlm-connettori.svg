    <text x="765" y="159">blocco LM congelato</text>
    <text x="765" y="184">blocco LM congelato</text>
    <text x="765" y="209">blocco LM congelato</text>
    <text x="765" y="234">blocco LM congelato</text>
  </g>

  <line x1="765" y1="302" x2="765" y2="254" stroke="#B5532C" stroke-width="2" marker-end="url(#fr-conn-t)"/>
  <text x="777" y="282" font-family="Inter, sans-serif" font-size="10.5" fill="#B5532C">576 token</text>

  <line x1="868" y1="300" x2="868" y2="254" stroke="#1A1A1A" stroke-width="2" marker-end="url(#fr-conn)"/>
  <text x="868" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#1A1A1A">prompt</text>

  <rect x="685" y="302" width="160" height="42" rx="7" fill="#B5532C" fill-opacity="0.16" stroke="#B5532C" stroke-width="2.5"/>
