<svg viewBox="0 0 720 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema dello spazio latente campionabile di un VAE: nuvole gaussiane sovrapposte, un punto campionato viene decodificato in un esempio nuovo">
  <rect x="0" y="0" width="720" height="340" fill="#F8F5EE"/>
  <text x="360" y="28" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Lo spazio latente campionabile del VAE</text>
  <!-- latent space frame -->
  <rect x="180" y="55" width="280" height="230" rx="10" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="320" y="305" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">spazio latente: nuvole continue, senza buchi</text>
  <!-- gaussian clouds -->
  <ellipse cx="265" cy="130" rx="52" ry="38" fill="#2D5A5C" opacity="0.35" stroke="#2D5A5C" stroke-width="1.5"/>
  <ellipse cx="345" cy="185" rx="58" ry="42" fill="#C9A961" opacity="0.4" stroke="#C9A961" stroke-width="1.5"/>
  <ellipse cx="290" cy="225" rx="48" ry="34" fill="#2D5A5C" opacity="0.25" stroke="#2D5A5C" stroke-width="1.5"/>
  <ellipse cx="380" cy="115" rx="46" ry="34" fill="#C9A961" opacity="0.3" stroke="#C9A961" stroke-width="1.5"/>
  <!-- cloud centers -->
  <circle cx="265" cy="130" r="4" fill="#2D5A5C"/>
  <circle cx="345" cy="185" r="4" fill="#C9A961" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="290" cy="225" r="4" fill="#2D5A5C"/>
  <circle cx="380" cy="115" r="4" fill="#C9A961" stroke="#1A1A1A" stroke-width="1"/>
  <!-- input to encoder -->
  <rect x="30" y="130" width="60" height="60" rx="6" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="60" y="165" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">input</text>
  <line x1="94" y1="160" x2="176" y2="160" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="176,155 186,160 176,165" fill="#1A1A1A"/>
  <text x="135" y="150" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">encoder</text>
  <text x="135" y="178" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">μ, σ</text>
  <!-- sampled point -->
  <circle cx="330" cy="150" r="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="330" y="98" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C" text-anchor="middle" font-weight="bold">z campionato</text>
  <line x1="330" y1="104" x2="330" y2="141" stroke="#B5532C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- decoder to output -->
  <line x1="464" y1="160" x2="546" y2="160" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="546,155 556,160 546,165" fill="#1A1A1A"/>
  <text x="505" y="150" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">decoder</text>
  <rect x="560" y="130" width="60" height="60" rx="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="590" y="160" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F8F5EE" text-anchor="middle">esempio</text>
  <text x="590" y="175" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F8F5EE" text-anchor="middle">nuovo</text>
  <text x="590" y="215" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">mai visto</text>
  <text x="590" y="230" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">in training</text>
</svg>
