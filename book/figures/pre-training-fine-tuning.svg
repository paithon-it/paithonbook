<svg viewBox="0 0 720 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline a due fasi: pre-training su testo generico, poi fine-tuning su dati specifici">
  <rect x="0" y="0" width="720" height="320" fill="#F8F5EE"/>
  <text x="150" y="40" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">FASE 1 — Pre-training</text>
  <g font-family="sans-serif" font-size="12" fill="#1A1A1A">
    <rect x="40" y="60" width="100" height="30" rx="5" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="90" y="79" text-anchor="middle">web</text>
    <rect x="150" y="60" width="100" height="30" rx="5" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="200" y="79" text-anchor="middle">libri</text>
    <rect x="260" y="60" width="100" height="30" rx="5" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="310" y="79" text-anchor="middle">codice</text>
  </g>
  <text x="200" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">miliardi di parole, nessuna etichetta</text>
  <g stroke="#1A1A1A" stroke-width="1.5" fill="none">
    <path d="M 90 90 L 170 135"/>
    <path d="M 200 90 L 200 135"/>
    <path d="M 310 90 L 230 135"/>
  </g>
  <rect x="110" y="140" width="180" height="60" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="200" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">Modello base</text>
  <text x="200" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">generalista</text>
  <text x="200" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">settimane di GPU · si paga una volta</text>
  <path d="M 300 170 L 400 170" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <path d="M 400 170 l -12 -7 l 0 14 z" fill="#1A1A1A"/>
  <text x="560" y="40" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">FASE 2 — Fine-tuning</text>
  <rect x="480" y="60" width="160" height="30" rx="5" fill="#F8F5EE" stroke="#B5532C" stroke-width="1.5"/>
  <text x="560" y="79" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">dati etichettati del compito</text>
  <text x="560" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">migliaia di esempi, non miliardi</text>
  <path d="M 560 90 L 560 135" stroke="#B5532C" stroke-width="1.5" fill="none"/>
  <path d="M 560 135 l -7 -12 l 14 0 z" fill="#B5532C"/>
  <rect x="470" y="140" width="180" height="60" rx="8" fill="#B5532C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="560" y="166" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">Modello specializzato</text>
  <text x="560" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">un compito, fatto bene</text>
  <text x="560" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">ore di GPU · si ripete per ogni compito</text>
  <g font-family="sans-serif" font-size="11" fill="#1A1A1A">
    <text x="560" y="268" text-anchor="middle">sentiment · estrazione · dialogo · dominio legale…</text>
  </g>
  <line x1="360" y1="50" x2="360" y2="290" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
