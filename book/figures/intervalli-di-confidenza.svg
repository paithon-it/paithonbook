<svg viewBox="0 0 660 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tre modelli con barre d'errore: A e B si sovrappongono, C è nettamente sotto">
  <rect width="660" height="380" fill="#F8F5EE"/>
  <!-- assi -->
  <line x1="90" y1="40" x2="90" y2="320" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="90" y1="320" x2="600" y2="320" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- tick e griglia -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">
    <line x1="84" y1="280" x2="90" y2="280" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="76" y="285" text-anchor="end">80%</text>
    <line x1="90" y1="280" x2="600" y2="280" stroke="#C9A961" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="84" y1="200" x2="90" y2="200" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="76" y="205" text-anchor="end">84%</text>
    <line x1="90" y1="200" x2="600" y2="200" stroke="#C9A961" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="84" y1="120" x2="90" y2="120" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="76" y="125" text-anchor="end">88%</text>
    <line x1="90" y1="120" x2="600" y2="120" stroke="#C9A961" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="84" y1="40" x2="90" y2="40" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="76" y="45" text-anchor="end">92%</text>
  </g>
  <text x="40" y="180" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle" transform="rotate(-90 40 180)">accuratezza</text>
  <!-- modello A: 87,2 ± 2,9 -->
  <g>
    <line x1="200" y1="78" x2="200" y2="194" stroke="#B5532C" stroke-width="2"/>
    <line x1="184" y1="78" x2="216" y2="78" stroke="#B5532C" stroke-width="2"/>
    <line x1="184" y1="194" x2="216" y2="194" stroke="#B5532C" stroke-width="2"/>
    <circle cx="200" cy="136" r="7" fill="#B5532C"/>
    <text x="200" y="348" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">modello A</text>
    <text x="200" y="366" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">87,2%</text>
  </g>
  <!-- modello B: 86,8 ± 3,0 -->
  <g>
    <line x1="350" y1="84" x2="350" y2="204" stroke="#2D5A5C" stroke-width="2"/>
    <line x1="334" y1="84" x2="366" y2="84" stroke="#2D5A5C" stroke-width="2"/>
    <line x1="334" y1="204" x2="366" y2="204" stroke="#2D5A5C" stroke-width="2"/>
    <circle cx="350" cy="144" r="7" fill="#2D5A5C"/>
    <text x="350" y="348" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">modello B</text>
    <text x="350" y="366" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">86,8%</text>
  </g>
  <!-- modello C: 81,0 ± 2,8 -->
  <g>
    <line x1="500" y1="204" x2="500" y2="316" stroke="#C9A961" stroke-width="2"/>
    <line x1="484" y1="204" x2="516" y2="204" stroke="#C9A961" stroke-width="2"/>
    <line x1="484" y1="316" x2="516" y2="316" stroke="#C9A961" stroke-width="2"/>
    <circle cx="500" cy="260" r="7" fill="#C9A961"/>
    <text x="500" y="348" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">modello C</text>
    <text x="500" y="366" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">81,0%</text>
  </g>
  <!-- annotazione sovrapposizione -->
  <rect x="160" y="84" width="230" height="110" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="275" y="70" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">intervalli sovrapposti: nessun vincitore</text>
</svg>
