<svg viewBox="0 0 760 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Griglia di subplot: una Figure contiene quattro Axes disposti 2 per 2, ognuno indicizzato come una matrice">
  <rect x="0" y="0" width="760" height="500" fill="#F8F5EE"/>
  <text x="30" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">fig, axes = plt.subplots(2, 2) — la parete e i quattro quadri</text>
  <!-- Figure: la parete -->
  <rect x="40" y="60" width="680" height="400" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="52" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">fig  (la Figure: la parete)</text>
  <!-- axes[0,0]: linea -->
  <rect x="70" y="100" width="290" height="140" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <polyline points="85,215 130,190 175,200 220,160 265,150 310,120 345,130" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="75" y="258" font-family="sans-serif" font-size="13" fill="#1A1A1A">axes[0, 0] — plot (linea)</text>
  <!-- axes[0,1]: scatter -->
  <rect x="400" y="100" width="290" height="140" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <g fill="#B5532C">
    <circle cx="430" cy="210" r="5"/><circle cx="465" cy="195" r="5"/>
    <circle cx="490" cy="205" r="5"/><circle cx="520" cy="170" r="5"/>
    <circle cx="550" cy="180" r="5"/><circle cx="585" cy="150" r="5"/>
    <circle cx="615" cy="135" r="5"/><circle cx="650" cy="125" r="5"/>
    <circle cx="560" cy="145" r="5"/><circle cx="470" cy="165" r="5"/>
  </g>
  <text x="405" y="258" font-family="sans-serif" font-size="13" fill="#1A1A1A">axes[0, 1] — scatter (punti)</text>
  <!-- axes[1,0]: istogramma -->
  <rect x="70" y="290" width="290" height="140" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <g fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5">
    <rect x="95" y="390" width="35" height="30"/>
    <rect x="130" y="365" width="35" height="55"/>
    <rect x="165" y="330" width="35" height="90"/>
    <rect x="200" y="345" width="35" height="75"/>
    <rect x="235" y="380" width="35" height="40"/>
    <rect x="270" y="400" width="35" height="20"/>
  </g>
  <text x="75" y="448" font-family="sans-serif" font-size="13" fill="#1A1A1A">axes[1, 0] — hist (barre)</text>
  <!-- axes[1,1]: barre orizzontali -->
  <rect x="400" y="290" width="290" height="140" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <g fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5">
    <rect x="420" y="305" width="200" height="22"/>
    <rect x="420" y="337" width="140" height="22"/>
    <rect x="420" y="369" width="90" height="22"/>
  </g>
  <text x="405" y="448" font-family="sans-serif" font-size="13" fill="#1A1A1A">axes[1, 1] — barh (barre orizz.)</text>
</svg>
