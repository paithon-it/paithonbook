<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 404"
     role="img" aria-label="La decodifica di una didascalia, parola per parola. In alto la risposta cresce: un piatto, un coltello e un bicchiere. Sotto, per ogni passo, tre colonne di barre sullo stesso vocabolario di sei parole: le probabilità con la foto, quelle con la foto resa illeggibile e quelle che restano dopo aver sottratto le seconde dalle prime. Ai primi due passi la sottrazione conferma o premia la parola che si vede davvero. Al terzo passo forchetta è la più alta in tutte e due le letture, quindi non viene dalla foto ma dall'abitudine: sottraendo, sprofonda sotto bicchiere, che era seconda, e la parola scritta è bicchiere.">
