  Paithon Book, figura animata: la decodifica contrastiva sottrae ciò che il modello direbbe comunque
  Generata da animazioni/svg/decodifica-per-differenza.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
