<svg viewBox="0 0 700 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di una tabella indicizzata: un DataFrame con l'indice di riga evidenziato a sinistra, i nomi di colonna in alto, e una colonna estratta a destra che mostra come una Series sia indice più valori">
  <rect x="0" y="0" width="700" height="340" fill="#F8F5EE"/>
  <text x="200" y="34" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">DataFrame = tabella indicizzata</text>
  <!-- intestazioni colonne -->
  <rect x="130" y="52" width="105" height="34" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="235" y="52" width="90" height="34" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="325" y="52" width="105" height="34" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="182" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle">temperatura</text>
  <text x="280" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle">umidita</text>
  <text x="377" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle">regione</text>
  <!-- indice di riga -->
  <rect x="40" y="86" width="90" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="40" y="120" width="90" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="40" y="154" width="90" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="40" y="188" width="90" height="34" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="85" y="108" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle">Milano</text>
  <text x="85" y="142" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle">Roma</text>
  <text x="85" y="176" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle">Napoli</text>
  <text x="85" y="210" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle">Torino</text>
  <!-- celle dati -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">
    <rect x="130" y="86" width="105" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="130" y="120" width="105" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="130" y="154" width="105" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="130" y="188" width="105" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="235" y="86" width="90" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="235" y="120" width="90" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="235" y="154" width="90" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="235" y="188" width="90" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="325" y="86" width="105" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="325" y="120" width="105" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="325" y="154" width="105" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="325" y="188" width="105" height="34" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="182" y="108">31.5</text><text x="280" y="108">58</text><text x="377" y="108">Lombardia</text>
    <text x="182" y="142">34.0</text><text x="280" y="142">45</text><text x="377" y="142">Lazio</text>
    <text x="182" y="176">33.2</text><text x="280" y="176">62</text><text x="377" y="176">Campania</text>
    <text x="182" y="210">29.8</text><text x="280" y="210">66</text><text x="377" y="210">Piemonte</text>
  </g>
  <!-- freccia estrazione colonna -->
  <line x1="440" y1="140" x2="510" y2="140" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="510,140 498,133 498,147" fill="#1A1A1A"/>
  <text x="475" y="126" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">df["temperatura"]</text>
  <!-- Series estratta -->
  <text x="595" y="66" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2D5A5C" text-anchor="middle">Series</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle">
    <rect x="520" y="80" width="72" height="32" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="592" y="80" width="78" height="32" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="520" y="112" width="72" height="32" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="592" y="112" width="78" height="32" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="520" y="144" width="72" height="32" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="592" y="144" width="78" height="32" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="520" y="176" width="72" height="32" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="592" y="176" width="78" height="32" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="556" y="101" fill="#F8F5EE">Milano</text><text x="631" y="101" fill="#1A1A1A">31.5</text>
    <text x="556" y="133" fill="#F8F5EE">Roma</text><text x="631" y="133" fill="#1A1A1A">34.0</text>
    <text x="556" y="165" fill="#F8F5EE">Napoli</text><text x="631" y="165" fill="#1A1A1A">33.2</text>
    <text x="556" y="197" fill="#F8F5EE">Torino</text><text x="631" y="197" fill="#1A1A1A">29.8</text>
  </g>
  <!-- legenda -->
  <rect x="40" y="266" width="18" height="18" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="66" y="280" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#1A1A1A">indice (etichette di riga)</text>
  <rect x="250" y="266" width="18" height="18" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="276" y="280" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#1A1A1A">nomi di colonna</text>
  <rect x="430" y="266" width="18" height="18" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="456" y="280" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#1A1A1A">valori della Series estratta</text>
  <text x="40" y="316" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#1A1A1A">Ogni colonna è una Series; tutte condividono lo stesso indice.</text>
</svg>
