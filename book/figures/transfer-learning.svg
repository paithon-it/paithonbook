<svg viewBox="0 0 760 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema del transfer learning: backbone congelato e testa nuova addestrabile">
  <rect x="0" y="0" width="760" height="340" fill="#F8F5EE"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Backbone congelato + testa nuova</text>
  <!-- input image -->
  <rect x="30" y="120" width="80" height="80" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="58" cy="146" r="9" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M36 192 L64 158 L84 180 L98 166 L104 192 Z" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="70" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">immagine</text>
  <!-- arrow -->
  <line x1="115" y1="160" x2="150" y2="160" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M150 160 L142 155 L142 165 Z" fill="#1A1A1A"/>
  <!-- backbone frozen -->
  <rect x="158" y="80" width="330" height="160" fill="#2D5A5C" opacity="0.15" stroke="#2D5A5C" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="180" y="110" width="52" height="100" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="252" y="120" width="52" height="80" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="324" y="130" width="52" height="60" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="396" y="138" width="52" height="44" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="206" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">bordi</text>
  <text x="278" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">texture</text>
  <text x="350" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F8F5EE">parti</text>
  <text x="422" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">oggetti</text>
  <text x="323" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D5A5C">BACKBONE (congelato ❄)</text>
  <text x="323" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">pesi pre-addestrati su milioni di immagini — non si aggiornano</text>
  <!-- arrow -->
  <line x1="492" y1="160" x2="530" y2="160" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M530 160 L522 155 L522 165 Z" fill="#1A1A1A"/>
  <!-- new head -->
  <rect x="538" y="95" width="120" height="130" fill="#B5532C" opacity="0.15" stroke="#B5532C" stroke-width="2"/>
  <rect x="560" y="120" width="34" height="80" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="612" y="135" width="30" height="50" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="598" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B5532C">TESTA (nuova ✎)</text>
  <text x="598" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">strati nuovi, addestrati</text>
  <text x="598" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">sui nostri dati</text>
  <!-- output -->
  <line x1="662" y1="160" x2="695" y2="160" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M695 160 L687 155 L687 165 Z" fill="#1A1A1A"/>
  <text x="712" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">le tue</text>
  <text x="712" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">classi</text>
  <!-- legend -->
  <rect x="180" y="296" width="16" height="16" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="204" y="309" font-family="sans-serif" font-size="13" fill="#1A1A1A">pesi congelati (riusati)</text>
  <rect x="400" y="296" width="16" height="16" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="424" y="309" font-family="sans-serif" font-size="13" fill="#1A1A1A">pesi addestrati da zero</text>
</svg>
