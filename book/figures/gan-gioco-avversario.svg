<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 485" role="img" aria-label="Schema del gioco avversario di una GAN" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowO" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#C9A961"/>
    </marker>
  </defs>

  <!-- ================= RUMORE z ================= -->
  <rect x="30" y="70" width="95" height="80" rx="10" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="52" cy="92" r="2.6" fill="#5E5852"/>
  <circle cx="74" cy="104" r="2.6" fill="#5E5852"/>
  <circle cx="98" cy="88" r="2.6" fill="#5E5852"/>
  <circle cx="60" cy="128" r="2.6" fill="#5E5852"/>
  <circle cx="88" cy="122" r="2.6" fill="#5E5852"/>
  <circle cx="108" cy="112" r="2.6" fill="#5E5852"/>
  <circle cx="44" cy="114" r="2.6" fill="#5E5852"/>
  <text x="77" y="168" text-anchor="middle" font-size="14" fill="#1A1A1A">rumore <tspan font-style="italic">z</tspan></text>

  <!-- z -> G -->
  <line x1="125" y1="110" x2="179" y2="110" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= GENERATORE ================= -->
  <rect x="185" y="70" width="140" height="80" rx="10" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="255" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#F8F5EE">Generatore <tspan font-style="italic">G</tspan></text>
  <text x="255" y="170" text-anchor="middle" font-size="12" fill="#5E5852">(il falsario)</text>

  <!-- G -> fake -->
  <line x1="325" y1="110" x2="384" y2="110" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= IMMAGINE FALSA ================= -->
  <rect x="390" y="70" width="120" height="80" rx="10" fill="#F8F5EE" stroke="#C9C2B4" stroke-width="2"/>
  <rect x="418" y="86" width="64" height="48" rx="3" fill="none" stroke="#8B847C" stroke-width="1.6"/>
  <circle cx="433" cy="100" r="6" fill="#C9A961"/>
  <polygon points="423,128 445,104 467,128" fill="#2D5A5C"/>
  <text x="450" y="172" text-anchor="middle" font-size="14" fill="#1A1A1A">immagine falsa</text>

  <!-- ================= IMMAGINE REALE ================= -->
  <rect x="390" y="320" width="120" height="80" rx="10" fill="#F8F5EE" stroke="#C9C2B4" stroke-width="2"/>
  <rect x="418" y="336" width="64" height="48" rx="3" fill="none" stroke="#8B847C" stroke-width="1.6"/>
  <circle cx="433" cy="350" r="6" fill="#C9A961"/>
  <polygon points="423,378 445,354 467,378" fill="#B5532C"/>
  <text x="450" y="420" text-anchor="middle" font-size="14" fill="#1A1A1A">immagine reale</text>
  <text x="450" y="437" text-anchor="middle" font-size="11" fill="#5E5852">dal dataset</text>

  <!-- fake -> D  e  real -> D -->
  <line x1="510" y1="110" x2="571" y2="188" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="360" x2="571" y2="252" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= DISCRIMINATORE ================= -->
  <rect x="575" y="170" width="145" height="100" rx="10" fill="#B5532C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="647" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#F8F5EE">Discriminatore</text>
  <text x="647" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#F8F5EE" font-style="italic">D</text>
  <text x="647" y="290" text-anchor="middle" font-size="12" fill="#5E5852">(l'esperto d'arte)</text>

  <!-- D -> verdetto -->
  <line x1="720" y1="220" x2="766" y2="220" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= VERDETTO ================= -->
  <text x="810" y="182" text-anchor="middle" font-size="11" fill="#5E5852">verdetto</text>
  <rect x="770" y="192" width="80" height="56" rx="10" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="810" y="225" text-anchor="middle" font-size="13" fill="#1A1A1A">vero / falso</text>

  <!-- ================= FEEDBACK (dashed, ocra) ================= -->
  <line x1="810" y1="248" x2="810" y2="448" stroke="#C9A961" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="810" y1="448" x2="200" y2="448" stroke="#C9A961" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="200" y1="448" x2="200" y2="156" stroke="#C9A961" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowO)"/>
  <line x1="578" y1="448" x2="578" y2="276" stroke="#C9A961" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowO)"/>
  <text x="515" y="468" text-anchor="middle" font-size="13" fill="#5E5852">il verdetto genera il gradiente che addestra entrambe le reti</text>
</svg>