<svg viewBox="0 0 720 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto tra moneta equa (50/50, entropia 1 bit) e moneta truccata (90/10, entropia 0,47 bit)">
  <rect x="0" y="0" width="720" height="380" fill="#F8F5EE"/>
  <!-- pannello sinistro: moneta equa -->
  <text x="190" y="42" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Moneta equa</text>
  <line x1="70" y1="260" x2="310" y2="260" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="105" y="130" width="70" height="130" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="205" y="130" width="70" height="130" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="140" y="282" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">testa</text>
  <text x="240" y="282" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">croce</text>
  <text x="140" y="120" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#2D5A5C" text-anchor="middle">0,5</text>
  <text x="240" y="120" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#2D5A5C" text-anchor="middle">0,5</text>
  <text x="190" y="330" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">H = 1 bit</text>
  <text x="190" y="352" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">massima imprevedibilità</text>
  <!-- separatore -->
  <line x1="360" y1="40" x2="360" y2="340" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- pannello destro: moneta truccata -->
  <text x="530" y="42" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Moneta truccata</text>
  <line x1="410" y1="260" x2="650" y2="260" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="445" y="26" width="70" height="234" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="545" y="234" width="70" height="26" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="480" y="282" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">testa</text>
  <text x="580" y="282" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">croce</text>
  <text x="480" y="18" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#B5532C" text-anchor="middle">0,9</text>
  <text x="580" y="224" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#B5532C" text-anchor="middle">0,1</text>
  <text x="530" y="330" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">H ≈ 0,47 bit</text>
  <text x="530" y="352" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">quasi sempre prevedibile</text>
</svg>
