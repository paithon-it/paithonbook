<svg viewBox="0 0 640 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto tra jailbreak (attacco diretto) e prompt injection (attacco iniettato)">
  <rect x="0" y="0" width="640" height="420" fill="#F8F5EE"/>
  <line x1="320" y1="40" x2="320" y2="390" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="160" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Jailbreak</text>
  <text x="160" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C">attacco diretto</text>
  <text x="480" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">Prompt injection</text>
  <text x="480" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2D5A5C">attacco iniettato</text>

  <!-- LEFT: jailbreak -->
  <rect x="90" y="80" width="140" height="46" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="160" y="102" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Utente =</text>
  <text x="160" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#B5532C">attaccante</text>
  <line x1="160" y1="126" x2="160" y2="252" stroke="#B5532C" stroke-width="2"/>
  <polygon points="160,262 154,248 166,248" fill="#B5532C"/>
  <text x="176" y="196" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">prompt</text>
  <text x="176" y="210" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">manipolato</text>
  <rect x="90" y="262" width="140" height="60" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="160" y="288" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Modello</text>
  <text x="160" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#B5532C">regole aggirate</text>
  <text x="160" y="360" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">un solo attore,</text>
  <text x="160" y="375" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">davanti allo schermo</text>

  <!-- RIGHT: prompt injection -->
  <rect x="356" y="72" width="118" height="44" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="415" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Utente</text>
  <text x="415" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#2D5A5C">(vittima)</text>
  <rect x="520" y="72" width="100" height="44" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="570" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C">Attaccante</text>

  <rect x="470" y="158" width="150" height="56" rx="8" fill="#F8F5EE" stroke="#C9A961" stroke-width="2"/>
  <text x="545" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Contenuto esterno</text>
  <text x="545" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#B5532C">istruzione nascosta</text>

  <rect x="400" y="300" width="150" height="60" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="475" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">Modello</text>
  <text x="475" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">esegue l'ordine iniettato</text>

  <!-- attacker hides instruction in content -->
  <line x1="570" y1="116" x2="558" y2="158" stroke="#B5532C" stroke-width="2"/>
  <polygon points="555,166 551,152 563,155" fill="#B5532C"/>
  <!-- user asks legit task -->
  <line x1="415" y1="116" x2="440" y2="300" stroke="#2D5A5C" stroke-width="2"/>
  <polygon points="441,300 431,296 442,290" fill="#2D5A5C"/>
  <!-- injected content flows into model -->
  <line x1="540" y1="214" x2="512" y2="300" stroke="#B5532C" stroke-width="2"/>
  <polygon points="510,300 512,286 520,296" fill="#B5532C"/>
  <text x="480" y="378" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">l'attaccante non parla mai col modello:</text>
  <text x="480" y="393" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">lascia l'ordine nei dati</text>
</svg>
