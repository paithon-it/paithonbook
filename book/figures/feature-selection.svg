<svg viewBox="0 0 680 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema della feature selection: a sinistra un grafico a barre con il punteggio di otto feature e una soglia tratteggiata che ne promuove tre; una freccia porta a destra, dove il dataset filtrato conserva solo le tre colonne migliori">
  <rect x="0" y="0" width="680" height="340" fill="#F8F5EE"/>
  <text x="50" y="34" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A" font-weight="bold">1. misura ogni feature</text>
  <text x="452" y="34" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1A1A1A" font-weight="bold">2. tieni le migliori</text>
  <!-- barre dei punteggi -->
  <rect x="50" y="100" width="24" height="150" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="86" y="210" width="24" height="40" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="122" y="80" width="24" height="170" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="158" y="170" width="24" height="80" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="194" y="220" width="24" height="30" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="230" y="130" width="24" height="120" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="266" y="195" width="24" height="55" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="302" y="185" width="24" height="65" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- soglia -->
  <line x1="42" y1="145" x2="340" y2="145" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="66" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5E5852">soglia: le 3 con punteggio piu' alto</text>
  <!-- asse -->
  <line x1="42" y1="250" x2="340" y2="250" stroke="#1A1A1A" stroke-width="2"/>
  <text x="62" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x1</text>
  <text x="98" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x2</text>
  <text x="134" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x3</text>
  <text x="170" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x4</text>
  <text x="206" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x5</text>
  <text x="242" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x6</text>
  <text x="278" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x7</text>
  <text x="314" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x8</text>
  <!-- freccia -->
  <line x1="362" y1="160" x2="420" y2="160" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="420,153 434,160 420,167" fill="#1A1A1A"/>
  <!-- dataset filtrato -->
  <rect x="452" y="90" width="44" height="150" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="510" y="90" width="44" height="150" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="568" y="90" width="44" height="150" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="474" y="262" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x1</text>
  <text x="532" y="262" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x3</text>
  <text x="590" y="262" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="middle">x6</text>
  <text x="532" y="296" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5E5852" text-anchor="middle">dataset filtrato: 3 colonne</text>
  <text x="191" y="296" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5E5852" text-anchor="middle">punteggio (F o mutua informazione)</text>
</svg>
