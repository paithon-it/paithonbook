<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paithon Book, figura animata: dopo dieci secondi di guasto, chi ritenta non si riprende più
  Generata da animazioni/svg/tempesta-che-resta.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350"
     role="img" aria-label="Un grafico che si scopre da sinistra a destra lungo centocinquanta secondi, con una fascia ocra fra il trentesimo e il quarantesimo, il guasto, e una linea tratteggiata nera a cento, la capacità. Prima del guasto una linea teal e una terracotta stanno sovrapposte a ottanta risposte utili al secondo. Durante il guasto scendono entrambe a zero. Dopo, la teal, senza ritentativi, resta a zero per una trentina di secondi e poi torna a ottanta; la terracotta, con tre ritentativi, resta a zero fino in fondo, mentre una linea terracotta tratteggiata, i tentativi che arrivano al modello, sale oltre i trecento al secondo e non scende più, più del triplo della capacità.">
  <style>
    svg  { --d: 9.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .asse    { stroke:#C5BEAA; stroke-width:1.2; }
    .guasto  { fill:#C9A961; opacity:.3; }
    .cap     { stroke:#1A1A1A; stroke-width:1.4; stroke-dasharray:6 5; }
    .offerti { fill:none; stroke:#B5532C; stroke-width:2; stroke-dasharray:5 4; }
    .senza   { fill:none; stroke:#2D5A5C; stroke-width:2.6; }
    .con     { fill:none; stroke:#B5532C; stroke-width:2.6; }
    .lbc     { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#1A1A1A; }
    .lbt     { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#B5532C; }
    .lbr     { font-family:Inter, system-ui, sans-serif; font-size:13px; font-weight:700; fill:#B5532C; }
    .lbn     { font-family:Inter, system-ui, sans-serif; font-size:13px; font-weight:700; fill:#2D5A5C; }
    #scorre-r { transform-box:fill-box; transform-origin:0% 50%; }
        @keyframes tentativi{0.00%{opacity:0}34.17%{opacity:0}34.67%{opacity:1}100.00%{opacity:1}}
    @keyframes riprende{0.00%{opacity:0}53.37%{opacity:0}53.87%{opacity:1}100.00%{opacity:1}}
    @keyframes resta{0.00%{opacity:0}60.83%{opacity:0}61.33%{opacity:1}100.00%{opacity:1}}
    @keyframes scorre{0.00%{transform:scaleX(0)}8.00%{transform:scaleX(0)}88.00%{transform:scaleX(1)}100.00%{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce) { #scorre-r, .acceso { animation:none !important; } }
  </style>
