<svg viewBox="0 0 840 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tre grafici in scala logaritmica: la loss cala come retta discendente rispetto a compute, dati e parametri, con esponenti 0.050, 0.095 e 0.076">
  <defs>
    <marker id="ah151" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="300" fill="#F8F5EE"/>

  <!-- Panel A: compute -->
  <text x="160" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">COMPUTE</text>
  <line x1="70" y1="46" x2="70" y2="230" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah151)"/>
  <line x1="70" y1="230" x2="252" y2="230" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah151)"/>
  <line x1="88" y1="66" x2="244" y2="212" stroke="#B5532C" stroke-width="2.5"/>
  <text x="205" y="118" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C">L &#8733; C&#8315;&#8304;&#183;&#8304;&#8309;&#8304;</text>
  <text x="52" y="140" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852" transform="rotate(-90 52 140)">loss (log)</text>
  <text x="160" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">compute (log)</text>

  <!-- Panel B: dati -->
  <text x="440" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">DATI</text>
  <line x1="350" y1="46" x2="350" y2="230" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah151)"/>
  <line x1="350" y1="230" x2="532" y2="230" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah151)"/>
  <line x1="368" y1="66" x2="524" y2="212" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="485" y="118" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2D5A5C">L &#8733; D&#8315;&#8304;&#183;&#8304;&#8313;&#8309;</text>
  <text x="440" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">dati (log)</text>

  <!-- Panel C: parametri -->
  <text x="720" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">PARAMETRI</text>
  <line x1="630" y1="46" x2="630" y2="230" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah151)"/>
  <line x1="630" y1="230" x2="812" y2="230" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah151)"/>
  <line x1="648" y1="66" x2="804" y2="212" stroke="#C9A961" stroke-width="3"/>
  <text x="762" y="118" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">L &#8733; N&#8315;&#8304;&#183;&#8304;&#8311;&#8310;</text>
  <text x="720" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">parametri (log)</text>

  <text x="420" y="284" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">una retta su scala log-log = una legge di potenza</text>
</svg>
