  <text x="238" y="356" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5A524A">tutte con tutte: con i dati veri davanti,</text>
  <text x="238" y="374" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5A524A">ogni taccuino aspetta i vicini</text>
