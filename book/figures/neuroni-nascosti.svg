<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 396" role="img" aria-label="Due schemi affiancati, con le stesse otto caselle: tre in alto in teal, i taccuini interni, cioè i neuroni nascosti, e cinque in basso in terracotta, le caselle dei dati. A sinistra, «macchina di Boltzmann», sono collegate tutte con tutte: i tredici legami dentro un gruppo, in ocra, si aggiungono ai quindici che uniscono i due gruppi. A destra, «macchina di Boltzmann ristretta», i legami in ocra non ci sono più e restano soltanto i quindici fra un gruppo e l'altro, cioè uno schema a due file in cui nessun taccuino tocca un altro taccuino.">
