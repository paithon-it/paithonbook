<svg viewBox="0 0 680 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un blocco residuale: l'ingresso x attraversa due strati che calcolano F di x, mentre una scorciatoia porta x direttamente a un nodo di somma; l'uscita è F di x più x">
  <rect x="0" y="0" width="680" height="340" fill="#F8F5EE"/>
  <text x="340" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Il blocco residuale</text>

  <!-- ingresso x -->
  <text x="120" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1A1A1A">x</text>
  <circle cx="120" cy="130" r="5" fill="#1A1A1A"/>
  <!-- ramo principale verso il basso -->
  <line x1="120" y1="135" x2="120" y2="165" stroke="#1A1A1A" stroke-width="2"/>
  <polygon points="120,165 114,153 126,153" fill="#1A1A1A"/>

  <!-- due strati (ramo principale) -->
  <rect x="60" y="168" width="120" height="42" rx="4" fill="#2D5A5C"/>
  <text x="120" y="194" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F8F5EE">strato + ReLU</text>
  <line x1="120" y1="210" x2="120" y2="228" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="60" y="230" width="120" height="42" rx="4" fill="#2D5A5C"/>
  <text x="120" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#F8F5EE">strato</text>
  <text x="200" y="224" font-family="sans-serif" font-size="14" fill="#2D5A5C" font-weight="bold">F(x)</text>

  <!-- verso il nodo somma -->
  <line x1="120" y1="272" x2="120" y2="292" stroke="#1A1A1A" stroke-width="2"/>

  <!-- scorciatoia identità (arco terracotta) -->
  <path d="M 120 130 C 300 130, 300 300, 133 300" fill="none" stroke="#B5532C" stroke-width="2.5"/>
  <polygon points="133,300 147,294 147,306" fill="#B5532C"/>
  <text x="300" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#B5532C" font-weight="bold">identità: x</text>
  <text x="300" y="233" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#5E5852">(la scorciatoia)</text>

  <!-- nodo somma -->
  <circle cx="120" cy="300" r="14" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="120" y="306" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1A1A1A">+</text>

  <!-- uscita -->
  <text x="230" y="306" font-family="sans-serif" font-size="14" fill="#1A1A1A">uscita = F(x) + x</text>

  <!-- nota a destra -->
  <line x1="440" y1="120" x2="440" y2="300" stroke="#C9C2B4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="560" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Se F(x) = 0</text>
  <text x="560" y="176" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#5E5852">il blocco lascia passare</text>
  <text x="560" y="194" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#5E5852">l'input intatto:</text>
  <text x="560" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#B5532C" font-weight="bold">uscita = x</text>
  <text x="560" y="252" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#5E5852">azzerare i pesi &#232; facile,</text>
  <text x="560" y="270" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#5E5852">copiare l'input no.</text>
</svg>
