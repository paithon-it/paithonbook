<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confronto tra modello base e modello instruction-tuned sullo stesso prompt">
  <rect x="0" y="0" width="760" height="420" fill="#F8F5EE"/>
  <rect x="230" y="20" width="300" height="58" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="380" y="44" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Prompt (identico)</text>
  <text x="380" y="64" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">«Scrivi una ricetta della carbonara»</text>
  <line x1="310" y1="78" x2="190" y2="130" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="450" y1="78" x2="570" y2="130" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="40" y="130" width="300" height="48" rx="8" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="190" y="150" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Modello base</text>
  <text x="190" y="168" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">solo pre-training</text>
  <rect x="420" y="130" width="300" height="48" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="570" y="150" font-family="sans-serif" font-size="13" fill="#F8F5EE" text-anchor="middle" font-weight="bold">Modello instruction-tuned</text>
  <text x="570" y="168" font-family="sans-serif" font-size="12" fill="#F8F5EE" text-anchor="middle">pre-training + SFT su istruzioni</text>
  <line x1="190" y1="178" x2="190" y2="210" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="570" y1="178" x2="570" y2="210" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="40" y="210" width="300" height="150" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="60" y="236" font-family="sans-serif" font-size="12" fill="#1A1A1A">«Scrivi una ricetta dell'amatriciana.</text>
  <text x="60" y="256" font-family="sans-serif" font-size="12" fill="#1A1A1A">Scrivi una ricetta della gricia.</text>
  <text x="60" y="276" font-family="sans-serif" font-size="12" fill="#1A1A1A">Scrivi una ricetta della cacio e pepe.</text>
  <text x="60" y="296" font-family="sans-serif" font-size="12" fill="#1A1A1A">Esercizio 4: descrivi il pesto…»</text>
  <text x="60" y="336" font-family="sans-serif" font-size="12" fill="#B5532C" font-weight="bold">Continua il pattern del testo</text>
  <rect x="420" y="210" width="300" height="150" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="440" y="236" font-family="sans-serif" font-size="12" fill="#1A1A1A">«Ingredienti per 4 persone:</text>
  <text x="440" y="256" font-family="sans-serif" font-size="12" fill="#1A1A1A">320 g di spaghetti, 150 g di guanciale,</text>
  <text x="440" y="276" font-family="sans-serif" font-size="12" fill="#1A1A1A">4 tuorli, pecorino romano, pepe.</text>
  <text x="440" y="296" font-family="sans-serif" font-size="12" fill="#1A1A1A">1. Rosolare il guanciale…»</text>
  <text x="440" y="336" font-family="sans-serif" font-size="12" fill="#2D5A5C" font-weight="bold">Esegue l'istruzione</text>
  <text x="380" y="400" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">Stessa conoscenza, comportamento diverso: cambia il formato appreso, non i fatti.</text>
</svg>
