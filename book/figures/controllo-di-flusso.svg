<svg viewBox="0 0 720 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flowchart di un loop: inizio, condizione, corpo del ciclo, aggiornamento, uscita">
  <rect x="0" y="0" width="720" height="420" fill="#F8F5EE"/>
  <!-- inizio -->
  <rect x="290" y="20" width="140" height="44" rx="22" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="47" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#F8F5EE">inizio</text>
  <line x1="360" y1="64" x2="360" y2="108" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="360,116 354,104 366,104" fill="#1A1A1A"/>
  <!-- condizione (rombo) -->
  <polygon points="360,120 480,180 360,240 240,180" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="360" y="175" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1A1A1A">condizione</text>
  <text x="360" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1A1A1A">vera?</text>
  <!-- ramo sì -->
  <line x1="360" y1="240" x2="360" y2="284" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="360,292 354,280 366,280" fill="#1A1A1A"/>
  <text x="378" y="268" font-family="sans-serif" font-size="14" fill="#2D5A5C">sì</text>
  <!-- corpo -->
  <rect x="270" y="296" width="180" height="48" rx="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="325" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#F8F5EE">corpo del ciclo</text>
  <!-- aggiornamento e ritorno -->
  <line x1="270" y1="320" x2="130" y2="320" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="40" y="296" width="130" height="48" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="105" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">aggiorna</text>
  <text x="105" y="334" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1A1A1A">lo stato</text>
  <line x1="105" y1="296" x2="105" y2="180" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="105" y1="180" x2="232" y2="180" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="240,180 228,174 228,186" fill="#1A1A1A"/>
  <!-- ramo no -->
  <line x1="480" y1="180" x2="560" y2="180" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="568,180 556,174 556,186" fill="#1A1A1A"/>
  <text x="512" y="168" font-family="sans-serif" font-size="14" fill="#B5532C">no</text>
  <rect x="572" y="158" width="120" height="44" rx="22" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="632" y="185" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#F8F5EE">uscita</text>
</svg>
