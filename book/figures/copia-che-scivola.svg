<!--
  Paithon Book, figura animata: la copia che scivola, e il correlogramma
  Generata da animazioni/svg/copia-che-scivola.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 438"
     role="img" aria-label="In alto una serie temporale ondulata e una sua copia di un altro colore, che scivola verso destra un passo alla volta: quando lo scorrimento è di sei passi le due onde sono capovolte, cresta contro avvallamento, e quando è di dodici tornano a sovrapporsi. In basso un correlogramma si riempie di pari passo, una barra per ogni scorrimento: parte da uno, scende fino a un minimo profondamente negativo a sei, risale a un massimo a dodici e ripete l'onda più smorzata fino a ventiquattro. Una fascia grigia chiara attorno allo zero segna i valori che non si distinguono dal caso.">
