<svg viewBox="0 0 720 430" width="100%" role="img" aria-label="Tabella decisionale dei contenitori Python: per lista, tupla, dizionario e set sono indicate le proprietà ordinato, modificabile, duplicati ammessi e tipo di accesso, con la domanda guida per ciascuno" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="430" fill="#F8F5EE"/>
  <text x="360" y="36" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Quale contenitore? La tabella decisionale</text>

  <!-- intestazioni colonne -->
  <g font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">
    <text x="240" y="78">ordinato?</text>
    <text x="352" y="78">modificabile?</text>
    <text x="464" y="78">duplicati?</text>
    <text x="590" y="78">domanda guida</text>
  </g>
  <line x1="40" y1="90" x2="680" y2="90" stroke="#1A1A1A" stroke-width="2"/>

  <!-- griglia orizzontale -->
  <g stroke="#C9C2B4" stroke-width="1.5">
    <line x1="40" y1="170" x2="680" y2="170"/>
    <line x1="40" y1="250" x2="680" y2="250"/>
    <line x1="40" y1="330" x2="680" y2="330"/>
  </g>
  <line x1="40" y1="410" x2="680" y2="410" stroke="#1A1A1A" stroke-width="2"/>

  <!-- riga LIST -->
  <rect x="52" y="112" width="120" height="36" fill="#B5532C"/>
  <text x="112" y="136" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">list  [ ]</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="240" y="136" fill="#2D5A5C" font-weight="bold">si</text>
    <text x="352" y="136" fill="#2D5A5C" font-weight="bold">si</text>
    <text x="464" y="136" fill="#2D5A5C" font-weight="bold">si</text>
  </g>
  <text x="590" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">sequenza che cresce</text>
  <text x="590" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">e cambia?</text>

  <!-- riga TUPLE -->
  <rect x="52" y="192" width="120" height="36" fill="#2D5A5C"/>
  <text x="112" y="216" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">tuple  ( )</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="240" y="216" fill="#2D5A5C" font-weight="bold">si</text>
    <text x="352" y="216" fill="#B5532C" font-weight="bold">no</text>
    <text x="464" y="216" fill="#2D5A5C" font-weight="bold">si</text>
  </g>
  <text x="590" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">valori che viaggiano</text>
  <text x="590" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">insieme, sigillati?</text>

  <!-- riga DICT -->
  <rect x="52" y="272" width="120" height="36" fill="#C9A961"/>
  <text x="112" y="296" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">dict  {k: v}</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="240" y="296" fill="#2D5A5C" font-weight="bold">si*</text>
    <text x="352" y="296" fill="#2D5A5C" font-weight="bold">si</text>
    <text x="464" y="290" fill="#B5532C" font-weight="bold">no</text>
  </g>
  <text x="464" y="308" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1A1A1A">(chiavi uniche)</text>
  <text x="590" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">cerchi per nome,</text>
  <text x="590" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">non per posizione?</text>

  <!-- riga SET -->
  <rect x="52" y="352" width="120" height="36" fill="#1A1A1A"/>
  <text x="112" y="376" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">set  { }</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="240" y="376" fill="#B5532C" font-weight="bold">no</text>
    <text x="352" y="376" fill="#2D5A5C" font-weight="bold">si</text>
    <text x="464" y="376" fill="#B5532C" font-weight="bold">no</text>
  </g>
  <text x="590" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">contano solo</text>
  <text x="590" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">le presenze uniche?</text>

  <!-- nota -->
  <text x="52" y="425" font-family="sans-serif" font-size="11" fill="#1A1A1A">* da Python 3.7 il dict conserva l'ordine di inserimento delle chiavi</text>
</svg>
