<svg viewBox="0 0 800 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grafico a barre orizzontali: costo per mille operazioni per quattro casi d'uso, da 0,55 a 225 dollari">
  <rect x="0" y="0" width="800" height="400" fill="#F8F5EE"/>
  <text x="400" y="42" font-family="sans-serif" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Costo per 1.000 operazioni ($)</text>
  <text x="200" y="98" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="end">Classificazione (mod. economico)</text>
  <rect x="215" y="82" width="48" height="24" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="273" y="99" font-family="sans-serif" font-size="14" fill="#1A1A1A">0,55 $</text>
  <text x="200" y="168" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="end">Query RAG (mod. intermedio)</text>
  <rect x="215" y="152" width="325" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="550" y="169" font-family="sans-serif" font-size="14" fill="#1A1A1A">26 $</text>
  <text x="200" y="238" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="end">Chatbot 6-8 turni (mod. intermedio)</text>
  <rect x="215" y="222" width="385" height="24" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="610" y="239" font-family="sans-serif" font-size="14" fill="#1A1A1A">60 $</text>
  <text x="200" y="308" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="end">Report long-form (mod. di punta)</text>
  <rect x="215" y="292" width="480" height="24" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="705" y="309" font-family="sans-serif" font-size="14" fill="#1A1A1A">225 $</text>
  <line x1="215" y1="340" x2="215" y2="70" stroke="#1A1A1A" stroke-width="2"/>
  <text x="400" y="372" font-family="sans-serif" font-size="13" fill="#1A1A1A" text-anchor="middle">larghezza barre in scala logaritmica: tra il primo e l'ultimo caso c'è un fattore ~400</text>
</svg>
