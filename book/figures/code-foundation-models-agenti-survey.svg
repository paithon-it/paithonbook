<svg viewBox="0 0 760 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Il ciclo di vita in cinque tappe di un modello che scrive codice: dai dati grezzi al pre-training, al fine-tuning supervisionato, al reinforcement learning, fino all'agente autonomo; l'autonomia cresce da sinistra a destra">
  <rect x="0" y="0" width="760" height="320" fill="#F8F5EE"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">Il ciclo di vita di un modello che scrive codice</text>

  <!-- box 1 Dati -->
  <rect x="12" y="118" width="128" height="94" rx="7" fill="#B5532C"/>
  <text x="76" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">Dati</text>
  <text x="76" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">codice grezzo</text>
  <text x="76" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">da GitHub</text>

  <!-- box 2 Pre-training -->
  <rect x="164" y="118" width="128" height="94" rx="7" fill="#2D5A5C"/>
  <text x="228" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">Pre-training</text>
  <text x="228" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">legge miliardi</text>
  <text x="228" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">di righe</text>

  <!-- box 3 SFT -->
  <rect x="316" y="118" width="128" height="94" rx="7" fill="#C9A961"/>
  <text x="380" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">SFT</text>
  <text x="380" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">pratica</text>
  <text x="380" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">guidata</text>

  <!-- box 4 RL -->
  <rect x="468" y="118" width="128" height="94" rx="7" fill="#B5532C"/>
  <text x="532" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">RL</text>
  <text x="532" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">prova, esegui,</text>
  <text x="532" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">un giudice valuta</text>

  <!-- box 5 Agente -->
  <rect x="620" y="118" width="128" height="94" rx="7" fill="#1A1A1A"/>
  <text x="684" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">Agente</text>
  <text x="684" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">usa strumenti,</text>
  <text x="684" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">apre il repo</text>

  <!-- arrows between boxes -->
  <g stroke="#1A1A1A" stroke-width="2" fill="#1A1A1A">
    <line x1="142" y1="165" x2="160" y2="165"/>
    <path d="M164 165 L 154 160 L 154 170 Z"/>
    <line x1="294" y1="165" x2="312" y2="165"/>
    <path d="M316 165 L 306 160 L 306 170 Z"/>
    <line x1="446" y1="165" x2="464" y2="165"/>
    <path d="M468 165 L 458 160 L 458 170 Z"/>
    <line x1="598" y1="165" x2="616" y2="165"/>
    <path d="M620 165 L 610 160 L 610 170 Z"/>
  </g>

  <!-- autonomy axis -->
  <line x1="76" y1="250" x2="670" y2="250" stroke="#2D5A5C" stroke-width="2"/>
  <path d="M684 250 L 672 245 L 672 255 Z" fill="#2D5A5C"/>
  <text x="76" y="272" text-anchor="start" font-family="sans-serif" font-size="12" fill="#2D5A5C">meno autonomia</text>
  <text x="672" y="272" text-anchor="end" font-family="sans-serif" font-size="12" fill="#2D5A5C">più autonomia</text>

  <text x="380" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">Ogni fase costruisce sulla precedente: il pre-training dà le basi, l'allineamento le raffina, l'agente le mette al lavoro.</text>
</svg>
