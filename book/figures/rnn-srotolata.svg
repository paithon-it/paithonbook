<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Inter', -apple-system, Segoe UI, sans-serif" role="img" aria-label="Una RNN srotolata nel tempo: la stessa cella ripetuta ai passi t-1, t e t+1, con lo stato nascosto passato in avanti; a ogni passo un input in ingresso e una predizione in uscita.">
  <defs>
    <marker id="ah-terra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5532C"/>
    </marker>
    <marker id="ah-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2D5A5C"/>
    </marker>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B847C"/>
    </marker>
  </defs>

  <!-- asse del tempo -->
  <line x1="96" y1="374" x2="648" y2="374" stroke="#8B847C" stroke-width="1.5" marker-end="url(#ah-muted)"/>
  <text x="672" y="378" font-size="13" font-style="italic" fill="#8B847C">tempo</text>

  <!-- ===== STATO NASCOSTO (arancione, orizzontale) ===== -->
  <!-- ingresso tratteggiato -->
  <line x1="66" y1="188" x2="148" y2="188" stroke="#B5532C" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah-terra)"/>
  <!-- box1 -> box2 -->
  <line x1="230" y1="188" x2="348" y2="188" stroke="#B5532C" stroke-width="3" marker-end="url(#ah-terra)"/>
  <text x="289" y="179" font-size="15" text-anchor="middle" fill="#B5532C" font-weight="700">h<tspan font-size="11" dy="5">t-1</tspan></text>
  <!-- box2 -> box3 -->
  <line x1="430" y1="188" x2="548" y2="188" stroke="#B5532C" stroke-width="3" marker-end="url(#ah-terra)"/>
  <text x="489" y="179" font-size="15" text-anchor="middle" fill="#B5532C" font-weight="700">h<tspan font-size="11" dy="5">t</tspan></text>
  <!-- uscita tratteggiata -->
  <line x1="630" y1="188" x2="706" y2="188" stroke="#B5532C" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah-terra)"/>
  <text x="668" y="179" font-size="15" text-anchor="middle" fill="#B5532C" font-weight="700">h<tspan font-size="11" dy="5">t+1</tspan></text>

  <!-- ===== COLONNA t-1 (centro x=190) ===== -->
  <!-- input -->
  <circle cx="190" cy="320" r="9" fill="#C9A961"/>
  <line x1="190" y1="311" x2="190" y2="228" stroke="#1A1A1A" stroke-width="2" marker-end="url(#ah-dark)"/>
  <text x="190" y="347" font-size="15" text-anchor="middle" fill="#1A1A1A">x<tspan font-size="11" dy="5">t-1</tspan></text>
  <!-- output -->
  <line x1="190" y1="150" x2="190" y2="95" stroke="#2D5A5C" stroke-width="2" marker-end="url(#ah-teal)"/>
  <circle cx="190" cy="85" r="9" fill="#2D5A5C"/>
  <text x="190" y="64" font-size="15" text-anchor="middle" fill="#2D5A5C">&#375;<tspan font-size="11" dy="5">t-1</tspan></text>
  <!-- cella -->
  <rect x="150" y="150" width="80" height="76" rx="9" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="190" y="193" font-size="15" text-anchor="middle" fill="#2D5A5C" font-weight="700">RNN</text>

  <!-- ===== COLONNA t (centro x=390) ===== -->
  <circle cx="390" cy="320" r="9" fill="#C9A961"/>
  <line x1="390" y1="311" x2="390" y2="228" stroke="#1A1A1A" stroke-width="2" marker-end="url(#ah-dark)"/>
  <text x="390" y="347" font-size="15" text-anchor="middle" fill="#1A1A1A">x<tspan font-size="11" dy="5">t</tspan></text>
  <line x1="390" y1="150" x2="390" y2="95" stroke="#2D5A5C" stroke-width="2" marker-end="url(#ah-teal)"/>
  <circle cx="390" cy="85" r="9" fill="#2D5A5C"/>
  <text x="390" y="64" font-size="15" text-anchor="middle" fill="#2D5A5C">&#375;<tspan font-size="11" dy="5">t</tspan></text>
  <rect x="350" y="150" width="80" height="76" rx="9" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="390" y="193" font-size="15" text-anchor="middle" fill="#2D5A5C" font-weight="700">RNN</text>

  <!-- ===== COLONNA t+1 (centro x=590) ===== -->
  <circle cx="590" cy="320" r="9" fill="#C9A961"/>
  <line x1="590" y1="311" x2="590" y2="228" stroke="#1A1A1A" stroke-width="2" marker-end="url(#ah-dark)"/>
  <text x="590" y="347" font-size="15" text-anchor="middle" fill="#1A1A1A">x<tspan font-size="11" dy="5">t+1</tspan></text>
  <line x1="590" y1="150" x2="590" y2="95" stroke="#2D5A5C" stroke-width="2" marker-end="url(#ah-teal)"/>
  <circle cx="590" cy="85" r="9" fill="#2D5A5C"/>
  <text x="590" y="64" font-size="15" text-anchor="middle" fill="#2D5A5C">&#375;<tspan font-size="11" dy="5">t+1</tspan></text>
  <rect x="550" y="150" width="80" height="76" rx="9" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="590" y="193" font-size="15" text-anchor="middle" fill="#2D5A5C" font-weight="700">RNN</text>

  <!-- legenda -->
  <line x1="96" y1="36" x2="126" y2="36" stroke="#B5532C" stroke-width="3"/>
  <text x="133" y="41" font-size="13" fill="#5E5852">stato nascosto h (memoria)</text>
  <line x1="356" y1="36" x2="386" y2="36" stroke="#1A1A1A" stroke-width="2"/>
  <text x="393" y="41" font-size="13" fill="#5E5852">input x</text>
  <line x1="486" y1="36" x2="516" y2="36" stroke="#2D5A5C" stroke-width="2"/>
  <text x="523" y="41" font-size="13" fill="#5E5852">predizione &#375;</text>
</svg>