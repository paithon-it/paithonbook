<svg viewBox="0 0 720 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema orchestratore e worker: un agente orchestratore in alto delega tre agenti worker che usano strumenti diversi; i risultati risalgono e vengono uniti in una risposta unica">
  <rect x="0" y="0" width="720" height="400" fill="#F8F5EE"/>
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Orchestratore e worker</text>
  <rect x="270" y="52" width="180" height="58" rx="10" fill="#B5532C"/>
  <text x="360" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">Orchestratore</text>
  <text x="360" y="97" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8F5EE">divide e sintetizza</text>
  <line x1="325" y1="110" x2="150" y2="172" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="360" y1="110" x2="360" y2="172" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="395" y1="110" x2="570" y2="172" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="232" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5E5852">delega</text>
  <rect x="70" y="175" width="160" height="62" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="150" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2D5A5C">Worker A</text>
  <text x="150" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">ricerca sul web</text>
  <rect x="280" y="175" width="160" height="62" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="360" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2D5A5C">Worker B</text>
  <text x="360" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">query al database</text>
  <rect x="490" y="175" width="160" height="62" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="570" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2D5A5C">Worker C</text>
  <text x="570" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1A1A1A">lettura documenti</text>
  <line x1="150" y1="237" x2="330" y2="318" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="360" y1="237" x2="360" y2="318" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="570" y1="237" x2="390" y2="318" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="470" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5E5852">risultati</text>
  <rect x="250" y="320" width="220" height="54" rx="10" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="360" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Risposta unica</text>
</svg>
