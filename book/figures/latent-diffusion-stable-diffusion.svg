<svg viewBox="0 0 440 220" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema della diffusione nello spazio latente: un'immagine viene compressa da un encoder in una piccola griglia latente, la diffusione avviene lì, poi un decoder ricostruisce l'immagine">
  <defs>
    <marker id="ah1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A1A1A"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="220" fill="#F8F5EE"/>
  <!-- immagine in ingresso -->
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="24" y="100" width="75" height="75" fill="#F8F5EE"/>
    <rect x="24" y="100" width="25" height="25" fill="#2D5A5C"/>
    <rect x="74" y="100" width="25" height="25" fill="#B5532C"/>
    <rect x="24" y="150" width="25" height="25" fill="#C9A961"/>
    <line x1="49" y1="100" x2="49" y2="175"/>
    <line x1="74" y1="100" x2="74" y2="175"/>
    <line x1="24" y1="125" x2="99" y2="125"/>
    <line x1="24" y1="150" x2="99" y2="150"/>
  </g>
  <text x="61" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">immagine</text>
  <line x1="100" y1="137" x2="109" y2="137" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#ah1)"/>
  <!-- encoder -->
  <polygon points="110,100 150,124 150,156 110,180" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.8"/>
  <text x="130" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">encoder</text>
  <line x1="152" y1="140" x2="165" y2="140" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#ah1)"/>
  <!-- spazio latente -->
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="168" y="112" width="56" height="56" fill="#F8F5EE"/>
    <rect x="182" y="126" width="14" height="14" fill="#2D5A5C"/>
    <rect x="196" y="140" width="14" height="14" fill="#B5532C"/>
    <line x1="182" y1="112" x2="182" y2="168"/>
    <line x1="196" y1="112" x2="196" y2="168"/>
    <line x1="210" y1="112" x2="210" y2="168"/>
    <line x1="168" y1="126" x2="224" y2="126"/>
    <line x1="168" y1="140" x2="224" y2="140"/>
    <line x1="168" y1="154" x2="224" y2="154"/>
  </g>
  <path d="M172,110 C 178,86 214,86 220,108" fill="none" stroke="#B5532C" stroke-width="1.8" marker-end="url(#ah1)"/>
  <text x="196" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B5532C">rumore &#8594; denoise</text>
  <text x="196" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">latente</text>
  <line x1="226" y1="140" x2="239" y2="140" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#ah1)"/>
  <!-- decoder -->
  <polygon points="242,124 282,100 282,180 242,156" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.8"/>
  <text x="262" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5E5852">decoder</text>
  <line x1="284" y1="140" x2="297" y2="140" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#ah1)"/>
  <!-- immagine in uscita -->
  <g stroke="#1A1A1A" stroke-width="1.5">
    <rect x="300" y="100" width="75" height="75" fill="#F8F5EE"/>
    <rect x="300" y="100" width="25" height="25" fill="#2D5A5C"/>
    <rect x="350" y="100" width="25" height="25" fill="#B5532C"/>
    <rect x="300" y="150" width="25" height="25" fill="#C9A961"/>
    <line x1="325" y1="100" x2="325" y2="175"/>
    <line x1="350" y1="100" x2="350" y2="175"/>
    <line x1="300" y1="125" x2="375" y2="125"/>
    <line x1="300" y1="150" x2="375" y2="150"/>
  </g>
  <text x="337" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1A1A1A">immagine</text>
</svg>
