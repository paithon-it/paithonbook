<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-label="Pipeline RAG: la domanda va al retriever, che consulta l'archivio di documenti indicizzato e restituisce i passaggi più simili; domanda e passaggi compongono il prompt aumentato, il modello di linguaggio genera la risposta citando le fonti.">
  <defs>
    <marker id="freccia-rag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- domanda -->
  <text x="107" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">domanda</text>
  <rect x="20" y="56" width="174" height="66" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="107" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1A1A1A">&#171;Su cosa salta</text>
  <text x="107" y="103" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1A1A1A">il gatto nero?&#187;</text>

  <!-- domanda -> retriever -->
  <line x1="198" y1="89" x2="248" y2="89" stroke="#1A1A1A" stroke-width="2" marker-end="url(#freccia-rag)"/>

  <!-- retriever -->
  <rect x="255" y="56" width="140" height="66" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2.5"/>
  <text x="325" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">retriever</text>

  <!-- retriever <-> archivio -->
  <line x1="317" y1="128" x2="317" y2="168" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#freccia-rag)"/>
  <line x1="333" y1="168" x2="333" y2="128" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#freccia-rag)"/>

  <!-- archivio di documenti (pila di schede) -->
  <rect x="287" y="176" width="112" height="62" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="279" y="184" width="112" height="62" rx="8" fill="#2D5A5C" fill-opacity="0.12" stroke="#2D5A5C" stroke-width="2"/>
  <rect x="271" y="192" width="112" height="62" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <line x1="283" y1="210" x2="371" y2="210" stroke="#2D5A5C" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="283" y1="222" x2="371" y2="222" stroke="#2D5A5C" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="283" y1="234" x2="351" y2="234" stroke="#2D5A5C" stroke-width="1.5" stroke-opacity="0.55"/>
  <text x="335" y="276" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#2D5A5C">archivio di documenti</text>
  <text x="335" y="292" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">(spezzato in passaggi e indicizzato)</text>

  <!-- retriever -> passaggi -->
  <line x1="399" y1="89" x2="445" y2="89" stroke="#1A1A1A" stroke-width="2" marker-end="url(#freccia-rag)"/>

  <!-- passaggi recuperati -->
  <text x="550" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">passaggi recuperati (top-k)</text>
  <rect x="452" y="50" width="196" height="32" rx="8" fill="#C9A961" fill-opacity="0.15" stroke="#C9A961" stroke-width="2"/>
  <text x="462" y="70" font-family="Inter, sans-serif" font-size="10.5" fill="#1A1A1A">[1] &#171;&#8230;salta sul muro&#8230;&#187; &#8212; 0,99</text>
  <rect x="452" y="90" width="196" height="32" rx="8" fill="#C9A961" fill-opacity="0.15" stroke="#C9A961" stroke-width="2"/>
  <text x="462" y="110" font-family="Inter, sans-serif" font-size="10.5" fill="#1A1A1A">[2] &#171;Il gatto dorme&#8230;&#187; &#8212; 0,78</text>

  <!-- passaggi -> prompt (gomito) -->
  <path d="M 550 126 V 300 H 232 V 314" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#freccia-rag)"/>
  <!-- domanda -> prompt (diagonale) -->
  <line x1="107" y1="126" x2="70" y2="316" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#freccia-rag)"/>

  <!-- prompt aumentato -->
  <text x="150" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">prompt aumentato</text>
  <rect x="40" y="322" width="220" height="104" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="54" y="334" width="192" height="22" rx="6" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="150" y="349" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#1A1A1A">domanda</text>
  <rect x="54" y="362" width="192" height="22" rx="6" fill="#C9A961" fill-opacity="0.15" stroke="#C9A961" stroke-width="1.5"/>
  <text x="150" y="377" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#1A1A1A">[1] passaggio recuperato</text>
  <rect x="54" y="390" width="192" height="22" rx="6" fill="#C9A961" fill-opacity="0.15" stroke="#C9A961" stroke-width="1.5"/>
  <text x="150" y="405" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#1A1A1A">[2] passaggio recuperato</text>

  <!-- prompt -> LLM -->
  <line x1="264" y1="374" x2="326" y2="374" stroke="#1A1A1A" stroke-width="2" marker-end="url(#freccia-rag)"/>

  <!-- LLM -->
  <rect x="330" y="338" width="140" height="72" rx="8" fill="#B5532C" fill-opacity="0.15" stroke="#B5532C" stroke-width="2.5"/>
  <text x="400" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">LLM</text>
  <text x="400" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">(generatore)</text>

  <!-- LLM -> risposta -->
  <line x1="474" y1="374" x2="536" y2="374" stroke="#1A1A1A" stroke-width="2" marker-end="url(#freccia-rag)"/>

  <!-- risposta con fonti -->
  <text x="690" y="318" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">risposta con fonti</text>
  <rect x="540" y="330" width="300" height="88" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="690" y="366" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#1A1A1A">&#171;Sul muro del giardino [1]&#187;</text>
  <text x="690" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5E5852">la fonte si pu&#242; controllare</text>

  <!-- didascalia interna -->
  <text x="430" y="450" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">recuperare prima di generare: la conoscenza sta nell'archivio, la lingua nel modello</text>
</svg>
