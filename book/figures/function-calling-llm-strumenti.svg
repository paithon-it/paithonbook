<svg viewBox="0 0 720 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema del loop di function calling: richiesta, tool, risposta">
  <rect x="0" y="0" width="720" height="320" fill="#F8F5EE"/>
  <rect x="30" y="130" width="130" height="60" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="95" y="156" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Utente</text>
  <text x="95" y="176" font-family="sans-serif" font-size="12" fill="#5E5852" text-anchor="middle">«che tempo fa?»</text>
  <line x1="160" y1="160" x2="240" y2="160" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="240,160 230,155 230,165" fill="#1A1A1A"/>
  <rect x="240" y="120" width="160" height="80" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="320" y="150" font-family="sans-serif" font-size="14" fill="#2D5A5C" text-anchor="middle" font-weight="bold">Modello</text>
  <text x="320" y="172" font-family="sans-serif" font-size="12" fill="#5E5852" text-anchor="middle">decide se e quale</text>
  <text x="320" y="188" font-family="sans-serif" font-size="12" fill="#5E5852" text-anchor="middle">strumento usare</text>
  <path d="M 400 140 C 470 100 540 100 560 130" fill="none" stroke="#B5532C" stroke-width="2"/>
  <polygon points="560,130 549,127 555,118" fill="#B5532C"/>
  <text x="480" y="90" font-family="sans-serif" font-size="12" fill="#B5532C" text-anchor="middle">1. tool_use: get_weather(«Bologna»)</text>
  <rect x="540" y="130" width="150" height="60" fill="#F8F5EE" stroke="#B5532C" stroke-width="2"/>
  <text x="615" y="156" font-family="sans-serif" font-size="14" fill="#B5532C" text-anchor="middle" font-weight="bold">Il tuo codice</text>
  <text x="615" y="176" font-family="sans-serif" font-size="12" fill="#5E5852" text-anchor="middle">esegue la funzione</text>
  <path d="M 560 190 C 540 230 470 230 400 190" fill="none" stroke="#C9A961" stroke-width="2"/>
  <polygon points="400,190 411,193 406,202" fill="#C9A961"/>
  <text x="480" y="240" font-family="sans-serif" font-size="12" fill="#8B847C" text-anchor="middle">2. tool_result: «18 °C, sereno»</text>
  <path d="M 300 200 C 280 250 180 250 130 200" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <polygon points="130,200 141,202 137,211" fill="#2D5A5C"/>
  <text x="215" y="270" font-family="sans-serif" font-size="12" fill="#2D5A5C" text-anchor="middle">3. risposta finale in linguaggio naturale</text>
  <text x="30" y="46" font-family="sans-serif" font-size="13" fill="#5E5852">Il modello non esegue mai nulla: chiede. L'esecuzione resta nel vostro codice,</text>
  <text x="30" y="64" font-family="sans-serif" font-size="13" fill="#5E5852">e il giro 1→2 può ripetersi più volte prima della risposta (3).</text>
</svg>
