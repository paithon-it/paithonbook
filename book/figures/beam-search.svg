<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-label="Albero di beam search con larghezza due su tre passi: al primo passo restano nel fascio A con 0,50 e The con 0,40; al secondo passo The black con 0,24 supera A black con 0,15; al terzo passo l'ipotesi migliore e' The black cat con 0,19. I rami scartati, in grigio tratteggiato, sono One, cat dopo A e wall dopo The.">
  <defs>
    <marker id="freccia-bs-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5532C"/>
    </marker>
    <marker id="freccia-bs-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E5852"/>
    </marker>
  </defs>

  <!-- intestazioni dei passi -->
  <text x="290" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" fill="#5E5852">passo 1</text>
  <text x="495" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" fill="#5E5852">passo 2</text>
  <text x="700" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" fill="#5E5852">passo 3</text>

  <!-- rami: percorso vincente -->
  <line x1="150" y1="190" x2="222" y2="190" stroke="#B5532C" stroke-width="3.5" marker-end="url(#freccia-bs-t)"/>
  <line x1="350" y1="190" x2="422" y2="208" stroke="#B5532C" stroke-width="3.5" marker-end="url(#freccia-bs-t)"/>
  <line x1="560" y1="210" x2="632" y2="210" stroke="#B5532C" stroke-width="3.5" marker-end="url(#freccia-bs-t)"/>

  <!-- rami: altra ipotesi nel fascio -->
  <line x1="150" y1="184" x2="222" y2="94" stroke="#B5532C" stroke-width="1.8" stroke-opacity="0.75" marker-end="url(#freccia-bs-t)"/>
  <line x1="350" y1="90" x2="422" y2="62" stroke="#B5532C" stroke-width="1.8" stroke-opacity="0.75" marker-end="url(#freccia-bs-t)"/>
  <line x1="560" y1="60" x2="632" y2="60" stroke="#B5532C" stroke-width="1.8" stroke-opacity="0.75" marker-end="url(#freccia-bs-t)"/>

  <!-- rami: ipotesi scartate -->
  <line x1="150" y1="196" x2="222" y2="286" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.7" marker-end="url(#freccia-bs-g)"/>
  <line x1="350" y1="96" x2="422" y2="128" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.7" marker-end="url(#freccia-bs-g)"/>
  <line x1="350" y1="196" x2="422" y2="278" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.7" marker-end="url(#freccia-bs-g)"/>

  <!-- radice -->
  <rect x="40" y="172" width="110" height="36" rx="8" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="95" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-style="italic" fill="#2D5A5C">inizio</text>

  <!-- passo 1 -->
  <rect x="230" y="72" width="120" height="36" rx="8" fill="#B5532C" fill-opacity="0.08" stroke="#B5532C" stroke-width="2"/>
  <text x="290" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#1A1A1A">A &#183; 0,50</text>
  <rect x="230" y="172" width="120" height="36" rx="8" fill="#B5532C" fill-opacity="0.08" stroke="#B5532C" stroke-width="2"/>
  <text x="290" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#1A1A1A">The &#183; 0,40</text>
  <rect x="230" y="272" width="120" height="36" rx="8" fill="none" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="290" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#5E5852">One &#183; 0,04</text>

  <!-- passo 2 -->
  <rect x="430" y="42" width="130" height="36" rx="8" fill="#B5532C" fill-opacity="0.08" stroke="#B5532C" stroke-width="2"/>
  <text x="495" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#1A1A1A">black &#183; 0,15</text>
  <rect x="430" y="112" width="130" height="36" rx="8" fill="none" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="495" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#5E5852">cat &#183; 0,05</text>
  <rect x="430" y="192" width="130" height="36" rx="8" fill="#B5532C" fill-opacity="0.08" stroke="#B5532C" stroke-width="2"/>
  <text x="495" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#1A1A1A">black &#183; 0,24</text>
  <rect x="430" y="262" width="130" height="36" rx="8" fill="none" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="495" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#5E5852">wall &#183; 0,02</text>

  <!-- passo 3 -->
  <rect x="640" y="42" width="120" height="36" rx="8" fill="#B5532C" fill-opacity="0.08" stroke="#B5532C" stroke-width="2"/>
  <text x="700" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#1A1A1A">cat &#183; 0,12</text>
  <rect x="640" y="192" width="120" height="36" rx="8" fill="#B5532C" fill-opacity="0.18" stroke="#B5532C" stroke-width="3"/>
  <text x="700" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A">cat &#183; 0,19</text>

  <!-- legenda -->
  <line x1="24" y1="348" x2="64" y2="348" stroke="#B5532C" stroke-width="3.5"/>
  <text x="72" y="352" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">ipotesi migliore finale</text>
  <line x1="250" y1="348" x2="290" y2="348" stroke="#B5532C" stroke-width="1.8" stroke-opacity="0.75"/>
  <text x="298" y="352" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">ipotesi nel fascio (k = 2)</text>
  <line x1="490" y1="348" x2="530" y2="348" stroke="#5E5852" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.7"/>
  <text x="538" y="352" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">ipotesi scartate</text>
  <text x="24" y="378" font-family="Inter, sans-serif" font-size="12" fill="#5E5852">I numeri sono le probabilit&#224; cumulate della sequenza generata.</text>
</svg>
