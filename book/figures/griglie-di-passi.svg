<!--
  Paithon Book, figura animata: la stessa integrazione su due griglie di passi
  Generata da animazioni/svg/griglie-di-passi.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256"
     role="img" aria-label="Due righe con 16 passi ciascuna sull'intervallo che va dal rumore (a sinistra) al dato pulito (a destra). Nella griglia uniforme in t i passi sono equidistanti; in quella uniforme in lambda si infittiscono verso il dato, e nell'ultimo decimo ne cadono 6 invece di 2. Accanto a ogni riga lo scarto dopo 32 valutazioni: sulla griglia in t vince DDIM, e sulla griglia in lambda Eulero migliora di quasi quattro volte, mentre DDIM peggiora.">
  <style>
    svg  { --d: 8.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .asse { stroke:#C5BEAA; stroke-width:2; }
    .passo { stroke:#2D5A5C; stroke-width:2; }
    .freccia { stroke:#5A524A; stroke-width:1.5; }
    .punta { fill:#5A524A; }
    
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
  </style>
