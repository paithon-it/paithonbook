<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paithon Book, figura animata: la finestra che si riempie, con tre strategie diverse
  Generata da animazioni/svg/harness-turni.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466"
     role="img" aria-label="Tre corsie, una per strategia, con i giri del compito in orizzontale e l'occupazione della finestra in verticale. Nella prima, senza strategie, la linea sale dritta fino al tetto della finestra e si interrompe dopo 32 giri, dopo aver letto 1.648.000 token. Nella seconda, con la compattazione all'ottanta per cento, la linea sale fino alla soglia, crolla al riassunto e risale, 2 volte, per 2.538.000 token letti in tutto, compresi quelli riletti per scrivere i riassunti. Nella terza, con la ripartenza a ogni funzionalità, la linea sale e torna in basso a ogni nuova sessione, 4 denti di sega che restano sotto la linea della metà della finestra, per 1.680.000 token letti.">
  <style>
    svg  { --d: 9.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .rit  { transform-box:view-box; transform-origin:90px 0px; }
    .tetto { stroke:#B5532C; stroke-width:1.4; stroke-dasharray:6 4; }
    .sogl { stroke:#C9A961; stroke-width:1.4; stroke-dasharray:3 4; }
    .meta { stroke:#2D5A5C; stroke-width:1.2; stroke-dasharray:2 5; }
    .nome { font-weight:700; }
    .lin-t { fill:none; stroke:#B5532C; stroke-width:3; stroke-linejoin:round; }
    .lin-o { fill:none; stroke:#C9A961; stroke-width:3; stroke-linejoin:round; }
    .lin-v { fill:none; stroke:#2D5A5C; stroke-width:3; stroke-linejoin:round; }
    .stop { stroke:#B5532C; stroke-width:3; fill:none; stroke-linecap:round; }
    .stopl { fill:#B5532C; font-weight:700; }
        @keyframes scopri{0.00%{transform:scaleX(0)}86.00%{transform:scaleX(1)}100.00%{transform:scaleX(1)}}
    @keyframes totale{0.00%{opacity:0}86.00%{opacity:0}92.00%{opacity:1}100.00%{opacity:1}}
    @media (prefers-reduced-motion:reduce) { .rit, .tot { animation:none !important; } }
  </style>
