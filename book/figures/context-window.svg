<svg viewBox="0 0 760 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Budget di token di una context window: barra ripartita tra system prompt, tool, cronologia, documenti e risposta">
  <rect x="0" y="0" width="760" height="400" fill="#F8F5EE"/>
  <text x="380" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="bold">Context window da 128.000 token: chi occupa cosa</text>
  <rect x="60" y="60" width="640" height="64" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="60" y="60" width="32" height="64" fill="#1A1A1A"/>
  <rect x="92" y="60" width="48" height="64" fill="#C9A961"/>
  <rect x="140" y="60" width="176" height="64" fill="#2D5A5C"/>
  <rect x="316" y="60" width="288" height="64" fill="#B5532C"/>
  <rect x="604" y="60" width="96" height="64" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="76" y1="124" x2="76" y2="160" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="76" y="180" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">System prompt</text>
  <text x="76" y="197" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">~6.000 tok</text>
  <line x1="116" y1="124" x2="116" y2="220" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="116" y="240" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">Definizioni tool</text>
  <text x="116" y="257" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">~10.000 tok</text>
  <line x1="228" y1="124" x2="228" y2="280" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="228" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">Cronologia conversazione</text>
  <text x="228" y="317" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">~35.000 tok (e cresce a ogni turno)</text>
  <line x1="460" y1="124" x2="460" y2="160" stroke="#B5532C" stroke-width="1.5"/>
  <text x="460" y="180" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C" text-anchor="start" font-weight="bold">Documenti allegati</text>
  <text x="460" y="197" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B5532C" text-anchor="start">~58.000 tok</text>
  <line x1="652" y1="124" x2="652" y2="220" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="652" y="240" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="end">Spazio per la risposta</text>
  <text x="652" y="257" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="end">~19.000 tok residui</text>
  <text x="60" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">Valori indicativi per un assistente con tool in una sessione di lavoro reale.</text>
  <text x="60" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">La quota utente (documenti + domande) è solo una parte del totale dichiarato.</text>
</svg>
