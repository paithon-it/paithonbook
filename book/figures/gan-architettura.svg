<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-label="Schema dell'architettura di una GAN: un vettore di rumore z entra nel generatore G che produce un dato sintetico; il dato sintetico e i dati reali entrano nel discriminatore D che restituisce una probabilita reale o falso; i gradienti dell'errore tornano indietro dal discriminatore al generatore">
  <defs>
    <marker id="gan-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="gan-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B847C"/>
    </marker>
  </defs>

  <!-- rumore z -->
  <rect x="20" y="78" width="122" height="58" rx="8" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="81" y="102" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="22" font-style="italic" fill="#1A1A1A">z</text>
  <text x="81" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5E5852">rumore</text>

  <!-- Generatore G -->
  <rect x="182" y="70" width="134" height="74" rx="10" fill="#B5532C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="249" y="104" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="700" fill="#F8F5EE">G</text>
  <text x="249" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#F8F5EE">generatore</text>

  <!-- dato sintetico -->
  <rect x="356" y="74" width="156" height="66" rx="8" fill="#F8F5EE" stroke="#B5532C" stroke-width="2.5"/>
  <text x="434" y="101" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" font-style="italic" fill="#1A1A1A">x&#771; = G(z)</text>
  <text x="434" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5E5852">dato sintetico</text>

  <!-- dati reali -->
  <rect x="356" y="250" width="156" height="66" rx="8" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="2"/>
  <text x="434" y="278" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" font-style="italic" fill="#F8F5EE">x</text>
  <text x="434" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#F8F5EE">dati reali</text>

  <!-- Discriminatore D -->
  <rect x="556" y="150" width="120" height="96" rx="10" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="616" y="192" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="700" fill="#1A1A1A">D</text>
  <text x="616" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1A1A1A">discriminatore</text>

  <!-- output -->
  <text x="700" y="188" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1A1A1A">D(x)</text>
  <text x="700" y="206" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5E5852">reale?</text>

  <!-- frecce percorso in avanti -->
  <line x1="142" y1="107" x2="176" y2="107" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#gan-arrow)"/>
  <line x1="316" y1="107" x2="350" y2="107" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#gan-arrow)"/>
  <path d="M512,110 C540,120 540,168 550,178" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#gan-arrow)"/>
  <path d="M512,280 C540,270 540,222 550,212" fill="none" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#gan-arrow)"/>
  <line x1="676" y1="198" x2="694" y2="198" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#gan-arrow)"/>

  <!-- retroazione gradienti (tratteggiata) -->
  <path d="M600,246 C600,352 249,360 249,150" fill="none" stroke="#8B847C" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gan-arrow-muted)"/>
  <text x="420" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8B847C">gradienti dell'errore (retropropagazione)</text>
</svg>