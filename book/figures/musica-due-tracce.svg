<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="Due righe di token per otto frame, voce in teal e accompagnamento in terracotta, divise in due sezioni da quattro frame. Ogni sezione ha sopra la sua intestazione in ocra, con l'etichetta e il testo, e una freccia indica che il testo dista al più una sezione dal proprio audio. In ogni frame una freccia va dal token della voce a quello dell'accompagnamento dello stesso frame. Sotto, la fila sola che il modello prevede: l'intestazione della prima sezione, i suoi otto token alternati, voce poi accompagnamento di ogni frame, poi l'intestazione della seconda sezione e i suoi otto token.">
