<?xml version="1.0" encoding="UTF-8"?>
<!--
  paithon book - figura: decomposizione di una serie temporale in quattro
  pannelli impilati che condividono l'asse del tempo.
  Dall'alto: serie osservata (terracotta), trend (teal), stagionalita (ocra),
  residuo (barrette warm-black attorno allo zero).
  Palette-locked: terracotta #B5532C, teal #2D5A5C, ocra #C9A961,
  warm-black #1A1A1A. Fondo trasparente (light e dark).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="100%" role="img"
     aria-label="Quattro pannelli impilati che condividono l'asse del tempo. Dall'alto: la serie osservata con tendenza e oscillazione; il trend, una linea liscia crescente; la stagionalita, un'onda periodica regolare; il residuo, piccole barrette attorno allo zero.">
  <style>
    .frame { fill:none; stroke:#8B847C; stroke-width:1; opacity:0.55; }
    .base  { stroke:#8B847C; stroke-width:1; opacity:0.6; }
    .obs   { fill:none; stroke:#B5532C; stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round; }
    .trend { fill:none; stroke:#2D5A5C; stroke-width:2.6; stroke-linejoin:round; stroke-linecap:round; }
    .seas  { fill:none; stroke:#C9A961; stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round; }
    .stem  { stroke:#1A1A1A; stroke-width:2; stroke-linecap:round; }
    .lbl   { font-family:Inter, system-ui, sans-serif; font-size:15px; font-weight:600; fill:#1A1A1A; text-anchor:end; }
    .op    { font-family:Fraunces, Georgia, serif; font-size:20px; fill:#8B847C; text-anchor:middle; }
    .cap   { font-family:Inter, system-ui, sans-serif; font-size:12px; fill:#5E5852; }
  </style>

  <!-- riquadri dei pannelli -->
  <rect class="frame" x="120" y="30"  width="586" height="124"/>
  <rect class="frame" x="120" y="164" width="586" height="124"/>
  <rect class="frame" x="120" y="298" width="586" height="124"/>
  <rect class="frame" x="120" y="435" width="586" height="96"/>

  <!-- etichette dei pannelli -->
  <text class="lbl" x="108" y="96">Serie osservata</text>
  <text class="lbl" x="108" y="230">Trend</text>
  <text class="lbl" x="108" y="364">Stagionalità</text>
  <text class="lbl" x="108" y="487">Residuo</text>

  <!-- operatori di scomposizione additiva: osservata = trend + stagionale + residuo -->
  <text class="op" x="413" y="162">=</text>
  <text class="op" x="413" y="296">+</text>
  <text class="op" x="413" y="432">+</text>

  <!-- 1. serie osservata (terracotta) -->
