<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 658" role="img" aria-label="La frase «ho visto / un uomo / con il binocolo / nel parco», spezzata in quattro riquadri, ripetuta su sei righe. Sopra ogni riga, delle graffe disegnate a scaletta segnano le scatole. Le prime cinque righe sono le cinque analisi lecite: nelle prime tre «con il binocolo» sta in una scatola insieme a «un uomo», cioè il binocolo è dell'uomo; nelle ultime due sta in una scatola che parte da «ho visto», cioè il binocolo è di chi guarda. In tutte e cinque le graffe o si contengono o restano separate. L'ultima riga, segnata con una croce, ha due graffe tratteggiate che si tagliano a vicenda: è la combinazione che le scatole non permettono.">
  <text x="440.0" y="34" text-anchor="middle" font-family="'Inter', -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">«Ho visto un uomo con il binocolo nel parco»: i cinque modi di inscatolare le stesse parole</text>
  <text x="440.0" y="56" text-anchor="middle" font-family="'Inter', -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#2D5A5C">Ogni parentesi graffa è una scatola. Due scatole o stanno una dentro l'altra, o sono separate.</text>
