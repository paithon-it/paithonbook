<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagramma ad albero: 10.000 persone si dividono in malate e sane, poi in positivi veri, falsi positivi e negativi">
  <rect x="0" y="0" width="760" height="420" fill="#F8F5EE"/>
  <!-- root -->
  <rect x="290" y="24" width="180" height="52" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="2"/>
  <text x="380" y="46" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">10.000 persone</text>
  <text x="380" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1A1A1A">popolazione screening</text>
  <!-- branches level 1 -->
  <line x1="340" y1="76" x2="185" y2="150" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="420" y1="76" x2="575" y2="150" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="230" y="112" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5E5852">1 su 1.000</text>
  <text x="530" y="112" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5E5852">999 su 1.000</text>
  <rect x="95" y="150" width="180" height="52" rx="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="185" y="172" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">10 malate</text>
  <text x="185" y="192" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F8F5EE">prevalenza 0,1%</text>
  <rect x="485" y="150" width="180" height="52" rx="6" fill="#2D5A5C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="575" y="172" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#F8F5EE">9.990 sane</text>
  <text x="575" y="192" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F8F5EE">99,9%</text>
  <!-- branches level 2 -->
  <line x1="185" y1="202" x2="120" y2="276" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="185" y1="202" x2="285" y2="276" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="530" y1="202" x2="450" y2="276" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="620" y1="202" x2="655" y2="276" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="120" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">99%</text>
  <text x="262" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">1%</text>
  <text x="465" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">5%</text>
  <text x="662" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">95%</text>
  <rect x="40" y="276" width="160" height="52" rx="6" fill="#B5532C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="120" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F8F5EE">≈ 10 positivi veri</text>
  <text x="120" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F8F5EE">malati e rilevati</text>
  <rect x="220" y="276" width="130" height="52" rx="6" fill="#F8F5EE" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="285" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1A1A1A">≈ 0 negativi</text>
  <text x="285" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5E5852">falsi negativi</text>
  <rect x="370" y="276" width="160" height="52" rx="6" fill="#C9A961" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">≈ 500 falsi positivi</text>
  <text x="450" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1A1A1A">sani ma positivi</text>
  <rect x="550" y="276" width="180" height="52" rx="6" fill="#F8F5EE" stroke="#2D5A5C" stroke-width="2"/>
  <text x="640" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2D5A5C">≈ 9.490 negativi</text>
  <text x="640" y="318" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#2D5A5C">sani e riconosciuti</text>
  <!-- conclusion strip -->
  <rect x="40" y="356" width="690" height="44" rx="6" fill="#1A1A1A"/>
  <text x="385" y="383" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#F8F5EE">Positivi totali ≈ 510 → davvero malati: 10 su 510 ≈ 2%</text>
</svg>
