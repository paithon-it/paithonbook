<!--
  Paithon Book, figura animata: un lavoro come grafo: i passi, il guasto, la ripresa, la firma
  Generata da animazioni/svg/harness-grafo.py: non modificare a mano.
  Palette-locked, fondo trasparente, animazione in CSS puro (nessuno script).
  Lo stato di riposo è quello finale: chi non anima (stampa, PDF,
  prefers-reduced-motion) vede la figura conclusa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345"
     role="img" aria-label="Un grafo di quattro nodi in fila, pianifica, costruisci, collauda e rilascia, con un arco che dal collaudo torna alla costruzione, al massimo 3 tentativi, e una firma sull'arco che porta al rilascio, segnato come irreversibile. Un gettone percorre il grafo: pianifica, costruisci, poi al collaudo si spegne (una croce resta sul nodo); riparte dal collaudo, che fallisce, torna alla costruzione, il secondo collaudo passa, si ferma alla firma e infine arriva al rilascio. Sotto, una fila di 8 caselle riporta i passi nell'ordine: 6 passi salvati, il guasto e la firma.">
  <style>
    svg  { --d: 12.0s; }
    .ax  { stroke:#C5BEAA; stroke-width:2; fill:none; }
    .axc { stroke:#E2DCC9; stroke-width:1.5; }
    .lbl { font-family:Inter, system-ui, sans-serif; font-size:15px; fill:#1A1A1A; }
    .lbs { font-family:Inter, system-ui, sans-serif; font-size:13px; fill:#5A524A; }
    .ttl { font-family:Fraunces, Georgia, serif; font-size:16px; font-style:italic; fill:#1A1A1A; }
    .tok  { fill:#B5532C; transform-box:view-box; }
    .nodo { fill:none; stroke:#2D5A5C; stroke-width:2; }
    .irr  { stroke:#B5532C; stroke-dasharray:5 3; }
    .arco { fill:none; stroke:#C5BEAA; stroke-width:2; }
    .punta { fill:#C5BEAA; }
    .firma { stroke:#C9A961; stroke-width:4; stroke-linecap:round; }
    .croce { stroke:#B5532C; stroke-width:3; stroke-linecap:round; }
    .casella { fill:none; stroke:#2D5A5C; stroke-width:1.5; }
    .rotta { stroke:#B5532C; stroke-dasharray:4 3; }
    .attesa { stroke:#C9A961; }
    .nota { font-size:11px; }
