<svg viewBox="0 0 680 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema di LoRA: l'ingresso x attraversa in parallelo il peso congelato W e la coppia di matrici a basso rango A e B; la matrice A riduce a rango r, la matrice B riporta alla dimensione piena, e le due uscite si sommano nell'output h">
  <rect x="0" y="0" width="680" height="360" fill="#F8F5EE"/>
  <!-- input x -->
  <rect x="24" y="150" width="60" height="60" rx="8" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="54" y="186" font-family="sans-serif" font-size="18" fill="#1A1A1A" text-anchor="middle" font-style="italic">x</text>
  <!-- split lines -->
  <line x1="84" y1="180" x2="120" y2="180" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="120" y2="90" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="120" y2="285" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- top path: frozen W -->
  <line x1="120" y1="90" x2="230" y2="90" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M230 90 l-10 -5 v10 z" fill="#1A1A1A"/>
  <rect x="232" y="45" width="150" height="90" rx="8" fill="#C9A961" stroke="#1A1A1A" stroke-width="2"/>
  <text x="307" y="82" font-family="sans-serif" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="bold">W</text>
  <text x="307" y="104" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">peso congelato</text>
  <text x="307" y="122" font-family="sans-serif" font-size="13" fill="#2D5A5C" text-anchor="middle">&#10052; d &#215; d</text>
  <!-- bottom path: A then B -->
  <line x1="120" y1="285" x2="170" y2="285" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M170 285 l-10 -5 v10 z" fill="#1A1A1A"/>
  <rect x="172" y="252" width="90" height="66" rx="8" fill="none" stroke="#B5532C" stroke-width="2"/>
  <text x="217" y="282" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" font-style="italic">A</text>
  <text x="217" y="302" font-family="sans-serif" font-size="11" fill="#B5532C" text-anchor="middle">r &#215; d</text>
  <!-- bottleneck r -->
  <line x1="262" y1="285" x2="300" y2="285" stroke="#B5532C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="281" y="276" font-family="sans-serif" font-size="12" fill="#B5532C" text-anchor="middle">rango r</text>
  <rect x="300" y="252" width="90" height="66" rx="8" fill="none" stroke="#B5532C" stroke-width="2"/>
  <text x="345" y="282" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" font-style="italic">B</text>
  <text x="345" y="302" font-family="sans-serif" font-size="11" fill="#B5532C" text-anchor="middle">d &#215; r</text>
  <!-- converge to sum -->
  <line x1="382" y1="90" x2="470" y2="90" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="470" y1="90" x2="470" y2="168" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="390" y1="285" x2="470" y2="285" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="470" y1="285" x2="470" y2="192" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="470" cy="180" r="22" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="470" y="187" font-family="sans-serif" font-size="22" fill="#1A1A1A" text-anchor="middle">+</text>
  <!-- output h -->
  <line x1="492" y1="180" x2="560" y2="180" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M560 180 l-10 -5 v10 z" fill="#1A1A1A"/>
  <rect x="562" y="150" width="90" height="60" rx="8" fill="none" stroke="#2D5A5C" stroke-width="2"/>
  <text x="607" y="178" font-family="sans-serif" font-size="17" fill="#1A1A1A" text-anchor="middle" font-style="italic">h</text>
  <text x="607" y="197" font-family="sans-serif" font-size="10" fill="#2D5A5C" text-anchor="middle">Wx + BAx</text>
</svg>
