# Le postille di questa pagina, una per capoverso del testo comune.
# Ognuna vale finché la sua impronta combacia col testo del capoverso.
- inizio: "Entro 0,1 secondi la risposta sembra"
  impronta: "130bb6263538"
  postilla: "Le tre soglie di Nielsen, da Miller 1968, misurano una persona, non un computer"
- inizio: "C'è però un presupposto nascosto, e"
  impronta: "ab47a8547840"
  postilla: "Risposta come evento, latenza come un numero: per un classificatore regge ancora"
- inizio: "Un modello che genera testo, invece,"
  impronta: "8bb535070575"
  postilla: "Prima di ottimizzare le tecniche di LLMOps va deciso che cosa conta come veloce"
- inizio: "Le due misure di base seguono"
  impronta: "f2724b44a334"
  postilla: "TTFT, attesa del primo token, da prefill e fila; TPOT, fra due token, dal decode"
- inizio: "Che le due misure non siano"
  impronta: "d05439851f83"
  postilla: "Stessa attesa totale, due sistemi diversi: un numero solo non li distingue"
- inizio: "Il secondo, per giunta, offre una"
  impronta: "f1ffc6c09541"
  postilla: "Oltre il ritmo di lettura, più token al secondo non si vedono"
- inizio: "Il TTFT, invece, si sente sempre,"
  impronta: "e990f1f16ace"
  postilla: "Primo criterio: oltre una soglia il TPOT non si percepisce più, il TTFT sempre"
- inizio: "Il criterio vale per un testo"
  impronta: "34d1a564df7f"
  postilla: "Se la risposta serve intera, conta la durata totale e il TPOT pesa per intero"
- inizio: "Con queste misure in mano si"
  impronta: "6c6e4ad59cb6"
  postilla: "Il throughput non chiede come si serve: di qui il goodput, preso dalle reti"
- inizio: "La prima serve batch da 16"
  impronta: "4ba0e7396ff3"
  postilla: "Batch da 64: il throughput sale, il goodput scende, e ha ragione il goodput"
- inizio: "Sono due configurazioni simulate, non due"
  impronta: "6358e5d63131"
  postilla: "Simulazione: che possano divergere, non quanto; e il batch rallenta tutti uguale"
- inizio: "Il divario di {numref}`fig-costo-per-caso-uso` riguarda i"
  impronta: "253e4defa98f"
  postilla: "La forma della richiesta decide i token, e ognuno costa denaro, memoria e tempo"
- inizio: "Abbiamo già incontrato i percentili in"
  impronta: "194f104d982a"
  postilla: "Coda della distribuzione e fila d'attesa: due cose da non confondere"
- inizio: "La prima: i percentili vanno riportati"
  impronta: "95f1744d9fb0"
  postilla: "Code di TTFT e TPOT, cause diverse: un numero solo non dice dove mettere le mani"
- inizio: "La seconda: quando una risposta è"
  impronta: "e2b2c1382cf0"
  postilla: "Venti chiamate indipendenti, ognuna lenta all'1%: almeno una nel 18%, o più"
- inizio: "Il calcolo si può anche rovesciare,"
  impronta: "b6d207d10970"
  postilla: "Per venti chiamate parallele soglia sulla p99,95; la copertura costa circa il 5%"
- inizio: "Nel caso opposto l'effetto si rovescia,"
  impronta: "23a9dda0834c"
  postilla: "Chiamate in sequenza: la sfortuna si diluisce, sfonda la promessa il totale"
- inizio: "La terza si vede sulle due"
  impronta: "be1da20e2913"
  postilla: "Batch da 64: TTFT medio nella promessa, ma una su tre sfora il mezzo secondo"
- inizio: "In produzione si presenta anche il"
  impronta: "0690b3b8e2c5"
  postilla: "Media meglio, p95 o p99 peggio: si tratta come un guasto del rispondere in tempo"
- inizio: "Il riuso ha però un rischio"
  impronta: "a80886dd30a5"
  postilla: "Cache condivisa: tempo e ordine delle risposte rivelano i testi altrui"
- inizio: "Anche la correttezza chiede una condizione."
  impronta: "f40a8c8c1c51"
  postilla: "Cache riusata corretta solo se coincidono modello, eventuali LoRA e precisione"
- inizio: "Riusare il prefisso e riempire il"
  impronta: "e23a3107bc9f"
  postilla: "Memoria finita in due momenti, stessa domanda: conservare o ricalcolare"
- inizio: "I numeri delle due configurazioni vengono"
  impronta: "13035662399b"
  postilla: "Tempi lognormali: scelta comune; le latenze vere hanno spesso code più pesanti"
- inizio: "La tabella riporta le due configurazioni"
  impronta: "66f57eb18aed"
  postilla: "Chi sfora il primo token è una parte di chi manca almeno una delle due promesse"
- inizio: "Le stesse venti righe, girate su"
  impronta: "34782c2848a8"
  postilla: "Scheletro di cruscotto: la p99 vuole finestre con migliaia di richieste"
- inizio: "Queste metriche sono la definizione operativa"
  impronta: "f2a558f985cb"
  postilla: "Calibrato sul throughput serve molti male, sul TTFT medio nasconde la coda lenta"
