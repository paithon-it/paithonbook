# Gli istanti a cui si fermano le animazioni, quando i default non bastano.
#
# I default sono 10%, 50% e 90% del ciclo (vedi `fermi.py`, che spiega perche'
# non 0 e 100). Vanno bene quasi sempre; dove no, si scrive qui.
#
# **Si scrive dopo aver guardato il provino**, non prima:
#
#     python3 animazioni/fermi.py --provino
#
# La forma e' questa:
#
#     [nome-animazione]          # il nome del file, senza estensione
#     istanti = [0.05, 0.45, 0.95]
#     # perche': una riga che dica cosa non andava con i default

[vetrina-si-ordina]
istanti = [0.142, 0.392, 0.90]
# perche': al 10% il primo confronto e' a meta' scatto e il libro che sale sta
# sopra quello che scavalca, sovrapposti; al 14,2% lo scatto e' finito e si
# legge la vetrina nuova. Il secondo fermo va al confronto 4 e non a meta' del
# ciclo perche' e' quello che porta lo sbaglio (il negativo pescato e' un libro
# che sarebbe piaciuto), cioe' la cosa che in stampa non si vedrebbe piu'.

[gan-inseguimento]
istanti = [0.03, 0.45, 0.88]
# perche': le sette pose durano un settimo di ciclo ciascuna e fra l'una e
# l'altra c'e' una dissolvenza in cui non si vede nessuna delle due. Il 10%
# cade proprio li': il primo fermo mostrava la sola campana dei dati veri,
# senza generatore e senza verdetto, cioe' tutto tranne l'inseguimento che la
# clip racconta. I tre istanti nuovi cadono dentro la sosta della prima, della
# quarta e dell'ultima posa.

[broadcasting-si-stende]
istanti = [0.25, 0.50, 0.90]
# perche': al 10% la copia della riga e' ancora sopra la riga vera, quindi il
# fermo immagine mostra una griglia vuota mentre la didascalia dice che la riga
# si sta stendendo. Al 25% la copia e' scesa di una riga e la prima ha gia' le
# sue letture: si vede il movimento, che e' il motivo per cui la clip esiste.

[spartito-in-fila]
istanti = [0.10, 0.50, 0.97]
# perche': il ciclo ha diciassette soste (le posizioni del cursore, da 0 a 16)
# e l'ultima comincia al 94,1%. Al 90% la battuta non e' ancora finita: manca
# la terza riga di eventi, i contatori dicono 30 e 5, e in stampa il libro non
# avrebbe mai mostrato la figura completa, che e' proprio quella che porta i
# due numeri di cui parla il testo. Il terzo fermo va quindi dentro l'ultima
# sosta, dove la fila a griglia e' arrivata a 32 e quella a eventi a 8.
