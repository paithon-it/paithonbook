# Gli istanti a cui si fermano le animazioni, quando i default non bastano.
#
# I default sono 10%, 50% e 90% del ciclo (vedi `fermi.py`, che spiega perche'
# non 0 e 100). Vanno bene quasi sempre; dove no, si scrive qui.
#
# **Si scrive dopo aver guardato il provino**, non prima:
#
#     python3 animazioni/fermi.py --provino
#
# La forma e' questa:
#
#     [nome-animazione]          # il nome del file, senza estensione
#     istanti = [0.05, 0.45, 0.95]
#     # perche': una riga che dica cosa non andava con i default

[posto-che-si-libera]
istanti = [0.208, 0.292, 0.958]
# perche': due ragioni, e la prima e' una trappola generale. Le dodici
# iterazioni dividono il ciclo in fette da 8,33%, quindi il 50% dei default
# cade *esattamente* sul confine fra la sesta e la settima, e la dissolvenza le
# tiene accese tutte e due: il fermo usciva con «iterazione 6» stampata dentro
# «iterazione 7» e, nel pannello statico, «posti-iterazione usati: 20 su 24»
# dentro «22 su 28». Vale per ogni animazione il cui numero di stati divide
# cento: il confine si piazza dove il fermo lo va a prendere.
# La seconda ragione e' che cosa i tre fermi raccontano, visto che in stampa
# sono tutto quello che resta. Terza e quarta iterazione sono il prima e il
# dopo dello stesso gesto: alla terza le due sale sono ancora identiche e si
# vedono tutte e quattro le richieste di partenza (B compresa, che finisce li'
# e che con i fermi di prima non compariva in nessuno dei tre), alla quarta il
# posto di B e' fermo a sinistra ed e' gia' di E a destra. La dodicesima e' la
# sola iterazione in cui si leggono i numeri che la didascalia cita, 28 su 48
# contro 48 su 48: i fermi di prima si fermavano all'undicesima, e chi leggeva
# su carta non poteva ricontrollare nessuno dei numeri promessi.

[vetrina-si-ordina]
istanti = [0.142, 0.392, 0.90]
# perche': al 10% il primo confronto e' a meta' scatto e il libro che sale sta
# sopra quello che scavalca, sovrapposti; al 14,2% lo scatto e' finito e si
# legge la vetrina nuova. Il secondo fermo va al confronto 4 e non a meta' del
# ciclo perche' e' quello che porta lo sbaglio (il negativo pescato e' un libro
# che sarebbe piaciuto), cioe' la cosa che in stampa non si vedrebbe piu'.

[gan-inseguimento]
istanti = [0.03, 0.45, 0.88]
# perche': le sette pose durano un settimo di ciclo ciascuna e fra l'una e
# l'altra c'e' una dissolvenza in cui non si vede nessuna delle due. Il 10%
# cade proprio li': il primo fermo mostrava la sola campana dei dati veri,
# senza generatore e senza verdetto, cioe' tutto tranne l'inseguimento che la
# clip racconta. I tre istanti nuovi cadono dentro la sosta della prima, della
# quarta e dell'ultima posa.

[broadcasting-si-stende]
istanti = [0.25, 0.50, 0.96]
# perche': al 10% la copia della riga e' ancora sopra la riga vera, quindi il
# fermo immagine mostra una griglia vuota mentre la didascalia dice che la riga
# si sta stendendo. Al 25% la copia e' scesa di una riga e la prima ha gia' le
# sue letture: si vede il movimento, che e' il motivo per cui la clip esiste.
# E il terzo e' passato da 0.90 a 0.96: le celle entrano fra il 66% e il 94%,
# una dopo l'altra, quindi al 90% l'ultima in basso a destra era ancora
# tratteggiata e vuota. Il fermo mostrava undici celle mentre la didascalia ne
# prometteva dodici.

[spartito-in-fila]
istanti = [0.10, 0.50, 0.97]
# perche': il ciclo ha diciassette soste (le posizioni del cursore, da 0 a 16)
# e l'ultima comincia al 94,1%. Al 90% la battuta non e' ancora finita: manca
# la terza riga di eventi, i contatori dicono 30 e 5, e in stampa il libro non
# avrebbe mai mostrato la figura completa, che e' proprio quella che porta i
# due numeri di cui parla il testo. Il terzo fermo va quindi dentro l'ultima
# sosta, dove la fila a griglia e' arrivata a 32 e quella a eventi a 8.

[potatura-che-assottiglia]
istanti = [0.10, 0.45, 0.90]
# perche': i cartigli si avvicendano con una dissolvenza di 0,8, e un fermo che
# cada dentro una dissolvenza stampa due cartigli sovrapposti, cifra su cifra,
# in una delle tre immagini che in stampa sostituiscono la clip. Con quattordici
# cartigli il passo e' 6,15% e i tre istanti cadono su un giro pieno (lo 0, il 6
# e il 13); erano dieci, passo 8,9%, e il 50% cadeva dentro una dissolvenza.
# Chi cambia GIRI ricontrolli: il fermo di mezzo deve prendere un giro in cui la
# curva e' ancora piatta, perche' il crollo non lo deve anticipare. Al 45% il
# giro 6 ha gia' tolto nove pesi su dieci e l'accuratezza e' ancora quella di
# partenza, che e' la cosa che questa figura esiste per far vedere.

[bootstrap-si-accumula]
istanti = [0.04, 0.50, 0.90]
# perche': gli otto scatti durano un ottavo di ciclo ciascuno e sostano solo
# per il primo 55%, quindi il 10% di default cade nella transizione fra il
# primo scatto e il secondo: il contatore diceva «1 pescata» e l'istogramma
# mostrava gia' due barre, cioe' la prima immagine si contraddiceva da sola.
# Al 4% lo scatto e' fermo e la barra e' una, che e' il punto di partenza da
# cui l'accumulo si capisce. Gli altri due vanno bene come sono.

[catena-si-assesta]
istanti = [0.04, 0.32, 0.90]
# perche': le sette tappe durano un settimo di ciclo ciascuna e fra l'una e
# l'altra c'e' una dissolvenza. Al 10% e al 50% i default cadevano nelle
# dissolvenze, e i tre fermi mostravano colonne a meta' strada, cioe' non una
# tappa vera. I tre istanti nuovi cadono dentro la sosta della partenza, della
# terza tappa e dello stato a regime, che sono le tre cose da vedere in stampa.

[backpropagation]
istanti = [0.10, 0.35, 0.90]
# perche': la formula in fondo si costruisce un fattore alla volta fra il 41% e
# il 75%, quindi il 50% di default cadeva dentro la costruzione e il fermo di
# mezzo stampava «dL/dW1 = dL/dy^», che e' un'uguaglianza **falsa**: quel
# prodotto e' dL/dh, e i due fattori che mancano arrivano dopo. Nella clip si
# vede crescere e va benissimo; in stampa resta ferma li'. Al 35% il riquadro
# della loss c'e' gia' e la formula non e' ancora cominciata, cosi' i tre fermi
# danno i tre stati che la didascalia promette: l'andata, l'errore misurato, e
# il ritorno con la catena completa.

[temperature-top-p]
istanti = [0.267, 0.767, 0.933]
# perche': i default cadono male due volte. Il 50% e' l'istante esatto in cui
# comincia la quarta tappa, cioe' dentro la transizione: le etichette sono gia'
# quelle nuove e le barre ancora quelle vecchie, con due righe sparite e la
# linea del taglio rimasta dov'era. E il 10% pesca la tappa di partenza, quella
# senza taglio, quindi in stampa il confronto che la figura esiste per fare
# (stessa soglia, taglio in un altro punto) non si vedeva in nessuno dei tre.
# I tre istanti nuovi cadono dentro la sosta della seconda, della quinta e della
# sesta tappa: il taglio dopo la terza riga a temperatura 1, lo stesso taglio
# dopo la quarta a temperatura 2, e la massa ridistribuita.

[linee-di-base]
istanti = [0.30, 0.70, 0.95]
# perche': le tappe sono cinque, e ai default il secondo fermo (50%) pesca il
# naive, cioe' una riga piatta, e il terzo (90%) le quattro linee insieme. Il
# fermo che manca e' quello del naive stagionale, l'unica tappa che porta
# l'arco fra il marzo osservato e il marzo previsto, cioe' il conto con k che
# il testo svolge in formula. Adesso i tre sono: la serie con la prima linea di
# base, il naive stagionale con il suo arco, e le quattro insieme.

[voto-che-retrocede]
istanti = [0.18, 0.50, 0.90]
# perche': le sette istantanee durano un settimo di ciclo ciascuna, e il 10%
# cade nella dissolvenza fra la prima e la seconda: il fermo mostrava la
# griglia tutta a zero con il primo voto gia' mezzo comparso, cioe' due stati
# insieme e nessuno dei due leggibile. Al 18% la sosta della seconda e'
# cominciata e si legge la sola cosa che conta li', il 0,50 della casella
# accanto alla meta. Gli altri due default cadevano gia' dentro una sosta.

[nastro-si-riavvolge]
istanti = [0.17, 0.53, 0.92]
# perche': gli otto stati durano un ottavo di ciclo ciascuno e sostano per il
# primo 60%, quindi il 10% di default cade nella transizione fra il grafo
# vuoto e l'andata: il fermo portava la didascalia «il conto, prima di farlo»
# sopra i valori dell'andata gia' comparsi, cioe' si smentiva da solo. Al 17%
# la prima sosta e' finita, al 53% si e' dentro quella del ritorno che rilegge
# gli appunti, e al 92% dentro l'ultima, dove x.grad porta la somma dei due
# rami.

[somma-pesata-passaggi]
istanti = [0.45, 0.70, 0.96]
# perche': la scena ha quattro fette (i pesi, le tre bozze, la somma, la
# tenuta) e i default cadono tutti e tre nelle attese. Al 10% non c'e' ancora
# niente, e al 50% le bozze partono proprio in quell'istante, quindi il fermo
# di mezzo mostrava tre riquadri vuoti accanto a una somma che non c'e'. I tre
# istanti nuovi cadono uno per stato: i pesi arrivati e le bozze ancora da
# scrivere, le tre bozze scritte, la somma composta.
